<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{if(localStorage.getItem('motrix_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../static/favicon.png">
  <title>網路架構選型導覽 — MOTRIX 專案管理系統</title>
  <script src="../static/auth-guard.js"></script>
  <script defer src="../static/vendor/alpine-3.17.1.min.js"></script>
  <link rel="stylesheet" href="../css/style.css?v=20260805g">
  <style>
    [x-cloak]{display:none!important}
    .page-main{margin-left:var(--sidebar-w);margin-top:var(--topbar-h);padding:0;min-height:calc(100vh - var(--topbar-h));overflow:hidden;background:var(--white)}
    .ng-toolbar{height:48px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--border-light);background:#fff}
    .ng-toolbar .ttl{font-size:14px;font-weight:700;color:var(--text-primary)}
    .ng-toolbar .sub{font-size:11px;color:var(--text-dim)}
    .ng-body{height:calc(100vh - var(--topbar-h) - 48px);overflow:auto;padding:20px 24px}

    /* 族系選擇方塊 */
    .fam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:24px}
    .fam-tile{border:1px solid var(--border-light);border-radius:var(--radius-lg);background:#fff;padding:16px 18px;cursor:pointer;transition:all .15s;text-align:left}
    .fam-tile:hover{border-color:var(--accent);box-shadow:var(--shadow-sm)}
    .fam-tile.active{border-color:var(--accent);background:var(--accent-light)}
    .gen-card-highlight{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light),var(--shadow-sm);animation:catFlash 1.6s ease-in-out 1}
    @keyframes catFlash{0%{background:var(--accent-light)}100%{background:#fff}}
    .prod-item-highlight{background:var(--accent-light);border-radius:var(--radius);margin:0 -6px;padding:2px 6px}

    /* 全域搜尋（型號／品牌，跨族系直接篩出符合結果） */
    .gsearch-box{position:relative}
    .gsearch-box input{width:230px;box-sizing:border-box;padding:6px 26px 6px 10px;font-size:12.5px;font-family:inherit;border:1px solid var(--border-light);border-radius:var(--radius);outline:none;background:#fff;color:var(--text-primary)}
    .gsearch-box input:focus{border-color:var(--accent)}
    .gsearch-clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--text-dim);cursor:pointer;font-size:13px;line-height:1;padding:2px}
    .gsearch-clr:hover{color:var(--danger)}
    .fam-tile .fname{font-size:15px;font-weight:700;color:var(--text-primary);margin-bottom:4px}
    .fam-tile .fdesc{font-size:12px;color:var(--text-secondary);line-height:1.5}
    .fam-tile .fcount{font-size:11px;color:var(--text-dim);margin-top:8px}

    /* 世代時間軸卡片 */
    .gen-row{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px}
    .gen-card{flex:0 0 340px;border:1px solid var(--border-light);border-radius:var(--radius-lg);background:#fff;box-shadow:var(--shadow-sm);overflow:hidden;display:flex;flex-direction:column}
    .gen-card .gh{padding:14px 16px;border-bottom:1px solid var(--border-light);background:#FAFAF8}
    .gen-card .gh .gname{font-size:15px;font-weight:700;color:var(--text-primary)}
    .gen-card .gh .gtags{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap}
    .tag-pill{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--accent-light);color:var(--accent)}
    .gen-card .gb{padding:14px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
    .gen-field .gl{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-dim);font-weight:700;margin-bottom:3px}
    .gen-field .gv{font-size:12.5px;color:var(--text-primary);line-height:1.5}
    .gen-field.warn .gv{color:var(--warning);background:var(--warning-light);padding:6px 8px;border-radius:var(--radius);font-size:12px}
    .gen-field.dep .gv{color:var(--accent);background:var(--accent-light);padding:6px 8px;border-radius:var(--radius);font-size:12px}
    .gen-price{font-size:13px;font-weight:700;color:var(--success);font-family:var(--font-en)}
    .gen-products{border-top:1px dashed var(--border-light);padding-top:10px;margin-top:2px}
    .prod-item{display:flex;align-items:baseline;gap:6px;padding:5px 0;font-size:12px;border-bottom:1px solid #F5F4F0}
    .prod-item:last-child{border-bottom:none}
    .prod-item b{color:var(--text-primary);white-space:nowrap}
    .prod-item a{color:var(--accent);text-decoration:none;font-size:11px}
    .prod-item a:hover{text-decoration:underline}
    .prod-item .pnote{color:var(--text-dim);font-size:11px;margin-left:auto;white-space:nowrap}
    .empty-hint{text-align:center;color:var(--text-dim);font-size:13px;padding:60px 0}

    /* 管理模式 */
    .mpanel{border:1px solid var(--border-light);border-radius:var(--radius-lg);background:#fff;margin-bottom:18px;overflow:hidden;box-shadow:var(--shadow-sm)}
    .mpanel .mhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border-light);background:#FAFAF8}
    .mpanel .mhead b{font-size:13px;color:var(--text-primary)}
    .mpanel .mhead .n{font-size:11px;color:var(--text-dim);font-family:var(--font-en)}
    .mtwrap{overflow-x:auto}
    table.mtable{width:100%;border-collapse:collapse;font-size:12px}
    table.mtable th{text-align:left;padding:8px 12px;color:var(--text-dim);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--border-light);background:#fff;white-space:nowrap}
    table.mtable td{padding:8px 12px;border-bottom:1px solid #F0EEE9;vertical-align:top}
    table.mtable tr:hover td{background:#FAFAF8}
    table.mtable td.empty-row{text-align:center;color:var(--text-dim);padding:16px}

    /* Modal（沿用 MOTRIX 標準樣式） */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center}
    .modal-box{background:#fff;border:1px solid var(--border-light);color:var(--text-primary);border-radius:var(--radius-lg);padding:22px 26px;width:560px;max-width:95vw;max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg)}
    .modal-title{font-size:15px;font-weight:700;margin-bottom:16px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .field-row{margin-bottom:0}
    .field-label{font-size:11px;color:var(--text-secondary);margin-bottom:4px;font-weight:600}
    .field-input{width:100%;padding:7px 10px;border:1px solid var(--border-light);border-radius:var(--radius);font-size:13px;font-family:inherit;outline:none;box-sizing:border-box;background:#fff;color:var(--text-primary)}
    .field-input:focus{border-color:var(--accent)}
    textarea.field-input{resize:vertical;min-height:2.4em}
    .modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  </style>
</head>
<body x-data="app()" x-init="init()" x-cloak>

  <header id="app-topbar" class="topbar"></header>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar"></aside>

    <main class="page-main">

      <div class="ng-toolbar">
        <span class="ttl">網路架構選型導覽</span>
        <span class="sub">技術族系 · 世代對照 · 產品連結</span>
        <div style="margin-left:auto;display:flex;align-items:center;gap:10px">
          <div class="gsearch-box">
            <input type="text" placeholder="搜尋型號／品牌，如「U6-Pro」「Omada」" x-model="globalSearch">
            <button class="gsearch-clr" x-show="globalSearch" @click="globalSearch=''">✕</button>
          </div>
          <button class="mibtn" :class="mode==='browse' ? 'pri' : ''" @click="mode='browse'">瀏覽</button>
          <button class="mibtn" :class="mode==='manage' ? 'pri' : ''" x-show="canEdit" @click="mode='manage'">管理</button>
        </div>
      </div>

      <!-- ══════ 瀏覽模式 ══════ -->
      <div class="ng-body" x-show="mode==='browse'">
        <div class="fam-grid">
          <template x-for="f in families" :key="f.code">
            <button class="fam-tile" :class="activeFamily===f.code ? 'active' : ''" @click="activeFamily=f.code">
              <div class="fname" x-text="f.name"></div>
              <div class="fdesc" x-text="f.description"></div>
              <div class="fcount" x-text="genCountByFamily(f.code) + ' 個世代'"></div>
            </button>
          </template>
        </div>

        <template x-if="!activeFamily && !globalSearch.trim()">
          <div class="empty-hint">請點選上方一個技術族系，查看世代對照</div>
        </template>

        <template x-if="globalSearch.trim() && visibleGenerations().length===0">
          <div class="empty-hint">查無符合「<span x-text="globalSearch"></span>」的型號／品牌</div>
        </template>

        <template x-if="activeFamily || globalSearch.trim()">
          <div class="gen-row">
            <template x-for="g in visibleGenerations()" :key="g.id">
              <div class="gen-card" :id="'gen-' + g.id" :class="highlightGeneration===g.id ? 'gen-card-highlight' : ''">
                <div class="gh">
                  <div class="gname" x-text="(globalSearch.trim() ? familyLabel(g.family_code) + ' · ' : '') + g.gen_name"></div>
                  <div class="gtags">
                    <template x-for="t in tagList(g.tags)" :key="t">
                      <span class="tag-pill" x-text="t"></span>
                    </template>
                  </div>
                </div>
                <div class="gb">
                  <div class="gen-field"><div class="gl">核心規格</div><div class="gv" x-text="g.key_specs||'—'"></div></div>
                  <div class="gen-field"><div class="gl">比上一代進步</div><div class="gv" x-text="g.upgrade_note||'（基準世代）'"></div></div>
                  <div class="gen-field"><div class="gl">典型情境</div><div class="gv" x-text="g.typical_scenario||'—'"></div></div>
                  <div class="gen-field"><div class="gl">建議售價區間</div><div class="gen-price" x-text="g.price_range||'—'"></div></div>
                  <div class="gen-field dep" x-show="g.dependency_note"><div class="gl">依賴／相關</div><div class="gv" x-text="g.dependency_note"></div></div>
                  <div class="gen-field warn" x-show="g.watch_note"><div class="gl">注意事項</div><div class="gv" x-text="g.watch_note"></div></div>
                  <div class="gen-products">
                    <div class="gl" style="font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-dim);font-weight:700;margin-bottom:4px">對應產品</div>
                    <template x-for="p in productsToShowFor(g.id)" :key="p.id">
                      <div class="prod-item" :class="highlightBrand && p.brand===highlightBrand ? 'prod-item-highlight' : ''">
                        <b x-text="p.brand"></b>
                        <a :href="p.url" target="_blank" rel="noopener" x-text="p.model"></a>
                        <span class="pnote" x-text="p.price_note"></span>
                      </div>
                    </template>
                    <div x-show="productsToShowFor(g.id).length===0" style="color:var(--text-dim);font-size:11px">尚無對應產品</div>
                  </div>
                </div>
              </div>
            </template>
            <div x-show="!globalSearch.trim() && generationsFor(activeFamily).length===0" class="empty-hint" style="flex:1">此族系尚無世代資料</div>
          </div>
        </template>
      </div>

      <!-- ══════ 管理模式 ══════ -->
      <div class="ng-body" x-show="mode==='manage'" x-cloak>
        <div class="mpanel">
          <div class="mhead"><b>技術族系</b><span class="n" x-text="'('+families.length+')'"></span>
            <button class="mibtn pri" @click="openFamilyModal(null)">＋ 新增族系</button>
          </div>
          <div class="mtwrap">
          <table class="mtable">
            <thead><tr><th>代碼</th><th>名稱</th><th>說明</th><th>操作</th></tr></thead>
            <tbody>
              <template x-for="f in families" :key="f.code">
                <tr>
                  <td><span class="mono" style="font-weight:700;color:var(--accent)" x-text="f.code"></span></td>
                  <td x-text="f.name"></td>
                  <td x-text="f.description"></td>
                  <td style="white-space:nowrap">
                    <button class="mibtn" @click="openFamilyModal(f)">編輯</button>
                    <button class="mibtn danger" @click="deleteItem('family', f)">刪除</button>
                  </td>
                </tr>
              </template>
              <tr x-show="families.length===0"><td class="empty-row" colspan="4">尚無族系資料</td></tr>
            </tbody>
          </table>
          </div>
        </div>

        <div class="mpanel">
          <div class="mhead"><b>世代／規格</b><span class="n" x-text="'('+generations.length+')'"></span>
            <button class="mibtn pri" @click="openGenModal(null)">＋ 新增世代</button>
          </div>
          <div class="mtwrap">
          <table class="mtable">
            <thead><tr><th>族系</th><th>世代</th><th>核心規格</th><th>售價區間</th><th>操作</th></tr></thead>
            <tbody>
              <template x-for="g in generations" :key="g.id">
                <tr>
                  <td><span class="mono" style="font-weight:700;color:var(--accent)" x-text="g.family_code"></span></td>
                  <td x-text="g.gen_name"></td>
                  <td style="max-width:16rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="g.key_specs"></td>
                  <td x-text="g.price_range"></td>
                  <td style="white-space:nowrap">
                    <button class="mibtn" @click="openGenModal(g)">編輯</button>
                    <button class="mibtn danger" @click="deleteItem('generation', g)">刪除</button>
                  </td>
                </tr>
              </template>
              <tr x-show="generations.length===0"><td class="empty-row" colspan="5">尚無世代資料</td></tr>
            </tbody>
          </table>
          </div>
        </div>

        <div class="mpanel">
          <div class="mhead"><b>產品連結</b><span class="n" x-text="'('+products.length+')'"></span>
            <button class="mibtn pri" @click="openProductModal(null)">＋ 新增產品</button>
          </div>
          <div class="mtwrap">
          <table class="mtable">
            <thead><tr><th>所屬世代</th><th>品牌</th><th>型號</th><th>連結</th><th>售價備註</th><th>操作</th></tr></thead>
            <tbody>
              <template x-for="p in products" :key="p.id">
                <tr>
                  <td x-text="genLabel(p.generation_id)"></td>
                  <td x-text="p.brand"></td>
                  <td x-text="p.model"></td>
                  <td><a class="mono" :href="p.url" target="_blank" rel="noopener" x-text="p.url" style="color:var(--accent);font-size:11px"></a></td>
                  <td x-text="p.price_note"></td>
                  <td style="white-space:nowrap">
                    <button class="mibtn" @click="openProductModal(p)">編輯</button>
                    <button class="mibtn danger" @click="deleteItem('product', p)">刪除</button>
                  </td>
                </tr>
              </template>
              <tr x-show="products.length===0"><td class="empty-row" colspan="6">尚無產品資料</td></tr>
            </tbody>
          </table>
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- ══════ 新增／編輯 Modal ══════ -->
  <div class="modal-overlay" x-show="modal.show" @click.self="modal.show=false" x-cloak>
    <div class="modal-box" @click.stop>
      <div class="modal-title" x-text="modalTitle()"></div>

      <template x-if="modal.kind==='family'">
        <div class="form-grid">
          <div class="field-row">
            <div class="field-label">族系代碼 <span style="color:var(--danger)">*</span></div>
            <input class="field-input" type="text" placeholder="WIFI" x-model="modal.code" :disabled="!!modal.id">
          </div>
          <div class="field-row">
            <div class="field-label">名稱</div>
            <input class="field-input" type="text" placeholder="Wi-Fi 無線網路" x-model="modal.name">
          </div>
          <div class="field-row" style="grid-column:1/-1">
            <div class="field-label">說明</div>
            <textarea class="field-input" rows="2" x-model="modal.description"></textarea>
          </div>
        </div>
      </template>

      <template x-if="modal.kind==='generation'">
        <div class="form-grid">
          <div class="field-row">
            <div class="field-label">所屬族系 <span style="color:var(--danger)">*</span></div>
            <select class="field-input" x-model="modal.familyCode">
              <template x-for="f in families" :key="f.code">
                <option :value="f.code" x-text="f.code + ' － ' + f.name"></option>
              </template>
            </select>
          </div>
          <div class="field-row">
            <div class="field-label">世代名稱</div>
            <input class="field-input" type="text" placeholder="Wi-Fi 7" x-model="modal.genName">
          </div>
          <div class="field-row" style="grid-column:1/-1">
            <div class="field-label">核心規格</div>
            <textarea class="field-input" rows="2" x-model="modal.keySpecs"></textarea>
          </div>
          <div class="field-row" style="grid-column:1/-1">
            <div class="field-label">比上一代進步</div>
            <textarea class="field-input" rows="2" x-model="modal.upgradeNote"></textarea>
          </div>
          <div class="field-row" style="grid-column:1/-1">
            <div class="field-label">典型情境</div>
            <input class="field-input" type="text" x-model="modal.typicalScenario">
          </div>
          <div class="field-row">
            <div class="field-label">標籤（逗號分隔）</div>
            <input class="field-input" type="text" placeholder="高密度,企業級" x-model="modal.tags">
          </div>
          <div class="field-row">
            <div class="field-label">建議售價區間</div>
            <input class="field-input" type="text" placeholder="NT$12,000–35,000" x-model="modal.priceRange">
          </div>
          <div class="field-row" style="grid-column:1/-1">
            <div class="field-label">依賴／相關備註</div>
            <textarea class="field-input" rows="2" x-model="modal.dependencyNote"></textarea>
          </div>
          <div class="field-row" style="grid-column:1/-1">
            <div class="field-label">注意事項</div>
            <textarea class="field-input" rows="2" x-model="modal.watchNote"></textarea>
          </div>
        </div>
      </template>

      <template x-if="modal.kind==='product'">
        <div class="form-grid">
          <div class="field-row" style="grid-column:1/-1">
            <div class="field-label">所屬世代 <span style="color:var(--danger)">*</span></div>
            <select class="field-input" x-model="modal.generationId">
              <template x-for="g in generations" :key="g.id">
                <option :value="g.id" x-text="g.family_code + ' － ' + g.gen_name"></option>
              </template>
            </select>
          </div>
          <div class="field-row">
            <div class="field-label">品牌</div>
            <input class="field-input" type="text" placeholder="UniFi" x-model="modal.brand">
          </div>
          <div class="field-row">
            <div class="field-label">型號</div>
            <input class="field-input" type="text" placeholder="U7-Pro" x-model="modal.model">
          </div>
          <div class="field-row" style="grid-column:1/-1">
            <div class="field-label">連結網址</div>
            <input class="field-input" type="text" placeholder="https://…" x-model="modal.url">
          </div>
          <div class="field-row">
            <div class="field-label">標籤說明</div>
            <input class="field-input" type="text" x-model="modal.label">
          </div>
          <div class="field-row">
            <div class="field-label">售價備註</div>
            <input class="field-input" type="text" placeholder="US$189" x-model="modal.priceNote">
          </div>
        </div>
      </template>

      <div x-show="modal.error" style="color:var(--danger);font-size:12px;margin-top:8px" x-text="modal.error"></div>
      <div class="modal-footer">
        <button class="mbtn" @click="modal.show=false">取消</button>
        <button class="mbtn pri" @click="saveModal()" :disabled="modal.saving">
          <span x-text="modal.saving ? '儲存中…' : '儲存'"></span>
        </button>
      </div>
    </div>
  </div>

  <script>
  const API = '/api'
  function app() {
    return {
      session: {}, canEdit: false, mode: 'browse', activeFamily: null, highlightGeneration: null, highlightBrand: null, globalSearch: '',
      families: [], generations: [], products: [],
      modal: { show:false, kind:'family', id:null, code:'', name:'', description:'',
               familyCode:'', genName:'', keySpecs:'', upgradeNote:'', typicalScenario:'', tags:'', priceRange:'', dependencyNote:'', watchNote:'',
               generationId:'', brand:'', model:'', url:'', label:'', priceNote:'', saving:false, error:'' },

      async init() {
        const s = JSON.parse(localStorage.getItem('motrix_session') || '{}')
        if (!s.token) { location.href = 'login.html'; return }
        this.session = s
        const mods = Array.isArray(s.modules) ? s.modules : []
        this.canEdit = s.role === 'superadmin' || mods.indexOf('netarch_guide_edit') >= 0
        try {
          const r = await fetch(`${API}/auth/me`, { headers: { Authorization: 'Bearer ' + s.token } })
          if (!r.ok) { location.href = 'login.html'; return }
        } catch {}
        await this.loadAll()
        if (this.families.length) this.activeFamily = this.families[0].code
        this.applyDeepLink()
      },

      // 從「涵蓋度總覽」頁點選世代／品牌連結過來時，切到對應族系並定位到該世代卡片（選填品牌標示）
      applyDeepLink() {
        const params = new URLSearchParams(location.search)
        const genParam = params.get('generation')
        const brandParam = params.get('brand')
        if (!genParam) return
        const gen = this.generations.find(g => String(g.id) === genParam)
        if (!gen) return
        this.activeFamily = gen.family_code
        this.highlightGeneration = gen.id
        if (brandParam) this.highlightBrand = brandParam
        // topbar/sidebar 為非同步注入，會在頁面載入後才觸發一次版面重排，
        // 太早捲動會被那次重排打斷、把捲動位置沖回原點，因此延後並補一次保險捲動
        const doScroll = () => {
          const el = document.getElementById('gen-' + gen.id)
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' })
        }
        setTimeout(doScroll, 250)
        setTimeout(doScroll, 800)
        setTimeout(() => { this.highlightGeneration = null }, 2800)
      },

      async loadAll() {
        const headers = { Authorization: 'Bearer ' + this.session.token }
        try {
          const [fams, gens, prods] = await Promise.all([
            fetch(`${API}/netarch-guide/families`, { headers }).then(r => r.json()),
            fetch(`${API}/netarch-guide/generations`, { headers }).then(r => r.json()),
            fetch(`${API}/netarch-guide/products`, { headers }).then(r => r.json()),
          ])
          this.families = fams; this.generations = gens; this.products = prods
        } catch {}
      },

      genCountByFamily(code) { return this.generations.filter(g => g.family_code === code).length },
      generationsFor(code) { return this.generations.filter(g => g.family_code === code) },
      productsFor(genId) { return this.products.filter(p => p.generation_id === genId) },
      genLabel(genId) { const g = this.generations.find(x => x.id === genId); return g ? (g.family_code + ' － ' + g.gen_name) : ('#' + genId) },
      familyLabel(code) { const f = this.families.find(x => x.code === code); return f ? f.name : code },

      // ── 全域搜尋（型號／品牌，跨族系）──
      matchesSearch(p, query) {
        if (!query || !query.trim()) return true
        const q = query.trim().toLowerCase()
        return [p.brand, p.model, p.label].join(' ').toLowerCase().indexOf(q) >= 0
      },
      visibleGenerations() {
        const q = this.globalSearch.trim()
        if (!q) return this.generationsFor(this.activeFamily)
        return this.generations.filter(g => this.productsFor(g.id).some(p => this.matchesSearch(p, q)))
      },
      productsToShowFor(genId) {
        const q = this.globalSearch.trim()
        const all = this.productsFor(genId)
        return q ? all.filter(p => this.matchesSearch(p, q)) : all
      },
      tagList(tags) { return (tags || '').split(',').map(t => t.trim()).filter(Boolean) },

      modalTitle() {
        const isEdit = !!this.modal.id
        if (this.modal.kind === 'family') return isEdit ? '編輯族系' : '新增族系'
        if (this.modal.kind === 'generation') return isEdit ? '編輯世代' : '新增世代'
        return isEdit ? '編輯產品' : '新增產品'
      },

      openFamilyModal(f) {
        this.modal = { show:true, kind:'family', id: f ? f.code : null,
          code: f ? f.code : '', name: f ? f.name : '', description: f ? f.description : '', saving:false, error:'' }
      },
      openGenModal(g) {
        this.modal = { show:true, kind:'generation', id: g ? g.id : null,
          familyCode: g ? g.family_code : (this.families[0] ? this.families[0].code : ''),
          genName: g ? g.gen_name : '', keySpecs: g ? g.key_specs : '', upgradeNote: g ? g.upgrade_note : '',
          typicalScenario: g ? g.typical_scenario : '', tags: g ? g.tags : '', priceRange: g ? g.price_range : '',
          dependencyNote: g ? g.dependency_note : '', watchNote: g ? g.watch_note : '', saving:false, error:'' }
      },
      openProductModal(p) {
        this.modal = { show:true, kind:'product', id: p ? p.id : null,
          generationId: p ? p.generation_id : (this.generations[0] ? this.generations[0].id : ''),
          brand: p ? p.brand : '', model: p ? p.model : '', url: p ? p.url : '',
          label: p ? p.label : '', priceNote: p ? p.price_note : '', saving:false, error:'' }
      },

      async saveModal() {
        this.modal.error = ''
        let url, method, body
        if (this.modal.kind === 'family') {
          if (!this.modal.code.trim()) { this.modal.error = '族系代碼不得為空'; return }
          body = { code: this.modal.code, name: this.modal.name, description: this.modal.description }
          method = this.modal.id ? 'PUT' : 'POST'
          url = this.modal.id ? `${API}/netarch-guide/families/${encodeURIComponent(this.modal.id)}` : `${API}/netarch-guide/families`
        } else if (this.modal.kind === 'generation') {
          if (!this.modal.familyCode) { this.modal.error = '請選擇所屬族系'; return }
          body = { familyCode: this.modal.familyCode, genName: this.modal.genName, keySpecs: this.modal.keySpecs,
                    upgradeNote: this.modal.upgradeNote, typicalScenario: this.modal.typicalScenario, tags: this.modal.tags,
                    priceRange: this.modal.priceRange, dependencyNote: this.modal.dependencyNote, watchNote: this.modal.watchNote }
          method = this.modal.id ? 'PUT' : 'POST'
          url = this.modal.id ? `${API}/netarch-guide/generations/${this.modal.id}` : `${API}/netarch-guide/generations`
        } else {
          if (!this.modal.generationId) { this.modal.error = '請選擇所屬世代'; return }
          body = { generationId: this.modal.generationId, brand: this.modal.brand, model: this.modal.model,
                    url: this.modal.url, label: this.modal.label, priceNote: this.modal.priceNote }
          method = this.modal.id ? 'PUT' : 'POST'
          url = this.modal.id ? `${API}/netarch-guide/products/${this.modal.id}` : `${API}/netarch-guide/products`
        }
        this.modal.saving = true
        try {
          const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.session.token }, body: JSON.stringify(body) })
          if (r.ok) { await this.loadAll(); this.modal.show = false }
          else { const e = await r.json(); this.modal.error = e.detail || '儲存失敗' }
        } catch { this.modal.error = '網路錯誤' }
        this.modal.saving = false
      },

      async deleteItem(kind, item) {
        const label = kind === 'family' ? item.code : kind === 'generation' ? (item.family_code + ' ' + item.gen_name) : (item.brand + ' ' + item.model)
        if (!confirm(`確認刪除「${label}」？`)) return
        const endpoint = kind === 'family' ? 'families' : kind === 'generation' ? 'generations' : 'products'
        const idPart = kind === 'family' ? encodeURIComponent(item.code) : item.id
        try {
          const r = await fetch(`${API}/netarch-guide/${endpoint}/${idPart}`, { method: 'DELETE', headers: { Authorization: 'Bearer ' + this.session.token } })
          if (r.ok) await this.loadAll()
        } catch {}
      },
    }
  }
  </script>

  <script src="../static/notif.js"></script>
  <script src="../static/sidebar.js"></script>
</body>
</html>
