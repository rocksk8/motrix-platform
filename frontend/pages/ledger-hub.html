<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{if(localStorage.getItem('motrix_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/api/system/branding/favicon">
  <title>總帳作業 - MOTRIX 專案管理系統</title>
  <script src="../js/ledger-hub.js"></script>
  <script src="../static/auth-guard.js"></script>
  <script defer src="../static/vendor/alpine-3.17.1.min.js"></script>
  <link rel="stylesheet" href="../css/style.css?v=20260805g">
  <style>
    [x-cloak]{display:none!important}
    .page-main{margin-left:var(--sidebar-w);margin-top:var(--topbar-h);padding:28px 32px;min-height:calc(calc(100vh / var(--fz,1)) - var(--topbar-h));background:var(--white)}
    .hb-title{font-size:20px;font-weight:700;font-family:var(--font-zh);color:var(--text-primary);margin-bottom:6px}
    .hb-note{font-size:12px;color:var(--text-secondary);font-family:var(--font-zh);line-height:1.7;margin-bottom:14px;max-width:920px}
    .hb-tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--border-light);flex-wrap:wrap}
    .hb-tab{padding:8px 16px;border:none;background:none;font-size:13px;font-family:var(--font-zh);color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent}
    .hb-tab.on{color:var(--text-primary);font-weight:700;border-bottom-color:var(--accent)}
    .hb-card{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;max-width:920px}
    .hb-table{width:100%;border-collapse:collapse;font-size:13px;font-family:var(--font-zh)}
    .hb-table th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border-light);color:var(--text-secondary)}
    .hb-table td{padding:6px 8px;border-bottom:1px solid var(--line)}
    .hb-btn{padding:4px 12px;border-radius:var(--radius);border:1px solid var(--border-light);background:var(--surface);font-size:12px;font-family:var(--font-zh);cursor:pointer;color:var(--text-primary)}
    .hb-btn:hover{background:var(--surface-sunken)}
    .hb-input{padding:5px 9px;border:1px solid var(--border-light);border-radius:var(--radius);font-size:13px;font-family:var(--font-zh);background:var(--surface)}
    .hb-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
    .hb-num{text-align:right;font-variant-numeric:tabular-nums}
    .hb-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
    .hb-btn:disabled{opacity:.5;cursor:default}
    .hb-warn{color:var(--warning);background:var(--warning-light);border-radius:var(--radius);padding:8px 12px;font-size:13px;font-family:var(--font-zh);margin-bottom:8px}
    .hb-table tr.bad td{background:var(--tone-danger-bg)}
    .hb-tag{font-size:11px;padding:1px 8px;border-radius:9px;border:1px solid var(--border-light)}
    .hb-tag.on{background:var(--success-light);color:var(--success);border-color:var(--success-border)}
    .hb-err{color:var(--tone-danger-fg);background:var(--tone-danger-bg);border:1px solid var(--tone-danger-border);border-radius:var(--radius);padding:8px 12px;font-size:13px;font-family:var(--font-zh);margin-bottom:12px}
    .hb-ok{color:var(--success);background:var(--success-light);border:1px solid var(--success-border);border-radius:var(--radius);padding:8px 12px;font-size:13px;font-family:var(--font-zh);margin-bottom:12px}
  </style>
</head>
<body x-data="ledgerHubPage()" x-init="init()" x-cloak>
  <header id="app-topbar" class="topbar"></header>
  <div id="sidebar-root"></div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div>
    <main class="page-main">
      <div class="hb-title">總帳作業</div>
      <div class="hb-note">總帳的各項功能陸續上線：完成一項、開啟一項，頁籤才會出現。尚未開啟的功能不影響現有的傳票與報表。開關只有最高管理者可以操作。</div>

      <div class="hb-err" x-show="error" x-text="error" data-testid="hb-error"></div>
      <div class="hb-ok" x-show="notice" x-text="notice" data-testid="hb-notice"></div>

      <div class="hb-tabs" x-show="enabled.length" data-testid="hb-tabs">
        <template x-for="f in enabled" :key="f.key">
          <button class="hb-tab" :class="{on: tab === f.key}" @click="selectTab(f.key)" x-text="f.label" :data-testid="'hb-tab-' + f.key"></button>
        </template>
      </div>

      <div class="hb-card" x-show="current()" data-testid="hb-body">
        <template x-if="current()">
          <div>
            <div class="hb-title" style="font-size:16px" x-text="current().label"></div>
            <div class="hb-note" x-text="current().description"></div>
            <div class="hb-note" x-show="['engine_drafts', 'tax401', 'withholding', 'source_annotations'].indexOf(current().key) < 0">這項功能已開啟，但畫面還在準備中，目前尚未提供內容。</div>

            <!-- 來源憑證補登 -->
            <div x-show="current().key === 'source_annotations'" data-testid="hb-an">
              <div class="hb-err" x-show="an.error" x-text="an.error" data-testid="hb-an-error"></div>
              <div class="hb-ok" x-show="an.notice" x-text="an.notice" data-testid="hb-an-notice"></div>
              <div class="hb-note">來源模組沒有的憑證資料（實際進項稅額、發票日期）在這裡補登，補登值優先於來源值。下面列出稅額是估計或來源未拆稅的分錄事件。</div>
              <div class="hb-row"><button class="hb-btn" :disabled="an.busy" @click="anLoad()" data-testid="hb-an-load">重新整理</button></div>
              <div style="overflow-x:auto">
              <table class="hb-table" data-testid="hb-an-table" style="min-width:860px">
                <thead><tr style="white-space:nowrap"><th>事件日</th><th>事件</th><th>來源</th><th>單據</th><th class="hb-num">金額</th><th>狀況</th><th>實際進項稅額（元）</th><th>發票日期</th><th></th></tr></thead>
                <tbody>
                  <template x-for="i in an.items" :key="anKey(i)">
                    <tr :data-testid="'hb-an-row-' + i.source_key">
                      <td x-text="i.event_date"></td><td x-text="i.event_label || i.event_code"></td><td x-text="i.source_label || (i.source_type + ' ' + i.source_key)"></td><td x-text="i.doc_no"></td>
                      <td class="hb-num" x-text="fmt(i.amount)"></td><td style="white-space:nowrap" x-text="anKind(i.kind)"></td>
                      <td><input class="hb-input" type="number" min="0" style="width:110px" x-model="an.drafts[anKey(i)].tax" data-saved-field :data-testid="'hb-an-tax-' + i.source_key"></td>
                      <td><input class="hb-input" type="date" x-show="i.can_date" x-model="an.drafts[anKey(i)].date" data-saved-field :data-testid="'hb-an-date-' + i.source_key"></td>
                      <td style="white-space:nowrap"><button class="hb-btn primary" @click="anSave(i)" :data-testid="'hb-an-save-' + i.source_key">儲存</button>
                        <button class="hb-btn" x-show="i.input_tax_id || i.invoice_date_id" @click="anClear(i)" :data-testid="'hb-an-clear-' + i.source_key">清除</button></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              </div>
              <div class="hb-note" x-show="an.items.length" data-testid="hb-an-hint">填實際進項稅額（元）與發票日期後按「儲存」；欄位留空並儲存＝不補登；要拿掉已補登的值、回到來源值，請按該列的「清除」。</div>
              <div class="hb-note" x-show="!an.items.length" data-testid="hb-an-empty">目前沒有需要補登的事件（稅額估計或未拆稅的分錄事件會出現在這裡）。</div>
              <div class="hb-warn" x-show="an.truncated">最多顯示 500 筆。</div>
            </div>

            <!-- 扣繳清單（C5） -->
            <div x-show="current().key === 'withholding'" data-testid="hb-wh">
              <div class="hb-err" x-show="wh.error" x-text="wh.error" data-testid="hb-wh-error"></div>
              <div class="hb-ok" x-show="wh.notice" x-text="wh.notice" data-testid="hb-wh-notice"></div>
              <div class="hb-row">
                <input class="hb-input filter" type="month" x-model="wh.ym" data-testid="hb-wh-ym">
                <button class="hb-btn primary" :disabled="wh.busy" @click="whLoad()" data-testid="hb-wh-load">查詢</button>
                <input class="hb-input" type="date" x-model="wh.date" data-saved-field data-testid="hb-wh-date"> 繳庫日
                <input class="hb-input" type="text" x-model="wh.voucherNo" data-saved-field placeholder="繳庫傳票單號（選填）" data-testid="hb-wh-voucher">
                <button class="hb-btn" :disabled="wh.busy" @click="whRemit()" data-testid="hb-wh-remit">登記繳庫</button>
                <input class="hb-input" type="text" x-model="wh.unremitReason" data-saved-field placeholder="取消繳庫登記的原因（按列上的「取消繳庫登記」前必填，只有最高管理者可操作）" style="min-width:320px" data-testid="hb-wh-reason">
              </div>
              <template x-if="wh.data">
                <div>
                  <template x-for="c in wh.data.checks" :key="c.key">
                    <div :class="c.ok ? 'hb-ok' : 'hb-warn'" :data-testid="'hb-wh-check-' + c.key"
                         x-text="c.label + '：清單 ' + fmt(c.left) + ' ／ 帳上 ' + fmt(c.right) + (c.ok ? '（相符）' : '（不符：' + c.note + '）')"></div>
                  </template>
                  <table class="hb-table" data-testid="hb-wh-groups">
                    <thead><tr><th>所屬月</th><th>種類</th><th>繳庫期限</th><th class="hb-num">筆數</th><th class="hb-num">合計</th><th class="hb-num">未繳庫</th><th>狀態</th></tr></thead>
                    <tbody>
                      <template x-for="g in wh.data.groups" :key="g.period_ym + g.kind">
                        <tr :class="{bad: g.overdue}"><td x-text="g.period_ym"></td><td x-text="g.label"></td><td x-text="g.due"></td><td class="hb-num" x-text="g.count"></td>
                          <td class="hb-num" x-text="fmt(g.total)"></td><td class="hb-num" x-text="fmt(g.unremitted)"></td><td x-text="g.overdue ? '已逾期未繳庫' : (g.unremitted ? '待繳庫' : '已繳庫')"></td></tr>
                      </template>
                    </tbody>
                  </table>
                  <table class="hb-table" style="margin-top:12px" data-testid="hb-wh-items">
                    <thead><tr><th></th><th>所屬月</th><th>種類</th><th>來源</th><th>對象（受款人）</th><th>所得類別</th><th class="hb-num">給付總額</th><th class="hb-num">代扣金額</th><th>繳庫日</th></tr></thead>
                    <tbody>
                      <template x-for="i in wh.data.items" :key="i.id">
                        <tr><td><input type="checkbox" :disabled="!!i.remitted_at" x-model="wh.selected[i.id]"></td><td x-text="i.period_ym"></td><td x-text="whKindLabel(i.kind)"></td>
                          <td x-text="i.source_key"></td><td x-text="i.party_name || i.party_key"></td><td x-text="i.income_type"></td><td class="hb-num" x-text="fmt(i.gross)"></td><td class="hb-num" x-text="fmt(i.amount)"></td>
                          <td><span x-text="i.remitted_at"></span> <button class="hb-btn" x-show="i.remitted_at" @click="whUnremit(i)" title="只有最高管理者可以取消；上方要先填原因">取消繳庫登記</button></td></tr>
                      </template>
                    </tbody>
                  </table>
                  <div class="hb-warn" x-show="wh.data.truncated" data-testid="hb-wh-truncated">未指定月份時最多顯示 2000 筆，請選擇月份縮小範圍。</div>
                  <div class="hb-note" x-show="!wh.data.items.length" data-testid="hb-wh-empty">目前沒有扣繳項目。勞報單簽回後，於『分錄草稿』執行引擎產生草稿時會記入這裡。</div>
                </div>
              </template>
            </div>

            <!-- 營業稅 401（C5） -->
            <div x-show="current().key === 'tax401'" data-testid="hb-tax">
              <div class="hb-err" x-show="tax.error" x-text="tax.error" data-testid="hb-tax-error"></div>
              <div class="hb-ok" x-show="tax.notice" x-text="tax.notice" data-testid="hb-tax-notice"></div>
              <div class="hb-note" x-show="tax.info" x-text="tax.info" data-testid="hb-tax-info"></div>
              <div class="hb-row">
                <input class="hb-input filter" type="number" x-model.number="tax.year" style="width:90px" data-testid="hb-tax-year"> 年
                <select class="hb-input filter" x-model.number="tax.period" data-testid="hb-tax-period">
                  <template x-for="n in [1,2,3,4,5,6]" :key="n"><option :value="n" x-text="'第 ' + n + ' 期（' + (2*n-1) + '～' + (2*n) + ' 月）'"></option></template>
                </select>
                <button class="hb-btn primary" :disabled="tax.busy" @click="taxLoad()" data-testid="hb-tax-load">查詢</button>
                <button class="hb-btn" :disabled="tax.busy || !tax.data" @click="taxExport()" data-testid="hb-tax-export">匯出 Excel 工作底稿</button>
                <button class="hb-btn" :disabled="tax.busy || !tax.data" @click="taxExport('pdf')" data-testid="hb-tax-export-pdf">匯出 PDF 工作底稿</button>
                <button class="hb-btn" :disabled="tax.busy || !tax.data || !tax.data.reconciled" @click="taxSettle()" data-testid="hb-tax-settle">產生稅額結轉草稿</button>
              </div>
              <div class="hb-note" x-show="tax.data" data-testid="hb-tax-summary">這是申報前的工作底稿（數字來自已過帳傳票），不是可直接上傳的申報檔。<br>還要自己補：發票種類（三聯／二聯／電子）、零稅率性質、留抵稅額退稅相關欄位（113～115），以及媒體申報檔。</div>
              <details x-show="tax.data" style="margin-bottom:8px" data-testid="hb-tax-details"><summary style="cursor:pointer;font-size:13px;color:var(--text-secondary)">展開說明（欄位依據與未能核實的項目）</summary>
              <div class="hb-note" x-show="tax.data" data-testid="hb-tax-legal">欄位代號與名稱已對照財政部《營業稅電子資料申報繳稅作業要點》附件六（113/04/12 令，存取日 2026-09-30）；含免稅銷售者應使用 403 表。</div>
              <template x-if="tax.data && tax.data.unverified && tax.data.unverified.length">
                <div class="hb-warn" data-testid="hb-tax-unverified">
                  <div>以下項目未能核實或本版未涵蓋，申報前請人工確認：</div>
                  <template x-for="u in tax.data.unverified" :key="u"><div x-text="'・' + u"></div></template>
                </div>
              </template>
              </details>
              <template x-if="tax.data">
                <div>
                  <template x-for="w in tax.data.warnings" :key="w.key"><div class="hb-warn" x-text="w.text" :data-testid="'hb-tax-warn-' + w.key"></div></template>
                  <table class="hb-table" data-testid="hb-tax-rows">
                    <thead><tr style="white-space:nowrap"><th>稅碼</th><th>說明</th><th>欄位（金額／稅額／零稅率）</th><th class="hb-num">金額</th><th class="hb-num">稅額</th><th class="hb-num">零稅率銷售額</th></tr></thead>
                    <tbody>
                      <template x-for="r in tax.data.rows" :key="r.tax_code">
                        <tr><td x-text="r.tax_code"></td><td x-text="r.note"></td><td x-text="[r.field_amt, r.field_tax, r.field_zero].filter(v => v).join(' / ')"></td>
                          <td class="hb-num" x-text="fmt(r.amount)"></td><td class="hb-num" x-text="fmt(r.tax)"></td><td class="hb-num" x-text="fmt(r.zero_amount)"></td></tr>
                      </template>
                    </tbody>
                  </table>
                  <table class="hb-table" style="margin-top:12px" data-testid="hb-tax-calc">
                    <tbody>
                      <tr><td>101 銷項稅額合計</td><td class="hb-num" x-text="fmt(tax.data.calc['101'])"></td></tr>
                      <tr><td>107 得扣抵進項稅額合計</td><td class="hb-num" x-text="fmt(tax.data.calc['107'])"></td></tr>
                      <tr><td>108 上期累積留抵稅額</td><td class="hb-num" x-text="fmt(tax.data.calc['108'])"></td></tr>
                      <tr><td>110 小計</td><td class="hb-num" x-text="fmt(tax.data.calc['110'])"></td></tr>
                      <tr><td><b>111 本期應實繳稅額</b></td><td class="hb-num"><b x-text="fmt(tax.data.calc['111'])"></b></td></tr>
                      <tr><td><b>112 本期申報留抵稅額</b></td><td class="hb-num"><b x-text="fmt(tax.data.calc['112'])"></b></td></tr>
                    </tbody>
                  </table>
                  <table class="hb-table" style="margin-top:12px" data-testid="hb-tax-checks">
                    <thead><tr><th>對帳</th><th>結果</th><th class="hb-num">左</th><th class="hb-num">右</th></tr></thead>
                    <tbody>
                      <template x-for="c in tax.data.checks" :key="c.key">
                        <tr :class="{bad: c.ok === false}"><td x-text="c.label"></td><td x-text="c.ok === true ? '相符' : (c.ok === false ? '不符' : (c.note || '未對比'))"></td>
                          <td class="hb-num" x-text="c.left == null ? '' : fmt(c.left)"></td><td class="hb-num" x-text="c.right == null ? '' : fmt(c.right)"></td></tr>
                      </template>
                    </tbody>
                  </table>
                  <div class="hb-note" x-show="tax.data.settlement" x-text="tax.data.settlement ? ('稅額結轉：應實繳 ' + fmt(tax.data.settlement.payable) + '、新留抵 ' + fmt(tax.data.settlement.carry_new) + '（' + ({ draft: '草稿', posted: '已過帳', voided: '已作廢' }[tax.data.settlement.status] || tax.data.settlement.status) + '）') : ''"></div>
                </div>
              </template>
            </div>

            <!-- 分錄草稿（C1） -->
            <div x-show="current().key === 'engine_drafts'" data-testid="hb-engine">
              <!-- L1：來源變動橫幅（自上次執行後，來源有多少變動、草稿待更新；自動更新每小時一次，只產生草稿） -->
              <div x-data="glEngineBanner()" x-init="load(enabled.some(f => f.key === 'engine_drafts')); $watch('eng.notice', () => load(enabled.some(f => f.key === 'engine_drafts')))" x-show="text" class="hb-warn" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap" data-testid="hb-eng-banner">
                <span x-text="text" data-testid="hb-eng-banner-text"></span>
                <button class="hb-btn" @click="load(true)" data-testid="hb-eng-banner-refresh">重新檢查</button>
              </div>
              <div class="hb-err" x-show="eng.error" x-text="eng.error" data-testid="hb-eng-error"></div>
              <div class="hb-ok" x-show="eng.notice" x-text="eng.notice" data-testid="hb-eng-notice"></div>
              <div class="hb-row">
                <input class="hb-input" type="date" x-model="eng.start" data-testid="hb-eng-start"> ～ <input class="hb-input" type="date" x-model="eng.end" data-testid="hb-eng-end">
                <button class="hb-btn primary" :disabled="eng.busy" @click="engRun()" data-testid="hb-eng-run">產生分錄草稿</button>
                <select class="hb-input filter" x-model="eng.filter" @change="engLoad()" data-testid="hb-eng-filter">
                  <option value="">全部狀態</option>
                  <template x-for="st in ['drafted','posted','drift','orphan','blocked_closed','blocked_no_account','blocked_inventory','superseded','rejected','reversed','native']" :key="st"><option :value="st" x-text="statusLabel(st)"></option></template>
                </select>
                <span class="hb-note" style="margin:0" x-text="Object.keys(eng.counts).map(k => statusLabel(k) + ' ' + eng.counts[k]).join('　')" data-testid="hb-eng-counts"></span>
              </div>
              <template x-if="eng.run">
                <div style="margin-bottom:10px">
                  <template x-for="n in eng.run.notices" :key="n"><div class="hb-warn" x-text="n"></div></template>
                  <div class="hb-warn" x-show="eng.run.invalid_count" x-text="eng.run.invalid_count + ' 筆事件格式不合格，已略過（例：' + (eng.run.invalid[0] ? eng.run.invalid[0].problems[0] : '') + '）'"></div>
                </div>
              </template>
              <div class="hb-row" x-show="eng.events.length">
                <button class="hb-btn" @click="engToggleAll(true)">全選草稿</button>
                <button class="hb-btn" @click="engToggleAll(false)">全不選</button>
                <button class="hb-btn" :disabled="eng.busy" @click="engBatch('submit')">整批送審</button>
                <button class="hb-btn" :disabled="eng.busy" @click="engBatch('approve')">整批核准</button>
                <button class="hb-btn" :disabled="eng.busy" @click="engBatch('post')">整批過帳</button>
                <button class="hb-btn primary" :disabled="eng.busy" @click="engBatch('all')" data-testid="hb-eng-all">一鍵確認到過帳</button>
              </div>
              <table class="hb-table" data-testid="hb-eng-table">
                <thead><tr><th></th><th>事件日</th><th>事件</th><th>來源鍵</th><th class="hb-num">金額</th><th>狀態</th><th>傳票</th><th>備註</th></tr></thead>
                <tbody>
                  <template x-for="e in eng.events" :key="e.id">
                    <tr :class="{bad: engBad(e)}" :data-testid="'hb-eng-row-' + e.id">
                      <td><input type="checkbox" :disabled="!e.voucher_id || e.status === 'native' || e.voucher_status === '已過帳'" x-model="eng.selected[e.id]"></td>
                      <td x-text="e.event_date"></td><td x-text="e.event_code + (e.rev > 1 ? ' v' + e.rev : '')"></td><td x-text="e.source_key"></td>
                      <td class="hb-num" x-text="fmt(e.amount)"></td><td x-text="statusLabel(e.status)"></td>
                      <td x-text="(e.voucher_no || '') + (e.voucher_status ? '（' + e.voucher_status + '）' : '')"></td>
                      <td x-text="(e.reversal_no ? '沖轉 ' + e.reversal_no + '　' : '') + (e.note || '')"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <div class="hb-note" x-show="!eng.events.length" data-testid="hb-eng-empty">目前沒有事件。按「產生分錄草稿」向各來源模組收集（沒有提供者的來源會在上方說明原因）。</div>
              <template x-if="eng.results">
                <div style="margin-top:10px">
                  <template x-for="r in eng.results.results.filter(x => !x.ok)" :key="r.id"><div class="hb-warn" x-text="'傳票 #' + r.id + '：' + r.error"></div></template>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
      <div class="hb-note" x-show="loaded && !enabled.length" data-testid="hb-none">目前沒有已開啟的功能。</div>

      <div class="hb-card">
        <div class="hb-title" style="font-size:14px">功能清單</div>
        <table class="hb-table" data-testid="hb-features">
          <thead><tr><th>功能</th><th>說明</th><th>狀態</th><th></th></tr></thead>
          <tbody>
            <template x-for="f in features" :key="f.key">
              <tr :data-testid="'hb-row-' + f.key">
                <td x-text="f.label"></td><td x-text="f.description"></td>
                <td><span class="hb-tag" :class="{on: f.enabled}" x-text="f.ready ? (f.enabled ? '已開啟' : '未開啟') : '開發中'" :data-testid="'hb-status-' + f.key"></span></td>
                <td style="text-align:right"><button class="hb-btn" x-show="isSuper" :disabled="!f.ready && !f.enabled" @click="toggle(f)" x-text="f.enabled ? '關閉' : (f.ready ? '開啟' : '尚未提供')" data-testid="hb-toggle"></button></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </main>
  </div>
  <!-- notif.js 必須與 sidebar.js 成對、放在 sidebar.js 之前（見 account-items.html 註解；守門 test_page_shell_scripts_2026_09_30.py） -->
  <script>
    // 引擎橫幅（L1）：讀 GET /api/ledger/engine/status；來源變動數、最近執行、自動更新結果。只讀，不改任何資料。
    function glEngineBanner() {
      return {
        text: '',
        async load(on) {
          if (!on) { this.text = ''; return }          // 功能沒開：不打 API（會回 409），橫幅不出現
          try {
            const tok = (JSON.parse(localStorage.getItem('motrix_session') || '{}')).token || ''
            const r = await fetch('/api/ledger/engine/status', { headers: { Authorization: 'Bearer ' + tok } })
            if (!r.ok) { this.text = ''; return }
            const d = await r.json()
            const p = d.pending || {}
            const lines = []
            if (p.total > 0) lines.push(p.total + ' 個來源已變動，草稿待更新（新增 ' + p.new + '、內容變動 ' + p.changed + '、已消失 ' + p.gone + '）：請按「產生分錄草稿」更新。')
            if (d.auto_result && d.auto_result.ok === false) lines.push('自動更新失敗：' + (d.auto_result.error || '未知原因') + '（可手動執行看詳情）。')
            const lr = d.last_run
            if (!lines.length && lr) lines.push('來源與草稿一致。最近一次' + (lr.started_by === 'auto' ? '自動' : '手動') + '執行：' + String(lr.started_at || '').replace('T', ' ').slice(0, 16) + '。')
            this.text = lines.join(' ')
          } catch (e) { this.text = '' }
        },
      }
    }
  </script>
  <script src="../static/notif.js"></script>
  <script src="../static/sidebar.js"></script>
</body>
