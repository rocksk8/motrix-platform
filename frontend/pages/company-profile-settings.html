<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{if(localStorage.getItem('motrix_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../static/favicon.png">
  <title>公司資料設定 — MOTRIX 專案管理系統</title>
  <script src="../static/auth-guard.js"></script>
  <script defer src="../static/vendor/alpine-3.17.1.min.js"></script>
  <link rel="stylesheet" href="../css/style.css?v=20260805g">
  <style>
    .ns-main {
      margin-left: var(--sidebar-w);
      margin-top: var(--topbar-h);
      padding: 32px 36px;
      min-height: calc(100vh - var(--topbar-h));
      background: var(--white);
    }
    .ns-title { font-size: 20px; font-weight: 700; color: var(--text-main); }
    .ns-subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
    .ns-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      max-width: 720px;
      margin-top: 24px;
    }
    .ns-card-head {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .ns-card-head-title { font-size: 14px; font-weight: 700; color: var(--text-main); flex: 1; }
    .ns-card-body { padding: 20px 24px; }
    .ns-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    .ns-row.full { grid-template-columns: 1fr; }
    .ns-field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .ns-field input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      color: var(--text-main);
      background: var(--white);
      box-sizing: border-box;
    }
    .ns-field input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(47,111,214,.12);
    }
    .ns-desc {
      font-size: 13px;
      color: var(--text-secondary);
      background: #F8F7F4;
      border-radius: 7px;
      padding: 12px 14px;
      border-left: 3px solid var(--accent);
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .ns-actions {
      display: flex;
      gap: 10px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border-light);
    }
    .ns-locked {
      font-size: 13px;
      color: var(--text-secondary);
      padding: 16px;
      text-align: center;
    }
  </style>
</head>
<body x-data="companyProfilePage()" x-init="init()" x-cloak>
  <header id="app-topbar" class="topbar"></header>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="app-sidebar"></aside>
  <main class="ns-main">
    <div class="pg">
      <div class="pg__l">
        <div class="pg__eyebrow">系統設定</div>
        <h1 class="pg__t">公司資料設定</h1>
        <p class="pg__s">公司基本資料與收款帳戶資訊，用於勞報單、請款單等文件顯示</p>
      </div>
    </div>

    <template x-if="!isSuperadmin">
      <div class="ns-card"><div class="ns-locked">僅超級管理員可檢視／修改此頁面</div></div>
    </template>

    <template x-if="isSuperadmin">
      <div>
        <!-- 基本資料 -->
        <div class="ns-card">
          <div class="ns-card-head">
            <div class="ns-card-head-title">公司基本資料</div>
          </div>
          <div class="ns-card-body">
            <div class="ns-row full">
              <div class="ns-field">
                <label>公司名稱</label>
                <input type="text" x-model="cfg.name" placeholder="允碩整合集創股份有限公司">
              </div>
            </div>
            <div class="ns-row">
              <div class="ns-field">
                <label>統一編號</label>
                <input type="text" x-model="cfg.tax_id" placeholder="60575481">
              </div>
              <div class="ns-field">
                <label>聯絡方式</label>
                <input type="text" x-model="cfg.contact_info" placeholder="Tel: 04-3610-6566｜info@miactw.com">
              </div>
            </div>
            <div class="ns-row">
              <div class="ns-field" style="flex:1 1 100%">
                <label>辦公室地址</label>
                <input type="text" x-model="cfg.address"
                       placeholder="例：台中市西屯區文心路二段201號">
                <!-- ⚠️ 這個欄位的用途跟抬頭／統編不一樣：它是**算標案離我們多遠**的起點。
                     沒填的後果不是 PDF 少一行，是整個距離功能不會動，
                     所以地圖那一側會明白顯示「尚未設定辦公室地址」，而不是安靜地不顯示距離。
                     🔑 使用者看到「距離都空著」會以為功能壞了，而不是他還沒填——
                     兩者的下一步完全不同：一個是報修，一個是回來填這一行字。 -->
                <div style="font-size:11px;color:var(--text-secondary);margin-top:4px">
                  用來計算標案與辦公室的直線距離。沒有填的話，地圖上不會顯示距離。
                </div>
              </div>
            </div>

            <!-- 🔴 手動座標：**填了就跳過所有地址查詢。**
                 它存在的理由是實測出來的：OpenStreetMap 的圖資**認不得台灣的門牌**
                 ⇒ 地址只查得到「區級」，而區級中心點與實際地點可能差好幾公里。
                 🔑 而使用者知道自己在哪裡 —— 這一欄把「猜」換成「他說了算」。
                 📌 不需要 Google 金鑰、不需要任何外部查詢。 -->
            <div class="ns-row">
              <div class="ns-field" style="flex:1 1 100%">
                <label for="office_lat">辦公室座標（選填，填了會比地址精確）</label>
                <div style="display:flex;gap:8px;flex-wrap:wrap">
                  <!-- 📌 `id`／`name` 用**後端欄位的名字**：那兩個欄位在
                       `company_profile` 裡叫 `office_lat`／`office_lon`，
                       而畫面上的狀態叫 `latText`／`lonText`（字串版）。
                       ⇒ 之後有人要從畫面找到端點時，兩邊對得起來。 -->
                  <input type="text" id="office_lat" name="office_lat"
                         style="flex:1 1 180px" x-model="latText"
                         @input="splitPastedCoord()" @paste="$nextTick(() => splitPastedCoord())"
                         placeholder="緯度，例 24.2549239">
                  <input type="text" id="office_lon" name="office_lon"
                         style="flex:1 1 180px" x-model="lonText"
                         placeholder="經度，例 120.5316259">
                  <button type="button" class="btn btn-ghost btn-sm"
                          x-show="latText || lonText"
                          @click="latText = ''; lonText = ''">清除</button>
                </div>
                <!-- ⚠️ 「貼一串」要能自動拆兩欄。
                     使用者從 Google 地圖複製出來的是 `24.2549239, 120.5316259` **一串**，
                     逼他手動拆的話，最可能的錯誤是**兩個數字貼反**，
                     ☠️ 而 `(120.53, 24.25)` 是一個**合法**的座標（在阿拉伯海上）——
                     範圍檢查擋不住它，地圖也會乖乖畫出來。
                     🔑 **一個會通過所有驗證的錯誤，比一個被擋下來的錯誤貴得多。** -->
                <div style="font-size:11px;color:var(--text-secondary);margin-top:4px">
                  在 Google 地圖上對著辦公室按右鍵，第一列就是座標，
                  <strong>整串貼進左邊那一格會自動拆成兩欄</strong>。
                  兩格都清空就回到用地址查詢。
                </div>
                <div x-show="coordWarn" style="font-size:11px;color:var(--warning);margin-top:4px"
                     x-text="coordWarn"></div>
              </div>
            </div>

            <!-- Google 金鑰：**選用**。免金鑰的底圖與距離不需要它。 -->
            <div class="ns-row">
              <div class="ns-field" style="flex:1 1 100%">
                <label>Google Maps 金鑰（選填）</label>
                <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
                  <input type="password" style="flex:1 1 280px" x-model="keyText"
                         :placeholder="keySet ? '已設定，留空表示不變更' : '未設定'"
                         autocomplete="off">
                  <span x-show="keySet && !keyCleared" style="font-size:11px;color:var(--text-secondary)"
                        x-text="'目前：' + keyMasked"></span>
                  <button type="button" class="btn btn-ghost btn-sm"
                          x-show="keySet && !keyCleared" @click="keyCleared = true; keyText = ''">清除金鑰</button>
                  <span x-show="keyCleared" style="font-size:11px;color:var(--warning)">
                    儲存後會清除（按取消或重新整理可還原）
                  </span>
                </div>
                <!-- 🔴 這一欄**只開啟「附近廠商」那一塊**，不影響底圖與距離。
                     ⚠️ 讀取時只回末四碼：那是一個**付費憑證**，
                     而這個畫面會被截圖、被投影、被肩後看見。 -->
                <div style="font-size:11px;color:var(--text-secondary);margin-top:4px">
                  只用來開啟「附近廠商」。地圖底圖與距離計算<strong>不需要它</strong>。
                  為了安全，讀取時只會顯示末四碼。
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 收款帳戶資訊 -->
        <div class="ns-card">
          <div class="ns-card-head">
            <div class="ns-card-head-title">收款帳戶資訊</div>
            <span x-show="saved" x-transition style="font-size:12px;color:#16A34A;font-weight:600">已儲存</span>
          </div>
          <div class="ns-card-body">
            <div class="ns-desc">
              僅超級管理員可修改。設定後將顯示於請款單 PDF，供客戶財務單位辦理匯款。
            </div>
            <div class="ns-row">
              <div class="ns-field">
                <label>銀行名稱</label>
                <input type="text" x-model="cfg.bank_name" placeholder="例：台灣銀行">
              </div>
              <div class="ns-field">
                <label>分行名稱</label>
                <input type="text" x-model="cfg.bank_branch" placeholder="例：台中分行">
              </div>
            </div>
            <div class="ns-row">
              <div class="ns-field">
                <label>戶名</label>
                <input type="text" x-model="cfg.bank_account_name" placeholder="允碩整合集創股份有限公司">
              </div>
              <div class="ns-field">
                <label>帳號</label>
                <input type="text" x-model="cfg.bank_account_number" placeholder="請輸入匯款帳號">
              </div>
            </div>

            <div class="ns-actions">
              <button class="btn btn-primary" @click="save()" :disabled="saving">
                <span x-show="!saving">儲存設定</span>
                <span x-show="saving">儲存中…</span>
              </button>
            </div>

            <div x-show="msg" x-text="msg" x-transition
                 :style="isError ? 'color:#DC2626' : 'color:#16A34A'"
                 style="font-size:13px;margin-top:12px;font-weight:600"></div>
          </div>
        </div>

        <!-- WebAuthn 網域設定 -->
        <!-- 2026-09-16：Passkey 功能暫緩，整張卡片不顯示。後端
             /api/settings/webauthn-config 的 GET/PATCH 都回 404，留著只會讓
             管理員填了存不進去。開關在 backend/helpers/auth.py::PASSKEY_ENABLED。 -->
        <div class="ns-card" x-show="passkeyFeatureEnabled">
          <div class="ns-card-head">
            <div class="ns-card-head-title">Passkey / WebAuthn 網域設定</div>
            <span x-show="webauthnSaved" x-transition style="font-size:12px;color:#16A34A;font-weight:600">已儲存</span>
          </div>
          <div class="ns-card-body">
            <div class="ns-desc">
              設定 WebAuthn Relying Party 識別資訊。<strong>RP ID 必須是 DNS 可解析的網域名稱</strong>（不支援 IP 位址），且必須指向本伺服器。兩個欄位必須同時填入或同時清空。
            </div>
            <div class="ns-row full">
              <div class="ns-field">
                <label>RP ID（例：motrix.internal）</label>
                <input type="text" x-model="webauthnRpId" placeholder="motrix.internal" @input="webauthnModified = true">
              </div>
            </div>
            <div class="ns-row full">
              <div class="ns-field">
                <label>Origin（例：https://motrix.internal:666）</label>
                <input type="text" x-model="webauthnOrigin" placeholder="https://motrix.internal:666" @input="webauthnModified = true">
              </div>
            </div>

            <div class="ns-actions">
              <button class="btn btn-primary" @click="saveWebauthnConfig()" :disabled="webauthnSaving">
                <span x-show="!webauthnSaving">儲存設定</span>
                <span x-show="webauthnSaving">儲存中…</span>
              </button>
            </div>

            <div x-show="webauthnMsg" x-text="webauthnMsg" x-transition
                 :style="webauthnIsError ? 'color:#DC2626' : 'color:#16A34A'"
                 style="font-size:13px;margin-top:12px;font-weight:600"></div>
          </div>
        </div>

        <!-- ══ 系統技術設定（2026-09-11 新增）══
             這四組設定系統一直都在讀，只是先前沒有任何管理介面，要調整只能直接
             打 API。分隔線讓它跟上方「公司資料」在視覺上分開——同一頁但不同性質。 -->
        <div style="margin:28px 0 4px;padding-top:20px;border-top:1px solid var(--border-light)">
          <div style="font-size:13px;font-weight:700;color:var(--text-secondary)">
            系統技術設定
            <span x-show="sysLoading" style="font-weight:400;color:var(--text-dim);font-size:12px">　載入中…</span>
          </div>
          <div style="font-size:12px;color:var(--text-dim);margin-top:4px;line-height:1.6">
            以下設定會影響備份、PDF 產生與檔案存放位置。<strong>改動前請確認路徑或參數正確</strong>——
            填錯不會立刻報錯，而是在下一次備份或產生 PDF 時才失敗。留空一律代表「使用系統預設」。
          </div>
        </div>

        <!-- 備份保留天數 -->
        <div class="ns-card" x-show="!sysLoading">
          <div class="ns-card-head">
            <div class="ns-card-head-title">備份保留天數</div>
            <span x-show="retSaved" x-transition style="font-size:12px;color:#16A34A;font-weight:600">已儲存</span>
          </div>
          <div class="ns-card-body">
            <div class="ns-desc">
              超過保留天數的備份會在每日排程時自動清除。<strong>調小等於刪掉更多歷史備份，調整前先確認磁碟空間與可回溯範圍的取捨。</strong>
              各欄位可填 1～3650 天。
            </div>
            <div class="ns-row">
              <div class="ns-field">
                <label>本機 DB 快照（天）</label>
                <input type="number" min="1" max="3650" x-model.number="retention.local_db_keep_days">
              </div>
              <div class="ns-field">
                <label>雲端每日備份（天）</label>
                <input type="number" min="1" max="3650" x-model.number="retention.cloud_daily_keep_days">
              </div>
            </div>
            <div class="ns-row">
              <div class="ns-field">
                <label>雲端週備份（天）</label>
                <input type="number" min="1" max="3650" x-model.number="retention.cloud_weekly_keep_days">
              </div>
              <div class="ns-field">
                <label>稽核紀錄（天）</label>
                <input type="number" min="1" max="3650" x-model.number="retention.audit_log_keep_days">
              </div>
            </div>
            <div class="ns-actions">
              <button class="btn btn-primary" @click="saveRetention()" :disabled="retSaving">
                <span x-show="!retSaving">儲存設定</span>
                <span x-show="retSaving">儲存中…</span>
              </button>
            </div>
            <div x-show="retMsg" x-text="retMsg" x-transition
                 :style="retIsError ? 'color:#DC2626' : 'color:#16A34A'"
                 style="font-size:13px;margin-top:12px;font-weight:600"></div>
          </div>
        </div>

        <!-- PDF 存檔根目錄 -->
        <div class="ns-card" x-show="!sysLoading">
          <div class="ns-card-head">
            <div class="ns-card-head-title">PDF 存檔根目錄</div>
            <span x-show="pdfSaved" x-transition style="font-size:12px;color:#16A34A;font-weight:600">已儲存</span>
          </div>
          <div class="ns-card-body">
            <div class="ns-desc">
              報價單／出貨單／請款單等 PDF 的存放根目錄。留空使用預設值。
              <strong>這個路徑也是雲端「PDF存檔鏡像」的來源</strong>，改了之後舊位置的檔案不會自動搬過去。
              目錄必須已存在，否則儲存時會被擋下。
            </div>
            <div class="ns-row full">
              <div class="ns-field">
                <label>自訂路徑（留空＝使用預設）</label>
                <input type="text" x-model="pdfBase.configured" :placeholder="pdfBase.default || 'C:\\...'">
                <div style="font-size:11px;color:var(--text-dim);margin-top:6px">
                  目前實際使用：<span style="font-family:monospace" x-text="pdfBase.resolved || '（未知）'"></span>
                  <template x-if="pdfBase.default">
                    <span>　｜　預設：<span style="font-family:monospace" x-text="pdfBase.default"></span></span>
                  </template>
                </div>
              </div>
            </div>
            <div class="ns-actions">
              <button class="btn btn-primary" @click="savePdfBase()" :disabled="pdfSaving">
                <span x-show="!pdfSaving">儲存設定</span>
                <span x-show="pdfSaving">儲存中…</span>
              </button>
            </div>
            <div x-show="pdfMsg" x-text="pdfMsg" x-transition
                 :style="pdfIsError ? 'color:#DC2626' : 'color:#16A34A'"
                 style="font-size:13px;margin-top:12px;font-weight:600"></div>
          </div>
        </div>

        <!-- Edge 瀏覽器路徑 -->
        <div class="ns-card" x-show="!sysLoading">
          <div class="ns-card-head">
            <div class="ns-card-head-title">Edge 瀏覽器路徑</div>
            <span x-show="edgeSaved" x-transition style="font-size:12px;color:#16A34A;font-weight:600">已儲存</span>
          </div>
          <div class="ns-card-body">
            <div class="ns-desc">
              產生 PDF 需要用到 Edge。<strong>正常情況下不用填</strong>——系統會自動偵測；
              只有在自動偵測失敗（PDF 產生報錯找不到 Edge）時才需要手動指定 <code>msedge.exe</code> 的完整路徑。
              檔案必須存在，否則儲存時會被擋下。
            </div>
            <div class="ns-row full">
              <div class="ns-field">
                <label>自訂路徑（留空＝自動偵測）</label>
                <input type="text" x-model="edgePath.configured"
                       placeholder="C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe">
                <div style="font-size:11px;color:var(--text-dim);margin-top:6px">
                  目前實際使用：<span style="font-family:monospace"
                    x-text="edgePath.resolved || '（偵測不到——PDF 產生會失敗）'"
                    :style="edgePath.resolved ? '' : 'color:#DC2626'"></span>
                </div>
              </div>
            </div>
            <div class="ns-actions">
              <button class="btn btn-primary" @click="saveEdgePath()" :disabled="edgeSaving">
                <span x-show="!edgeSaving">儲存設定</span>
                <span x-show="edgeSaving">儲存中…</span>
              </button>
            </div>
            <div x-show="edgeMsg" x-text="edgeMsg" x-transition
                 :style="edgeIsError ? 'color:#DC2626' : 'color:#16A34A'"
                 style="font-size:13px;margin-top:12px;font-weight:600"></div>
          </div>
        </div>

        <!-- 雲端備份目標 -->
        <div class="ns-card" x-show="!sysLoading">
          <div class="ns-card-head">
            <div class="ns-card-head-title">雲端備份目標</div>
            <span x-show="cloudSaved" x-transition style="font-size:12px;color:#16A34A;font-weight:600">已儲存</span>
          </div>
          <div class="ns-card-body">
            <div class="ns-desc">
              預設是「本機磁碟機」（Google 雲端硬碟掛載的資料夾）。
              切到 S3 相容物件儲存需要先在伺服器設好 access key 環境變數，<strong>沒設好的話備份會靜默失敗</strong>，
              切換後請確認隔天的備份告警沒有跳出來。
            </div>
            <div class="ns-row full">
              <div class="ns-field">
                <label>備份目標</label>
                <select x-model="cloud.backend">
                  <option value="local_drive">本機磁碟機（Google 雲端硬碟掛載資料夾）</option>
                  <option value="s3">S3 相容物件儲存（AWS S3／Backblaze B2 等）</option>
                </select>
              </div>
            </div>
            <template x-if="cloud.backend === 's3'">
              <div>
                <div class="ns-row">
                  <div class="ns-field">
                    <label>Bucket（必填）</label>
                    <input type="text" x-model="cloud.s3.bucket" placeholder="my-motrix-backups">
                  </div>
                  <div class="ns-field">
                    <label>Region</label>
                    <input type="text" x-model="cloud.s3.region" placeholder="us-east-1">
                  </div>
                </div>
                <div class="ns-row">
                  <div class="ns-field">
                    <label>Endpoint URL（AWS S3 留空）</label>
                    <input type="text" x-model="cloud.s3.endpoint_url" placeholder="https://s3.us-west-000.backblazeb2.com">
                  </div>
                  <div class="ns-field">
                    <label>路徑前綴</label>
                    <input type="text" x-model="cloud.s3.prefix" placeholder="motrix-erp-backups/">
                  </div>
                </div>
              </div>
            </template>
            <div class="ns-actions">
              <button class="btn btn-primary" @click="saveCloudTarget()" :disabled="cloudSaving">
                <span x-show="!cloudSaving">儲存設定</span>
                <span x-show="cloudSaving">儲存中…</span>
              </button>
            </div>
            <div x-show="cloudMsg" x-text="cloudMsg" x-transition
                 :style="cloudIsError ? 'color:#DC2626' : 'color:#16A34A'"
                 style="font-size:13px;margin-top:12px;font-weight:600"></div>
          </div>
        </div>
      </div>
    </template>

  </main>
  <script src="../static/notif.js"></script>
  <script src="../static/sidebar.js"></script>
  <script>
    function companyProfilePage() {
      return {
        session: {},
        cfg: {
          name: '', tax_id: '', contact_info: '', address: '',
          bank_name: '', bank_branch: '', bank_account_name: '', bank_account_number: '',
        },
        // 🔴 座標在畫面上是**字串**，送出時才變數字。
        // ⚠️ 用 `x-model.number` 綁的話，清空會變成 `''` 或 `NaN`，
        // 而後端要的是 `null` —— **`0.0` 是幾內亞灣上的一個點，不是「沒有填」。**
        latText: '', lonText: '', coordWarn: '',
        // 金鑰**不放進 `cfg`**：GET 回的是遮蔽字，混進去就會在存檔時被送回去。
        // 📌 後端已經有安全網（收到遮蔽字視為沒送），而**兩邊都做**是刻意的：
        // 前端不送＝正確的行為，後端擋＝前端回歸時的防線。
        keyText: '', keyMasked: '', keySet: false, keyCleared: false,
        saving: false,
        saved: false,
        msg: '',
        isError: false,
        // 2026-09-16 Passkey 功能暫緩。預設 false：停用是目前的常態，先畫出
        // 卡片再抽掉會讓管理員以為還能設定。由 loadWebauthnConfig() 的回應碼決定。
        passkeyFeatureEnabled: false,
        webauthnRpId: '',
        webauthnOrigin: '',
        webauthnSaving: false,
        webauthnSaved: false,
        webauthnMsg: '',
        webauthnIsError: false,
        webauthnModified: false,
        // ── 系統技術設定（2026-09-11）──
        // sysLoading 是刻意的：四張卡片在 _loadSysSettings() 回來之前不能被操作，
        // 否則使用者填的值會被稍後抵達的回應蓋回預設。實測踩過——填 45 存進去
        // 卻是 30，而且畫面沒有任何異狀。同一類競態稍早在叫料清單也發生過。
        sysLoading: true,
        retention: { local_db_keep_days: 30, cloud_daily_keep_days: 365, cloud_weekly_keep_days: 730, audit_log_keep_days: 365 },
        retSaving: false, retSaved: false, retMsg: '', retIsError: false,
        pdfBase: { configured: '', resolved: '', default: '' },
        pdfSaving: false, pdfSaved: false, pdfMsg: '', pdfIsError: false,
        edgePath: { configured: '', resolved: '' },
        edgeSaving: false, edgeSaved: false, edgeMsg: '', edgeIsError: false,
        cloud: { backend: 'local_drive', s3: { bucket: '', endpoint_url: '', region: 'us-east-1', prefix: 'motrix-erp-backups/' } },
        cloudSaving: false, cloudSaved: false, cloudMsg: '', cloudIsError: false,

        get isSuperadmin() { return this.session.role === 'superadmin' },

        _initDone: false,

        async init() {
          // ⚠️ 這頁的 <body> 同時有 `x-data="companyProfilePage()"` 與 `x-init="init()"`
          // ——Alpine 3 本來就會自動呼叫資料物件的 init()，加上 x-init 寫的那一次
          // **剛好跑兩遍**，而且不會有任何警告。兩遍的後果不只是 API 發兩次：第二次
          // `_loadSysSettings()` 的回應會晚一步抵達，把使用者這段期間改過的欄位
          // （備份天數、雲端備份目標…）用伺服器上的舊值蓋回去，**畫面上完全看不出
          // 發生過什麼事**。這跟 2026-09-11 第三輪在 case-management.js 修掉的是
          // 同一個坑（那次的紀錄也寫明「全站還有 50 個頁面是同樣寫法」），這是第二頁。
          if (this._initDone) return
          this._initDone = true
          this.session = JSON.parse(localStorage.getItem('motrix_session') || '{}')
          if (!this.session.token) { location.replace('login.html'); return }
          const r = await fetch('/api/settings/company-profile', {
            headers: { Authorization: 'Bearer ' + this.session.token }
          })
          if (r.ok) {
            const data = await r.json()
            this.cfg = { ...this.cfg, ...data }
            // ⚠️ 座標可能是 `null` ⇒ 顯示空字串，**不要顯示 `null` 或 `0`**。
            this.latText = data.office_lat == null ? '' : String(data.office_lat)
            this.lonText = data.office_lon == null ? '' : String(data.office_lon)
            // 金鑰回的是遮蔽字（或空字串）。**不放進輸入框**，只當狀態。
            this.keyMasked = data.google_maps_api_key || ''
            this.keySet = !!this.keyMasked
            this.keyText = ''
            this.keyCleared = false
          }
          if (this.isSuperadmin) {
            await this.loadWebauthnConfig()
            await this._loadSysSettings()
          }
        },

        // ── 系統技術設定（2026-09-11 新增前端入口）────────────────────────
        // 這四支端點系統一直在讀，但先前沒有任何畫面，只能直接打 API。
        // 四張卡片各自獨立載入／儲存：其中一支壞掉不該讓其他三張也不能用，
        // 所以 _loadSysSettings() 用 allSettled 而不是 all。
        _authJson() {
          return { Authorization: 'Bearer ' + this.session.token, 'Content-Type': 'application/json' }
        },

        async _loadSysSettings() {
          const h = { Authorization: 'Bearer ' + this.session.token }
          const get = (p) => fetch(p, { headers: h }).then(r => r.ok ? r.json() : null)
          const [ret, pdf, edge, cloud] = await Promise.allSettled([
            get('/api/settings/backup-retention'),
            get('/api/settings/pdf-base-path'),
            get('/api/settings/edge-path'),
            get('/api/settings/cloud-backup-target'),
          ])
          if (ret.status === 'fulfilled' && ret.value) this.retention = { ...this.retention, ...ret.value }
          if (pdf.status === 'fulfilled' && pdf.value) this.pdfBase = { ...this.pdfBase, ...pdf.value }
          if (edge.status === 'fulfilled' && edge.value) this.edgePath = { ...this.edgePath, ...edge.value }
          if (cloud.status === 'fulfilled' && cloud.value) {
            this.cloud = { ...this.cloud, ...cloud.value, s3: { ...this.cloud.s3, ...(cloud.value.s3 || {}) } }
          }
          this.sysLoading = false
        },

        // 四支儲存流程長得一樣，抽出來免得複製四份各自漂移
        async _saveSetting({ url, method, body, prefix, okMsg }) {
          this[prefix + 'Saving'] = true
          this[prefix + 'Msg'] = ''
          try {
            const r = await fetch(url, { method, headers: this._authJson(), body: JSON.stringify(body) })
            if (r.ok) {
              this[prefix + 'Msg'] = okMsg || '設定已儲存'
              this[prefix + 'IsError'] = false
              this[prefix + 'Saved'] = true
              setTimeout(() => this[prefix + 'Saved'] = false, 3000)
              return true
            }
            const d = await r.json().catch(() => ({}))
            this[prefix + 'Msg'] = d.detail || '儲存失敗'
            this[prefix + 'IsError'] = true
          } catch (e) {
            this[prefix + 'Msg'] = '連線異常：' + e.message
            this[prefix + 'IsError'] = true
          } finally {
            this[prefix + 'Saving'] = false
            setTimeout(() => this[prefix + 'Msg'] = '', 5000)
          }
          return false
        },

        async saveRetention() {
          const v = this.retention
          const labels = {
            local_db_keep_days: '本機 DB 快照', cloud_daily_keep_days: '雲端每日備份',
            cloud_weekly_keep_days: '雲端週備份', audit_log_keep_days: '稽核紀錄',
          }
          // 後端一樣會擋 1～3650，這裡先擋是為了指名是哪一欄
          for (const k of Object.keys(labels)) {
            const n = Number(v[k])
            if (!Number.isInteger(n) || n < 1 || n > 3650) {
              this.retMsg = `${labels[k]} 需為 1～3650 之間的整數`
              this.retIsError = true
              setTimeout(() => this.retMsg = '', 5000)
              return
            }
          }
          await this._saveSetting({
            url: '/api/settings/backup-retention', method: 'PATCH', prefix: 'ret',
            body: {
              local_db_keep_days: Number(v.local_db_keep_days),
              cloud_daily_keep_days: Number(v.cloud_daily_keep_days),
              cloud_weekly_keep_days: Number(v.cloud_weekly_keep_days),
              audit_log_keep_days: Number(v.audit_log_keep_days),
            },
          })
        },

        async savePdfBase() {
          const ok = await this._saveSetting({
            url: '/api/settings/pdf-base-path', method: 'PATCH', prefix: 'pdf',
            body: { path: (this.pdfBase.configured || '').trim() },
          })
          // 重新載入才看得到 resolved 變成什麼——清空時尤其重要，
          // 否則畫面還停在舊的實際路徑，看起來像沒生效
          if (ok) await this._loadSysSettings()
        },

        async saveEdgePath() {
          const ok = await this._saveSetting({
            url: '/api/settings/edge-path', method: 'PATCH', prefix: 'edge',
            body: { path: (this.edgePath.configured || '').trim() },
          })
          if (ok) await this._loadSysSettings()
        },

        async saveCloudTarget() {
          if (this.cloud.backend === 's3' && !(this.cloud.s3.bucket || '').trim()) {
            this.cloudMsg = '選擇 S3 時 Bucket 為必填'
            this.cloudIsError = true
            setTimeout(() => this.cloudMsg = '', 5000)
            return
          }
          await this._saveSetting({
            url: '/api/settings/cloud-backup-target', method: 'PUT', prefix: 'cloud',
            body: { backend: this.cloud.backend, s3: this.cloud.s3 },
            okMsg: this.cloud.backend === 's3'
              ? '已切換到 S3——請確認伺服器已設好 access key，並在隔天檢查備份告警'
              : '已切回本機磁碟機',
          })
        },

        async loadWebauthnConfig() {
          const r = await fetch('/api/settings/webauthn-config', {
            headers: { Authorization: 'Bearer ' + this.session.token }
          })
          // 2026-09-16 Passkey 功能暫緩：這支停用時回 404，直接拿它當開關訊號，
          // 不必為了決定一張卡片顯不顯示，再多打一次
          // /api/system/webauthn-config-status。這支端點一直都存在，
          // 所以 404 只會是「功能被關掉」，不會是舊版後端沒有這條路由。
          this.passkeyFeatureEnabled = r.status !== 404
          if (r.ok) {
            const data = await r.json()
            this.webauthnRpId = data.rp_id || ''
            this.webauthnOrigin = data.origin || ''
          }
        },

        async saveWebauthnConfig() {
          const rpId = (this.webauthnRpId || '').trim()
          const origin = (this.webauthnOrigin || '').trim()
          if ((rpId === '') !== (origin === '')) {
            this.webauthnMsg = '必須同時填入或同時清空兩個欄位'
            this.webauthnIsError = true
            setTimeout(() => this.webauthnMsg = '', 4000)
            return
          }
          this.webauthnSaving = true; this.webauthnMsg = ''
          const r = await fetch('/api/settings/webauthn-config', {
            method: 'PATCH',
            headers: { Authorization: 'Bearer ' + this.session.token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ rp_id: rpId || null, origin: origin || null }),
          })
          this.webauthnSaving = false
          if (r.ok) {
            this.webauthnMsg = '設定已儲存'; this.webauthnIsError = false
            this.webauthnSaved = true; this.webauthnModified = false
            setTimeout(() => this.webauthnSaved = false, 3000)
          } else {
            const d = await r.json().catch(() => ({}))
            this.webauthnMsg = d.detail || '儲存失敗'; this.webauthnIsError = true
          }
          setTimeout(() => this.webauthnMsg = '', 4000)
        },

        // 貼上 `24.2549239, 120.5316259` 這種一串時自動拆成兩欄。
        // ⚠️ 只在「左邊那格裡有兩個數字」時才動經度欄 ——
        // 使用者正在手打緯度時不可以去改另一格。
        splitPastedCoord() {
          const found = String(this.latText || '').match(/-?\d+(?:\.\d+)?/g)
          if (!found || found.length < 2) return
          this.latText = found[0]
          this.lonText = found[1]
        },

        // 空字串 ⇒ `null`（沒有填）。數字 ⇒ 數字。其他 ⇒ `undefined`（＝有問題）。
        // 🔑 三態，不是兩態：把「打錯字」當成「沒有填」的話，
        // **使用者會看到儲存成功而座標被清掉了。**
        _coordValue(text) {
          const raw = String(text || '').trim()
          if (!raw) return null
          const n = Number(raw)
          return Number.isFinite(n) ? n : undefined
        },

        async save() {
          this.coordWarn = ''
          const lat = this._coordValue(this.latText)
          const lon = this._coordValue(this.lonText)
          if (lat === undefined || lon === undefined) {
            this.coordWarn = '座標必須是數字（或兩格都留空）。這次沒有儲存。'
            return
          }
          // ⚠️ 只填一格 ⇒ 擋下來。一個只有緯度的點畫不出來，
          // 而後端會把另一格存成 null ⇒ 畫面上看起來像「沒填」。
          if ((lat === null) !== (lon === null)) {
            this.coordWarn = '緯度與經度要一起填，或一起留空。這次沒有儲存。'
            return
          }
          this.saving = true; this.msg = ''
          // 🔴 **明確組出要送的東西**，不要把 `cfg` 整包丟出去：
          // `cfg.google_maps_api_key` 裡是 GET 回來的**遮蔽字**。
          const payload = { ...this.cfg, office_lat: lat, office_lon: lon }
          delete payload.google_maps_api_key
          if (this.keyCleared) {
            payload.google_maps_api_key = ''      // 明確清除
          } else if (this.keyText.trim()) {
            payload.google_maps_api_key = this.keyText.trim()
          }                                        // 兩者皆非 ⇒ **不送**＝保留現值
          const r = await fetch('/api/settings/company-profile', {
            method: 'PUT',
            headers: { Authorization: 'Bearer ' + this.session.token, 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          })
          this.saving = false
          if (r.ok) {
            this.msg = '設定已儲存'; this.isError = false
            this.saved = true; setTimeout(() => this.saved = false, 3000)
            // 存完把金鑰欄位歸位：輸入框清空、狀態改成「已設定」。
            // ⚠️ 不重新 GET —— 那會把使用者其他還沒存的欄位蓋掉。
            if (this.keyCleared) { this.keySet = false; this.keyMasked = '' }
            else if (this.keyText.trim()) {
              this.keySet = true
              this.keyMasked = '\u2022'.repeat(8) + this.keyText.trim().slice(-4)
            }
            this.keyText = ''; this.keyCleared = false
          } else {
            const d = await r.json().catch(() => ({}))
            this.msg = d.detail || '儲存失敗'; this.isError = true
          }
          setTimeout(() => this.msg = '', 4000)
        },
      }
    }
  </script>
