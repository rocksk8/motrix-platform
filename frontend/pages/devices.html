<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{if(localStorage.getItem('motrix_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../static/favicon.png">
  <title>設備登載 — MOTRIX 專案管理系統</title>
  <script src="../static/auth-guard.js"></script>
  <script defer src="../static/vendor/alpine-3.17.1.min.js"></script>
  <link rel="stylesheet" href="../css/style.css?v=20260805g">
  <style>
    [x-cloak]{display:none!important}
    .page-main{margin-left:var(--sidebar-w);margin-top:var(--topbar-h);padding:28px 32px;min-height:calc(calc(100vh / var(--fz,1)) - var(--topbar-h));background:var(--white)}

    /* stats strip */
    .stat-strip{display:flex;gap:12px;margin-bottom:20px}
    .stat-pill{display:flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid var(--border-light);border-radius:var(--radius-lg);background:#fff;min-width:110px}
    /* 壓力帶的段在這一頁是可點的篩選器（共用的 .vm-andon__seg 是純顯示） */
    .dv-seg{border:none;cursor:pointer;text-align:left;font-family:var(--font-zh)}
    .dv-seg:hover{background:var(--icon-btn-bg)}
    .dv-seg.on{outline:2px solid var(--accent);outline-offset:-2px}
    .stat-pill__val{font-size:20px;font-weight:700;font-family:LINE Seed TW_OTF, sans-serif;line-height:1}
    .stat-pill__lbl{font-size:10px;color:var(--text-dim);font-family:LINE Seed TW_OTF, sans-serif;letter-spacing:.06em;margin-top:2px}

    /* filter bar */
    .filter-bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
    .search-wrap{position:relative;flex:0 0 300px}
    .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-dim);pointer-events:none}
    .search-input{width:100%;padding:8px 11px 8px 34px;border:1px solid var(--border-light);border-radius:var(--radius);font-size:13px;font-family:var(--font-zh);background:#fff;outline:none;box-sizing:border-box}
    .search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
    .fi{padding:7px 10px;border:1px solid var(--border-light);border-radius:var(--radius);font-size:12px;font-family:var(--font-zh);background:#fff;color:var(--text-secondary);outline:none;cursor:pointer}

    /* tabs */
    .tab__cnt{font-family:LINE Seed TW_OTF, sans-serif;font-size:10px;font-weight:600;margin-left:4px;padding:1px 5px;border-radius:8px;background:#F0EEE9}
    .tab.on .tab__cnt{background:var(--accent-light);color:var(--accent)}

    /* table */
    .panel{background:#fff;border:1px solid var(--border-light);border-radius:var(--radius-lg);overflow:hidden}
    .data-table{width:100%;border-collapse:collapse;font-size:13px}
    .data-table th{padding:10px 14px;text-align:left;font-size:10px;font-family:LINE Seed TW_OTF, sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);font-weight:500;background:#FAFAF8;border-bottom:1px solid var(--border-light);white-space:nowrap}
    .data-table td{padding:11px 14px;border-bottom:1px solid #F0EEE9;vertical-align:middle;color:var(--text-primary)}
    .data-table tr:last-child td{border-bottom:none}
    .data-table tr:hover td{background:#FDFCFA;cursor:pointer}
    .mono{font-family:LINE Seed TW_OTF, sans-serif;font-size:11px;letter-spacing:.03em}

    /* warranty badge */
    .wb{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:11px;font-family:LINE Seed TW_OTF, sans-serif;font-weight:600;gap:4px}
    .wb-expired{background:var(--danger-light);color:var(--danger)}
    .wb-soon{background:var(--warning-light);color:var(--warning)}
    .wb-ok{background:var(--success-light);color:var(--success)}
    .wb-none{background:#F3F4F6;color:#6B7280}

    /* deal tag badge */
    .dt{display:inline-flex;padding:2px 7px;border-radius:3px;font-size:10px;font-family:LINE Seed TW_OTF, sans-serif;font-weight:600}
    .dt-active{background:#DBEAFE;color:var(--accent-hover)}
    .dt-closed{background:#F0EEE9;color:#6B7280}
    .dt-none{background:#F3F4F6;color:#9CA3AF}

    /* right detail pane */
    .detail-pane{position:fixed;right:0;top:var(--topbar-h);width:380px;height:calc(calc(100vh / var(--fz,1)) - var(--topbar-h));background:#fff;border-left:1px solid var(--border-light);box-shadow:var(--shadow-lg);z-index:100;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease}
    .detail-pane.open{transform:translateX(0)}
    .detail-head{padding:16px 20px;border-bottom:1px solid var(--border-light);display:flex;align-items:flex-start;gap:10px}
    .detail-body{flex:1;overflow-y:auto;padding:18px 20px}
    .detail-close{margin-left:auto;width:28px;height:28px;border-radius:4px;border:none;background:#F0EEE9;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
    .detail-close:hover{background:var(--danger-light);color:var(--danger)}
    .d-row{display:flex;gap:8px;margin-bottom:10px;font-size:12px}
    .d-lbl{color:var(--text-dim);min-width:72px;flex-shrink:0}
    .d-val{color:var(--text-primary);font-weight:500;word-break:break-all;font-family:LINE Seed TW_OTF, sans-serif}
    .d-divider{border:none;border-top:1px solid var(--border-light);margin:14px 0}

    /* empty */
    .empty{text-align:center;padding:60px 20px;color:var(--text-dim)}

    @keyframes spin{to{transform:rotate(360deg)}}
  
  /* -- Mobile RWD -- */
  @media (max-width:767px) {
    .detail-pane { width:100% !important; left:0 !important; right:0; }
  }
  </style>
</head>
<body x-data="devicesPage()" x-init="init()" x-cloak>

    <header id="app-topbar" class="topbar"></header>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- SIDEBAR -->

  <aside class="sidebar" id="app-sidebar"></aside>

  <!-- MAIN -->
  <div class="page-main" :class="{'pr-96': !!selectedId}" style="transition:padding-right .22s">

    <!-- Page header -->
    <div class="pg">
      <div class="pg__l">
        <div class="pg__eyebrow">設備管理</div>
        <h1 class="pg__t">設備登載</h1>
        <p class="pg__s">來源：已成案 / 已結案的案件設備</p>
</div>
    </div>

    <!-- ── 保固時效壓力帶（2026-09-14）──────────────────────────────
         原本上方 4 格統計是**死的數字**：看得到「保固已過期 3」卻點不下去，
         要看是哪 3 台得再去下面的「保固狀態」下拉選一次——而那個下拉提供的
         正是同樣這四個狀態。兩個地方講同一件事，數字在這邊、篩選在那邊。

         收成一條帶子：每一段自己就是篩選器、自己帶數字。級距與配色跟
         保固追蹤頁一致（含 90 天），兩頁看同一批設備不該有兩套分級。
         「客戶數」不是保固狀態、也不是篩選軸，移到右邊當註記。 -->
    <div class="vm-andon" style="margin-bottom:12px">
      <button type="button" class="vm-andon__seg dv-seg" :class="{on: filterWarranty===''}"
              @click="filterWarranty=''">
        <span class="vm-andon__val" x-text="devices.length"></span>
        <span class="vm-andon__lbl">設備總數<small x-text="uniqueCustomers + ' 家客戶'"></small></span>
      </button>
      <template x-for="b in WB_BUCKETS" :key="b.key">
        <button type="button" class="vm-andon__seg dv-seg" :class="{on: filterWarranty===b.key}"
                @click="filterWarranty = (filterWarranty===b.key ? '' : b.key)">
          <span class="vm-andon__val" :style="'color:' + b.color" x-text="wbCount(b.key)"></span>
          <span class="vm-andon__lbl"><span x-text="b.label"></span><small x-text="b.sub"></small></span>
        </button>
      </template>
      <div class="vm-andon__bar">
        <span class="vm-andon__track"
              :title="WB_BUCKETS.map(b => b.label + ' ' + wbCount(b.key) + ' 台').join('／')">
          <template x-for="b in WB_BUCKETS" :key="b.key">
            <i :style="'width:' + wbPct(b.key) + '%;background:' + b.color"></i>
          </template>
        </span>
      </div>
    </div>

    <!-- Filter bar -->
    <div class="filter-bar">
      <div class="search-wrap">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input class="search-input" type="text" x-model="search" placeholder="搜尋設備名稱、SN、MAC、地點…">
      </div>
      <select class="fi" x-model="filterCustomer">
        <option value="">全部客戶</option>
        <template x-for="c in customerOptions" :key="c">
          <option :value="c" x-text="c"></option>
        </template>
      </select>
      <span style="font-size:11px;color:var(--text-dim);margin-left:auto;font-family:LINE Seed TW_OTF, sans-serif" x-text="filtered.length + ' 台'"></span>
    </div>

    <!-- Tabs -->
    <div class="tab-bar">
      <button class="tab" :class="{on: tabDeal===''}" @click="tabDeal=''">
        全部<span class="tab__cnt" x-text="devices.length"></span>
      </button>
      <button class="tab" :class="{on: tabDeal==='已成案'}" @click="tabDeal='已成案'">
        已成案<span class="tab__cnt" x-text="devices.filter(d=>d.dealTag==='已成案').length"></span>
      </button>
      <button class="tab" :class="{on: tabDeal==='已結案'}" @click="tabDeal='已結案'">
        已結案<span class="tab__cnt" x-text="devices.filter(d=>d.dealTag==='已結案').length"></span>
      </button>
    </div>

    <!-- Loading -->
    <template x-if="loading">
      <div class="empty">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin .8s linear infinite;color:var(--accent)"><path d="M21 12a9 9 0 11-18 0"/></svg>
        <div style="margin-top:12px;font-size:12px">載入中…</div>
      </div>
    </template>

    <!-- Table -->
    <template x-if="!loading">
      <div class="panel">
        <template x-if="filtered.length === 0">
          <div class="empty">
            <div style="font-size:32px;opacity:.3;margin-bottom:10px">🖥️</div>
            <div style="font-size:13px;font-weight:600;color:var(--text-secondary)">
              <template x-if="search || filterCustomer || filterWarranty">
                <span>沒有符合的設備</span>
              </template>
              <template x-if="!search && !filterCustomer && !filterWarranty">
                <span>尚無設備資料</span>
              </template>
            </div>
            <div style="font-size:12px;color:var(--text-dim);margin-top:6px" x-show="!search && !filterCustomer && !filterWarranty">
              在案件管理的設備 tab 新增設備後，並同步叫料管控，設備即會出現在此
            </div>
          </div>
        </template>
        <template x-if="filtered.length > 0">
          <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr>
                <th>設備名稱</th>
                <th>SN 序號</th>
                <th>MAC 位址</th>
                <th>客戶</th>
                <th>案件</th>
                <th>安裝地點</th>
                <th>保固起始</th>
                <th>保固到期</th>
                <th>保固狀態</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="d in filtered" :key="d.id + '|' + d.quoteNo">
                <tr @click="select(d)">
                  <td>
                    <div style="font-weight:500" x-text="d.name || '(未命名)'"></div>
                    <div style="font-size:10px;color:var(--text-dim)" x-text="d.note || ''"></div>
                  </td>
                  <td><span class="mono" x-text="d.sn || '—'"></span></td>
                  <td><span class="mono" x-text="d.mac || '—'"></span></td>
                  <td style="font-size:12px" x-text="d.customer || '—'"></td>
                  <td>
                    <a :href="'case-management.html?q=' + d.quoteNo"
                       style="font-size:11px;font-family:LINE Seed TW_OTF, sans-serif;color:var(--accent);text-decoration:none"
                       x-text="d.quoteNo" @click.stop></a>
                  </td>
                  <td style="font-size:12px" x-text="d.location || '—'"></td>
                  <td style="font-size:11px;font-family:LINE Seed TW_OTF, sans-serif" x-text="(d.warrantyStart||'').slice(0,10) || '—'"></td>
                  <td style="font-size:11px;font-family:LINE Seed TW_OTF, sans-serif" x-text="d.expiryDate || '—'"></td>
                  <td>
                    <span class="wb" :class="wbCls(d)">
                      <span x-text="wbLabel(d)"></span>
                    </span>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
          </div>
        </template>
      </div>
    </template>
  </div>

  <!-- Detail pane -->
  <div class="detail-pane" :class="{open: !!selectedId}">
    <template x-if="selected">
      <div style="display:contents">
        <div class="detail-head">
          <div>
            <div style="font-weight:700;font-size:15px" x-text="selected.name || '(未命名)'"></div>
            <div style="font-size:11px;color:var(--text-dim);margin-top:3px" x-text="selected.customer"></div>
          </div>
          <button class="detail-close" @click="selectedId=null">×</button>
        </div>
        <div class="detail-body">

          <div style="font-size:10px;font-family:LINE Seed TW_OTF, sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);font-weight:600;margin-bottom:10px">設備資訊</div>

          <div class="d-row"><span class="d-lbl">設備名稱</span><span class="d-val" x-text="selected.name || '—'"></span></div>
          <div class="d-row"><span class="d-lbl">SN 序號</span><span class="d-val" x-text="selected.sn || '—'"></span></div>
          <div class="d-row"><span class="d-lbl">MAC 位址</span><span class="d-val" x-text="selected.mac || '—'"></span></div>
          <div class="d-row"><span class="d-lbl">安裝地點</span><span class="d-val" style="font-family:var(--font-zh)" x-text="selected.location || '—'"></span></div>
          <template x-if="selected.note">
            <div class="d-row"><span class="d-lbl">備注</span><span class="d-val" style="font-family:var(--font-zh)" x-text="selected.note"></span></div>
          </template>

          <hr class="d-divider">
          <div style="font-size:10px;font-family:LINE Seed TW_OTF, sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);font-weight:600;margin-bottom:10px">保固資訊</div>

          <div class="d-row"><span class="d-lbl">保固起始</span><span class="d-val" x-text="(selected.warrantyStart||'').slice(0,10) || '—'"></span></div>
          <div class="d-row"><span class="d-lbl">保固月數</span><span class="d-val" x-text="(selected.warrantyMonths || 12) + ' 個月'"></span></div>
          <div class="d-row">
            <span class="d-lbl">到期日</span>
            <span class="d-val" x-text="selected.expiryDate || '—'"></span>
          </div>
          <div class="d-row">
            <span class="d-lbl">保固狀態</span>
            <span class="wb" :class="wbCls(selected)" x-text="wbLabel(selected)"></span>
          </div>

          <hr class="d-divider">
          <div style="font-size:10px;font-family:LINE Seed TW_OTF, sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);font-weight:600;margin-bottom:10px">案件資訊</div>

          <div class="d-row"><span class="d-lbl">客戶</span><span class="d-val" style="font-family:var(--font-zh)" x-text="selected.customer || '—'"></span></div>
          <div class="d-row">
            <span class="d-lbl">報價單</span>
            <a :href="'case-management.html?q=' + selected.quoteNo"
               style="font-family:LINE Seed TW_OTF, sans-serif;color:var(--accent);text-decoration:none;font-size:12px"
               x-text="selected.quoteNo"></a>
          </div>
          <div class="d-row">
            <span class="d-lbl">案件進度</span>
            <span class="dt" :class="selected.dealTag==='已成案' ? 'dt-active' : selected.dealTag==='已結案' ? 'dt-closed' : 'dt-none'"
                  x-text="selected.dealTag || '—'"></span>
          </div>

          <hr class="d-divider">
          <a :href="'case-management.html?q=' + selected.quoteNo"
             style="display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;background:var(--accent);color:#fff;border-radius:var(--radius);font-size:12px;font-family:var(--font-zh);font-weight:500;text-decoration:none">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>
            前往案件管理
          </a>
        </div>
      </div>
    </template>
  </div>

  <script>
  const API = '/api'

  function devicesPage() {
    return {
      session: {},
      devices: [],
      loading: true,
      search: '',
      filterCustomer: '',
      filterWarranty: '',
      tabDeal: '',
      selectedId: null,

      // 🔴 Alpine 3 看到資料物件有 init() 就會**自己叫一次**，
      //    而 body 上那個明著呼叫初始化的屬性會再叫一次 ⇒ **跑兩遍**。
      // ☠️ 後果不只是 API 發兩次：第二次的回應晚一步抵達，
      //    會把使用者這段期間改過的欄位用伺服器上的舊值**無聲蓋回去**。
      _initDone: false,

      async init() {
        if (this._initDone) return
        this._initDone = true
        const s = JSON.parse(localStorage.getItem('motrix_session') || '{}')
        if (!s.token) { location.href = 'login.html'; return }
        this.session = s
        await this.load()
        this.loading = false
      },

      async load() {
        try {
          const r = await fetch(`${API}/devices`, {
            headers: { Authorization: 'Bearer ' + this.session.token }
          })
          if (r.ok) {
            const data = await r.json()
            this.devices = data.items || []
          }
        } catch {}
      },

      get filtered() {
        let list = this.devices
        if (this.tabDeal) list = list.filter(d => d.dealTag === this.tabDeal)
        if (this.filterCustomer) list = list.filter(d => d.customer === this.filterCustomer)
        if (this.filterWarranty) {
          list = list.filter(d => {
            // 級距與保固追蹤頁的 wbKey() 一致——兩頁看的是同一批設備，
            // 分級不同會讓兩邊的數字對不起來
            const dl = d.daysLeft
            if (this.filterWarranty === 'expired') return dl !== null && dl < 0
            if (this.filterWarranty === 'soon')    return dl !== null && dl >= 0 && dl <= 30
            if (this.filterWarranty === 'q')       return dl !== null && dl > 30 && dl <= 90
            if (this.filterWarranty === 'ok')      return dl !== null && dl > 90
            if (this.filterWarranty === 'none')    return dl === null
            return true
          })
        }
        const q = (this.search || '').trim().toLowerCase()
        if (q) list = list.filter(d =>
          [d.name, d.sn, d.mac, d.customer, d.location, d.quoteNo]
            .some(v => (v || '').toLowerCase().includes(q))
        )
        return list
      },

      get customerOptions() {
        return [...new Set(this.devices.map(d => d.customer).filter(Boolean))].sort()
      },
      get expiredCount() { return this.devices.filter(d => d.daysLeft !== null && d.daysLeft < 0).length },
      get soonCount()    { return this.devices.filter(d => d.daysLeft !== null && d.daysLeft >= 0 && d.daysLeft <= 30).length },

      // ── 保固時效壓力帶（2026-09-14）────────────────────────────────
      // 級距、標籤與配色跟 warranty.html 的 WB_BUCKETS 保持一致。
      WB_BUCKETS: [
        { key: 'expired', label: '已過期',  sub: '需立即處理', color: 'var(--danger)' },
        { key: 'soon',    label: '30 天內', sub: '準備續約',   color: 'var(--warning)' },
        { key: 'q',       label: '90 天內', sub: '可提前接觸', color: 'var(--orange)' },
        { key: 'ok',      label: '保固中',  sub: '無須動作',   color: 'var(--success)' },
        { key: 'none',    label: '無紀錄',  sub: '缺保固資料', color: 'var(--text-dim)' },
      ],
      wbCount(key) {
        return this.devices.filter(d => {
          const dl = d.daysLeft
          if (key === 'none')    return dl === null
          if (dl === null)       return false
          if (key === 'expired') return dl < 0
          if (key === 'soon')    return dl >= 0 && dl <= 30
          if (key === 'q')       return dl > 30 && dl <= 90
          return dl > 90
        }).length
      },
      wbPct(key) {
        const t = this.devices.length
        if (!t) return 0
        const n = this.wbCount(key)
        return n ? Math.max(2, Math.round(n / t * 100)) : 0
      },
      get uniqueCustomers() { return new Set(this.devices.map(d => d.customer).filter(Boolean)).size },

      get selected() { return this.devices.find(d => d.id + '|' + d.quoteNo === this.selectedId) || null },
      select(d) { this.selectedId = d.id + '|' + d.quoteNo },

      wbCls(d) {
        const dl = d.daysLeft
        if (dl === null || dl === undefined) return 'wb-none'
        if (dl < 0)  return 'wb-expired'
        if (dl <= 30) return 'wb-soon'
        return 'wb-ok'
      },
      wbLabel(d) {
        const dl = d.daysLeft
        if (dl === null || dl === undefined) return '無紀錄'
        if (dl < 0)  return `已過期 ${Math.abs(dl)} 天`
        if (dl === 0) return '今日到期'
        if (dl <= 30) return `${dl} 天後到期`
        return '保固中'
      },

      logout() {
        fetch(`${API}/auth/logout`, { method:'POST', headers:{ Authorization:'Bearer '+(this.session.token||'') } }).catch(()=>{})
        localStorage.removeItem('motrix_session')
        location.href = 'login.html'
      },
    }
  }
  </script>
  <script src="../static/notif.js"></script>
  <script src="../static/sidebar.js"></script>
</body>
</html>
