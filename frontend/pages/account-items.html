<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{if(localStorage.getItem('motrix_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../static/favicon.png">
  <title>會計科目 - MOTRIX 專案管理系統</title>
  <script src="../js/account-items.js"></script>
  <script src="../static/auth-guard.js"></script>
  <script defer src="../static/vendor/alpine-3.17.1.min.js"></script>
  <link rel="stylesheet" href="../css/style.css?v=20260805g">
  <style>
    [x-cloak]{display:none!important}
    .page-main{margin-left:var(--sidebar-w);margin-top:var(--topbar-h);padding:28px 32px;min-height:calc(calc(100vh / var(--fz,1)) - var(--topbar-h));background:var(--white)}

    .ai-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
    .ai-title{font-size:20px;font-weight:700;font-family:var(--font-zh);color:var(--text-primary)}
    .ai-counts{font-size:13px;color:var(--text-secondary);font-family:var(--font-zh)}
    .ai-counts b{color:var(--text-primary)}
    .ai-src-note{font-size:12px;color:var(--text-secondary);font-family:var(--font-zh);margin-bottom:18px;line-height:1.7}

    .ai-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
    .ai-btn{padding:5px 13px;border-radius:var(--radius);border:1px solid var(--border-light);background:#fff;color:var(--text-secondary);font-size:12px;font-family:var(--font-zh);cursor:pointer}
    .ai-btn:hover{background:#F0EEE9}
    .ai-search{padding:6px 11px;border-radius:var(--radius);border:1px solid var(--border-light);font-size:13px;font-family:var(--font-zh);min-width:230px}
    .ai-hint{font-size:12px;color:var(--text-secondary);font-family:var(--font-zh);margin-left:auto}

    .ai-tree{border:1px solid var(--border-light);border-radius:var(--radius);overflow:hidden}
    .ai-row{display:flex;align-items:center;gap:9px;padding:7px 12px;border-bottom:1px solid var(--border-light);font-family:var(--font-zh);font-size:13px}
    .ai-row:last-child{border-bottom:none}
    .ai-row:hover{background:#FAF9F6}
    /* 🔑 pointer-events:none —— 點擊讓給整列處理（見下方 ai-row 的註解）。 */
    .ai-toggle{width:17px;height:17px;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid var(--border-light);border-radius:3px;background:#fff;font-size:10px;color:var(--text-secondary);line-height:1;pointer-events:none}
    /* 有子項的列整列可點，而且要看得出來可以點。 */
    .ai-row.has-kids{cursor:pointer}
    .ai-row.has-kids:hover .ai-toggle{border-color:var(--accent,#888);background:#F0EEE9}
    .ai-toggle.leaf{border-color:transparent;background:transparent;cursor:default;color:transparent}
    .ai-code{font-family:var(--font-mono,monospace);font-size:12px;color:var(--text-secondary);min-width:74px;flex:none}
    .ai-name{color:var(--text-primary)}
    .ai-name-en{color:var(--text-dim,#6B6B6B);font-size:11px}
    .ai-kids{font-size:11px;color:var(--text-secondary);background:#F0EEE9;border-radius:9px;padding:1px 7px;flex:none}
    .ai-lv1 .ai-name{font-weight:700}
    .ai-lv2 .ai-name{font-weight:600}

    .ai-tag{font-size:11px;padding:1px 7px;border-radius:9px;flex:none;font-family:var(--font-zh)}
    .ai-tag.statutory{background:#EFF6FF;color:#1D4ED8;border:1px solid #BFDBFE}
    .ai-tag.system_default{background:#FFFBEB;color:#B45309;border:1px solid #FDE68A}
    .ai-tag.custom{background:#F0FDF4;color:#15803D;border:1px solid #BBF7D0}
    .ai-lock{font-size:11px;color:var(--text-secondary);flex:none}
    .ai-empty{padding:40px;text-align:center;color:var(--text-secondary);font-family:var(--font-zh);font-size:13px}
  </style>
</head>
<body x-data="accountItemsPage()" x-init="init()" x-cloak>

  <header id="app-topbar" class="topbar"></header>
  <div id="sidebar-root"></div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div>
    <main class="page-main">

      <div class="ai-head">
        <div class="ai-title">會計科目</div>
        <!-- 🔑 總數放在標題旁邊，而不是只放在樹裡面。
             ☠️ 預設收合到第二層 ⇒ 畫面上只有 28 列 ⇒ 少了這個數字，
                使用者會以為整個系統就這麼多科目。 -->
        <div class="ai-counts" x-show="loaded">
          共 <b x-text="total"></b> 筆
          <template x-for="s in sourceOrder" :key="s">
            <span x-show="bySource[s]">
              <span x-text="sourceLabel[s]"></span>
              <b x-text="bySource[s] || 0"></b> 筆
            </span>
          </template>
          <!-- `CA1 §6`：自建總數要顯示在頁面上，且由後端算（不要前端自己數）。 -->
          <span x-show="customCount">
            ・自建 <b x-text="customCount"></b> 筆
            <span x-show="customInactiveCount">（含停用 <b x-text="customInactiveCount"></b> 筆）</span>
          </span>
        </div>
      </div>

      <!-- ⚠️ 這段是**寫給使用者看的**，不是註解：
           `561 勞務成本` 掛在 `51 銷貨成本` 底下看起來像分類錯了，
           而那是公告版本自己的編排。不先說的話他會當成缺陷回報。 -->
      <div class="ai-src-note">
        依經濟部公告《商業會計項目表》112 年度及以後適用版本建立，法定項目不可修改或刪除。<br>
        部分項目的層級編排沿用公告原文（例如「勞務成本」列在「銷貨成本」之下），本系統未做調整。
      </div>

      <div class="ai-bar">
        <button class="ai-btn" @click="expandTo(1)">只看一級</button>
        <button class="ai-btn" @click="expandTo(2)">展開到二級</button>
        <button class="ai-btn" @click="expandAll()">全部展開</button>
        <input class="ai-search" type="search" x-model="q"
               placeholder="搜尋代號或名稱…">
        <div class="ai-hint" x-show="q.trim()" x-text="matchHint"></div>
      </div>

      <div class="ai-toggle-err" x-show="toggleError" x-text="toggleError"
           style="color:var(--danger);font-size:12px;margin-bottom:10px"
           @click="toggleError = ''"></div>

      <div class="ai-tree" x-show="loaded">
        <!-- 🔴 展開／收合掛在**整列**上，不是只掛在那個小三角上。
             實測（2026-09-23）：展開鈕 17×17px，而一列是 1906×36px
             ⇒ 可點面積只有 **0.42%**，其餘 99.58% 的列面積對點擊是死的。
             ☠️ 而點不到的症狀不是錯誤訊息，是「**我點了它沒反應**」——
                使用者會以為功能壞了，而不會以為自己差了幾個像素。
             ⚠️ 那個 `<span>` 設 `pointer-events:none`：讓它把點擊讓給整列，
                否則同一次點擊會觸發兩次 toggle（展開又立刻收合，**看起來完全沒反應**）。 -->
        <template x-for="row in visibleRows" :key="row.code">
          <div class="ai-row" :class="['ai-lv' + row.level, row.kids ? 'has-kids' : '']"
               @click="row.kids && toggle(row.code)"
               :style="'padding-left:' + (12 + (row.level - 1) * 22) + 'px'">
            <span class="ai-toggle" :class="{leaf: !row.kids}"
                  x-text="!row.kids ? '' : (open[row.code] ? '−' : '+')"></span>
            <span class="ai-code" x-text="row.code"></span>
            <span class="ai-name" x-text="row.name"></span>
            <span class="ai-name-en" x-show="row.name_en" x-text="row.name_en"></span>
            <!-- 🔑 收合時這個數字是「底下還有東西」的唯一訊號 -->
            <span class="ai-kids" x-show="row.kids && !open[row.code]"
                  x-text="row.kids + ' 項'"></span>
            <span style="flex:1"></span>
            <span class="ai-tag" :class="row.source"
                  x-text="sourceLabel[row.source] || row.source"></span>
            <!-- `CA1 §2③`：自建的要在畫面上看得出是自建的——上面那個 `.ai-tag`
                 已經做到「自訂」；這裡另外標「已停用」，**不要只靠顏色**
                 （色盲／黑白列印讀不到），字本身就是訊號。 -->
            <span class="ai-tag" x-show="!row.is_active"
                  style="background:#F3F4F6;color:var(--text-dim,#6B6B6B);border:1px solid var(--border-light)"
                  >已停用</span>
            <!-- 🔴 「不可編輯」必須在**按下去之前**就說出來。
                 ☠️ 少了它，使用者按下編輯才被資料層擋，
                    而他看到的是 RAISE(ABORT) 那句話。 -->
            <span class="ai-lock" x-show="row.source === 'statutory'" title="法定項目：不可修改、不可刪除">🔒 唯讀</span>

            <!-- `CA1 §5`：延伸建立與停用／啟用都是 superadmin 專屬端點，
                 前端一致地只給 superadmin 看得到這兩個動作。
                 每個按鈕自己 `.stop`，不是包一層外殼——外殼沒有處理常式時
                 Alpine 的 `.stop` 修飾詞不會生效。 -->
            <span style="display:flex;gap:6px;flex:none" x-show="isSuperadmin">
              <button class="btn btn-ghost btn-sm" @click.stop="openExtend(row)">＋延伸</button>
              <button class="btn btn-sm" :class="row.is_active ? 'btn-danger' : 'btn-success'"
                      x-show="row.source !== 'statutory' && pendingToggle !== row.code"
                      @click.stop="askToggleActive(row)"
                      x-text="row.is_active ? '停用' : '啟用'"></button>
              <span style="display:flex;gap:4px;align-items:center;font-size:12px"
                    x-show="row.source !== 'statutory' && pendingToggle === row.code">
                <span x-text="row.is_active ? '確定停用？' : '確定啟用？'"></span>
                <button class="btn btn-sm btn-danger" :disabled="toggleBusy === row.code"
                        @click.stop="confirmToggleActive(row)">是</button>
                <button class="btn btn-sm btn-ghost" @click.stop="cancelToggle()">取消</button>
              </span>
            </span>
          </div>
        </template>
        <div class="ai-empty" x-show="!visibleRows.length"
             x-text="q.trim() ? '沒有符合的科目。' : '目前沒有會計科目。'"></div>
      </div>

      <div class="ai-empty" x-show="!loaded" x-text="loadError || '載入中…'"></div>

      <!-- `CA1 §5`：延伸建立的彈窗。`code` 不給前端填——由後端算
           （同 `voucher_no` 的理由：前端不發號），這裡只收科目名稱。 -->
      <div class="modal-overlay" x-show="extendOpen" x-cloak @click.self="closeExtend()">
        <div class="modal-box" style="max-width:420px">
          <div class="modal-head">
            <div style="font-weight:700" x-text="'延伸建立 · ' + extendParentLabel"></div>
            <button class="btn btn-ghost btn-sm" @click="closeExtend()">✕</button>
          </div>
          <div class="modal-body">
            <div style="font-size:12px;color:var(--text-secondary);margin-bottom:10px">
              新代號將是 <b x-text="extendParent + '-N'"></b>（流水號由系統決定，不由這裡填）。
            </div>
            <input class="ai-search" style="width:100%;box-sizing:border-box" type="text"
                   x-model="extendName" placeholder="科目名稱" x-ref="extendNameInput"
                   x-effect="extendOpen && $nextTick(() => $refs.extendNameInput.focus())"
                   @keydown.enter="submitExtend()">
            <div style="color:var(--danger);font-size:12px;margin-top:8px"
                 x-show="extendError" x-text="extendError"></div>
          </div>
          <div class="modal-foot">
            <button class="btn btn-ghost" @click="closeExtend()">取消</button>
            <button class="btn btn-primary" :disabled="extendBusy" @click="submitExtend()">
              <span x-text="extendBusy ? '建立中…' : '建立'"></span>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- ⚠️ `notif.js` 必須與 `sidebar.js` 成對出現：`sidebar.js` 無條件輸出
       `x-data="globalSearchStore()"`（:196）與 `x-data="notifStore()"`（:377），
       而那兩支定義在 `notif.js` 裡。
       ☠️ 少載它的症狀**不是錯誤畫面**：全域搜尋框與通知鈴鐺變成死的，
          而版面其餘部分完全正常 ⇒ 使用者不會報修，
          **他會以為那個框本來就長那樣**。 -->
  <script src="../static/notif.js"></script>
  <script src="../static/sidebar.js"></script>
</body>
</html>
