<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{if(localStorage.getItem('motrix_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../static/favicon.png">
  <title>版本紀錄 — MOTRIX 營運管理系統</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="../css/style.css?v=20260805g">
  <style>
    :root {
      --mv-left: 240px;
      --mv-top:  calc(var(--topbar-h) + 52px);
    }

    /* ── Toolbar ── */
    .mv-toolbar {
      position: fixed;
      top: var(--topbar-h);
      left: var(--sidebar-w);
      right: 0;
      z-index: 50;
      height: 52px;
      background: #fff;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 24px;
    }
    .mv-toolbar__title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      margin-right: 4px;
    }
    .mv-view-toggle {
      display: flex;
      background: #F1F0EC;
      border-radius: 6px;
      padding: 3px;
      gap: 2px;
    }
    .mv-view-btn {
      padding: 4px 14px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      color: var(--text-secondary);
      background: transparent;
      transition: background .15s, color .15s;
    }
    .mv-view-btn.active {
      background: #fff;
      color: var(--text-main);
      box-shadow: 0 1px 3px rgba(0,0,0,.1);
    }
    .mv-search {
      flex: 1;
      max-width: 240px;
      padding: 6px 12px;
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      font-size: 13px;
      font-family: inherit;
      color: var(--text-main);
      background: var(--bg);
    }
    .mv-search:focus { outline: none; border-color: var(--accent); }
    .mv-toolbar__spacer { flex: 1; }

    /* ── Module view: split panel ── */
    .mv-split {
      position: fixed;
      top: var(--mv-top);
      left: var(--sidebar-w);
      right: 0;
      bottom: 0;
      display: flex;
    }
    .mv-left-panel {
      width: var(--mv-left);
      flex-shrink: 0;
      border-right: 1px solid var(--border-light);
      background: var(--bg);
      overflow-y: auto;
      padding: 8px 0;
    }
    .mv-left-panel::-webkit-scrollbar { width: 4px; }
    .mv-left-panel::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 2px; }

    .mv-mod-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 10px 16px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background .12s, border-color .12s;
    }
    .mv-mod-item:hover { background: rgba(37,99,235,.04); }
    .mv-mod-item.selected {
      border-left-color: var(--accent);
      background: #EFF6FF;
    }
    .mv-mod-item__name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .mv-mod-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .mv-mod-item__ver {
      font-size: 11px;
      font-family: 'LINE Seed TW_OTF', sans-serif;
      color: var(--text-dim);
      padding-left: 15px;
    }
    .mv-mod-item__count {
      display: inline-block;
      font-size: 10px;
      font-family: 'LINE Seed TW_OTF', sans-serif;
      font-weight: 700;
      color: var(--text-dim);
      background: #E5E3DE;
      border-radius: 8px;
      padding: 0 6px;
      line-height: 16px;
      margin-left: auto;
    }

    /* ── Right history panel ── */
    .mv-right-panel {
      flex: 1;
      overflow-y: auto;
      background: #fff;
      padding: 24px 32px;
    }
    .mv-right-panel::-webkit-scrollbar { width: 5px; }
    .mv-right-panel::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }

    .mv-right-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-dim);
      font-size: 14px;
      gap: 10px;
    }
    .mv-right-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-light);
    }
    .mv-right-header__dot {
      width: 14px; height: 14px; border-radius: 50%;
    }
    .mv-right-header__name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
    }
    .mv-right-header__count {
      font-size: 12px;
      color: var(--text-dim);
      font-family: 'LINE Seed TW_OTF', sans-serif;
      margin-left: auto;
    }

    /* ── Timeline entries (used in both views) ── */
    .mv-timeline { position: relative; }
    .mv-timeline::before {
      content: '';
      position: absolute;
      left: 14px;
      top: 8px;
      bottom: 0;
      width: 1px;
      background: var(--border-light);
    }
    .mv-tl-entry {
      display: flex;
      gap: 16px;
      padding: 0 0 24px 0;
      position: relative;
    }
    .mv-tl-dot {
      width: 29px;
      height: 29px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      font-family: 'LINE Seed TW_OTF', sans-serif;
      position: relative;
      z-index: 1;
    }
    .mv-tl-body { flex: 1; min-width: 0; padding-top: 3px; }
    .mv-tl-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    .mv-ver-badge {
      font-size: 12px;
      font-weight: 700;
      font-family: 'LINE Seed TW_OTF', sans-serif;
      padding: 2px 9px;
      border-radius: 12px;
    }
    .mv-ver-badge.latest {
      background: var(--accent);
      color: #fff;
    }
    .mv-ver-badge.old {
      background: #F1F0EC;
      color: var(--text-secondary);
    }
    .mv-tl-date {
      font-size: 11px;
      color: var(--text-dim);
      font-family: 'LINE Seed TW_OTF', sans-serif;
    }
    .mv-tl-del {
      margin-left: auto;
      background: none;
      border: none;
      cursor: pointer;
      color: #DC2626;
      opacity: 0;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 3px;
      transition: opacity .15s;
      font-family: inherit;
    }
    .mv-tl-entry:hover .mv-tl-del { opacity: .6; }
    .mv-tl-del:hover { opacity: 1 !important; background: #FEE2E2; }
    .mv-tl-content {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.65;
    }
    .mv-tl-meta {
      margin-top: 5px;
      font-size: 11px;
      color: var(--text-dim);
      font-family: 'LINE Seed TW_OTF', sans-serif;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .mv-tl-by {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* ── Timeline view ── */
    .mv-timeline-view {
      position: fixed;
      top: var(--mv-top);
      left: var(--sidebar-w);
      right: 0;
      bottom: 0;
      overflow-y: auto;
      padding: 24px 48px;
      background: #fff;
    }
    .mv-timeline-view::-webkit-scrollbar { width: 5px; }
    .mv-timeline-view::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }

    .mv-date-group { margin-bottom: 8px; }
    .mv-date-sep {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      margin-top: 8px;
    }
    .mv-date-sep__label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
      font-family: 'LINE Seed TW_OTF', sans-serif;
      white-space: nowrap;
    }
    .mv-date-sep__line {
      flex: 1;
      height: 1px;
      background: var(--border-light);
    }
    .mv-tl-mod-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 9px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 2px;
    }
    .mv-tl-mod-dot {
      width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.6);
    }

    /* ── Add button for right panel ── */
    .mv-add-inline {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--accent);
      background: none;
      border: 1px dashed #BFDBFE;
      border-radius: var(--radius);
      padding: 6px 14px;
      cursor: pointer;
      font-family: inherit;
      margin-top: 4px;
    }
    .mv-add-inline:hover { background: var(--accent-light); }

    /* ── Modal ── */
    .mv-modal-overlay {
      position: fixed; inset: 0; z-index: 900;
      background: rgba(0,0,0,.38);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .mv-modal {
      background: #fff; border-radius: var(--radius-lg);
      width: 100%; max-width: 460px;
      box-shadow: 0 20px 60px rgba(0,0,0,.18); padding: 24px;
    }
    .mv-modal h3 { font-size: 16px; font-weight: 700; margin: 0 0 18px; color: var(--text-main); }
    .mv-form-row { margin-bottom: 14px; }
    .mv-form-row label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--text-secondary); margin-bottom: 5px;
    }
    .mv-form-row input, .mv-form-row textarea {
      width: 100%; box-sizing: border-box;
      padding: 7px 11px; border: 1px solid var(--border-light);
      border-radius: var(--radius); font-size: 13px;
      color: var(--text-main); font-family: inherit; background: #fff;
    }
    .mv-form-row input:focus, .mv-form-row textarea:focus {
      outline: none; border-color: var(--accent);
    }
    .mv-form-row textarea { resize: vertical; min-height: 90px; line-height: 1.6; }
    .mv-form-actions {
      display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;
    }
    .mv-loading {
      position: fixed;
      top: var(--mv-top); left: var(--sidebar-w); right: 0; bottom: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-dim); font-size: 14px; background: #fff;
    }

    /* Tablet: narrower left panel due to icon-rail sidebar */
    @media (max-width: 1023px) and (min-width: 781px) {
      :root { --mv-left: 180px; }
    }

    @media (max-width: 780px) {
      :root { --mv-left: 0px; }
      .mv-toolbar { left: 0; }
      .mv-split, .mv-timeline-view, .mv-loading { left: 0; }
      .mv-left-panel { display: none; }
      .mv-timeline-view { padding: 16px 16px; }
      .mv-right-panel { padding: 16px; }
    }
  </style>
</head>
<body>
  <div id="app-topbar" class="topbar"></div>
  <nav id="app-sidebar" class="sidebar"></nav>
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <div x-data="moduleVersions()" x-init="init()">

    <!-- Toolbar -->
    <div class="mv-toolbar">
      <span class="mv-toolbar__title">版本紀錄</span>
      <div class="mv-view-toggle">
        <button class="mv-view-btn" :class="{active: view==='module'}"
                @click="view='module'">依模組</button>
        <button class="mv-view-btn" :class="{active: view==='timeline'}"
                @click="view='timeline'">時間軸</button>
      </div>
      <input class="mv-search" type="search" placeholder="搜尋模組或內容…"
             x-model="search" @input="onSearch">
      <div class="mv-toolbar__spacer"></div>
      <button class="btn btn-primary" x-show="isAdmin" @click="openNew(selected?.module)"
              style="font-size:12px;padding:6px 14px">+ 新增</button>
    </div>

    <!-- Loading -->
    <div class="mv-loading" x-show="loading">載入中…</div>

    <!-- ── Module view (split) ── -->
    <div class="mv-split" x-show="!loading && view==='module'">

      <!-- Left: module list -->
      <div class="mv-left-panel">
        <template x-for="m in filteredModules" :key="m.module">
          <div class="mv-mod-item" :class="{selected: selected?.module===m.module}"
               @click="selectModule(m)">
            <div class="mv-mod-item__name">
              <span class="mv-mod-dot" :style="`background:${modColor(m.module)}`"></span>
              <span x-text="m.module"></span>
              <span class="mv-mod-item__count" x-text="m.history.length"></span>
            </div>
            <div class="mv-mod-item__ver" x-text="m.latest_version + ' · ' + fmtDate(m.latest_updated_at)"></div>
          </div>
        </template>
        <div x-show="filteredModules.length===0"
             style="padding:24px 16px;font-size:12px;color:var(--text-dim);text-align:center">
          無符合結果
        </div>
      </div>

      <!-- Right: history detail -->
      <div class="mv-right-panel">
        <!-- No selection -->
        <div class="mv-right-empty" x-show="!selected">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#D1D0CB" stroke-width="1.5">
            <path d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A2 2 0 013 12V7a4 4 0 014-4z"/>
          </svg>
          <span>從左側選擇模組以查看版本歷史</span>
        </div>

        <!-- Module history -->
        <div x-show="selected">
          <div class="mv-right-header">
            <span class="mv-right-header__dot"
                  :style="`background:${modColor(selected?.module)}`"></span>
            <span class="mv-right-header__name" x-text="selected?.module"></span>
            <span class="mv-right-header__count"
                  x-text="`共 ${selected?.history?.length ?? 0} 個版本`"></span>
          </div>

          <div class="mv-timeline">
            <template x-for="(e, idx) in (selected?.history ?? [])" :key="e.id">
              <div class="mv-tl-entry">
                <div class="mv-tl-dot"
                     :style="`background:${idx===0 ? modColor(selected.module) : '#E5E3DE'};color:${idx===0?'#fff':'var(--text-dim)'}`"
                     x-text="idx===0 ? 'NEW' : ''">
                </div>
                <div class="mv-tl-body">
                  <div class="mv-tl-head">
                    <span class="mv-ver-badge" :class="idx===0?'latest':'old'"
                          x-text="e.version"></span>
                    <span class="mv-tl-date" x-text="fmtFull(e.updated_at)"></span>
                    <button class="mv-tl-del" x-show="isSuperadmin"
                            @click="del(e.id, selected.module, e.version)">✕ 刪除</button>
                  </div>
                  <div class="mv-tl-content" x-text="e.content || '（無說明）'"></div>
                  <div class="mv-tl-meta">
                    <span class="mv-tl-by">
                      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z"/>
                      </svg>
                      <span x-text="e.updated_by || 'system'"></span>
                    </span>
                  </div>
                </div>
              </div>
            </template>
          </div>

          <!-- Add to this module -->
          <button class="mv-add-inline" x-show="isAdmin"
                  @click="openNew(selected?.module)">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            新增此模組版本
          </button>
        </div>
      </div>
    </div><!-- /mv-split -->

    <!-- ── Timeline view ── -->
    <div class="mv-timeline-view" x-show="!loading && view==='timeline'">
      <div x-show="timelineGroups.length===0"
           style="padding:60px;text-align:center;color:var(--text-dim);font-size:14px">
        無符合結果
      </div>

      <template x-for="grp in timelineGroups" :key="grp.date">
        <div class="mv-date-group">
          <div class="mv-date-sep">
            <span class="mv-date-sep__label" x-text="grp.label"></span>
            <div class="mv-date-sep__line"></div>
            <span style="font-size:11px;color:var(--text-dim);font-family:LINE Seed TW_OTF, sans-serif"
                  x-text="grp.entries.length + ' 項更新'"></span>
          </div>

          <div class="mv-timeline">
            <template x-for="e in grp.entries" :key="e.id">
              <div class="mv-tl-entry">
                <div class="mv-tl-dot"
                     :style="`background:${modColor(e.module)}22;border:2px solid ${modColor(e.module)}`">
                </div>
                <div class="mv-tl-body">
                  <div class="mv-tl-head">
                    <span class="mv-tl-mod-tag" :style="`background:${modColor(e.module)}`">
                      <span class="mv-tl-mod-dot"></span>
                      <span x-text="e.module"></span>
                    </span>
                    <span class="mv-ver-badge old" x-text="e.version"></span>
                    <button class="mv-tl-del" x-show="isSuperadmin"
                            @click="del(e.id, e.module, e.version)">✕</button>
                  </div>
                  <div class="mv-tl-content" x-text="e.content || '（無說明）'"></div>
                  <div class="mv-tl-meta">
                    <span class="mv-tl-by">
                      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z"/>
                      </svg>
                      <span x-text="e.updated_by || 'system'"></span>
                    </span>
                    <span x-text="fmtFull(e.updated_at)"></span>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div><!-- /timeline-view -->

    <!-- Modal -->
    <div class="mv-modal-overlay" x-show="showModal" @click.self="showModal=false"
         style="display:none">
      <div class="mv-modal">
        <h3>新增版本記錄</h3>
        <div class="mv-form-row">
          <label>模組名稱</label>
          <input x-model="form.module" list="mv-mod-list" placeholder="選擇或輸入模組名稱">
          <datalist id="mv-mod-list">
            <template x-for="m in modules" :key="m.module">
              <option :value="m.module"></option>
            </template>
            <option value="報價單"><option value="簽核佇列"><option value="案件管理">
            <option value="專案管理"><option value="客戶管理"><option value="供應商管理">
            <option value="料號主檔"><option value="採購管理"><option value="設備登載">
            <option value="保固追蹤"><option value="應收帳款"><option value="銷售訂單">
            <option value="營運報表"><option value="工作日誌"><option value="每日工作事項">
            <option value="儀表板"><option value="使用者管理"><option value="系統設定">
            <option value="通知系統"><option value="外包名冊"><option value="勞報單">
            <option value="系統安全"><option value="系統備份"><option value="測試框架">
            <option value="版本紀錄">
          </datalist>
        </div>
        <div class="mv-form-row">
          <label>版本號</label>
          <input x-model="form.version" placeholder="例：v1.2.0 或 2026-07-21">
        </div>
        <div class="mv-form-row">
          <label>更新內容</label>
          <textarea x-model="form.content" placeholder="描述此版本的主要變更…"></textarea>
        </div>
        <div class="mv-form-actions">
          <button class="btn btn-ghost" @click="showModal=false" :disabled="saving">取消</button>
          <button class="btn btn-primary" @click="save()" :disabled="saving">
            <span x-show="!saving">儲存</span>
            <span x-show="saving">儲存中…</span>
          </button>
        </div>
      </div>
    </div>

  </div><!-- /x-data -->

  <script src="../static/notif.js"></script>
  <script src="../static/sidebar.js"></script>
  <script>
  const _MOD_COLORS = {
    '報價單':     '#2563EB', '簽核佇列':    '#7C3AED', '案件管理':    '#D97706',
    '專案管理':   '#059669', '客戶管理':    '#DB2777', '供應商管理':   '#475569',
    '料號主檔':   '#64748B', '採購管理':    '#0284C7', '設備登載':    '#B45309',
    '保固追蹤':   '#047857', '應收帳款':    '#DC2626', '銷售訂單':    '#1D4ED8',
    '營運報表':   '#6D28D9', '工作日誌':    '#0891B2', '每日工作事項': '#C2410C',
    '儀表板':     '#15803D', '使用者管理':  '#9333EA', '系統設定':    '#334155',
    '通知系統':   '#0D9488', '外包名冊':    '#92400E', '勞報單':     '#44403C',
    '系統安全':   '#B91C1C', '系統備份':    '#78350F', '測試框架':    '#166534',
    '版本紀錄':   '#1E40AF',
    '場域選型導覽': '#0F766E', '網路架構選型導覽': '#0F766E', '交換器選型導覽': '#0F766E',
    '監控系統選型導覽': '#0F766E', '門禁系統選型導覽': '#0F766E',
    '選型資料庫':  '#0F766E',
  }

  function moduleVersions() {
    return {
      modules:        [],
      loading:        true,
      view:           'module',
      selected:       null,
      search:         '',
      showModal:      false,
      saving:         false,
      form:           { module: '', version: '', content: '' },
      isAdmin:        false,
      isSuperadmin:   false,

      init() {
        const s = JSON.parse(localStorage.getItem('motrix_session') || '{}')
        const role = s.role || ''
        this.isAdmin      = role === 'admin' || role === 'superadmin'
        this.isSuperadmin = role === 'superadmin'
        this.fetch()
      },

      fetch() {
        this.loading = true
        const s = JSON.parse(localStorage.getItem('motrix_session') || '{}')
        fetch('/api/module-versions', {
          headers: { Authorization: 'Bearer ' + (s.token || '') }
        })
          .then(r => r.ok ? r.json() : Promise.reject(r.status))
          .then(data => {
            this.modules = data
            // Restore selection after refresh
            if (this.selected) {
              const refreshed = data.find(m => m.module === this.selected.module)
              this.selected = refreshed || null
            }
            // Auto-select first if nothing selected
            if (!this.selected && data.length > 0) this.selected = data[0]
          })
          .catch(e => console.error('fetch failed:', e))
          .finally(() => { this.loading = false })
      },

      selectModule(m) {
        this.selected = m
      },

      // ── Computed ──────────────────────────────────────────────────

      get filteredModules() {
        if (!this.search) return this.modules
        const q = this.search.toLowerCase()
        return this.modules.filter(m =>
          m.module.toLowerCase().includes(q) ||
          m.history.some(e => e.content.toLowerCase().includes(q) ||
                              e.version.toLowerCase().includes(q))
        )
      },

      get timelineGroups() {
        // Flatten all entries, filter, sort by date desc
        let flat = []
        this.modules.forEach(m => {
          m.history.forEach(e => flat.push({ ...e, module: m.module }))
        })
        if (this.search) {
          const q = this.search.toLowerCase()
          flat = flat.filter(e =>
            e.module.toLowerCase().includes(q) ||
            e.content.toLowerCase().includes(q) ||
            e.version.toLowerCase().includes(q)
          )
        }
        flat.sort((a, b) => b.updated_at.localeCompare(a.updated_at))

        // Group by date (YYYY-MM-DD)
        const groups = []
        const seen = {}
        flat.forEach(e => {
          const day = (e.updated_at || '').slice(0, 10)
          if (!seen[day]) {
            seen[day] = { date: day, label: this.fmtDay(day), entries: [] }
            groups.push(seen[day])
          }
          seen[day].entries.push(e)
        })
        return groups
      },

      // ── Actions ───────────────────────────────────────────────────

      openNew(mod) {
        this.form = { module: mod || '', version: '', content: '' }
        this.showModal = true
      },

      onSearch() {
        // When searching in module view, auto-select first filtered match
        if (this.view === 'module' && this.search) {
          const first = this.filteredModules[0]
          if (first) this.selected = first
        }
      },

      save() {
        if (!this.form.module.trim()) return alert('請填寫模組名稱')
        if (!this.form.version.trim()) return alert('請填寫版本號')
        this.saving = true
        const s = JSON.parse(localStorage.getItem('motrix_session') || '{}')
        fetch('/api/module-versions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + (s.token || '')
          },
          body: JSON.stringify(this.form)
        })
          .then(r => r.ok ? r.json() : r.json().then(d => Promise.reject(d.detail || r.status)))
          .then(() => {
            this.showModal = false
            this.fetch()
          })
          .catch(e => alert('儲存失敗：' + e))
          .finally(() => { this.saving = false })
      },

      del(id, mod, ver) {
        if (!confirm(`確定刪除「${mod} ${ver}」？`)) return
        const s = JSON.parse(localStorage.getItem('motrix_session') || '{}')
        fetch('/api/module-versions/' + id, {
          method: 'DELETE',
          headers: { Authorization: 'Bearer ' + (s.token || '') }
        })
          .then(r => { if (!r.ok) throw r.status })
          .then(() => this.fetch())
          .catch(e => alert('刪除失敗：' + e))
      },

      // ── Helpers ───────────────────────────────────────────────────

      modColor(mod) {
        return _MOD_COLORS[mod] || '#6B7280'
      },

      fmtDate(iso) {
        if (!iso) return ''
        return iso.slice(0, 10).replace(/-/g, '/')
      },

      fmtFull(iso) {
        if (!iso) return ''
        const d = new Date(iso)
        return d.getFullYear() + '/' +
          String(d.getMonth() + 1).padStart(2, '0') + '/' +
          String(d.getDate()).padStart(2, '0') + ' ' +
          String(d.getHours()).padStart(2, '0') + ':' +
          String(d.getMinutes()).padStart(2, '0')
      },

      fmtDay(dateStr) {
        if (!dateStr) return ''
        const [y, m, d] = dateStr.split('-')
        const weekdays = ['日','一','二','三','四','五','六']
        const dt = new Date(dateStr)
        return `${y} 年 ${parseInt(m)} 月 ${parseInt(d)} 日（週${weekdays[dt.getDay()]}）`
      },
    }
  }
  </script>
