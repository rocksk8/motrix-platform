<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{if(localStorage.getItem('motrix_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>承攬商管理 — MOTRIX ERP</title>
  <link rel="icon" type="image/png" href="../static/favicon.png">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="../css/style.css?v=20260805g">
  <style>
    [x-cloak]{display:none!important}
    .page-main{margin-left:var(--sidebar-w);margin-top:var(--topbar-h);padding:28px 32px;min-height:calc(100vh - var(--topbar-h));background:var(--white)}
    .search-bar{display:flex;gap:10px;align-items:center;margin-bottom:20px}
    .search-wrap{position:relative;flex:0 0 320px}
    .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-dim);pointer-events:none}
    .search-input{width:100%;padding:8px 12px 8px 36px;border:1px solid var(--border-light);border-radius:var(--radius);font-size:13px;font-family:var(--font-zh);background:#fff;outline:none;box-sizing:border-box}
    .search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
    .data-table{width:100%;border-collapse:collapse;font-size:13px}
    .data-table th{padding:10px 12px;text-align:left;font-size:10px;font-family:LINE Seed TW_OTF, sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);font-weight:500;background:#FAFAF8;border-bottom:1px solid var(--border-light);white-space:nowrap}
    .data-table td{padding:11px 12px;border-bottom:1px solid #F0EEE9;vertical-align:middle}
    .data-table tr:last-child td{border-bottom:none}
    .data-table tr:hover td{background:#FDFCFA}
    .data-table tr:hover .row-actions{opacity:1}
    .row-actions{opacity:0;display:flex;gap:6px;transition:opacity .12s}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:40px 24px;overflow-y:auto}
    .modal-box{background:#fff;border-radius:var(--radius-lg);width:100%;max-width:640px;box-shadow:var(--shadow-lg);flex-shrink:0}
    .modal-head{display:flex;align-items:center;padding:16px 22px;border-bottom:1px solid var(--border-light);gap:10px}
    .modal-head__title{font-size:14px;font-weight:600;flex:1}
    .modal-body{padding:20px 22px;max-height:calc(100vh - 200px);overflow-y:auto}
    .modal-foot{display:flex;align-items:center;padding:14px 22px;border-top:1px solid var(--border-light);gap:8px;justify-content:flex-end}
    .form-section{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border-light)}
    .form-section:last-child{border-bottom:none;margin-bottom:0}
    .form-section-title{font-size:11px;font-family:LINE Seed TW_OTF, sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);font-weight:600;margin-bottom:14px}
    .form-group{display:flex;flex-direction:column;gap:5px}
    .form-label{font-size:12px;font-weight:500;color:var(--text-secondary)}
    .form-input,.form-select,.form-textarea{padding:8px 11px;border:1px solid var(--border-light);border-radius:var(--radius);font-size:13px;font-family:var(--font-zh);color:var(--text-primary);background:#fff;outline:none;transition:border-color .12s,box-shadow .12s}
    .form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
    .form-textarea{resize:vertical;min-height:64px;line-height:1.6}
    .form-grid{display:grid;gap:14px}
    .form-grid-2{grid-template-columns:1fr 1fr}
    .id-card-drop{border:2px dashed var(--border-light);border-radius:var(--radius-lg);padding:20px;text-align:center;color:var(--text-dim);font-size:13px;transition:border-color .15s,background .15s;cursor:pointer}
    .id-card-drop:hover{border-color:var(--accent);background:var(--accent-light)}
    .id-card-preview{position:relative;border:1px solid var(--border-light);border-radius:var(--radius-lg);overflow:hidden;background:#f8f8f6}
    .id-card-preview img{width:100%;max-height:180px;object-fit:contain;display:block}
    .id-card-remove{position:absolute;top:6px;right:6px;background:rgba(220,38,38,.9);color:#fff;border:none;border-radius:4px;padding:3px 10px;font-size:11px;cursor:pointer;font-family:inherit}
    .id-card-remove:hover{background:var(--danger)}
    .detail-pane{position:fixed;right:0;top:var(--topbar-h);width:380px;height:calc(100vh - var(--topbar-h));background:#fff;border-left:1px solid var(--border-light);box-shadow:var(--shadow-lg);z-index:100;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease}
    .detail-pane.open{transform:translateX(0)}
    .detail-head{padding:16px 20px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:10px}
    .detail-body{flex:1;overflow-y:auto;padding:16px 20px}
    .detail-body::-webkit-scrollbar{width:4px}
    .detail-body::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:2px}
    .detail-close{margin-left:auto;width:28px;height:28px;border-radius:4px;border:none;background:#F0EEE9;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
    .detail-close:hover{background:var(--danger-light);color:var(--danger)}
    .detail-row{display:flex;gap:8px;margin-bottom:10px;font-size:12px}
    .detail-label{color:var(--text-dim);min-width:68px;flex-shrink:0}
    .detail-val{color:var(--text-primary);font-weight:500;flex:1;word-break:break-all}
    .detail-divider{border:none;border-top:1px solid var(--border-light);margin:14px 0}
    .detail-sec{font-size:10px;font-family:LINE Seed TW_OTF, sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);font-weight:600;margin-bottom:10px}
    .tag{display:inline-flex;padding:2px 8px;border-radius:3px;font-size:11px;font-family:LINE Seed TW_OTF, sans-serif}
    .tag-active{background:var(--success-light);color:var(--success)}
    .tag-inactive{background:#F3F4F6;color:#6B7280}
    .empty-state{text-align:center;padding:60px 20px;color:var(--text-dim)}
    .empty-icon{font-size:40px;margin-bottom:12px;opacity:.4}
    .vlog-row{display:grid;grid-template-columns:120px 1fr auto;gap:6px;align-items:start;margin-bottom:6px}
    .vlog-input{padding:5px 8px;border:1px solid var(--border-light);border-radius:5px;font-size:12px;font-family:inherit;outline:none;width:100%;box-sizing:border-box}
    .vlog-input:focus{border-color:var(--accent)}
  </style>
</head>
<body x-data="vendorContractorsPage()" x-init="init()">
<header id="app-topbar" class="topbar"></header>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<aside class="sidebar" id="app-sidebar"></aside>

<div class="page-main" style="transition:padding-right .22s">

  <!-- 頁頭 -->
  <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px">
    <div>
      <div style="font-size:11px;color:var(--text-dim);margin-bottom:4px">外包廠商</div>
      <h1 style="font-size:20px;font-weight:700">承攬商管理</h1>
      <p style="font-size:12px;color:var(--text-secondary);margin-top:4px" x-text="`共 ${vendors.length} 家承攬商`"></p>
    </div>
    <button class="btn btn-primary" @click="openNew()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v16m8-8H4"/></svg>
      新增承攬商
    </button>
  </div>

  <!-- 搜尋 -->
  <div class="search-bar">
    <div class="search-wrap">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input class="search-input" type="text" x-model="searchQ" @input.debounce.300ms="load()" placeholder="搜尋名稱、統編、聯絡人…">
    </div>
    <label style="font-size:13px;color:var(--text-secondary);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px">
      <input type="checkbox" x-model="showInactive" @change="load()"> 顯示停用
    </label>
    <div style="margin-left:auto;display:flex;gap:8px">
      <button class="btn btn-ghost" @click="exportExcel()" :disabled="!vendors.length">匯出 Excel</button>
      <button class="btn btn-ghost" @click="$refs.importFile.click()">匯入 Excel</button>
    </div>
  </div>
  <input type="file" x-ref="importFile" accept=".xlsx,.xls,.csv" style="display:none" @change="handleImport($event)">

  <!-- 列表 -->
  <div class="panel" style="padding:0;overflow:hidden">
    <div class="table-scroll" x-show="!loading">
      <table class="data-table">
        <thead>
          <tr>
            <th style="width:32px"></th>
            <th>承攬商名稱</th>
            <th>統一編號</th>
            <th>聯絡人</th>
            <th>電話</th>
            <th>Email</th>
            <th>狀態</th>
            <th style="width:80px"></th>
          </tr>
        </thead>
        <tbody>
          <template x-for="v in vendors" :key="v.id">
            <tr @click="selectVendor(v)" style="cursor:pointer">
              <td>
                <div style="width:30px;height:30px;border-radius:50%;background:#7C3AED;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700"
                     x-text="(v.name||'?')[0]"></div>
              </td>
              <td>
                <div style="font-weight:500" x-text="v.name"></div>
                <div style="display:flex;align-items:center;gap:5px;margin-top:1px">
                  <span x-show="v.code" x-text="v.code"
                        style="font-size:9px;font-family:LINE Seed TW_OTF, sans-serif;background:#EDE9FE;color:#7C3AED;padding:1px 5px;border-radius:3px;letter-spacing:.04em;font-weight:600"></span>
                  <span x-show="v.category" style="font-size:11px;color:var(--text-dim)" x-text="v.category"></span>
                </div>
              </td>
              <td style="font-family:LINE Seed TW_OTF, sans-serif;font-size:12px" x-text="v.taxId || '—'"></td>
              <td x-text="v.contactName || '—'"></td>
              <td style="font-size:12px" x-text="v.phone || '—'"></td>
              <td style="font-size:12px" x-text="v.email || '—'"></td>
              <td>
                <span class="tag" :class="v.active ? 'tag-active' : 'tag-inactive'"
                      x-text="v.active ? '往來中' : '停用'"></span>
              </td>
              <td>
                <div class="row-actions">
                  <button class="btn btn-ghost btn-sm" @click.stop="openEdit(v)">編輯</button>
                </div>
              </td>
            </tr>
          </template>
          <tr x-show="!loading && vendors.length === 0">
            <td colspan="8" class="empty-state">
              <div class="empty-icon">🏗️</div>
              <div>尚無承攬商資料</div>
              <button class="btn btn-primary" @click="openNew()" style="margin-top:12px">新增第一筆承攬商</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div x-show="loading" style="text-align:center;padding:60px;color:var(--text-dim)">載入中…</div>
  </div>
</div>

<!-- ══ 右側詳細面板 ══ -->
<div class="detail-pane" :class="{open: !!selectedId}">
  <template x-if="selectedVendor">
    <div style="display:contents">
      <div class="detail-head">
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;font-size:14px" x-text="selectedVendor.name"></div>
          <div style="display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap">
            <span x-show="selectedVendor.code" x-text="selectedVendor.code"
                  style="font-size:10px;font-family:LINE Seed TW_OTF, sans-serif;background:#EDE9FE;color:#7C3AED;padding:1px 7px;border-radius:3px;letter-spacing:.05em;font-weight:600"></span>
            <span style="font-size:11px;color:var(--text-dim)"
                  x-text="(selectedVendor.category ? selectedVendor.category + (selectedVendor.taxId ? ' · ' : '') : '') + (selectedVendor.taxId ? '統編 ' + selectedVendor.taxId : '')"></span>
          </div>
          <div x-show="(selectedVendor.tags||[]).length" style="display:flex;flex-wrap:wrap;gap:3px;margin-top:5px">
            <template x-for="tag in (selectedVendor.tags||[])" :key="tag">
              <span style="background:#EDE9FE;color:#7C3AED;border-radius:3px;padding:1px 6px;font-size:10px" x-text="tag"></span>
            </template>
          </div>
        </div>
        <button class="detail-close" @click="selectedId=null;selectedVendor=null">×</button>
      </div>
      <div class="detail-body">

        <div class="detail-sec">聯絡資訊</div>
        <div class="detail-row" x-show="selectedVendor.contactName"><span class="detail-label">聯絡人</span><span class="detail-val" x-text="selectedVendor.contactName"></span></div>
        <div class="detail-row" x-show="selectedVendor.phone"><span class="detail-label">電話</span><span class="detail-val" x-text="selectedVendor.phone"></span></div>
        <div class="detail-row" x-show="selectedVendor.email"><span class="detail-label">Email</span><span class="detail-val" x-text="selectedVendor.email"></span></div>
        <div class="detail-row" x-show="selectedVendor.address"><span class="detail-label">地址</span><span class="detail-val" x-text="selectedVendor.address"></span></div>

        <template x-if="selectedVendor.bankName || selectedVendor.bankAccountNumber || selectedVendor.hasPassbook">
          <div>
            <hr class="detail-divider">
            <div class="detail-sec">銀行帳戶</div>
            <div class="detail-row" x-show="selectedVendor.bankCode"><span class="detail-label">銀行代碼</span><span class="detail-val" x-text="selectedVendor.bankCode"></span></div>
            <div class="detail-row" x-show="selectedVendor.bankName"><span class="detail-label">銀行名稱</span><span class="detail-val" x-text="selectedVendor.bankName"></span></div>
            <div class="detail-row" x-show="selectedVendor.bankBranch"><span class="detail-label">分行</span><span class="detail-val" x-text="selectedVendor.bankBranch"></span></div>
            <div class="detail-row" x-show="selectedVendor.bankAccountName"><span class="detail-label">戶名</span><span class="detail-val" x-text="selectedVendor.bankAccountName"></span></div>
            <div class="detail-row" x-show="selectedVendor.bankAccountNumber"><span class="detail-label">帳號</span><span class="detail-val" x-text="selectedVendor.bankAccountNumber"></span></div>
            <div style="font-size:12px;color:var(--success);margin-top:4px" x-show="selectedVendor.hasPassbook">● 銀行存簿已上傳</div>
          </div>
        </template>

        <template x-if="selectedVendor.notes">
          <div>
            <hr class="detail-divider">
            <div class="detail-sec">備注</div>
            <div style="font-size:12px;color:var(--text-secondary);line-height:1.7" x-text="selectedVendor.notes"></div>
          </div>
        </template>

        <!-- 派發紀錄 -->
        <hr class="detail-divider">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div class="detail-sec" style="margin-bottom:0">
            派發紀錄
            <span style="font-weight:400;text-transform:none;letter-spacing:0;margin-left:4px"
                  x-text="vendorDispatches.length ? '共 ' + vendorDispatches.length + ' 筆' : ''"></span>
          </div>
        </div>
        <div x-show="dispatchesLoading" style="font-size:12px;color:var(--text-dim);text-align:center;padding:12px 0">載入中…</div>
        <template x-if="!dispatchesLoading && vendorDispatches.length === 0">
          <div style="text-align:center;padding:14px;border:1px dashed var(--border-light);border-radius:8px;font-size:12px;color:var(--text-dim)">
            尚無派發紀錄
          </div>
        </template>
        <template x-for="d in vendorDispatches.slice(0,5)" :key="d.id">
          <div style="padding:9px 11px;border:1px solid var(--border-light);border-radius:7px;margin-bottom:6px;font-size:12px">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px">
              <a :href="'case-management.html?q=' + d.quoteNo"
                 style="font-weight:600;color:var(--accent);text-decoration:none;font-family:LINE Seed TW_OTF, sans-serif"
                 x-text="d.quoteNo"></a>
              <span class="badge" :class="'badge--' + _dStatusClass(d.status)" x-text="d.statusLabel"></span>
            </div>
            <div style="color:var(--text-secondary)" x-text="d.scope || ''"></div>
            <div x-show="d.invoiceNo" style="color:var(--text-dim);font-size:11px;font-family:LINE Seed TW_OTF, sans-serif;margin-top:2px"
                 x-text="'發票：' + d.invoiceNo"></div>
            <div style="font-family:LINE Seed TW_OTF, sans-serif;font-weight:600;margin-top:3px;font-size:12px"
                 x-text="'NT$ ' + (d.totalAmount||0).toLocaleString()"></div>
          </div>
        </template>
        <template x-if="vendorDispatches.length > 5">
          <div style="text-align:center;font-size:11px;color:var(--text-dim);padding:4px 0">
            … 另有 <span x-text="vendorDispatches.length - 5"></span> 筆
          </div>
        </template>

        <!-- 往來紀錄 -->
        <hr class="detail-divider">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div class="detail-sec" style="margin-bottom:0">
            往來紀錄
            <span style="font-weight:400;text-transform:none;letter-spacing:0;margin-left:4px"
                  x-text="(editVisits||[]).length ? '共 ' + (editVisits||[]).length + ' 筆' : ''"></span>
          </div>
        </div>
        <template x-if="(editVisits||[]).length === 0">
          <div style="text-align:center;padding:12px;border:1px dashed var(--border-light);border-radius:8px;font-size:12px;color:var(--text-dim);margin-bottom:8px">
            尚無往來紀錄 · 點下方新增
          </div>
        </template>
        <template x-for="(vl, vi) in (editVisits || [])" :key="vl.id">
          <div class="vlog-row">
            <input class="vlog-input" type="date" x-model="vl.date">
            <input class="vlog-input" type="text" placeholder="紀錄說明" x-model="vl.note">
            <button style="padding:4px 7px;border:1px solid var(--border-light);border-radius:5px;font-size:11px;background:#fff;cursor:pointer;color:var(--danger)"
                    @click="removeVisit(vi)">✕</button>
          </div>
        </template>
        <div style="display:flex;gap:8px;margin-top:6px">
          <button class="btn btn-ghost btn-sm" @click="addVisit()">＋ 新增紀錄</button>
          <button class="btn btn-ghost btn-sm" style="flex:1" :disabled="visitSaving" @click="saveVisits()"
                  x-text="visitSaving ? '儲存中…' : '儲存往來紀錄'"></button>
        </div>
        <div x-show="visitMsg" style="font-size:12px;margin-top:6px"
             :style="visitMsg.startsWith('✓') ? 'color:var(--success)' : 'color:var(--danger)'"
             x-text="visitMsg"></div>

        <hr class="detail-divider">
        <div style="display:flex;gap:8px">
          <button class="btn btn-ghost btn-sm" style="flex:1" @click="openEdit(selectedVendor)">編輯資料</button>
          <button class="btn btn-ghost btn-sm" style="flex:1"
                  :class="selectedVendor.active ? 'btn-danger' : ''"
                  @click="toggleActive(selectedVendor)"
                  x-text="selectedVendor.active ? '停用承攬商' : '啟用承攬商'"></button>
        </div>
      </div>
    </div>
  </template>
</div>

<!-- ══ 新增 / 編輯 Modal ══ -->
<div class="modal-overlay" x-show="showModal" x-cloak @click.self="showModal=false">
  <div class="modal-box">
    <div class="modal-head">
      <span class="modal-head__title" x-text="editId ? '編輯承攬商' : '新增承攬商'"></span>
      <button class="modal-close" @click="showModal=false">×</button>
    </div>
    <div class="modal-body">
      <!-- 統編查詢 -->
      <div class="form-section">
        <div class="form-section-title">政府登記資料查詢</div>
        <div style="display:flex;gap:8px;align-items:flex-end">
          <div class="form-group" style="flex:1">
            <label class="form-label">輸入統一編號（8碼）</label>
            <input class="form-input" type="text" x-model="taxIdSearch" placeholder="如：12345678" maxlength="8"
                   @keydown.enter.prevent="lookupByTaxId()"
                   @input="if($event.target.value.replace(/\D/g,'').length===8 && !lookingUp) lookupByTaxId()">
          </div>
          <button class="btn btn-ghost" style="flex-shrink:0;margin-bottom:0" @click="lookupByTaxId()" :disabled="lookingUp"
                  x-text="lookingUp ? '查詢中…' : '查詢帶入'"></button>
        </div>
        <div x-show="lookupMsg" style="font-size:12px;margin-top:6px"
             :style="lookupOk ? 'color:var(--success)' : 'color:var(--danger)'"
             x-text="lookupMsg"></div>
      </div>
      <!-- 基本資料 -->
      <div class="form-section">
        <div class="form-section-title">基本資料</div>
        <div class="form-grid form-grid-2">
          <div class="form-group">
            <label class="form-label">承攬商名稱 <span style="color:var(--danger)">*</span></label>
            <input class="form-input" type="text" x-model="form.name" placeholder="公司名稱或個人姓名">
          </div>
          <div class="form-group">
            <label class="form-label">統一編號</label>
            <input class="form-input" type="text" x-model="form.tax_id" placeholder="如有公司統編">
          </div>
          <div class="form-group">
            <label class="form-label">承攬商類型</label>
            <select class="form-select" x-model="form.category">
              <option value="">— 請選擇 —</option>
              <option>機電工程</option>
              <option>弱電工程</option>
              <option>消防工程</option>
              <option>空調工程</option>
              <option>裝修工程</option>
              <option>水電工程</option>
              <option>IT 工程</option>
              <option>土木工程</option>
              <option>其他</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">聯絡人</label>
            <input class="form-input" type="text" x-model="form.contact_name" placeholder="聯絡人姓名">
          </div>
          <div class="form-group">
            <label class="form-label">電話</label>
            <input class="form-input" type="text" x-model="form.phone" placeholder="0912-345-678">
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input class="form-input" type="email" x-model="form.email">
          </div>
          <div class="form-group" style="grid-column:span 2">
            <label class="form-label">地址</label>
            <input class="form-input" type="text" x-model="form.address">
          </div>
        </div>
      </div>
      <!-- 內部標籤 -->
      <div class="form-section">
        <div class="form-section-title">內部標籤</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;min-height:22px">
          <template x-for="(tag, ti) in (form.tags||[])" :key="ti">
            <span style="display:inline-flex;align-items:center;gap:3px;background:#EDE9FE;color:#7C3AED;border-radius:4px;padding:2px 8px;font-size:12px">
              <span x-text="tag"></span>
              <button style="border:none;background:none;cursor:pointer;padding:0;line-height:1;color:#7C3AED;font-size:14px;opacity:.7" @click="removeTag(ti)">×</button>
            </span>
          </template>
          <span x-show="!(form.tags||[]).length" style="font-size:12px;color:var(--text-dim)">尚無標籤</span>
        </div>
        <div style="display:flex;gap:8px">
          <input class="form-input" type="text" x-model="tagInput" placeholder="輸入標籤後按 Enter 新增" style="flex:1"
                 @keydown.enter.prevent="addTag()">
          <button class="btn btn-ghost btn-sm" @click="addTag()">新增</button>
        </div>
      </div>
      <!-- 銀行帳戶 -->
      <div class="form-section">
        <div class="form-section-title">銀行帳戶</div>
        <div class="form-grid form-grid-2">
          <div class="form-group">
            <label class="form-label">銀行代碼</label>
            <input class="form-input" type="text" x-model="form.bank_code" placeholder="如：700">
          </div>
          <div class="form-group">
            <label class="form-label">銀行名稱</label>
            <input class="form-input" type="text" x-model="form.bank_name" placeholder="如：中華郵政">
          </div>
          <div class="form-group">
            <label class="form-label">分行</label>
            <input class="form-input" type="text" x-model="form.bank_branch">
          </div>
          <div class="form-group">
            <label class="form-label">戶名</label>
            <input class="form-input" type="text" x-model="form.bank_account_name">
          </div>
          <div class="form-group" style="grid-column:span 2">
            <label class="form-label">帳號</label>
            <input class="form-input" type="text" x-model="form.bank_account_number">
          </div>
        </div>
      </div>
      <!-- 銀行存簿影本 -->
      <div class="form-section">
        <div class="form-section-title">銀行存簿影本</div>
        <div x-show="!bankPassbookPreview && !bankPassbook" class="id-card-drop"
             @click="$refs.passbookInput.click()"
             @dragover.prevent @drop.prevent="handlePassbookDrop($event)">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin:0 auto 6px;display:block;opacity:.4">
            <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5M16 4v5"/>
          </svg>
          點擊或拖曳上傳存摺封面（含帳號頁）<br>
          <span style="font-size:11px">JPG / PNG / WEBP &lt; 3 MB</span>
        </div>
        <div x-show="bankPassbookPreview || bankPassbook" class="id-card-preview">
          <img :src="bankPassbookPreview || bankPassbook" alt="銀行存簿">
          <button class="id-card-remove" @click.stop="removePassbook()">✕</button>
        </div>
        <input type="file" x-ref="passbookInput" accept="image/*" style="display:none" @change="handlePassbookFile($event)">
        <div x-show="bankPassbookPreview || bankPassbook" style="margin-top:6px;display:flex;align-items:center;gap:8px">
          <label class="btn btn-ghost btn-sm" style="cursor:pointer">
            重新上傳<input type="file" accept="image/*" style="display:none" @change="handlePassbookFile($event)">
          </label>
          <span style="font-size:11px">
            <span x-show="bankPassbookPreview" style="color:var(--warning)">● 未儲存</span>
            <span x-show="!bankPassbookPreview && bankPassbook" style="color:var(--success)">● 已上傳</span>
          </span>
        </div>
      </div>
      <!-- 備注 -->
      <div class="form-section">
        <div class="form-section-title">備注</div>
        <div class="form-group">
          <textarea class="form-textarea" x-model="form.data_notes" rows="3" placeholder="合作條件、特殊備注…"></textarea>
        </div>
      </div>
      <div x-show="errMsg" style="color:var(--danger);font-size:13px;margin-top:6px" x-text="errMsg"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" @click="showModal=false">取消</button>
      <button class="btn btn-primary" @click="save()" :disabled="saving">
        <span x-text="saving ? '儲存中…' : '儲存'"></span>
      </button>
    </div>
  </div>
</div>

<!-- ══ 匯入結果 Modal ══ -->
<div class="modal-overlay" x-show="showImportModal" x-cloak @click.self="showImportModal=false">
  <div class="modal-box" style="max-width:480px">
    <div class="modal-head">
      <span class="modal-head__title">匯入結果</span>
      <button class="modal-close" @click="showImportModal=false">×</button>
    </div>
    <div class="modal-body">
      <template x-if="importing">
        <div style="text-align:center;padding:30px;color:var(--text-dim)">匯入中，請稍候…</div>
      </template>
      <template x-if="!importing && importResults">
        <div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px">
            <div style="text-align:center;padding:14px;background:var(--success-light);border-radius:8px">
              <div style="font-size:24px;font-weight:700;color:var(--success)" x-text="importResults.created"></div>
              <div style="font-size:11px;color:var(--text-secondary);margin-top:2px">新增</div>
            </div>
            <div style="text-align:center;padding:14px;background:#EFF6FF;border-radius:8px">
              <div style="font-size:24px;font-weight:700;color:var(--accent)" x-text="importResults.updated"></div>
              <div style="font-size:11px;color:var(--text-secondary);margin-top:2px">更新</div>
            </div>
            <div style="text-align:center;padding:14px;background:var(--danger-light);border-radius:8px">
              <div style="font-size:24px;font-weight:700;color:var(--danger)" x-text="importResults.failed"></div>
              <div style="font-size:11px;color:var(--text-secondary);margin-top:2px">失敗</div>
            </div>
          </div>
          <template x-if="importResults.errors && importResults.errors.length">
            <div style="background:#FEF2F2;border-radius:6px;padding:10px 12px;max-height:160px;overflow-y:auto">
              <div style="font-size:11px;font-weight:600;color:var(--danger);margin-bottom:6px">錯誤詳情</div>
              <template x-for="(e, ei) in importResults.errors" :key="ei">
                <div style="font-size:12px;color:var(--danger);padding:2px 0" x-text="e"></div>
              </template>
            </div>
          </template>
        </div>
      </template>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" @click="showImportModal=false">關閉</button>
    </div>
  </div>
</div>

<script src="../static/notif.js"></script>
<script src="../static/sidebar.js"></script>
<script>
const API = '/api'

async function fetchT(url, opts = {}, ms = 12000) {
  const ctrl = new AbortController()
  const tid = setTimeout(() => ctrl.abort(), ms)
  try { return await fetch(url, { ...opts, signal: ctrl.signal }) }
  finally { clearTimeout(tid) }
}

function vendorContractorsPage() {
  return {
    session: {},
    vendors: [],
    searchQ: '',
    showInactive: false,
    loading: false,
    selectedId: null,
    selectedVendor: null,
    editVisits: [],
    visitSaving: false,
    visitMsg: '',
    vendorDispatches: [],
    dispatchesLoading: false,
    showModal: false,
    editId: null,
    saving: false,
    errMsg: '',
    form: {},
    taxIdSearch: '',
    lookingUp: false,
    lookupMsg: '',
    lookupOk: false,
    tagInput: '',
    showImportModal: false,
    importing: false,
    importResults: null,
    _pendingVisits: [],
    bankPassbook: '',
    bankPassbookPreview: null,

    async init() {
      const s = localStorage.getItem('motrix_session')
      if (!s) { location.href = 'login.html'; return }
      this.session = JSON.parse(s)
      if (!['superadmin', 'admin'].includes(this.session.role)) {
        alert('此頁面需要管理員權限'); window.history.back(); return
      }
      await this.load()
    },

    async load() {
      this.loading = true
      try {
        const p = new URLSearchParams({ active_only: !this.showInactive })
        if (this.searchQ.trim()) p.set('q', this.searchQ.trim())
        const r = await fetch(`${API}/vendor-contractors?${p}`, {
          headers: { Authorization: 'Bearer ' + this.session.token }
        })
        if (r.ok) this.vendors = await r.json()
      } catch(e) {}
      this.loading = false
    },

    async selectVendor(v) {
      this.selectedId = v.id
      this.selectedVendor = { ...v }
      this.editVisits = JSON.parse(JSON.stringify(v.visits || []))
      this.visitMsg = ''
      this.dispatchesLoading = true
      this.vendorDispatches = []
      try {
        const r = await fetch(`${API}/contractor-dispatches`, {
          headers: { Authorization: 'Bearer ' + this.session.token }
        })
        if (r.ok) {
          const all = await r.json()
          this.vendorDispatches = all.filter(d => d.vendorId === v.id)
        }
      } catch(e) {}
      this.dispatchesLoading = false
    },

    _blank() {
      return { name: '', tax_id: '', contact_name: '', phone: '', email: '', address: '',
               data_notes: '', category: '', tags: [],
               bank_code: '', bank_name: '', bank_branch: '', bank_account_name: '', bank_account_number: '' }
    },

    openNew() {
      this.editId = null
      this._pendingVisits = []
      this.form = this._blank()
      this.taxIdSearch = ''; this.lookupMsg = ''; this.lookupOk = false; this.tagInput = ''
      this.bankPassbook = ''; this.bankPassbookPreview = null
      this.errMsg = ''
      this.showModal = true
    },

    async openEdit(v) {
      this.editId = v.id
      this._pendingVisits = JSON.parse(JSON.stringify(v.visits || []))
      this.form = {
        name: v.name, tax_id: v.taxId || '', contact_name: v.contactName || '',
        phone: v.phone || '', email: v.email || '', address: v.address || '',
        data_notes: v.notes || '', category: v.category || '', tags: [...(v.tags || [])],
        bank_code: v.bankCode || '', bank_name: v.bankName || '', bank_branch: v.bankBranch || '',
        bank_account_name: v.bankAccountName || '', bank_account_number: v.bankAccountNumber || ''
      }
      this.taxIdSearch = v.taxId || ''; this.lookupMsg = ''; this.lookupOk = false; this.tagInput = ''
      this.bankPassbook = ''; this.bankPassbookPreview = null
      this.errMsg = ''
      this.showModal = true
      try {
        const r = await fetch(`${API}/vendor-contractors/${v.id}/passbook`, {
          headers: { Authorization: 'Bearer ' + this.session.token }
        })
        if (r.ok) this.bankPassbook = (await r.json()).bank_passbook || ''
      } catch(e) {}
    },

    handlePassbookFile(e) {
      const file = e.target.files[0]
      if (!file) return
      if (file.size > 3 * 1024 * 1024) { this.errMsg = '圖片過大（限 3 MB）'; return }
      const reader = new FileReader()
      reader.onload = (ev) => { this.bankPassbookPreview = ev.target.result }
      reader.readAsDataURL(file)
      e.target.value = ''
    },
    handlePassbookDrop(e) {
      const file = e.dataTransfer.files[0]
      if (!file || !file.type.startsWith('image/')) return
      if (file.size > 3 * 1024 * 1024) { this.errMsg = '圖片過大（限 3 MB）'; return }
      const reader = new FileReader()
      reader.onload = (ev) => { this.bankPassbookPreview = ev.target.result }
      reader.readAsDataURL(file)
    },
    removePassbook() { this.bankPassbookPreview = ''; this.bankPassbook = '' },

    async lookupByTaxId() {
      const id = this.taxIdSearch.replace(/\D/g, '')
      if (!/^\d{8}$/.test(id)) { this.lookupMsg = '請輸入完整 8 碼統編'; this.lookupOk = false; return }
      this.lookingUp = true; this.lookupMsg = ''; this.lookupOk = false
      try {
        const r = await fetchT(`${API}/company/tax/${id}`,
          { headers: { Authorization: 'Bearer ' + this.session.token } }, 12000)
        if (r.ok) {
          const d = await r.json()
          const newName = d.name || this.form.name
          const newTaxId = d.taxId || id
          this.form = { ...this.form, name: newName, tax_id: newTaxId }
          this.taxIdSearch = newTaxId
          this.lookupMsg   = `已帶入：${newName}`
          this.lookupOk    = true
        } else if (r.status === 404) {
          this.lookupMsg = '查無此統編登記資料，請手動輸入'; this.lookupOk = false
        } else if (r.status === 503) {
          this.lookupMsg = '政府資料庫連線失敗，請確認伺服器對外網路或稍後再試'; this.lookupOk = false
        } else if (r.status === 401) {
          location.href = 'login.html'
        } else {
          this.lookupMsg = '政府資料庫查詢失敗，請稍後再試或手動輸入'; this.lookupOk = false
        }
      } catch(e) {
        this.lookupMsg = '查詢逾時，請確認網路連線'; this.lookupOk = false
      }
      this.lookingUp = false
    },

    addTag() {
      const t = this.tagInput.trim()
      if (!Array.isArray(this.form.tags)) this.form.tags = []
      if (t && !this.form.tags.includes(t)) this.form.tags.push(t)
      this.tagInput = ''
    },
    removeTag(idx) {
      if (Array.isArray(this.form.tags)) this.form.tags.splice(idx, 1)
    },

    async save() {
      if (!this.form.name.trim()) { this.errMsg = '名稱為必填'; return }
      this.saving = true; this.errMsg = ''
      const body = {
        name: this.form.name.trim(), tax_id: this.form.tax_id || '',
        contact_name: this.form.contact_name || '', phone: this.form.phone || '',
        email: this.form.email || '', address: this.form.address || '',
        data: {
          notes: this.form.data_notes || '',
          category: this.form.category || '',
          tags: this.form.tags || [],
          visits: this._pendingVisits,
          bankCode: this.form.bank_code || '',
          bankName: this.form.bank_name || '',
          bankBranch: this.form.bank_branch || '',
          bankAccountName: this.form.bank_account_name || '',
          bankAccountNumber: this.form.bank_account_number || ''
        }
      }
      const method = this.editId ? 'PUT' : 'POST'
      const url    = this.editId ? `${API}/vendor-contractors/${this.editId}` : `${API}/vendor-contractors`
      try {
        const r = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.session.token },
          body: JSON.stringify(body)
        })
        if (!r.ok) { this.errMsg = (await r.json()).detail || '儲存失敗'; this.saving = false; return }
        const d = await r.json()
        const targetId = this.editId || d.id
        if (this.bankPassbookPreview !== null && targetId) {
          await fetch(`${API}/vendor-contractors/${targetId}/passbook`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.session.token },
            body: JSON.stringify({ bank_passbook: this.bankPassbookPreview })
          })
        }
        this.showModal = false
        await this.load()
        if (this.editId) {
          const updated = this.vendors.find(v => v.id === this.editId)
          if (updated) await this.selectVendor(updated)
        }
      } catch(e) { this.errMsg = '網路錯誤：' + e.message }
      this.saving = false
    },

    async toggleActive(v) {
      if (!v) return
      const action = v.active ? '停用' : '啟用'
      if (!confirm(`確定要${action}「${v.name}」？`)) return
      const r = await fetch(`${API}/vendor-contractors/${v.id}/active`, {
        method: 'PATCH',
        headers: { Authorization: 'Bearer ' + this.session.token }
      })
      if (r.ok) {
        await this.load()
        const updated = this.vendors.find(u => u.id === v.id)
        if (updated) {
          this.selectedVendor = { ...updated }
          this.editVisits = JSON.parse(JSON.stringify(updated.visits || []))
        } else {
          this.selectedId = null; this.selectedVendor = null
        }
      }
    },

    addVisit() {
      const today = new Date().toISOString().slice(0, 10)
      this.editVisits.push({ id: Date.now() + Math.random(), date: today, note: '' })
    },
    removeVisit(idx) { this.editVisits.splice(idx, 1) },

    async saveVisits() {
      if (!this.selectedVendor) return
      this.visitSaving = true; this.visitMsg = ''
      try {
        const r = await fetch(`${API}/vendor-contractors/${this.selectedVendor.id}/visits`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.session.token },
          body: JSON.stringify({ visits: this.editVisits, expectedUpdatedAt: this.selectedVendor.updatedAt })
        })
        if (r.ok) {
          const d = await r.json()
          this.selectedVendor.updatedAt = d.updated_at
          this.visitMsg = `✓ 已儲存 ${d.count} 筆往來紀錄`
        } else {
          this.visitMsg = (await r.json()).detail || '儲存失敗'
        }
      } catch(e) { this.visitMsg = '網路錯誤' }
      this.visitSaving = false
    },

    exportExcel() {
      const rows = this.vendors.map(v => ({
        '承攬商名稱': v.name || '', '承攬商類型': v.category || '', '統一編號': v.taxId || '',
        '聯絡人': v.contactName || '', '電話': v.phone || '', 'Email': v.email || '',
        '地址': v.address || '', '內部標籤': (v.tags || []).join(','),
        '備注': v.notes || '', '狀態': v.active ? '往來中' : '停用'
      }))
      const ws = XLSX.utils.json_to_sheet(rows)
      ws['!cols'] = [22, 12, 10, 12, 14, 22, 24, 16, 20, 8].map(w => ({ wch: w }))
      const wb = XLSX.utils.book_new()
      XLSX.utils.book_append_sheet(wb, ws, '承攬商')
      XLSX.writeFile(wb, `MOTRIX_承攬商_${new Date().toISOString().slice(0, 10)}.xlsx`)
    },

    async handleImport(event) {
      const file = event.target.files[0]
      if (!file) return
      event.target.value = ''
      this.importing = true; this.showImportModal = true; this.importResults = null
      const results = { created: 0, updated: 0, failed: 0, errors: [] }
      try {
        const wb = XLSX.read(await file.arrayBuffer())
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' })
        for (let i = 0; i < rows.length; i++) {
          try {
            const obj = this._parseVendorRow(rows[i])
            if (!obj.name) { results.failed++; results.errors.push(`第 ${i + 2} 行：名稱不可空白`); continue }
            const match = this.vendors.find(v =>
              (obj.tax_id && v.taxId && v.taxId === obj.tax_id) || v.name === obj.name
            )
            const r = await fetch(match ? `${API}/vendor-contractors/${match.id}` : `${API}/vendor-contractors`, {
              method: match ? 'PUT' : 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.session.token },
              body: JSON.stringify(obj)
            })
            if (r.ok) { match ? results.updated++ : results.created++ }
            else { results.failed++; results.errors.push(`${obj.name}：${match ? '更新' : '新增'}失敗 (${r.status})`) }
          } catch(e) { results.failed++; results.errors.push(`第 ${i + 2} 行：${e.message}`) }
        }
        await this.load()
      } catch(e) { results.failed++; results.errors.push('檔案解析失敗：' + e.message) }
      this.importResults = results; this.importing = false
    },

    _parseVendorRow(row) {
      const n = {}
      for (const [k, v] of Object.entries(row)) n[k.trim()] = String(v ?? '').trim()
      const tags = n['內部標籤'] ? n['內部標籤'].split(/[,，、]/).map(t => t.trim()).filter(Boolean) : []
      return {
        name: n['承攬商名稱'] || n['名稱'] || '',
        tax_id: (n['統一編號'] || n['統編'] || '').replace(/\D/g, ''),
        contact_name: n['聯絡人'] || '',
        phone: n['電話'] || '',
        email: n['Email'] || n['email'] || '',
        address: n['地址'] || '',
        data: {
          category: n['承攬商類型'] || '',
          notes: n['備注'] || '',
          tags
        }
      }
    },

    _dStatusClass(s) {
      return { draft: 'draft', sent: 'pending', confirmed: 'approved', completed: 'settled', cancelled: 'danger' }[s] || 'draft'
    }
  }
}
</script>
