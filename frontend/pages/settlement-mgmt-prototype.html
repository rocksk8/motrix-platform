<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成本精算｜管理視角 — 互動原型</title>
<!-- 獨立靜態原型：假資料、無後端、雙擊即可開。版面順序＝高階摘要 → 需處理 → 品項表 → 未對應處理 → 總結（扣費前後）→ 對帳與稽核。
     門檻與政策全部集中在下方 CONFIG（一處改）。公式全部沿用既有定義，不新增。 -->
<style>
  :root{
    --bg:#F5F4F0; --card:#fff; --ink:#111; --ink2:#55534E; --line:#E3E0D8; --line2:#EFEDE7;
    --mat:#1D4ED8; --mat-bg:#DBEAFE; --ext:#475569; --ext-bg:#E2E8F0; --dis:#6D28D9; --dis-bg:#EDE9FE; --po:#0F766E; --po-bg:#CCFBF1;
    --ok:#15803D; --ok-bg:#ECFDF3; --ok-line:#86EFAC; --warn:#92400E; --warn-bg:#FEF3C7; --warn-line:#FCD34D; --bad:#B91C1C; --bad-bg:#FEE2E2; --bad-line:#FCA5A5;
    --num:"SF Mono","Cascadia Mono",Consolas,"Noto Sans TC",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:0 16px 80px}
  .num{font-family:var(--num);font-variant-numeric:tabular-nums;text-align:right}
  .neg{color:var(--bad)} .pos{color:var(--ok)}
  [title]{cursor:help}
  .proto{background:#111;color:#eee;font-size:12px;padding:8px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .proto button,.proto label{font:inherit}
  .proto button{background:#333;color:#fff;border:1px solid #555;border-radius:6px;padding:3px 10px;cursor:pointer}
  .proto label{display:flex;gap:6px;align-items:center;cursor:pointer}

  /* (a) 高階摘要列：sticky */
  .strip{position:sticky;top:0;z-index:30;background:var(--bg);padding:10px 0 8px;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line)}
  .kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
  .kpi{background:var(--card);border:1px solid var(--line);border-left-width:6px;border-radius:8px;padding:6px 10px;min-width:0}
  .kpi .k{font-size:11px;color:var(--ink2);display:flex;gap:4px;align-items:center}
  .kpi .v{font-size:18px;font-weight:800;line-height:1.25;white-space:nowrap}
  .kpi .s{font-size:11px;color:var(--ink2)}
  .kpi.g{border-left-color:var(--ok);background:var(--ok-bg)} .kpi.a{border-left-color:#D97706;background:var(--warn-bg)} .kpi.r{border-left-color:var(--bad);background:var(--bad-bg)} .kpi.n{border-left-color:#9CA3AF}
  .kpi .st{font-weight:700}
  .kpi.g .st{color:var(--ok)} .kpi.a .st{color:var(--warn)} .kpi.r .st{color:var(--bad)}

  h2{font-size:15px;margin:22px 0 6px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  h2 small{font-weight:400;color:var(--ink2);font-size:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .pad{padding:12px 14px}

  /* (b) 需處理 */
  .exc{display:grid;gap:0}
  .exc .it{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 14px;border-top:1px solid var(--line2)}
  .exc .it:first-child{border-top:0}
  .exc .ic{font-size:16px;text-align:center}
  .exc .tx b{font-weight:700} .exc .tx small{display:block;color:var(--ink2);font-size:12px}
  .exc .it.r{background:var(--bad-bg)} .exc .it.a{background:var(--warn-bg)}
  .exc-ok{padding:12px 14px;background:var(--ok-bg);color:var(--ok);font-weight:700}
  .btn{font:inherit;font-size:12px;border:1px solid #BDB8AB;background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}
  .btn:hover{background:#F5F4F0} .btn.danger{color:var(--bad);border-color:var(--bad-line)} .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:#111;color:#fff;border-color:#111} .btn.primary:disabled{background:#999;border-color:#999}

  /* readiness */
  .ready{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 14px;align-items:center;padding:12px 14px;border:2px solid;border-radius:10px;margin-top:10px}
  .ready.ok{background:var(--ok-bg);border-color:var(--ok-line)} .ready.no{background:var(--warn-bg);border-color:var(--warn-line)} .ready.no.bad{background:var(--bad-bg);border-color:var(--bad-line)}
  .ready .big{font-size:16px;font-weight:800} .ready ul{margin:4px 0 0;padding-left:18px;font-size:12px}
  .ready .why{font-size:11px;color:var(--ink2);margin-top:2px}

  /* (c) 品項表 */
  .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);background:#FAF9F6;font-size:12px}
  .tools .chipf{border:1px solid #BDB8AB;background:#fff;border-radius:999px;padding:2px 10px;cursor:pointer;font:inherit}
  .tools .chipf[aria-pressed="true"]{background:#111;color:#fff;border-color:#111}
  table.it{width:100%;border-collapse:collapse;font-size:13px}
  table.it th{font-size:11px;color:var(--ink2);font-weight:600;padding:6px 8px;border-bottom:2px solid #111;text-align:right;white-space:nowrap;background:#fff}
  table.it th:nth-child(-n+2),table.it td:nth-child(-n+2){text-align:left}
  table.it th button{all:unset;cursor:pointer;font-weight:700;color:inherit}
  table.it th button:hover,table.it th button:focus-visible{text-decoration:underline}
  table.it td{padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
  table.it tr.main{cursor:pointer} table.it tr.main:hover td{background:#FAF9F6}
  table.it tr.loss td{background:#FFF5F5}
  table.it tr.flash td{animation:flash 1.1s ease-out}
  @keyframes flash{from{background:#FEF08A}}
  table.it td.gp{font-size:16px;font-weight:800}
  table.it tr.sum td{border-top:2px solid #111;font-weight:800;background:#FAF9F6}
  .tw{overflow-x:auto}
  .tag{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:0 6px;white-space:nowrap}
  .tag.est{background:var(--warn-bg);color:var(--warn)} .tag.map,.tag.po{background:var(--ok-bg);color:var(--ok)} .tag.man{background:var(--mat-bg);color:var(--mat)}
  .chip{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:1px 7px;white-space:nowrap}
  .chip.material{color:var(--mat);background:var(--mat-bg)} .chip.extra{color:var(--ext);background:var(--ext-bg)} .chip.dispatch{color:var(--dis);background:var(--dis-bg)} .chip.po{color:var(--po);background:var(--po-bg)}
  .badge{display:inline-block;font-size:11px;border-radius:999px;padding:0 8px;font-weight:600}
  .badge.pending{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)} .badge.st{background:var(--line2);color:var(--ink2)} .badge.mapped{background:var(--ok);color:#fff}
  tr.detail td{background:#FBFAF7;padding:0}
  .dbox{padding:8px 14px 12px}
  .drow{display:grid;grid-template-columns:78px minmax(0,1fr) 140px 250px;gap:6px 12px;align-items:center;padding:7px 10px;margin-top:6px;border-radius:6px;background:#fff;border:1px solid var(--line2)}
  .drow.mapped{background:var(--ok-bg);border-color:var(--ok-line);box-shadow:inset 5px 0 0 var(--ok)}
  .drow .meta{font-size:12px;color:var(--ink2)} .drow .net{font-weight:800}
  .drow .tax{font-size:11px;color:#77746C}
  select,input[type=number]{font:inherit;padding:5px 8px;border:1px solid #BDB8AB;border-radius:6px;background:#fff;color:var(--ink);max-width:100%}
  select{width:100%} select:disabled,input:disabled{background:#F1F0EC;color:#777}
  .adopt{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 0 2px;font-size:12px}
  .sw{display:inline-flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;user-select:none}
  .sw input{position:absolute;opacity:0;width:0;height:0}
  .sw i{width:34px;height:20px;border-radius:999px;background:#9A968A;position:relative;transition:.15s;flex:none}
  .sw i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
  .sw input:checked + i{background:var(--ok)} .sw input:checked + i::after{left:16px}
  .sw input:focus-visible + i{outline:2px solid #111;outline-offset:2px}
  .hint{font-size:11px;color:var(--ink2)} .hint.warn{color:var(--warn);font-weight:600}
  .grp{padding:6px 14px;background:#FAF9F6;font-size:12px;font-weight:700;color:var(--ink2);border-top:1px solid var(--line)}
  .empty{padding:14px;color:var(--ok);font-weight:700;background:var(--ok-bg)}

  /* (d) 總結 */
  .headline{border:2px solid;border-radius:10px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline}
  .headline.good{border-color:var(--ok-line);background:var(--ok-bg)} .headline.bad{border-color:var(--bad-line);background:var(--bad-bg)}
  .headline .hn{font-size:30px;font-weight:800;line-height:1.1}
  .blocks{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
  .blk{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-width:0;overflow-x:auto}
  .blk h4{margin:0 0 6px;font-size:14px}
  table.bt{width:100%;border-collapse:collapse;font-size:13px}
  table.bt th{font-size:11px;color:var(--ink2);font-weight:600;text-align:right;padding:5px 6px;border-bottom:2px solid #111}
  table.bt td{padding:6px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
  table.bt td:first-child,table.bt th:first-child{text-align:left;white-space:normal}
  table.bt tr.strong td{font-weight:800;font-size:15px;background:#FAF9F6}
  table.bt .basis{font-size:10px;color:var(--ink2);font-weight:400}

  /* (e) 對帳與稽核 */
  .audit{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;font-size:12px;padding:12px 14px}
  .audit dt{color:var(--ink2)} .audit dd{margin:0 0 4px;font-weight:600}
  .recon{padding:10px 14px;font-size:12px;display:grid;gap:3px;border-bottom:1px solid var(--line2)}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111;color:#fff;border-radius:8px;padding:8px 16px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:90vw}
  .toast.on{opacity:1}

  @media (max-width:900px){
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .kpi .v{font-size:16px}
    .blocks{grid-template-columns:1fr} .audit{grid-template-columns:1fr}
    .drow{grid-template-columns:62px minmax(0,1fr)} .drow>*{min-width:0} .drow .money{grid-column:2} .drow .ctl{grid-column:1 / -1}
    .ready{grid-template-columns:auto minmax(0,1fr)} .ready .act{grid-column:1 / -1}
    .exc .it{grid-template-columns:24px minmax(0,1fr)} .exc .it button{grid-column:2;justify-self:start}
    .strip{position:static}
    table.it th:nth-child(4),table.it td:nth-child(4),table.it th:nth-child(7),table.it td:nth-child(7),table.it th:nth-child(10),table.it td:nth-child(10){display:none}
    table.it td:nth-child(2){min-width:120px}
    table.it tr.detail td{display:table-cell}
  }
  /* 列印／PDF：A4、不用 sticky／浮層、展開全部明細、隱藏操作元件 */
  @page{size:A4;margin:12mm}
  @media print{
    body{background:#fff;font-size:11px} .proto,.noprint,.toast,.tools,.btn,.sw,select,.adopt .hint.warn+*{display:none!important}
    .strip{position:static;border:0} .card,.blk,.kpi,.headline{break-inside:avoid;border-color:#999}
    tr.detail{display:table-row!important} .wrap{max-width:none;padding:0}
    .kpi{border-left-width:4px} *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
<div class="proto">
  <b>原型</b><span>假資料、不存檔。試：點品項列展開明細、對應／取消、採用、手填、排序／篩選、模擬完結、Ctrl+P 看列印版。</span>
  <label><input type="checkbox" id="frz"> 模擬已完結（凍結）</label>
  <button id="reset">重設資料</button>
</div>
<div class="wrap">
  <div class="strip" id="strip" data-testid="stl-strip"></div>

  <h2>需處理 <small>每一項都可點「前往」直接跳到該列</small></h2>
  <div class="card" id="exc" data-testid="stl-exceptions"></div>
  <div class="ready" id="ready" data-testid="stl-ready"></div>

  <h2>報價品項 <small>點列展開：對應的材料／採購／派發／額外支出、採用與手填</small></h2>
  <div class="card"><div class="tools noprint" id="tools"></div><div class="tw"><table class="it" id="items" data-testid="stl-items"></table></div></div>

  <h2>未對應項目處理 <small>沒對應的錢一律照算（計入總成本）；選品項＝改算在該品項的實際成本，原單據不動</small></h2>
  <div class="card" id="un" data-testid="stl-unassigned"></div>

  <h2>總結 <small>原始＝報價單估計；精算後＝本次精算（總成本與伺服器同源）</small></h2>
  <div id="totals"></div>

  <h2>對帳與稽核</h2>
  <div class="card"><div class="recon" id="recon" data-testid="stl-recon"></div><dl class="audit" id="audit"></dl></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ───────── 門檻與政策（唯一設定處，需使用者確認）───────── */
const CONFIG = {
  GP_DROP_PP: 5,            // 品項毛利比比原始（估計）低超過 N 個百分點 → 列入「需處理」
  LOSS_GP_BELOW: 0,         // 毛利 < 此值＝虧損
  PENDING_WARN: true,       // 待審核金額列入「需處理」（照計成本，只提醒）
  BLOCK_ON_UNASSIGNED: false,// 使用者裁示：未對應項目只警示、不擋完結（仍計入成本）；硬性擋住的只有「對帳差額≠0」與已凍結
  BLOCK_ON_PENDING: false,  // 有待審核金額 → 不可完結
  BLOCK_ON_NO_RECORD: false,// 無採購紀錄且未手填的品項 → 不可完結（預設只警示）
  RECON_TOLERANCE: 0        // 對帳差額容許值（元）
};

const SEED = () => ({
  items: [
    {id:'101', name:'主臥室系統櫃', qty:6, unit:'組', price:40000, est:180000, adopt:true, manual:0, tag:'手填'},
    {id:'102', name:'客廳電視牆木作', qty:1, unit:'式', price:130000, est:95000, adopt:false, manual:0, tag:'手填'},
    {id:'103', name:'全室水電配管', qty:1, unit:'式', price:160000, est:120000, adopt:true, manual:0, tag:'手填'},
    {id:'104', name:'衛浴防水與磁磚', qty:2, unit:'間', price:55000, est:86000, adopt:false, manual:0, tag:'手填'},
    {id:'105', name:'油漆粉刷（全室）', qty:1, unit:'式', price:90000, est:64000, adopt:true, manual:0, tag:'手填'},
    {id:'106', name:'現場監工（人力）', qty:10, unit:'人日', price:7000, est:50000, adopt:false, manual:0, tag:'人力'},
  ],
  po: [{id:'PO-0912', itemId:'103', name:'電線電纜（採購單）', amount:38500}],
  docs: [
    {kind:'material', id:'MR-2210', code:'MR-2210', name:'系統櫃五金組', vendor:'倉庫申請', status:'已核准', amount:12600, tax:630, pending:false, itemId:'101'},
    {kind:'material', id:'MR-2214', code:'MR-2214', name:'矽酸鈣板 ×24', vendor:'倉庫申請', status:'待審核', amount:9800, tax:490, pending:true, itemId:null},
    {kind:'extra', id:'EX-0388', code:'EX-0388', name:'垃圾清運費', vendor:'額外支出', status:'已核准', amount:6500, tax:0, pending:false, itemId:null},
    {kind:'dispatch', id:'D-2610-001', code:'D-2610-001', name:'水電配管施作 第一期', vendor:'宏達水電行', status:'已核准', amount:58000, tax:2900, pending:false, itemId:'103'},
    {kind:'dispatch', id:'D-2610-002', code:'D-2610-002', name:'衛浴防水施作', vendor:'安固防水工程', status:'已核准', amount:32000, tax:1600, pending:false, itemId:null},
    {kind:'dispatch', id:'D-2610-003', code:'D-2610-003', name:'電視牆木作安裝（含外包人員）', vendor:'木匠師傅工作室', status:'待審核', amount:41500, tax:2075, pending:true, itemId:null},
    {kind:'dispatch', id:'D-2610-004', code:'D-2610-004', name:'全室油漆批土＋噴漆', vendor:'彩匠油漆', status:'已核准', amount:52000, tax:2600, pending:false, itemId:null},
  ],
  adjust: -10000, frozen:false, finalizedAt:null
});
let S = SEED();
let ST = {sort:null, dir:-1, filter:'all', open:{}};
let flashId = null;
const KL = {material:'材料申請', extra:'額外支出', dispatch:'承攬商派發'};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R = n => Math.round(n);
/* 金額：千分位；負數＝紅色＋括號（不只靠顏色）；右對齊＋等寬數字 */
const N = n => { const v = R(n); return v < 0 ? '(' + Math.abs(v).toLocaleString('en-US') + ')' : v.toLocaleString('en-US'); };
const Nc = n => `<span class="${R(n) < 0 ? 'neg' : ''}">${N(n)}</span>`;
const Ng = n => `<span class="${R(n) < 0 ? 'neg' : R(n) > 0 ? 'pos' : ''}">${R(n) > 0 ? '+' : ''}${N(n)}</span>`;
const P = v => v == null ? '—' : (v < 0 ? '(' + Math.abs(v).toFixed(1) + '%)' : v.toFixed(1) + '%');
const Pc = v => `<span class="${v != null && v < 0 ? 'neg' : ''}">${P(v)}</span>`;
const PP = v => v == null ? '—' : `<span class="${v < 0 ? 'neg' : v > 0 ? 'pos' : ''}">${v > 0 ? '+' : v < 0 ? '−' : ''}${Math.abs(v).toFixed(1)} pp</span>`;
const itemOf = id => S.items.find(i => i.id === id);
const itemNo = id => S.items.findIndex(i => i.id === id) + 1;

/* ───────── 計算（沿用既有定義）───────── */
function calc(){
  const per = {};
  S.items.forEach(it => {
    const po = S.po.filter(p => p.itemId === it.id), poSum = po.reduce((a,p) => a + p.amount, 0);
    const mine = S.docs.filter(d => d.itemId === it.id);
    const m = {material:0, extra:0, dispatch:0}; mine.forEach(d => m[d.kind] += d.amount);
    const mapped = m.material + m.extra + m.dispatch + poSum;
    const adopted = it.adopt && mapped > 0;
    const manual = +it.manual || 0;
    const key = adopted ? (poSum && (m.material + m.extra + m.dispatch) ? 'po-map' : poSum ? 'po' : 'map') : manual > 0 ? 'man' : 'est';
    const label = {'po-map':'採購單＋已對應', po:'採購單', map:'已對應', man:'手填' + (it.tag && it.tag !== '手填' ? '・' + it.tag : ''), est:'估計'}[key];
    const actual = adopted ? mapped : manual > 0 ? manual : it.est;
    const quote = it.qty * it.price, profit = quote - actual, pct = quote > 0 ? profit / quote * 100 : null;
    const oProfit = quote - it.est, oPct = quote > 0 ? oProfit / quote * 100 : null;
    const pending = mine.filter(d => d.pending).reduce((a,d) => a + d.amount, 0);
    per[it.id] = {po, poSum, mine, m, mapped, adopted, manual, key, label, actual, quote, profit, pct, oPct, dpp: pct == null ? null : pct - oPct,
                  varAmt: actual - it.est, varPct: it.est > 0 ? (actual - it.est) / it.est * 100 : null,
                  noRecord: !mapped && !manual, pending, unit: it.qty > 0 ? it.price - actual / it.qty : null};
  });
  const un = S.docs.filter(d => !d.itemId), as = S.docs.filter(d => d.itemId);
  const sum = a => a.reduce((x,d) => x + d.amount, 0);
  const keptOutside = as.filter(d => !per[d.itemId].adopted);
  const itemsActual = S.items.reduce((a,it) => a + per[it.id].actual, 0);
  const quoteItems = S.items.reduce((a,it) => a + per[it.id].quote, 0);
  const quoteTotal = quoteItems + S.adjust;
  const total = itemsActual + sum(un) + sum(keptOutside);
  const oCost = S.items.reduce((a,it) => a + it.est, 0);
  const gp = quoteTotal - total, oGp = quoteTotal - oCost;
  const admin = R(quoteTotal * 0.10), oAdmin = admin;
  const ch = R(gp * 0.01), oCh = R(oGp * 0.01);
  const net = gp - admin - ch, oNet = oGp - oAdmin - oCh;
  const pendingAll = sum(S.docs.filter(d => d.pending));
  const reconQuote = quoteItems + S.adjust - quoteTotal;
  const reconCost = itemsActual + sum(un) + sum(keptOutside) - total;
  return {per, un, as, unTotal:sum(un), asTotal:sum(as), all:sum(S.docs), keptOutside:sum(keptOutside), itemsActual, quoteItems, quoteTotal, total,
          oCost, gp, oGp, admin, oAdmin, ch, oCh, net, oNet, pendingAll, reconQuote, reconCost,
          byKind: k => ({un: sum(un.filter(d => d.kind === k)), as: sum(as.filter(d => d.kind === k))})};
}

/* ───────── 動作 ───────── */
function setOffset(id, itemId){ if (S.frozen) return; const d = S.docs.find(x => x.id === id); d.itemId = itemId || null; flashId = 'doc:' + id; if (itemId) ST.open[itemId] = true; render(); toast(itemId ? `已對應：${d.code} → #${itemNo(itemId)} ${itemOf(itemId).name}` : `已取消對應：${d.code} 回到未對應（仍計入成本）`); }
function jump(sel, openItem){
  if (openItem) ST.open[openItem] = true;
  render();
  const el = document.querySelector(sel); if (!el) return;
  el.scrollIntoView({block:'center', behavior:'smooth'}); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1200);
}
let tt; function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200); }

/* ───────── 繪製 ───────── */
function render(){
  const c = calc();
  const exc = exceptions(c);
  drawStrip(c); drawExc(c, exc); drawReady(c, exc); drawTools(c); drawItems(c); drawUn(c); drawTotals(c); drawRecon(c);
  bind(); flashId = null;
}

function kpi(label, val, sub, cls, status, tip){
  return `<div class="kpi ${cls}" title="${esc(tip)}"><div class="k">${label}</div><div class="v num" style="text-align:left">${val}</div><div class="s">${sub} <span class="st">${status}</span></div></div>`;
}
function drawStrip(c){

  const oGpPct = rev > 0 ? c.oGp / rev * 100 : null, oNetPct = rev > 0 ? c.oNet / rev * 100 : null;

    ${kpi('總成本', N(c.total), '原始 ' + N(c.oCost), c.total > c.oCost ? 'a' : 'g', c.total > c.oCost ? '▲ 高於原始' : '▼ 低於原始', '總實際成本＝品項實際＋未對應項目（派發未稅口徑）；與伺服器 totalActualCost 同源')}
    ${kpi('毛利／毛利比', Nc(c.gp) + ' ／ ' + Pc(gpPct), '原始 ' + P(oGpPct), gpCls, gpCls === 'r' ? '✖ 虧損' : gpCls === 'a' ? '▲ 低於原始' : '✔ 正常', '毛利＝報價 − 總成本；毛利比＝毛利 ÷ 報價（未扣管理費、公益）')}
    ${kpi('最終淨利／淨利比', Nc(c.net) + ' ／ ' + Pc(netPct), '原始 ' + P(oNetPct), netCls, netCls === 'r' ? '✖ 虧損' : netCls === 'a' ? '▲ 低於原始' : '✔ 正常', '最終淨利＝毛利 − 管理費（報價×10%）− 公益（毛利×1%）')}
    ${kpi('與原始差額（淨利）', Ng(dNet), (c.oNet !== 0 ? (dNet >= 0 ? '+' : '−') + Math.abs(dNet / c.oNet * 100).toFixed(1) + '%' : '—') + '　原始 ' + N(c.oNet), dNet < 0 ? 'r' : 'g', dNet < 0 ? '▼ 少賺' : '▲ 多賺', '差額＝精算後最終淨利 − 原始（報價單估計）最終淨利')}
  </div>${S.frozen ? '<div class="hint" style="margin-top:4px"><b>🔒 已完結・唯讀</b>　' + esc(S.finalizedAt) + '</div>' : ''}`;

/* (b) 例外：每項附跳轉目標 */
function exceptions(c){
  const L = [];
  if (c.un.length) L.push({lv: CONFIG.BLOCK_ON_UNASSIGNED ? 'r' : 'a', ic:'⚠', t:`未對應 ${c.un.length} 件，NT$ ${N(c.unTotal)}`, s:'仍計入總成本；對應到品項才會取代估計', go:'#un'});
  if (CONFIG.PENDING_WARN && c.pendingAll) L.push({lv:'a', ic:'⏳', t:`待審核金額 NT$ ${N(c.pendingAll)}`, s:'待審照計成本，核准前可能變動', go:'#un'});
  S.items.forEach(it => { const p = c.per[it.id];
    if (p.profit < CONFIG.LOSS_GP_BELOW) L.push({lv:'r', ic:'✖', t:`#${itemNo(it.id)} ${it.name}：虧損 ${N(p.profit)}（毛利比 ${P(p.pct)}）`, s:`報價 ${N(p.quote)}，實際成本 ${N(p.actual)}`, go:`#row-${it.id}`, item:it.id});
    else if (p.dpp != null && p.dpp < -CONFIG.GP_DROP_PP) L.push({lv:'a', ic:'▼', t:`#${itemNo(it.id)} ${it.name}：毛利比比原始低 ${Math.abs(p.dpp).toFixed(1)} pp`, s:`${P(p.oPct)} → ${P(p.pct)}（門檻 ${CONFIG.GP_DROP_PP} pp）`, go:`#row-${it.id}`, item:it.id});
  });
  const nr = S.items.filter(it => c.per[it.id].noRecord);
  if (nr.length) L.push({lv: CONFIG.BLOCK_ON_NO_RECORD ? 'r' : 'a', ic:'📝', t:`${nr.length} 個品項無採購／對應紀錄且未手填：${nr.map(i => '#' + itemNo(i.id)).join('、')}`, s:'實際成本暫以估計計；已採購未建系統（歷史）或人力成本請手填', go:`#row-${nr[0].id}`, item:nr[0].id});
  if (S.adjust !== 0) L.push({lv:'a', ic:'±', t:`折扣／調整 NT$ ${N(S.adjust)}`, s:'報價收入與品項報價加總不同；已單列於對帳', go:'#recon'});
  if (Math.abs(c.reconQuote) > CONFIG.RECON_TOLERANCE || Math.abs(c.reconCost) > CONFIG.RECON_TOLERANCE) L.push({lv:'r', ic:'✖', t:`對帳差額不為 0（報價 ${N(c.reconQuote)}／成本 ${N(c.reconCost)}）`, s:'加總對不上，需查明', go:'#recon'});
  return L;
}
function drawExc(c, L){
  $('exc').innerHTML = L.length ? `<div class="exc">${L.map((e, i) => `<div class="it ${e.lv}"><div class="ic" aria-hidden="true">${e.ic}</div><div class="tx"><b>${esc(e.t)}</b><small>${esc(e.s)}</small></div><button class="btn noprint" data-go="${i}">前往</button></div>`).join('')}</div>` : '<div class="exc-ok">✔ 沒有需處理的項目</div>';
  window.__exc = L;
}
function drawReady(c, L){
  const hard = [], warns = [];
  if (Math.abs(c.reconQuote) > CONFIG.RECON_TOLERANCE) hard.push('報價對帳差額不為 0');
  if (Math.abs(c.reconCost) > CONFIG.RECON_TOLERANCE) hard.push('成本對帳差額不為 0');
  if (c.un.length) (CONFIG.BLOCK_ON_UNASSIGNED ? hard : warns).push(`有未對應項目（仍計入成本）：${c.un.length} 件，NT$ ${N(c.unTotal)}`);
  if (c.pendingAll) (CONFIG.BLOCK_ON_PENDING ? hard : warns).push(`有待審核金額 NT$ ${N(c.pendingAll)}（照計，核准前可能變動）`);
  if (S.items.some(it => c.per[it.id].noRecord)) (CONFIG.BLOCK_ON_NO_RECORD ? hard : warns).push('有品項無採購／對應紀錄且未手填（暫以估計計）');
  const el = $('ready');
  const cls = S.frozen ? 'ok' : hard.length ? 'no bad' : warns.length ? 'no' : 'ok';
  el.className = 'ready ' + cls;
  el.setAttribute('data-state', S.frozen ? 'frozen' : hard.length ? 'blocked' : warns.length ? 'warn' : 'ok');
  el.innerHTML = S.frozen
    ? `<div class="big" aria-hidden="true">🔒</div><div><div class="big">已完結</div><div class="why">${esc(S.finalizedAt)}　全部唯讀</div></div><div class="act"></div>`
    : `<div class="big" aria-hidden="true">${hard.length ? '✖' : warns.length ? '⚠' : '✔'}</div>
       <div><div class="big">${hard.length ? '不可完結' : warns.length ? '可完結（有提醒，仍計入成本）' : '可完結'}</div>
         ${(hard.length || warns.length) ? `<ul>${hard.map(b => `<li><b>✖ 必須處理：</b>${esc(b)}</li>`).join('')}${warns.map(b => `<li>⚠ ${esc(b)}</li>`).join('')}</ul>` : ''}
         <div class="why">最終以伺服器驗證為準（總成本與伺服器重算不符會拒絕）；以上為前端預檢。</div></div>
       <div class="act"><button class="btn primary noprint" id="fin" ${hard.length ? 'disabled' : ''} title="${hard.length ? esc('不可完結：' + hard.join('；')) : ''}" data-testid="stl-finalize">完結精算</button></div>`;

function drawTools(c){
  const f = ST.filter, mk = (k, l) => `<button class="chipf" data-f="${k}" aria-pressed="${f === k}">${l}</button>`;
  $('tools').innerHTML = `<b>篩選</b> ${mk('all','全部')}${mk('loss','虧損／低於原始')}${mk('un','有待審')}${mk('norec','無紀錄')} <span class="hint">排序：點欄名（毛利、毛利比、差異）</span>`;

function th(k, l, tip){ const a = ST.sort === k ? (ST.dir < 0 ? ' ▼' : ' ▲') : ''; return `<th title="${esc(tip)}"><button data-sort="${k}" aria-label="依${l}排序">${l}${a}</button></th>`; }
function drawItems(c){

  const body = rows.map(({it, p}) => {

  const sumRow = `<tr class="sum"><td></td><td>品項合計</td><td class="num">${N(c.quoteItems)}</td><td class="num">${N(c.oCost)}</td><td class="num">${N(c.itemsActual)}</td><td class="num">${Ng(c.itemsActual - c.oCost)}</td><td></td><td class="num">${Nc(c.quoteItems - c.itemsActual)}</td><td class="num">${Pc(c.quoteItems > 0 ? (c.quoteItems - c.itemsActual) / c.quoteItems * 100 : null)}</td><td></td></tr>`;
  $('items').innerHTML = head + `<tbody>${body || '<tr><td colspan="10" class="hint" style="padding:14px">沒有符合篩選的品項</td></tr>'}${sumRow}</tbody>`;

/* (d) 總結：原始 | 精算後 | 差額 */
function drawTotals(c){
  const rev = c.quoteTotal, pct = v => rev > 0 ? v / rev * 100 : null;
  const row = (label, basis, o, a, kind, tid, opt = {}) => {
    const d = opt.pct ? (a == null || o == null ? null : Math.round((a - o) * 10) / 10) : a - o;

  };
  const head = '<thead><tr><th></th><th>原始報價（估計）</th><th>精算後</th><th>差額（精算−原始）</th></tr></thead>';
  const dNet = c.net - c.oNet;
  $('totals').innerHTML = `
  <div class="headline ${dNet < 0 ? 'bad' : 'good'}" data-testid="stl-headline"><span class="hint"><b>精算後最終淨利</b></span><span class="hn num ${c.net < 0 ? 'neg' : 'pos'}">${N(c.net)}</span><span class="num ${dNet < 0 ? 'neg' : 'pos'}" style="font-weight:700">比原始報價 ${dNet < 0 ? '▼ 少' : '▲ 多'} ${N(Math.abs(dNet))}（${c.oNet !== 0 ? (dNet >= 0 ? '+' : '−') + Math.abs(dNet / c.oNet * 100).toFixed(1) + '%' : '—'}）</span></div>
  <div class="blocks"><div class="blk"><h4>① 扣管理費／公益前</h4><table class="bt num">${head}<tbody>
    ${row('報價（稅前收入）', '報價單稅前收入；兩邊相同', rev, rev, 'good', 'stl-b1-rev')}
    ${row('總成本', '原始＝Σ估計成本；精算後＝總實際成本', c.oCost, c.total, 'cost', 'stl-b1-cost')}
    ${row('毛利', '報價 − 總成本', c.oGp, c.gp, 'good', 'stl-b1-gp', {strong:true})}
    ${row('毛利比', '毛利 ÷ 報價', pct(c.oGp), pct(c.gp), 'good', 'stl-b1-gpp', {pct:true})}
    ${row('未扣費用淨利', '＝毛利（尚未扣管理費、公益）', c.oGp, c.gp, 'good', 'stl-b1-pre')}
  </tbody></table></div>
  <div class="blk"><h4>② 扣管理費／公益後</h4><table class="bt num">${head}<tbody>
    ${row('管理費', '報價稅前收入 × 10%', c.oAdmin, c.admin, 'cost', 'stl-b2-admin')}
    ${row('公益捐贈', '毛利 × 1%', c.oCh, c.ch, 'cost', 'stl-b2-ch')}
    ${row('最終淨利', '毛利 − 管理費 − 公益捐贈', c.oNet, c.net, 'good', 'stl-b2-net', {strong:true})}
    ${row('淨利比', '最終淨利 ÷ 報價', pct(c.oNet), pct(c.net), 'good', 'stl-b2-netp', {pct:true})}
  </tbody></table></div></div>`;
}

/* (e) 對帳與稽核 */
function drawRecon(c){
  const g = v => `<b class="${Math.abs(v) > CONFIG.RECON_TOLERANCE ? 'neg' : 'pos'}">${Math.abs(v) > CONFIG.RECON_TOLERANCE ? '✖ ' : '✔ '}${N(v)}</b>`;
  $('recon').innerHTML = `
    <div>對帳①　Σ品項報價 ${N(c.quoteItems)} ${S.adjust ? (S.adjust < 0 ? '− ' : '＋ ') + '折扣／調整 ' + N(Math.abs(S.adjust)) : ''} ＝ 報價收入 ${N(c.quoteTotal)}　差額 ${g(c.reconQuote)}</div>
    <div>對帳②　Σ品項實際成本 ${N(c.itemsActual)} ＋ 未對應項目 ${N(c.unTotal)} ＋ 已對應但品項未採用 ${N(c.keptOutside)} ＝ 總實際成本 ${N(c.total)}　差額 ${g(c.reconCost)}</div>
    <div>未對應 ${N(c.unTotal)} ＋ 已對應 ${N(c.asTotal)} ＝ 全部單據 ${N(c.all)}　<span class="hint">${['dispatch','material','extra'].map(k => KL[k] + ' ' + N(c.byKind(k).un) + '＋' + N(c.byKind(k).as)).join('　')}</span></div>`;
  $('audit').innerHTML = `
    <div><dt>金額口徑</dt><dd>報價／成本一律未稅；派發成本＝未稅承攬費＋外包人員（pretax），稅額僅供參考</dd></div>
    <div><dt>認列基礎</dt><dd>待審核單據照計（標示⏳）；已取消、草稿、已退回不計</dd></div>
    <div><dt>狀態</dt><dd>${S.frozen ? '已完結（凍結）' : '草稿（未凍結）'}</dd></div>
    <div><dt>凍結時間／人員</dt><dd>${S.frozen ? esc(S.finalizedAt) : '—'}</dd></div>
    <div><dt>資料截至</dt><dd>${new Date().toLocaleString('zh-TW', {hour12:false})}（原型：載入當下）</dd></div>
    <div><dt>管理費／公益</dt><dd>管理費＝報價×10%；公益＝毛利×1%（淨利只在總結區顯示）</dd></div>`;
}

function bind(){
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { const e = window.__exc[+b.dataset.go]; jump(e.go, e.item); });
  document.querySelectorAll('[data-open]').forEach(r => { const t = () => { ST.open[r.dataset.open] = !ST.open[r.dataset.open]; render(); }; r.onclick = e => { if (!e.target.closest('select,input,button,label')) t(); }; r.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); t(); } }; });
  document.querySelectorAll('[data-sort]').forEach(b => b.onclick = () => { if (ST.sort === b.dataset.sort) ST.dir *= -1; else { ST.sort = b.dataset.sort; ST.dir = -1; } render(); });
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { ST.filter = b.dataset.f; render(); });
  document.querySelectorAll('[data-act="map"]').forEach(el => el.onchange = () => setOffset(el.dataset.id, el.value));
  document.querySelectorAll('[data-act="unmap"]').forEach(el => el.onclick = () => setOffset(el.dataset.id, ''));
  document.querySelectorAll('[data-act="adopt"]').forEach(el => el.onchange = () => { itemOf(el.dataset.item).adopt = el.checked; render(); });
  document.querySelectorAll('[data-act="manual"]').forEach(el => el.onchange = () => { itemOf(el.dataset.item).manual = +el.value || 0; render(); });
  document.querySelectorAll('[data-act="tag"]').forEach(el => el.onchange = () => { itemOf(el.dataset.item).tag = el.value; render(); });
  const f = $('fin'); if (f) f.onclick = () => { S.frozen = true; S.finalizedAt = new Date().toLocaleString('zh-TW', {hour12:false}) + '　by 王小明（原型）'; $('frz').checked = true; render(); toast('已完結（原型模擬）'); };
  if (flashId) { const e = document.getElementById(flashId.replace('doc:', 'doc-')); if (e) { e.scrollIntoView({block:'nearest'}); } }
}
$('frz').onchange = e => { S.frozen = e.target.checked; S.finalizedAt = e.target.checked ? '2026-10-04 15:00　by 王小明（原型）' : null; render(); };
$('reset').onclick = () => { S = SEED(); ST = {sort:null, dir:-1, filter:'all', open:{}}; $('frz').checked = false; render(); };
render();
</script>
</body>
</html>
