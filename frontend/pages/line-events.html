<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{if(localStorage.getItem('motrix_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/api/system/branding/favicon">
  <title>LINE 通知事件 — MOTRIX PLATFORM</title>
  <script src="../static/auth-guard.js"></script>
  <link rel="stylesheet" href="../css/style.css?v=20260805g">
  <link rel="stylesheet" href="../css/settings-matrix.css?v=20261113a">
  <style>
    .le-main { margin-left: var(--sidebar-w); margin-top: var(--topbar-h); padding: 24px 28px 120px; min-height: calc(calc(100vh / var(--fz,1)) - var(--topbar-h)); background: var(--white); }
    .le-title { font-size: 20px; font-weight: 700; }
    .le-sub { font-size: 13px; color: var(--text-secondary); margin-top: 4px; max-width: 880px; line-height: 1.6; }
    .le-bar { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 14px; font-size: 13px; align-items: center; }
    .le-bar b { font-weight: 700; }
    .le-bar a { color: var(--info); }
    .le-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-secondary); margin: 6px 0 0; align-items: center; }
    .le-legend .mx-rc { width: 18px; height: 18px; font-size: 11px; cursor: default; vertical-align: middle; margin-right: 4px; }
    .le-warn { margin-top: 12px; padding: 10px 14px; border: 1px solid var(--danger-border); background: var(--danger-light); color: var(--danger); border-radius: var(--radius); font-size: 13px; }
    .le-people-list { max-height: 260px; overflow: auto; border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 10px; margin: 6px 0; }
    .le-people-list label, .le-roles label { display: block; padding: 3px 0; cursor: pointer; }
    .le-roles label { display: inline-block; margin-right: 14px; }
    .le-flag { color: var(--warning); font-size: 12px; margin-left: 4px; }
    .le-who { font-size: 12px; }
    @media (max-width: 900px) { .le-main { padding: 16px 12px 130px; } }
  </style>
</head>
<body>
  <header id="app-topbar" class="topbar"></header>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="app-sidebar"></aside>
  <main class="le-main">
    <div class="le-title">LINE 通知事件</div>
    <div class="le-sub">一張表管理所有 LINE 通知：每個事件要不要發、發給誰。點格子立即生效；勾選多列可一次套用，套用後可按「復原這一批」（只要這些事件沒被別人改過）。
      連線設定、綁定、總開關在 <a href="notification-settings.html" data-testid="le-back-link">通知設定</a>。</div>
    <div class="le-bar" id="le-bar" aria-live="polite"></div>
    <div class="le-legend" aria-label="圖例">
      <span><button type="button" class="mx-rc on f" tabindex="-1" aria-hidden="true">✓</button>灰藍＝在「原本的收件人」裡篩選這些角色</span>
      <span><button type="button" class="mx-rc on a" tabindex="-1" aria-hidden="true">✓</button>綠＝指定發給這些角色</span>
    </div>
    <div id="le-note"></div>
    <div id="le-box" data-testid="le-matrix"></div>
  </main>
  <script src="../static/settings-matrix.js"></script>
  <script src="../static/notif.js"></script>
  <script src="../static/sidebar.js"></script>
  <script>
  (function () {
    'use strict'
    var esc = SettingsMatrix.esc
    var session = {}
    try { session = JSON.parse(localStorage.getItem('motrix_session') || '{}') } catch (e) { session = {} }
    var ME = session.username || ''
    var ROLE_NAME = { superadmin: '最高管理者', admin: '管理員', sales: '業務', engineer: '工程師', viewer: '檢視者', finance: '財務' }
    var roleName = function (r) { return ROLE_NAME[r] || r }
    var MODES = [
      { value: 'business', label: '照原本收件人' },
      { value: 'business_plus', label: '原本＋指定' },
      { value: 'only', label: '只發給指定' },
    ]
    var cfg = { events: [], event_groups: [], role_choices: [], usage30: null }
    var bind = { users: [] }
    var mx = null

    function hdr(json) {
      var h = { Authorization: 'Bearer ' + (session.token || '') }
      if (json) h['Content-Type'] = 'application/json'
      return h
    }
    function detailText(d, fallback) {
      if (!d) return fallback
      if (typeof d.detail === 'string') return d.detail
      if (d.detail && d.detail.message) return d.detail.message
      return fallback
    }
    async function call(path, method, body) {
      var r = await fetch(path, { method: method || 'GET', headers: hdr(!!body), body: body ? JSON.stringify(body) : undefined })
      var d = await r.json().catch(function () { return {} })
      if (!r.ok) { var err = new Error(detailText(d, '操作失敗（' + r.status + '）')); err.status = r.status; err.data = d; throw err }
      return d
    }
    function batch(keys, fields) { return call('/api/settings/line-notify/events/batch', 'POST', Object.assign({ keys: keys }, fields)) }

    // ── 資料 ──
    function rowsOf(c) { return (c.events || []).map(function (e) { return e }) }
    async function load() {
      var d = await call('/api/settings/line-notify')
      cfg = d
      renderHead()
      return rowsOf(d)
    }
    async function loadBind() {
      try { var d = await call('/api/settings/line-notify/bindings'); bind = { users: d.users || [] } } catch (e) { bind = { users: [] } }
    }
    async function loadQuota() {
      try { var q = await call('/api/settings/line-notify/quota'); window.__leQuota = q } catch (e) { window.__leQuota = null }
      renderHead()
    }
    function renderHead() {
      var q = window.__leQuota, u = cfg.usage30
      var parts = []
      if (q && q.limit != null && !q.unlimited) parts.push('本月已用 <b>' + esc(q.used) + '</b> / ' + esc(q.limit) + ' 則' + (q.percent == null ? '' : '（' + q.percent.toFixed(0) + '%）'))
      else if (q && q.used != null) parts.push('本月已用 <b>' + esc(q.used) + '</b> 則')
      if (u) parts.push('近 30 天共推 <b data-testid="le-total30">' + esc(u.total) + '</b> 則' + (u.complete ? '' : '<span class="mx-mute" data-testid="le-accum">（已累積 ' + esc(u.accumulated_days) + ' 天，未滿 30 天）</span>'))
      document.getElementById('le-bar').innerHTML = parts.join('<span class="mx-mute">·</span>')
      document.getElementById('le-note').innerHTML = cfg.enabled === false ? '<div class="le-warn">LINE 通知的總開關目前是關閉的：下面的設定會先存起來，但在 <a href="notification-settings.html">通知設定</a> 打開之前不會發出任何訊息。</div>' : ''
    }

    // ── 事件狀態 ──
    function aud(r) { return r.audience || { mode: 'business', roles: [], users: [] } }
    function users(r) { return (aud(r).users || []) }
    function nobody(r) { var a = aud(r); return r.enabled && a.mode === 'only' && !(a.roles || []).length && !users(r).length }
    function canPick(e, u) {
      var need = e.need || []
      if (u.role === 'superadmin' || !need.length) return true
      if (need.indexOf('@admin') >= 0) return u.role === 'admin'
      var mods = u.modules || []
      return need.some(function (m) { return mods.indexOf(m) >= 0 })
    }
    function evByKey(k) { return cfg.events.filter(function (e) { return e.key === k })[0] }
    function names(keys) { return keys.map(function (k) { var e = evByKey(k); return e ? e.name : k }) }
    function listHtml(arr) { return '<ul>' + arr.map(function (n) { return '<li>' + esc(n) + '</li>' }).join('') + '</ul>' }

    // ── 人員／角色選擇視窗 ──
    function pickDialog(evs, init) {
      var st = { mode: init.mode === 'business' ? 'only' : init.mode, roles: (init.roles || []).slice(), users: (init.users || []).slice() }
      var cand = bind.users.filter(function (u) { return evs.every(function (e) { return canPick(e, u) }) })
      var html = '<div><b>誰要收</b></div>' +
        MODES.slice(1).map(function (m) { return '<label style="display:block;margin:3px 0"><input type="radio" name="le-mode" value="' + m.value + '"' + (st.mode === m.value ? ' checked' : '') + ' data-testid="le-pick-mode-' + m.value + '"> ' + esc(m.label) + '</label>' }).join('') +
        '<div style="margin-top:8px"><b>指定角色</b>（該角色所有在職同仁）</div><div class="le-roles">' +
        (cfg.role_choices || []).map(function (r) { return '<label><input type="checkbox" data-role="' + esc(r) + '"' + (st.roles.indexOf(r) >= 0 ? ' checked' : '') + '> ' + esc(roleName(r)) + '</label>' }).join('') + '</div>' +
        '<div style="margin-top:8px"><b>指定人員</b>' + (evs.length > 1 ? '<span class="mx-mute">（只列出對所有選取事件都有權限的人）</span>' : '') + '</div><div class="le-people-list">' +
        (cand.length ? cand.map(function (u) { return '<label><input type="checkbox" data-user="' + esc(u.username) + '"' + (st.users.indexOf(u.username) >= 0 ? ' checked' : '') + ' data-testid="le-pick-user-' + esc(u.username) + '"> ' + esc(u.display || u.username) + '（' + esc(roleName(u.role)) + '）' + (u.linked ? '' : '<span class="le-flag">尚未綁定 LINE</span>') + '</label>' }).join('') : '<span class="mx-mute">沒有可指定的人</span>') + '</div>' +
        '<div class="mx-mute">指定的人不受「可收角色」限制；本人自行關閉、離職、或還沒綁定 LINE 的人收不到。</div>'
      return SettingsMatrix.openDialog({
        title: evs.length > 1 ? '指定 ' + evs.length + ' 個事件的收件對象' : '「' + evs[0].name + '」誰要收',
        html: html,
        buttons: [{ label: '取消', value: null }, { label: '套用', value: 'ok', kind: 'primary' }],
        onOpen: function (body) {
          body.addEventListener('change', function (e) {
            var t = e.target
            if (t.name === 'le-mode') st.mode = t.value
            else if (t.getAttribute('data-role')) { var r = t.getAttribute('data-role'); st.roles = st.roles.filter(function (x) { return x !== r }); if (t.checked) st.roles.push(r) }
            else if (t.getAttribute('data-user')) { var u = t.getAttribute('data-user'); st.users = st.users.filter(function (x) { return x !== u }); if (t.checked) st.users.push(u) }
          })
        },
      }).then(function (v) { return v === 'ok' ? { mode: st.mode, roles: st.roles, users: st.users } : null })
    }
    function cancelled() { var e = new Error('cancelled'); e.cancelled = true; return e }

    // ── 欄位 ──
    var roleItems = function () { return (cfg.role_choices || []).map(function (r) { return { value: r, label: roleName(r), short: roleName(r).slice(0, 2) } }) }
    function critDialog(keys) {
      var crit = keys.filter(function (k) { var e = evByKey(k); return e && e.priority === 'critical' })
      if (!crit.length) return []
      return [{
        title: '關閉「重要」系統告警？', danger: true, okLabel: '仍要關閉',
        html: '<div class="mx-danger-box">下列通知關閉後，<b>這些情況發生時將不會再用 LINE 通知任何人</b>：</div>' + listHtml(names(crit)) + '<div class="mx-mute">這是系統安全／營運告警；關閉後請確認有其他管道（Email、系統內通知）接手。</div>',
      }]
    }
    var columns = [
      { id: 'on', type: 'switch', label: '開／關', width: 64,
        get: function (r) { return r.enabled },
        confirm: function (r, v) { return v ? [] : critDialog([r.key]) },
        set: function (r, v, ctx) { return batch([r.key], { enabled: v, confirm_critical: !!(ctx && ctx.confirmed) }) } },
      { id: 'mode', type: 'select', label: '收件對象', width: 150, options: MODES,
        show: function (r) { return r.enabled },
        get: function (r) { return aud(r).mode },
        set: function (r, v) {
          if (v === 'business') return batch([r.key], { audience: { mode: 'business', roles: [], users: [] } })
          var a = aud(r)
          var have = (a.roles || []).length || users(r).length
          if (have) return batch([r.key], { audience: { mode: v, roles: a.roles || [], users: users(r).map(function (u) { return u.username }) } })
          return pickDialog([r], { mode: v, roles: [], users: [] }).then(function (p) {
            if (!p) throw cancelled()
            return batch([r.key], { audience: p })
          })
        } },
      { id: 'roles', type: 'chips', label: '角色', items: [],   // items 於 mount 前以 role_choices 填入
        show: function (r) { return r.enabled },
        get: function (r) { return aud(r).mode === 'business' ? r.roles : (aud(r).roles || []) },
        tone: function (r) { return aud(r).mode === 'business' ? 'f' : 'a' },
        toggle: function (r, role, on) {
          var all = (cfg.role_choices || [])
          var business = aud(r).mode === 'business'
          var cur = business ? (r.roles == null ? all.slice() : r.roles.slice()) : (aud(r).roles || []).slice()
          cur = on ? (cur.indexOf(role) >= 0 ? cur : cur.concat([role])) : cur.filter(function (x) { return x !== role })
          if (business) {
            var send = all.every(function (x) { return cur.indexOf(x) >= 0 }) ? null : all.filter(function (x) { return cur.indexOf(x) >= 0 })
            return batch([r.key], { roles: send })
          }
          return batch([r.key], { audience: { mode: aud(r).mode, roles: all.filter(function (x) { return cur.indexOf(x) >= 0 }), users: users(r).map(function (u) { return u.username }) } })
        } },
      { id: 'who', type: 'html', label: '指定人員', width: 200,
        show: function (r) { return r.enabled },
        render: function (r) {
          var a = aud(r)
          if (a.mode === 'business') return '<span class="mx-mute">照原本設定</span>'
          var us = users(r)
          var flag = function (u) { return u.active === false ? '已離職' : (u.muted ? '已自行關閉' : (u.linked ? '' : '尚未綁定')) }
          var txt = us.slice(0, 3).map(function (u) { var f = flag(u); return esc(u.display) + (f ? '<span class="le-flag">' + f + '</span>' : '') }).join('、') + (us.length > 3 ? ' 等 ' + us.length + ' 人' : '')
          if (!us.length && !(a.roles || []).length) txt = '<span style="color:var(--danger)">沒指定任何人</span>'
          else if (!us.length) txt = '<span class="mx-mute">（只有角色）</span>'
          return '<span class="le-who" data-testid="le-who-' + esc(r.key) + '">' + txt + '</span> <button type="button" class="mx-btn mx-btn-sm" data-mx="act" data-act="people" data-key="' + esc(r.key) + '" data-testid="le-people-' + esc(r.key) + '">編輯</button>'
        } },
      { id: 'sent30', type: 'html', label: '近 30 天', width: 70,
        render: function (r) { return '<span data-testid="le-sent30-' + esc(r.key) + '">' + esc(r.sent30 || 0) + '</span>' } },
    ]

    // ── 批次 ──
    function snapshot(keys) {
      var out = {}
      keys.forEach(function (k) {
        var e = evByKey(k); if (!e) return
        out[k] = { enabled: !!e.enabled, roles: e.roles == null ? null : e.roles.slice(), audience: { mode: aud(e).mode, roles: (aud(e).roles || []).slice(), users: users(e).map(function (u) { return u.username }) } }
      })
      return out
    }
    // 復原這一批：把套用前的狀態整批寫回；前提是這些事件從套用到現在沒被別人改過（伺服器比對指紋）。被改過 ⇒ 409、整批不復原，說明是誰、何時
    function restore(snap, res) {
      var r = res && res.res
      if (!r || !r.after) return Promise.reject(new Error('找不到這一批的套用紀錄，無法復原'))
      return call('/api/settings/line-notify/events/batch-undo', 'POST', { states: snap, expect: r.after, since_audit: r.audit_mark || 0 }).catch(function (e) {
        var d = e.data && e.data.detail
        if (e.status === 409 && d && d.code === 'conflict') {
          var who = d.by ? '被 ' + d.by + (d.at ? ' 於 ' + String(d.at).slice(0, 16).replace('T', ' ') : '') + ' ' : ''
          var err = new Error('無法復原這一批：' + d.keys.map(function (x) { return x.name }).join('、') + ' 在你套用之後' + (who ? who : '') + '改過，為了不蓋掉別人的修改，系統拒絕整批復原。')
          err.status = 409
          throw err
        }
        throw e
      })
    }
    function applied(res, label) { return { res: res, message: label + '（' + res.changed.length + ' 項有變動' + (res.unchanged && res.unchanged.length ? '、' + res.unchanged.length + ' 項本來就是這樣' : '') + '）' } }
    var batchCfg = {
      groupActions: [{ action: 'on', label: '全開' }, { action: 'off', label: '全關' }],
      actions: [
        { id: 'on', label: '開啟', doneLabel: '已開啟',
          confirm: function (keys) {
            var fresh = keys.filter(function (k) { var e = evByKey(k); return e && !e.enabled && aud(e).mode === 'business' })
            if (!fresh.length) return []
            return [{ title: '開啟 ' + keys.length + ' 項 LINE 通知', okLabel: '開啟',
              html: '其中 <b>' + fresh.length + '</b> 項是第一次從關閉變成開啟：<b>預設只發給你本人</b>（之後可再改成其他人），避免一開就推給所有人。' + listHtml(names(fresh).slice(0, 8)) + (fresh.length > 8 ? '<div class="mx-mute">…等 ' + fresh.length + ' 項</div>' : '') }]
          },
          run: function (keys) { return batch(keys, { enabled: true }).then(function (r) { return applied(r, '已開啟') }) } },
        { id: 'off', label: '關閉', doneLabel: '已關閉',
          confirm: function (keys) {
            var crit = critDialog(keys)
            return crit.length ? [{ title: '關閉 ' + keys.length + ' 項 LINE 通知？', okLabel: '繼續', html: '將關閉 <b>' + keys.length + '</b> 項，其中包含「重要」系統告警，下一步會列出受影響的情況。' }].concat(crit) : []
          },
          run: function (keys, ctx) { return batch(keys, { enabled: false, confirm_critical: !!ctx.confirmed && critDialog(keys).length > 0 }).then(function (r) { return applied(r, '已關閉') }) } },
        { id: 'me', label: '只發給我', dividerBefore: true, caption: '收件對象：', doneLabel: '已改為只發給你',
          run: function (keys) { return batch(keys, { audience: { mode: 'only', roles: [], users: [ME] } }).then(function (r) { return applied(r, '已改為只發給你') }) } },
        { id: 'su', label: '最高管理者', doneLabel: '已改為只發給最高管理者',
          run: function (keys) { return batch(keys, { audience: { mode: 'only', roles: ['superadmin'], users: [] } }).then(function (r) { return applied(r, '已改為只發給最高管理者') }) } },
        { id: 'biz', label: '照 Email 收件人', doneLabel: '已改為照原本收件人',
          run: function (keys) { return batch(keys, { audience: { mode: 'business', roles: [], users: [] } }).then(function (r) { return applied(r, '已改為照原本收件人') }) } },
        { id: 'custom', label: '自訂…', doneLabel: '已更新收件對象',
          run: function (keys) {
            return pickDialog(keys.map(evByKey).filter(Boolean), { mode: 'only', roles: [], users: [] }).then(function (p) {
              if (!p) throw cancelled()
              return batch(keys, { audience: p }).then(function (r) { return applied(r, '已更新收件對象') })
            })
          } },
      ],
      snapshot: snapshot,
      restore: restore,
    }
    var filters = [
      { id: 'on', label: '已開啟', test: function (r) { return r.enabled } },
      { id: 'off', label: '已關閉', test: function (r) { return !r.enabled } },
      { id: 'crit', label: '重要告警', test: function (r) { return r.priority === 'critical' } },
      { id: 'only', label: '僅 LINE', test: function (r) { return r.kind === 'line_only' } },
      { id: 'spec', label: '有指定對象', test: function (r) { return r.enabled && aud(r).mode !== 'business' } },
      { id: 'nobody', label: '沒人會收到', title: '已開啟、但「只發給指定」卻沒指定任何人', test: nobody },
    ]

    async function boot() {
      var rows
      try { rows = await load() } catch (e) {
        if (e.status === 403) { document.getElementById('le-box').innerHTML = '<div class="le-warn">只有最高管理者可以管理 LINE 通知事件。</div>'; return }
        document.getElementById('le-box').innerHTML = '<div class="le-warn">讀取失敗：' + esc(e.message) + '</div>'; return
      }
      await loadBind()
      columns[2].items = roleItems()
      mx = SettingsMatrix.mount(document.getElementById('le-box'), {
        rows: rows, groups: cfg.event_groups || [],
        rowKey: function (r) { return r.key }, rowName: function (r) { return r.name }, rowGroup: function (r) { return r.group }, rowSub: function (r) { return r.key },
        nameLabel: '通知事件', searchPlaceholder: '搜尋事件名稱或代碼',
        rowTags: function (r) {
          var t = []
          if (r.priority === 'critical') t.push({ text: '重要', tone: 'crit' })
          if (r.kind === 'line_only') t.push({ text: '僅 LINE', tone: 'mute' })
          if (r.kind === 'sub') t.push({ text: 'LINE 細項', tone: 'mute' })
          if (nobody(r)) t.push({ text: '沒人會收到', tone: 'bad' })
          return t
        },
        searchText: function (r) { return r.name + ' ' + r.key + ' ' + r.group },
        groupSummary: function (g, all) { return '已開 ' + all.filter(function (e) { return e.enabled }).length + '／共 ' + all.length + '・近 30 天 ' + all.reduce(function (s, e) { return s + (e.sent30 || 0) }, 0) + ' 則' },
        columns: columns, filters: filters, batch: batchCfg,
        reload: load,
        onAction: function (act, r) {
          if (act !== 'people') return
          var a = aud(r)
          pickDialog([r], { mode: a.mode, roles: a.roles || [], users: users(r).map(function (u) { return u.username }) }).then(function (p) {
            if (p) mx.perform('已更新「' + r.name + '」的收件對象', [r.key], function () { return batch([r.key], { audience: p }) })
          })
        },
      })
      loadQuota()
    }
    boot()
  })()
  </script>
</body>
</html>
