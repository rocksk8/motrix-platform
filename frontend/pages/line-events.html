<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{if(localStorage.getItem('motrix_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/api/system/branding/favicon">
  <title>LINE 通知事件 — MOTRIX PLATFORM</title>
  <script src="../static/auth-guard.js"></script>
  <link rel="stylesheet" href="../css/style.css?v=20260805g">
  <link rel="stylesheet" href="../css/settings-matrix.css?v=20261113a">
  <link rel="stylesheet" href="../css/line-events-matrix.css?v=20261114a">
  <style>
    .le-main { margin-left: var(--sidebar-w); margin-top: var(--topbar-h); padding: 24px 28px 120px; min-height: calc(calc(100vh / var(--fz,1)) - var(--topbar-h)); background: var(--white); }
    .le-title { font-size: 20px; font-weight: 700; }
    .le-sub { font-size: 13px; color: var(--text-secondary); margin-top: 4px; max-width: 880px; line-height: 1.6; }
    @media (max-width: 900px) { .le-main { padding: 16px 12px 130px; } }
  </style>
</head>
<body>
  <header id="app-topbar" class="topbar"></header>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="app-sidebar"></aside>
  <main class="le-main">
    <div class="le-title">LINE 通知事件</div>
    <div class="le-sub">一張表管理所有 LINE 通知：每個事件是否發送、發給誰。點格子立即生效；您的點選與批次動作都只是<b>草稿</b>，按頂端「儲存」才會生效；儲存後可按「復原這一批」（只要這些事件沒被其他使用者改過）。
      連線設定、綁定、總開關在 <a href="notification-settings.html" data-testid="le-back-link">通知設定</a>。</div>
    <div class="le-bar" id="le-bar" aria-live="polite"></div>
    <div class="le-legend" aria-label="圖例">
      <span><button type="button" class="mx-rc on f" tabindex="-1" aria-hidden="true">✓</button>灰藍＝在「原本的收件人」裡篩選這些角色</span>
      <span><button type="button" class="mx-rc on a" tabindex="-1" aria-hidden="true">✓</button>綠＝指定發給這些角色</span>
    </div>
    <div id="le-note"></div>
    <div id="le-box" data-testid="le-matrix"></div>
  </main>
  <script src="../static/settings-matrix.js"></script>
  <script src="../static/notif.js"></script>
  <script src="../static/sidebar.js"></script>
  <script src="../static/line-events-matrix.js"></script>
  <script>LineEventsMatrix.mount({ box: document.getElementById('le-box'), bar: document.getElementById('le-bar'), note: document.getElementById('le-note') })</script>
</body>
</html>
