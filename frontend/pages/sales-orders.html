<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../static/favicon.png">
  <title>銷售訂單 — MOTRIX 營運管理系統</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    [x-cloak]{display:none!important}
    .page-main{margin-left:var(--sidebar-w);margin-top:var(--topbar-h);padding:28px 32px;min-height:calc(100vh - var(--topbar-h));background:var(--white)}
    .stat-strip{display:flex;gap:12px;margin-bottom:22px;flex-wrap:wrap}
    .stat-pill{display:flex;flex-direction:column;padding:14px 18px;border:1px solid var(--border-light);border-radius:var(--radius-lg);background:#fff;min-width:130px;flex:1;max-width:200px}
    .stat-pill__val{font-size:22px;font-weight:700;font-family:LINE Seed TW_OTF, sans-serif;line-height:1;color:var(--text-primary)}
    .stat-pill__lbl{font-size:10px;color:var(--text-dim);font-family:LINE Seed TW_OTF, sans-serif;letter-spacing:.06em;margin-top:4px;text-transform:uppercase}
    .stat-pill.accent .stat-pill__val{color:var(--accent)}
    .stat-pill.success .stat-pill__val{color:var(--success)}
    .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
    .search-wrap{position:relative;flex:0 0 280px}
    .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-dim);pointer-events:none}
    .search-input{width:100%;padding:8px 11px 8px 34px;border:1px solid var(--border-light);border-radius:var(--radius);font-size:13px;font-family:var(--font-zh);background:#fff;outline:none;box-sizing:border-box}
    .search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
    .panel{background:#fff;border:1px solid var(--border-light);border-radius:var(--radius-lg);overflow:hidden}
    .data-table{width:100%;border-collapse:collapse;font-size:13px}
    .data-table th{padding:10px 14px;text-align:left;font-size:10px;font-family:LINE Seed TW_OTF, sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);font-weight:500;background:#FAFAF8;border-bottom:1px solid var(--border-light);white-space:nowrap}
    .data-table td{padding:11px 14px;border-bottom:1px solid #F0EEE9;vertical-align:middle}
    .data-table tr:last-child td{border-bottom:none}
    .data-table tr:hover td{background:#FDFCFA;cursor:pointer}
    .rb{display:inline-flex;align-items:center;padding:2px 9px;border-radius:4px;font-size:11px;font-weight:600}
    .rb-case{background:#EEF2FF;color:#4338CA}
    .rb-closed{background:#F3F4F6;color:#374151}
    .progress-bar{height:5px;background:#F0EEE9;border-radius:3px;overflow:hidden;min-width:80px}
    .progress-bar__fill{height:100%;border-radius:3px;background:var(--accent);transition:width .3s}
    .empty-state{text-align:center;padding:48px;color:var(--text-dim);font-family:var(--font-zh);font-size:13px}
    .loading-text{text-align:center;padding:40px;color:var(--text-dim);font-size:13px}
  </style>
</head>
<body x-data="app()" x-init="init()" x-cloak>

  <header id="app-topbar" class="topbar"></header>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="app-shell">

  <aside class="sidebar" id="app-sidebar"></aside>

  <main class="page-main">

    <div class="stat-strip">
      <div class="stat-pill accent">
        <div class="stat-pill__val" x-text="items.length">—</div>
        <div class="stat-pill__lbl">進行中訂單</div>
      </div>
      <div class="stat-pill">
        <div class="stat-pill__val" x-text="fmtM(totalAmount)">—</div>
        <div class="stat-pill__lbl">合約總金額</div>
      </div>
      <div class="stat-pill success">
        <div class="stat-pill__val" x-text="fmtM(receivedAmount)">—</div>
        <div class="stat-pill__lbl">已收款</div>
      </div>
      <div class="stat-pill">
        <div class="stat-pill__val" x-text="closedCount">—</div>
        <div class="stat-pill__lbl">已結案</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></span>
        <input class="search-input" type="search" placeholder="搜尋訂單號 / 客戶 / 專案…" x-model="search">
      </div>
      <select style="padding:7px 10px;border:1px solid var(--border-light);border-radius:var(--radius);font-size:12px;font-family:var(--font-zh);outline:none" x-model="filterTag">
        <option value="">全部狀態</option>
        <option value="已成案">進行中（已成案）</option>
        <option value="已結案">已結案</option>
      </select>
      <div style="margin-left:auto;font-size:12px;color:var(--text-dim)" x-text="'共 ' + filtered.length + ' 筆'"></div>
    </div>

    <div class="panel">
      <div class="loading-text" x-show="loading">載入中…</div>
      <template x-if="!loading">
        <div>
          <div class="table-scroll">
          <table class="data-table" x-show="filtered.length > 0">
            <thead>
              <tr>
                <th>訂單號</th>
                <th>客戶</th>
                <th>專案名稱</th>
                <th>狀態</th>
                <th style="text-align:right">合約金額</th>
                <th style="text-align:right">毛利率</th>
                <th>執行進度</th>
                <th>日期</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="o in filtered" :key="o.quoteNo">
                <tr @click="location.href='case-management.html?q='+o.quoteNo">
                  <td><span style="font-family:LINE Seed TW_OTF, sans-serif;font-size:12px;font-weight:600;color:var(--accent)" x-text="o.quoteNo"></span></td>
                  <td style="font-size:12px" x-text="o.customer || '—'"></td>
                  <td style="font-size:12px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="o.projectName || '—'"></td>
                  <td><span class="rb" :class="o.dealTag==='已結案'?'rb-closed':'rb-case'" x-text="o.dealTag"></span></td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;font-size:13px;font-weight:600" x-text="'NT$ ' + Math.round(o.total||0).toLocaleString()"></td>
                  <td style="text-align:right">
                    <span x-show="o.netMarginPct != null"
                          :style="'font-family:LINE Seed TW_OTF, sans-serif;font-size:12px;font-weight:600;color:' + (o.netMarginPct >= 40 ? 'var(--success)' : o.netMarginPct >= 30 ? 'var(--warning)' : 'var(--danger)')"
                          x-text="(o.netMarginPct||0).toFixed(1) + '%'"></span>
                    <span x-show="o.netMarginPct == null" style="color:var(--text-dim);font-size:11px">—</span>
                  </td>
                  <td style="min-width:120px">
                    <div style="display:flex;align-items:center;gap:6px">
                      <div class="progress-bar" style="flex:1">
                        <div class="progress-bar__fill" :style="'width:' + (o.progressPct||0) + '%'"></div>
                      </div>
                      <span style="font-family:LINE Seed TW_OTF, sans-serif;font-size:11px;color:var(--text-dim);flex-shrink:0" x-text="(o.progressPct||0) + '%'"></span>
                    </div>
                  </td>
                  <td style="font-family:LINE Seed TW_OTF, sans-serif;font-size:11px;color:var(--text-dim)" x-text="o.quoteDate"></td>
                  <td @click.stop>
                    <a :href="'case-management.html?q=' + o.quoteNo"
                       style="display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--radius);font-size:11px;font-family:var(--font-zh);font-weight:500;background:#EEF2FF;color:#4338CA;border:1px solid #C7D2FE;text-decoration:none">
                      案件管理 →
                    </a>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
          </div>
          <div class="empty-state" x-show="filtered.length === 0">
            <div style="font-size:32px;margin-bottom:10px">📋</div>
            <div>尚無銷售訂單</div>
            <div style="font-size:11px;margin-top:6px;color:var(--text-dim)">已成案的報價單將自動出現在此列表</div>
          </div>
        </div>
      </template>
    </div>

  </main>
</div>

<script>
const API = '/api'
function app() {
  return {
    session: {},
    loading: true,
    items: [],
    search: '',
    filterTag: '',

    get filtered() {
      let list = this.items
      if (this.filterTag) list = list.filter(o => o.dealTag === this.filterTag)
      const q = this.search.trim().toLowerCase()
      if (q) list = list.filter(o =>
        (o.quoteNo||'').toLowerCase().includes(q) ||
        (o.customer||'').toLowerCase().includes(q) ||
        (o.projectName||'').toLowerCase().includes(q)
      )
      return list
    },
    get totalAmount()    { return this.items.reduce((s,o) => s + (o.total||0), 0) },
    get receivedAmount() { return this.items.reduce((s,o) => s + (o.receivedAmount||0), 0) },
    get closedCount()    { return this.items.filter(o => o.dealTag === '已結案').length },

    fmtM(n) {
      if (!n) return '—'
      if (n >= 1000000) return 'NT$ ' + (n/1000000).toFixed(2) + 'M'
      if (n >= 1000)    return 'NT$ ' + Math.round(n/1000) + 'K'
      return 'NT$ ' + Math.round(n).toLocaleString()
    },

    async init() {
      const s = JSON.parse(localStorage.getItem('motrix_session') || '{}')
      if (!s.token) { location.href = 'login.html'; return }
      this.session = s
      try {
        const r = await fetch(`${API}/auth/me`, { headers: { Authorization: 'Bearer ' + s.token } })
        if (!r.ok) { location.href = 'login.html'; return }
        const me = await r.json()
        this.session.displayName = me.display_name
      } catch {}
      await this.load()
    },

    async load() {
      this.loading = true
      try {
        const r = await fetch(`${API}/sales-orders`, { headers: { Authorization: 'Bearer ' + this.session.token } })
        if (r.ok) { const d = await r.json(); this.items = d.items || [] }
      } catch {}
      this.loading = false
    },

    logout() {
      fetch(`${API}/auth/logout`, { method:'POST', headers:{ Authorization:'Bearer '+(this.session.token||'') } }).catch(()=>{})
      localStorage.removeItem('motrix_session'); location.href = 'login.html'
    }
  }
}
</script>
  <script src="../static/notif.js"></script>
  <script src="../static/sidebar.js"></script>
</body>
</html>
