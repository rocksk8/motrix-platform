<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{if(localStorage.getItem('motrix_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/api/system/branding/favicon">
  <title>設定中心 — MOTRIX PLATFORM</title>
  <script src="../static/auth-guard.js"></script>
  <link rel="stylesheet" href="../css/style.css?v=20260805g">
  <link rel="stylesheet" href="../css/settings-matrix.css?v=20261113a">
  <style>
    /* 設定中心外框（S2；SPEC §14）：上方列（搜尋／待生效／最近變更）＋左側兩層導覽＋右側內容。設定表本身是 SettingsMatrix（同一張表放所有已載入頁的列，只顯示目前這一頁）。 */
    .sc-main { margin-left: var(--sidebar-w); margin-top: var(--topbar-h); padding: 18px 28px 120px; min-height: calc(calc(100vh / var(--fz,1)) - var(--topbar-h)); background: var(--white); }
    .sc-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
    .sc-title { font-size: 20px; font-weight: 700; margin-right: 6px; }
    .sc-searchbox { position: relative; flex: 1 1 280px; max-width: 520px; }
    .sc-searchbox input { width: 100%; box-sizing: border-box; padding: 8px 12px; border: 1px solid var(--border-light); border-radius: 8px; font-size: 14px; background: var(--white); color: inherit; }
    .sc-results { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 30; background: var(--white); border: 1px solid var(--border-light); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.14); max-height: 420px; overflow: auto; }
    .sc-res { display: block; width: 100%; text-align: left; padding: 8px 12px; border: 0; border-bottom: 1px solid var(--border-light); background: transparent; color: inherit; cursor: pointer; font-size: 14px; }
    .sc-res:hover, .sc-res:focus { background: var(--info-light, rgba(0,0,0,.05)); outline: none; }
    .sc-res small { display: block; color: var(--text-secondary); font-size: 12px; margin-top: 2px; }
    .sc-res-empty { padding: 10px 12px; color: var(--text-secondary); font-size: 13px; }
    .sc-toplinks { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
    .sc-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--border-light); border-radius: 999px; background: var(--white); color: inherit; font-size: 13px; cursor: pointer; }
    .sc-chip.on { border-color: var(--info); color: var(--info); font-weight: 700; }
    .sc-chip b { font-weight: 700; }
    .sc-seg { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; }
    .sc-body { display: flex; gap: 22px; margin-top: 14px; align-items: flex-start; }
    .sc-nav { width: 248px; flex: 0 0 248px; position: sticky; top: calc(var(--topbar-h) + 10px); max-height: calc(calc(100vh / var(--fz,1)) - var(--topbar-h) - 24px); overflow: auto; }
    .sc-cat { font-size: 12px; color: var(--text-secondary); margin: 14px 0 4px; letter-spacing: .06em; }
    .sc-cat:first-child { margin-top: 0; }
    .sc-navitem { display: flex; align-items: center; justify-content: space-between; gap: 6px; width: 100%; box-sizing: border-box; text-align: left; padding: 8px 10px; border: 0; border-radius: 8px; background: transparent; color: inherit; font-size: 14px; cursor: pointer; text-decoration: none; }
    .sc-navitem:hover { background: var(--info-light, rgba(0,0,0,.05)); }
    .sc-navitem.active { background: var(--info-light, rgba(0,0,0,.07)); font-weight: 700; }
    .sc-navitem.planned { color: var(--text-secondary); }
    .sc-nbadge { font-size: 11px; font-weight: 400; color: var(--warning); white-space: nowrap; }
    .sc-nbadge.draft { color: var(--danger); font-weight: 700; }
    .sc-navtoggle { display: none; }
    .sc-pane { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
    .sc-navitem span { min-width: 0; overflow-wrap: anywhere; }
    .sc-h { font-size: 18px; font-weight: 700; margin: 0 0 6px; }
    .sc-sub { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin: 2px 0; }
    .sc-tag { display: inline-block; padding: 1px 8px; margin-left: 8px; border-radius: 999px; font-size: 12px; font-weight: 400; border: 1px solid var(--border-light); color: var(--text-secondary); vertical-align: middle; }
    .sc-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 10px 0 18px; }
    .sc-card { border: 1px solid var(--border-light); border-radius: 12px; padding: 14px 16px; background: var(--white); text-align: left; color: inherit; cursor: pointer; font-size: 13px; }
    .sc-card:hover { border-color: var(--info); }
    .sc-card .n { font-size: 28px; font-weight: 700; display: block; line-height: 1.2; }
    .sc-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .sc-table th, .sc-table td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border-light); vertical-align: top; }
    .sc-table th { color: var(--text-secondary); font-weight: 400; font-size: 12px; }
    .sc-btnrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
    .sc-in { padding: 7px 9px; border: 1px solid var(--border-light); border-radius: 6px; background: var(--white); color: inherit; font-size: 14px; }
    .sc-link { background: none; border: 0; padding: 0; color: var(--info); cursor: pointer; font-size: inherit; text-align: left; }
    .sc-empty { color: var(--text-secondary); font-size: 13px; padding: 10px 0; }
    .sc-err { color: var(--danger); font-size: 13px; margin: 8px 0; }
    .sc-box { border: 1px solid var(--border-light); border-radius: 10px; padding: 12px 14px; margin: 12px 0; }
    .sc-banner { margin: 4px 0; padding: 6px 10px; border-radius: 6px; font-size: 13px; line-height: 1.55; }
    .sc-banner.red { background: var(--danger-light); color: var(--danger); border: 1px solid var(--danger-border); }
    .sc-banner.amber { background: var(--warning-light, #fff7e0); color: var(--warning); border: 1px solid var(--warning-border, #f1d58a); }
    .sc-notify { margin-top: 10px; padding: 8px 10px; border-radius: 6px; background: var(--info-light, rgba(0,0,0,.05)); font-size: 13px; line-height: 1.6; }
    .sc-flash { animation: scflash 1.8s ease-out 1; }
    @keyframes scflash { 0%, 30% { background: rgba(255, 200, 0, .45); } 100% { background: transparent; } }
    .sc-mx .mx-dash { visibility: hidden; }
    textarea.sc-in { width: 100%; box-sizing: border-box; }
    @media (max-width: 900px) {
      .sc-main { padding: 12px 12px 140px; }
      .sc-cards { grid-template-columns: 1fr; }
      .sc-body { flex-direction: column; gap: 10px; align-items: stretch; }
      .sc-pane { width: 100%; }
      .sc-nav { position: static; width: 100%; flex: none; max-height: none; display: none; }
      .sc-nav.open { display: block; max-height: calc(60vh / var(--fz, 1)); overflow: auto; border: 1px solid var(--border-light); border-radius: 8px; padding: 8px; }
      .sc-navtoggle { display: flex; width: 100%; align-items: center; justify-content: space-between; min-height: 44px; padding: 8px 12px; border: 1px solid var(--border-light); border-radius: 8px; background: var(--white); font-size: 15px; font-weight: 700; color: inherit; cursor: pointer; }
      .sc-searchbox { flex-basis: 100%; max-width: none; }
      .sc-searchbox input { font-size: 16px; min-height: 44px; }
      .sc-toplinks { margin-left: 0; }
      .sc-table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <header id="app-topbar" class="topbar"></header>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="app-sidebar"></aside>
  <main class="sc-main">
    <div class="sc-top">
      <div class="sc-title">設定中心</div>
      <div class="sc-searchbox">
        <input type="search" id="sc-search" placeholder="搜尋任何設定（例如：逾期、提醒、上限）" autocomplete="off" data-testid="sc-search" aria-label="搜尋設定">
        <div class="sc-results" id="sc-results" data-testid="sc-results" hidden></div>
      </div>
      <div class="sc-toplinks">
        <button type="button" class="sc-chip" id="sc-go-pending" data-testid="sc-go-pending">待生效 <b id="sc-pending-n">0</b></button>
        <button type="button" class="sc-chip" id="sc-go-recent" data-testid="sc-go-recent">最近變更</button>
        <button type="button" class="sc-chip" id="sc-go-versions" data-testid="sc-go-versions">版本紀錄</button>
        <button type="button" class="sc-chip" id="sc-go-profiles" data-testid="sc-go-profiles" hidden>預設組</button>
      </div>
    </div>
    <div class="sc-seg" id="sc-seg" data-testid="sc-seg"></div>
    <div class="sc-body">
      <button type="button" class="sc-navtoggle" id="sc-navtoggle" data-testid="sc-navtoggle" aria-expanded="false"><span id="sc-navtoggle-text">選擇設定頁</span><span>▾</span></button>
      <nav class="sc-nav" id="sc-nav" data-testid="sc-nav" aria-label="設定頁"></nav>
      <section class="sc-pane">
        <div id="sc-msg" class="sc-err" role="alert" hidden data-testid="sc-msg"></div>
        <div id="sc-v-overview" data-testid="sc-overview" hidden></div>
        <div id="sc-v-page" hidden>
          <div id="sc-pagehead" data-testid="sc-pagehead"></div>
          <div id="sc-mx" class="sc-mx" data-testid="sc-matrix"></div>
        </div>
        <div id="sc-v-pending" data-testid="sc-pending" hidden></div>
        <div id="sc-v-recent" data-testid="sc-recent" hidden></div>
        <div id="sc-v-versions" data-testid="sc-versions" hidden></div>
        <div id="sc-v-profiles" data-testid="sc-profiles" hidden></div>
      </section>
    </div>
  </main>
  <script src="../static/settings-matrix.js"></script>
  <script src="../static/notif.js"></script>
  <script src="../static/sidebar.js"></script>
  <script>
  /* 設定中心外框（S2，2026-11-14；SPEC §14）。所有句子（效果句、橫幅、差異）由伺服器產生，這裡只負責呈現與呼叫；端點見 backend/routers/settings_center.py。
   * 規則：白話、不顯示鍵名與代碼；點格子只算草稿，儲存才確認（原因必填）才生效；所有動態文字一律 esc()。 */
  (function () {
    'use strict'
    var esc = SettingsMatrix.esc
    var P = '/api/settings-center'
    var session = {}
    try { session = JSON.parse(localStorage.getItem('motrix_session') || '{}') } catch (e) { session = {} }
    var ST = { ov: null, idx: [], view: '', page: '', seg: '全部', details: {}, rows: [], reason: '', pending: [], profiles: [], recentHigh: false, vgroup: '', versions: [], diff: null, restoreFor: null, restorePv: null, profilePv: null, profileName: '', profileSkipped: [] }
    var mx = null
    var $ = function (id) { return document.getElementById(id) }
    var enc = encodeURIComponent

    // ── 呼叫 ─────────────────────────────────────────────────────
    function hdr(json) {
      var h = { Authorization: 'Bearer ' + (session.token || '') }
      if (json) h['Content-Type'] = 'application/json'
      return h
    }
    function detailText(d, fallback) {
      var x = d && d.detail
      if (typeof x === 'string') return x
      if (x && x.message) {
        var ps = (x.problems || []).map(function (p) { return p.message }).join('；')
        return x.message + (ps ? '：' + ps : '')
      }
      return fallback
    }
    function call(path, init) {
      return fetch(path, init || { headers: hdr(false) }).then(function (r) {
        return r.json().catch(function () { return {} }).then(function (d) {
          if (!r.ok) { var e = new Error(detailText(d, '操作失敗（' + r.status + '）')); e.status = r.status; e.data = d; throw e }
          return d
        })
      })
    }
    function post(path, body) { return call(path, { method: 'POST', headers: hdr(true), body: JSON.stringify(body || {}) }) }
    function say(m, err) { var el = $('sc-msg'); el.hidden = !m; el.textContent = m || ''; el.className = err === false ? 'sc-sub' : 'sc-err' }
    function stamp(s) { return String(s || '').replace('T', ' ').slice(0, 16) }
    function jeq(a, b) { return JSON.stringify(a) === JSON.stringify(b) }

    // ── 頁面資料 ─────────────────────────────────────────────────
    function pageById(id) { return (ST.ov ? ST.ov.pages : []).filter(function (p) { return p.id === id })[0] || null }
    function pageOfGroup(g) { return (ST.ov ? ST.ov.pages : []).filter(function (p) { return p.groups.indexOf(g) >= 0 })[0] || null }
    function groupPlain(g) { var it = ST.idx.filter(function (i) { return i.kind === 'group' && i.group === g })[0]; return it ? it.groupPlain : g }
    function rowOf(d, f, page) {
      return { key: d.group + '.' + f.key, group: d.group, groupPlain: groupPlain(d.group), field: f.key, page: page ? page.id : '', name: f.label || f.question || '設定', f: f, value: f.value, selectable: false }
    }
    function rowsAll() {
      var out = []
      Object.keys(ST.details).forEach(function (g) {
        var d = ST.details[g]
        ;(d.fields || []).forEach(function (f) { out.push(rowOf(d, f, pageOfGroup(g))) })
      })
      return out
    }
    function loadGroups(groups) {
      var need = groups.filter(function (g) { return !ST.details[g] })
      return Promise.all(need.map(function (g) { return call(P + '/groups/' + enc(g)).then(function (d) { ST.details[g] = d }) })).then(function () { ST.rows = rowsAll() })
    }
    function refreshOverview() {
      return call(P + '/overview').then(function (o) { ST.ov = o; $('sc-pending-n').textContent = o.stats.pending; renderNav() })
    }
    // 寫入後重讀：已載入的群組、總覽（導覽的徽章與待生效數）；回傳整張表的列
    function reloadAll() {
      var gs = Object.keys(ST.details)
      return Promise.all(gs.map(function (g) { return call(P + '/groups/' + enc(g)).then(function (d) { ST.details[g] = d }) })).then(function () {
        ST.rows = rowsAll()
        return refreshOverview()
      }).then(function () { return ST.rows })
    }

    // ── 導覽 ─────────────────────────────────────────────────────
    function dirtyByPage() {
      var out = {}
      if (!mx) return out
      var d = mx.state().draft
      Object.keys(d).forEach(function (k) {
        var r = ST.rows.filter(function (x) { return x.key === k })[0]
        if (r) out[r.page] = (out[r.page] || 0) + 1
      })
      return out
    }
    function renderNav() {
      if (!ST.ov) return
      var cats = ST.ov.categories
      $('sc-seg').innerHTML = ['全部'].concat(cats).map(function (c) {
        return '<button type="button" class="sc-chip' + (ST.seg === c ? ' on' : '') + '" data-seg="' + esc(c) + '" data-testid="sc-seg-' + esc(c) + '">' + esc(c) + '</button>'
      }).join('')
      var dirty = dirtyByPage()
      var html = ''
      cats.forEach(function (c) {
        if (ST.seg !== '全部' && ST.seg !== c) return
        var ps = ST.ov.pages.filter(function (p) { return p.category === c })
        if (!ps.length) return
        html += '<div class="sc-cat">' + esc(c) + '</div>'
        ps.forEach(function (p) {
          var badges = ''
          if (dirty[p.id]) badges += '<span class="sc-nbadge draft" data-testid="sc-navdraft-' + esc(p.id) + '">未儲存 ' + dirty[p.id] + '</span>'
          if (p.differs) badges += '<span class="sc-nbadge" data-testid="sc-navdiff-' + esc(p.id) + '">與預設不同 ' + p.differs + '</span>'
          if (p.highRisk) badges += '<span title="內含影響金額、法規或資安的設定" data-testid="sc-navrisk-' + esc(p.id) + '">🔴</span>'
          if (p.status === 'planned') badges += '<span class="sc-nbadge">開發中</span>'
          if (p.standalone) html += '<a class="sc-navitem" href="' + esc(p.href) + '" data-testid="sc-page-' + esc(p.id) + '"><span>' + esc(p.plain) + '</span><span class="sc-nbadge">↗</span></a>'
          else html += '<button type="button" class="sc-navitem' + (ST.view === 'page' && ST.page === p.id ? ' active' : '') + (p.status === 'planned' ? ' planned' : '') + '" data-page="' + esc(p.id) + '" data-testid="sc-page-' + esc(p.id) + '"><span>' + esc(p.plain) + '</span><span>' + badges + '</span></button>'
        })
      })
      $('sc-nav').innerHTML = html || '<div class="sc-empty">查無符合條件的設定頁。</div>'
      var cur = ST.view === 'page' ? pageById(ST.page) : null
      $('sc-navtoggle-text').textContent = cur ? cur.plain : '選擇設定頁'
    }

    var VIEWS = ['overview', 'page', 'pending', 'recent', 'versions', 'profiles']
    function showView(v) {
      ST.view = v
      VIEWS.forEach(function (n) { $('sc-v-' + n).hidden = n !== v })
      var chips = { pending: 'sc-go-pending', recent: 'sc-go-recent', versions: 'sc-go-versions', profiles: 'sc-go-profiles' }
      Object.keys(chips).forEach(function (k) { $(chips[k]).classList.toggle('on', v === k) })
      $('sc-nav').classList.remove('open')
      $('sc-navtoggle').setAttribute('aria-expanded', 'false')
      say('')
      renderNav()
    }

    // ── 設定頁（一張 SettingsMatrix）─────────────────────────────
    function openPage(id, flashKey) {
      var p = pageById(id)
      if (!p) return Promise.resolve()
      if (p.standalone) { location.href = p.href; return Promise.resolve() }
      ST.page = id
      showView('page')
      try { history.replaceState(null, '', '#p=' + enc(id)) } catch (e) { /* ignore */ }
      return loadGroups(p.groups).then(function () {
        renderPageHead(p)
        mx.setRows(ST.rows)
        mx.render()
        renderNav()
        if (flashKey) flash(flashKey)
      }).catch(function (e) { say('讀取失敗：' + e.message) })
    }
    function renderPageHead(p) {
      var h = '<h2 class="sc-h">' + esc(p.plain) + (p.privacy ? '<span class="sc-tag" data-testid="sc-privacy">影響隱私</span>' : '') + (p.highRisk ? '<span class="sc-tag" style="color:var(--danger)">內含高風險設定</span>' : '') + '</h2>'
      p.groups.forEach(function (g) {
        var d = ST.details[g]
        if (!d) return
        if (d.status === 'planned') h += '<div class="sc-sub" data-testid="sc-planned">「' + esc(groupPlain(g)) + '」開發中，尚未開放。</div>'
        else if (d.help) h += '<div class="sc-sub">' + esc(groupPlain(g)) + '：' + esc(d.help) + '</div>'
      })
      var first = p.groups.filter(function (g) { return ST.details[g] && ST.details[g].status !== 'planned' })[0]
      if (first) h += '<div class="sc-btnrow"><button type="button" class="sc-link" data-vgroup="' + esc(first) + '" data-testid="sc-page-versions">這一頁的版本紀錄與還原</button></div>'
      $('sc-pagehead').innerHTML = h
    }
    function flash(key) {
      var box = $('sc-mx')
      var el = box.querySelector('[data-testid="mx-row-' + key + '"]')
      if (!el) { var k = box.querySelector('.mx-card-row [data-key="' + key + '"]'); el = k ? k.closest('.mx-card-row') : null }
      if (!el) return
      try { el.scrollIntoView({ block: 'center' }) } catch (e) { /* ignore */ }
      el.classList.add('sc-flash')
      setTimeout(function () { el.classList.remove('sc-flash') }, 2000)
    }

    function rangeText(f) {
      if (f.type === 'bool' || f.type === 'str' || f.type === 'json' || (f.choices && f.choices.length)) return ''
      var u = f.unit ? ' ' + f.unit : ''
      if (f.min != null && f.max != null) return '可設定 ' + f.min + '～' + f.max + u
      if (f.min != null) return '至少 ' + f.min + u
      if (f.max != null) return '至多 ' + f.max + u
      return ''
    }
    function numeric(f) { return (f.type === 'int' || f.type === 'float') && !(f.choices && f.choices.length) }
    // 「自訂功能的開關」頁：每一組的總開關（enabled，存成 0／1）畫成開關；子項維持原本的下拉（選項文字有影響說明）
    function isMaster(r) { return r.page === 'builder_all' && r.field === 'enabled' && r.f.type === 'int' && r.f.min === 0 && r.f.max === 1 }
    // 真正有相依的子項（與伺服器端的檢查一致）。「關閉總開關不會解除治理的強制預覽」，所以 builder_governance 不在這裡
    var BUILDER_DEPS = {
      builder_custom_fields: { quote_enabled: 'enabled', quote_in_customer_output: 'quote_enabled', quote_on_finance_docs: 'quote_enabled' },
      builder_rules: { k01_seed: 'enabled' },
    }
    // 上層關著（含尚未儲存的草稿）而這一項目前也是關的 ⇒ 先鎖住並說明原因；已經開著的不鎖，才關得掉
    function lockWhy(r) {
      var dep = r.page === 'builder_all' && BUILDER_DEPS[r.group] && BUILDER_DEPS[r.group][r.field]
      if (!dep || !mx || r.value) return ''
      var up = mx.effective(r.group + '.' + dep)
      return up && !up.value ? '請先開啟「' + (up.name || '上一層開關') + '」' : ''
    }
    function coerceChoice(f, v) {
      var hit = (f.choices || []).filter(function (c) { return String(c.value) === String(v) })[0]
      return hit ? hit.value : v
    }
    var RISK_TAG = { money: '牽涉金額', legal: '法規相關', security: '資安相關' }
    var columns = [
      { id: 'sw', type: 'switch', label: '開／關', show: function (r) { return r.f.type === 'bool' || isMaster(r) },
        disabled: function (r) { return r.f.type === 'bool' ? lockWhy(r) : false },
        get: function (r) { return !!r.value }, draft: function (r, v) { return { value: r.f.type === 'bool' ? !!v : (v ? 1 : 0) } } },
      { id: 'sel', type: 'select', label: '選擇', show: function (r) { return r.f.type !== 'bool' && r.f.type !== 'json' && !isMaster(r) && !!(r.f.choices && r.f.choices.length) },
        disabled: function (r) { return lockWhy(r) },
        options: function (r) { return (r.f.choices || []).map(function (c) { return { value: c.value, label: c.label } }) },
        get: function (r) { return r.value }, draft: function (r, v) { return { value: coerceChoice(r.f, v) } } },
      { id: 'num', type: 'number', label: '數值', step: 'any', show: function (r) { return numeric(r.f) },
        get: function (r) { return r.value },
        validate: function (v, r) {
          if (v == null) return '請輸入數字'
          if (r.f.type === 'int' && Math.floor(v) !== v) return '要填整數'
          if (r.f.min != null && v < r.f.min) return '不可小於 ' + r.f.min
          if (r.f.max != null && v > r.f.max) return '不可大於 ' + r.f.max
          return null
        },
        draft: function (r, v) { return { value: v } } },
      { id: 'txt', type: 'text', label: '文字', show: function (r) { return r.f.type === 'str' && !(r.f.choices && r.f.choices.length) },
        get: function (r) { return r.value }, draft: function (r, v) { return { value: String(v == null ? '' : v) } } },
      { id: 'ro', type: 'text-view', label: '內容', show: function (r) { return r.f.type === 'json' || ['bool', 'int', 'float', 'str'].indexOf(r.f.type) < 0 },
        get: function (r) { return '整份文件，不在這張表編輯' } },
    ]

    // ── 草稿：儲存前確認（原因必填）→ 逐群組寫入 ─────────────────
    function groupBy(changes) {
      var by = {}, order = []
      changes.forEach(function (c) {
        var r = c.row
        if (!by[r.group]) { by[r.group] = { group: r.group, plain: r.groupPlain, values: {}, expected: {}, rows: [] }; order.push(r.group) }
        by[r.group].values[r.field] = c.patch.value
        by[r.group].expected[r.field] = r.value
        by[r.group].rows.push(r)
      })
      return order.map(function (g) { return by[g] })
    }
    function bannerHtml(b) {
      if (!b) return ''
      return '<div class="sc-banner ' + esc(b.level) + '">' + (b.lines || []).map(esc).join('<br>') + '</div>'
    }
    // 儲存前的「誰會收到通知」（伺服器 preview 的 recipients 白話）；角色片語以外的對象（簽核人、主管…）不會自動通知，誠實寫出來
    function recipientsText(r) {
      if (!r || !r.superadmins) return ''
      var o = r.others || [], who = []
      if (r.superadmins.length) who.push(r.superadmins.join('、') + '（最高管理者）')
      if (o.length) who.push(o.slice(0, 5).map(function (x) { return x.display }).join('、') + (o.length > 5 ? ' 等 ' + o.length + ' 人' : ''))
      var t = who.length ? '儲存後會通知：' + who.join('，以及 ') : '儲存後不會另外通知其他人（您自己不會收到自己操作的通知）'
      if (o.length && r.redactedForOthers) t += '。一般同仁僅會顯示「設定已變更、由誰操作」，不顯示數值與原因'
      if (r.line && r.line.willSend) t += '；並發 LINE 給最高管理者'
      if ((r.ignoredRoles || []).length) t += '。另有「' + r.ignoredRoles.join('、') + '」不在自動通知對象內，請自行告知'
      return t
    }
    function dayText(iso) {
      var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '')
      return m ? (parseInt(m[2], 10) + ' 月 ' + parseInt(m[3], 10) + ' 日') : ''
    }
    // 儲存結果的白話：立即生效 ⇒「已生效」；要核准 ⇒「待第二位最高管理者核准，預計 X 日生效」；只等期滿 ⇒「預計 X 日生效」
    function saveSummary(results) {
      var imm = 0, pend = []
      Object.keys(results).forEach(function (g) {
        var r = results[g] || {}
        imm += (r.classification || []).filter(function (f) { return f.kind === 'immediate' }).length
        ;(r.pending || []).forEach(function (x) { pend.push(x) })
      })
      var parts = []
      if (imm) parts.push(imm + ' 項已立即生效')
      var first = function (l) { return l.map(function (x) { return x.effectiveAt }).sort()[0] }
      var appr = pend.filter(function (x) { return x.approvalsRequired > 0 }), plain = pend.filter(function (x) { return !x.approvalsRequired })
      if (appr.length) parts.push(appr.length + ' 項已列入「待生效」，要等另一位最高管理者核准，預計 ' + dayText(first(appr)) + '生效')
      if (plain.length) parts.push(plain.length + ' 項已列入「待生效」，到期後自動生效，預計 ' + dayText(first(plain)) + '生效')
      return parts
    }
    function confirmSave(changes) {
      var by = groupBy(changes), spec = {}
      by.forEach(function (b) { spec[b.group] = { values: b.values } })
      // 一次預覽整批（與儲存同一支批次介面）：任何一組不合法 ⇒ 400 整批擋下；回來的 recipients 是「這一批儲存後會通知誰」
      return post(P + '/batch', { groups: spec, preview: true }).then(function (pv) {
        by.forEach(function (b) { b.plan = pv.groups[b.group] })
        ST.recipients = pv.recipients || null
        var n = { immediate: 0, pending: 0, pending_approval: 0, unchanged: 0 }, red = false, html = '', warns = []
        by.forEach(function (b) {
          var items = ''
          b.plan.fields.forEach(function (f) {
            n[f.kind] = (n[f.kind] || 0) + 1
            if (f.kind === 'unchanged') return
            if (f.banner && f.banner.level === 'red') red = true
            items += '<li>' + esc(f.effect) + bannerHtml(f.banner) + '</li>'
          })
          ;(b.plan.warnings || []).forEach(function (w) { warns.push(w) })
          if (items) html += '<div style="margin-top:8px"><b>' + esc(b.plain) + '</b></div><ul style="margin:4px 0 0 18px;padding:0">' + items + '</ul>'
        })
        if (!n.immediate && !n.pending && !n.pending_approval) throw new Error('所做修改與目前設定相同，無需儲存')
        var days = by[0].plan.confirmDays
        var lines = []
        if (n.immediate) lines.push('<b>' + n.immediate + '</b> 項儲存後立即生效')
        if (n.pending) lines.push('<b>' + n.pending + '</b> 項會列入「待生效」，' + days + ' 天後自動生效，期間內任何最高管理者都能撤銷')
        if (n.pending_approval) lines.push('<b>' + n.pending_approval + '</b> 項要等另一位最高管理者核准，再過 ' + days + ' 天才會生效')
        var notify = recipientsText(ST.recipients)
        var body = '<div data-testid="sc-confirm-summary">' + lines.map(function (l) { return '<div>' + l + '</div>' }).join('') + '</div>' + html +
          warns.map(function (w) { return '<div class="sc-banner amber">⚠ ' + esc(w) + '</div>' }).join('') +
          (notify ? '<div class="sc-notify" data-testid="sc-recipients">' + esc(notify) + '</div>' : '') +
          '<div style="margin-top:12px"><textarea class="sc-in" rows="2" id="sc-reason" data-testid="sc-reason" placeholder="為什麼要改？（必填，會記在變更紀錄裡）">' + esc(ST.reason) + '</textarea></div>' +
          (red ? '<label style="display:block;margin-top:8px;color:var(--danger);font-size:13px"><input type="checkbox" id="sc-ack" data-testid="sc-ack"> 我已了解上述影響</label>' : '')
        return SettingsMatrix.openDialog({
          title: '儲存 ' + (n.immediate + n.pending + n.pending_approval) + ' 項設定', html: body,
          buttons: [{ label: '取消', value: false }, { label: '確認儲存', value: true, kind: 'primary', disabled: true }],
          onOpen: function (el, wrap) {
            var ok = wrap.querySelector('[data-mx-dlg="1"]'), ta = el.querySelector('#sc-reason'), ack = el.querySelector('#sc-ack')
            ok.setAttribute('data-testid', 'sc-confirm-ok')
            var sync = function () { ST.reason = ta.value; ok.disabled = !ta.value.trim() || (!!ack && !ack.checked) }
            ta.addEventListener('input', sync); if (ack) ack.addEventListener('change', sync); sync()
            try { ta.focus() } catch (e) { /* ignore */ }
          },
        }).then(function (v) { return v === true ? [] : null })
      })
    }
    // 批次儲存失敗的白話。conflict＝送出前被別人改過（整批預檢，沒有任何一組被寫入）；applied／notApplied＝極少見的寫到一半失敗
    function conflictError(e, by) {
      var d = e.data && e.data.detail
      if (e.status === 409 && d && typeof d === 'object') {
        var gs = (d.groups || []).map(function (x) {
          var who = x.by ? '被 ' + x.by + (x.at ? '（' + stamp(x.at) + '）' : '') + ' ' : ''
          var plain = (by.filter(function (b) { return b.group === x.group })[0] || {}).plain || x.label
          return '「' + plain + '」的 ' + (x.keys || []).map(function (k) { return k.name }).join('、') + ' 在您送出前' + (who ? who : '已被其他使用者') + '改過'
        })
        var applied = (d.applied || []).map(function (g) { return (by.filter(function (b) { return b.group === g })[0] || {}).plain || g })
        var msg = gs.length ? gs.join('；') + '，為了不覆寫其他使用者的修改，' + (applied.length ? '其餘沒有儲存' : '這一批沒有儲存') + '。請按「放棄」重新載入後再改。' : (d.message || e.message)
        if (applied.length) msg = '已儲存「' + applied.join('」「') + '」；' + msg
        var err = new Error(msg)
        err.status = 409; err.applied = d.applied || []
        return err
      }
      return e
    }
    // 整批一次送出（伺服器端：先全部預檢、逐組寫入、整批只發一則通知）；已存的群組把原值換成新值，重試時不會被當成衝突
    function save(changes) {
      var by = groupBy(changes), spec = {}
      by.forEach(function (b) { spec[b.group] = { values: b.values, expectedValues: b.expected } })
      function send(supersede) {
        var groups = {}
        Object.keys(spec).forEach(function (g) { groups[g] = supersede && supersede.indexOf(g) >= 0 ? { values: spec[g].values, expectedValues: spec[g].expectedValues, supersede: true } : spec[g] })
        return post(P + '/batch', { groups: groups, reason: ST.reason.trim() })
      }
      function askSupersede(e) {
        var d = (e.data && e.data.detail) || {}, gs = d.groups || []
        var names = gs.map(function (x) { return '「' + esc((by.filter(function (b) { return b.group === x.group })[0] || {}).plain || x.label) + '」的 ' + (x.keys || []).map(function (k) { return esc(k.name) }).join('、') }).join('；')
        var who = gs[0] && gs[0].by ? ' ' + esc(gs[0].by) + (gs[0].at ? '（' + esc(stamp(gs[0].at)) + '）' : '') : '其他使用者'
        return SettingsMatrix.openDialog({ title: '已有其他使用者的申請在等待生效', html: '<div>' + names + ' 已有' + who + '送出、還在等待生效的申請。</div><div class="sc-banner amber">繼續儲存會取代它，對方的申請就失效了；如果那是需要核准的放寬，對方須重新申請。</div>',
          buttons: [{ label: '取消', value: false }, { label: '取代它並儲存', value: true, kind: 'danger' }] }).then(function (v) { return v === true })
      }
      return send().catch(function (e) {
        var d = e.data && e.data.detail
        if (e.status === 409 && d && d.code === 'pending_exists' && !(d.applied || []).length) {
          return askSupersede(e).then(function (ok) {
            if (!ok) { var c = new Error('已取消'); c.cancelled = true; throw c }
            return send((d.groups || []).map(function (x) { return x.group })).catch(function (e2) { throw conflictError(e2, by) })
          })
        }
        throw conflictError(e, by)
      }).then(function (r) {
        by.forEach(function (b) { b.rows.forEach(function (row) { row.value = b.values[row.field] }) })
        var parts = saveSummary(r.groups || {})
        return { message: '已儲存：' + (parts.join('、') || '沒有任何變更') + '。' }
      }).catch(function (e) {
        if (e.applied && e.applied.length) by.forEach(function (b) { if (e.applied.indexOf(b.group) >= 0) b.rows.forEach(function (row) { row.value = b.values[row.field] }) })
        throw e
      })
    }

    function mountMatrix() {
      mx = SettingsMatrix.mount($('sc-mx'), {
        rows: [],
        rowVisible: function (r) { return r.page === ST.page },
        rowKey: function (r) { return r.key }, rowName: function (r) { return r.name }, rowGroup: function (r) { return r.groupPlain },
        rowSub: function (r) { return lockWhy(r) || rangeText(r.f) || r.f.unit || '' },        // 鎖住的原因直接寫在名稱下面（手機、鍵盤、讀屏都看得到，不只靠 tooltip）
        rowTags: function (r) {
          var t = []
          if (RISK_TAG[r.f.risk]) t.push({ text: RISK_TAG[r.f.risk], tone: r.f.banner && r.f.banner.level === 'red' ? 'crit' : 'warn' })
          if (r.f.source && r.f.source.kind === 'pending') t.push({ text: '待生效', tone: 'info' })
          return t
        },
        searchText: function (r) { return r.name + ' ' + (r.f.question || '') + ' ' + (r.f.help || '') },
        nameLabel: '設定項目', searchPlaceholder: '在這一頁搜尋設定',
        groupSummary: function (g, all) { var n = all.filter(function (r) { return !jeq(r.value, r.f.default) }).length; return n ? '與預設不同 ' + n + ' 項' : '全部是預設' },
        help: function (r) { return r.f.helpParts || null },
        source: function (r) { return r.f.source || null },
        diff: {
          isDefault: function (r) { return jeq(r.value, r.f.default) },
          defaultText: function (r) { return r.f.defaultText },
          draft: function (r) { return { value: r.f.default } },
          canReset: function (r) { return r.f.type !== 'json' },
        },
        columns: columns,
        batch: { actions: [], groupActionsEnabled: false },
        draft: {
          apply: function (r, pt) { return Object.assign({}, r, pt) },
          same: function (raw, merged) { return jeq(raw.value, merged.value) },
          confirm: confirmSave, save: save, afterSave: function () { renderNav() },
        },
        reload: reloadAll,
        onRender: function () { var sig = JSON.stringify(dirtyByPage()); if (sig !== ST.navSig) { ST.navSig = sig; renderNav() } },
        onError: function (e) { SettingsMatrix.toast((e && e.message) || '操作失敗', { error: true }) },
      })
    }

    // ── 總覽 ─────────────────────────────────────────────────────
    function changeText(c) {
      if (c.summary && c.summary.length) return esc(c.summary.join('；'))
      return esc(c.old == null ? '' : c.old) + ' → <b>' + esc(c.new == null ? '' : c.new) + '</b>'
    }
    function recentTable(list, testid) {
      if (!list.length) return '<div class="sc-empty">尚無任何變更。</div>'
      return '<table class="sc-table" data-testid="' + testid + '"><thead><tr><th>時間</th><th>誰改的</th><th>哪一項</th><th>改了什麼</th><th>狀態</th><th>原因</th></tr></thead><tbody>' + list.map(function (c) {
        return '<tr data-testid="sc-recent-' + esc(c.id) + '"><td>' + esc(stamp(c.at)) + '</td><td>' + esc(c.actor) + '</td><td>' + (c.page ? '<button type="button" class="sc-link" data-open="' + esc(c.page) + '" data-flash="' + esc(c.group + '.' + c.field) + '">' + esc(c.groupPlain + '／' + c.label) + '</button>' : esc(c.groupPlain + '／' + c.label)) + '</td><td>' + changeText(c) + '</td><td>' + esc(c.stateText) + '</td><td>' + esc(c.reason) + '</td></tr>'
      }).join('') + '</tbody></table>'
    }
    function showOverview() {
      showView('overview')
      try { history.replaceState(null, '', location.pathname + location.search) } catch (e) { /* ignore */ }
      var o = ST.ov, s = o.stats
      var items = o.differsItems.slice(0, 60)
      var html = '<h2 class="sc-h">總覽</h2><div class="sc-sub">此處顯示全部設定的現況。選取左側頁面即可調整；點選欄位僅記為草稿，按「儲存」並寫下原因才會生效。</div>' +
        '<div class="sc-cards">' +
        '<button type="button" class="sc-card" data-card="differs" data-testid="sc-card-differs"><span class="n">' + s.differs + '</span>與預設不同的設定</button>' +
        '<button type="button" class="sc-card" data-card="pending" data-testid="sc-card-pending"><span class="n">' + s.pending + '</span>待生效的變更</button>' +
        '<button type="button" class="sc-card" data-card="high" data-testid="sc-card-high"><span class="n">' + s.highRiskGroups + '</span>內含高風險設定的群組</button></div>' +
        '<h3 style="font-size:15px;margin:6px 0">最近 5 筆變更 <button type="button" class="sc-link" data-card="recent" style="font-size:13px;margin-left:6px">看全部</button></h3>' + recentTable(o.recent, 'sc-overview-recent') +
        '<h3 style="font-size:15px;margin:18px 0 6px" id="sc-differs-h">與預設不同的設定</h3>' +
        (items.length ? '<table class="sc-table" data-testid="sc-differs-list"><thead><tr><th>設定</th><th>目前</th><th>預設</th></tr></thead><tbody>' + items.map(function (d) {
          return '<tr><td><button type="button" class="sc-link" data-open="' + esc(d.page) + '" data-flash="' + esc(d.group + '.' + d.field) + '">' + esc(d.groupPlain + '／' + d.label) + '</button></td><td>' + (d.value === d.default ? '內容已自訂' : esc(d.value)) + '</td><td>' + (d.value === d.default ? '—' : esc(d.default)) + '</td></tr>'
        }).join('') + '</tbody></table>' + (o.differsItems.length > items.length ? '<div class="sc-sub">…另有 ' + (o.differsItems.length - items.length) + ' 項，請從左邊各頁查看。</div>' : '') : '<div class="sc-empty">全部設定都和預設一致。</div>')
      $('sc-v-overview').innerHTML = html
    }

    // ── 待生效 ───────────────────────────────────────────────────
    function showPending() {
      showView('pending')
      return call(P + '/pending').then(function (r) { ST.pending = r.pending || []; renderPending() }).catch(function (e) { say(e.message) })
    }
    function renderPending() {
      var h = '<h2 class="sc-h">待生效</h2><div class="sc-sub">放寬類或重要的變更不會立即生效：要等到期，需要時還要另一位最高管理者核准。期間內任何最高管理者都可以撤銷。</div>' +
        '<div class="sc-btnrow"><input type="text" class="sc-in" id="sc-pnote" placeholder="核准／撤銷的備註（選填）" style="min-width:260px" data-testid="sc-pending-note"></div>'
      if (!ST.pending.length) h += '<div class="sc-empty" data-testid="sc-pending-empty">尚無等待生效的變更。</div>'
      else h += '<table class="sc-table" data-testid="sc-pending-list"><thead><tr><th>設定</th><th>改成</th><th>申請人／原因</th><th>生效時間</th><th>核准</th><th></th></tr></thead><tbody>' + ST.pending.map(function (p) {
        var chg = p.summary && p.summary.length ? esc(p.summary.join('；')) : esc(p.oldText) + ' → <b>' + esc(p.newText) + '</b>'
        return '<tr data-testid="sc-pending-' + esc(p.id) + '"><td>' + esc(p.groupLabel + '／' + p.label) + '</td><td>' + chg + '</td><td>' + esc(p.actor) + '<div class="sc-sub">' + esc(p.reason) + '</div></td><td>' + esc(stamp(p.effectiveAt)) + '</td><td>' + (p.required ? esc((p.approvals || []).length + '／' + p.required) : '不需要') + '</td><td style="white-space:nowrap">' +
          (p.required ? '<button type="button" class="mx-btn mx-btn-sm" data-decide="approve" data-id="' + esc(p.id) + '" data-testid="sc-approve-' + esc(p.id) + '">核准</button> ' : '') +
          '<button type="button" class="mx-btn mx-btn-sm mx-btn-danger" data-decide="cancel" data-id="' + esc(p.id) + '" data-testid="sc-cancel-' + esc(p.id) + '">撤銷</button></td></tr>'
      }).join('') + '</tbody></table>'
      $('sc-v-pending').innerHTML = h
    }
    function decide(id, what) {
      var note = ($('sc-pnote') || {}).value || ''
      return post(P + '/pending/' + id + '/' + what, { reason: note.trim() }).then(function () {
        SettingsMatrix.toast(what === 'approve' ? '已核准' : '已撤銷')
        return Promise.all([call(P + '/pending').then(function (r) { ST.pending = r.pending || [] }), reloadAll()])
      }).then(function () { renderPending() }).catch(function (e) { say(e.message) })
    }

    // ── 最近變更 ─────────────────────────────────────────────────
    function showRecent() {
      showView('recent')
      return call(P + '/recent?limit=100' + (ST.recentHigh ? '&high=1' : '')).then(function (r) {
        $('sc-v-recent').innerHTML = '<h2 class="sc-h">最近變更</h2><div class="sc-btnrow"><label style="font-size:13px"><input type="checkbox" id="sc-recent-high"' + (ST.recentHigh ? ' checked' : '') + ' data-testid="sc-recent-high"> 只看影響金額、法規、資安的設定</label></div>' + recentTable(r.changes || [], 'sc-recent-list')
      }).catch(function (e) { say(e.message) })
    }

    // ── 版本紀錄與還原 ───────────────────────────────────────────
    function openGroups() {
      var out = []
      ST.ov.pages.forEach(function (p) { if (!p.standalone && p.status !== 'planned') p.groups.forEach(function (g) { out.push({ group: g, text: p.plain + '／' + groupPlain(g) }) }) })
      return out
    }
    function showVersions(group) {
      showView('versions')
      var gs = openGroups()
      ST.vgroup = group && gs.some(function (x) { return x.group === group }) ? group : (ST.vgroup || (gs[0] && gs[0].group) || '')
      ST.diff = null; ST.restoreFor = null; ST.restorePv = null
      return ST.vgroup ? call(P + '/groups/' + enc(ST.vgroup) + '/versions').then(function (r) { ST.versions = r.versions || []; renderVersions() }).catch(function (e) { say(e.message) }) : (renderVersions(), Promise.resolve())
    }
    function vopts(list, cur) { return list.map(function (x) { return '<option value="' + esc(x.value) + '"' + (x.value === cur ? ' selected' : '') + '>' + esc(x.label) + '</option>' }).join('') }
    function renderVersions() {
      var gs = openGroups(), vs = ST.versions
      var vl = vs.map(function (v) { return { value: String(v.version), label: '第 ' + v.version + ' 版' } })
      var h = '<h2 class="sc-h">版本紀錄與還原</h2><div class="sc-btnrow"><select class="sc-in" id="sc-vgroup" data-testid="sc-vgroup">' + gs.map(function (x) { return '<option value="' + esc(x.group) + '"' + (x.group === ST.vgroup ? ' selected' : '') + '>' + esc(x.text) + '</option>' }).join('') + '</select></div>'
      h += vs.length ? '<table class="sc-table" data-testid="sc-versions-list"><thead><tr><th>版本</th><th>時間</th><th>誰發布</th><th>備註</th><th></th></tr></thead><tbody>' + vs.map(function (v) {
        return '<tr><td>第 ' + esc(v.version) + ' 版</td><td>' + esc(stamp(v.at)) + '</td><td>' + esc(v.by) + '</td><td>' + esc(v.note) + '</td><td><button type="button" class="mx-btn mx-btn-sm" data-restore="' + esc(v.version) + '" data-testid="sc-restore-' + esc(v.version) + '">還原到這一版</button></td></tr>'
      }).join('') + '</tbody></table>' : '<div class="sc-empty">尚無發布過任何版本，目前使用系統預設。</div>'
      h += '<div class="sc-btnrow" style="margin-top:14px"><span class="sc-sub">比較</span><select class="sc-in" id="sc-diffa">' + vopts([{ value: 'default', label: '系統預設' }].concat(vl), vs.length ? String(vs[0].version) : 'default') + '</select><span class="sc-sub">與</span><select class="sc-in" id="sc-diffb">' + vopts([{ value: 'current', label: '目前' }, { value: 'default', label: '系統預設' }].concat(vl), 'current') + '</select><button type="button" class="mx-btn mx-btn-sm" id="sc-diff-go" data-testid="sc-diff">看差異</button></div>'
      if (ST.diff) h += ST.diff.changes.length ? '<table class="sc-table" data-testid="sc-diff-table"><thead><tr><th>設定</th><th>之前</th><th>之後</th></tr></thead><tbody>' + ST.diff.changes.map(function (c) { return '<tr><td>' + esc(c.label) + '</td><td>' + esc(c.oldText) + '</td><td>' + esc(c.newText) + '</td></tr>' }).join('') + '</tbody></table>' : '<div class="sc-empty">這兩個版本沒有差異。</div>'
      if (ST.restoreFor && ST.restorePv) {
        var kinds = { immediate: '立即生效', pending: '到期後生效', pending_approval: '需另一位最高管理者核准後生效', unchanged: '沒有變更' }
        var fs = ST.restorePv.fields.filter(function (x) { return x.kind !== 'unchanged' })
        h += '<div class="sc-box" data-testid="sc-restore-panel"><b>還原到第 ' + esc(ST.restoreFor) + ' 版會發生什麼</b>' + fs.map(function (r) { return '<div style="margin-top:6px"><b>' + esc(r.label) + '</b>：' + esc(r.oldText) + ' → ' + esc(r.newText) + '（' + esc(kinds[r.kind] || '') + '）' + bannerHtml(r.banner) + '</div>' }).join('') + (fs.length ? '' : '<div class="sc-sub">這一版的內容和目前相同，不會有任何變動。</div>') +
          '<textarea class="sc-in" rows="2" id="sc-restore-reason" data-testid="sc-restore-reason" placeholder="還原原因（必填）" style="margin-top:8px"></textarea><div class="sc-btnrow"><button type="button" class="mx-btn mx-btn-primary" id="sc-restore-ok" data-testid="sc-restore-confirm">確認還原</button><button type="button" class="mx-btn" id="sc-restore-no">取消</button></div></div>'
      }
      $('sc-v-versions').innerHTML = h
    }
    function startRestore(v) {
      ST.restoreFor = v
      return post(P + '/groups/' + enc(ST.vgroup) + '/restore/' + v, { preview: true }).then(function (pv) { ST.restorePv = pv; renderVersions() }).catch(function (e) { ST.restoreFor = null; say(e.message) })
    }
    function doRestore() {
      var reason = ($('sc-restore-reason').value || '').trim()
      if (!reason) { say('請填寫還原原因'); return Promise.resolve() }
      return post(P + '/groups/' + enc(ST.vgroup) + '/restore/' + ST.restoreFor, { reason: reason }).then(function (r) {
        SettingsMatrix.toast('已還原到第 ' + ST.restoreFor + ' 版' + ((r.pending || []).length ? '；其中放寬的項目已列入「待生效」' : ''))
        return reloadAll().then(function () { return showVersions(ST.vgroup) })
      }).catch(function (e) { say(e.message) })
    }

    // ── 預設組 ───────────────────────────────────────────────────
    function showProfiles() {
      showView('profiles')
      return call(P + '/profiles').then(function (r) { ST.profiles = r.profiles || []; renderProfiles() }).catch(function (e) { say(e.message) })
    }
    function renderProfiles() {
      var h = '<h2 class="sc-h">預設組</h2><div class="sc-sub">預設組是一組事先配好的建議值（例如「嚴格」）。套用前會先列出會改哪些設定；放寬的項目一樣要等到期與核准。</div><div class="sc-btnrow">' +
        ST.profiles.map(function (p) { return '<button type="button" class="mx-btn" data-profile="' + esc(p.name) + '" data-testid="sc-profile-' + esc(p.name) + '">' + esc(p.name) + '</button>' }).join('') + '</div>'
      if (!ST.profiles.length) h += '<div class="sc-empty">尚無可用的預設組。</div>'
      if (ST.profilePv) {
        var sk = (ST.profileSkipped || []).reduce(function (a, s) { return a + (s.fields || 0) }, 0)
        h += '<div class="sc-box" data-testid="sc-profile-panel"><b>套用「' + esc(ST.profileName) + '」會改這些設定</b>' + (ST.profilePv.length ? '<table class="sc-table"><thead><tr><th>群組</th><th>設定</th><th>目前</th><th>改成</th></tr></thead><tbody>' + ST.profilePv.map(function (c) { return '<tr><td>' + esc(c.groupLabel) + '</td><td>' + esc(c.label) + '</td><td>' + esc(c.old) + ' ' + esc(c.unit || '') + '</td><td><b>' + esc(c.new) + '</b> ' + esc(c.unit || '') + '</td></tr>' }).join('') + '</tbody></table>' : '<div class="sc-sub">目前的設定已經和這個預設組一致。</div>') +
          (sk ? '<div class="sc-sub" data-testid="sc-profile-skipped">略過 ' + sk + ' 項（開發中，尚未開放調整）</div>' : '') +
          '<textarea class="sc-in" rows="2" id="sc-profile-reason" placeholder="套用原因（必填）" style="margin-top:8px"></textarea><div class="sc-btnrow"><button type="button" class="mx-btn mx-btn-primary" id="sc-profile-ok" data-testid="sc-profile-apply">確認套用</button><button type="button" class="mx-btn" id="sc-profile-no">取消</button></div></div>'
      }
      $('sc-v-profiles').innerHTML = h
    }
    function previewProfile(name) {
      return call(P + '/profiles/' + enc(name) + '/preview').then(function (r) { ST.profileName = name; ST.profilePv = r.changes || []; ST.profileSkipped = r.skipped || []; renderProfiles() }).catch(function (e) { say(e.message) })
    }
    function applyProfile() {
      var reason = ($('sc-profile-reason').value || '').trim()
      if (!reason) { say('請填寫套用原因'); return Promise.resolve() }
      return post(P + '/profiles/' + enc(ST.profileName) + '/apply', { reason: reason }).then(function (r) {
        var sk = (r.skipped || []).reduce(function (a, s) { return a + (s.fields || 0) }, 0)
        SettingsMatrix.toast('已套用「' + ST.profileName + '」的 ' + (ST.profilePv ? ST.profilePv.length : 0) + ' 項' + (sk ? '，略過 ' + sk + ' 項（開發中）' : '') + '；放寬的項目會列入「待生效」')
        ST.profilePv = null; ST.profileSkipped = []; ST.profileName = ''
        return reloadAll().then(renderProfiles)
      }).catch(function (e) { say(e.message) })
    }

    // ── 全域搜尋 ─────────────────────────────────────────────────
    var hits = []
    function runSearch() {
      var q = $('sc-search').value.trim().toLowerCase(), box = $('sc-results')
      if (!q) { box.hidden = true; box.innerHTML = ''; hits = []; return }
      var tokens = q.split(/\s+/)
      hits = ST.idx.filter(function (it) { var t = it.text.toLowerCase(); return tokens.every(function (x) { return t.indexOf(x) >= 0 }) })
      var rank = { field: 0, group: 1, page: 2 }
      hits.sort(function (a, b) { return rank[a.kind] - rank[b.kind] })
      hits = hits.slice(0, 14)
      box.hidden = false
      box.innerHTML = hits.length ? hits.map(function (it, i) {
        if (it.kind === 'field') return '<button type="button" class="sc-res" data-hit="' + i + '" data-testid="sc-hit">' + esc(it.label) + '<small>' + esc(it.pagePlain + '／' + it.groupPlain) + '</small></button>'
        if (it.kind === 'group') return '<button type="button" class="sc-res" data-hit="' + i + '" data-testid="sc-hit">' + esc(it.groupPlain) + '<small>' + esc(it.pagePlain) + '（整組設定）</small></button>'
        return '<button type="button" class="sc-res" data-hit="' + i + '" data-testid="sc-hit">' + esc(it.pagePlain) + ' ↗<small>' + esc(it.category) + '・獨立頁面</small></button>'
      }).join('') : '<div class="sc-res-empty" data-testid="sc-nohit">找不到「' + esc($('sc-search').value.trim()) + '」</div>'
    }
    function jump(it) {
      $('sc-results').hidden = true
      if (it.kind === 'page') { location.href = it.href; return }
      openPage(it.page, it.kind === 'field' ? it.group + '.' + it.field : '')
    }

    // ── 事件 ─────────────────────────────────────────────────────
    function bind() {
      $('sc-search').addEventListener('input', runSearch)
      $('sc-search').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && hits[0]) { e.preventDefault(); jump(hits[0]) }
        if (e.key === 'Escape') { $('sc-results').hidden = true }
      })
      document.addEventListener('click', function (e) { if (!e.target.closest('.sc-searchbox')) $('sc-results').hidden = true })
      $('sc-results').addEventListener('click', function (e) { var b = e.target.closest('[data-hit]'); if (b) jump(hits[+b.getAttribute('data-hit')]) })
      $('sc-go-pending').addEventListener('click', showPending)
      $('sc-go-recent').addEventListener('click', showRecent)
      $('sc-go-versions').addEventListener('click', function () { showVersions('') })
      $('sc-go-profiles').addEventListener('click', showProfiles)
      $('sc-navtoggle').addEventListener('click', function () { var o = $('sc-nav').classList.toggle('open'); $('sc-navtoggle').setAttribute('aria-expanded', o ? 'true' : 'false') })
      $('sc-seg').addEventListener('click', function (e) { var b = e.target.closest('[data-seg]'); if (b) { ST.seg = b.getAttribute('data-seg'); renderNav() } })
      $('sc-nav').addEventListener('click', function (e) { var b = e.target.closest('[data-page]'); if (b) openPage(b.getAttribute('data-page')) })
      $('sc-pagehead').addEventListener('click', function (e) { var b = e.target.closest('[data-vgroup]'); if (b) showVersions(b.getAttribute('data-vgroup')) })
      $('sc-v-overview').addEventListener('click', function (e) {
        var c = e.target.closest('[data-card]'), o = e.target.closest('[data-open]')
        if (o) return openPage(o.getAttribute('data-open'), o.getAttribute('data-flash'))
        if (!c) return
        var k = c.getAttribute('data-card')
        if (k === 'pending') showPending()
        else if (k === 'high') { ST.recentHigh = true; showRecent() }
        else if (k === 'recent') { ST.recentHigh = false; showRecent() }
        else if (k === 'differs') { var h = $('sc-differs-h'); if (h) h.scrollIntoView({ block: 'start' }) }
      })
      $('sc-v-recent').addEventListener('click', function (e) { var o = e.target.closest('[data-open]'); if (o) openPage(o.getAttribute('data-open'), o.getAttribute('data-flash')) })
      $('sc-v-recent').addEventListener('change', function (e) { if (e.target.id === 'sc-recent-high') { ST.recentHigh = e.target.checked; showRecent() } })
      $('sc-v-pending').addEventListener('click', function (e) { var b = e.target.closest('[data-decide]'); if (b) decide(b.getAttribute('data-id'), b.getAttribute('data-decide')) })
      $('sc-v-versions').addEventListener('click', function (e) {
        var r = e.target.closest('[data-restore]')
        if (r) return startRestore(+r.getAttribute('data-restore'))
        if (e.target.id === 'sc-diff-go') call(P + '/groups/' + enc(ST.vgroup) + '/diff?a=' + enc($('sc-diffa').value) + '&b=' + enc($('sc-diffb').value)).then(function (d) { ST.diff = d; renderVersions() }).catch(function (x) { say(x.message) })
        if (e.target.id === 'sc-restore-ok') doRestore()
        if (e.target.id === 'sc-restore-no') { ST.restoreFor = null; ST.restorePv = null; renderVersions() }
      })
      $('sc-v-versions').addEventListener('change', function (e) { if (e.target.id === 'sc-vgroup') showVersions(e.target.value) })
      $('sc-v-profiles').addEventListener('click', function (e) {
        var p = e.target.closest('[data-profile]')
        if (p) return previewProfile(p.getAttribute('data-profile'))
        if (e.target.id === 'sc-profile-ok') applyProfile()
        if (e.target.id === 'sc-profile-no') { ST.profilePv = null; renderProfiles() }
      })
    }

    function route() {
      var qs = new URLSearchParams(location.search), hash = ''
      try { hash = decodeURIComponent((location.hash || '').replace(/^#/, '')) } catch (e) { hash = '' }
      if (qs.get('tab') === 'versions') return showVersions(qs.get('group') || '')
      var pid = hash.indexOf('p=') === 0 ? hash.slice(2) : ''
      if (!pid && hash) { var pg = pageOfGroup(hash); if (pg) pid = pg.id }          // 舊網址 #群組代碼（系統中心的卡片這樣連過來）
      if (pid && pageById(pid) && !pageById(pid).standalone) return openPage(pid)
      showOverview()
      return Promise.resolve()
    }

    function boot() {
      Promise.all([call(P + '/overview'), call(P + '/index')]).then(function (rs) {
        ST.ov = rs[0]; ST.idx = rs[1].items || []
        $('sc-pending-n').textContent = ST.ov.stats.pending
        mountMatrix()
        bind()
        renderNav()
        call(P + '/profiles').then(function (r) { if ((r.profiles || []).length) $('sc-go-profiles').hidden = false }).catch(function () { /* 沒有預設組 */ })
        return route()
      }).catch(function (e) {
        var msg = e.status === 403 || e.status === 401 ? '只有最高管理者可以使用設定中心。' : '讀取失敗：' + e.message
        $('sc-v-overview').hidden = false
        $('sc-v-overview').innerHTML = '<div class="sc-err" data-testid="sc-boot-error">' + esc(msg) + '</div>'
      })
    }
    window.__settingsCenter = { state: function () { return ST }, matrix: function () { return mx } }
    boot()
  })()
  </script>
</body>
</html>
