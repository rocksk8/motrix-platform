<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{if(localStorage.getItem('motrix_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/api/system/branding/favicon">
  <title>簽核代理人 — MOTRIX PLATFORM</title>
  <script src="../static/auth-guard.js"></script>
  <script src="../static/motrix-date.js"></script>
  <script defer src="../static/vendor/alpine-3.17.1.min.js"></script>
  <link rel="stylesheet" href="../css/style.css?v=20260828a">
  <style>
    [x-cloak] { display: none !important; }
    .dg-main {
      margin-left: var(--sidebar-w);
      margin-top: var(--topbar-h);
      padding: 28px 32px;
      min-height: calc(calc(100vh / var(--fz,1)) - var(--topbar-h));
      background: var(--white);
    }
    .dg-card {
      background:#fff; border:1px solid var(--border-light); border-radius:var(--radius-lg);
      padding:20px; margin-bottom:20px;
    }
    .dg-form-row { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-bottom:14px; }
    .dg-field { display:flex; flex-direction:column; gap:4px; }
    .dg-field label { font-size:12px; color:var(--text-secondary); font-family:var(--font-zh); }
    .dg-field select, .dg-field input {
      padding:7px 10px; border:1px solid var(--border-light); border-radius:var(--radius);
      font-size:12px; font-family:var(--font-zh); outline:none; min-width:160px;
    }
    .dg-field input[type="date"] { min-width:140px; }
    /* 手機／平板直式（2026-11-12 UI 檢查）：表單欄位寬度參差、「新增」鈕與原因欄擠同一行；七欄表格在 375px 難讀。
       ⇒ 手機表單欄位一欄撐滿（16px 字、≥44px 高）；清單每筆改成卡片（委託人→代理人＋狀態、期間、原因、建立者＋停用）。 */
    @media (max-width:767px){
      .dg-main{padding:16px 12px 28px}
      .dg-card{padding:14px}
      .dg-form-row{flex-direction:column;align-items:stretch}
      .dg-field,.dg-field[style]{flex:none !important;width:100%}
      .dg-field select,.dg-field input,.dg-field input[type="date"]{width:100%;min-width:0;box-sizing:border-box;font-size:16px;min-height:44px}
      .dg-form-row > .btn{min-height:44px;width:100%;justify-content:center;text-align:center}
      .dg-card .data-table{min-width:0;display:block}
      .dg-card .data-table thead{display:none}
      .dg-card .data-table tbody{display:block}
      .dg-card .data-table tr{display:grid;grid-template-columns:1fr auto;grid-template-areas:"to st" "from from" "dates dates" "reason reason" "by act";
        gap:6px 10px;padding:12px;margin-bottom:10px;border:1px solid var(--border-light);border-radius:var(--radius)}
      .dg-card .data-table td{display:block;padding:0;border:0;text-align:left !important;min-width:0;overflow-wrap:anywhere}
      .dg-card .data-table td:nth-child(1){grid-area:from;font-size:12px;color:var(--text-secondary)}
      .dg-card .data-table td:nth-child(1)::before{content:"委託人　";color:var(--text-dim)}
      .dg-card .data-table td:nth-child(2){grid-area:to;font-weight:600}
      .dg-card .data-table td:nth-child(2)::before{content:"代理人　";font-weight:400;color:var(--text-dim);font-size:12px}
      .dg-card .data-table td:nth-child(3){grid-area:dates;font-size:12px;color:var(--text-secondary)}
      .dg-card .data-table td:nth-child(4){grid-area:reason;font-size:12px;color:var(--text-secondary)}
      .dg-card .data-table td:nth-child(5){grid-area:st;text-align:right !important}
      .dg-card .data-table td:nth-child(6){grid-area:by;font-size:12px;color:var(--text-dim)}
      .dg-card .data-table td:nth-child(6)::before{content:"建立者　"}
      .dg-card .data-table td:nth-child(7){grid-area:act;text-align:right !important}
      .dg-card .data-table td .btn-export{min-height:40px;padding:6px 14px !important}
    }
    @media (min-width:768px) and (max-width:1023px){
      .dg-main{padding:22px 20px}
      .dg-field select,.dg-field input{min-height:40px}
      .dg-card .data-table td .btn-export{min-height:36px}
    }
  </style>
</head>
<body x-data="approvalDelegatesPage()" x-init="init()" x-cloak>

<header id="app-topbar" class="topbar"></header>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<aside class="sidebar" id="app-sidebar"></aside>

<main class="dg-main">
  <div style="margin-bottom:20px">
    <h1 style="font-size:20px;font-weight:700">簽核代理人</h1>
    <p style="font-size:12px;color:var(--text-secondary);margin-top:4px">
      請假等情境下，把自己在簽核流程裡的簽核權限暫時交給另一位同事——代理期間對方可以代替您完成待簽核的項目（報價單／出貨單／承攬商匯款申請／發票開立簽核單／請款單皆適用）。
    </p>
  </div>

  <div x-show="toast" style="background:#F0FDF4;border:1px solid #86EFAC;color:#15803D;padding:10px 14px;border-radius:var(--radius);font-size:12px;margin-bottom:14px" x-text="toast"></div>
  <div x-show="error" style="background:#FEF2F2;border:1px solid #FECACA;color:var(--danger);padding:10px 14px;border-radius:var(--radius);font-size:12px;margin-bottom:14px" x-text="error"></div>

  <div class="dg-card">
    <div class="cm-section-title" style="margin-bottom:12px">新增代理設定</div>
    <div class="dg-form-row">
      <template x-if="isSuperadmin">
        <div class="dg-field">
          <label>委託人（誰的簽核權限）</label>
          <select x-model="form.delegatorUsername">
            <option value="">— 我自己 —</option>
            <template x-for="u in selectableUsers" :key="u.username">
              <option :value="u.username" x-text="u.display_name + '（' + u.username + '）'"></option>
            </template>
          </select>
        </div>
      </template>
      <div class="dg-field">
        <label>代理人</label>
        <select x-model="form.delegateUsername">
          <option value="">請選擇</option>
          <template x-for="u in selectableUsers" :key="u.username">
            <option :value="u.username" x-text="u.display_name + '（' + u.username + '）'"></option>
          </template>
        </select>
      </div>
      <div class="dg-field">
        <label>開始日期</label>
        <input type="date" x-model="form.startDate">
      </div>
      <div class="dg-field">
        <label>結束日期</label>
        <input type="date" x-model="form.endDate">
      </div>
      <div class="dg-field" style="flex:1">
        <label>原因（選填）</label>
        <input type="text" x-model="form.reason" placeholder="例如：出差、休假">
      </div>
      <button class="btn btn-primary" @click="createDelegate()" :disabled="saving">
        <span x-text="saving ? '儲存中…' : '新增'"></span>
      </button>
    </div>
    <div style="font-size:12px;color:var(--text-dim)" x-show="!isSuperadmin">
      只能設定自己的簽核代理人；如需代替他人設定（例如對方臨時請假、來不及自行設定），請聯絡最高管理者。
    </div>
  </div>

  <div class="dg-card">
    <div class="cm-section-title" style="margin-bottom:12px" x-text="isSuperadmin ? '全部代理設定' : '我的代理設定'"></div>
    <div x-show="loading" class="loading-text">載入中…</div>
    <template x-if="!loading && delegates.length === 0">
      <div class="empty-state">目前沒有代理設定</div>
    </template>
    <table class="data-table" x-show="!loading && delegates.length > 0">
      <thead><tr>
        <th>委託人</th><th>代理人</th><th class="c">起訖日期</th><th>原因</th>
        <th class="c">狀態</th><th>建立者</th><th class="c">操作</th>
      </tr></thead>
      <tbody>
        <template x-for="d in delegates" :key="d.id">
          <tr>
            <td x-text="d.delegatorUsername"></td>
            <td x-text="d.delegateUsername"></td>
            <td class="c" x-text="d.startDate + ' ~ ' + d.endDate"></td>
            <td x-text="d.reason || '—'"></td>
            <td class="c">
              <span :style="d.active ? 'color:#15803D' : 'color:var(--text-dim)'"
                    x-text="d.active ? '生效中' : '已停用'"></span>
            </td>
            <td x-text="d.createdBy"></td>
            <td class="c">
              <button class="btn-export excel" style="padding:3px 8px;font-size:12px"
                      x-show="d.active && (isSuperadmin || d.delegatorUsername === myUsername)"
                      @click="deactivate(d.id)">停用</button>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</main>

<script>
function approvalDelegatesPage() {
  return {
    session: {},
    myUsername: '',
    isSuperadmin: false,
    selectableUsers: [],
    delegates: [],
    loading: true,
    saving: false,
    toast: '',
    error: '',
    form: { delegatorUsername: '', delegateUsername: '', startDate: '', endDate: '', reason: '' },

    _headers() {
      return { 'Authorization': 'Bearer ' + (this.session.token || '') }
    },

    // 🔴 Alpine 3 看到資料物件有 init() 就會**自己叫一次**，
    //    而 body 上那個明著呼叫初始化的屬性會再叫一次 ⇒ **跑兩遍**。
    // ☠️ 後果不只是 API 發兩次：第二次的回應晚一步抵達，
    //    會把使用者這段期間改過的欄位用伺服器上的舊值**無聲蓋回去**。
    _initDone: false,

    async init() {
      if (this._initDone) return
      this._initDone = true
      const s = localStorage.getItem('motrix_session')
      if (!s) { window.location.href = 'login.html'; return }
      try {
        this.session = JSON.parse(s)
        if (!this.session.token) { window.location.href = 'login.html'; return }
      } catch(e) { window.location.href = 'login.html'; return }

      const res = await fetch('/api/auth/me', { headers: this._headers() })
      if (!res.ok) { localStorage.removeItem('motrix_session'); window.location.href = 'login.html'; return }
      const me = await res.json()
      this.myUsername = me.username
      this.isSuperadmin = me.role === 'superadmin'

      const today = MotrixDate.today()
      this.form.startDate = today
      this.form.endDate = today

      try {
        const ru = await fetch('/api/users/selectable', { headers: this._headers() })
        if (ru.ok) this.selectableUsers = (await ru.json()).filter(u => u.username !== this.myUsername)
      } catch {}

      await this.loadDelegates()
    },

    async loadDelegates() {
      this.loading = true
      try {
        const r = await fetch('/api/approval-delegates', { headers: this._headers() })
        if (r.ok) this.delegates = await r.json()
      } catch {}
      this.loading = false
    },

    async createDelegate() {
      this.error = ''
      this.toast = ''
      if (!this.form.delegateUsername) { this.error = '請選擇代理人'; return }
      if (!this.form.startDate || !this.form.endDate) { this.error = '請指定代理起訖日期'; return }
      this.saving = true
      try {
        const body = {
          delegateUsername: this.form.delegateUsername,
          startDate: this.form.startDate,
          endDate: this.form.endDate,
          reason: this.form.reason,
        }
        if (this.isSuperadmin && this.form.delegatorUsername) body.delegatorUsername = this.form.delegatorUsername
        const r = await fetch('/api/approval-delegates', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...this._headers() },
          body: JSON.stringify(body),
        })
        if (!r.ok) {
          const j = await r.json().catch(() => ({}))
          throw new Error(j.detail || '新增失敗')
        }
        this.toast = '已新增代理設定'
        this.form.delegateUsername = ''
        this.form.reason = ''
        await this.loadDelegates()
      } catch (e) {
        this.error = e.message || '新增失敗'
      } finally {
        this.saving = false
      }
    },

    async deactivate(id) {
      if (!confirm('確認停用此代理設定？')) return
      try {
        const r = await fetch('/api/approval-delegates/' + id + '/deactivate', {
          method: 'PATCH',
          headers: this._headers(),
        })
        if (!r.ok) {
          const j = await r.json().catch(() => ({}))
          throw new Error(j.detail || '停用失敗')
        }
        await this.loadDelegates()
      } catch (e) {
        this.error = e.message || '停用失敗'
      }
    },
  }
}
</script>
<script src="../static/notif.js"></script>
<script src="../static/sidebar.js"></script>
</body>
</html>
