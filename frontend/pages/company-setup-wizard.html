<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{if(localStorage.getItem('motrix_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/api/system/branding/favicon">
  <title>公司設定精靈 — MOTRIX PLATFORM</title>
  <script src="../static/auth-guard.js"></script>
  <script src="../static/ux-wizard.js"></script><!-- 公司資料閘門（?setup=1）時套用首次設定精靈外殼（隱藏頂欄、外層步驟條）；平常從「開始使用」進來不套 -->
  <link rel="stylesheet" href="../css/style.css?v=20260805g">
  <!--
    公司設定精靈（T84）：把「本公司資料」分成 5 個短步驟，每步各自儲存、可中途離開、回來接著做；邏輯在 static/company-wizard.js。
    只用既有的「本公司資料」「品牌圖檔」「首次設定狀態」三組端點（本公司資料未確認時的 428 閘門只放行這幾支）。
    「？」說明：hint-popover（批次 9）合併後，在 <head> 加上 hint-popover.css 與 hint-popover.js 兩行即可，欄位旁已經放好空殼。
  -->
  <style>
    .page-main{margin-left:var(--sidebar-w);margin-top:var(--topbar-h);padding:28px 32px 64px;min-height:calc(calc(100vh / var(--fz,1)) - var(--topbar-h));background:var(--white)}
    html.ux-wizard .page-main{margin-left:0;margin-top:0;min-height:0;padding-top:8px}
    .cw-inner{max-width:760px;margin:0 auto}
    .cw-inner h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em;font-family:var(--font-zh)}
    .cw-sub{font-size:12.5px;color:var(--text-secondary);margin:4px 0 16px}
    .cw-steps{list-style:none;margin:0 0 16px;padding:0;display:flex;gap:6px;flex-wrap:wrap}
    .cw-step{flex:1 1 0;min-width:0}
    .cw-stepbtn{width:100%;display:flex;gap:8px;align-items:center;border:1px solid var(--border-light);background:var(--surface);color:var(--text-secondary);border-radius:var(--radius);padding:8px 10px;font-size:12.5px;font-family:var(--font-zh);cursor:pointer;min-height:44px;text-align:left}
    .cw-step.is-cur .cw-stepbtn{border-color:var(--accent);color:var(--text-primary);font-weight:700}
    .cw-no{flex:0 0 22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--surface-sunken)}
    .cw-step.is-done .cw-no{background:var(--tone-ok-bg);color:var(--tone-ok-fg)}
    .cw-step.is-cur .cw-no{background:var(--accent);color:#fff}
    .cw-stept{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .cw-card{border:1px solid var(--border-light);border-radius:var(--radius-lg);background:var(--surface);padding:18px 20px}
    .cw-cap{font-size:12px;color:var(--text-secondary);margin:0 0 4px}
    .cw-h{margin:0 0 6px;font-size:19px;font-weight:800;font-family:var(--font-zh)}
    .cw-why{margin:0 0 14px;font-size:13px;line-height:1.7;color:var(--text-secondary)}
    .cw-field{margin:0 0 14px}
    .cw-label{display:block;font-size:13px;font-weight:600;margin:0 0 4px;font-family:var(--font-zh)}
    .cw-req{color:var(--danger,#dc2626);margin-left:2px}
    .cw-input{width:100%;box-sizing:border-box;border:1px solid var(--border-light);border-radius:var(--radius);padding:9px 10px;font-size:14px;background:var(--white);color:var(--text-primary);font-family:inherit;min-height:44px}
    textarea.cw-input{min-height:64px;resize:vertical}
    .cw-file{display:block;width:100%;max-width:100%;font-size:13px;min-height:44px}
    .cw-note{font-size:12px;color:var(--text-secondary);margin:4px 0 0;line-height:1.6}
    .cw-note.ok{color:var(--tone-ok-fg)}
    .cw-note.bad{color:var(--danger,#dc2626);font-weight:600}
    .cw-preview{margin:6px 0 4px;border:1px dashed var(--border-light);border-radius:var(--radius);padding:12px 14px;background:var(--surface-sunken)}
    .cw-preview-cap{font-size:11.5px;color:var(--text-secondary);margin:0 0 6px}
    .cw-pv-name{font-size:16px;font-weight:800}
    .cw-pv-en{font-size:12.5px;color:var(--text-secondary)}
    .cw-pv-line{font-size:12.5px;margin-top:2px;overflow-wrap:anywhere}
    .cw-fixed{margin:0 0 14px;padding:10px 12px;border:1px solid var(--border-light);border-radius:var(--radius);background:var(--surface-sunken)}
    .cw-fixed-t{font-size:12px;color:var(--text-secondary)}
    .cw-fixed-v{font-size:14px;font-weight:700;margin-top:2px}
    .cw-sum{display:grid;grid-template-columns:96px 1fr;gap:4px 12px;margin:0 0 12px;font-size:13px}
    .cw-sum dt{color:var(--text-secondary)}
    .cw-sum dd{margin:0;overflow-wrap:anywhere}
    .cw-ack{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:12px 0;line-height:1.6}
    .cw-ack input{margin-top:3px;width:18px;height:18px;flex:0 0 18px}
    .cw-nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
    .cw-btn{border:1px solid var(--border-light);background:var(--surface);color:var(--text-primary);border-radius:var(--radius);padding:10px 18px;font-size:14px;cursor:pointer;font-family:var(--font-zh);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:44px}
    .cw-btn:hover{border-color:var(--accent)}
    .cw-btn--main{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
    .cw-btn:disabled{opacity:.5;cursor:not-allowed}
    .cw-confirm{width:100%}
    .cw-warn{margin:0 0 12px;padding:10px 14px;border:1px solid var(--tone-bad-border);background:var(--tone-bad-bg);color:var(--tone-bad-fg);border-radius:var(--radius);font-size:13px;line-height:1.6}
    .cw-okmsg{margin:0 0 12px;padding:10px 14px;border:1px solid var(--tone-ok-border);background:var(--tone-ok-bg);color:var(--tone-ok-fg);border-radius:var(--radius);font-size:13px}
    .cw-done{border-color:var(--tone-ok-border)}
    @media (max-width:900px){
      .page-main{margin-left:0;padding:20px 16px 48px}
      .cw-steps{flex-wrap:nowrap;overflow-x:auto;gap:4px}
      .cw-step{flex:0 0 auto}
      .cw-stepbtn{padding:8px 10px}
      .cw-stept{display:none}
      .cw-step.is-cur .cw-stept{display:inline}
      .cw-card{padding:16px 14px}
      .cw-nav .cw-btn{flex:1 1 100%}
      .cw-sum{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <header id="app-topbar" class="topbar"></header>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="app-sidebar"></aside>

  <div class="app-shell">
    <main class="page-main">
      <div class="cw-inner">
        <h1>公司設定精靈</h1>
        <div class="cw-sub" data-testid="cw-subtitle">分 5 個短步驟，每一步按「儲存並繼續」就會存起來；中途離開亦可，回來會從尚未完成的那一步接續。</div>
        <div id="cw-root" data-testid="cw-root"></div>
      </div>
    </main>
  </div>

<script src="../static/company-wizard.js"></script>
<script src="../static/sidebar.js"></script>
<script src="../static/notif.js"></script>
</body>
</html>
