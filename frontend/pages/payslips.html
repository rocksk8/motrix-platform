<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{if(localStorage.getItem('motrix_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>勞報單 — MOTRIX ERP</title>
  <link rel="icon" type="image/png" href="../static/favicon.png">
  <script src="../static/auth-guard.js"></script>
  <script defer src="../static/vendor/alpine-3.17.1.min.js"></script>
  <link rel="stylesheet" href="../css/style.css?v=20260805g">
  <style>
    [x-cloak]{display:none!important}
    .page-main{margin-left:var(--sidebar-w);margin-top:var(--topbar-h);padding:28px 32px;min-height:calc(100vh - var(--topbar-h));background:var(--white);transition:padding-right .22s}
    .search-bar{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
    .search-wrap{position:relative;flex:0 0 280px}
    .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-dim);pointer-events:none}
    .search-input{width:100%;padding:8px 12px 8px 36px;border:1px solid var(--border-light);border-radius:var(--radius);font-size:13px;font-family:var(--font-zh);background:#fff;outline:none;box-sizing:border-box}
    .search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
    .data-table{width:100%;border-collapse:collapse;font-size:13px}
    .data-table th{padding:10px 12px;text-align:left;font-size:10px;font-family:LINE Seed TW_OTF, sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);font-weight:500;background:#FAFAF8;border-bottom:1px solid var(--border-light);white-space:nowrap}
    .data-table th.amt,.data-table td.amt{text-align:right;font-family:LINE Seed TW_OTF, monospace}
    .data-table td{padding:11px 12px;border-bottom:1px solid #F0EEE9;vertical-align:middle}
    .data-table tr:last-child td{border-bottom:none}
    .data-table tr:hover td{background:#FDFCFA}
    .data-table tr:hover .row-actions{opacity:1}
    .row-actions{opacity:0;display:flex;gap:6px;transition:opacity .12s}
    .tag{display:inline-flex;padding:2px 8px;border-radius:3px;font-size:11px;font-family:LINE Seed TW_OTF, sans-serif}
    .tag-exported{background:#ECFDF5;color:#059669}
    .tag-draft{background:#F3F4F6;color:#6B7280}
    .itype{display:inline-flex;padding:1px 7px;border-radius:3px;font-size:11px;font-family:LINE Seed TW_OTF, sans-serif;background:var(--accent-light);color:var(--accent)}
    .exp-chip{display:inline-flex;padding:1px 7px;border-radius:10px;font-size:10px;font-family:LINE Seed TW_OTF, monospace;background:#F0EEE9;color:var(--text-dim);border:1px solid var(--border-light);cursor:pointer;margin-left:4px}
    .exp-chip:hover{background:#e8f0fe;border-color:#93c5fd;color:var(--accent)}
    .detail-pane{position:fixed;right:0;top:var(--topbar-h);width:380px;height:calc(100vh - var(--topbar-h));background:#fff;border-left:1px solid var(--border-light);box-shadow:var(--shadow-lg);z-index:100;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease}
    .detail-pane.open{transform:translateX(0)}
    .detail-head{padding:16px 20px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:10px}
    .detail-body{flex:1;overflow-y:auto;padding:16px 20px}
    .detail-body::-webkit-scrollbar{width:4px}
    .detail-body::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:2px}
    .detail-close{margin-left:auto;width:28px;height:28px;border-radius:4px;border:none;background:#F0EEE9;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
    .detail-close:hover{background:var(--danger-light);color:var(--danger)}
    .detail-row{display:flex;gap:8px;margin-bottom:10px;font-size:12px}
    .detail-label{color:var(--text-dim);min-width:72px;flex-shrink:0}
    .detail-val{color:var(--text-primary);font-weight:500;flex:1;word-break:break-all}
    .detail-divider{border:none;border-top:1px solid var(--border-light);margin:14px 0}
    .detail-sec{font-size:10px;font-family:LINE Seed TW_OTF, sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);font-weight:600;margin-bottom:10px}
    .amount-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:12px;border-bottom:1px solid #F9F8F6}
    .amount-row:last-child{border-bottom:none}
    .amount-row--total{font-size:13px;font-weight:700;color:var(--text-primary)}
    .empty-state{text-align:center;padding:60px 20px;color:var(--text-dim)}
    .empty-icon{font-size:40px;margin-bottom:12px;opacity:.4}
    /* PDF Preview Modal */
    .pv-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
    .pv-modal{background:#fff;border-radius:12px;width:min(900px,96vw);height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4)}
    .pv-head{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border-light);flex-shrink:0}
    .pv-title{font-size:14px;font-weight:700;color:var(--text-primary)}
    .pv-sub{font-size:11px;color:var(--text-dim);margin-top:2px;font-family:LINE Seed TW_OTF, monospace}
    .pv-close{background:none;border:none;cursor:pointer;color:var(--text-dim);font-size:22px;line-height:1;padding:2px 8px;border-radius:4px;font-family:inherit}
    .pv-close:hover{background:var(--border-light);color:var(--text-primary)}
    .pv-body{flex:1;overflow:hidden;background:#525659;position:relative}
    .pv-spinner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ddd;font-size:13px;gap:10px}
    .pv-spinner svg{animation:spin 1.2s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .pv-iframe{width:100%;height:100%;border:none;display:block}
    .pv-foot{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-top:1px solid var(--border-light);flex-shrink:0}
  </style>
</head>
<body x-data="payslipsPage()" x-init="init()">
<header id="app-topbar" class="topbar"></header>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<aside class="sidebar" id="app-sidebar"></aside>

<div class="page-main" :style="selectedId ? 'padding-right:400px' : ''">

  <!-- 頁頭 -->
  <div class="pg">
      <div class="pg__l">
        <div class="pg__eyebrow">勞務管理</div>
        <h1 class="pg__t">勞報單</h1>
<p style="font-size:12px;color:var(--text-secondary);margin-top:4px" x-text="`共 ${total} 筆記錄`"></p>
    </div>
    <a href="payslip-form.html" class="btn btn-primary">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v16m8-8H4"/></svg>
      新增勞報單
    </a>
  </div>

  <!-- 篩選列 -->
  <div class="search-bar">
    <div class="search-wrap">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input class="search-input" type="text" x-model="searchQ" @input.debounce.300ms="load()" placeholder="搜尋受領人…">
    </div>
    <div>
      <input style="padding:8px 11px;border:1px solid var(--border-light);border-radius:var(--radius);font-size:13px;font-family:var(--font-zh);outline:none"
             type="month" x-model="filterMonth" @change="load()" title="月份篩選">
    </div>
    <button class="btn btn-ghost btn-sm" @click="filterMonth='';searchQ='';load()">清除篩選</button>
  </div>

  <!-- 列表 -->
  <div class="panel" style="padding:0;overflow:hidden">
    <div class="table-scroll" x-show="!loading">
      <table class="data-table">
        <thead>
          <tr>
            <th>單號</th>
            <th>受領人</th>
            <th>所得類別</th>
            <th class="amt">應付總額</th>
            <th class="amt">實發金額</th>
            <th>日期</th>
            <th>狀態</th>
            <th style="width:80px"></th>
          </tr>
        </thead>
        <tbody>
          <template x-for="p in filteredItems" :key="p.slip_no">
            <tr @click="selectSlip(p)" style="cursor:pointer" :style="selectedId===p.slip_no ? 'background:#F0F7FF' : ''">
              <td style="font-family:LINE Seed TW_OTF, monospace;font-size:12px" x-text="p.slip_no"></td>
              <td>
                <div style="display:flex;align-items:center;gap:8px">
                  <div style="width:28px;height:28px;border-radius:50%;background:#0EA5E9;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0"
                       x-text="(p.contractor_name||'?')[0]"></div>
                  <span x-text="p.contractor_name || '—'"></span>
                </div>
              </td>
              <td><span class="itype" x-text="p.income_type"></span></td>
              <td class="amt" x-text="'NT$ ' + (p.gross_amount||0).toLocaleString()"></td>
              <td class="amt" style="font-weight:600" x-text="'NT$ ' + (p.net_amount||0).toLocaleString()"></td>
              <td style="font-size:12px;font-family:LINE Seed TW_OTF, monospace" x-text="p.slip_date || '—'"></td>
              <td>
                <span class="tag" :class="p.status === '已匯出' ? 'tag-exported' : 'tag-draft'"
                      x-text="p.status"></span>
                <span class="exp-chip" x-show="p.export_count > 0"
                      x-text="'×' + p.export_count"
                      :title="'已匯出 ' + p.export_count + ' 次，點擊查看紀錄'"
                      @click.stop="openHistory(p)"></span>
              </td>
              <td>
                <div class="row-actions">
                  <button class="btn btn-ghost btn-sm" @click.stop="previewPdf(p)">預覽</button>
                </div>
              </td>
            </tr>
          </template>
          <tr x-show="!loading && filteredItems.length === 0">
            <td colspan="8">
              <div class="empty-state">
                <div class="empty-icon">📄</div>
                <div>尚無勞報單記錄</div>
                <a href="payslip-form.html" class="btn btn-primary" style="margin-top:12px">新增第一張勞報單</a>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div x-show="loading" style="text-align:center;padding:60px;color:var(--text-dim)">載入中…</div>
  </div>
</div>

<!-- ══ 右側詳細面板 ══ -->
<div class="detail-pane" :class="{open: !!selectedId}">
  <template x-if="selectedSlip">
    <div style="display:contents">
      <div class="detail-head">
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;font-size:14px" x-text="selectedSlip.contractor_name || '—'"></div>
          <div style="display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap">
            <span class="tag" :class="selectedSlip.status === '已匯出' ? 'tag-exported' : 'tag-draft'"
                  x-text="selectedSlip.status"></span>
            <span class="itype" x-text="selectedSlip.income_type"></span>
          </div>
        </div>
        <button class="detail-close" @click="selectedId=null;selectedSlip=null">×</button>
      </div>
      <div class="detail-body">

        <div class="detail-sec">單據資訊</div>
        <div class="detail-row">
          <span class="detail-label">單號</span>
          <span class="detail-val" style="font-family:LINE Seed TW_OTF, monospace;font-size:12px" x-text="selectedSlip.slip_no"></span>
        </div>
        <div class="detail-row">
          <span class="detail-label">開單日期</span>
          <span class="detail-val" style="font-family:LINE Seed TW_OTF, monospace" x-text="selectedSlip.slip_date || '—'"></span>
        </div>
        <div class="detail-row" x-show="selectedSlip.export_count > 0">
          <span class="detail-label">匯出次數</span>
          <span class="detail-val">
            <span x-text="selectedSlip.export_count + ' 次'"></span>
            <button class="btn btn-ghost btn-sm" @click="openHistory(selectedSlip)" style="margin-left:6px">查看紀錄</button>
          </span>
        </div>

        <hr class="detail-divider">
        <div class="detail-sec">金額明細</div>
        <div style="background:#FAFAF8;border-radius:var(--radius);padding:12px 14px">
          <div class="amount-row">
            <span style="color:var(--text-secondary)">應付總額</span>
            <span style="font-family:LINE Seed TW_OTF, monospace" x-text="'NT$ ' + (selectedSlip.gross_amount||0).toLocaleString()"></span>
          </div>
          <div class="amount-row">
            <span style="color:var(--text-secondary)">代扣所得稅</span>
            <span style="font-family:LINE Seed TW_OTF, monospace;color:var(--danger)" x-text="'－ NT$ ' + (selectedSlip.tax_withheld||0).toLocaleString()"></span>
          </div>
          <div class="amount-row">
            <span style="color:var(--text-secondary)">二代健保</span>
            <span style="font-family:LINE Seed TW_OTF, monospace;color:var(--danger)" x-text="'－ NT$ ' + (selectedSlip.nhi_supplement||0).toLocaleString()"></span>
          </div>
          <div style="border-top:1px solid var(--border-light);margin:8px 0 6px"></div>
          <div class="amount-row amount-row--total">
            <span>實發金額</span>
            <span style="font-family:LINE Seed TW_OTF, monospace;color:var(--accent)" x-text="'NT$ ' + (selectedSlip.net_amount||0).toLocaleString()"></span>
          </div>
        </div>

        <hr class="detail-divider">
        <div style="display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;gap:8px">
            <a :href="'payslip-form.html?id=' + selectedSlip.slip_no" class="btn btn-ghost btn-sm" style="flex:1;justify-content:center">編輯</a>
            <button class="btn btn-primary btn-sm" style="flex:1" @click="previewPdf(selectedSlip)">預覽 PDF</button>
          </div>
          <div style="display:flex;gap:8px" x-show="selectedSlip.export_count > 0">
            <button class="btn btn-ghost btn-sm" style="flex:1" @click="openHistory(selectedSlip)">匯出歷史</button>
          </div>
          <button x-show="selectedSlip.status !== '已匯出'"
                  class="btn btn-danger btn-sm"
                  style="width:100%;justify-content:center"
                  @click="del(selectedSlip)">刪除勞報單</button>
        </div>
      </div>
    </div>
  </template>
</div>

<!-- ══ PDF 預覽 Modal ══ -->
<div x-show="previewModal" x-cloak class="pv-overlay" @keydown.escape.window="closePreview()">
  <div class="pv-modal" @click.stop>
    <div class="pv-head">
      <div>
        <div class="pv-title">勞報單 PDF 預覽</div>
        <div class="pv-sub" x-show="previewItem"
             x-text="(previewItem?.slip_no || '') + (previewItem?.contractor_name ? '　' + previewItem.contractor_name : '')"></div>
      </div>
      <button class="pv-close" @click="closePreview()">×</button>
    </div>
    <div class="pv-body">
      <div class="pv-spinner" x-show="previewFetching || !previewIframeReady">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
        </svg>
        <span x-text="previewFetching ? 'PDF 產生中，請稍候…' : '載入中…'"></span>
      </div>
      <iframe x-show="previewBlobUrl" :src="previewBlobUrl" class="pv-iframe"
              @load="previewIframeReady = true"></iframe>
    </div>
    <div class="pv-foot">
      <div x-show="!previewArchiveMode" style="font-size:11px;color:var(--text-dim)">
        <span x-show="!previewItem?.export_count">尚未匯出</span>
        <span x-show="previewItem?.export_count > 0">
          已匯出 <strong x-text="previewItem?.export_count"></strong> 次
        </span>
      </div>
      <div x-show="previewArchiveMode" style="font-size:11px;color:var(--text-dim)">
        調閱第 <strong x-text="previewArchiveIdx"></strong> 次存檔 PDF
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" @click="closePreview()">關閉</button>
        <button x-show="!previewArchiveMode" class="btn btn-primary"
                @click="confirmExport()" :disabled="previewFetching || !previewIframeReady">
          確認匯出（下載 PDF）
        </button>
        <button x-show="previewArchiveMode" class="btn btn-primary"
                @click="downloadArchivePreview()" :disabled="!previewBlobUrl">
          下載此存檔
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ══ 匯出歷史 Modal ══ -->
<div x-show="histModal" x-cloak class="pv-overlay" @keydown.escape.window="histModal=false">
  <div class="pv-modal" style="max-width:680px;height:auto;max-height:85vh" @click.stop>
    <div class="pv-head">
      <div>
        <div class="pv-title">匯出紀錄</div>
        <div class="pv-sub" x-show="histItem"
             x-text="(histItem?.slip_no||'') + (histItem?.contractor_name ? '　'+histItem.contractor_name : '') + '　共 ' + histLog.length + ' 次'"></div>
      </div>
      <button class="pv-close" @click="histModal=false">×</button>
    </div>
    <div style="overflow-y:auto;padding:0 20px">
      <div x-show="histLoading" style="text-align:center;padding:40px;color:var(--text-dim)">載入中…</div>
      <div x-show="!histLoading && histLog.length === 0"
           style="text-align:center;padding:40px;color:var(--text-dim)">尚無匯出記錄</div>
      <template x-for="(log, i) in histLog" :key="i">
        <div style="display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-light)">
          <div :style="log.redownload_of
                ? 'width:36px;height:36px;border-radius:50%;background:#f0f4ff;border:1px solid #c7d7ff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#4f6ef7;flex-shrink:0'
                : 'width:36px;height:36px;border-radius:50%;background:var(--bg-secondary);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text-secondary);flex-shrink:0'"
               x-text="log.idx || (i+1)"></div>
          <div>
            <div style="display:flex;align-items:center;gap:6px">
              <span style="font-size:13px;font-weight:600;color:var(--text-main)" x-text="log.by || '—'"></span>
              <span x-show="log.redownload_of"
                    style="font-size:10px;padding:1px 5px;border-radius:4px;background:#e8edff;color:#4f6ef7;border:1px solid #c7d7ff">
                調閱 #<span x-text="log.redownload_of"></span>
              </span>
            </div>
            <div style="font-size:11px;font-family:LINE Seed TW_OTF, monospace;color:var(--text-dim);margin-top:2px"
                 x-text="(log.at||'').replace('T',' ').slice(0,19)"></div>
          </div>
          <div style="display:flex;gap:8px;flex-shrink:0">
            <button class="btn btn-ghost btn-sm" @click="previewArchivePdf(histItem, log, i)">預覽存檔</button>
            <button class="btn btn-primary btn-sm" :disabled="downloading"
                    @click="downloadArchivePdf(histItem, log, i)">
              <span x-text="downloading ? '下載中…' : '下載存檔'"></span>
            </button>
          </div>
        </div>
      </template>
    </div>
    <div class="pv-foot" style="justify-content:space-between;align-items:center">
      <div style="font-size:11px;color:var(--text-dim)">
        ＊「下載存檔」讀取存檔當時之 PDF；「新增匯出」以當前資料重新產生並計次
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" @click="histModal=false">關閉</button>
        <button class="btn btn-primary" @click="histModal=false; previewPdf(histItem)">新增匯出</button>
      </div>
    </div>
  </div>
</div>

<script src="../static/notif.js"></script>
<script src="../static/sidebar.js"></script>
<script>
const API = '/api'
function payslipsPage() {
  return {
    session: {},
    items: [],
    total: 0,
    loading: false,
    filterMonth: '',
    searchQ: '',
    selectedId: null,
    selectedSlip: null,
    previewModal: false,
    previewBlobUrl: '',
    previewFetching: false,
    previewIframeReady: false,
    previewItem: null,
    previewArchiveMode: false,
    previewArchiveIdx: null,
    _previewArchiveP: null,
    histModal: false,
    histItem: null,
    histLog: [],
    histLoading: false,
    downloading: false,

    get filteredItems() {
      if (!this.searchQ) return this.items
      const q = this.searchQ.toLowerCase()
      return this.items.filter(p => (p.contractor_name || '').toLowerCase().includes(q))
    },

    async init() {
      const s = localStorage.getItem('motrix_session')
      if (!s) { window.location.href = 'login.html'; return }
      this.session = JSON.parse(s)
      const mods = this.session.modules || []
      if (this.session.role !== 'superadmin' && !mods.includes('payslip')) {
        alert('此頁面僅限最高權限使用者或具有「勞報單」模組授權的使用者存取'); window.history.back(); return
      }
      await this.load()
    },

    async load() {
      this.loading = true
      try {
        const params = new URLSearchParams({ limit: 500 })
        if (this.filterMonth) params.set('month', this.filterMonth.replace('-', ''))
        const r = await fetch(`${API}/payslips?${params}`, {
          headers: { Authorization: 'Bearer ' + this.session.token }
        })
        if (r.ok) {
          const d = await r.json()
          this.items = d.items
          this.total = d.total
          if (this.selectedId) {
            const fresh = this.items.find(p => p.slip_no === this.selectedId)
            if (fresh) this.selectedSlip = { ...fresh }
            else { this.selectedId = null; this.selectedSlip = null }
          }
        }
      } catch(e) {}
      this.loading = false
    },

    selectSlip(p) {
      this.selectedId = p.slip_no
      this.selectedSlip = { ...p }
    },

    async previewPdf(p) {
      this.previewItem = p
      this.previewFetching = true
      this.previewIframeReady = false
      this.previewBlobUrl = ''
      this.previewArchiveMode = false
      this.previewArchiveIdx = null
      this.previewModal = true
      try {
        const r = await fetch(`${API}/payslips/${p.slip_no}/pdf-download`, {
          headers: { Authorization: 'Bearer ' + this.session.token }
        })
        if (!r.ok) { alert('PDF 產生失敗：' + await r.text()); this.closePreview(); return }
        const blob = await r.blob()
        this.previewBlobUrl = URL.createObjectURL(blob)
      } catch(e) { alert('載入失敗：' + e.message); this.closePreview() }
      this.previewFetching = false
    },

    async confirmExport() {
      if (!this.previewBlobUrl || !this.previewItem) return
      const p = this.previewItem
      const a = document.createElement('a')
      a.href = this.previewBlobUrl
      a.download = `勞報單_${p.contractor_name}_${p.slip_date || p.slip_no}.pdf`
      a.click()
      try {
        const r = await fetch(`${API}/payslips/${p.slip_no}/export`, {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + this.session.token }
        })
        if (r.ok) {
          const d = await r.json()
          p.status = '已匯出'
          p.export_count = d.export_count
        }
      } catch(e) {}
      this.closePreview()
      await this.load()
    },

    closePreview() {
      if (this.previewBlobUrl) { URL.revokeObjectURL(this.previewBlobUrl); this.previewBlobUrl = '' }
      this.previewModal = false
      this.previewItem = null
      this.previewFetching = false
      this.previewIframeReady = false
      this.previewArchiveMode = false
      this.previewArchiveIdx = null
      this._previewArchiveP = null
    },

    async previewArchivePdf(p, log, i) {
      const idx = log.redownload_of || log.idx || (i + 1)
      this.previewArchiveMode = true
      this.previewArchiveIdx = idx
      this._previewArchiveP = p
      this.histModal = false
      this.previewItem = p
      this.previewFetching = true
      this.previewIframeReady = false
      this.previewBlobUrl = ''
      this.previewModal = true
      try {
        const r = await fetch(`${API}/payslips/${p.slip_no}/archive/${idx}`, {
          headers: { Authorization: 'Bearer ' + this.session.token }
        })
        if (!r.ok) { alert('PDF 載入失敗：' + await r.text()); this.closePreview(); return }
        const blob = await r.blob()
        this.previewBlobUrl = URL.createObjectURL(blob)
      } catch(e) { alert('載入失敗：' + e.message); this.closePreview() }
      this.previewFetching = false
    },

    async downloadArchivePreview() {
      if (!this.previewBlobUrl || !this._previewArchiveP) return
      const p = this._previewArchiveP
      const idx = this.previewArchiveIdx
      const a = document.createElement('a')
      a.href = this.previewBlobUrl
      a.download = `勞報單_${p.contractor_name||p.slip_no}_${p.slip_date||p.slip_no}_第${idx}次.pdf`
      a.click()
      try {
        const r = await fetch(`${API}/payslips/${p.slip_no}/archive/${idx}/record`, {
          method: 'POST', headers: { Authorization: 'Bearer ' + this.session.token }
        })
        if (r.ok) { const d = await r.json(); p.export_count = d.export_count }
      } catch(e) {}
    },

    async downloadArchivePdf(p, log, i) {
      if (this.downloading) return
      this.downloading = true
      const effective_idx = log.redownload_of || log.idx || (i + 1)
      try {
        const r = await fetch(`${API}/payslips/${p.slip_no}/archive/${effective_idx}`, {
          headers: { Authorization: 'Bearer ' + this.session.token }
        })
        if (!r.ok) { alert('PDF 下載失敗：' + await r.text()); this.downloading = false; return }
        const blob = await r.blob()
        const url = URL.createObjectURL(blob)
        const a = document.createElement('a')
        a.href = url
        a.download = `勞報單_${p.contractor_name||p.slip_no}_${p.slip_date||p.slip_no}_第${effective_idx}次.pdf`
        a.click()
        setTimeout(() => URL.revokeObjectURL(url), 2000)
        const rr = await fetch(`${API}/payslips/${p.slip_no}/archive/${effective_idx}/record`, {
          method: 'POST', headers: { Authorization: 'Bearer ' + this.session.token }
        })
        if (rr.ok) {
          const d = await rr.json()
          p.export_count = d.export_count
          const fr = await fetch(`${API}/payslips/${p.slip_no}`, {
            headers: { Authorization: 'Bearer ' + this.session.token }
          })
          if (fr.ok) { const fd = await fr.json(); this.histLog = JSON.parse(fd.export_log || '[]') }
        }
      } catch(e) { alert('下載失敗：' + e.message) }
      this.downloading = false
    },

    async openHistory(p) {
      this.histItem = p
      this.histLog = []
      this.histLoading = true
      this.histModal = true
      try {
        const r = await fetch(`${API}/payslips/${p.slip_no}`, {
          headers: { Authorization: 'Bearer ' + this.session.token }
        })
        if (r.ok) {
          const d = await r.json()
          this.histLog = JSON.parse(d.export_log || '[]')
        }
      } catch(e) {}
      this.histLoading = false
    },

    async directDownload(p) {
      if (this.downloading) return
      this.downloading = true
      try {
        const r = await fetch(`${API}/payslips/${p.slip_no}/pdf-download`, {
          headers: { Authorization: 'Bearer ' + this.session.token }
        })
        if (!r.ok) { alert('PDF 產生失敗：' + await r.text()); this.downloading = false; return }
        const blob = await r.blob()
        const url = URL.createObjectURL(blob)
        const a = document.createElement('a')
        a.href = url
        a.download = `勞報單_${p.contractor_name||p.slip_no}_${p.slip_date||p.slip_no}.pdf`
        a.click()
        setTimeout(() => URL.revokeObjectURL(url), 2000)
      } catch(e) { alert('下載失敗：' + e.message) }
      this.downloading = false
    },

    async del(p) {
      if (!confirm(`確定刪除勞報單 ${p.slip_no}（${p.contractor_name}）？此操作無法復原。`)) return
      const r = await fetch(`${API}/payslips/${p.slip_no}`, {
        method: 'DELETE',
        headers: { Authorization: 'Bearer ' + this.session.token }
      })
      if (r.ok) {
        if (this.selectedId === p.slip_no) { this.selectedId = null; this.selectedSlip = null }
        await this.load()
      }
      else alert('刪除失敗：' + await r.text())
    }
  }
}
</script>
</body>
</html>
