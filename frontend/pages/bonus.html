<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{if(localStorage.getItem('motrix_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../static/favicon.png">
  <title>獎金分潤 - MOTRIX 專案管理系統</title>
  <script src="../static/ui.js"></script>
  <script src="../js/bonus.js"></script>
  <script src="../static/auth-guard.js"></script>
  <script defer src="../static/vendor/alpine-3.17.1.min.js"></script>
  <link rel="stylesheet" href="../css/style.css?v=20260805g">
  <style>
    [x-cloak]{display:none!important}
    .page-main{margin-left:var(--sidebar-w);margin-top:var(--topbar-h);padding:24px 28px;min-height:calc(calc(100vh / var(--fz,1)) - var(--topbar-h));background:var(--white)}
    .bn-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
    .bn-title{font-size:20px;font-weight:700;font-family:var(--font-zh);color:var(--text-primary)}
    .bn-layout{display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start}
    .bn-list{border:1px solid var(--border-light);border-radius:8px;background:#fff;overflow:hidden}
    .bn-list-tools{padding:10px;border-bottom:1px solid var(--border-light);display:flex;flex-direction:column;gap:8px}
    .bn-tabs{display:flex;flex-wrap:wrap;gap:4px}
    .bn-tab{font-size:11px;padding:3px 8px;border:1px solid var(--border-light);border-radius:10px;background:#fff;cursor:pointer;font-family:var(--font-zh)}
    .bn-tab.on{background:var(--black,#0A0A0A);color:#fff;border-color:transparent}
    .bn-case{padding:10px 12px;border-bottom:1px solid var(--border-light);cursor:pointer}
    .bn-case:hover{background:#FAFAF8}
    .bn-case.selected{background:#EFF6FF}
    .bn-case-no{font-size:12px;font-weight:600;font-family:LINE Seed TW_OTF, sans-serif}
    .bn-case-name{font-size:11px;color:var(--text-secondary);font-family:var(--font-zh);margin-top:2px}
    .bn-badge{display:inline-block;font-size:10px;padding:1px 7px;border-radius:9px;font-family:var(--font-zh);margin-left:6px}
    .st-gray{background:#F3F4F6;color:#6B7280}.st-blue{background:#DBEAFE;color:#1D4ED8}
    .st-amber{background:#FEF3C7;color:#92400E}.st-orange{background:#FFEDD5;color:#C2410C}
    .st-green{background:#DCFCE7;color:#15803D}.st-purple{background:#EDE9FE;color:#6D28D9}
    .bn-card{border:1px solid var(--border-light);border-radius:8px;background:#fff;padding:16px 18px;margin-bottom:14px}
    .bn-sec{font-size:12px;font-weight:700;color:var(--text-secondary);margin:0 0 10px;font-family:var(--font-zh)}
    .bn-kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;font-size:12px;font-family:var(--font-zh)}
    .bn-kv b{display:block;font-size:15px;font-family:LINE Seed TW_OTF, sans-serif;margin-top:2px}
    .bn-cat{border-top:1px dashed var(--border-light);padding-top:10px;margin-top:10px}
    .bn-cat-hd{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;font-family:var(--font-zh)}
    .bn-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px;font-family:var(--font-zh)}
    .bn-row .who{flex:1}
    .bn-row .amt{min-width:100px;text-align:right;font-family:LINE Seed TW_OTF, sans-serif}
    .bn-in{width:70px;padding:4px 6px;border:1px solid var(--border-light);border-radius:4px;font-size:12px;text-align:right}
    .bn-sel{padding:4px 6px;border:1px solid var(--border-light);border-radius:4px;font-size:12px}
    .bn-note{font-size:11px;color:#92400E;font-family:var(--font-zh)}
    .bn-err{font-size:12px;color:var(--danger);font-family:var(--font-zh)}
    .bn-ok{font-size:12px;color:#15803D;font-family:var(--font-zh)}
    .bn-warn{font-size:12px;color:var(--warning);background:var(--warning-light);border:1px solid var(--warning);border-radius:6px;padding:8px 10px;margin:8px 0;font-family:var(--font-zh)}
    .bn-btn{padding:6px 14px;border-radius:6px;border:1px solid transparent;font-size:12px;cursor:pointer;font-family:var(--font-zh);background:var(--black,#0A0A0A);color:#fff}
    .bn-btn--ghost{background:#fff;color:var(--text-primary);border-color:var(--border-light)}
    .bn-btn--danger{background:#fff;color:var(--danger);border-color:#FECACA}
    .bn-btn:disabled{opacity:.5;cursor:not-allowed}
    .bn-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
    .bn-empty{padding:30px;text-align:center;color:var(--text-dim);font-size:12px;font-family:var(--font-zh)}
    .bn-log{font-size:11px;color:var(--text-secondary);font-family:var(--font-zh);line-height:1.8}
    @media (max-width:767px){.page-main{margin-left:0;padding:16px}.bn-layout{grid-template-columns:1fr}}
  </style>
</head>
<body x-data="bonusPage()" x-init="init()" x-cloak>

  <header id="app-topbar" class="topbar"></header>
  <div id="sidebar-root"></div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div>
    <main class="page-main">

      <!-- 模組旗標（BONUS_MODULE_ENABLED，2026-09-24 起出貨預設開；現場可設 =0 關）。
           直接開網址也要看得到這句話，不是只藏側邊欄入口。 -->
      <template x-if="moduleDisabled">
        <div class="bn-card bn-err" style="font-weight:600">此模組暫停使用。請聯絡系統管理員。</div>
      </template>

      <div x-show="!moduleDisabled">
        <div class="bn-head">
          <div class="bn-title">獎金分潤</div>
          <span class="bn-note" x-show="!isSuper">只顯示您在發放名單上、且已核准待發放或已發放的案件，金額只顯示您自己的部分。</span>
          <button class="bn-btn bn-btn--ghost" x-show="isSuper && settings" @click="settingsOpen = !settingsOpen" style="margin-left:auto">預設比例設定</button>
        </div>

        <!-- 全域預設（最高管理者）：比率 10%、業務 50／專案 30／後勤 20，草稿可逐案覆寫 -->
        <!-- x-if 不是 x-show：一般使用者的 settings 是 null，x-show 仍會綁 x-model 而丟例外，整頁畫不出來 -->
        <template x-if="isSuper && settingsOpen && settings">
        <div class="bn-card" data-testid="bn-settings">
          <div class="bn-sec">預設比例（新建草稿時帶入，每案可改）</div>
          <div class="bn-row">獎金比率（淨利的 %）<input class="bn-in" x-model="settings.ratePct"> %</div>
          <template x-for="c in cats" :key="c">
            <div class="bn-row"><span x-text="catLabels[c] + '比例'"></span><input class="bn-in" x-model="settings.split[c]"> %</div>
          </template>
          <div class="bn-actions"><button class="bn-btn" @click="saveSettings()">儲存預設</button></div>
          <!-- `AC3`：傳票科目（不寫死；不存在或已停用的代號存不進去；事後被停用的列在下方） -->
          <template x-if="voucherAccounts">
            <div data-testid="bn-voucher-accounts">
              <div class="bn-sec" style="margin-top:12px">傳票科目（進入待發放、標記已發放時自動開立傳票草稿用）</div>
              <template x-for="k in ['expense', 'payable', 'withholding', 'bank']" :key="k">
                <div class="bn-row">
                  <span x-text="voucherAccounts.labels[k]"></span>
                  <input class="bn-in" style="width:90px" x-model="voucherAcctEdit[k]" :data-testid="'bn-acct-' + k">
                  <span class="bn-err" x-show="voucherAccounts.problems[k]" x-text="voucherAccounts.problems[k]"></span>
                </div>
              </template>
              <div class="bn-actions"><button class="bn-btn" @click="saveVoucherAccounts()" data-testid="bn-acct-save">儲存傳票科目</button></div>
            </div>
          </template>
        </div>
        </template>

        <div class="bn-err" x-show="loadError" x-text="loadError"></div>

        <div class="bn-layout">
          <!-- 左：案件清單 -->
          <div class="bn-list">
            <div class="bn-list-tools">
              <input class="bn-sel" type="search" placeholder="搜尋單號／客戶／專案" x-model="search"
                     @input.debounce.300ms="loadList()" style="width:100%">
              <div class="bn-tabs">
                <button class="bn-tab" :class="{on: statusFilter === ''}" @click="statusFilter = ''; loadList()">全部</button>
                <template x-for="st in statuses" :key="st">
                  <button class="bn-tab" :class="{on: statusFilter === st}" @click="statusFilter = st; loadList()" x-text="st"></button>
                </template>
              </div>
            </div>
            <template x-if="loaded && items.length === 0">
              <div class="bn-empty" x-text="isSuper ? '沒有符合條件的案件' : '目前沒有您的獎金分潤資料'" data-testid="bn-empty"></div>
            </template>
            <template x-for="it in items" :key="it.quote_no">
              <div class="bn-case" :class="{selected: selectedNo === it.quote_no}" :data-quote-no="it.quote_no"
                   @click="select(it.quote_no)">
                <div>
                  <span class="bn-case-no" x-text="it.quote_no"></span>
                  <span class="bn-badge" :class="badgeClass(it.status)" x-text="it.status"></span>
                  <span class="bn-badge st-gray" x-show="it.noBonus">無獎金</span>
                </div>
                <div class="bn-case-name" x-text="(it.customer_name || '') + (it.project_name ? '／' + it.project_name : '')"></div>
                <div class="bn-case-name" x-show="it.myAmount !== undefined" x-text="'我的金額：' + money(it.myAmount)"></div>
              </div>
            </template>
          </div>

          <!-- 右：明細 -->
          <div>
            <div class="bn-card bn-empty" x-show="!selectedNo">請從左側選一個案件</div>
            <div class="bn-card bn-err" x-show="selectedNo && detailError" x-text="detailError"></div>

            <template x-if="detail">
              <div>
                <div class="bn-card">
                  <div class="bn-sec">
                    <span x-text="detail.case.quote_no"></span>
                    <span x-text="'　' + (detail.case.customer_name || '') + (detail.case.project_name ? '／' + detail.case.project_name : '')"></span>
                    <span class="bn-badge" :class="badgeClass(detail.status)" x-text="detail.status" data-testid="bn-status"></span>
                  </div>

                  <!-- 還沒有草稿（最高管理者） -->
                  <template x-if="!detail.award">
                    <div>
                      <div class="bn-kv">
                        <div>精算淨利<b x-text="detail.netProfit === null || detail.netProfit === undefined ? '—' : money(detail.netProfit)"></b></div>
                        <div>預設比率<b x-text="pct(detail.defaults.rate_bp) + '%'"></b></div>
                        <div>預設分配<b x-text="cats.map(c => catLabels[c] + ' ' + pct(detail.defaults.split_bp[c]) + '%').join('／')"></b></div>
                      </div>
                      <div class="bn-err" style="margin-top:10px" x-show="!detail.canCreate" x-text="detail.reason"></div>
                      <template x-if="detail.canCreate">
                        <div>
                          <template x-for="c in cats" :key="c">
                            <div class="bn-cat">
                              <div class="bn-cat-hd" x-text="catLabels[c] + '（自動帶入）'"></div>
                              <template x-for="m in detail.autoMembers[c]" :key="m.username">
                                <div class="bn-row"><span class="who" x-text="userLabel(m.username)"></span></div>
                              </template>
                              <div class="bn-note" x-show="detail.memberNotes[c]" x-text="detail.memberNotes[c]"></div>
                            </div>
                          </template>
                          <div class="bn-actions"><button class="bn-btn" :disabled="busy" @click="createDraft()" data-testid="bn-create">建立草稿</button></div>
                        </div>
                      </template>
                    </div>
                  </template>

                  <!-- 有單據：摘要（最高管理者／出納） -->
                  <template x-if="detail.award && detail.summary">
                    <div class="bn-kv">
                      <div x-show="detail.scope === 'all'">精算淨利<b x-text="money(detail.award.net_profit)"></b></div>
                      <div x-show="detail.scope === 'all'">獎金比率<b x-text="pct(detail.award.rate_bp) + '%'"></b></div>
                      <div x-show="detail.scope === 'all'">獎金池<b x-text="money(detail.summary.poolAmount)" data-testid="bn-pool"></b></div>
                      <div>發放合計<b x-text="money(detail.summary.paidTotal)" data-testid="bn-paid-total"></b></div>
                      <div>尾差（留公司）<b x-text="money(detail.summary.remainder)" data-testid="bn-remainder"></b></div>
                    </div>
                  </template>
                </div>

                <!-- 草稿編輯（最高管理者） -->
                <template x-if="draft">
                  <div class="bn-card" data-testid="bn-draft">
                    <div class="bn-sec" x-text="detail.status === '待審核' ? '修改（簽核中）' : '草稿'"></div>
                    <!-- BN22：簽核中修改會作廢已完成的簽核 -->
                    <div class="bn-warn" x-show="detail.status === '待審核' && signedApprovers().length" data-testid="bn-resign-warn"
                         x-text="'已有 ' + signedApprovers().length + ' 位完成簽核（' + signedApprovers().join('、') + '）；儲存修改會作廢這些簽核，需要重新簽核。'"></div>
                    <!-- BN22 即時重算：與存檔同一個算式（後端 /preview），存檔前就看得到 -->
                    <div class="bn-kv" data-testid="bn-preview">
                      <div>預覽（未存檔）<b x-text="previewPending ? '計算中…' : (preview ? '已更新' : '—')"></b></div>
                      <div>獎金池<b x-text="preview ? money(preview.pool) : '—'" data-testid="bn-preview-pool"></b></div>
                      <div>發放合計<b x-text="preview ? money(preview.paid_total) : '—'" data-testid="bn-preview-paid"></b></div>
                      <div>尾差（留公司）<b x-text="preview ? money(preview.remainder) : '—'" data-testid="bn-preview-remainder"></b></div>
                    </div>
                    <div class="bn-err" x-show="previewError" x-text="previewError" data-testid="bn-preview-error"></div>
                    <div class="bn-row">獎金比率<input class="bn-in" x-model="draft.ratePct" data-testid="bn-rate"> %</div>
                    <template x-for="c in cats" :key="c">
                      <div class="bn-cat">
                        <div class="bn-cat-hd">
                          <span x-text="catLabels[c]"></span>
                          <span>比例 <input class="bn-in" x-model="draft.split[c]" :data-testid="'bn-split-' + c"> %</span>
                          <label style="font-size:11px;font-weight:400"><input type="checkbox" x-model="draft.custom[c]"> 指定個人比例（不勾＝平均）</label>
                          <span style="margin-left:auto;font-weight:400" :data-testid="'bn-cat-amount-' + c"
                                x-text="'類金額合計 ' + (previewCatAmount(c) === null || previewCatAmount(c) === undefined ? '—' : money(previewCatAmount(c)))"></span>
                        </div>
                        <div class="bn-note" x-show="draft.members[c].length === 0">這一類沒有人：金額不發（留公司）</div>
                        <template x-for="(m, i) in draft.members[c]" :key="c + m.username">
                          <div class="bn-row" :data-testid="'bn-line-' + c + '-' + m.username">
                            <span class="who" x-text="userLabel(m.username) + (m.source && m.source.startsWith('group:') ? '（群組）' : m.source === 'manual' ? '' : '（自動）')"></span>
                            <span x-show="draft.custom[c]"><input class="bn-in" x-model="m.pct"> %</span>
                            <span x-show="!draft.custom[c]" style="color:var(--text-dim)">平均</span>
                            <span class="amt" :data-testid="'bn-amt-' + c + '-' + m.username"
                                  x-text="previewAmount(c, m.username) === null ? '—' : money(previewAmount(c, m.username))"></span>
                            <select class="bn-sel" x-model="replacePick[c + ':' + i]" @change="replacePerson(c, i)"
                                    :data-testid="'bn-replace-' + c + '-' + m.username" style="width:110px">
                              <option value="">換人…</option>
                              <template x-for="u in users" :key="u.username"><option :value="u.username" x-text="(u.displayName || u.username) + '（' + u.username + '）'"></option></template>
                            </select>
                            <button class="bn-btn bn-btn--danger" @click="removePerson(c, i)" :data-testid="'bn-remove-' + c + '-' + m.username">移除</button>
                          </div>
                        </template>
                        <div class="bn-row">
                          <select class="bn-sel" x-model="addPick[c]" :data-testid="'bn-add-' + c">
                            <option value="">＋ 加人…</option>
                            <template x-for="u in users" :key="u.username"><option :value="u.username" x-text="(u.displayName || u.username) + '（' + u.username + '）'"></option></template>
                          </select>
                          <button class="bn-btn bn-btn--ghost" @click="addPerson(c)">加入</button>
                          <select class="bn-sel" x-model="addGroup[c]" x-show="groups.length">
                            <option value="">＋ 加群組…</option>
                            <template x-for="g in groups" :key="g.id"><option :value="g.id" x-text="g.name"></option></template>
                          </select>
                          <button class="bn-btn bn-btn--ghost" x-show="groups.length" @click="addGroupMembers(c)">加入群組</button>
                        </div>
                      </div>
                    </template>
                    <div class="bn-actions">
                      <button class="bn-btn bn-btn--ghost" :disabled="!!(busy || previewError)" @click="saveDraft()" data-testid="bn-save">儲存</button>
                      <button class="bn-btn" x-show="detail.status === '草稿'" :disabled="!!(busy || previewError)" @click="submitDraft()" data-testid="bn-submit">送審</button>
                      <button class="bn-btn bn-btn--ghost" x-show="detail.status === '待審核'" :disabled="busy" @click="cancelEdit()" data-testid="bn-cancel-edit">取消修改</button>
                    </div>
                  </div>
                </template>

                <!-- 非草稿：明細（最高管理者／出納看整張，名單上的人只有自己） -->
                <template x-if="detail.award && !draft">
                  <div class="bn-card">
                    <div class="bn-sec" x-text="detail.scope === 'self' ? '我的獎金' : '發放明細'"></div>
                    <template x-for="c in cats" :key="c">
                      <div class="bn-cat" x-show="linesOf(c).length || detail.scope !== 'self'">
                        <div class="bn-cat-hd"><span x-text="catLabels[c]"></span>
                          <span x-show="detail.scope === 'all'" style="font-weight:400" x-text="pct((detail.award.split_bp || {})[c]) + '%'"></span></div>
                        <div class="bn-note" x-show="!linesOf(c).length && detail.scope !== 'self'">這一類沒有人：金額不發（留公司）</div>
                        <template x-for="l in linesOf(c)" :key="l.id">
                          <div class="bn-row" :data-testid="'bn-view-' + c + '-' + l.username">
                            <span class="who" x-text="userLabel(l.username) || l.display_name_snapshot"></span>
                            <span x-show="detail.scope !== 'cashier'" style="color:var(--text-dim)"
                                  x-text="l.person_bp === null || l.person_bp === undefined ? '平均' : pct(l.person_bp) + '%'"></span>
                            <span class="amt" x-text="money(l.amount)"></span>
                          </div>
                        </template>
                      </div>
                    </template>
                    <div class="bn-ok" x-show="detail.award.paid_at" x-text="'已發放：' + (detail.award.paid_at || '').slice(0, 10)"></div>

                    <div class="bn-actions">
                      <!-- 簽核（簽核人只能是最高管理者） -->
                      <template x-if="isSuper && detail.status === '待審核'">
                        <div class="bn-actions" style="margin-top:0">
                          <button class="bn-btn bn-btn--ghost" x-show="canEdit()" :disabled="busy" @click="startEdit()" data-testid="bn-edit">修改</button>
                          <button class="bn-btn" :disabled="busy" @click="approve()" data-testid="bn-approve">核准</button>
                          <input class="bn-sel" placeholder="駁回原因" x-model="rejectReason" style="width:180px">
                          <button class="bn-btn bn-btn--danger" :disabled="busy" @click="reject()">駁回</button>
                        </div>
                      </template>
                      <!-- 出納標記已發放 -->
                      <template x-if="detail.status === '待發放' && (isSuper || detail.scope === 'cashier')">
                        <div class="bn-actions" style="margin-top:0" x-init="loadBankAccounts()">
                          <!-- `AC3`：付款銀行（支出傳票草稿的貸方科目）；不選 ⇒ 用獎金設定的銀行科目 -->
                          <select class="bn-sel" x-model="payBank" data-testid="bn-pay-bank">
                            <option value="">（獎金設定的銀行科目）</option>
                            <template x-for="b in bankAccounts" :key="b.acctCode">
                              <option :value="b.acctCode" x-text="b.name + '（' + b.acctCode + '）'"></option>
                            </template>
                          </select>
                          <button class="bn-btn" :disabled="busy" @click="markPaid()" data-testid="bn-mark-paid">標記已發放</button>
                        </div>
                      </template>
                      <!-- 最高管理者退回（已發放前） -->
                      <template x-if="isSuper && (detail.status === '待審核' || detail.status === '待發放')">
                        <div class="bn-actions" style="margin-top:0">
                          <input class="bn-sel" placeholder="退回原因" x-model="returnReason" style="width:180px" data-testid="bn-return-reason">
                          <button class="bn-btn bn-btn--danger" :disabled="busy" @click="returnToDraft()" data-testid="bn-return">退回草稿</button>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>

                <div class="bn-card" x-show="msg"><span :class="/失敗|錯誤|請|不|只有/.test(msg) ? 'bn-err' : 'bn-ok'" x-text="msg" data-testid="bn-msg"></span></div>

                <!-- `AC3`：這張獎金分潤產生的傳票草稿（後端只回給最高管理者／出納） -->
                <template x-if="(detail.vouchers || []).length">
                  <div class="bn-card" data-testid="bn-vouchers">
                    <div class="bn-sec">已產生的傳票</div>
                    <template x-for="v in detail.vouchers" :key="v.id">
                      <div class="bn-row">
                        <span x-text="voucherKindLabel(v.kind)"></span>
                        <a :href="'voucher.html?id=' + v.id" x-text="v.voucher_no" style="color:var(--accent);text-decoration:underline"></a>
                        <span x-text="v.voided ? '已作廢' : v.status"></span>
                      </div>
                    </template>
                  </div>
                </template>

                <template x-if="detail.log && detail.log.length">
                  <div class="bn-card">
                    <div class="bn-sec">編寫紀錄（長期保存，不可刪改）</div>
                    <template x-for="(g, i) in detail.log" :key="i">
                      <div class="bn-log" :data-testid="'bn-log-' + g.action"
                           x-text="(g.changed_at || '').replace('T', ' ').slice(0, 16) + '　' + g.changed_by + '　' + logLabel(g.action) + (logDetail(g) ? '：' + logDetail(g) : '')"></div>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- ⚠️ `notif.js` 必須與 `sidebar.js` 成對出現：`sidebar.js` 無條件輸出
       `globalSearchStore()` 與 `notifStore()`，而那兩支定義在 `notif.js` 裡。 -->
  <script src="../static/notif.js"></script>
  <script src="../static/sidebar.js"></script>
</body>
</html>
