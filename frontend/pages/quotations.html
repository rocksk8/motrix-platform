<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{if(localStorage.getItem('motrix_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../static/favicon.png">
  <title>報價單管理 — MOTRIX 專案管理系統</title>
  <script src="../static/auth-guard.js"></script>
  <script defer src="../static/vendor/alpine-3.17.1.min.js"></script>
  <script src="../static/vendor/sortable-1.15.3.min.js"></script>
  <link rel="stylesheet" href="../css/style.css?v=20260805g">
  <style>
    /* ── 生命週期泳道（2026-09-14，比照簽核佇列的跑道）──────────────────
       原本 9 個分頁是互斥的：一次只能看一個階段，看不到整條線的形狀，
       「有 12 張草稿放著沒送審」這種事得自己一個一個分頁點過去數。
       改成在「全部」時把列表依生命週期分段，並在每列左緣留一條狀態脊。 */
    tr.ql-row > td:first-child { box-shadow: inset 3px 0 0 var(--ql-spine, transparent); }
    tr.ql-lane > td {
      background: var(--icon-btn-bg);
      padding: 5px 10px !important;
      border-bottom: 1px solid var(--border-light);
    }
    .ql-lane__in { display: flex; align-items: center; gap: 8px; }
    .ql-lane__t { font-size: 11px; font-weight: 700; letter-spacing: .06em; }
    .ql-lane__d { font-size: 11px; color: var(--text-dim); }
    .ql-lane__n {
      margin-left: auto; font-size: 11px; color: var(--text-dim);
      font-family: var(--font-en); font-variant-numeric: tabular-nums;
    }
    /* 壓力帶的段在這一頁是可點的篩選器（共用的 .vm-andon__seg 是純顯示） */
    .ql-phase { border:none; cursor:pointer; text-align:left; font-family:var(--font-zh); }
    .ql-phase:hover { background:var(--icon-btn-bg); }
    .ql-phase.on { outline:2px solid var(--accent); outline-offset:-2px; }
    .ql-age {
      display: block; margin-top: 2px; font-size: 10px;
      font-family: var(--font-en); font-variant-numeric: tabular-nums;
    }
    .filter-tabs { display:flex; gap:2px; background:#F0EEE9; padding:3px; border-radius:8px; margin-bottom:20px; }
    .filter-tab  { padding:6px 14px; border-radius:6px; font-size:12px; cursor:pointer; transition:all .12s; border:none; background:transparent; color:var(--text-secondary); font-family:var(--font-zh); }
    .filter-tab.active { background:#fff; color:var(--text-primary); font-weight:600; box-shadow:var(--shadow-sm); }
    .search-bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
    .search-bar .search-input { min-width:140px; }
    .filter-tabs { overflow-x:auto; -webkit-overflow-scrolling:touch; white-space:nowrap; }
    .filter-tab  { white-space:nowrap; }
    .summary-row { flex-wrap:wrap; gap:16px; }
    .search-input { flex:1; padding:8px 14px; border:1px solid var(--border-light); border-radius:var(--radius); font-size:13px; font-family:var(--font-zh); background:#fff; outline:none; color:var(--text-primary); }
    .search-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,.08); }
    .action-btn { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:var(--radius); font-size:12px; font-family:var(--font-zh); cursor:pointer; border:none; transition:all .12s; }
    .action-btn--primary { background:var(--accent); color:#fff; }
    .action-btn--primary:hover { background:var(--accent-hover); }
    .action-btn--ghost { background:#fff; color:var(--text-secondary); border:1px solid var(--border-light); }
    .action-btn--ghost:hover { border-color:#C8C4BC; }
    .row-actions { display:flex; gap:4px; opacity:0; transition:opacity .12s; }
    tr:hover .row-actions { opacity:1; }
    .drag-handle { cursor: grab; color: var(--text-secondary); opacity: .55; transition: opacity .1s, background .1s; display:inline-flex; align-items:center; justify-content:center; padding: 4px; border-radius: 4px; }
    .drag-handle:hover { opacity: 1; background: #EEECEA; }
    tr:hover .drag-handle { opacity: .85; }
    .drag-handle:active { cursor: grabbing; }
    .sortable-ghost td { background: var(--accent-light) !important; opacity: .5; }
    .sortable-chosen { box-shadow: 0 2px 16px rgba(0,0,0,.12); }
    .summary-row { display:flex; gap:24px; margin-bottom:20px; padding:14px 20px; background:#fff; border:1px solid var(--border-light); border-radius:var(--radius-lg); }
    .summary-item { display:flex; flex-direction:column; gap:2px; }
    .summary-item__label { font-size:10px; font-family:var(--font-en); letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); }
    .summary-item__val { font-family:var(--font-en); font-size:18px; font-weight:700; color:var(--text-primary); }
    .offline-banner { background:#FEF3C7; border:1px solid #FDE68A; border-radius:var(--radius); padding:8px 14px; margin-bottom:14px; font-size:12px; color:#92400E; display:flex; align-items:center; gap:8px; }
    /* View switcher */
    .view-switch { display:flex; gap:2px; background:#F0EEE9; padding:3px; border-radius:8px; margin-bottom:20px; width:fit-content; }
    .view-switch__btn { padding:6px 16px; border-radius:6px; font-size:12px; cursor:pointer; border:none; background:transparent; color:var(--text-secondary); font-family:var(--font-zh); transition:all .12s; display:flex; align-items:center; gap:5px; }
    .view-switch__btn.active { background:#fff; color:var(--text-primary); font-weight:600; box-shadow:var(--shadow-sm); }
  </style>
</head>
<body x-data="quotationList()" x-init="init()">

    <header id="app-topbar" class="topbar"></header>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- SIDEBAR -->

  <aside class="sidebar" id="app-sidebar"></aside>

  <main class="main">
    <div class="page-header">
      <div>
        <div class="page-header__title">報價單管理</div>
        <div class="page-header__sub" x-text="'MQ 系列 · 共 ' + quotes.length + ' 筆紀錄'"></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <span style="font-size:11px;padding:3px 8px;border-radius:4px;font-family:LINE Seed TW_OTF, sans-serif"
              :style="backendOnline ? 'background:#F0FDF4;color:#15803D' : 'background:#FEF2F2;color:#DC2626'"
              x-text="backendOnline ? '● DB 已連線' : '○ 後端離線'"></span>
        <a href="quotation-form.html" class="action-btn action-btn--primary" style="text-decoration:none">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v16m8-8H4"/></svg>
          新增報價單
        </a>
      </div>
    </div>

    <!-- 後端離線提示（loading 期間不顯示，避免頁面載入瞬間的誤報閃現） -->
    <div class="offline-banner" x-show="!backendOnline && !loading" x-cloak>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
      後端未啟動，目前顯示本機草稿。請執行 backend/start.bat 以啟用完整功能。
    </div>

    <!-- View switcher -->
    <div class="view-switch">
      <div class="view-switch__btn active">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414A1 1 0 0119 9.414V19a2 2 0 01-2 2z"/></svg>
        報價單列表
      </div>
      <a href="approval-queue.html" class="view-switch__btn" style="text-decoration:none">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        前往簽核佇列
        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="opacity:.5"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>
      </a>
    </div>

    <!-- ═══ 報價單列表 ═══ -->
    <div>

    <!-- 快速摘要（動態） -->
    <div class="summary-row">
      <div class="summary-item">
        <div class="summary-item__label">本月報價</div>
        <div class="summary-item__val" x-text="summaryData.thisMonth + ' 張'"></div>
      </div>
      <div class="summary-item" style="border-left:1px solid var(--border-light);padding-left:24px">
        <div class="summary-item__label" title="依成案標記計算：本月報價中標記為「已成案」或「已結案」的合計金額">本月金額（已成案）</div>
        <div class="summary-item__val" x-text="'NT$ ' + summaryData.thisMonthTotal.toLocaleString()"></div>
      </div>
      <div class="summary-item" style="border-left:1px solid var(--border-light);padding-left:24px">
        <div class="summary-item__label">待審核</div>
        <div class="summary-item__val" :style="summaryData.pending > 0 ? 'color:var(--warning)' : ''" x-text="summaryData.pending + ' 張'"></div>
      </div>
      <div class="summary-item" style="border-left:1px solid var(--border-light);padding-left:24px">
        <div class="summary-item__label" title="依報價單狀態計算：狀態為「已確認」的張數（與成案標記無關）">已確認</div>
        <div class="summary-item__val" style="color:var(--success)" x-text="summaryData.confirmed + ' 張'"></div>
      </div>
      <div class="summary-item" style="border-left:1px solid var(--border-light);padding-left:24px">
        <div class="summary-item__label">平均毛利率</div>
        <div class="summary-item__val" x-text="summaryData.avgMargin + '%'"></div>
      </div>
    </div>

    <!-- 搜尋 + 篩選 -->
    <div class="search-bar">
      <input class="search-input" type="text" placeholder="搜尋報價單號、客戶名稱、案件名稱…"
             x-model="search" style="max-width:380px">
      <select class="search-input" x-model="filterSales" style="max-width:140px;cursor:pointer"
              x-show="['superadmin','admin'].includes(session.role)">
        <option value="">所有填單人</option>
        <template x-for="s in salesOptions" :key="s">
          <option :value="s" x-text="s"></option>
        </template>
      </select>
      <select class="search-input" x-model="filterMonth" style="max-width:140px;cursor:pointer">
        <option value="">所有月份</option>
        <template x-for="m in monthOptions" :key="m">
          <option :value="m" x-text="m"></option>
        </template>
      </select>
      <select class="search-input" x-model="filterDealTag" style="max-width:140px;cursor:pointer">
        <option value="">所有案件進度</option>
        <option value="未提供">未提供</option>
        <option value="已提供">已提供</option>
        <option value="未成案">未成案</option>
        <option value="已成案">已成案</option>
        <option value="已結案">已結案</option>
      </select>
      <select class="search-input" style="max-width:150px;cursor:pointer"
              :value="sortPref.sortMode" @change="setSortMode($event.target.value)">
        <option value="">排序：預設</option>
        <option value="quote_date">排序：報價日期</option>
        <option value="total">排序：金額</option>
        <option value="customer_name">排序：客戶名稱</option>
        <option value="custom">排序：自訂（可拖曳）</option>
      </select>
      <button class="action-btn action-btn--ghost" x-show="sortPref.sortMode && sortPref.sortMode !== 'custom'"
              @click="toggleSortDir()" title="切換正序/倒序">
        <span x-text="sortPref.sortDir === 'asc' ? '↑ 由小到大' : '↓ 由大到小'"></span>
      </button>
    </div>

    <!-- ── 生命週期壓力帶（2026-09-14，比照簽核佇列的跑道）────────────────
         原本 9 個分頁是互斥的：一次只能看一個階段，看不到整條線的形狀，
         「有幾張草稿放著沒送審」得自己一個一個分頁點過去數。
         四段＝草稿→送審中→已送出→已結束，點任一段就篩。 -->
    <div class="vm-andon" style="margin-bottom:14px" x-show="!loading && quotes.length > 0" x-cloak>
      <template x-for="ph in LIFECYCLES" :key="ph.key">
        <button type="button" class="vm-andon__seg ql-phase"
                :class="{ on: phaseFilter === ph.key }"
                @click="phaseFilter = (phaseFilter === ph.key ? '' : ph.key); activeTab = 'all'">
          <span class="vm-andon__val" :style="'color:' + ph.color" x-text="phaseCount(ph.key)"></span>
          <span class="vm-andon__lbl">
            <span x-text="ph.label"></span>
            <small x-text="ph.desc"></small>
          </span>
        </button>
      </template>
      <div class="vm-andon__bar">
        <span class="vm-andon__track"
              :title="LIFECYCLES.map(ph => ph.label + ' ' + phaseCount(ph.key) + ' 件').join('／')">
          <template x-for="ph in LIFECYCLES" :key="ph.key">
            <i :style="'width:' + phasePct(ph.key) + '%;background:' + ph.color"></i>
          </template>
        </span>
      </div>
    </div>

    <div class="filter-tabs">
      <template x-for="tab in tabs" :key="tab.key">
        <button class="filter-tab" :class="{active: activeTab === tab.key}" :title="tab.title || ''" @click="activeTab = tab.key; phaseFilter = ''">
          <span x-text="tab.label"></span>
          <span x-show="tabCount(tab.key) > 0" style="margin-left:4px;font-size:10px;color:var(--text-dim)" x-text="'(' + tabCount(tab.key) + ')'"></span>
        </button>
      </template>
    </div>

    <!-- 報價單列表 -->
    <div class="panel">
      <div class="table-scroll">
      <table class="data-table">
        <thead>
          <tr>
            <th x-show="sortPref.sortMode === 'custom'" style="width:24px"></th>
            <th>報價單號</th>
            <th>客戶名稱</th>
            <th>案件名稱</th>
            <th style="text-align:right">金額（含稅）</th>
            <th style="text-align:right">毛利率</th>
            <th>有效天數</th>
            <th>填單人</th>
            <th>狀態</th>
            <th>案件進度</th>
            <th>報價日期</th>
            <th>操作</th>
          </tr>
        </thead>
        <template x-for="lane in displayLanes" :key="lane.key">
        <tbody x-ref="quotesTbody">
          <tr class="ql-lane" x-show="lane.header">
            <td colspan="12">
              <div class="ql-lane__in">
                <span class="ql-lane__t" :style="'color:' + lane.color" x-text="lane.label"></span>
                <span class="ql-lane__d" x-text="lane.desc"></span>
                <span class="ql-lane__n" x-text="lane.items.length + ' 件'"></span>
              </div>
            </td>
          </tr>
          <template x-for="q in lane.items" :key="q.quote_no">
            <tr class="ql-row" :data-quote-no="q.quote_no" :style="'--ql-spine:' + lane.color">
              <td x-show="sortPref.sortMode === 'custom'" class="drag-handle" style="cursor:grab;text-align:center;color:var(--text-dim)">⠿</td>
              <td>
                <div style="display:flex;align-items:center;gap:6px">
                  <a :href="'quotation-form.html?id=' + q.quote_no"
                     style="font-family:LINE Seed TW_OTF, sans-serif;font-size:12px;font-weight:600;color:var(--accent);text-decoration:none"
                     x-text="q.quote_no"></a>
                  <template x-if="/\-R\d+$/.test(q.quote_no)">
                    <span style="font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;background:#FED7AA;color:#7C2D12;letter-spacing:.03em;flex-shrink:0">改版</span>
                  </template>
                </div>
                <template x-if="q.edit_count > 0">
                  <div style="display:inline-flex;align-items:center;gap:4px;margin-top:3px;padding:2px 6px;border-radius:3px;background:#FEF3C7;border:1px solid #FDE68A;font-size:10px;font-family:LINE Seed TW_OTF, sans-serif;color:#92400E;max-width:220px;overflow:hidden">
                    <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#92400E" stroke-width="2.5" style="flex-shrink:0"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                    <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1"
                          x-text="q.edit_last ? (q.edit_last.byDisplay + ' · ' + fmtEditAt(q.edit_last.at)) : '已修改 ' + q.edit_count + ' 次'"></span>
                    <span style="flex-shrink:0;padding:1px 5px;border-radius:2px;background:#FDE68A;font-weight:700;font-size:9px;white-space:nowrap"
                          x-text="q.edit_last ? editTypeLabel(q.edit_last.type) : ''"></span>
                  </div>
                </template>
              </td>
              <td>
                <div style="font-weight:500;font-size:12px" x-text="q.customer_name || '—'"></div>
              </td>
              <td style="font-size:12px;max-width:180px" x-text="q.project_name || '—'"></td>
              <td class="num" style="font-weight:600" x-text="q.total > 0 ? 'NT$ ' + Math.round(q.total).toLocaleString() : '—'"></td>
              <td class="num">
                <span :style="q.direct_margin_pct < 30 ? 'color:var(--danger);font-weight:600' : q.direct_margin_pct < 35 ? 'color:var(--warning);font-weight:600' : 'color:var(--success);font-weight:600'"
                      x-text="q.direct_margin_pct ? q.direct_margin_pct.toFixed(1) + '%' : '—'"></span>
              </td>
              <td style="font-family:LINE Seed TW_OTF, sans-serif;font-size:11px">
                <span x-text="(q.valid_days || 30) + ' 天'"></span>
                <span x-show="q.valid_days > 30" style="color:var(--danger);font-size:9px;font-weight:600;display:block">需審核</span>
              </td>
              <td style="font-size:12px;color:var(--text-secondary)" x-text="q.sales_person || '—'"></td>
              <td>
                <span class="badge" :class="dealDisplayStatus(q).cls" x-text="dealDisplayStatus(q).text"></span>
                <template x-if="agingOf(q)">
                  <span class="ql-age" :class="agingOf(q).cls" x-text="agingOf(q).text"></span>
                </template>
              </td>
              <td>
                <!-- 已成案/已結案：鎖定顯示，不可在此頁修改 -->
                <template x-if="q.deal_tag === '已成案' || q.deal_tag === '已結案'">
                  <span style="display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600"
                        :style="q.deal_tag === '已結案' ? 'background:#EDE9FE;color:#6D28D9;border:1px solid #C4B5FD' : 'background:#DCFCE7;color:#15803D;border:1px solid #86EFAC'">
                    <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                    <span x-text="q.deal_tag"></span>
                  </span>
                </template>
                <template x-if="q.deal_tag !== '已成案' && q.deal_tag !== '已結案'">
                  <select @change="trySetLost(q.quote_no, $event.target.value, q)"
                          :value="q.deal_tag || ''"
                          style="padding:3px 6px;font-size:11px;border:1px solid var(--border-light);border-radius:4px;background:#fff;font-family:var(--font-zh);cursor:pointer;outline:none;max-width:86px;transition:border-color .12s"
                          :style="q.deal_tag==='未成案' ? 'color:#DC2626;border-color:#FCA5A5' : q.deal_tag==='已提供' ? 'color:var(--accent);border-color:#93C5FD' : q.deal_tag==='未提供' ? 'color:#6B7280' : 'color:var(--text-dim)'">
                    <option value="">未標記</option>
                    <option value="未提供">未提供</option>
                    <option value="已提供">已提供</option>
                    <option value="未成案" x-show="['superadmin','admin'].includes(session.role)">未成案</option>
                    <option value="已成案" x-show="['superadmin','admin'].includes(session.role)">已成案</option>
                  </select>
                </template>
              </td>
              <td style="font-family:LINE Seed TW_OTF, sans-serif;font-size:11px;color:var(--text-dim)" x-text="(q.quote_date || q.created_at || '').slice(0,10)"></td>
              <td>
                <div class="row-actions">
                  <a :href="'quotation-form.html?id=' + q.quote_no" class="icon-btn" title="編輯">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                  </a>
                  <button class="icon-btn" title="複製為新報價單" @click.stop="duplicateQuote(q.quote_no)">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                  </button>
                  <template x-if="canDelete && q.status === '草稿'">
                    <button class="icon-btn del" title="刪除（僅草稿可刪）" @click.stop="deleteQuote(q.quote_no)">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    </button>
                  </template>
                </div>
              </td>
            </tr>
          </template>
        </tbody>
        </template>
        <tbody>
          <tr x-show="filtered.length === 0 && !loading && !retrying">
            <td colspan="11" style="text-align:center;padding:40px;color:var(--text-dim)">
              <div style="font-size:32px;opacity:.3;margin-bottom:8px">📄</div>
              <div x-show="!loadErr">尚無報價單紀錄</div>
              <div x-show="loadErr" style="color:var(--danger);font-size:13px">資料載入失敗，請確認後端連線</div>
              <div style="display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap">
                <a href="quotation-form.html" class="action-btn action-btn--primary" style="text-decoration:none;display:inline-flex">新增第一張報價單</a>
                <button class="action-btn" @click="reload()" style="cursor:pointer">
                  <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-right:4px"><path d="M4 4v5h5M20 20v-5h-5"/><path d="M20 9A9 9 0 1 0 4 15"/></svg>
                  重新整理
                </button>
              </div>
            </td>
          </tr>
          <tr x-show="loading || retrying">
            <td colspan="11" style="text-align:center;padding:24px;color:var(--text-dim);font-size:12px">
              <span x-show="loading && !retrying">載入中…</span>
              <span x-show="retrying">資料為空，自動重試中…</span>
            </td>
          </tr>
        </tbody>
      </table>
      </div>
    </div>

    <div style="margin-top:12px;font-size:11px;color:var(--text-dim);font-family:LINE Seed TW_OTF, sans-serif"
         x-text="'共 ' + filtered.length + ' 筆 · 顯示 ' + filtered.length + ' / ' + quotes.length + ' 筆'"></div>

    </div><!-- end view==='list' -->
  </main>

  <!-- 未成案確認 Modal -->
  <div x-show="dealTagLostModal" x-transition:enter="transition ease-out duration-150" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100"
       style="position:fixed;inset:0;z-index:9900;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45)"
       @click.self="cancelLost()" x-cloak>
    <div style="background:#fff;border-radius:10px;padding:28px 28px 22px;width:400px;max-width:92vw;box-shadow:0 12px 40px rgba(0,0,0,.22);position:relative">
      <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:14px">
        <div style="flex-shrink:0;width:36px;height:36px;border-radius:8px;background:#FEE2E2;display:flex;align-items:center;justify-content:center">
          <svg width="18" height="18" fill="none" stroke="#DC2626" stroke-width="2.2" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </div>
        <div>
          <div style="font-size:14px;font-weight:700;color:#111;margin-bottom:3px">確認標記為「未成案」</div>
          <div style="font-size:12px;color:#666;line-height:1.5">
            本案將標記為 <strong style="color:#DC2626">未成案</strong>，案件進度將終止，此操作無法自行撤銷。<br>
            此操作將留下管理員操作紀錄。
          </div>
        </div>
      </div>
      <div style="margin-bottom:18px">
        <label style="font-size:11px;color:#555;font-weight:600;display:block;margin-bottom:5px;letter-spacing:.02em">
          失單原因 <span style="color:#999;font-weight:400">（選填，將附於操作紀錄）</span>
        </label>
        <textarea x-model="dealTagLostReason"
                  placeholder="例：報價偏高、預算凍結、競爭對手得標…"
                  rows="3"
                  style="width:100%;resize:vertical;border:1px solid #D1D5DB;border-radius:6px;padding:8px 10px;font-size:12px;font-family:var(--font-zh);color:#111;outline:none;box-sizing:border-box;transition:border-color .12s"
                  @focus="$el.style.borderColor='#C8102E'" @blur="$el.style.borderColor='#D1D5DB'"></textarea>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button @click="cancelLost()"
                style="padding:7px 20px;font-size:12px;border:1px solid #D1D5DB;border-radius:6px;background:#fff;color:#444;cursor:pointer;font-family:var(--font-zh);transition:background .1s"
                @mouseenter="$el.style.background='#F3F4F6'" @mouseleave="$el.style.background='#fff'">
          取消
        </button>
        <button @click="confirmLost()"
                style="padding:7px 20px;font-size:12px;border:none;border-radius:6px;background:#DC2626;color:#fff;cursor:pointer;font-family:var(--font-zh);font-weight:600;transition:background .1s"
                @mouseenter="$el.style.background='#B91C1C'" @mouseleave="$el.style.background='#DC2626'">
          確認失單
        </button>
      </div>
    </div>
  </div>

  <script>
  const API = '/api'

  function quotationList() {
    return {
      isMobileView: window.innerWidth <= 767,
      session: {},
      backendOnline: false,
      loading: true,
      retrying: false,
      loadErr: false,
      quotes: [],
      search: '',
      activeTab: 'all',
      filterSales: '',
      filterMonth: '',
      filterDealTag: '',
      dealTagLostModal: false,
      dealTagLostInfo: null,
      dealTagLostReason: '',

      sortPref: { sortMode: '', sortDir: 'desc', customOrder: [] },
      _sortable: null,

      // ═══ 生命週期分段（2026-09-14，比照簽核佇列的跑道）═════════════════
      // 原本的 9 個分頁是互斥篩選：一次只能看一個階段，看不到整條線的形狀。
      // 這裡把 status × deal_tag 收斂成四個「人會拿來決定要做什麼」的階段，
      // 壓力帶顯示比例、表格依階段分段，每列左緣留一條該階段的脊。
      // 分頁保留不動——它的粒度比較細（已核准/已送出/已確認分得開）。
      LIFECYCLES: [
        { key: 'draft',  label: '草稿',   desc: '尚未送審',           color: 'var(--text-dim)' },
        { key: 'review', label: '送審中', desc: '簽核流程進行中',      color: 'var(--warning)' },
        { key: 'sent',   label: '已送出', desc: '簽核完成、已對外報價', color: 'var(--success)' },
        { key: 'closed', label: '已結束', desc: '未成案／已結案／取消', color: '#6D28D9' },  // 沿用 badge--settled 既有的紫
      ],
      phaseFilter: '',

      // 判定順序有意義：deal_tag 的終局狀態優先於 status。
      // 一張「已送出」但 deal_tag 是「未成案」的單子，對人來說是結束了，
      // 不是還在報價中——這跟 dealDisplayStatus() 的既有邏輯是同一個口徑。
      lifecycleOf(q) {
        const s = q.status || ''
        const tag = q.deal_tag || ''
        if (tag === '未成案' || tag === '已結案') return 'closed'
        if (s === '已取消' || s === '已拒絕') return 'closed'
        if (s === '草稿') return 'draft'
        if (s === '待審核' || s === '簽核中') return 'review'
        return 'sent'
      },

      // 壓力帶的分母刻意用「除了分頁與階段以外的篩選都套用」的集合——
      // 這樣切分頁不會讓壓力帶跟著縮成一段，它描述的是目前條件下整條線的形狀。
      get pipelineBase() {
        const s = (this.search || '').trim().toLowerCase()
        return this.quotes.filter(q =>
          (!s || (q.quote_no || '').includes(s)
              || (q.customer_name || '').toLowerCase().includes(s)
              || (q.project_name || '').toLowerCase().includes(s))
          && (!this.filterSales || q.sales_person === this.filterSales)
          && (!this.filterMonth || (q.quote_date || q.created_at || '').startsWith(this.filterMonth))
          && (!this.filterDealTag || (q.deal_tag || '') === this.filterDealTag)
        )
      },
      phaseCount(key) { return this.pipelineBase.filter(q => this.lifecycleOf(q) === key).length },
      phasePct(key) {
        const t = this.pipelineBase.length
        return t ? Math.round(this.phaseCount(key) / t * 100) : 0
      },

      // 只有在「全部」分頁、而且不是拖曳自訂排序時才分段。
      // 自訂排序要拖曳，Sortable 綁在單一 tbody 上（initSortable 讀 $refs.quotesTbody），
      // 分成多個 tbody 會讓拖曳跨不過去；分頁已經選定單一階段時分段也沒有意義。
      get useLanes() {
        return this.activeTab === 'all' && this.sortPref.sortMode !== 'custom' && !this.phaseFilter
      },

      get displayLanes() {
        if (!this.useLanes) {
          const only = this.LIFECYCLES.find(p => p.key === this.phaseFilter)
          return [{
            key: 'flat', header: false, items: this.filtered,
            color: only ? only.color : 'transparent',
            label: '', desc: '',
          }]
        }
        return this.LIFECYCLES
          .map(ph => ({ ...ph, header: true, items: this.filtered.filter(q => this.lifecycleOf(q) === ph.key) }))
          .filter(l => l.items.length > 0)
      },

      _daysSince(ts) {
        if (!ts) return null
        const d = new Date(String(ts).replace(' ', 'T'))
        if (isNaN(d)) return null
        return Math.max(0, Math.floor((Date.now() - d.getTime()) / 86400000))
      },

      // 只有草稿與送審中要顯示停留天數——那兩個階段「放著不動」本身就是問題；
      // 已送出之後球在客戶手上，天數不是這一頁該催的事（追蹤有另外的邏輯）。
      // 門檻分開設：草稿放 7/30 天，送審中放 2/4 天（跟簽核佇列同一組門檻，
      // 因為那就是同一件事——等人簽）。
      agingOf(q) {
        const ph = this.lifecycleOf(q)
        if (ph !== 'draft' && ph !== 'review') return null
        const d = this._daysSince(q.updated_at || q.created_at)
        if (d === null) return null
        if (ph === 'draft') {
          return { text: d === 0 ? '今日建立' : d + ' 天未異動',
                   cls: d > 30 ? 'vm-age--stale' : d > 7 ? 'vm-age--warm' : '' }
        }
        return { text: d === 0 ? '今日送審' : '送審 ' + d + ' 天',
                 cls: d >= 4 ? 'vm-age--stale' : d >= 2 ? 'vm-age--warm' : '' }
      },

      tabs: [
        // 2026-09-24：原名「全部(不含未成案)」，但它同時也藏了「已結案」——名稱與內容不符
        { key: 'all',    label: '進行中',
          title: '不含「未成案」與「已結案」。\n分頁上的草稿～已確認是報價單的簽核狀態；\n已結案、未成案是案件的成案標記，兩者是不同的欄位。' },
        { key: '草稿',   label: '草稿'  },
        { key: '待審核', label: '待審核' },
        { key: '已核准', label: '已核准' },
        { key: '已送出', label: '已送出' },
        { key: '已確認', label: '已確認' },
        { key: '已結案', label: '已結案', isDealTag: true },
        { key: '已取消', label: '已取消' },
        { key: '未成案', label: '未成案', isDealTag: true },
      ],

      get canDelete() {
        return ['superadmin','admin'].includes(this.session.role)
      },

      tabCount(key) {
        if (key === 'all') return this.quotes.filter(q => (q.deal_tag || '') !== '未成案' && (q.deal_tag || '') !== '已結案').length
        const tab = this.tabs.find(t => t.key === key)
        if (tab && tab.isDealTag) return this.quotes.filter(q => q.deal_tag === key).length
        return this.quotes.filter(q => q.status === key).length
      },

      editTypeLabel(type) {
        if (type === 'quote_edit')          return '報價單編輯(解鎖)'
        if (type === 'quote_update')        return '報價單編輯'   // 2026-09-14 新增：一般編輯
        if (type === 'settlement_finalized') return '成本精算(完結)'
        if (type === 'settlement_draft')     return '成本精算'
        return '修改'
      },

      fmtEditAt(at) {
        if (!at) return ''
        const d = new Date(at)
        const mo = String(d.getMonth()+1).padStart(2,'0')
        const da = String(d.getDate()).padStart(2,'0')
        const hh = String(d.getHours()).padStart(2,'0')
        const mm = String(d.getMinutes()).padStart(2,'0')
        return mo + '/' + da + ' ' + hh + ':' + mm
      },

      get salesOptions() {
        return [...new Set(this.quotes.map(q => q.sales_person).filter(Boolean))].sort()
      },

      get monthOptions() {
        return [...new Set(this.quotes.map(q => (q.quote_date || q.created_at || '').slice(0,7)).filter(Boolean))].sort().reverse()
      },

      get filtered() {
        const base = this.quotes.filter(q => {
          // 階段篩選一旦生效就蓋過分頁：「全部」分頁的定義本來就排除
          // 未成案/已結案，不繞過的話點壓力帶的「已結束」會得到空清單。
          let matchTab
          if (this.phaseFilter) {
            matchTab = true
          } else if (this.activeTab === 'all') {
            matchTab = (q.deal_tag || '') !== '未成案' && (q.deal_tag || '') !== '已結案'
          } else {
            const tab = this.tabs.find(t => t.key === this.activeTab)
            matchTab = tab && tab.isDealTag
              ? (q.deal_tag || '') === this.activeTab
              : q.status === this.activeTab
          }
          const s            = this.search.trim().toLowerCase()
          const matchSearch  = !s || (q.quote_no||'').toLowerCase().includes(s) || (q.customer_name||'').toLowerCase().includes(s) || (q.project_name||'').toLowerCase().includes(s)
          const matchSales   = !this.filterSales || q.sales_person === this.filterSales
          const matchMonth   = !this.filterMonth || (q.quote_date || q.created_at || '').startsWith(this.filterMonth)
          const matchDealTag = !this.filterDealTag || (q.deal_tag || '') === this.filterDealTag
          const matchPhase   = !this.phaseFilter || this.lifecycleOf(q) === this.phaseFilter
          return matchTab && matchSearch && matchSales && matchMonth && matchDealTag && matchPhase
        })
        return applyListSort(base, this.sortPref, {
          quote_date:    q => q.quote_date || q.created_at || '',
          total:         q => q.total || 0,
          customer_name: q => q.customer_name || '',
        }, q => q.quote_no)
      },

      summaryData: { thisMonth: 0, thisMonthTotal: 0, pending: 0, confirmed: 0, avgMargin: '—' },

      _computeSummary() {
        const ym = new Date().toISOString().slice(0,7)
        const thisMonthQ         = this.quotes.filter(q => (q.quote_date || q.created_at || '').startsWith(ym))
        const thisMonthConfirmed = thisMonthQ.filter(q => q.deal_tag === '已成案' || q.deal_tag === '已結案')
        const margins            = this.quotes.filter(q => q.direct_margin_pct > 0).map(q => q.direct_margin_pct)
        this.summaryData = {
          thisMonth:      thisMonthQ.length,
          thisMonthTotal: thisMonthConfirmed.reduce((s, q) => s + (q.total || 0), 0),
          pending:        this.quotes.filter(q => q.status === '待審核').length,
          confirmed:      this.quotes.filter(q => q.status === '已確認').length,
          avgMargin:      margins.length ? (margins.reduce((a,b)=>a+b,0)/margins.length).toFixed(1) : '—',
        }
      },

      async loadQuotes() {
        this.loading = true
        this.loadErr = false
        try {
          const r = await fetch(`${API}/quotations?limit=2000`, {
            headers: { Authorization: 'Bearer ' + this.session.token }
          })
          this.backendOnline = true          // 有收到 HTTP 回應 = 後端在線
          if (r.status === 401) { this.logout(); return false }
          if (r.ok) {
            const d = await r.json()
            this.quotes = d.items || []
            this._computeSummary()
            this.loading = false
            return true
          }
          this.loadErr = true
        } catch {
          this.backendOnline = false         // 網路錯誤 = 後端真的離線
          this.loadErr = true
        }
        this.loading = false
        return false
      },

      async reload() {
        await this.loadQuotes()
      },

      dealDisplayStatus(q) {
        const s   = q.status   || ''
        const tag = q.deal_tag || ''
        if (s === '草稿')   return { text: '草稿',  cls: 'badge--draft' }
        if (s === '待審核') return { text: '審核中', cls: 'badge--pending' }
        if (s === '簽核中') return { text: '簽核中', cls: 'badge--signing' }
        if (s === '已核准') return { text: '已核准', cls: 'badge--approved' }
        if (s === '已取消') return { text: '已取消', cls: 'badge--danger' }
        if (s === '已拒絕') return { text: '已退回', cls: 'badge--rejected' }
        if (s === '已送出' || s === '已確認') {
          if (tag === '未成案') return { text: '未成案', cls: 'badge--lost' }
          if (tag === '已結案') return { text: '已結案', cls: 'badge--settled' }
          if (tag === '已成案') return { text: '執行中', cls: 'badge--running' }
          if (tag === '已提供') return { text: '待決定', cls: 'badge--sent' }
          return { text: '報價中', cls: 'badge--sent' }
        }
        return { text: s || '—', cls: '' }
      },

      trySetLost(quoteNo, tag, q) {
        const quote  = q || this.quotes.find(x => x.quote_no === quoteNo)
        const isAdmin = ['superadmin','admin'].includes(this.session.role)
        if (tag === '未成案') {
          if (!isAdmin) { this.toast('未成案標記僅限管理員操作', '#DC2626'); return }
          this.dealTagLostInfo   = { quoteNo, q: quote, oldTag: quote?.deal_tag || '' }
          this.dealTagLostReason = ''
          this.dealTagLostModal  = true
          return
        }
        if (tag === '已成案' && !isAdmin) {
          this.toast('已成案標記僅限管理員操作', '#DC2626')
          return
        }
        this.updateDealTag(quoteNo, tag, q)
      },

      async confirmLost() {
        if (!this.dealTagLostInfo) return
        const { quoteNo, q } = this.dealTagLostInfo
        const reason = this.dealTagLostReason
        this.dealTagLostModal = false
        this.dealTagLostInfo  = null
        await this.updateDealTag(quoteNo, '未成案', q, reason)
      },

      cancelLost() {
        if (this.dealTagLostInfo?.q) {
          this.dealTagLostInfo.q.deal_tag = this.dealTagLostInfo.oldTag
        }
        this.dealTagLostModal = false
        this.dealTagLostInfo  = null
      },

      async updateDealTag(quoteNo, tag, q, reason) {
        const quote = q || this.quotes.find(q => q.quote_no === quoteNo)
        const oldTag = quote?.deal_tag || ''
        if (tag === '已成案') {
          if (!confirm(`確認將報價單 ${quoteNo} 標記為「已成案」？\n\n確認後案件進度將鎖定，僅能透過「案件管理」頁面結案。\n此操作將留下操作紀錄。`)) {
            if (quote) quote.deal_tag = oldTag
            return
          }
        }
        if (quote) quote.deal_tag = tag
        this._computeSummary()
        try {
          const entry = { at: new Date().toISOString(), user: this.session.displayName || '', from: oldTag, to: tag, ...(reason ? { reason } : {}) }
          await fetch(`${API}/quotations/${quoteNo}/deal-tag`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.session.token },
            body: JSON.stringify({ deal_tag: tag, log_entry: entry }),
          })
        } catch { this.toast('更新失敗，請重試') ; return }
        this.toast(tag ? `案件進度已更新：${tag}` : '案件進度已清除')
        await this.loadQuotes()
      },

      async deleteQuote(quoteNo) {
        if (!confirm(`確定刪除報價單 ${quoteNo}？此操作無法復原。`)) return
        try {
          const r = await fetch(`${API}/quotations/${quoteNo}`, {
            method: 'DELETE',
            headers: { Authorization: 'Bearer ' + this.session.token }
          })
          if (!r.ok) { alert('後端刪除失敗'); return }
        } catch { alert('網路錯誤，刪除失敗'); return }
        this.quotes = this.quotes.filter(q => q.quote_no !== quoteNo)
        this.toast('報價單已刪除')
      },

      async duplicateQuote(quoteNo) {
        if (!confirm(`確定要以 ${quoteNo} 為範本複製一張新的草稿報價單？`)) return
        try {
          const [rSrc, rNo] = await Promise.all([
            fetch(`${API}/quotations/${quoteNo}`, { headers: { Authorization: 'Bearer ' + this.session.token } }),
            fetch(`${API}/next-quote-no`, { headers: { Authorization: 'Bearer ' + this.session.token } }),
          ])
          if (!rSrc.ok || !rNo.ok) { this.toast('複製失敗，請重試', '#DC2626'); return }
          const src   = (await rSrc.json()).data
          const newNo = (await rNo.json()).quote_no
          const genId = () => (window.crypto && window.crypto.randomUUID)
            ? window.crypto.randomUUID()
            : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2)

          const template = {
            ...src,
            quoteNo: newNo,
            quoteDate: new Date().toISOString().slice(0, 10),
            status: '草稿',
            approval: null,
            exportCount: 0,
            exportLog: [],
            version: 1,
            // 新單是全新的一筆案子，不可繼承來源單已經跑到哪的執行期資料（與 quotation-form.html 的 copyToNew() 規則一致）
            dealTag: '',
            caseRecord: null,
            settlement: null,
            editHistory: [],
          }
          template.items = (src.items || []).map(it => ({ ...it, id: genId() }))
          sessionStorage.setItem('motrix_copy_template', JSON.stringify(template))
          window.location.href = `quotation-form.html?id=${newNo}`
        } catch { this.toast('網路錯誤，複製失敗', '#DC2626') }
      },

      toast(msg, bg = '#0A0A0A') {
        const el = document.createElement('div')
        el.textContent = msg
        el.style.cssText = `position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:${bg};color:#F5F4F0;padding:8px 18px;border-radius:6px;font-size:12px;z-index:9999;font-family:LINE Seed TW_OTF, sans-serif`
        document.body.appendChild(el)
        setTimeout(() => el.remove(), 2500)
      },

      logout() {
        fetch('/api/auth/logout', { method:'POST', headers:{ Authorization:'Bearer '+(this.session.token||'') } }).catch(()=>{})
        localStorage.removeItem('motrix_session'); window.location.href = 'login.html'
      },

      async setSortMode(mode) {
        this.sortPref.sortMode = mode
        await saveListPref(this.session.token, 'quotations', this.sortPref)
        this.$nextTick(() => this.initSortable())
      },
      async toggleSortDir() {
        this.sortPref.sortDir = this.sortPref.sortDir === 'asc' ? 'desc' : 'asc'
        await saveListPref(this.session.token, 'quotations', this.sortPref)
      },
      initSortable() {
        const tbody = this.$refs.quotesTbody
        if (!tbody || typeof Sortable === 'undefined') return
        if (this._sortable) { this._sortable.destroy(); this._sortable = null }
        if (this.sortPref.sortMode !== 'custom') return
        this._sortable = Sortable.create(tbody, {
          animation: 150,
          handle: '.drag-handle',
          ghostClass: 'sortable-ghost',
          chosenClass: 'sortable-chosen',
          onEnd: async () => {
            const visibleIds = [...tbody.querySelectorAll('tr[data-quote-no]')].map(tr => tr.dataset.quoteNo)
            const rest = this.sortPref.customOrder.filter(id => !visibleIds.includes(id))
            this.sortPref.customOrder = [...visibleIds, ...rest]
            await saveListPref(this.session.token, 'quotations', this.sortPref)
          }
        })
      },

      // 🔴 Alpine 3 看到資料物件有 init() 就會**自己叫一次**，
      //    而 body 上那個明著呼叫初始化的屬性會再叫一次 ⇒ **跑兩遍**。
      // ☠️ 後果不只是 API 發兩次：第二次的回應晚一步抵達，
      //    會把使用者這段期間改過的欄位用伺服器上的舊值**無聲蓋回去**。
      _initDone: false,

      async init() {
        if (this._initDone) return
        this._initDone = true
      window.addEventListener('resize', () => { this.isMobileView = window.innerWidth <= 767 })
        const s = localStorage.getItem('motrix_session')
        if (!s) { window.location.href = 'login.html'; return }
        try { this.session = JSON.parse(s) } catch { window.location.href = 'login.html'; return }

        // Check ?view= param (one-shot: read then clear so it doesn't stick on back-navigation)
        const param = new URLSearchParams(window.location.search).get('view')
        if (param === 'queue') this.view = 'queue'
        if (window.location.search) history.replaceState(null, '', window.location.pathname)

        this.sortPref = await loadListPref(this.session.token, 'quotations')

        // 2026-09-24：篩選條件存 sessionStorage（同一個瀏覽器分頁內有效），
        // 從報價單返回清單時還原，不必重選。讀寫失敗（私密視窗等）就當作沒有。
        const _FK = 'motrix_quote_list_filters'
        const _FIELDS = ['activeTab', 'search', 'filterSales', 'filterMonth', 'filterDealTag', 'phaseFilter']
        try {
          const saved = JSON.parse(sessionStorage.getItem(_FK) || 'null')
          if (saved && typeof saved === 'object') {
            _FIELDS.forEach(k => { if (typeof saved[k] === 'string') this[k] = saved[k] })
            if (!this.tabs.some(t => t.key === this.activeTab)) this.activeTab = 'all'
          }
        } catch (e) {}
        const _saveFilters = () => {
          try {
            const o = {}; _FIELDS.forEach(k => { o[k] = this[k] })
            sessionStorage.setItem(_FK, JSON.stringify(o))
          } catch (e) {}
        }
        _FIELDS.forEach(k => this.$watch(k, _saveFilters))

        const ok = await this.loadQuotes()
        if (!ok || this.quotes.length === 0) {
          this.retrying = true
          await new Promise(r => setTimeout(r, 2000))
          this.retrying = false
          await this.loadQuotes()
        }
        this.$nextTick(() => this.initSortable())
      }
    }
  }
  </script>
  <script src="../static/notif.js"></script>
  <script src="../static/sidebar.js"></script>
  <script src="../static/list-sort.js"></script>
</body>
