<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../static/favicon.png">
  <title>簽核佇列 — MOTRIX 營運管理系統</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .aq-layout {
      display: flex;
      gap: 0;
      height: calc(100vh - var(--topbar-h));
      margin-left: var(--sidebar-w);
      margin-top: var(--topbar-h);
    }
    /* Left panel */
    .aq-left {
      width: 320px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      background: var(--bg);
    }
    .aq-left-header {
      padding: 18px 18px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--white);
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .aq-left-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }
    .aq-left-sub {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 3px;
      font-family: Inter, sans-serif;
    }
    .aq-group {
      border-bottom: 1px solid var(--border);
    }
    .aq-group-header {
      padding: 10px 18px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--white);
      border-bottom: 1px solid var(--border-light);
    }
    .aq-group-name {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      flex: 1;
    }
    .aq-group-badge {
      background: #EEF2FF;
      color: #4338CA;
      font-size: 10px;
      font-weight: 700;
      font-family: Inter, sans-serif;
      padding: 2px 7px;
      border-radius: 10px;
    }
    .aq-item {
      padding: 10px 18px;
      cursor: pointer;
      border-bottom: 1px solid var(--border-light);
      transition: background .12s;
    }
    .aq-item:last-child { border-bottom: none; }
    .aq-item:hover { background: #F5F3FF; }
    .aq-item.active { background: #EEF2FF; border-left: 3px solid #6366F1; padding-left: 15px; }
    .aq-item-quote {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      font-family: Inter, sans-serif;
    }
    .aq-item-customer {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .aq-item-meta {
      display: flex;
      gap: 8px;
      margin-top: 4px;
      align-items: center;
    }
    .aq-item-time {
      font-size: 10px;
      color: var(--text-dim);
      font-family: Inter, sans-serif;
    }
    .aq-item-amount {
      font-size: 10px;
      color: var(--text-secondary);
      font-family: Inter, sans-serif;
      margin-left: auto;
    }
    /* Right panel */
    .aq-right {
      flex: 1;
      overflow-y: auto;
      padding: 28px 32px;
      background: var(--white);
    }
    .aq-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      color: var(--text-dim);
    }
    .aq-empty-icon {
      font-size: 42px;
      opacity: .35;
    }
    .aq-empty-text {
      font-size: 14px;
      color: var(--text-secondary);
    }
    .aq-detail-header {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }
    .aq-detail-title {
      flex: 1;
    }
    .aq-detail-quote-no {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-main);
      font-family: Inter, sans-serif;
    }
    .aq-detail-customer {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    .aq-detail-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      align-items: center;
    }
    .btn-approve {
      background: #15803D;
      color: #fff;
      border: 1px solid #15803D;
    }
    .btn-approve:hover { background: #166534; border-color: #166534; }
    .btn-reject {
      background: #DC2626;
      color: #fff;
      border: 1px solid #DC2626;
    }
    .btn-reject:hover { background: #B91C1C; border-color: #B91C1C; }
    .aq-section {
      margin-bottom: 22px;
    }
    .aq-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-dim);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-light);
    }
    .aq-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 20px;
    }
    .aq-info-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .aq-info-label {
      font-size: 11px;
      color: var(--text-dim);
    }
    .aq-info-value {
      font-size: 13px;
      color: var(--text-main);
      font-weight: 500;
    }
    .aq-reasons {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .aq-reason-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FEF3C7;
      color: #92400E;
      border: 1px solid #FDE68A;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12px;
    }
    .aq-preview-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .aq-preview-link:hover { text-decoration: underline; }
    .aq-not-superadmin {
      background: #FEF3C7;
      border: 1px solid #FDE68A;
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 13px;
      color: #92400E;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .aq-self-warning {
      background: #FFF7ED;
      border: 1px solid #FED7AA;
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 13px;
      color: #C2410C;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .reject-modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 999;
      display: flex; align-items: center; justify-content: center;
    }
    .reject-modal {
      background: #fff; border-radius: 12px; padding: 28px 32px;
      width: 440px; max-width: 96vw; box-shadow: 0 16px 48px rgba(0,0,0,.22);
    }
    .reject-modal h3 {
      font-size: 16px; font-weight: 700; margin-bottom: 10px; color: var(--text-main);
    }
    .reject-modal textarea {
      width: 100%; border: 1px solid var(--border); border-radius: var(--radius);
      padding: 9px 12px; font-size: 13px; font-family: inherit; resize: vertical;
      min-height: 90px; color: var(--text-main);
      box-sizing: border-box;
    }
    .reject-modal textarea:focus { outline: none; border-color: var(--accent); }
    .reject-modal-footer {
      display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px;
    }
    /* Step progress */
    .aq-step-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10px; font-family: Inter, sans-serif; font-weight: 600;
      padding: 2px 7px; border-radius: 10px;
    }
    .aq-step-badge.waiting  { background: #EEF2FF; color: #4338CA; }
    .aq-step-badge.my-turn  { background: #D1FAE5; color: #065F46; }
    .aq-steps-timeline { display: flex; flex-direction: column; gap: 0; }
    .aq-step-row {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .aq-step-row:last-child { border-bottom: none; }
    .aq-step-circle {
      width: 24px; height: 24px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; font-family: Inter, sans-serif;
      flex-shrink: 0;
    }
    .aq-step-circle.done    { background: #D1FAE5; color: #065F46; }
    .aq-step-circle.current { background: #6366F1; color: #fff; }
    .aq-step-circle.pending { background: #F3F4F6; color: #9CA3AF; border: 1px solid #E5E7EB; }
    .aq-step-label { font-size: 13px; color: var(--text-main); font-weight: 500; flex: 1; }
    .aq-step-sublabel { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
    .aq-step-status {
      font-size: 10px; font-weight: 600; font-family: Inter, sans-serif;
      padding: 2px 8px; border-radius: 8px;
    }
    .aq-step-status.done    { background: #D1FAE5; color: #065F46; }
    .aq-step-status.current { background: #EEF2FF; color: #4338CA; }
    .aq-step-status.pending { background: #F3F4F6; color: #6B7280; }
  
  /* -- Mobile RWD -- */
  @media (max-width:767px) {
    .aq-layout { flex-direction:column; height:auto; margin-left:0 !important; margin-top:var(--topbar-h); min-height:calc(100vh - var(--topbar-h)); }
    .aq-left { width:100%; max-height:42vh; border-right:none; border-bottom:1px solid var(--border); }
    .aq-right { padding:14px 12px; }
    .aq-left.mob-hidden  { display:none !important; }
    .aq-right.mob-hidden { display:none !important; }
    .mob-back-aq { display:inline-flex !important; }
  }
  </style>
</head>
<body x-data="approvalQueueApp()" x-init="init()" x-cloak>

    <header id="app-topbar" class="topbar"></header>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="app-sidebar"></aside>

  <!-- MAIN -->
  <div class="aq-layout">

    <!-- Left: queue list -->
    <div class="aq-left" :class="{'mob-hidden': selected && isMobileView}">
      <div class="aq-left-header">
        <div class="aq-left-title">待簽核佇列</div>
        <div class="aq-left-sub" x-text="totalPending > 0 ? '共 ' + totalPending + ' 件待審核，依申請人排列' : '目前沒有待審核項目'"></div>
      </div>

      <div x-show="loading" style="padding:24px;text-align:center;font-size:13px;color:var(--text-dim)">載入中…</div>

      <div x-show="!loading && queue.length === 0" style="padding:32px 18px;text-align:center;font-size:13px;color:var(--text-secondary)">
        <div style="font-size:28px;opacity:.3;margin-bottom:8px">✓</div>
        所有簽核均已處理完畢
      </div>

      <template x-for="group in queue" :key="group.requestedBy">
        <div class="aq-group">
          <div class="aq-group-header">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-secondary)"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span class="aq-group-name" x-text="group.requestedByDisplay || group.requestedBy"></span>
            <span class="aq-group-badge" x-text="group.count"></span>
          </div>
          <template x-for="item in group.items" :key="item.quoteNo">
            <div class="aq-item"
                 :class="selected?.quoteNo === item.quoteNo ? 'active' : ''"
                 @click="selectItem(item)">
              <div style="display:flex;align-items:center;gap:6px">
                <div class="aq-item-quote" x-text="item.quoteNo"></div>
                <template x-if="(item.steps||[]).length > 0">
                  <span class="aq-step-badge"
                        :class="item.nextApprover === session.username ? 'my-turn' : 'waiting'"
                        x-text="'步驟 ' + (item.currentStep+1) + '/' + item.steps.length"></span>
                </template>
              </div>
              <div class="aq-item-customer" x-text="item.customer + (item.projectName ? '｜' + item.projectName : '')"></div>
              <div class="aq-item-meta">
                <span class="aq-item-time" x-text="item.requestedAt ? new Date(item.requestedAt).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : ''"></span>
                <span class="aq-item-amount" x-text="'NT$ ' + (item.total||0).toLocaleString()"></span>
              </div>
            </div>
          </template>
        </div>
      </template>
    </div>

    <!-- Right: detail -->
    <div class="aq-right" :class="{'mob-hidden': !selected && isMobileView}">

      <!-- Empty state -->
      <div class="aq-empty" x-show="!selected">
        <div class="aq-empty-icon">📋</div>
        <div class="aq-empty-text">選取左側項目以查看詳情</div>
      </div>

      <!-- Detail panel -->
      <div x-show="selected">
        <div class="aq-detail-header">
          <button @click="selected=null" class="mob-back-aq" style="display:none;align-items:center;gap:5px;background:none;border:none;cursor:pointer;font-size:13px;color:var(--accent);padding:0;font-family:var(--font-zh)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>列表</button>
          
          <div class="aq-detail-title">
            <div class="aq-detail-quote-no" x-text="selected?.quoteNo"></div>
            <div class="aq-detail-customer" x-text="(selected?.customer || '') + (selected?.projectName ? '　' + selected.projectName : '')"></div>
          </div>
          <div class="aq-detail-actions">
            <a :href="'quotation-form.html?q=' + (selected?.quoteNo||'')" target="_blank"
               style="font-size:12px;color:var(--accent);text-decoration:none;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);display:inline-flex;align-items:center;gap:5px">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>
              開啟報價單
            </a>
            <!-- Can approve: my turn in steps, OR (no steps + superadmin + not self) -->
            <template x-if="canApprove(selected)">
              <div style="display:flex;gap:8px">
                <button class="btn btn-approve btn-sm" @click="doApprove()" :disabled="actioning">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                  確認簽核
                </button>
                <button class="btn btn-reject btn-sm" @click="openRejectModal()" :disabled="actioning">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                  退回草稿
                </button>
              </div>
            </template>
            <!-- Superadmin can always reject, even if not their turn -->
            <template x-if="!canApprove(selected) && session.role === 'superadmin' && selected?.requestedBy !== session.username">
              <div style="display:flex;gap:8px;align-items:center">
                <span style="font-size:11px;color:#6B7280;padding:5px 9px;background:#F3F4F6;border-radius:5px;white-space:nowrap"
                      x-text="waitingForText(selected)"></span>
                <button class="btn btn-reject btn-sm" @click="openRejectModal()" :disabled="actioning">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                  退回草稿
                </button>
              </div>
            </template>
            <!-- Self-approver warning -->
            <template x-if="!canApprove(selected) && session.role === 'superadmin' && selected?.requestedBy === session.username">
              <div class="aq-self-warning">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                <span x-text="(selected?.steps||[]).length > 0 ? waitingForText(selected) : '您為此申請的申請人，須由他人簽核'"></span>
              </div>
            </template>
            <!-- Non-superadmin, not in flow -->
            <template x-if="!canApprove(selected) && session.role !== 'superadmin'">
              <div class="aq-not-superadmin">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span x-text="waitingForText(selected) || '非簽核流程中的人員'"></span>
              </div>
            </template>
          </div>
        </div>

        <!-- Info grid -->
        <div class="aq-section">
          <div class="aq-section-title">基本資訊</div>
          <div class="aq-info-grid">
            <div class="aq-info-row">
              <span class="aq-info-label">客戶</span>
              <span class="aq-info-value" x-text="selected?.customer || '—'"></span>
            </div>
            <div class="aq-info-row">
              <span class="aq-info-label">案件名稱</span>
              <span class="aq-info-value" x-text="selected?.projectName || '—'"></span>
            </div>
            <div class="aq-info-row">
              <span class="aq-info-label">報價金額</span>
              <span class="aq-info-value" style="font-family:Inter,sans-serif" x-text="'NT$ ' + (selected?.total||0).toLocaleString()"></span>
            </div>
            <div class="aq-info-row">
              <span class="aq-info-label">報價日期</span>
              <span class="aq-info-value" style="font-family:Inter,sans-serif" x-text="selected?.quoteDate || '—'"></span>
            </div>
            <div class="aq-info-row">
              <span class="aq-info-label">業務人員</span>
              <span class="aq-info-value" x-text="selected?.salesPerson || '—'"></span>
            </div>
            <div class="aq-info-row">
              <span class="aq-info-label">申請人</span>
              <span class="aq-info-value" x-text="selected?.requestedByDisplay || selected?.requestedBy || '—'"></span>
            </div>
            <div class="aq-info-row" style="grid-column:1/-1">
              <span class="aq-info-label">申請時間</span>
              <span class="aq-info-value" style="font-family:Inter,sans-serif"
                    x-text="selected?.requestedAt ? new Date(selected.requestedAt).toLocaleString('zh-TW') : '—'"></span>
            </div>
          </div>
        </div>

        <!-- Reasons -->
        <div class="aq-section" x-show="(selected?.reasons||[]).length > 0">
          <div class="aq-section-title">審核原因</div>
          <div class="aq-reasons">
            <template x-for="r in (selected?.reasons||[])" :key="r">
              <div class="aq-reason-tag">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                <span x-text="r"></span>
              </div>
            </template>
          </div>
        </div>

        <!-- Step progress (only shown when steps configured) -->
        <div class="aq-section" x-show="(selected?.steps||[]).length > 0">
          <div class="aq-section-title">簽核進度</div>
          <div class="aq-steps-timeline">
            <template x-for="(step, idx) in (selected?.steps||[])" :key="idx">
              <div class="aq-step-row">
                <div class="aq-step-circle"
                     :class="step.status === 'approved' ? 'done' : (idx === (selected?.currentStep ?? 0) ? 'current' : 'pending')">
                  <template x-if="step.status === 'approved'">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
                  </template>
                  <template x-if="step.status !== 'approved'">
                    <span x-text="idx + 1"></span>
                  </template>
                </div>
                <div style="flex:1">
                  <div class="aq-step-label" x-text="step.displayName"></div>
                  <div class="aq-step-sublabel"
                       x-text="step.status === 'approved' ? '已簽核　' + new Date(step.approvedAt).toLocaleString('zh-TW') : (idx === (selected?.currentStep ?? 0) ? '等待簽核中' : '尚未輪到')"></div>
                </div>
                <span class="aq-step-status"
                      :class="step.status === 'approved' ? 'done' : (idx === (selected?.currentStep ?? 0) ? 'current' : 'pending')"
                      x-text="step.status === 'approved' ? '已完成' : (idx === (selected?.currentStep ?? 0) ? '待簽核' : '未到')"></span>
              </div>
            </template>
          </div>
        </div>

      </div><!-- /detail -->
    </div><!-- /aq-right -->
  </div><!-- /aq-layout -->

  <!-- Reject modal -->
  <div class="reject-modal-overlay" x-show="rejectModalOpen" @click.self="rejectModalOpen=false">
    <div class="reject-modal">
      <h3>退回草稿</h3>
      <p style="font-size:12px;color:var(--text-secondary);margin-bottom:12px">
        此報價單將退回「草稿」狀態，申請人可修改後重新送出。
      </p>
      <textarea x-model="rejectNote" placeholder="退回原因（選填，供申請人參考）"></textarea>
      <div class="reject-modal-footer">
        <button class="btn btn-ghost btn-sm" @click="rejectModalOpen=false">取消</button>
        <button class="btn btn-reject btn-sm" @click="doReject()" :disabled="actioning">確認退回</button>
      </div>
    </div>
  </div>

  <script>
    const API = ''

    function approvalQueueApp() {
      return {
      isMobileView: window.innerWidth <= 767,
        session: {},
        queue: [],
        totalPending: 0,
        selected: null,
        loading: true,
        actioning: false,
        rejectModalOpen: false,
        rejectNote: '',

        async init() {
      window.addEventListener('resize', () => { this.isMobileView = window.innerWidth <= 767 })
          const s = JSON.parse(localStorage.getItem('motrix_session') || 'null')
          if (!s?.token) { location.href = 'login.html'; return }
          this.session = s
          await this.loadQueue()
        },

        async loadQueue() {
          this.loading = true
          try {
            const r = await fetch(`${API}/api/approval-queue`, {
              headers: { Authorization: 'Bearer ' + this.session.token }
            })
            if (r.status === 401) { location.href = 'login.html'; return }
            const d = await r.json()
            this.queue = d.queue || []
            this.totalPending = d.total || 0
            // Keep selection in sync
            if (this.selected) {
              const found = this.queue.flatMap(g => g.items).find(i => i.quoteNo === this.selected.quoteNo)
              this.selected = found || null
            }
          } catch (e) {
            console.error(e)
          } finally {
            this.loading = false
          }
        },

        selectItem(item) {
          this.selected = item
        },

        canApprove(item) {
          if (!item) return false
          const steps = item.steps || []
          if (steps.length > 0) {
            const cur = item.currentStep ?? 0
            if (cur >= steps.length) return false
            return steps[cur].username === this.session.username
          }
          // No steps: superadmin, not self
          return this.session.role === 'superadmin' && item.requestedBy !== this.session.username
        },

        waitingForText(item) {
          if (!item) return ''
          const steps = item.steps || []
          if (steps.length > 0) {
            const cur = item.currentStep ?? 0
            if (cur < steps.length) {
              const who = steps[cur].displayName || steps[cur].username
              return `等待 ${who} 簽核（步驟 ${cur + 1}/${steps.length}）`
            }
          }
          return ''
        },

        async doApprove() {
          if (!this.selected) return
          const item = this.selected
          const steps = item.steps || []
          const isMultiStep = steps.length > 0
          const isLastStep  = isMultiStep && (item.currentStep ?? 0) === steps.length - 1
          const willFinish  = !isMultiStep || isLastStep
          const confirmMsg  = willFinish
            ? `確認簽核通過 ${item.quoteNo}？\n\n客戶：${item.customer}\n金額：NT$ ${(item.total||0).toLocaleString()}\n\n簽核後報價單狀態將更新為「已送出」。`
            : `確認完成第 ${(item.currentStep ?? 0) + 1} 步驟簽核（共 ${steps.length} 步）？\n\n${item.quoteNo}｜${item.customer}`
          if (!confirm(confirmMsg)) return
          this.actioning = true
          try {
            const r = await fetch(`${API}/api/quotations/${encodeURIComponent(item.quoteNo)}/approve`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.session.token },
              body: JSON.stringify({ approvedByDisplay: this.session.displayName || this.session.username })
            })
            if (!r.ok) {
              const err = await r.json().catch(() => ({}))
              alert('簽核失敗：' + (err.detail || r.status))
              return
            }
            const resp = await r.json()
            if (resp.allDone) {
              this._toast('✓ 簽核完成，報價單已送出', '#15803D')
              this.selected = null
            } else {
              this._toast('✓ 此步驟已簽核，等待下一位簽核人', '#4338CA')
              // Keep selection but refresh so steps update
            }
            await this.loadQueue()
          } catch (e) {
            alert('網路錯誤：' + e.message)
          } finally {
            this.actioning = false
          }
        },

        openRejectModal() {
          this.rejectNote = ''
          this.rejectModalOpen = true
        },

        async doReject() {
          if (!this.selected) return
          const item = this.selected
          this.actioning = true
          try {
            const r = await fetch(`${API}/api/quotations/${encodeURIComponent(item.quoteNo)}/reject`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.session.token },
              body: JSON.stringify({ note: this.rejectNote })
            })
            if (!r.ok) {
              const err = await r.json().catch(() => ({}))
              alert('退回失敗：' + (err.detail || r.status))
              return
            }
            this.rejectModalOpen = false
            this._toast('↩ 已退回草稿', '#B45309')
            this.selected = null
            await this.loadQueue()
          } catch (e) {
            alert('網路錯誤：' + e.message)
          } finally {
            this.actioning = false
          }
        },

        logout() {
          localStorage.removeItem('motrix_session')
          location.href = 'login.html'
        },

        _toast(msg, bg = '#0A0A0A') {
          const el = document.createElement('div')
          el.textContent = msg
          el.style.cssText = `position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:${bg};color:#fff;padding:10px 22px;border-radius:8px;font-size:13px;z-index:99999;font-family:Inter,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.3)`
          document.body.appendChild(el)
          setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .4s'; setTimeout(() => el.remove(), 400) }, 2400)
        },
      }
    }
  </script>
  <script src="../static/sidebar.js"></script>
</body>
</html>
