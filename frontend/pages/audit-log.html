<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{if(localStorage.getItem('motrix_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    .audit-main {
      margin-left: var(--sidebar-w);
      margin-top: var(--topbar-h);
      padding: 28px 32px;
      min-height: calc(calc(100vh / var(--fz,1)) - var(--topbar-h));
      background: var(--white);
    }
    .filter-bar {
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .filter-bar input, .filter-bar select {
      padding: 7px 12px; border: 1px solid var(--border); border-radius: var(--radius);
      font-size: 13px; color: var(--text-main); background: #fff;
      font-family: inherit;
    }
    .filter-bar input { width: 220px; }
    .filter-bar select { min-width: 140px; }
    .filter-bar2 input[type=date] { width: 150px; }
    .filter-bar2 input { width: 150px; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .seg button { padding: 6px 12px; border: 0; background: #fff; font-size: 13px; cursor: pointer; font-family: inherit; }
    .seg button.on { background: var(--primary, #2563eb); color: #fff; }
    .seg button.on.fail { background: #dc2626; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; font-size: 12px; color: var(--text-secondary); }
    .chip { padding: 3px 10px; border-radius: 12px; background: #fee2e2; color: #b91c1c; cursor: pointer; border: 0; font-size: 12px; font-family: inherit; }
    .audit-layout { display: flex; gap: 20px; align-items: flex-start; }
    .drill { width: 260px; flex-shrink: 0; border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; max-height: calc(70vh / var(--fz,1)); overflow: auto; }
    .drill h4 { margin: 0 0 8px; font-size: 13px; }
    .drill .crumb { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
    .drill .crumb a { cursor: pointer; text-decoration: underline; }
    .drill-node { display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .drill-node:hover { background: var(--border-light); }
    .drill-node .n { color: var(--text-secondary); white-space: nowrap; }
    .drill-node .f { color: #dc2626; margin-left: 6px; }
    .audit-list { flex: 1; min-width: 0; }
    .tl-item.is-fail { background: #fef2f2; }
    .badge-fail { display: inline-block; padding: 2px 8px; border-radius: 10px; background: #dc2626; color: #fff; font-size: 12px; margin-right: 6px; }
    @media (max-width: 900px) { .audit-layout { flex-direction: column; } .drill { width: 100%; max-height: 240px; } }
    .timeline { display: flex; flex-direction: column; gap: 0; }
    .tl-item {
      display: flex; gap: 16px; padding: 14px 0;
      border-bottom: 1px solid var(--border-light);
      align-items: flex-start;
    }
    .tl-item:last-child { border-bottom: none; }
    .tl-dot {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 2px;
      font-size: 14px;
    }
    .tl-body { flex: 1; min-width: 0; }
    .tl-action {
      font-size: 13px; font-weight: 600; line-height: 1.4;
    }
    .tl-label {
      font-size: 12px; color: var(--text-secondary); margin-top: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .tl-meta {
      font-size: 11px; color: var(--text-dim); margin-top: 4px;
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    }
    .tl-user { font-weight: 500; color: var(--text-secondary); }
    .tl-time { font-family: 'LINE Seed TW_OTF', sans-serif; }
    .badge-action {
      display: inline-block; padding: 1px 7px; border-radius: 10px;
      font-size: 10px; font-weight: 700; font-family: 'LINE Seed TW_OTF', sans-serif;
    }
    .pager {
      display: flex; gap: 6px; align-items: center; justify-content: center;
      margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border-light);
    }
    .pager button {
      padding: 5px 14px; border: 1px solid var(--border); border-radius: var(--radius);
      background: #fff; font-size: 12px; cursor: pointer; color: var(--text-secondary);
      font-family: inherit;
    }
    .pager button:hover { background: var(--bg); }
    .pager button:disabled { opacity: .4; cursor: default; }
    .pager-info { font-size: 12px; color: var(--text-dim); font-family: 'LINE Seed TW_OTF', sans-serif; }
    .immutable-note {
      display: flex; align-items: center; gap: 8px;
      background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: var(--radius);
      padding: 8px 14px; font-size: 12px; color: #166534; margin-bottom: 16px;
    }
  </style>
</head>

        <button :class="{on: fResult==='fail', fail: true}" @click="fResult='fail'; applyFilter()">只看失敗</button>

    <!-- 下鑽：模組 → 案件 → 單據 -->
    <aside class="drill">
      <h4>分層瀏覽</h4>
      <div x-show="treeWindow" data-testid="tree-window" style="font-size:12px;color:var(--text-secondary);margin-bottom:8px">
        <span x-text="'範圍：' + (treeWindow ? treeWindow.from + ' ～ ' + treeWindow.to : '') + (treeWindow && treeWindow.defaulted ? '（預設近 ' + treeWindow.defaultDays + ' 天）' : '') + (treeWindow && treeWindow.clamped ? '（已縮到上限 ' + treeWindow.maxDays + ' 天）' : '')"></span>
        <button type="button" data-testid="tree-widen" x-show="treeWindow && !treeWindow.clamped" @click="widenTree()" style="margin-left:6px;border:0;background:transparent;color:var(--primary,#2563eb);cursor:pointer;text-decoration:underline">擴大到 <span x-text="treeWindow ? treeWindow.maxDays : ''"></span> 天</button>
      </div>
      <div class="crumb">
        <a @click="drillTo('module')">全部模組</a>
        <template x-if="fModule"><span> › <a @click="drillTo('case')" x-text="moduleLabel(fModule)"></a></span></template>
        <template x-if="fCase"><span> › <a @click="drillTo('ref')" x-text="fCase"></a></span></template>
      </div>
      <template x-for="n in tree" :key="n.key + '|' + n.label">
        <div class="drill-node" @click="pickNode(n)">
          <span x-text="n.label"></span>
          <span class="n"><span x-text="n.count"></span><span class="f" x-show="n.failCount" x-text="'✕' + n.failCount"></span></span>
        </div>
      </template>
      <div x-show="tree.length===0" style="font-size:12px;color:var(--text-dim)">沒有更下一層</div>
    </aside>
    <div class="audit-list">

    <!-- 時間線 -->
    <div class="timeline" x-show="!loading">
      <template x-for="item in items" :key="item.id">
        <div class="tl-item" :class="{'is-fail': item.result==='fail'}">
          <div class="tl-dot" :style="`background:${dotBg(item.action)}`">
            <span x-text="dotIcon(item.action)"></span>
          </div>
          <div class="tl-body">
            <div class="tl-action">
              <span class="badge-fail" x-show="item.result==='fail'" x-text="'失敗：' + (item.reason_label || item.status_code)"></span>
              <span class="badge-action" :style="`background:${badgeBg(item.action)};color:${badgeFg(item.action)}`"
                    x-text="item.result==='fail' ? failTitle(item) : actionLabel(item.action)"></span>
            </div>
            <div class="tl-label" x-text="item.target_label || item.target_id || '—'"></div>
            <div class="tl-label" x-show="item.case_no || item.ref_no" x-text="[item.module_label, item.case_no, item.ref_no].filter(Boolean).join(' › ')"></div>
            <div class="tl-meta">
              <span class="tl-user" x-text="item.display_name || item.username || '（系統）'"></span>
              <span class="tl-time" x-text="formatAt(item.at)"></span>
            </div>
          </div>
        </div>
      </template>
      <div x-show="items.length===0 && !loading" style="padding:48px;text-align:center;color:var(--text-dim);font-size:13px">
        暫無紀錄
      </div>
    </div>

    <div x-show="loading" style="padding:48px;text-align:center;color:var(--text-dim);font-size:13px">載入中…</div>

    <!-- 分頁 -->
    <div class="pager" x-show="total > perPage">
      <button @click="prevPage()" :disabled="page===1">‹ 上一頁</button>
      <span class="pager-info" x-text="`${(page-1)*perPage+1}–${Math.min(page*perPage,total)} / ${total}`"></span>
      <button @click="nextPage()" :disabled="page*perPage>=total">下一頁 ›</button>
    </div>
    </div><!-- /audit-list -->
    </div><!-- /audit-layout -->
  </main>

    return {
      API: '',
      session: {},
      items:  [],
      total:  0,
      totalCapped: false,
      page:   1,
      perPage: 50,
      loading: false,
      q: '',
      filterAction: '',
      fModule: '', fCase: '', fRef: '', fUser: '', fFrom: '', fTo: '', fResult: '',
      moduleOptions: [], tree: [], treeWindow: null, failSummary: { total: 0, byReason: [] },

      // 🔴 Alpine 3 看到資料物件有 init() 就會**自己叫一次**，
      //    而 body 上那個明著呼叫初始化的屬性會再叫一次 ⇒ **跑兩遍**。
      // ☠️ 後果不只是 API 發兩次：第二次的回應晚一步抵達，
      //    會把使用者這段期間改過的欄位用伺服器上的舊值**無聲蓋回去**。
      _initDone: false,

      async init() {
        if (this._initDone) return
        this._initDone = true
        const s = JSON.parse(localStorage.getItem('motrix_session') || '{}')
        if (!s.token) { location.href = 'login.html'; return }
        this.session = s
        await Promise.all([this.load(), this.loadTree(), this.loadFailSummary()])
        this.moduleOptions = ((await this.fetchTree('module', { all: true })) || {}).items || []
      },

      _authGet(url) {
        return fetch(url, { headers: { Authorization: 'Bearer ' + this.session.token } })
      },
      _filterParams() {
        const p = new URLSearchParams()
        if (this.filterAction) p.set('action', this.filterAction)
        if (this.fModule) p.set('module', this.fModule)
        if (this.fCase.trim()) p.set('case_no', this.fCase.trim())
        if (this.fRef.trim()) p.set('ref_no', this.fRef.trim())
        if (this.fUser.trim()) p.set('user', this.fUser.trim())
        if (this.fFrom) p.set('date_from', this.fFrom)
        if (this.fTo) p.set('date_to', this.fTo)
        if (this.fResult) p.set('result', this.fResult)
        return p
      },
      moduleLabel(k) { const m = this.moduleOptions.find(x => x.key === k); return m ? m.label : k },
      failTitle(it) { return (it.module_label || '操作') + ' 寫入被擋下' + (it.target_label ? '（' + it.target_label + '）' : '') },
      applyFilter() { this.page = 1; this.load(); this.loadTree(); this.loadFailSummary() },
      resetFilter() {
        this.fModule = this.fCase = this.fRef = this.fUser = this.fFrom = this.fTo = this.fResult = ''
        this.filterAction = ''; this.q = ''; this.applyFilter()
      },
      treeLevel() { return !this.fModule ? 'module' : (!this.fCase ? 'case' : 'ref') },
      async fetchTree(level, extra) {
        const p = level === 'module' && extra && extra.all ? new URLSearchParams() : this._filterParams()
        p.set('level', level)
        try {
          const r = await this._authGet('/api/audit-log/tree?' + p)
          if (r.ok) return await r.json()
        } catch (e) {}
        return null
      },
      async loadTree() {
        const d = await this.fetchTree(this.treeLevel(), {})
        this.tree = (d && d.items) || []
        this.treeWindow = (d && d.window) || null
      },
      widenTree() {
        // 把起日拉到「迄日往前最長天數」（迄日沿用目前視窗的迄日）；伺服器最後仍以上限截斷
        const w = this.treeWindow
        if (!w) return
        const end = new Date(w.to + 'T00:00:00')
        end.setDate(end.getDate() - w.maxDays)
        this.fFrom = end.toISOString().slice(0, 10)
        this.fTo = w.to
        this.applyFilter()
      },
      async loadFailSummary() {
        const p = new URLSearchParams()
        if (this.fFrom) p.set('date_from', this.fFrom)
        if (this.fTo) p.set('date_to', this.fTo)
        try {
          const r = await this._authGet('/api/audit-log/failures/summary?' + p)
          if (r.ok) this.failSummary = await r.json()
        } catch (e) {}
      },
      pickNode(n) {
        const lv = this.treeLevel()
        if (lv === 'module') this.fModule = n.key
        else if (lv === 'case') this.fCase = n.key
        else this.fRef = n.key
        this.applyFilter()
      },
      drillTo(level) {
        if (level === 'module') { this.fModule = ''; this.fCase = ''; this.fRef = '' }
        else if (level === 'case') { this.fCase = ''; this.fRef = '' }
        else { this.fRef = '' }
        this.applyFilter()
      },

      async load() {
        this.loading = true
        const params = new URLSearchParams({
          limit:  this.perPage,
          offset: (this.page - 1) * this.perPage,
        })
        for (const [k, v] of this._filterParams()) params.set(k, v)
        if (this.q.trim())    params.set('q', this.q.trim())
        try {
          const r = await fetch(`/api/audit-log?${params}`, {
            headers: { Authorization: 'Bearer ' + this.session.token }
          })
          if (r.status === 401) { this.logout(); return }
          if (r.ok) {
            const d = await r.json()
            this.items = d.items || []
            this.total = d.total || 0
            this.totalCapped = !!d.totalCapped
          }
        } catch(e) {}
        this.loading = false
      },

      prevPage() { if (this.page > 1) { this.page--; this.load() } },
      nextPage() { if (this.page * this.perPage < this.total) { this.page++; this.load() } },

      logout() {
        const s = JSON.parse(localStorage.getItem('motrix_session') || '{}')
        if (s.token) fetch('/api/auth/logout', { method:'POST', headers:{ Authorization:'Bearer '+s.token } }).catch(()=>{})
        localStorage.removeItem('motrix_session')
        location.href = 'login.html'

        if (action.startsWith('vendor.dispatch.'))  return '#fff7ed'
        if (action.startsWith('vendor.'))           return '#ffedd5'
        if (action.startsWith('contractor_voucher.')) return '#fef3c7'
        if (action.startsWith('invoice_voucher.'))    return '#f5f3ff'
        if (action.startsWith('dev_case.') || action.startsWith('dev_log.')) return '#eef2ff'
        if (action.startsWith('project.'))          return '#ecfeff'
        if (action.startsWith('daily_task.'))       return '#f0fdf4'
        if (action.startsWith('contractor.'))       return '#fff1f2'
        if (action.startsWith('payslip.'))          return '#fefce8'
        if (action.startsWith('settings.'))         return '#f1f5f9'
        if (action.startsWith('user.'))             return '#f0f9ff'
        if (action.startsWith('env_guide.') || action.startsWith('netarch_guide.') || action.startsWith('switch_guide.') || action.startsWith('monitor_guide.') || action.startsWith('access_guide.') || action.startsWith('automation_guide.')) return '#f0fdfa'

        if (action.includes('delete') && !action.includes('delete_cancel') && !action.includes('delete_reject')) return '#b91c1c'
        if (action === 'part.delete')               return '#92400e'
        if (action === 'user.active')               return '#c2410c'
        if (action === 'auth.logout')               return '#64748b'
        if (action === 'quotation.approve' || action === 'dev_log.approve') return '#15803d'
        if (action === 'quotation.return' || action === 'quotation.reject_final') return '#b45309'
        if (action === 'quotation.submit' || action === 'quotation.create') return '#1d4ed8'
        if (action === 'auth.login')                return '#6b7280'
        if (action === 'payment.mark')              return '#92400e'
        if (action === 'case.update')               return '#166534'
        if (action.startsWith('part.'))             return '#854d0e'
        if (action === 'customer.visit.update')     return '#9333ea'
        if (action.startsWith('customer.'))         return '#7c3aed'
        if (action.startsWith('supplier.'))         return '#7e22ce'
        if (action.startsWith('vendor.dispatch.'))  return '#c2410c'
        if (action.startsWith('vendor.'))           return '#ea580c'
        if (action.startsWith('contractor_voucher.')) return '#92400e'
        if (action.startsWith('invoice_voucher.'))    return '#7c3aed'
        if (action.startsWith('dev_case.') || action.startsWith('dev_log.')) return '#4338ca'
        if (action.startsWith('project.'))          return '#0e7490'
        if (action.startsWith('daily_task.'))       return '#15803d'
        if (action.startsWith('contractor.'))       return '#be123c'
        if (action.startsWith('payslip.'))          return '#854d0e'
        if (action.startsWith('settings.'))         return '#475569'
        if (action.startsWith('user.'))             return '#0369a1'
        if (action.startsWith('env_guide.') || action.startsWith('netarch_guide.') || action.startsWith('switch_guide.') || action.startsWith('monitor_guide.') || action.startsWith('access_guide.') || action.startsWith('automation_guide.')) return '#0f766e'
        return '#1d4ed8'
      },

      dotBg(action) {
        if (action.includes('delete') && !action.includes('delete_cancel') && !action.includes('delete_reject')) return '#fee2e2'
        if (action === 'part.delete')               return '#fef3c7'
        if (action === 'user.active')               return '#fff7ed'
        if (action === 'auth.logout')               return '#f1f5f9'
        if (action === 'quotation.approve' || action === 'dev_log.approve') return '#dcfce7'
        if (action === 'quotation.return' || action === 'quotation.reject_final') return '#fef3c7'
        if (action === 'payment.mark')              return '#fef3c7'
        if (action === 'case.update')               return '#f0fdf4'
        if (action.startsWith('part.'))             return '#fefce8'
        if (action === 'customer.visit.update')     return '#fdf4ff'
        if (action.startsWith('customer.'))         return '#f5f3ff'
        if (action.startsWith('supplier.'))         return '#fdf4ff'
        if (action.startsWith('vendor.'))           return '#ffedd5'
        if (action.startsWith('contractor_voucher.')) return '#fef3c7'
        if (action.startsWith('invoice_voucher.'))    return '#f5f3ff'
        if (action.startsWith('dev_case.') || action.startsWith('dev_log.')) return '#eef2ff'
        if (action.startsWith('project.'))          return '#ecfeff'
        if (action.startsWith('daily_task.'))       return '#f0fdf4'

        if (action.startsWith('payslip.'))          return '#fefce8'
        if (action.startsWith('settings.'))         return '#f1f5f9'
        if (action === 'auth.login')                return '#f3f4f6'
        if (action.startsWith('env_guide.') || action.startsWith('netarch_guide.') || action.startsWith('switch_guide.') || action.startsWith('monitor_guide.') || action.startsWith('access_guide.') || action.startsWith('automation_guide.')) return '#f0fdfa'
        return '#dbeafe'
      },

      dotIcon(action) {
        if (action === 'part.delete')               return '🗃'
        if (action.includes('delete') && !action.includes('delete_cancel') && !action.includes('delete_reject')) return '🗑'
        if (action === 'user.active')               return '🔓'
        if (action === 'auth.logout')               return '🚪'
        if (action === 'quotation.approve' || action === 'dev_log.approve') return '✅'
        if (action === 'quotation.return')          return '↩️'
        if (action === 'quotation.reject_final')    return '🚫'
        if (action === 'quotation.submit')          return '📤'
        if (action === 'quotation.recall')          return '↩️'
        if (action === 'quotation.export_pdf')      return '📄'
        if (action === 'quotation.settlement')      return '🧮'
        if (action === 'quotation.unlock_edit')     return '🔓'
        if (action === 'payment.mark')              return '💰'
        if (action === 'case.update')               return '🗂'
        if (action.startsWith('part.'))             return '🔩'
        if (action === 'customer.visit.update')     return '📋'
        if (action.startsWith('customer.'))         return '👤'
        if (action === 'supplier.visit.update')     return '📋'
        if (action.startsWith('supplier.'))         return '🏢'
        if (action.startsWith('vendor.dispatch.'))  return '🚚'
        if (action.startsWith('vendor.'))           return '🤝'
        if (action === 'contractor_voucher.pay')    return '💸'
        if (action === 'contractor_voucher.unpay')  return '↩️'
        if (action === 'contractor_voucher.approve' || action === 'invoice_voucher.approve') return '✅'
        if (action === 'contractor_voucher.reject' || action === 'invoice_voucher.reject') return '↩️'
        if (action === 'contractor_voucher.revoke_approval' || action === 'invoice_voucher.revoke_approval') return '↩️'
        if (action === 'contractor_voucher.export_pdf' || action === 'invoice_voucher.export_pdf') return '📄'
        if (action.startsWith('contractor_voucher.')) return '🏦'
        if (action.startsWith('invoice_voucher.'))    return '🧾'
        if (action === 'dev_case.convert')          return '🔄'
        if (action.startsWith('dev_case.'))         return '💼'
        if (action === 'dev_log.approve')           return '✅'
        if (action.startsWith('dev_log.'))          return '📓'
        if (action === 'project.log.approve')       return '✅'
        if (action === 'project.log.create')        return '🔧'
        if (action.startsWith('project.'))          return '📐'
        if (action === 'daily_task.complete')       return '✔️'
        if (action === 'daily_task.uncomplete')     return '↩️'
        if (action === 'daily_task.admin_unlock')   return '🔓'
        if (action.startsWith('daily_task.'))       return '📅'
        if (action === 'contractor.id_card.update') return '🪪'
        if (action.startsWith('contractor.'))       return '👷'
        if (action.startsWith('payslip.'))          return '🧾'
        if (action.startsWith('settings.'))         return '⚙️'
        if (action === 'auth.login')                return '🔑'
        if (action === 'auth.change_password')      return '🔐'
        if (action === 'deal_tag.change')           return '🏷'
        if (action.startsWith('user.'))             return '👥'
        if (action.startsWith('env_guide.') || action.startsWith('netarch_guide.') || action.startsWith('switch_guide.') || action.startsWith('monitor_guide.') || action.startsWith('access_guide.') || action.startsWith('automation_guide.')) return '🧭'
        return '📝'
      },

      formatAt(at) {
        if (!at) return ''
        const d = new Date(at)
        return d.toLocaleString('zh-TW', {
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit', second: '2-digit'
        })
      },
    }
  }
