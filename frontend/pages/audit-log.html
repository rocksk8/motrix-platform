<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../static/favicon.png">
  <title>歷史紀錄 — MOTRIX 營運管理系統</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .audit-main {
      margin-left: var(--sidebar-w);
      margin-top: var(--topbar-h);
      padding: 28px 32px;
      min-height: calc(100vh - var(--topbar-h));
      background: var(--white);
    }
    .filter-bar {
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .filter-bar input, .filter-bar select {
      padding: 7px 12px; border: 1px solid var(--border); border-radius: var(--radius);
      font-size: 13px; color: var(--text-main); background: #fff;
      font-family: inherit;
    }
    .filter-bar input { width: 220px; }
    .filter-bar select { min-width: 140px; }
    .timeline { display: flex; flex-direction: column; gap: 0; }
    .tl-item {
      display: flex; gap: 16px; padding: 14px 0;
      border-bottom: 1px solid var(--border-light);
      align-items: flex-start;
    }
    .tl-item:last-child { border-bottom: none; }
    .tl-dot {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 2px;
      font-size: 14px;
    }
    .tl-body { flex: 1; min-width: 0; }
    .tl-action {
      font-size: 13px; font-weight: 600; line-height: 1.4;
    }
    .tl-label {
      font-size: 12px; color: var(--text-secondary); margin-top: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .tl-meta {
      font-size: 11px; color: var(--text-dim); margin-top: 4px;
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    }
    .tl-user { font-weight: 500; color: var(--text-secondary); }
    .tl-time { font-family: Inter, sans-serif; }
    .badge-action {
      display: inline-block; padding: 1px 7px; border-radius: 10px;
      font-size: 10px; font-weight: 700; font-family: Inter, sans-serif;
    }
    .pager {
      display: flex; gap: 6px; align-items: center; justify-content: center;
      margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border-light);
    }
    .pager button {
      padding: 5px 14px; border: 1px solid var(--border); border-radius: var(--radius);
      background: #fff; font-size: 12px; cursor: pointer; color: var(--text-secondary);
      font-family: inherit;
    }
    .pager button:hover { background: var(--bg); }
    .pager button:disabled { opacity: .4; cursor: default; }
    .pager-info { font-size: 12px; color: var(--text-dim); font-family: Inter, sans-serif; }
    .immutable-note {
      display: flex; align-items: center; gap: 8px;
      background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: var(--radius);
      padding: 8px 14px; font-size: 12px; color: #166534; margin-bottom: 16px;
    }
  </style>
</head>
<body x-data="auditApp()" x-init="init()" x-cloak>

    <header id="app-topbar" class="topbar"></header>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="app-sidebar"></aside>

  <!-- MAIN -->
  <main class="audit-main">
    <div class="page-header">
      <div>
        <div class="page-header__title">歷史紀錄</div>
        <div class="page-header__sub" x-text="'共 ' + total + ' 筆操作紀錄'"></div>
      </div>
    </div>

    <div class="immutable-note">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      歷史紀錄不可修改或刪除，所有操作均永久保存以供稽核。
    </div>

    <!-- 篩選列 -->
    <div class="filter-bar">
      <input type="search" placeholder="搜尋關鍵字（目標、使用者…）" x-model.debounce.400ms="q" @input="page=1; load()">
      <select x-model="filterAction" @change="page=1; load()">
        <option value="">所有操作</option>
        <optgroup label="報價單">
          <option value="quotation.create">新增報價單</option>
          <option value="quotation.submit">送出審核</option>
          <option value="quotation.approve">簽核通過</option>
          <option value="quotation.update">更新報價單</option>
          <option value="quotation.delete">刪除報價單</option>
          <option value="quotation.export_pdf">匯出 PDF</option>
          <option value="deal_tag.change">案件進度</option>
          <option value="quotation.settlement">成本精算</option>
        </optgroup>
        <optgroup label="案件管理">
          <option value="case.update">案件資料更新</option>
        </optgroup>
        <optgroup label="料號主檔">
          <option value="part.create">新增料號</option>
          <option value="part.update">更新料號</option>
          <option value="part.delete">刪除料號</option>
        </optgroup>
        <optgroup label="客戶">
          <option value="customer.create">新增客戶</option>
          <option value="customer.update">更新客戶</option>
          <option value="customer.delete">刪除客戶</option>
          <option value="customer.visit.update">拜訪紀錄更新</option>
        </optgroup>
        <optgroup label="財務">
          <option value="payment.mark">收款標記</option>
        </optgroup>
        <optgroup label="系統">
          <option value="auth.login">使用者登入</option>
          <option value="auth.logout">使用者登出</option>
          <option value="auth.change_password">修改密碼</option>
          <option value="user.create">新增使用者</option>
          <option value="user.update">更新使用者</option>
          <option value="user.delete">刪除使用者</option>
          <option value="user.active">啟用／停用帳號</option>
        </optgroup>
      </select>
      <span style="font-size:12px;color:var(--text-dim);margin-left:auto;font-family:Inter,sans-serif" x-text="`第 ${page} 頁 / 共 ${Math.max(1,Math.ceil(total/perPage))} 頁`"></span>
    </div>

    <!-- 時間線 -->
    <div class="timeline" x-show="!loading">
      <template x-for="item in items" :key="item.id">
        <div class="tl-item">
          <div class="tl-dot" :style="`background:${dotBg(item.action)}`">
            <span x-text="dotIcon(item.action)"></span>
          </div>
          <div class="tl-body">
            <div class="tl-action">
              <span class="badge-action" :style="`background:${badgeBg(item.action)};color:${badgeFg(item.action)}`"
                    x-text="actionLabel(item.action)"></span>
            </div>
            <div class="tl-label" x-text="item.target_label || item.target_id || '—'"></div>
            <div class="tl-meta">
              <span class="tl-user" x-text="item.display_name || item.username || '（系統）'"></span>
              <span class="tl-time" x-text="formatAt(item.at)"></span>
            </div>
          </div>
        </div>
      </template>
      <div x-show="items.length===0 && !loading" style="padding:48px;text-align:center;color:var(--text-dim);font-size:13px">
        暫無紀錄
      </div>
    </div>

    <div x-show="loading" style="padding:48px;text-align:center;color:var(--text-dim);font-size:13px">載入中…</div>

    <!-- 分頁 -->
    <div class="pager" x-show="total > perPage">
      <button @click="prevPage()" :disabled="page===1">‹ 上一頁</button>
      <span class="pager-info" x-text="`${(page-1)*perPage+1}–${Math.min(page*perPage,total)} / ${total}`"></span>
      <button @click="nextPage()" :disabled="page*perPage>=total">下一頁 ›</button>
    </div>
  </main>

  <script src="../static/notif.js"></script>
  <script>
  function auditApp() {
    return {
      API: '',
      session: {},
      items:  [],
      total:  0,
      page:   1,
      perPage: 50,
      loading: false,
      q: '',
      filterAction: '',

      async init() {
        const s = JSON.parse(localStorage.getItem('motrix_session') || '{}')
        if (!s.token) { location.href = 'login.html'; return }
        this.session = s
        await this.load()
      },

      async load() {
        this.loading = true
        const params = new URLSearchParams({
          limit:  this.perPage,
          offset: (this.page - 1) * this.perPage,
        })
        if (this.filterAction) params.set('action', this.filterAction)
        if (this.q.trim())    params.set('q', this.q.trim())
        try {
          const r = await fetch(`/api/audit-log?${params}`, {
            headers: { Authorization: 'Bearer ' + this.session.token }
          })
          if (r.status === 401) { this.logout(); return }
          if (r.ok) {
            const d = await r.json()
            this.items = d.items || []
            this.total = d.total || 0
          }
        } catch(e) {}
        this.loading = false
      },

      prevPage() { if (this.page > 1) { this.page--; this.load() } },
      nextPage() { if (this.page * this.perPage < this.total) { this.page++; this.load() } },

      logout() {
        const s = JSON.parse(localStorage.getItem('motrix_session') || '{}')
        if (s.token) fetch('/api/auth/logout', { method:'POST', headers:{ Authorization:'Bearer '+s.token } }).catch(()=>{})
        localStorage.removeItem('motrix_session')
        location.href = 'login.html'
      },

      actionLabel(action) {
        const map = {
          'auth.login':            '登入',
          'auth.logout':           '登出',
          'auth.change_password':  '修改密碼',
          'quotation.create':      '新增報價單',
          'quotation.submit':      '送出審核',
          'quotation.approve':     '簽核通過',
          'quotation.update':      '更新報價單',
          'quotation.delete':      '刪除報價單',
          'quotation.status_change':'狀態變更',
          'quotation.export_pdf':  '匯出 PDF',
          'quotation.settlement':  '成本精算',
          'deal_tag.change':       '案件進度',
          'case.update':           '案件資料更新',
          'part.create':           '新增料號',
          'part.update':           '更新料號',
          'part.delete':           '刪除料號',
          'customer.create':       '新增客戶',
          'customer.update':       '更新客戶',
          'customer.delete':       '刪除客戶',
          'customer.visit.update': '拜訪紀錄',
          'payment.mark':          '收款標記',
          'user.create':           '新增使用者',
          'user.update':           '更新使用者',
          'user.delete':           '刪除使用者',
          'user.active':           '帳號啟停',
        }
        return map[action] || action
      },

      badgeBg(action) {
        if (action.includes('delete'))              return '#fee2e2'
        if (action === 'part.delete')               return '#fef3c7'
        if (action === 'user.active')               return '#fff7ed'
        if (action === 'auth.logout')               return '#f1f5f9'
        if (action === 'quotation.approve')         return '#dcfce7'
        if (action === 'quotation.submit' || action === 'quotation.create') return '#dbeafe'
        if (action === 'auth.login')                return '#f3f4f6'
        if (action === 'payment.mark')              return '#fef3c7'
        if (action === 'case.update')               return '#f0fdf4'
        if (action.startsWith('part.'))             return '#fefce8'
        if (action === 'customer.visit.update')     return '#fdf4ff'
        if (action.includes('customer'))            return '#f5f3ff'
        return '#eff6ff'
      },

      badgeFg(action) {
        if (action.includes('delete'))              return '#b91c1c'
        if (action === 'part.delete')               return '#92400e'
        if (action === 'user.active')               return '#c2410c'
        if (action === 'auth.logout')               return '#64748b'
        if (action === 'quotation.approve')         return '#15803d'
        if (action === 'quotation.submit' || action === 'quotation.create') return '#1d4ed8'
        if (action === 'auth.login')                return '#6b7280'
        if (action === 'payment.mark')              return '#92400e'
        if (action === 'case.update')               return '#166534'
        if (action.startsWith('part.'))             return '#854d0e'
        if (action === 'customer.visit.update')     return '#9333ea'
        if (action.includes('customer'))            return '#7c3aed'
        return '#1d4ed8'
      },

      dotBg(action) {
        if (action.includes('delete'))              return '#fee2e2'
        if (action === 'part.delete')               return '#fef3c7'
        if (action === 'user.active')               return '#fff7ed'
        if (action === 'auth.logout')               return '#f1f5f9'
        if (action === 'quotation.approve')         return '#dcfce7'
        if (action === 'payment.mark')              return '#fef3c7'
        if (action === 'case.update')               return '#f0fdf4'
        if (action.startsWith('part.'))             return '#fefce8'
        if (action === 'customer.visit.update')     return '#fdf4ff'
        if (action.includes('customer'))            return '#f5f3ff'
        if (action === 'auth.login')                return '#f3f4f6'
        return '#dbeafe'
      },

      dotIcon(action) {
        if (action === 'part.delete')               return '🗃'
        if (action.includes('delete'))              return '🗑'
        if (action === 'user.active')               return '🔓'
        if (action === 'auth.logout')               return '🚪'
        if (action === 'quotation.approve')         return '✅'
        if (action === 'quotation.submit')          return '📤'
        if (action === 'quotation.export_pdf')      return '📄'
        if (action === 'quotation.settlement')      return '🧮'
        if (action === 'payment.mark')              return '💰'
        if (action === 'case.update')               return '🗂'
        if (action.startsWith('part.'))             return '🔩'
        if (action === 'customer.visit.update')     return '📋'
        if (action.includes('customer'))            return '👤'
        if (action === 'auth.login')                return '🔑'
        if (action === 'auth.change_password')      return '🔐'
        if (action === 'deal_tag.change')           return '🏷'
        if (action.includes('user.'))               return '👥'
        return '📝'
      },

      formatAt(at) {
        if (!at) return ''
        const d = new Date(at)
        return d.toLocaleString('zh-TW', {
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit', second: '2-digit'
        })
      },
    }
  }
  </script>
  <script src="../static/sidebar.js"></script>
</body>
</html>
