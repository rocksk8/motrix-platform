<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{if(localStorage.getItem('motrix_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>勞報單開立 — MOTRIX ERP</title>
  <link rel="icon" type="image/png" href="../static/favicon.png">
  <link rel="stylesheet" href="../css/style.css?v=20260805g">
  <script src="../static/auth-guard.js"></script>
  <script defer src="../static/vendor/alpine-3.17.1.min.js"></script>
  <style>
    .page-wrap{padding:calc(var(--topbar-h) + 20px) 28px 60px calc(var(--sidebar-w) + 28px);max-width:1100px}
    .layout{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
    @media(max-width:900px){.layout{grid-template-columns:1fr}}
    .card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:20px 22px;margin-bottom:16px}
    .card-title{font-size:13px;font-weight:700;color:var(--text-secondary);letter-spacing:.05em;
                text-transform:uppercase;border-bottom:1px solid var(--border-light);padding-bottom:8px;margin-bottom:14px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
    .form-row.t3{grid-template-columns:1fr 1fr 1fr}
    .form-row.full{grid-template-columns:1fr}
    .form-group label{display:block;font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:4px}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:7px 10px;border:1px solid var(--border);
      border-radius:6px;font-size:13px;font-family:inherit;outline:none}
    .form-group input:focus,.form-group select:focus{border-color:var(--accent)}
    .form-group input[readonly]{background:var(--bg-secondary);color:var(--text-secondary)}
    /* 試算卡 */
    .calc-card{position:sticky;top:calc(var(--topbar-h) + 16px);background:#fff;
               border:1px solid var(--border);border-radius:10px;padding:20px 22px}
    .calc-card h3{font-size:14px;font-weight:700;margin-bottom:14px;color:var(--text-main)}
    .calc-row{display:flex;justify-content:space-between;align-items:baseline;
              padding:6px 0;border-bottom:1px solid var(--border-light);font-size:13px}
    .calc-row:last-child{border-bottom:none}
    .calc-row.net{font-weight:700;font-size:16px;color:var(--accent);padding-top:10px;margin-top:4px}
    .calc-row .label{color:var(--text-secondary)}
    .calc-row .val{font-family:LINE Seed TW_OTF, monospace}
    .calc-note{font-size:10px;color:var(--text-dim);margin-top:2px;text-align:right}
    .slip-no{font-family:LINE Seed TW_OTF, monospace;font-size:13px;color:var(--text-dim)}
    /* Contractor picker */
    .id-card-thumb{margin-top:10px;border:1px solid var(--border-light);border-radius:var(--radius-lg);
                   overflow:hidden;background:#f8f8f6}
    .id-card-thumb img{width:100%;max-height:160px;object-fit:contain;display:block}
    .id-card-thumb-label{font-size:11px;color:var(--text-dim);padding:4px 8px;
                         border-top:1px solid var(--border-light);background:#fafaf8}
    .con-drop{position:relative}
    .con-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);
              border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.1);z-index:50;max-height:200px;overflow-y:auto}
    .con-item{padding:8px 12px;cursor:pointer;font-size:13px}
    .con-item:hover,.con-item.active{background:var(--bg-hover)}
    .con-item small{display:block;font-size:11px;color:var(--text-dim)}
    .tag-union{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;
               background:#e8f5e9;color:#2e7d32;border:1px solid #c8e6c9;margin-left:6px}
    .save-bar{position:fixed;bottom:0;left:var(--sidebar-w);right:0;background:#fff;
              border-top:1px solid var(--border);padding:12px 28px;
              display:flex;align-items:center;gap:12px;z-index:100}
    .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
    .dot-dirty{background:var(--warning)}
    .dot-saved{background:var(--success)}
    input[type=checkbox]{width:auto !important}
    /* PDF Preview Modal */
    .pv-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:300;
                display:flex;align-items:center;justify-content:center;padding:16px}
    .pv-modal{background:#fff;border-radius:12px;width:min(900px,96vw);height:90vh;
              display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4)}
    .pv-head{display:flex;justify-content:space-between;align-items:center;
             padding:14px 20px;border-bottom:1px solid var(--border-light);flex-shrink:0}
    .pv-title{font-size:14px;font-weight:700;color:var(--text-primary)}
    .pv-sub{font-size:11px;color:var(--text-dim);margin-top:2px;font-family:LINE Seed TW_OTF, monospace}
    .pv-close{background:none;border:none;cursor:pointer;color:var(--text-dim);
              font-size:22px;line-height:1;padding:2px 8px;border-radius:4px;font-family:inherit}
    .pv-close:hover{background:var(--border-light);color:var(--text-primary)}
    .pv-body{flex:1;overflow:hidden;background:#525659;position:relative}
    .pv-spinner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
                justify-content:center;color:#ddd;font-size:13px;gap:10px}
    .pv-spinner svg{animation:spin 1.2s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .pv-iframe{width:100%;height:100%;border:none;display:block}
    .pv-foot{display:flex;justify-content:space-between;align-items:center;
             padding:12px 20px;border-top:1px solid var(--border-light);flex-shrink:0}
    .export-hist{font-size:11px;color:var(--text-dim)}
    .export-hist strong{color:var(--text-secondary);font-weight:600}
    /* Export log in calc card */
    .exp-log-item{display:flex;justify-content:space-between;font-size:11px;
                  color:var(--text-secondary);padding:3px 0;border-bottom:1px solid var(--border-light)}
    .exp-log-item:last-child{border-bottom:none}
  </style>
</head>
<body x-data="payslipForm()" x-init="init()">
<header id="app-topbar" class="topbar"></header>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<aside class="sidebar" id="app-sidebar"></aside>

<div class="page-wrap">
  <!-- 頁首 -->
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
    <div>
      <a href="payslips.html" style="font-size:12px;color:var(--accent);text-decoration:none">← 勞報單清單</a>
      <h1 style="font-size:18px;font-weight:700;color:var(--text-main);margin-top:4px">
        <span x-text="isNew ? '新增勞報單' : '編輯勞報單'"></span>
        <span class="slip-no" x-show="q.slipNo" x-text="'　' + q.slipNo"></span>
      </h1>
    </div>
  </div>

  <div class="layout">
    <!-- 左側表單 -->
    <div>
      <!-- 甲方 -->
      <div class="card">
        <div class="card-title">一、甲方（給付單位）</div>
        <div class="form-row">
          <div class="form-group">
            <label>公司名稱</label>
            <input type="text" x-model="q.companyName" @input="dirty()">
          </div>
          <div class="form-group">
            <label>統一編號</label>
            <input type="text" x-model="q.companyTaxId" @input="dirty()">
          </div>
        </div>
        <div class="form-row full">
          <div class="form-group">
            <label>聯絡資訊</label>
            <input type="text" x-model="q.companyContactInfo" @input="dirty()" placeholder="Tel / Email">
          </div>
        </div>
      </div>

      <!-- 乙方 -->
      <div class="card">
        <div class="card-title">二、乙方（受領報酬人）</div>
        <!-- 名冊選取 -->
        <div class="form-row full" style="margin-bottom:14px">
          <div class="form-group con-drop" @click.outside="showConDrop=false">
            <label>從名冊選取（可搜尋）</label>
            <input type="text" x-model="conSearch" @focus="filterCon()" @input="filterCon()"
                   placeholder="點擊或輸入姓名搜尋…" autocomplete="off">
            <div class="con-list" x-show="showConDrop && conFiltered.length">
              <template x-for="c in conFiltered" :key="c.id">
                <div class="con-item" @click="selectCon(c)">
                  <span x-text="c.name"></span>
                  <span class="tag-union" x-show="c.has_union_insurance">職業工會</span>
                  <small x-text="[c.id_number, c.phone, c.nationality].filter(Boolean).join(' | ')"></small>
                </div>
              </template>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>姓名 <span style="color:var(--danger)">*</span></label>
            <input type="text" x-model="q.contractorName" @input="dirty()">
          </div>
          <div class="form-group">
            <label>證件號碼</label>
            <input type="text" x-model="q.contractorIdNumber" @input="dirty()">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>電話</label>
            <input type="text" x-model="q.contractorPhone" @input="dirty()">
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" x-model="q.contractorEmail" @input="dirty()">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>國籍</label>
            <select x-model="q.contractorNationality" @change="calc();dirty()">
              <option>本國籍</option>
              <option>外國籍（滿183天）</option>
              <option>外國籍（未滿183天）</option>
            </select>
          </div>
          <div class="form-group" style="display:flex;align-items:center;gap:8px;padding-top:20px">
            <input type="checkbox" id="union" x-model="q.contractorHasUnionInsurance" @change="calc();dirty()" style="width:auto">
            <label for="union" style="margin:0;font-size:13px;cursor:pointer">已投保職業工會（免扣二代健保）</label>
          </div>
        </div>
        <div class="form-row full">
          <div class="form-group">
            <label>通訊地址</label>
            <input type="text" x-model="q.contractorAddress" @input="dirty()">
          </div>
        </div>
        <!-- 身分證影本預覽（從外包名冊讀取，唯讀） -->
        <div x-show="contractorIdCardFront || contractorIdCardBack" class="id-card-thumb">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:6px">
            <div x-show="contractorIdCardFront" style="text-align:center">
              <img :src="contractorIdCardFront" style="width:100%;max-height:110px;object-fit:contain">
              <div style="font-size:10px;color:var(--text-dim);margin-top:2px">正面</div>
            </div>
            <div x-show="contractorIdCardBack" style="text-align:center">
              <img :src="contractorIdCardBack" style="width:100%;max-height:110px;object-fit:contain">
              <div style="font-size:10px;color:var(--text-dim);margin-top:2px">反面</div>
            </div>
          </div>
          <div class="id-card-thumb-label">身分證影本（來自外包名冊，將輸出至 PDF）</div>
        </div>
        <div x-show="q.contractorId && !contractorIdCardFront && !contractorIdCardBack && !loadingIdCard"
             style="margin-top:8px;font-size:11px;color:var(--text-dim)">
          此承包商尚未上傳身分證影本，可至「外包名冊」補齊
        </div>
      </div>

      <!-- 勞務 -->
      <div class="card">
        <div class="card-title">三、勞務內容</div>
        <div class="form-row t3">
          <div class="form-group">
            <label>服務起始日</label>
            <input type="date" x-model="q.serviceStartDate" @change="dirty()">
          </div>
          <div class="form-group">
            <label>服務結束日</label>
            <input type="date" x-model="q.serviceEndDate" @change="dirty()">
          </div>
          <div class="form-group">
            <label>開單日期</label>
            <input type="date" x-model="q.slipDate" @change="dirty()">
          </div>
        </div>
        <div class="form-row full">
          <div class="form-group">
            <label>勞務內容 <span style="color:var(--danger)">*</span></label>
            <textarea x-model="q.serviceContent" rows="3" @input="dirty()" style="resize:vertical"
                      placeholder="描述提供的服務內容"></textarea>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>所得類別 <span style="color:var(--danger)">*</span></label>
            <select x-model="q.incomeType" @change="calc();dirty()">
              <option value="50">50－薪資所得</option>
              <option value="9A">9A－執行業務所得</option>
              <option value="9B">9B－稿費版稅演講鐘點費</option>
            </select>
          </div>
          <div class="form-group" x-show="q.incomeType === '9A'">
            <label>執行業務細項</label>
            <input list="9a-subtypes" type="text" x-model="q.incomeSubtype" @input="dirty()"
                   placeholder="如：[90] 其他執行業務">
            <datalist id="9a-subtypes">
              <option value="[10] 律師">
              <option value="[11] 會計師">
              <option value="[12] 建築師">
              <option value="[13] 技師">
              <option value="[14] 醫師">
              <option value="[15] 中醫師">
              <option value="[16] 牙醫師">
              <option value="[17] 藥師">
              <option value="[19] 著作人">
              <option value="[20] 經紀人">
              <option value="[21] 代書人">
              <option value="[22] 工匠">
              <option value="[23] 表演人">
              <option value="[25] 書畫家">
              <option value="[28] 不動產估價師">
              <option value="[29] 地政士">
              <option value="[30] 記帳士">
              <option value="[31] 專利代理人">
              <option value="[37] 獸醫師">
              <option value="[76] 演員歌手">
              <option value="[90] 其他執行業務">
            </datalist>
          </div>
        </div>
      </div>

      <!-- 金額 -->
      <div class="card">
        <div class="card-title">四、金額</div>
        <div class="form-row">
          <div class="form-group">
            <label>應付總額（新台幣） <span style="color:var(--danger)">*</span></label>
            <input type="number" min="0" step="1" x-model.number="q.grossAmount" @input="calc();dirty()"
                   placeholder="整數金額">
          </div>
        </div>
      </div>

      <!-- 付款方式 -->
      <div class="card">
        <div class="card-title">五、付款方式</div>
        <div class="form-row">
          <div class="form-group">
            <label>付款方式 <span style="color:var(--danger)">*</span></label>
            <select x-model="q.paymentMethod" @change="dirty()">
              <option>匯款</option>
              <option>現金</option>
            </select>
          </div>
        </div>
        <div x-show="q.paymentMethod === '匯款'">
          <div class="form-row t3">
            <div class="form-group">
              <label>銀行代碼</label>
              <input type="text" x-model="q.bankCode" @input="dirty()">
            </div>
            <div class="form-group">
              <label>銀行名稱</label>
              <input type="text" x-model="q.bankName" @input="dirty()">
            </div>
            <div class="form-group">
              <label>分行</label>
              <input type="text" x-model="q.bankBranch" @input="dirty()">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>戶名</label>
              <input type="text" x-model="q.bankAccountName" @input="dirty()">
            </div>
            <div class="form-group">
              <label>帳號</label>
              <input type="text" x-model="q.bankAccountNumber" @input="dirty()">
            </div>
          </div>
        </div>
      </div>

      <!-- 備注 -->
      <div class="card">
        <div class="card-title">六、備注</div>
        <div class="form-row full">
          <div class="form-group">
            <textarea x-model="q.remarks" rows="2" @input="dirty()" style="resize:vertical"
                      placeholder="其他說明（選填）"></textarea>
          </div>
        </div>
      </div>
    </div>

    <!-- 右側試算卡 -->
    <div>
      <div class="calc-card">
        <h3>即時試算結果</h3>
        <div class="calc-row">
          <span class="label">應付總額</span>
          <span class="val" x-text="fmt(q.grossAmount)"></span>
        </div>
        <div class="calc-row">
          <div>
            <div class="label">代扣所得稅</div>
            <div class="calc-note" x-text="taxNote"></div>
          </div>
          <span class="val" x-text="'− ' + fmt(result.taxWithheld)"></span>
        </div>
        <div class="calc-row">
          <div>
            <div class="label">二代健保補充保費</div>
            <div class="calc-note" x-text="nhiNote"></div>
          </div>
          <span class="val" x-text="'− ' + fmt(result.nhiSupplement)"></span>
        </div>
        <div class="calc-row net">
          <span class="label">實發金額</span>
          <span class="val" x-text="fmt(result.netAmount)"></span>
        </div>

        <div style="margin-top:18px;display:flex;flex-direction:column;gap:10px">
          <button class="btn btn-primary" style="width:100%;justify-content:center"
                  @click="save()" :disabled="saving">
            <span x-text="saving ? '儲存中…' : isDirty ? '儲存草稿' : '已儲存'"></span>
          </button>
          <button class="btn btn-ghost" style="width:100%;justify-content:center"
                  @click="previewPdf()" :disabled="previewFetching || !q.slipNo || isNew">
            <span x-text="previewFetching ? '準備預覽…' : '預覽 / 匯出 PDF'"></span>
          </button>
        </div>

        <div x-show="errMsg" style="color:var(--danger);font-size:12px;margin-top:10px;text-align:center" x-text="errMsg"></div>
        <div style="margin-top:12px;font-size:11px;color:var(--text-dim);text-align:center">
          稅率版本：<span x-text="rulesVersion"></span>年度
        </div>

        <!-- 匯出記錄 -->
        <div x-show="exportLog.length > 0"
             style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border-light)">
          <div style="font-size:11px;font-weight:600;color:var(--text-dim);letter-spacing:.06em;
                      text-transform:uppercase;margin-bottom:8px">
            匯出記錄（共 <span x-text="exportLog.length"></span> 次）
          </div>
          <template x-for="(log, i) in exportLog" :key="i">
            <div class="exp-log-item" style="align-items:center">
              <div>
                <div style="display:flex;align-items:center;gap:5px">
                  <span style="font-weight:500" x-text="log.by || '—'"></span>
                  <span x-show="log.redownload_of"
                        style="font-size:9px;padding:1px 4px;border-radius:3px;background:#e8edff;color:#4f6ef7;border:1px solid #c7d7ff"
                        x-text="'↩#' + log.redownload_of"></span>
                </div>
                <div style="font-family:LINE Seed TW_OTF, monospace;font-size:10px;color:var(--text-dim)"
                     x-text="(log.at||'').replace('T',' ').slice(0,16)"></div>
              </div>
              <button style="background:none;border:1px solid var(--border);border-radius:4px;
                             font-size:11px;padding:2px 8px;cursor:pointer;color:var(--accent);
                             font-family:inherit;white-space:nowrap"
                      @click="previewArchiveLog(log, i)" :disabled="!q.slipNo || isNew">預覽存檔</button>
            </div>
          </template>
          <div style="font-size:10px;color:var(--text-dim);margin-top:6px">
            ＊「預覽存檔」調閱當次存檔 PDF；「預覽 / 匯出 PDF」以當前資料重新產生
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- PDF 預覽 Modal -->
<div x-show="previewModal" x-cloak class="pv-overlay" @keydown.escape.window="closePreview()">
  <div class="pv-modal" @click.stop>
    <div class="pv-head">
      <div>
        <div class="pv-title">勞報單 PDF 預覽</div>
        <div class="pv-sub" x-text="q.slipNo + (q.contractorName ? '　' + q.contractorName : '')"></div>
      </div>
      <button class="pv-close" @click="closePreview()">×</button>
    </div>
    <div class="pv-body">
      <div class="pv-spinner" x-show="!previewIframeReady">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83
                   M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
        </svg>
        <span>PDF 載入中，請稍候…</span>
      </div>
      <iframe x-show="previewBlobUrl" :src="previewBlobUrl" class="pv-iframe"
              @load="previewIframeReady = true"></iframe>
    </div>
    <div class="pv-foot">
      <div class="export-hist">
        <template x-if="!previewArchiveMode">
          <span>
            <span x-show="exportLog.length === 0" style="color:var(--text-dim)">尚未匯出</span>
            <span x-show="exportLog.length > 0">
              已匯出 <strong x-text="exportLog.length"></strong> 次，
              最後：<span x-text="exportLog.length ? (exportLog[exportLog.length-1].by + '  ' + (exportLog[exportLog.length-1].at||'').replace('T',' ').slice(0,16)) : ''"></span>
            </span>
          </span>
        </template>
        <template x-if="previewArchiveMode">
          <span style="color:var(--text-dim)">
            調閱第 <strong x-text="previewArchiveIdx"></strong> 次存檔 PDF
          </span>
        </template>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-ghost" @click="closePreview()">關閉</button>
        <button x-show="!previewArchiveMode" class="btn btn-primary"
                @click="confirmExport()" :disabled="!previewIframeReady">
          確認匯出（下載 PDF）
        </button>
        <button x-show="previewArchiveMode" class="btn btn-primary"
                @click="downloadArchivePreview()" :disabled="!previewBlobUrl">
          下載此存檔
        </button>
      </div>
    </div>
  </div>
</div>

<script src="../static/notif.js"></script>
<script src="../static/sidebar.js"></script>
<script>
const API = '/api'
function payslipForm() {
  return {
    session: {},
    isNew: true,
    isDirty: false,
    saving: false,
    errMsg: '',
    contractors: [],
    conSearch: '',
    conFiltered: [],
    showConDrop: false,
    rules: null,
    rulesVersion: '2026',
    contractorIdCardFront: '',
    contractorIdCardBack: '',
    loadingIdCard: false,
    previewModal: false,
    previewBlobUrl: '',
    previewFetching: false,
    previewIframeReady: false,
    previewArchiveMode: false,
    previewArchiveIdx: null,
    exportCount: 0,
    exportLog: [],

    q: {
      slipNo: '',
      contractorId: null,
      companyName: '', companyTaxId: '', companyContactInfo: '',
      contractorName: '', contractorIdNumber: '', contractorPhone: '',
      contractorEmail: '', contractorAddress: '', contractorLineId: '',
      contractorNationality: '本國籍', contractorHasUnionInsurance: false,
      serviceContent: '', serviceStartDate: '', serviceEndDate: '',
      incomeType: '9A', incomeSubtype: '',
      slipDate: new Date().toISOString().slice(0, 10),
      grossAmount: 0, paymentMethod: '匯款',
      bankCode: '', bankName: '', bankBranch: '',
      bankAccountName: '', bankAccountNumber: '',
      remarks: '',
      status: '草稿'
    },

    result: { taxWithheld: 0, nhiSupplement: 0, netAmount: 0, taxRate: 0, nhiRate: 0 },

    get taxNote() {
      const r = this.result
      if (r.taxWithheld > 0) {
        const pct = (r.taxRate * 100).toFixed(0) + '%'
        return (this.q.contractorNationality === '外國籍（未滿183天）')
          ? `非居住者，代扣繳 ${pct}`
          : `達起扣門檻，代扣繳 ${pct}`
      }
      return '未達起扣門檻，免扣繳'
    },

    get nhiNote() {
      if (this.q.contractorHasUnionInsurance) return '職業工會投保，免扣繳'
      const r = this.result
      if (r.nhiSupplement > 0) return `代扣 ${(r.nhiRate * 100).toFixed(2)}%`
      return '未達門檻，免扣繳'
    },

    fmt(n) { return 'NT$ ' + (Math.round(n || 0)).toLocaleString() },

    calc() {
      if (!this.rules) return
      const rules = this.rules
      const gross = parseInt(this.q.grossAmount) || 0
      const itype = this.q.incomeType
      const nat   = this.q.contractorNationality
      const union = this.q.contractorHasUnionInsurance

      const isResident = nat !== '外國籍（未滿183天）'
      let taxWithheld = 0, taxRate = 0

      if (isResident) {
        const r = rules.resident[itype]
        if (gross >= r.tax_threshold) { taxRate = r.tax_rate; taxWithheld = Math.floor(gross * taxRate) }
      } else {
        const r = rules.non_resident[itype]
        if (gross >= (r.tax_threshold || 0)) {
          if (r.low_salary_rate != null) {
            taxRate = gross <= rules.minimum_wage.monthly * 1.5 ? r.low_salary_rate : r.tax_rate
          } else { taxRate = r.tax_rate }
          taxWithheld = Math.floor(gross * taxRate)
        }
      }

      let nhiSupplement = 0, nhiRate = 0
      if (!union) {
        const th = rules.nhi.thresholds[itype]
        if (gross >= th) {
          nhiRate = rules.nhi.rate
          nhiSupplement = Math.round(Math.min(gross, rules.nhi.max_single_payment) * nhiRate)
        }
      }

      this.result = { taxWithheld, nhiSupplement, taxRate, nhiRate, netAmount: gross - taxWithheld - nhiSupplement }
    },

    dirty() { this.isDirty = true },

    filterCon() {
      const q = this.conSearch.toLowerCase().trim()
      this.conFiltered = q
        ? this.contractors.filter(c => c.name.toLowerCase().includes(q))
        : this.contractors
      this.showConDrop = true
    },

    async selectCon(c) {
      this.q.contractorId               = c.id || null
      this.q.contractorName             = c.name
      this.q.contractorIdNumber         = c.id_number || ''
      this.q.contractorPhone            = c.phone || ''
      this.q.contractorEmail            = c.email || ''
      this.q.contractorAddress          = c.address || ''
      this.q.contractorLineId           = c.line_id || ''
      this.q.contractorNationality      = c.nationality || '本國籍'
      this.q.contractorHasUnionInsurance= c.has_union_insurance || false
      this.q.bankCode                   = c.bank_code || ''
      this.q.bankName                   = c.bank_name || ''
      this.q.bankBranch                 = c.bank_branch || ''
      this.q.bankAccountName            = c.bank_account_name || ''
      this.q.bankAccountNumber          = c.bank_account_number || ''
      this.conSearch = c.name
      this.showConDrop = false
      this.calc()
      this.dirty()
      // Fetch ID card preview
      if (c.id) {
        this.loadingIdCard = true
        this.contractorIdCardFront = ''
        this.contractorIdCardBack  = ''
        try {
          const r = await fetch(`${API}/contractors/${c.id}/id-card`, {
            headers: { Authorization: 'Bearer ' + this.session.token }
          })
          if (r.ok) {
            const d = await r.json()
            this.contractorIdCardFront = d.image_front || ''
            this.contractorIdCardBack  = d.image_back  || ''
          }
        } catch(e) {}
        this.loadingIdCard = false
      }
    },

    async init() {
      const s = localStorage.getItem('motrix_session')
      if (!s) { window.location.href = 'login.html'; return }
      this.session = JSON.parse(s)
      const mods = this.session.modules || []
      if (this.session.role !== 'superadmin' && !mods.includes('payslip')) {
        alert('此頁面僅限最高權限使用者或具有「勞報單」模組授權的使用者存取'); window.history.back(); return
      }

      // Load tax rules
      try {
        const r = await fetch(`${API}/tax-rules`, { headers: { Authorization: 'Bearer ' + this.session.token } })
        if (r.ok) { this.rules = await r.json(); this.rulesVersion = this.rules.version || '2026' }
      } catch(e) {}

      // Load contractors list
      try {
        const r = await fetch(`${API}/contractors`, { headers: { Authorization: 'Bearer ' + this.session.token } })
        if (r.ok) this.contractors = await r.json()
      } catch(e) {}
      this.conFiltered = this.contractors

      // Load company profile
      try {
        const r = await fetch(`${API}/settings/company-profile`, { headers: { Authorization: 'Bearer ' + this.session.token } })
        if (r.ok) {
          const cp = await r.json()
          if (!this.q.companyName) this.q.companyName = cp.name || ''
          if (!this.q.companyTaxId) this.q.companyTaxId = cp.tax_id || ''
          if (!this.q.companyContactInfo) this.q.companyContactInfo = cp.contact_info || ''
        }
      } catch(e) {}

      // Load existing if editing
      const editNo = new URLSearchParams(window.location.search).get('id')
      if (editNo) {
        this.isNew = false
        try {
          const r = await fetch(`${API}/payslips/${editNo}`, { headers: { Authorization: 'Bearer ' + this.session.token } })
          if (r.ok) {
            const row = await r.json()
            Object.assign(this.q, row.data)
            this.exportCount = row.export_count || 0
            this.exportLog   = JSON.parse(row.export_log || '[]')
            this.conSearch = this.q.contractorName || ''
            // Restore contractor_id from saved data and load ID card preview
            if (this.q.contractorId) {
              try {
                const ir = await fetch(`${API}/contractors/${this.q.contractorId}/id-card`, {
                  headers: { Authorization: 'Bearer ' + this.session.token }
                })
                if (ir.ok) {
                  const id = await ir.json()
                  this.contractorIdCardFront = id.image_front || ''
                  this.contractorIdCardBack  = id.image_back  || ''
                }
              } catch(e) {}
            }
          }
        } catch(e) {}
      } else {
        // Peek next slip_no
        try {
          const r = await fetch(`${API}/next-slip-no`, { headers: { Authorization: 'Bearer ' + this.session.token } })
          if (r.ok) this.q.slipNo = (await r.json()).slip_no
        } catch(e) {}
      }

      this.calc()
    },

    async save() {
      if (!this.q.contractorName.trim()) { this.errMsg = '受領人姓名為必填'; return }
      if (!this.q.serviceContent.trim()) { this.errMsg = '勞務內容為必填'; return }
      if (!this.q.grossAmount || this.q.grossAmount <= 0) { this.errMsg = '應付總額需大於 0'; return }
      this.saving = true
      this.errMsg = ''
      try {
        const payload = {
          slip_no: this.q.slipNo,
          contractor_id: this.q.contractorId || null,
          data: { ...this.q, calc: this.result }
        }
        const method = this.isNew ? 'POST' : 'PUT'
        const url = this.isNew ? `${API}/payslips` : `${API}/payslips/${this.q.slipNo}`
        const r = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.session.token },
          body: JSON.stringify(payload)
        })
        if (!r.ok) { this.errMsg = await r.text(); this.saving = false; return }
        const d = await r.json()
        if (d.slip_no && d.slip_no !== this.q.slipNo) {
          this.q.slipNo = d.slip_no
          history.replaceState(null, '', '?id=' + d.slip_no)
        }
        // Update calc from backend response
        if (d.calc) this.result = d.calc
        this.isNew = false
        this.isDirty = false
        this.q.status = this.q.status || '草稿'
      } catch(e) { this.errMsg = '儲存失敗：' + e.message }
      this.saving = false
    },

    async previewPdf() {
      if (!this.q.slipNo || this.isNew) { this.errMsg = '請先儲存草稿再預覽'; return }
      if (this.isDirty) { await this.save(); if (this.errMsg) return }
      this.previewFetching = true
      this.errMsg = ''
      try {
        const r = await fetch(`${API}/payslips/${this.q.slipNo}/pdf-download`, {
          headers: { Authorization: 'Bearer ' + this.session.token }
        })
        if (!r.ok) { this.errMsg = 'PDF 產生失敗：' + await r.text(); this.previewFetching = false; return }
        const blob = await r.blob()
        this.previewBlobUrl = URL.createObjectURL(blob)
        this.previewIframeReady = false
        this.previewModal = true
      } catch(e) { this.errMsg = '載入失敗：' + e.message }
      this.previewFetching = false
    },

    async confirmExport() {
      if (!this.previewBlobUrl) return
      const a = document.createElement('a')
      a.href = this.previewBlobUrl
      a.download = `勞報單_${this.q.contractorName}_${this.q.slipDate || this.q.slipNo}.pdf`
      a.click()
      try {
        const r = await fetch(`${API}/payslips/${this.q.slipNo}/export`, {
          method: 'POST', headers: { Authorization: 'Bearer ' + this.session.token }
        })
        if (r.ok) {
          const d = await r.json()
          this.exportCount = d.export_count
          const now = new Date().toISOString()
          this.exportLog.push({
            at: now,
            by: this.session.display_name || this.session.username,
            idx: d.export_count,
            archived: true
          })
          this.q.status = '已匯出'
        }
      } catch(e) {}
      this.closePreview()
    },

    async previewArchiveLog(log, i) {
      const idx = log.redownload_of || log.idx || (i + 1)
      this.previewArchiveMode = true
      this.previewArchiveIdx = idx
      this.previewFetching = true
      this.errMsg = ''
      try {
        const r = await fetch(`${API}/payslips/${this.q.slipNo}/archive/${idx}`, {
          headers: { Authorization: 'Bearer ' + this.session.token }
        })
        if (!r.ok) { this.errMsg = 'PDF 載入失敗：' + await r.text(); this.previewFetching = false; return }
        const blob = await r.blob()
        this.previewBlobUrl = URL.createObjectURL(blob)
        this.previewIframeReady = false
        this.previewModal = true
      } catch(e) { this.errMsg = '載入失敗：' + e.message }
      this.previewFetching = false
    },

    async downloadArchivePreview() {
      if (!this.previewBlobUrl) return
      const idx = this.previewArchiveIdx
      const a = document.createElement('a')
      a.href = this.previewBlobUrl
      a.download = `勞報單_${this.q.contractorName}_${this.q.slipDate||this.q.slipNo}_第${idx}次.pdf`
      a.click()
      try {
        const r = await fetch(`${API}/payslips/${this.q.slipNo}/archive/${idx}/record`, {
          method: 'POST', headers: { Authorization: 'Bearer ' + this.session.token }
        })
        if (r.ok) {
          const d = await r.json()
          this.exportCount = d.export_count
          // 重新讀取 exportLog 以顯示新紀錄
          const fr = await fetch(`${API}/payslips/${this.q.slipNo}`, {
            headers: { Authorization: 'Bearer ' + this.session.token }
          })
          if (fr.ok) { const fd = await fr.json(); this.exportLog = JSON.parse(fd.export_log || '[]') }
        }
      } catch(e) {}
    },

    closePreview() {
      if (this.previewBlobUrl) { URL.revokeObjectURL(this.previewBlobUrl); this.previewBlobUrl = '' }
      this.previewModal = false
      this.previewIframeReady = false
      this.previewArchiveMode = false
      this.previewArchiveIdx = null
    },
  }
}
</script>
</body>
</html>
