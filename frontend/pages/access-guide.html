<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{if(localStorage.getItem('motrix_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../static/favicon.png">
  <title>門禁系統選型導覽 — MOTRIX 專案管理系統</title>
  <script src="../static/auth-guard.js"></script>
  <script defer src="../static/vendor/alpine-3.17.1.min.js"></script>
  <link rel="stylesheet" href="../css/style.css?v=20260805g">
  <style>
    [x-cloak]{display:none!important}
    .page-main{margin-left:var(--sidebar-w);margin-top:var(--topbar-h);padding:0;min-height:calc(100vh - var(--topbar-h));overflow:hidden;background:var(--white)}
    /* 2026-09-14：工具列最左加一條直立紅色標記（官網 28×3 的緊湊變體）。
   這頁的 body 高度是 calc(100vh - topbar - 48px) 算死的，插完整標頭會破掉。 */
    .ag-toolbar{height:48px;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--border-light);background:#fff}
    .ag-toolbar::before{content:'';width:var(--v4-mark-h);height:18px;background:var(--accent);flex:none}
    /* 標題與副標原本擠在同一行，讀起來像一句跑掉的話；改成上下兩層 */
    .ag-toolbar .tb-head{display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:0}
    .ag-toolbar .ttl{font-size:14px;font-weight:700;color:var(--text-primary)}
    .ag-toolbar .sub{font-size:11px;color:var(--text-dim)}
    .ag-body{height:calc(100vh - var(--topbar-h) - 48px);overflow:auto;padding:20px 24px}

    /* 情境選擇方塊 */
    .fam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:20px}
    .fam-tile{border:1px solid var(--border-light);border-radius:var(--radius-lg);background:#fff;padding:16px 18px;cursor:pointer;transition:all .15s;text-align:left}
    .fam-tile:hover{border-color:var(--accent);box-shadow:var(--shadow-sm)}
    .fam-tile.active{border-color:var(--accent);background:var(--accent-light)}
    .gen-card-highlight{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light),var(--shadow-sm);animation:catFlash 1.6s ease-in-out 1}
    @keyframes catFlash{0%{background:var(--accent-light)}100%{background:#fff}}
    .fam-tile .fname{font-size:15px;font-weight:700;color:var(--text-primary);margin-bottom:4px}
    .fam-tile .fdesc{font-size:12px;color:var(--text-secondary);line-height:1.5}

    .view-tabs{display:flex;gap:6px;margin-bottom:16px}

    /* 分類卡片（依適配度排序） */
    .gen-row{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px}
    .gen-card{flex:0 0 340px;border:1px solid var(--border-light);border-radius:var(--radius-lg);background:#fff;box-shadow:var(--shadow-sm);overflow:hidden;display:flex;flex-direction:column}
    .gen-card .gh{padding:14px 16px;border-bottom:1px solid var(--border-light);background:#FAFAF8;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .gen-card .gh .gname{font-size:15px;font-weight:700;color:var(--text-primary)}
    .fit-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:10px;white-space:nowrap}
    .fit-badge.fit-good{background:#E6F4EA;color:#1E7E34}
    .fit-badge.fit-ok{background:#FFF3D6;color:#8A5A00}
    .fit-badge.fit-bad{background:#FBE7E7;color:#B3261E}
    .gen-card .gb{padding:14px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
    .gen-field .gl{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-dim);font-weight:700;margin-bottom:3px}
    .gen-field .gv{font-size:12.5px;color:var(--text-primary);line-height:1.5}
    .gen-field.warn .gv{color:var(--warning);background:var(--warning-light);padding:6px 8px;border-radius:var(--radius);font-size:12px}
    .gen-field.dep .gv{color:var(--accent);background:var(--accent-light);padding:6px 8px;border-radius:var(--radius);font-size:12px}
    .gen-field.fitnote .gv{background:#FAFAF8;padding:6px 8px;border-radius:var(--radius);font-size:12px;border-left:3px solid var(--accent)}
    .gen-price{font-size:13px;font-weight:700;color:var(--success);font-family:var(--font-en)}
    .gen-products{border-top:1px dashed var(--border-light);padding-top:10px;margin-top:2px}
    .prod-item{display:flex;align-items:flex-start;gap:6px;padding:6px 0;font-size:12px;border-bottom:1px solid #F5F4F0}
    .prod-item:last-child{border-bottom:none}
    .prod-item .psel{margin-top:3px}
    .prod-item-body{flex:1;min-width:0}
    .prod-item-name{display:flex;gap:5px;flex-wrap:wrap;align-items:baseline}
    .prod-item-name b{color:var(--text-primary);white-space:nowrap}
    .prod-item-name a{color:var(--accent);text-decoration:none;font-size:12px;overflow-wrap:break-word}
    .prod-item-name a:hover{text-decoration:underline}
    .prod-item .pnote{display:block;color:var(--text-dim);font-size:11px;margin-top:2px;line-height:1.4}
    .prod-specs{margin-top:6px;padding:8px 10px;background:#FAFAF8;border:1px solid #F0EEE9;border-radius:var(--radius);display:flex;flex-direction:column;gap:4px}
    .prod-specs .spec-row{display:flex;gap:8px;font-size:11.5px;line-height:1.45}
    .prod-specs .sk{color:var(--text-dim);font-weight:600;white-space:nowrap;flex:0 0 auto;min-width:6.2em}
    .prod-specs .sv{color:var(--text-primary);flex:1;min-width:0}
    .prod-specs-empty{margin-top:4px;font-size:11px;color:var(--text-dim)}
    .empty-hint{text-align:center;color:var(--text-dim);font-size:13px;padding:60px 0}
    .gen-products .ghead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;gap:6px}
    .gen-products .ghead-actions{display:flex;align-items:center;gap:6px;margin-left:auto}
    .sel-hint{font-size:10px;color:var(--text-dim);white-space:nowrap}
    .sel-link{font-size:10px;color:var(--accent);cursor:pointer;text-decoration:underline;white-space:nowrap;background:none;border:none;padding:0}
    .prod-item .psel{width:13px;height:13px;accent-color:var(--accent);cursor:pointer;flex:none}
    .prod-search{position:relative;margin-bottom:6px}
    .prod-search input{width:100%;box-sizing:border-box;padding:5px 26px 5px 8px;font-size:11.5px;font-family:inherit;border:1px solid var(--border-light);border-radius:var(--radius);outline:none;background:#fff;color:var(--text-primary)}
    .prod-search input:focus{border-color:var(--accent)}
    .prod-search .clr{position:absolute;right:5px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--text-dim);cursor:pointer;font-size:13px;line-height:1;padding:2px}
    .prod-search .clr:hover{color:var(--danger)}
    .prod-noresult{color:var(--text-dim);font-size:11px;padding:6px 0}

    /* 全域搜尋（型號／品牌，跨分類直接篩出符合結果） */
    .gsearch-box{position:relative}
    .gsearch-box input{width:230px;box-sizing:border-box;padding:6px 26px 6px 10px;font-size:12.5px;font-family:inherit;border:1px solid var(--border-light);border-radius:var(--radius);outline:none;background:#fff;color:var(--text-primary)}
    .gsearch-box input:focus{border-color:var(--accent)}
    .gsearch-clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--text-dim);cursor:pointer;font-size:13px;line-height:1;padding:2px}
    .gsearch-clr:hover{color:var(--danger)}

    /* 規格比較表 */
    .compare-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:8px 12px;background:#FAFAF8;border:1px solid var(--border-light);border-radius:var(--radius)}
    .compare-toggle{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--text-primary);user-select:none}
    .compare-toggle input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
    .compare-hint{font-size:11.5px;color:var(--text-dim)}
    .compare-legend{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-dim)}
    .compare-legend .swatch{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--success-light,#E6F4EA);border:1px solid var(--success)}
    .compare-box{max-height:92vh;overflow:hidden;display:flex;flex-direction:column}
    .compare-wrap{overflow:auto;flex:1;min-height:0;border:1px solid var(--border-light);border-radius:var(--radius-lg)}
    table.compare{border-collapse:separate;border-spacing:0;font-size:12.5px;width:100%}
    table.compare th, table.compare td{padding:9px 12px;text-align:left;vertical-align:top;white-space:nowrap;border-bottom:1px solid #F0EEE9;border-right:1px solid #F5F4F0}
    table.compare th{background:#FAFAF8;font-size:11px;color:var(--text-dim);font-weight:700;position:sticky;top:0;z-index:2;border-bottom:2px solid var(--border-light)}
    table.compare th.speckeyhead{left:0;z-index:3;background:#FAFAF8}
    table.compare th.prodcol{white-space:normal;min-width:220px;vertical-align:bottom;padding-top:14px;padding-bottom:14px;border-top:3px solid var(--accent)}
    table.compare th.prodcol .pbrand{display:block;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-dim);font-weight:700}
    table.compare th.prodcol a{color:var(--text-primary);font-weight:700;text-decoration:none;font-size:15px;display:block;margin:3px 0 8px;line-height:1.3}
    table.compare th.prodcol a:hover{color:var(--accent);text-decoration:underline}
    table.compare th.prodcol .pprice{display:inline-block;color:var(--success);font-weight:700;font-size:13px;background:var(--success-light,#E6F4EA);padding:4px 10px;border-radius:10px}
    table.compare tbody tr:nth-child(even) td{background:#FBFBFA}
    table.compare tbody tr:hover td{background:var(--accent-light)}
    table.compare tbody tr:hover td.speckey{background:var(--accent-light)}
    table.compare td.speckey{font-weight:700;color:var(--text-primary);background:#FAFAF8;white-space:normal;position:sticky;left:0;z-index:1;min-width:11em}
    table.compare td.best{background:var(--success-light,#E6F4EA)}
    table.compare td.best .val{color:var(--success);font-weight:700}
    table.compare td .best-icon{color:var(--success);font-weight:700;margin-right:4px;font-size:10px}
    table.compare td.uniform-cell{color:var(--text-dim)}

    /* 規格 key-value 編輯器（管理模式） */
    .spec-rows{display:flex;flex-direction:column;gap:6px}
    .spec-row{display:flex;gap:6px;align-items:center}
    .spec-row .field-input{flex:1}
    .spec-row .rmbtn{border:1px solid var(--border-light);background:#fff;color:var(--danger);font-size:11px;padding:6px 8px;border-radius:var(--radius);cursor:pointer;white-space:nowrap}
    .spec-row .rmbtn:hover{border-color:var(--danger)}

    /* 對照矩陣 */
    .matrix-wrap{overflow-x:auto}
    table.matrix{border-collapse:collapse;font-size:12px;width:100%}
    table.matrix th, table.matrix td{border:1px solid var(--border-light);padding:8px 10px;text-align:center;vertical-align:middle}
    table.matrix th{background:#FAFAF8;font-size:11px;color:var(--text-dim);font-weight:700}
    table.matrix td.rowhead{text-align:left;font-weight:700;color:var(--text-primary);background:#FAFAF8;white-space:nowrap}
    table.matrix td.cell{cursor:pointer}
    table.matrix td.cell:hover{outline:2px solid var(--accent);outline-offset:-2px}

    /* 管理模式 */
    .mpanel{border:1px solid var(--border-light);border-radius:var(--radius-lg);background:#fff;margin-bottom:18px;overflow:hidden;box-shadow:var(--shadow-sm)}
    .mpanel .mhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border-light);background:#FAFAF8}
    .mpanel .mhead b{font-size:13px;color:var(--text-primary)}
    .mpanel .mhead .n{font-size:11px;color:var(--text-dim);font-family:var(--font-en)}
    .mtwrap{overflow-x:auto}
    table.mtable{width:100%;border-collapse:collapse;font-size:12px}
    table.mtable th{text-align:left;padding:8px 12px;color:var(--text-dim);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--border-light);background:#fff;white-space:nowrap}
    table.mtable td{padding:8px 12px;border-bottom:1px solid #F0EEE9;vertical-align:top}
    table.mtable tr:hover td{background:#FAFAF8}
    table.mtable td.empty-row{text-align:center;color:var(--text-dim);padding:16px}

    /* Modal（沿用 MOTRIX 標準樣式） */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center}
    .modal-box{background:#fff;border:1px solid var(--border-light);color:var(--text-primary);border-radius:var(--radius-lg);padding:22px 26px;width:560px;max-width:95vw;max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg)}
    .modal-title{font-size:15px;font-weight:700;margin-bottom:16px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .field-row{margin-bottom:0}
    .field-label{font-size:11px;color:var(--text-secondary);margin-bottom:4px;font-weight:600}
    .field-input{width:100%;padding:7px 10px;border:1px solid var(--border-light);border-radius:var(--radius);font-size:13px;font-family:inherit;outline:none;box-sizing:border-box;background:#fff;color:var(--text-primary)}
    .field-input:focus{border-color:var(--accent)}
    textarea.field-input{resize:vertical;min-height:2.4em}
    .modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  </style>
</head>
<body x-data="app()" x-init="init()" x-cloak>

  <header id="app-topbar" class="topbar"></header>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- 側欄必須是 <body> 的直接子元素：深色模式的反轉濾鏡排除清單只認直接子元素
       （style.css「DARK MODE」區塊的 body > *:not(.sidebar)），包進 .app-shell
       裡會連同整個側欄一起被反轉成白底，且 position:fixed 會改以該容器定位。 -->
  <aside class="sidebar" id="app-sidebar"></aside>

  <div class="app-shell">
    <main class="page-main">

      <div class="ag-toolbar">
        <div class="tb-head"><span class="ttl">門禁系統選型導覽</span><span class="sub">場域情境 · 元件分類適配 · 產品連結</span></div>
        <div style="margin-left:auto;display:flex;align-items:center;gap:10px">
          <div class="gsearch-box">
            <input type="text" placeholder="搜尋型號／品牌…" x-model="globalSearch" @input="if(globalSearch.trim()) browseView='scenario'">
            <button class="gsearch-clr" x-show="globalSearch" @click="globalSearch=''">✕</button>
          </div>
          <button class="mibtn" :class="mode==='browse' ? 'pri' : ''" @click="mode='browse'">瀏覽</button>
          <button class="mibtn" :class="mode==='manage' ? 'pri' : ''" x-show="canEdit" @click="mode='manage'">管理</button>
        </div>
      </div>

      <!-- ══════ 瀏覽模式 ══════ -->
      <div class="ag-body" x-show="mode==='browse'">

        <div class="view-tabs">
          <button class="mibtn" :class="browseView==='scenario' ? 'pri' : ''" @click="browseView='scenario'">依情境查看</button>
          <button class="mibtn" :class="browseView==='matrix' ? 'pri' : ''" @click="browseView='matrix'">對照矩陣總覽</button>
        </div>

        <!-- 依情境查看 -->
        <template x-if="browseView==='scenario'">
          <div>
            <div class="fam-grid">
              <template x-for="s in scenarios" :key="s.code">
                <button class="fam-tile" :class="activeScenario===s.code ? 'active' : ''" @click="activeScenario=s.code">
                  <div class="fname" x-text="s.name"></div>
                  <div class="fdesc" x-text="s.description"></div>
                </button>
              </template>
            </div>

            <template x-if="!activeScenario">
              <div class="empty-hint">請點選上方一個場域情境，查看各產品分類的適配度</div>
            </template>

            <template x-if="activeScenario && globalSearch.trim() && categoriesRankedFor(activeScenario).length===0">
              <div class="empty-hint">查無符合「<span x-text="globalSearch"></span>」的型號／品牌</div>
            </template>

            <template x-if="activeScenario">
              <div class="gen-row">
                <template x-for="c in categoriesRankedFor(activeScenario)" :key="c.code">
                  <div class="gen-card" :id="'cat-' + c.code" :class="highlightCategory===c.code ? 'gen-card-highlight' : ''">
                    <div class="gh">
                      <div class="gname" x-text="c.name"></div>
                      <span class="fit-badge" :class="fitBadgeClass(fitFor(activeScenario, c.code).fit_level)" x-text="fitFor(activeScenario, c.code).fit_level || '—'"></span>
                    </div>
                    <div class="gb">
                      <div class="gen-field fitnote" x-show="fitFor(activeScenario, c.code).fit_note">
                        <div class="gl">情境判斷</div><div class="gv" x-text="fitFor(activeScenario, c.code).fit_note"></div>
                      </div>
                      <div class="gen-field"><div class="gl">核心規格</div><div class="gv" x-text="c.key_specs||'—'"></div></div>
                      <div class="gen-field"><div class="gl">建議售價區間</div><div class="gen-price" x-text="c.price_range||'—'"></div></div>
                      <div class="gen-field dep" x-show="c.dependency_note"><div class="gl">依賴／相關</div><div class="gv" x-text="c.dependency_note"></div></div>
                      <div class="gen-field warn" x-show="c.watch_note"><div class="gl">注意事項</div><div class="gv" x-text="c.watch_note"></div></div>
                      <div class="gen-products">
                        <div class="ghead">
                          <div class="gl" style="font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-dim);font-weight:700">對應產品</div>
                          <div class="ghead-actions" x-show="productsFor(c.code).length>1">
                            <span class="sel-hint" x-text="selectedCountFor(c.code) + ' 已選'"></span>
                            <button class="sel-link" @click="selectAllFor(c.code, filteredProductsFor(c.code))">全選</button>
                            <button class="sel-link" @click="clearSelectionFor(c.code)">清除</button>
                            <button class="mibtn" @click="compareShowUniform=false; specsCompareCategoryCode=c.code" style="font-size:10px;padding:3px 8px">
                              <span x-text="selectedCountFor(c.code)>=2 ? '比較所選（'+selectedCountFor(c.code)+'）' : '規格比較（全部）'"></span>
                            </button>
                          </div>
                        </div>
                        <div class="prod-search" x-show="productsFor(c.code).length>3 && !globalSearch.trim()">
                          <input type="text" placeholder="搜尋型號／規格，如「8」「PoE」「24」" x-model="productSearch[c.code]">
                          <button class="clr" x-show="productSearch[c.code]" @click="productSearch[c.code]=''">✕</button>
                        </div>
                        <template x-for="p in filteredProductsFor(c.code)" :key="p.id">
                          <div class="prod-item">
                            <input type="checkbox" class="psel" :checked="isSelected(c.code, p.id)" @change="toggleSelect(c.code, p.id)">
                            <div class="prod-item-body">
                              <div class="prod-item-name">
                                <b x-text="p.brand"></b>
                                <a :href="p.url" target="_blank" rel="noopener" x-text="p.model"></a>
                              </div>
                              <span class="pnote" x-text="p.price_note"></span>
                              <div class="prod-specs" x-show="parseSpecs(p).length>0">
                                <template x-for="[k,v] in parseSpecs(p)" :key="k">
                                  <div class="spec-row"><span class="sk" x-text="k"></span><span class="sv" x-text="v"></span></div>
                                </template>
                              </div>
                              <div class="prod-specs-empty" x-show="parseSpecs(p).length===0">尚未填寫技術規格</div>
                            </div>
                          </div>
                        </template>
                        <div x-show="productsFor(c.code).length===0" style="color:var(--text-dim);font-size:11px">尚無對應產品</div>
                        <div class="prod-noresult" x-show="productsFor(c.code).length>0 && filteredProductsFor(c.code).length===0">
                          查無符合「<span x-text="productSearch[c.code]"></span>」的產品
                        </div>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>

        <!-- 對照矩陣總覽 -->
        <template x-if="browseView==='matrix'">
          <div class="matrix-wrap">
            <table class="matrix">
              <thead>
                <tr>
                  <th style="text-align:left">分類 ＼ 情境</th>
                  <template x-for="s in scenarios" :key="s.code">
                    <th x-text="s.name"></th>
                  </template>
                </tr>
              </thead>
              <tbody>
                <template x-for="c in categories" :key="c.code">
                  <tr>
                    <td class="rowhead" x-text="c.name"></td>
                    <template x-for="s in scenarios" :key="s.code">
                      <td class="cell" @click="activeScenario=s.code; browseView='scenario'" :title="fitFor(s.code, c.code).fit_note">
                        <span class="fit-badge" :class="fitBadgeClass(fitFor(s.code, c.code).fit_level)" x-text="fitFor(s.code, c.code).fit_level || '—'"></span>
                      </td>

                    <span class="best-icon" x-show="isBestInRow(compareProducts(), key, p)">▲</span>
                    <span :class="isBestInRow(compareProducts(), key, p) ? 'val' : ''" x-text="specValue(p, key)"></span>

            </tr>

              <td colspan="99" style="text-align:center;color:var(--text-dim)">這些產品的規格完全相同，沒有差異項目（取消上方選項可查看全部）</td>

  <script>
  const API = '/api'
  function app() {
    return {
      session: {}, canEdit: false, mode: 'browse', browseView: 'scenario', activeScenario: null, specsCompareCategoryCode: null, compareShowUniform: false, selectedProductIds: {}, productSearch: {}, highlightCategory: null, globalSearch: '',
      scenarios: [], categories: [], fits: [], products: [],
      modal: { show:false, kind:'scenario', id:null, code:'', name:'', description:'',
               keySpecs:'', tags:'', priceRange:'', dependencyNote:'', watchNote:'',
               scenarioCode:'', categoryCode:'', fitLevel:'可用', fitNote:'',
               brand:'', model:'', url:'', label:'', priceNote:'', specs:[], saving:false, error:'' },

      async init() {
        const s = JSON.parse(localStorage.getItem('motrix_session') || '{}')
        if (!s.token) { location.href = 'login.html'; return }
        this.session = s
        const mods = Array.isArray(s.modules) ? s.modules : []
        this.canEdit = s.role === 'superadmin' || mods.indexOf('access_guide_edit') >= 0
        try {
          const r = await fetch(`${API}/auth/me`, { headers: { Authorization: 'Bearer ' + s.token } })
          if (!r.ok) { location.href = 'login.html'; return }
        } catch {}
        await this.loadAll()
        if (this.scenarios.length) this.activeScenario = this.scenarios[0].code
        this.applyDeepLink()
      },

      // 從「涵蓋度總覽」頁點選類別／品牌連結過來時，定位到對應分類卡片並帶入品牌篩選
      applyDeepLink() {
        const params = new URLSearchParams(location.search)
        const catParam = params.get('category')
        const brandParam = params.get('brand')
        if (!catParam || !this.categories.find(c => c.code === catParam)) return
        this.browseView = 'scenario'
        this.highlightCategory = catParam
        if (brandParam) this.productSearch[catParam] = brandParam
        // topbar/sidebar 為非同步注入，會在頁面載入後才觸發一次版面重排，
        // 太早捲動會被那次重排打斷、把捲動位置沖回原點，因此延後並補一次保險捲動
        const doScroll = () => {
          const el = document.getElementById('cat-' + catParam)
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' })
        }
        setTimeout(doScroll, 250)
        setTimeout(doScroll, 800)
        setTimeout(() => { this.highlightCategory = null }, 2800)
      },

      async loadAll() {
        const headers = { Authorization: 'Bearer ' + this.session.token }
        try {
          const [scns, cats, fits, prods] = await Promise.all([
            fetch(`${API}/access-guide/scenarios`, { headers }).then(r => r.json()),
            fetch(`${API}/access-guide/categories`, { headers }).then(r => r.json()),
            fetch(`${API}/access-guide/fit`, { headers }).then(r => r.json()),
            fetch(`${API}/access-guide/products`, { headers }).then(r => r.json()),
          ])
          this.scenarios = scns; this.categories = cats; this.fits = fits; this.products = prods
        } catch {}
      },

      fitFor(scenarioCode, categoryCode) {
        return this.fits.find(f => f.scenario_code === scenarioCode && f.category_code === categoryCode) || { fit_level: '', fit_note: '' }
      },
      fitBadgeClass(level) {
        if (level === '適合') return 'fit-good'
        if (level === '不建議') return 'fit-bad'
        return 'fit-ok'
      },
      categoriesRankedFor(scenarioCode) {
        const rank = { '適合': 0, '可用': 1, '不建議': 2, '': 3 }
        let cats = [...this.categories]
        const q = this.globalSearch.trim()
        if (q) cats = cats.filter(c => this.productsFor(c.code).some(p => this.matchesSearch(p, q)))
        return cats.sort((a, b) => {
          const la = this.fitFor(scenarioCode, a.code).fit_level || ''
          const lb = this.fitFor(scenarioCode, b.code).fit_level || ''
          return (rank[la] ?? 3) - (rank[lb] ?? 3)
        })
      },
      productsFor(categoryCode) { return this.products.filter(p => p.category_code === categoryCode) },
      compareBoxWidth() {
        const n = this.compareProducts().length
        return Math.min(2600, Math.max(480, 220 + n * 250))
      },
      scenarioLabel(code) { const s = this.scenarios.find(x => x.code === code); return s ? s.name : code },
      categoryLabel(code) { const c = this.categories.find(x => x.code === code); return c ? c.name : code },

      // ── 進階搜尋（依型號/品牌/任何規格內容過濾）──
      matchesSearch(p, query) {
        if (!query || !query.trim()) return true
        const q = query.trim().toLowerCase()
        const basic = [p.brand, p.model].join(' ').toLowerCase()
        if (basic.indexOf(q) >= 0) return true
        return this.parseSpecs(p).some(([k, v]) => {
          const val = String(v || '').trim()
          if (/^(無|不支援|不可|N\/?A|—)/.test(val)) return false // 排除「無/不支援」開頭的否定敘述，避免搜「PoE」時連不支援的都算命中
          return (k + ' ' + val).toLowerCase().indexOf(q) >= 0
        })
      },
      filteredProductsFor(catCode) {
        const q = this.globalSearch.trim() ? this.globalSearch : this.productSearch[catCode]
        return this.productsFor(catCode).filter(p => this.matchesSearch(p, q))
      },

      // ── 產品選取（決定規格比較要比哪幾款）──
      isSelected(catCode, prodId) { return (this.selectedProductIds[catCode] || []).indexOf(prodId) >= 0 },
      toggleSelect(catCode, prodId) {
        const cur = this.selectedProductIds[catCode] || []
        const idx = cur.indexOf(prodId)
        if (idx >= 0) cur.splice(idx, 1); else cur.push(prodId)
        this.selectedProductIds = { ...this.selectedProductIds, [catCode]: cur }
      },
      selectedCountFor(catCode) { return (this.selectedProductIds[catCode] || []).length },
      selectAllFor(catCode, products) { this.selectedProductIds = { ...this.selectedProductIds, [catCode]: products.map(p => p.id) } },
      clearSelectionFor(catCode) { this.selectedProductIds = { ...this.selectedProductIds, [catCode]: [] } },
      compareProducts() {
        const all = this.productsFor(this.specsCompareCategoryCode)
        const sel = this.selectedProductIds[this.specsCompareCategoryCode] || []
        return sel.length >= 2 ? all.filter(p => sel.indexOf(p.id) >= 0) : all
      },

      // ── 規格比較 ──
      parseSpecs(p) { try { const v = JSON.parse(p.specs_json || '[]'); return Array.isArray(v) ? v : [] } catch { return [] } },
      specKeysFor(products) {
        const keys = []
        products.forEach(p => this.parseSpecs(p).forEach(([k]) => { if (k && keys.indexOf(k) === -1) keys.push(k) }))
        return keys
      },
      specValue(p, key) {
        const found = this.parseSpecs(p).find(s => s[0] === key)
        return found ? found[1] : '—'
      },
      normalizeForCompare(str) {
        // 去掉尾端的括號補充說明再比對，避免「無（非網管）」跟「無（非網管，隨插即用）」
        // 因為附註文字不同就被當成有差異——顯示時仍用原文，只有判斷是否「相同」時用這個
        return String(str).replace(/[（(][^）)]*[）)]\s*$/, '').trim()
      },
      rowIsUniform(products, key) {
        const vals = products.map(p => this.normalizeForCompare(this.specValue(p, key)))
        return vals.every(v => v === vals[0])
      },
      diffKeysFor(products) { return this.specKeysFor(products).filter(k => !this.rowIsUniform(products, k)) },
      uniformKeysFor(products) { return this.specKeysFor(products).filter(k => this.rowIsUniform(products, k)) },
      displayKeysFor(products) { return this.compareShowUniform ? this.specKeysFor(products) : this.diffKeysFor(products) },
      parseLeadingNumber(str) {
        if (!str) return null
        const s = String(str).trim().replace(/^(約|~|大於|小於|最高|最低)\s*/, '')
        const m = s.match(/^[\d,]+(\.\d+)?/)
        if (!m) return null
        const rest = s.slice(m[0].length)
        if (/^[a-z]/.test(rest)) return null // 排除「802.3at」這類標準編號被誤判為數值
        if (/^G(\s|$)/.test(rest)) return null // 排除「4G」「5G」這類世代代號（非量化數值，跟「10GbE」不同）
        return parseFloat(m[0].replace(/,/g, ''))
      },
      isBestInRow(products, key, p) {
        const nums = products.map(x => this.parseLeadingNumber(this.specValue(x, key))).filter(n => n !== null)
        if (nums.length < 2) return false
        const max = Math.max(...nums)
        const thisNum = this.parseLeadingNumber(this.specValue(p, key))
        return thisNum !== null && thisNum === max
      },

      modalTitle() {
        const isEdit = !!this.modal.id
        if (this.modal.kind === 'scenario') return isEdit ? '編輯情境' : '新增情境'
        if (this.modal.kind === 'category') return isEdit ? '編輯分類' : '新增分類'
        if (this.modal.kind === 'fit') return isEdit ? '編輯適配項' : '新增適配項'
        return isEdit ? '編輯產品' : '新增產品'
      },

      openScenarioModal(s) {
        this.modal = { show:true, kind:'scenario', id: s ? s.code : null,
          code: s ? s.code : '', name: s ? s.name : '', description: s ? s.description : '', saving:false, error:'' }
      },
      openCategoryModal(c) {
        this.modal = { show:true, kind:'category', id: c ? c.code : null,
          code: c ? c.code : '', name: c ? c.name : '', keySpecs: c ? c.key_specs : '',
          tags: c ? c.tags : '', priceRange: c ? c.price_range : '',
          dependencyNote: c ? c.dependency_note : '', watchNote: c ? c.watch_note : '', saving:false, error:'' }
      },
      openFitModal(f) {
        this.modal = { show:true, kind:'fit', id: f ? f.id : null,
          scenarioCode: f ? f.scenario_code : (this.scenarios[0] ? this.scenarios[0].code : ''),
          categoryCode: f ? f.category_code : (this.categories[0] ? this.categories[0].code : ''),
          fitLevel: f ? f.fit_level : '可用', fitNote: f ? f.fit_note : '', saving:false, error:'' }
      },
      openProductModal(p) {
        const specs = p ? this.parseSpecs(p).map(([key, value]) => ({ key, value })) : []
        this.modal = { show:true, kind:'product', id: p ? p.id : null,
          categoryCode: p ? p.category_code : (this.categories[0] ? this.categories[0].code : ''),
          brand: p ? p.brand : '', model: p ? p.model : '', url: p ? p.url : '',
          label: p ? p.label : '', priceNote: p ? p.price_note : '', specs, saving:false, error:'' }
      },

      async saveModal() {
        this.modal.error = ''
        let url, method, body
        if (this.modal.kind === 'scenario') {
          if (!this.modal.code.trim()) { this.modal.error = '情境代碼不得為空'; return }
          body = { code: this.modal.code, name: this.modal.name, description: this.modal.description }
          method = this.modal.id ? 'PUT' : 'POST'
          url = this.modal.id ? `${API}/access-guide/scenarios/${encodeURIComponent(this.modal.id)}` : `${API}/access-guide/scenarios`
        } else if (this.modal.kind === 'category') {
          if (!this.modal.code.trim()) { this.modal.error = '分類代碼不得為空'; return }
          body = { code: this.modal.code, name: this.modal.name, keySpecs: this.modal.keySpecs, tags: this.modal.tags,
                    priceRange: this.modal.priceRange, dependencyNote: this.modal.dependencyNote, watchNote: this.modal.watchNote }
          method = this.modal.id ? 'PUT' : 'POST'
          url = this.modal.id ? `${API}/access-guide/categories/${encodeURIComponent(this.modal.id)}` : `${API}/access-guide/categories`
        } else if (this.modal.kind === 'fit') {
          if (!this.modal.scenarioCode || !this.modal.categoryCode) { this.modal.error = '請選擇情境與分類'; return }
          body = { scenarioCode: this.modal.scenarioCode, categoryCode: this.modal.categoryCode,
                    fitLevel: this.modal.fitLevel, fitNote: this.modal.fitNote }
          method = this.modal.id ? 'PUT' : 'POST'
          url = this.modal.id ? `${API}/access-guide/fit/${this.modal.id}` : `${API}/access-guide/fit`
        } else {
          if (!this.modal.categoryCode) { this.modal.error = '請選擇所屬分類'; return }
          body = { categoryCode: this.modal.categoryCode, brand: this.modal.brand, model: this.modal.model,
                    url: this.modal.url, label: this.modal.label, priceNote: this.modal.priceNote,
                    specs: this.modal.specs.filter(s => s.key.trim()).map(s => [s.key, s.value]) }
          method = this.modal.id ? 'PUT' : 'POST'
          url = this.modal.id ? `${API}/access-guide/products/${this.modal.id}` : `${API}/access-guide/products`
        }
        this.modal.saving = true
        try {
          const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.session.token }, body: JSON.stringify(body) })
          if (r.ok) { await this.loadAll(); this.modal.show = false }
          else { const e = await r.json(); this.modal.error = e.detail || '儲存失敗' }
        } catch { this.modal.error = '網路錯誤' }
        this.modal.saving = false
      },

      async deleteItem(kind, item) {
        const labels = { scenario: item.code, category: item.code,
          fit: this.scenarioLabel(item.scenario_code) + ' x ' + this.categoryLabel(item.category_code),
          product: item.brand + ' ' + item.model }
        if (!confirm(`確認刪除「${labels[kind]}」？`)) return
        const endpoints = { scenario: 'scenarios', category: 'categories', fit: 'fit', product: 'products' }
        const idPart = (kind === 'scenario' || kind === 'category') ? encodeURIComponent(item.code) : item.id
        try {
          const r = await fetch(`${API}/access-guide/${endpoints[kind]}/${idPart}`, { method: 'DELETE', headers: { Authorization: 'Bearer ' + this.session.token } })
          if (r.ok) await this.loadAll()
        } catch {}
      },
    }
  }
  </script>

  <script src="../static/notif.js"></script>
  <script src="../static/sidebar.js"></script>
</body>
