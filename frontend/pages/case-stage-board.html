<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{if(localStorage.getItem('motrix_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../static/favicon.png">
  <title>案件執行看板 — MOTRIX 營運管理系統</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.css">
  <link rel="stylesheet" href="../css/style.css?v=20260805g">
  <style>
    [x-cloak] { display: none !important; }

    .board-main {
      margin-left: var(--sidebar-w);
      margin-top: var(--topbar-h);
      padding: 28px 32px;
      min-height: calc(100vh - var(--topbar-h));
      background: var(--white);
    }

    .toolbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .field {
      display:flex; align-items:center; gap:6px;
      background:#fff; border:1px solid var(--border-light); border-radius:var(--radius);
      padding:6px 11px; font-size:12px; color:var(--text-secondary); font-family:var(--font-zh);
    }
    .field select, .field input {
      border:none; background:none; font-family:var(--font-zh); font-size:12px; color:var(--text-primary); outline:none;
    }
    .field input { width:130px; }

    .view-toggle {
      display: inline-flex; border: 1px solid var(--border-light); border-radius: var(--radius);
      overflow: hidden; background: #fff;
    }
    .view-toggle button {
      border: none; background: none; cursor: pointer;
      font-size: 12px; font-family: var(--font-zh); color: var(--text-secondary);
      padding: 7px 14px;
    }
    .view-toggle button.active { background: var(--accent); color: #fff; }
    .view-toggle button + button { border-left: 1px solid var(--border-light); }

    /* ── 稽核彙總列 ── */
    .board-summary {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px;
      background: var(--border-light); border: 1px solid var(--border-light); border-radius: 10px;
      overflow: hidden; margin: 20px 0 24px;
    }
    .board-summary__cell { background: #fff; padding: 14px 16px; }
    .board-summary__num { font-size: 22px; font-weight: 800; line-height: 1; color: var(--text-primary); }
    .board-summary__num.danger { color: var(--danger); }
    .board-summary__num.warn { color: var(--warning); }
    .board-summary__label { margin-top: 5px; font-size: 11px; color: var(--text-secondary); }

    /* ── 看板 ── */
    .board { display:grid; grid-template-columns:repeat(5, minmax(200px,1fr)); gap:14px; overflow-x:auto; padding-bottom:4px; }
    .board-col__head { display:flex; align-items:center; gap:7px; padding:0 2px 10px; }
    .board-col__dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .board-col__title { font-size:12.5px; font-weight:700; color:var(--text-primary); }
    .board-col__count { margin-left:auto; font-size:11px; color:var(--text-dim); font-weight:600; }
    .board-col__body { display:flex; flex-direction:column; gap:8px; min-height:40px; }

    .stage-board-card {
      background:#fff; border:1px solid var(--border-light); border-radius:10px; padding:11px 13px; cursor:pointer;
      transition:border-color .15s, box-shadow .15s, transform .15s;
    }
    .stage-board-card:hover { border-color:var(--accent); box-shadow:0 2px 6px rgba(0,0,0,.06); transform:translateY(-1px); }
    .stage-board-card__case { font-size:10.5px; color:var(--text-dim); font-weight:600; }
    .stage-board-card__stage { font-size:13px; font-weight:700; color:var(--text-primary); margin-top:2px; }
    .stage-board-card__foot { display:flex; align-items:center; justify-content:space-between; margin-top:9px; gap:6px; }
    .stage-board-card__date { font-size:11px; color:var(--text-secondary); font-variant-numeric:tabular-nums; white-space:nowrap; }
    .stage-board-card__date.danger { color:var(--danger); font-weight:700; }
    .stage-board-card__date.warn { color:var(--warning); font-weight:700; }

    .who { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-secondary); overflow:hidden; }
    .who__name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .avatar-dot { width:18px; height:18px; border-radius:50%; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; color:#fff; }
    .avatar-dot.unassigned { background:#F0EEE9; color:var(--text-dim); border:1px dashed var(--border-light); }

    .board-empty { padding:32px; text-align:center; font-size:12px; color:var(--text-dim); }

    /* ── 跨案時間軸（沿用 case-management.html 既有的 frappe-gantt 樣式手法） ── */
    #board-gantt-chart .gantt .bar { fill:var(--accent); }
    #board-gantt-chart .gantt .bar-progress { fill:rgba(0,0,0,.18); }
    #board-gantt-chart .gantt .bar-invalid { fill:transparent; stroke:#D1D5DB; stroke-dasharray:2,2; }
    #board-gantt-chart .gantt-container { background:#fff; border:1px solid var(--border-light); border-radius:10px; }
    #board-gantt-chart .gantt .grid-background { fill:#fff; }
    #board-gantt-chart .gantt .grid-row { fill:#fff; }
    #board-gantt-chart .gantt .grid-row:nth-child(even) { fill:#FAFAF9; }
    #board-gantt-chart .gantt .grid-header { fill:#fff; stroke:#E5E7EB; }
    #board-gantt-chart .gantt .row-line { stroke:#F0EFEB; }
    #board-gantt-chart .gantt .tick { stroke:#E5E7EB; }
    #board-gantt-chart .gantt .lower-text,
    #board-gantt-chart .gantt .upper-text { fill:#6B7280; }
    #board-gantt-chart .gantt .bar-label { fill:#fff; }
    #board-gantt-chart .gantt .bar-label.big { fill:#374151; }
    #board-gantt-chart .gantt .arrow { stroke:#9CA3AF; fill:none; }
    #board-gantt-chart .gantt .today-highlight { fill:#FEF3C7; opacity:.4; }
    /* 依主要負責人上色（跟每日工作事項月曆／案件時間軸／看板同一組色碼＋演算法，同一人顏色一致） */
    #board-gantt-chart .gantt .bar-wrapper.stage-c0 .bar { fill:#2563EB; }
    #board-gantt-chart .gantt .bar-wrapper.stage-c1 .bar { fill:#7C3AED; }
    #board-gantt-chart .gantt .bar-wrapper.stage-c2 .bar { fill:#DB2777; }
    #board-gantt-chart .gantt .bar-wrapper.stage-c3 .bar { fill:#D97706; }
    #board-gantt-chart .gantt .bar-wrapper.stage-c4 .bar { fill:#16A34A; }
    #board-gantt-chart .gantt .bar-wrapper.stage-c5 .bar { fill:#0891B2; }
    #board-gantt-chart .gantt .bar-wrapper.stage-c6 .bar { fill:#DC2626; }
    #board-gantt-chart .gantt .bar-wrapper.stage-c7 .bar { fill:#9333EA; }
    #board-gantt-chart .gantt .bar-wrapper.stage-unassigned .bar { fill:#64748B; }
    #board-gantt-chart .gantt .bar-wrapper.stage-overdue .bar { stroke:#DC2626; stroke-width:1.5; }
    /* 業務開發/報價單成立/案件成立 — 生命週期里程碑，跟「某人負責的階段」視覺上區分；
       實心深灰＋外框，避免淺色＋透明度疊加造成白字看不清楚 */
    #board-gantt-chart .gantt .bar-wrapper.stage-milestone .bar { fill:#475569; stroke:#1E293B; stroke-width:1; }

    .gantt-pop { padding:10px 12px; font-family:var(--font-zh); min-width:190px; }
    .gantt-pop-title { font-size:12px; font-weight:700; color:var(--text-primary); margin-bottom:6px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .gantt-pop-row { display:flex; align-items:center; gap:5px; flex-wrap:wrap; font-size:11px; color:var(--text-secondary); margin-top:4px; }
    .gantt-pop-lbl { font-size:10px; color:var(--text-dim); flex-shrink:0; }
    .gantt-pop-av { font-size:10px; background:#F0EEE9; border-radius:10px; padding:1px 7px; color:var(--text-secondary); }
    .gantt-pop-empty { font-size:11px; color:var(--text-dim); }
    .gantt-pop-chip { font-size:9px; font-weight:700; padding:1px 6px; border-radius:3px; }
    .gantt-pop-chip--done { background:#DCFCE7; color:#15803D; }
    .gantt-pop-chip--overdue { background:#FEE2E2; color:#DC2626; }
  </style>
</head>

<body x-data="caseStageBoardPage()" x-init="init()">

  <header id="app-topbar" class="topbar"></header>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="app-sidebar"></aside>

  <div class="board-main">
    <div class="page-header" style="margin-bottom:8px">
      <div>
        <div style="font-size:11px;color:var(--text-dim);margin-bottom:4px">案件管理</div>
        <h1 style="font-size:20px;font-weight:700">案件執行看板</h1>
        <p style="font-size:12px;color:var(--text-secondary);margin-top:4px">跨案件彙總所有已成案案件的執行進度階段，卡片／長條點擊可前往該案件</p>
      </div>
      <div class="toolbar">
        <div class="field">
          <span>業務員</span>
          <select x-model="salesFilter">
            <option value="">全部</option>
            <template x-for="s in salesPersonOptions" :key="s">
              <option :value="s" x-text="s"></option>
            </template>
          </select>
        </div>
        <div class="field">
          <input type="text" x-model="searchQ" placeholder="搜尋客戶／案件…">
        </div>
        <div class="view-toggle">
          <button type="button" :class="{active: viewMode==='board'}" @click="viewMode='board'">看板</button>
          <button type="button" :class="{active: viewMode==='timeline'}" @click="switchToTimeline()">跨案時間軸</button>
        </div>
      </div>
    </div>

    <div x-show="!loading && items.length === 0" class="board-empty">
      目前沒有進行中的案件執行階段（僅統計已成案且有設定執行階段的案件）
    </div>

    <template x-if="items.length > 0">
      <div>
        <div class="board-summary">
          <div class="board-summary__cell">
            <div class="board-summary__num" x-text="summary.caseCount"></div>
            <div class="board-summary__label">進行中案件</div>
          </div>
          <div class="board-summary__cell">
            <div class="board-summary__num" :class="{danger: summary.overdue > 0}" x-text="summary.overdue"></div>
            <div class="board-summary__label">已逾期階段</div>
          </div>
          <div class="board-summary__cell">
            <div class="board-summary__num" :class="{warn: summary.soon > 0}" x-text="summary.soon"></div>
            <div class="board-summary__label">3 天內到期</div>
          </div>
          <div class="board-summary__cell">
            <div class="board-summary__num" :class="{warn: summary.unassigned > 0}" x-text="summary.unassigned"></div>
            <div class="board-summary__label">未指派負責人</div>
          </div>
        </div>

        <!-- ══ 看板 ══ -->
        <div x-show="viewMode==='board'">
          <div class="board">
            <template x-for="col in boardColumns" :key="col.key">
              <div>
                <div class="board-col__head">
                  <span class="board-col__dot" :style="{background: col.color}"></span>
                  <span class="board-col__title" x-text="col.label"></span>
                  <span class="board-col__count" x-text="bucketed[col.key].length"></span>
                </div>
                <div class="board-col__body">
                  <template x-for="it in bucketed[col.key]" :key="it.quoteNo + '-' + it.stageId">
                    <div class="stage-board-card" :style="it.done ? 'opacity:.65' : ''" @click="openCase(it.quoteNo)">
                      <div class="stage-board-card__case" x-text="it.quoteNo + '・' + (it.customerName || it.projectName || '')"></div>
                      <div class="stage-board-card__stage" x-text="it.stageLabel"></div>
                      <div class="stage-board-card__foot">
                        <span class="who">
                          <template x-if="it.assignedNames.length">
                            <span class="avatar-dot" :style="{background: avatarColorFor(it)}" x-text="it.assignedNames[0][0]"></span>
                          </template>
                          <template x-if="!it.assignedNames.length">
                            <span class="avatar-dot unassigned">？</span>
                          </template>
                          <span class="who__name" x-text="it.assignedNames.length ? it.assignedNames.join('、') : '未指派'"></span>
                        </span>
                        <span class="stage-board-card__date" :class="{danger: it.overdue, warn: !it.overdue && !it.done && col.key==='today'}"
                              x-text="it.done ? ('✓ ' + it.dueDate) : (it.dueDate || '—')"></span>
                      </div>
                    </div>
                  </template>
                  <div x-show="bucketed[col.key].length === 0" style="padding:10px;text-align:center;font-size:11px;color:var(--text-dim)">無</div>
                </div>
              </div>
            </template>
          </div>
        </div>

        <!-- ══ 跨案時間軸 ══ -->
        <div x-show="viewMode==='timeline'" x-cloak>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap">
            <div style="font-size:11px;color:var(--text-dim)">
              點擊長條可查看階段詳情；如需調整日期或前置階段依賴，請至個別案件的案件管理頁面設定
            </div>
            <div class="view-toggle">
              <template x-for="vm in ganttViewModes" :key="vm.key">
                <button type="button" :class="{active: ganttViewMode===vm.key}" @click="setGanttViewMode(vm.key)" x-text="vm.label"></button>
              </template>
            </div>
          </div>
          <div id="board-gantt-chart" x-ref="ganttContainer" style="overflow-x:auto"></div>
        </div>
      </div>
    </template>
  </div>

  <script>
  const _GANTT_COLORS = ['#2563EB','#7C3AED','#DB2777','#D97706','#16A34A','#0891B2','#DC2626','#9333EA']
  function _avatarColor(u) {
    let h = 0
    for (let i = 0; i < u.length; i++) h = (h * 31 + u.charCodeAt(i)) | 0
    return _GANTT_COLORS[Math.abs(h) % _GANTT_COLORS.length]
  }

  function caseStageBoardPage() {
    return {
      session: {},
      loading: true,
      items: [],
      caseLifecycle: {},
      viewMode: 'board',
      salesFilter: '',
      searchQ: '',
      _ganttInstance: null,
      ganttViewMode: 'Week',
      ganttViewModes: [
        { key: 'Day',   label: '日' },
        { key: 'Week',  label: '週' },
        { key: 'Month', label: '月' },
      ],

      boardColumns: [
        { key: 'overdue',  label: '已逾期',      color: 'var(--danger)' },
        { key: 'today',    label: '今日到期',    color: 'var(--warning)' },
        { key: 'soon',     label: '3 天內到期',  color: '#F5C97A' },
        { key: 'ongoing',  label: '進行中',      color: 'var(--text-dim)' },
        { key: 'done',     label: '已完成',      color: 'var(--success)' },
      ],

      get salesPersonOptions() {
        return [...new Set(this.items.map(i => i.salesPerson).filter(Boolean))].sort()
      },

      get filteredItems() {
        const q = this.searchQ.trim().toLowerCase()
        return this.items.filter(it => {
          if (this.salesFilter && it.salesPerson !== this.salesFilter) return false
          if (q && !(it.quoteNo.toLowerCase().includes(q) || (it.customerName||'').toLowerCase().includes(q) || (it.projectName||'').toLowerCase().includes(q))) return false
          return true
        })
      },

      _todayStr() { return new Date().toISOString().slice(0,10) },
      _addDays(dateStr, n) { const d = new Date(dateStr + 'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10) },

      bucketOf(it) {
        if (it.done) return 'done'
        if (it.overdue) return 'overdue'
        const today = this._todayStr()
        if (!it.dueDate) return 'ongoing'
        if (it.dueDate === today) return 'today'
        if (it.dueDate <= this._addDays(today, 3)) return 'soon'
        return 'ongoing'
      },

      get bucketed() {
        const out = { overdue: [], today: [], soon: [], ongoing: [], done: [] }
        for (const it of this.filteredItems) out[this.bucketOf(it)].push(it)
        return out
      },

      get summary() {
        const items = this.filteredItems
        return {
          caseCount:  new Set(items.filter(i => !i.done).map(i => i.quoteNo)).size,
          overdue:    items.filter(i => i.overdue).length,
          soon:       items.filter(i => !i.done && !i.overdue && (this.bucketOf(i) === 'today' || this.bucketOf(i) === 'soon')).length,
          unassigned: items.filter(i => !i.done && i.assignedNames.length === 0).length,
        }
      },

      avatarColorFor(it) {
        return it.assignedTo.length ? _avatarColor(it.assignedTo[0]) : '#9CA3AF'
      },

      openCase(quoteNo) {
        location.href = 'case-management.html?q=' + encodeURIComponent(quoteNo)
      },

      _headers() {
        return { 'Authorization': 'Bearer ' + (this.session.token || '') }
      },

      async loadStageBoard() {
        this.loading = true
        try {
          const r = await fetch('/api/quotations/stage-board', { headers: this._headers() })
          if (r.ok) {
            const d = await r.json()
            this.items = d.items || []
            this.caseLifecycle = d.caseLifecycle || {}
          }
        } catch {}
        this.loading = false
      },

      switchToTimeline() {
        this.viewMode = 'timeline'
        this.$nextTick(() => this.renderGantt())
      },

      // 業務開發／報價單成立／案件成立 — 跨案時間軸的前置生命週期里程碑（2026-08-23e）。
      // 純顯示用，不塞進任何階段的 dependsOn 依賴鏈，資料缺失時對應項目直接省略。
      _lifecycleMilestones(quoteNo) {
        const lc = this.caseLifecycle[quoteNo]
        if (!lc) return []
        const mk = (key, name, dateStr, endStr) => ({
          id: quoteNo + '-milestone-' + key,
          name, start: dateStr, end: endStr || this._addDays(dateStr, 1),
          progress: 100, dependencies: '', custom_class: 'stage-milestone',
          _quoteNo: quoteNo, _stageLabel: name, _assignedNames: [], _done: true, _overdue: false,
        })
        const out = []
        if (lc.devStart) {
          out.push(mk('dev', '業務開發', lc.devStart, lc.devEnd && lc.devEnd !== lc.devStart ? lc.devEnd : null))
        }
        if (lc.quoteCreatedAt) out.push(mk('quote', '報價單成立', lc.quoteCreatedAt))
        if (lc.caseStartedAt)  out.push(mk('case', '案件成立', lc.caseStartedAt))
        return out
      },

      _ganttTasks() {
        const today = this._todayStr()
        const sorted = [...this.filteredItems].sort((a, b) => a.quoteNo < b.quoteNo ? -1 : (a.quoteNo > b.quoteNo ? 1 : 0))
        const tasks = []
        const seenQuote = new Set()
        for (const it of sorted) {
          if (!seenQuote.has(it.quoteNo)) {
            seenQuote.add(it.quoteNo)
            tasks.push(...this._lifecycleMilestones(it.quoteNo))
          }
          let start = it.startDate || it.dueDate || today
          let end   = it.dueDate   || it.startDate || this._addDays(start, 1)
          if (start === end) end = this._addDays(start, 1)
          const primary = it.assignedTo[0] || ''
          const idx = primary ? _GANTT_COLORS.indexOf(_avatarColor(primary)) : -1
          const classes = [
            idx >= 0 ? ('stage-c' + idx) : 'stage-unassigned',
            it.done ? 'stage-done' : '',
            (!it.done && it.overdue) ? 'stage-overdue' : '',
          ].filter(Boolean).join(' ')
          tasks.push({
            id:           it.quoteNo + '-' + it.stageId,
            name:         (it.customerName || it.quoteNo) + ' · ' + it.stageLabel,
            start, end,
            progress:     it.done ? 100 : 0,
            dependencies: (it.dependsOn || []).map(id => it.quoteNo + '-' + id).join(','),
            custom_class: classes,
            _quoteNo:       it.quoteNo,
            _stageLabel:    it.stageLabel,
            _assignedNames: it.assignedNames,
            _done:          it.done,
            _overdue:       it.overdue,
          })
        }
        return tasks
      },

      renderGantt() {
        const el = this.$refs.ganttContainer
        if (!el || typeof Gantt === 'undefined') return
        const tasks = this._ganttTasks()
        el.innerHTML = ''
        if (!tasks.length) return
        this._ganttInstance = new Gantt(el, tasks, {
          view_mode: this.ganttViewMode,
          custom_popup_html: (task) => {
            const statusChip = task._done
              ? '<span class="gantt-pop-chip gantt-pop-chip--done">已完成</span>'
              : (task._overdue ? '<span class="gantt-pop-chip gantt-pop-chip--overdue">已逾期</span>' : '')
            const assignees = task._assignedNames.length
              ? task._assignedNames.map(n => `<span class="gantt-pop-av">${n}</span>`).join('')
              : '<span class="gantt-pop-empty">尚未指派</span>'
            return `
              <div class="gantt-pop">
                <div class="gantt-pop-title">${task._quoteNo} ${statusChip}</div>
                <div class="gantt-pop-row"><span class="gantt-pop-lbl">階段</span>${task._stageLabel}</div>
                <div class="gantt-pop-row"><span class="gantt-pop-lbl">日期</span>${task.start} ~ ${task.end}</div>
                <div class="gantt-pop-row"><span class="gantt-pop-lbl">負責人</span>${assignees}</div>
              </div>`
          },
        })
      },

      setGanttViewMode(mode) {
        this.ganttViewMode = mode
        if (this._ganttInstance) this._ganttInstance.change_view_mode(mode)
      },

      logout() {
        fetch('/api/auth/logout', { method:'POST', headers: this._headers() }).catch(()=>{})
        localStorage.removeItem('motrix_session')
        window.location.href = 'login.html'
      },

      async init() {
        const s = localStorage.getItem('motrix_session')
        if (!s) { window.location.href = 'login.html'; return }
        try {
          this.session = JSON.parse(s)
          if (!this.session.token) { window.location.href = 'login.html'; return }
        } catch(e) { window.location.href = 'login.html'; return }

        const res = await fetch('/api/auth/me', { headers: {'Authorization': 'Bearer ' + this.session.token} })
        if (!res.ok) {
          localStorage.removeItem('motrix_session')
          window.location.href = 'login.html'; return
        }
        await this.loadStageBoard()
      }
    }
  }
  </script>
  <script src="../static/notif.js"></script>
  <script src="../static/sidebar.js"></script>
</body>
</html>
