<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{if(localStorage.getItem('motrix_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../static/favicon.png">
  <title>修改密碼 — MOTRIX 專案管理系統</title>
  <script src="../static/auth-guard.js"></script>
  <script defer src="../static/vendor/alpine-3.17.1.min.js"></script>
  <link rel="stylesheet" href="../css/style.css?v=20260805g">
  <style>
    [x-cloak]{display:none!important}
    .page-main{margin-left:var(--sidebar-w);margin-top:var(--topbar-h);padding:28px 32px;min-height:calc(100vh - var(--topbar-h));background:var(--white)}
    .card{background:#fff;border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:32px;max-width:420px}
    .form-group{margin-bottom:18px}
    .form-label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:6px;font-weight:500}
    .form-input{width:100%;padding:9px 12px;border:1px solid var(--border-light);border-radius:var(--radius);font-size:13px;font-family:var(--font-zh);background:#fff;outline:none;box-sizing:border-box}
    .form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.08)}
    .btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 24px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:13px;font-family:var(--font-zh);font-weight:600;cursor:pointer;transition:background .15s;min-width:110px}
    .btn-primary:hover{background:var(--accent-hover)}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed}
    .alert{padding:10px 14px;border-radius:var(--radius);font-size:12px;margin-bottom:16px;line-height:1.5}
    .alert-err{background:var(--danger-light);color:var(--danger);border:1px solid #FECACA}
    .alert-ok{background:var(--success-light);color:var(--success);border:1px solid #BBF7D0}
    .hint{font-size:11px;color:var(--text-dim);margin-top:4px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .card-title{font-size:15px;font-weight:700;margin-bottom:4px}
    .card-sub{font-size:12px;color:var(--text-secondary);margin-bottom:18px;line-height:1.6}
    .totp-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
    .totp-on{background:var(--success-light);color:var(--success)}
    .totp-off{background:#F3F4F6;color:var(--text-dim)}
    .btn-secondary{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 20px;background:#fff;color:var(--text-primary);border:1px solid var(--border-light);border-radius:var(--radius);font-size:13px;font-family:var(--font-zh);font-weight:600;cursor:pointer}
    .btn-secondary:hover{background:#F9FAFB}
    .btn-danger-outline{border-color:#FECACA;color:var(--danger)}
    .totp-qr{display:block;margin:14px 0;border:1px solid var(--border-light);border-radius:var(--radius);width:180px;height:180px}
    .totp-secret{font-family:monospace;font-size:13px;letter-spacing:.05em;background:#F9FAFB;border:1px solid var(--border-light);border-radius:6px;padding:8px 10px;word-break:break-all;margin-bottom:4px}
    .recovery-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0;font-family:monospace;font-size:13px}
    .recovery-code{background:#F9FAFB;border:1px solid var(--border-light);border-radius:6px;padding:6px 10px;text-align:center}
  </style>
</head>
<body x-data="changePwPage()" x-init="init()" x-cloak>

    <header id="app-topbar" class="topbar"></header>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="app-sidebar"></aside>

  <!-- MAIN -->
  <div class="page-main">

    <div style="margin-bottom:24px">
      <div class="pg__eyebrow">系統</div>
        <h1 class="pg__t">修改密碼</h1>
    </div>

    <div class="card">
      <div x-show="errMsg" class="alert alert-err" x-text="errMsg"></div>
      <div x-show="okMsg"  class="alert alert-ok"  x-text="okMsg"></div>

      <form @submit.prevent="submit()" x-show="!okMsg">
        <div class="form-group">
          <label class="form-label">目前密碼</label>
          <input class="form-input" type="password" x-model="form.current" required autocomplete="current-password" placeholder="輸入目前使用的密碼">
        </div>
        <div class="form-group">
          <label class="form-label">新密碼</label>
          <input class="form-input" type="password" x-model="form.newPw" required autocomplete="new-password" placeholder="至少 8 個字元">
          <div class="hint">至少 8 個字元</div>
        </div>
        <div class="form-group" style="margin-bottom:24px">
          <label class="form-label">確認新密碼</label>
          <input class="form-input" type="password" x-model="form.confirm" required autocomplete="new-password" placeholder="再次輸入新密碼">
        </div>
        <button class="btn-primary" type="submit" :disabled="submitting">
          <svg x-show="submitting" style="animation:spin 1s linear infinite" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
          <span x-show="!submitting">更新密碼</span>
          <span x-show="submitting">更新中…</span>
        </button>
      </form>
    </div>

    <div class="card" style="margin-top:20px" x-show="!totp.loading">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
        <div class="card-title">兩步驟驗證（TOTP）</div>
        <span class="totp-badge" :class="totp.enabled ? 'totp-on' : 'totp-off'"
              x-text="totp.enabled ? '已啟用' : '未啟用'"></span>
      </div>
      <div class="card-sub">
        用手機驗證 App（Google Authenticator／Microsoft Authenticator 等）為登入加上第二道防護。
        <template x-if="!totp.enabled">
          <span>建議管理員／最高管理者帳號啟用，密碼外洩時仍能擋下未授權登入。</span>
        </template>
      </div>

      <div x-show="totp.err" class="alert alert-err" x-text="totp.err"></div>

      <!-- 未啟用、尚未開始設定 -->
      <template x-if="!totp.enabled && totp.step === 'idle'">
        <button class="btn-secondary" @click="totpStart()" :disabled="totp.busy">
          <span x-text="totp.busy ? '產生中…' : '開始設定'"></span>
        </button>
      </template>

      <!-- 設定中：顯示 QR code + 密鑰 + 輸入驗證碼確認 -->
      <template x-if="totp.step === 'confirm'">
        <div>
          <div class="hint" style="margin-bottom:6px">用驗證 App 掃描下方 QR code，或手動輸入密鑰：</div>
          <img class="totp-qr" :src="totp.qr" alt="TOTP QR code">
          <div class="totp-secret" x-text="totp.secret"></div>
          <div class="form-group" style="margin-top:14px;margin-bottom:12px">
            <label class="form-label">驗證 App 顯示的 6 位數驗證碼</label>
            <input class="form-input" type="text" inputmode="numeric" x-model="totp.code"
                   placeholder="123456" style="max-width:160px">
          </div>
          <button class="btn-primary" @click="totpConfirm()" :disabled="totp.busy">
            <span x-text="totp.busy ? '驗證中…' : '確認啟用'"></span>
          </button>
          <button class="btn-secondary" style="margin-left:8px" @click="totpCancel()">取消</button>
        </div>
      </template>

      <!-- 啟用成功：一次性顯示救援碼 -->
      <template x-if="totp.step === 'recovery'">
        <div>
          <!-- 這個畫面被「初次啟用」與「重新產生」兩種情境共用，文案要分開：
               重產時說「已啟用！」會讓人以為剛剛發生了別的事 -->
          <div class="alert alert-ok" x-show="!totp.recoveryFromRegen">已啟用！請把下方 10 組救援碼另外存放安全處——手機遺失或驗證 App 移除時可用來登入，畫面關閉後就無法再次查看。</div>
          <div class="alert alert-ok" x-show="totp.recoveryFromRegen">已重新產生 10 組救援碼，<b>舊的那一批現在全部失效</b>。請把下方新碼另外存放安全處並作廃舊清單——畫面關閉後就無法再次查看。</div>
          <div class="recovery-grid">
            <template x-for="c in totp.recoveryCodes" :key="c">
              <div class="recovery-code" x-text="c"></div>
            </template>
          </div>
          <button class="btn-primary" @click="totpFinishRecovery()">我已儲存救援碼</button>
        </div>
      </template>

      <!-- 已啟用、非設定流程中：救援碼存量 + 重新產生 + 停用 -->
      <template x-if="totp.enabled && totp.step === 'idle'">
        <div>
          <!-- 救援碼存量（2026-09-11 新增）：救援碼用一組少一組，先前沒有任何
               地方看得到還剩幾組，使用者只會在最後一組也用完、驗證 App 又不在
               手邊時才發現被鎖在外面——而那時已經來不及自助補救。 -->
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding:10px 12px;border-radius:8px"
               :style="totp.recoveryRemaining <= 2 ? 'background:#FEF2F2;border:1px solid #FECACA' : (totp.recoveryRemaining <= 4 ? 'background:#FFFBEB;border:1px solid #FDE68A' : 'background:#F9FAFB;border:1px solid var(--border-light)')">
            <span style="font-size:13px">
              救援碼剩餘
              <b class="recovery-remaining" style="font-family:monospace;font-size:15px" x-text="totp.recoveryRemaining"></b>
              / 10 組
            </span>
            <span style="font-size:12px;color:var(--text-dim)"
                  x-show="totp.recoveryRemaining > 4">手機遺失或驗證 App 移除時可用來登入。</span>
            <span style="font-size:12px;color:#B45309;font-weight:500"
                  x-show="totp.recoveryRemaining > 2 && totp.recoveryRemaining <= 4">快用完了，建議現在重新產生。</span>
            <span style="font-size:12px;color:#B91C1C;font-weight:600"
                  x-show="totp.recoveryRemaining <= 2">⚠️ 用完之後，驗證 App 不在手邊就會登不進來。請立即重新產生。</span>
            <button class="btn-secondary" style="margin-left:auto;font-size:12px;padding:4px 10px"
                    x-show="!totp.regenerating" @click="totp.regenerating = true">重新產生救援碼</button>
          </div>

          <template x-if="totp.regenerating">
            <div style="max-width:340px;margin-bottom:14px">
              <div class="alert alert-err" style="font-size:12px">
                重新產生會讓<b>目前這 10 組全部失效</b>（包含還沒用過的）。如果你手上有印出來或存起來的舊清單，產生後請直接作廢整張。
              </div>
              <div class="form-group">
                <label class="form-label">輸入目前密碼以確認</label>
                <input class="form-input" type="password" x-model="totp.regenPassword" autocomplete="current-password">
              </div>
              <button class="btn-primary" @click="totpRegenerateRecovery()" :disabled="totp.busy">
                <span x-text="totp.busy ? '產生中…' : '確認重新產生'"></span>
              </button>
              <button class="btn-secondary" style="margin-left:8px"
                      @click="totp.regenerating=false; totp.regenPassword=''">取消</button>
            </div>
          </template>

          <template x-if="!totp.disabling">
            <button class="btn-secondary btn-danger-outline" @click="totp.disabling = true">停用兩步驟驗證</button>
          </template>
          <template x-if="totp.disabling">
            <div style="max-width:280px">
              <div class="form-group">
                <label class="form-label">輸入目前密碼以確認停用</label>
                <input class="form-input" type="password" x-model="totp.disablePassword" autocomplete="current-password">
              </div>
              <button class="btn-secondary btn-danger-outline" @click="totpDisable()" :disabled="totp.busy">
                <span x-text="totp.busy ? '處理中…' : '確認停用'"></span>
              </button>
              <button class="btn-secondary" style="margin-left:8px" @click="totp.disabling=false; totp.disablePassword=''">取消</button>
            </div>
          </template>
        </div>
      </template>
    </div>

    <!-- Passkey 設備管理 -->
    <!-- 2026-09-16：功能暫緩期間整張卡片不顯示（連同已綁定的裝置清單）——
         後端 /api/auth/webauthn/* 全部回 404，留著卡片只會讓人按了拿錯誤。
         既有憑證資料沒有被刪，恢復開關後清單會原樣回來。 -->
    <div class="card" style="margin-top:20px" x-show="passkeyFeatureEnabled">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
        <div class="card-title">Passkey 設備</div>
        <!-- 2026-09-11：全部憑證都因網域變更失效時不能顯示「已設定」——那會讓
             使用者以為還能用，直到登入失敗才發現。這種狀態要一眼看得出來。 -->
        <span class="totp-badge"
              :class="passkeys.list.length > 0 && !passkeys.list.every(p => p.stale) ? 'totp-on' : 'totp-off'"
              x-text="passkeys.list.length === 0 ? '未設定'
                      : (passkeys.list.every(p => p.stale) ? '已失效' : '已設定')"></span>
      </div>
      <div class="card-sub">
        用 Windows Hello、Touch ID 或 Security Key 登入——比密碼更安全、更快速的登入方式。
      </div>

      <div x-show="passkeys.err" class="alert alert-err" x-text="passkeys.err"></div>
      <div x-show="passkeys.ok" class="alert alert-ok" x-text="passkeys.ok"></div>

      <template x-if="passkeys.list.length === 0">
        <div style="margin:12px 0;color:#999;font-size:13px">尚未設定任何 Passkey 設備</div>
      </template>

      <template x-if="passkeys.list.length > 0">
        <div style="margin:12px 0">
          <template x-for="pk in passkeys.list" :key="pk.id">
            <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-light)">
              <div>
                <div style="font-weight:500">
                  <span x-text="pk.name"></span>
                  <!-- 2026-09-11：系統網域（RP ID）變更後，既有 Passkey 會失效且
                       無法復原。登入前的錯誤訊息刻意維持統一（避免用戶枚舉），
                       所以這裡是使用者唯一能看懂「為什麼突然不能用」的地方。 -->
                  <span x-show="pk.stale"
                        style="margin-left:6px;font-size:11px;font-weight:600;color:#DC2626;
                               background:#FEE2E2;border-radius:4px;padding:1px 6px">已失效</span>
                </div>
                <div style="font-size:11px;color:#999" x-text="'建立於 ' + new Date(pk.created_at).toLocaleDateString('zh-Hant')"></div>
                <div x-show="pk.stale" style="font-size:11px;color:#DC2626;margin-top:2px">
                  系統網域已變更，這張 Passkey 無法再用於登入（無法復原）。請刪除後重新註冊一張。
                </div>
              </div>
              <div style="display:flex;gap:6px">
                <button class="btn-mini" @click="passkeyRenaming = pk.id; passkeyNewName = pk.name" :disabled="passkeys.busy">改名</button>
                <button class="btn-mini btn-danger-outline" @click="passkeyDelete(pk.id)" :disabled="passkeys.busy">刪除</button>
              </div>
            </div>
          </template>
        </div>
      </template>

      <template x-if="passkeyRenaming">
        <div style="margin:12px 0;padding:12px;background:#F9FAFB;border-radius:6px">
          <div class="form-group">
            <label class="form-label">新名稱</label>
            <input class="form-input" type="text" x-model="passkeyNewName" style="max-width:200px">
          </div>
          <button class="btn-primary" @click="passkeyRenameSave()" :disabled="passkeys.busy">
            <span x-text="passkeys.busy ? '保存中…' : '保存'"></span>
          </button>
          <button class="btn-secondary" style="margin-left:8px" @click="passkeyRenaming = null">取消</button>
        </div>
      </template>

      <button class="btn-secondary" @click="passkeyRegisterStart()" :disabled="passkeys.busy" x-show="webauthnConfigured">
        <span x-text="passkeys.busy ? '處理中…' : '新增 Passkey'"></span>
      </button>
      <div x-show="!webauthnConfigured" style="font-size:12px;color:var(--text-dim);line-height:1.6">
        尚未設定 WebAuthn 網域，Passkey 功能暫不可用。請聯繫系統管理員在系統設定中填入 WebAuthn 設定。
      </div>
    </div>

  </div>

  <script>
  function changePwPage() {
    return {
      session: {},
      form: { current: '', newPw: '', confirm: '' },
      submitting: false,
      errMsg: '',
      okMsg: '',
      webauthnConfigured: false,
      // 2026-09-16 Passkey 功能暫緩。預設 false：停用是目前的常態，先畫出卡片
      // 再抽掉會讓使用者以為功能還在（還可能來得及按下去拿 404）；反過來晚一個
      // round-trip 才出現只是稍慢。恢復功能時端點回 enabled:true，卡片就回來。
      passkeyFeatureEnabled: false,
      totp: {
        loading: true, enabled: false, step: 'idle', busy: false, err: '',
        secret: '', qr: '', code: '', recoveryCodes: [],
        disabling: false, disablePassword: '',
        // 2026-09-11：救援碼存量與重新產生。預設 10 是為了避免狀態還沒載到
        // 的那一瞬間先閃一下「剩餘 0 組」的紅色警告
        recoveryRemaining: 10, regenerating: false, regenPassword: '', recoveryFromRegen: false,
      },
      passkeys: {
        list: [], busy: false, err: '', ok: '',
      },
      passkeyRenaming: null,
      passkeyNewName: '',

      // 🔴 Alpine 3 看到資料物件有 init() 就會**自己叫一次**，
      //    而 body 上那個明著呼叫初始化的屬性會再叫一次 ⇒ **跑兩遍**。
      // ☠️ 後果不只是 API 發兩次：第二次的回應晚一步抵達，
      //    會把使用者這段期間改過的欄位用伺服器上的舊值**無聲蓋回去**。
      _initDone: false,

      init() {
        if (this._initDone) return
        this._initDone = true
        const s = JSON.parse(localStorage.getItem('motrix_session') || 'null')
        if (!s?.token) { location.href = '../index.html'; return }
        this.session = s
        this.loadTotpStatus()
        // 2026-09-16：先問功能開關，確認還開著才去抓 Passkey 清單。
        // 停用時 /api/auth/webauthn/credentials 回 404，這裡若照舊無條件呼叫，
        // 每次進頁面都會在主控台留一筆沒有意義的 404。
        this.checkWebauthnConfig().then(() => {
          if (this.passkeyFeatureEnabled) this.loadPasskeys()
        })
      },

      async checkWebauthnConfig() {
        try {
          const r = await fetch('/api/system/webauthn-config-status')
          const data = await r.json().catch(() => ({}))
          this.webauthnConfigured = !!data.configured
          // 2026-09-16 Passkey 功能暫緩：`enabled:false` 時整張卡片不顯示。
          // 用 `!== false` 而不是 `!!data.enabled`——舊版後端沒有這個欄位，
          // 那時要維持原本行為（顯示），不能因為欄位不存在就把卡片藏掉。
          this.passkeyFeatureEnabled = data.enabled !== false
        } catch {}
      },

      async loadPasskeys() {
        this.passkeys.busy = true
        try {
          const r = await fetch('/api/auth/webauthn/credentials', { headers: this._authHeaders() })
          const data = await r.json().catch(() => [])
          if (r.ok) this.passkeys.list = data
        } catch {}
        this.passkeys.busy = false
      },

      async loadTotpStatus() {
        this.totp.loading = true
        try {
          const r = await fetch('/api/auth/totp/status', { headers: this._authHeaders() })
          const data = await r.json().catch(() => ({}))
          this.totp.enabled = !!data.enabled
          if (typeof data.recoveryCodesRemaining === 'number') {
            this.totp.recoveryRemaining = data.recoveryCodesRemaining
          }
        } catch {}
        this.totp.loading = false
      },

      _authHeaders() {
        return { Authorization: 'Bearer ' + this.session.token }
      },

      async totpStart() {
        this.totp.err = ''
        this.totp.busy = true
        try {
          const r = await fetch('/api/auth/totp/setup', { method: 'POST', headers: this._authHeaders() })
          const data = await r.json().catch(() => ({}))
          if (!r.ok) { this.totp.err = data.detail || '設定失敗，請稍後再試'; this.totp.busy = false; return }
          this.totp.secret = data.secret
          this.totp.qr     = data.qrCodePng
          this.totp.code   = ''
          this.totp.step   = 'confirm'
        } catch {
          this.totp.err = '連線異常，請稍後再試'
        }
        this.totp.busy = false
      },

      totpCancel() {
        this.totp.step = 'idle'
        this.totp.code = ''
        this.totp.err  = ''
      },

      async totpConfirm() {
        this.totp.err = ''
        if (!this.totp.code) { this.totp.err = '請輸入驗證碼'; return }
        this.totp.busy = true
        try {
          const r = await fetch('/api/auth/totp/enable', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...this._authHeaders() },
            body: JSON.stringify({ code: this.totp.code.trim() })
          })
          const data = await r.json().catch(() => ({}))
          if (!r.ok) { this.totp.err = data.detail || '驗證碼不正確'; this.totp.busy = false; return }
          this.totp.enabled           = true
          this.totp.recoveryFromRegen = false
          this.totp.recoveryCodes     = data.recoveryCodes
          this.totp.recoveryRemaining = (data.recoveryCodes || []).length
          this.totp.step              = 'recovery'
        } catch {
          this.totp.err = '連線異常，請稍後再試'
        }
        this.totp.busy = false
      },

      totpFinishRecovery() {
        this.totp.step          = 'idle'
        this.totp.secret        = ''
        this.totp.qr            = ''
        this.totp.code          = ''
        this.totp.recoveryCodes = []
        this.totp.recoveryFromRegen = false
      },

      async totpRegenerateRecovery() {
        // 與停用同一個態度對待：需要目前密碼。成功後直接重用「一次性顯示
        // 救援碼」那個畫面（step='recovery'），使用者看到的流程跟當初啟用時一模一樣，
        // 不用再學一次。明文只會出現這一次，DB 只存雜湊。
        this.totp.err = ''
        if (!this.totp.regenPassword) { this.totp.err = '請輸入目前密碼'; return }
        this.totp.busy = true
        try {
          const r = await fetch('/api/auth/totp/recovery-codes/regenerate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...this._authHeaders() },
            body: JSON.stringify({ password: this.totp.regenPassword })
          })
          const data = await r.json().catch(() => ({}))
          if (!r.ok) { this.totp.err = data.detail || '重新產生失敗'; this.totp.busy = false; return }
          this.totp.recoveryCodes     = data.recoveryCodes || []
          this.totp.recoveryRemaining = (data.recoveryCodes || []).length
          this.totp.regenerating      = false
          this.totp.recoveryFromRegen = true
          this.totp.regenPassword     = ''
          this.totp.step              = 'recovery'
        } catch {
          this.totp.err = '連線異常，請稍後再試'
        }
        this.totp.busy = false
      },

      async totpDisable() {
        this.totp.err = ''
        if (!this.totp.disablePassword) { this.totp.err = '請輸入目前密碼'; return }
        this.totp.busy = true
        try {
          const r = await fetch('/api/auth/totp/disable', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...this._authHeaders() },
            body: JSON.stringify({ password: this.totp.disablePassword })
          })
          const data = await r.json().catch(() => ({}))
          if (!r.ok) { this.totp.err = data.detail || '密碼不正確'; this.totp.busy = false; return }
          this.totp.enabled        = false
          this.totp.disabling      = false
          this.totp.disablePassword = ''
        } catch {
          this.totp.err = '連線異常，請稍後再試'
        }
        this.totp.busy = false
      },

      async passkeyRegisterStart() {
        this.passkeys.err = ''
        this.passkeys.busy = true
        try {
          const r = await fetch('/api/auth/webauthn/register/begin', { method: 'POST', headers: this._authHeaders() })
          const data = await r.json().catch(() => ({}))
          if (!r.ok) { this.passkeys.err = data.detail || '開始失敗'; this.passkeys.busy = false; return }
          const opts = data.options
          // 後端回傳的 options 裡，所有二進位欄位都是 base64 字串，瀏覽器要的是
          // ArrayBuffer——每一個都要轉，漏一個就是一句看不懂的 TypeError。
          if (typeof opts.challenge === 'string') opts.challenge = this._b64ToUint8Array(opts.challenge)
          if (opts.user && typeof opts.user.id === 'string') opts.user.id = this._b64ToUint8Array(opts.user.id)
          // 2026-09-11：這裡原本漏了 excludeCredentials。它是「已經註冊過的認證器」
          // 清單，用來擋同一個認證器重複註冊——**帳號還沒有任何 Passkey 時是空陣列，
          // 所以完全看不出問題**，等使用者成功註冊第一張之後，第二次註冊才會炸：
          //   Failed to read the 'id' property from 'PublicKeyCredentialDescriptor':
          //   The provided value is not of type '(ArrayBuffer or ArrayBufferView)'
          // login.html 對 allowCredentials 一直都有做同樣的轉換，只有這裡漏掉。
          if (Array.isArray(opts.excludeCredentials)) {
            opts.excludeCredentials = opts.excludeCredentials.map(c => ({
              ...c, id: typeof c.id === 'string' ? this._b64ToUint8Array(c.id) : c.id
            }))
          }
          const cred = await navigator.credentials.create({ publicKey: opts })
          if (!cred) { this.passkeys.err = '已取消'; this.passkeys.busy = false; return }
          await this.passkeyRegisterComplete(data.challengeToken, cred)
        } catch (e) {
          this.passkeys.err = e.message || '註冊失敗'
        }
        this.passkeys.busy = false
      },

      async passkeyRegisterComplete(token, cred) {
        try {
          const body = {
            challengeToken: token,
            id: cred.id,
            // WebAuthn 規格的 credential 一定帶 type（恆為 "public-key"），
            // py_webauthn 會驗它，少了就是 InvalidJSONStructure。2026-09-10 補。
            type: cred.type || 'public-key',
            rawId: this._uint8ArrayToB64(new Uint8Array(cred.rawId)),
            response: {
              clientDataJSON: this._uint8ArrayToB64(new Uint8Array(cred.response.clientDataJSON)),
              attestationObject: this._uint8ArrayToB64(new Uint8Array(cred.response.attestationObject)),
            }
          }
          const r = await fetch('/api/auth/webauthn/register/complete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', ...this._authHeaders() },
            body: JSON.stringify(body)
          })
          if (!r.ok) { const d = await r.json().catch(() => ({})); this.passkeys.err = d.detail || '註冊失敗'; return }
          this.passkeys.ok = '已新增 Passkey！'
          await this.loadPasskeys()
        } catch (e) {
          this.passkeys.err = e.message || '連線失敗'
        }
      },

      async passkeyRenameSave() {
        this.passkeys.err = ''
        if (!this.passkeyNewName) return
        this.passkeys.busy = true
        try {
          const r = await fetch(`/api/auth/webauthn/credentials/${this.passkeyRenaming}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', ...this._authHeaders() },
            body: JSON.stringify({ name: this.passkeyNewName })
          })
          if (!r.ok) { const d = await r.json().catch(() => ({})); this.passkeys.err = d.detail || '改名失敗'; }
          else { this.passkeys.ok = '已改名'; this.passkeyRenaming = null; await this.loadPasskeys() }
        } catch { this.passkeys.err = '連線失敗' }
        this.passkeys.busy = false
      },

      async passkeyDelete(id) {
        if (!confirm('確認要刪除此 Passkey 嗎？')) return
        this.passkeys.err = ''
        this.passkeys.busy = true
        try {
          const r = await fetch(`/api/auth/webauthn/credentials/${id}`, {
            method: 'DELETE',
            headers: this._authHeaders()
          })
          if (!r.ok) { const d = await r.json().catch(() => ({})); this.passkeys.err = d.detail || '刪除失敗'; }
          else { this.passkeys.ok = '已刪除'; await this.loadPasskeys() }
        } catch { this.passkeys.err = '連線失敗' }
        this.passkeys.busy = false
      },

      _b64ToUint8Array(b64) {
        // WebAuthn 使用 URL-safe base64（用 - 和 _ 替代 + 和 /），轉換為標準 base64
        const std64 = b64.replace(/-/g, '+').replace(/_/g, '/')
        const binary = atob(std64)
        const bytes = new Uint8Array(binary.length)
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i)
        return bytes
      },

      _uint8ArrayToB64(bytes) {
        let binary = ''
        for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i])
        // 轉回 URL-safe base64 供 WebAuthn 使用
        return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '')
      },

      async submit() {
        this.errMsg = ''
        if (this.form.newPw !== this.form.confirm) {
          this.errMsg = '新密碼與確認密碼不一致'
          return
        }
        if (this.form.newPw.length < 8) {   // 2026-09-14：與後端 MIN_PASSWORD_LEN = 8 對齊
          this.errMsg = '新密碼至少需要 8 個字元'
          return
        }
        this.submitting = true
        try {
          const r = await fetch('/api/auth/change-password', {
            method: 'PATCH',
            headers: {
              'Content-Type': 'application/json',
              Authorization: 'Bearer ' + this.session.token
            },
            body: JSON.stringify({
              current_password: this.form.current,
              new_password: this.form.newPw
            })
          })
          const data = await r.json().catch(() => ({}))
          if (!r.ok) {
            this.errMsg = data.detail || '更新失敗，請稍後再試'
          } else {
            this.okMsg = '密碼已更新！2 秒後將重新登入…'
            setTimeout(() => {
              localStorage.removeItem('motrix_session')
              location.href = '../index.html'
            }, 2000)
          }
        } catch {
          this.errMsg = '連線異常，請稍後再試'
        } finally {
          this.submitting = false
        }
      },

      logout() {
        fetch('/api/auth/logout', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + this.session.token }
        }).finally(() => {
          localStorage.removeItem('motrix_session')
          location.href = '../index.html'
        })
      }
    }
  }
  </script>
  <script src="../static/notif.js"></script>
  <script src="../static/sidebar.js"></script>
</body>
