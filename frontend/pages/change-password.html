<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>修改密碼 — MOTRIX</title>
  <!-- 舊網址保留：「修改密碼」已併入「我的帳號 → 帳號安全」。書籤、舊信件裡的連結仍可用；forced／wizard 等參數原樣帶過去。 -->
  <script>
    (function () {
      var q = new URLSearchParams(location.search)
      if (!q.has('tab') && !q.has('forced') && !q.has('wizard')) q.set('tab', 'security')
      location.replace('my-account.html?' + q.toString() + location.hash)
    })()
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=my-account.html?tab=security"></noscript>
</head>
<body>
  <p style="font:14px sans-serif;padding:24px">這個頁面已搬到 <a href="my-account.html?tab=security">我的帳號 → 帳號安全</a>。</p>
</body>
</html>
