<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../static/favicon.png">
  <title>專案管理 — MOTRIX 營運管理系統</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    [x-cloak] { display:none !important; }

    .pj-layout { display:flex; height:calc(100vh - var(--topbar-h)); overflow:hidden; }

    /* ── Left list ── */
    .pj-list { width:300px; min-width:300px; border-right:1px solid var(--border-light); display:flex; flex-direction:column; background:#FAFAF9; overflow:hidden; }
    .pj-list__head { padding:14px 14px 0; background:#fff; border-bottom:1px solid var(--border-light); }
    .pj-list__title-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .pj-list__title { font-size:13px; font-weight:700; color:var(--text-primary); font-family:var(--font-zh); }
    .pj-list__tabs { display:flex; padding:0 2px; overflow-x:auto; }
    .pj-list__tab { font-size:11px; font-family:var(--font-zh); padding:5px 10px; border:none; background:none; color:var(--text-dim); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; transition:all .1s; }
    .pj-list__tab.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
    .pj-list__body { flex:1; overflow-y:auto; padding:4px 0; }
    .pj-list__body::-webkit-scrollbar { width:4px; }
    .pj-list__body::-webkit-scrollbar-thumb { background:var(--border-light); border-radius:2px; }
    .pj-search { padding:10px 14px; }
    .pj-search-input { width:100%; padding:7px 10px; font-size:12px; border:1px solid var(--border-light); border-radius:6px; font-family:var(--font-zh); background:#F9FAFB; outline:none; box-sizing:border-box; }
    .pj-search-input:focus { border-color:var(--accent); background:#fff; }

    .pj-card { padding:11px 14px; border-bottom:1px solid #F0EFEB; cursor:pointer; transition:background .1s; }
    .pj-card:hover { background:#F5F4F0; }
    .pj-card.selected { background:#EEF2FF; border-left:3px solid var(--accent); padding-left:11px; }
    .pj-card__head { display:flex; align-items:center; justify-content:space-between; margin-bottom:3px; }
    .pj-card__code { font-size:11px; font-family:Inter,sans-serif; font-weight:700; color:var(--accent); }
    .pj-card__name { font-size:12px; color:var(--text-primary); font-family:var(--font-zh); font-weight:500; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pj-card__foot { display:flex; align-items:center; gap:6px; }
    .pj-empty { padding:40px 20px; text-align:center; color:var(--text-dim); font-size:13px; font-family:var(--font-zh); }

    /* Status badges */
    .status-badge { font-size:9px; padding:2px 7px; border-radius:4px; font-weight:600; font-family:var(--font-zh); white-space:nowrap; }
    .st-planning  { background:#EFF6FF; color:#1D4ED8; }
    .st-inprogress{ background:#DCFCE7; color:#15803D; }
    .st-paused    { background:#FEF3C7; color:#92400E; }
    .st-reviewing { background:#F3E8FF; color:#7C3AED; }
    .st-done      { background:#F0FDF4; color:#166534; border:1px solid #BBF7D0; }
    .st-closed    { background:#F3F4F6; color:#374151; }
    .st-cancelled { background:#FEE2E2; color:#991B1B; }

    /* ── Right detail ── */
    .pj-detail { flex:1; display:flex; flex-direction:column; overflow:hidden; background:#fff; }
    .pj-placeholder { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:var(--text-dim); }
    .pj-placeholder svg { width:48px; height:48px; opacity:.3; }

    /* Detail header */
    .pj-header { background:#fff; border-bottom:1px solid var(--border-light); flex-shrink:0; padding:14px 20px 10px; }
    .pj-header__top { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
    .pj-header__code { font-size:11px; font-family:Inter,sans-serif; font-weight:700; color:var(--text-dim); }
    .pj-header__name { font-size:16px; font-weight:700; font-family:var(--font-zh); color:var(--text-primary); flex:1; }
    .pj-header__actions { display:flex; align-items:center; gap:6px; margin-left:auto; }

    /* Tabs */
    .pj-tabs { display:flex; border-bottom:1px solid var(--border-light); padding:0 20px; background:#fff; flex-shrink:0; }
    .pj-tab { font-size:12px; font-family:var(--font-zh); padding:8px 14px; border:none; background:none; color:var(--text-dim); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; transition:all .1s; }
    .pj-tab.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }

    /* Detail body */
    .pj-body { flex:1; overflow-y:auto; padding:20px; }
    .pj-body::-webkit-scrollbar { width:5px; }
    .pj-body::-webkit-scrollbar-thumb { background:var(--border-light); border-radius:3px; }

    /* Info section */
    .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:20px; }
    .info-field label { font-size:10px; font-family:Inter,sans-serif; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); font-weight:500; display:block; margin-bottom:4px; }
    .info-field .val { font-size:13px; font-family:var(--font-zh); color:var(--text-primary); }
    .info-field input, .info-field textarea, .info-field select {
      width:100%; padding:8px 10px; border:1px solid var(--border-light); border-radius:var(--radius); font-size:13px; font-family:var(--font-zh); outline:none; background:#fff; box-sizing:border-box; transition:border-color .12s;
    }
    .info-field input:focus, .info-field textarea:focus, .info-field select:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,.07); }
    .info-field textarea { resize:vertical; min-height:70px; }
    .info-full { grid-column:1/-1; }

    /* Linked cases */
    .linked-case-tag { display:inline-flex; align-items:center; gap:4px; padding:3px 8px 3px 10px; background:#EFF6FF; color:#1D4ED8; border:1px solid #BFDBFE; border-radius:5px; font-size:12px; font-family:Inter,sans-serif; font-weight:600; margin:3px; }
    .linked-case-tag .rm { background:none; border:none; cursor:pointer; color:#93C5FD; font-size:13px; padding:0 0 0 3px; line-height:1; }
    .linked-case-tag .rm:hover { color:#EF4444; }
    .add-case-row { display:flex; gap:6px; margin-top:6px; }
    .add-case-input { flex:1; padding:6px 10px; border:1px solid var(--border-light); border-radius:5px; font-size:12px; font-family:Inter,sans-serif; outline:none; }
    .add-case-input:focus { border-color:var(--accent); }

    /* Log timeline */
    .log-entry { border:1px solid var(--border-light); border-radius:10px; margin-bottom:14px; overflow:hidden; }
    .log-entry__head { display:flex; align-items:center; gap:10px; padding:12px 16px; background:#FAFAF9; cursor:pointer; border-bottom:1px solid transparent; transition:background .1s; }
    .log-entry__head:hover { background:#F5F4F0; }
    .log-entry.open .log-entry__head { border-bottom-color:var(--border-light); background:#fff; }
    .log-date { font-size:13px; font-family:Inter,sans-serif; font-weight:700; color:var(--text-primary); }
    .log-by { font-size:11px; color:var(--text-dim); font-family:var(--font-zh); }
    .log-chevron { margin-left:auto; color:var(--text-dim); transition:transform .2s; }
    .log-entry.open .log-chevron { transform:rotate(180deg); }
    .log-stats { display:flex; gap:8px; margin-left:auto; margin-right:10px; }
    .log-stat { font-size:10px; padding:2px 7px; border-radius:4px; font-family:var(--font-zh); }
    .log-stat.items { background:#FEF3C7; color:#92400E; }
    .log-stat.photos { background:#EDE9FE; color:#6D28D9; }
    .log-body { padding:16px; }

    /* Work content */
    .section-label { font-size:10px; font-family:Inter,sans-serif; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); font-weight:600; margin-bottom:6px; margin-top:14px; }
    .section-label:first-child { margin-top:0; }
    .work-content { font-size:13px; font-family:var(--font-zh); color:var(--text-primary); line-height:1.7; white-space:pre-wrap; background:#F9FAFB; border-radius:6px; padding:10px 12px; }
    .work-content-edit { width:100%; min-height:80px; padding:9px 11px; border:1px solid var(--border-light); border-radius:6px; font-size:13px; font-family:var(--font-zh); resize:vertical; outline:none; box-sizing:border-box; }
    .work-content-edit:focus { border-color:var(--accent); }

    /* Attendees */
    .attendee-chips { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
    .attendee-chip { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; background:#F0FDF4; color:#15803D; border-radius:5px; font-size:12px; font-family:var(--font-zh); }
    .attendee-chip .rm { background:none; border:none; cursor:pointer; color:#86EFAC; font-size:12px; padding:0; }
    .attendee-chip .rm:hover { color:#DC2626; }
    .attendee-add { display:flex; gap:6px; margin-top:6px; }
    .attendee-select { flex:1; padding:5px 8px; border:1px solid var(--border-light); border-radius:5px; font-size:12px; font-family:var(--font-zh); outline:none; }
    .attendee-select:focus { border-color:var(--accent); }

    /* Action items */
    .action-item { display:flex; align-items:flex-start; gap:10px; padding:9px 12px; border:1px solid var(--border-light); border-radius:7px; margin-bottom:6px; }
    .action-item.done-item { background:#F0FDF4; border-color:#BBF7D0; }
    .action-item.stage1-item { background:#FFFBEB; border-color:#FDE68A; }
    .action-item__text { flex:1; font-size:13px; font-family:var(--font-zh); color:var(--text-primary); line-height:1.5; }
    .action-item.done-item .action-item__text { color:var(--text-dim); text-decoration:line-through; }
    .action-item__meta { font-size:10px; color:var(--text-dim); font-family:Inter,sans-serif; margin-top:3px; }
    .action-item__btns { display:flex; gap:4px; flex-shrink:0; }
    .approve-btn { font-size:10px; padding:3px 8px; border-radius:4px; border:1px solid; cursor:pointer; font-family:var(--font-zh); transition:all .1s; white-space:nowrap; }
    .approve-btn.eng { background:#FFFBEB; color:#92400E; border-color:#FDE68A; }
    .approve-btn.eng:hover { background:#FEF3C7; }
    .approve-btn.biz { background:#EFF6FF; color:#1D4ED8; border-color:#BFDBFE; }
    .approve-btn.biz:hover { background:#DBEAFE; }
    .approve-btn:disabled { opacity:.4; cursor:not-allowed; }
    .action-status { font-size:9px; padding:2px 6px; border-radius:4px; font-weight:600; white-space:nowrap; }
    .as-pending   { background:#F3F4F6; color:#6B7280; }
    .as-stage1    { background:#FEF3C7; color:#92400E; }
    .as-done      { background:#DCFCE7; color:#15803D; }

    /* Material usage */
    .mat-row { display:flex; align-items:center; gap:8px; padding:7px 10px; border:1px solid var(--border-light); border-radius:6px; margin-bottom:5px; font-size:12px; font-family:var(--font-zh); }
    .mat-row__name { flex:1; }
    .mat-row__qty  { width:60px; padding:3px 6px; border:1px solid var(--border-light); border-radius:4px; font-size:12px; text-align:right; outline:none; }

    /* Photo gallery */
    .photo-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:8px; }
    .photo-thumb { position:relative; aspect-ratio:4/3; border-radius:7px; overflow:hidden; background:#F0EFEB; cursor:pointer; border:1px solid var(--border-light); }
    .photo-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
    .photo-thumb:hover .photo-overlay { opacity:1; }
    .photo-overlay { position:absolute; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; gap:8px; opacity:0; transition:opacity .15s; }
    .photo-overlay button { width:28px; height:28px; border-radius:50%; border:none; background:rgba(255,255,255,.9); color:#374151; cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; }
    .photo-overlay button.del { color:#DC2626; }
    .photo-gps { position:absolute; bottom:4px; left:4px; background:rgba(0,0,0,.6); color:#fff; font-size:9px; padding:2px 5px; border-radius:3px; font-family:Inter,sans-serif; }
    .photo-upload-area { border:2px dashed var(--border-light); border-radius:8px; padding:20px; text-align:center; cursor:pointer; color:var(--text-dim); font-size:12px; font-family:var(--font-zh); transition:border-color .15s; }
    .photo-upload-area:hover { border-color:var(--accent); color:var(--accent); }

    /* Photo lightbox */
    .lightbox { position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:999; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; }
    .lightbox img { max-width:90vw; max-height:80vh; border-radius:8px; object-fit:contain; }
    .lightbox__meta { font-size:11px; color:rgba(255,255,255,.7); font-family:Inter,sans-serif; text-align:center; }
    .lightbox__close { position:absolute; top:16px; right:20px; background:none; border:none; color:#fff; font-size:28px; cursor:pointer; line-height:1; }

    /* New log / item form */
    .action-new { display:flex; gap:6px; margin-top:6px; }
    .action-new input { flex:1; padding:7px 10px; border:1px solid var(--border-light); border-radius:5px; font-size:12px; font-family:var(--font-zh); outline:none; }
    .action-new input:focus { border-color:var(--accent); }

    /* Buttons */
    .btn { display:inline-flex; align-items:center; gap:5px; padding:7px 14px; border-radius:var(--radius); font-size:12px; font-family:var(--font-zh); cursor:pointer; border:none; transition:all .12s; font-weight:500; }
    .btn-primary { background:var(--accent); color:#fff; }
    .btn-primary:hover { background:#1D4ED8; }
    .btn-ghost { background:#fff; color:var(--text-secondary); border:1px solid var(--border-light); }
    .btn-ghost:hover { border-color:#9CA3AF; }
    .btn-danger-ghost { background:#fff; color:var(--danger); border:1px solid #FECACA; }
    .btn-danger-ghost:hover { background:#FEF2F2; }
    .btn-sm { padding:5px 10px; font-size:11px; }
    .btn-green { background:#059669; color:#fff; }
    .btn-green:hover { background:#047857; }

    /* Modal */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:200; display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; }
    .modal-box { background:#fff; border-radius:12px; width:100%; max-width:580px; box-shadow:var(--shadow-lg); overflow:hidden; }
    .modal-head { display:flex; align-items:center; padding:14px 18px; border-bottom:1px solid var(--border-light); gap:8px; }
    .modal-head__title { font-size:14px; font-weight:600; flex:1; font-family:var(--font-zh); }
    .modal-close { width:26px; height:26px; border-radius:4px; border:none; background:#F0EEE9; cursor:pointer; font-size:16px; color:var(--text-secondary); }
    .modal-close:hover { background:#FEF2F2; color:var(--danger); }
    .modal-body { padding:18px; }
    .modal-foot { padding:12px 18px; border-top:1px solid var(--border-light); display:flex; justify-content:flex-end; gap:8px; }
    .form-row { margin-bottom:12px; }
    .form-label { display:block; font-size:10px; font-family:Inter,sans-serif; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); font-weight:500; margin-bottom:4px; }
    .form-input, .form-select, .form-textarea {
      width:100%; padding:8px 10px; border:1px solid var(--border-light); border-radius:var(--radius); font-size:13px; font-family:var(--font-zh); background:#fff; outline:none; box-sizing:border-box; transition:border-color .12s;
    }
    .form-input:focus,.form-select:focus,.form-textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,.07); }
    .form-textarea { resize:vertical; min-height:80px; }

    /* Status selector chips */
    .status-chips { display:flex; flex-wrap:wrap; gap:6px; }
    .status-chip { padding:5px 12px; border-radius:20px; font-size:11px; font-family:var(--font-zh); cursor:pointer; border:1px solid var(--border-light); background:#F9FAFB; color:var(--text-dim); transition:all .1s; }
    .status-chip.active { border-color:var(--accent); background:var(--accent-light); color:var(--accent); font-weight:600; }

    /* Toast */
    .toast { position:fixed; bottom:24px; right:24px; z-index:9999; background:#1F2937; color:#fff; padding:10px 18px; border-radius:8px; font-size:13px; font-family:var(--font-zh); box-shadow:0 4px 16px rgba(0,0,0,.25); transform:translateY(0); transition:all .25s; }
    .toast.hidden { transform:translateY(20px); opacity:0; pointer-events:none; }

    /* ── Mobile ── */
    .mob-back { display:none; align-items:center; gap:5px; background:none; border:none; cursor:pointer; color:var(--accent); font-size:12px; font-family:var(--font-zh); padding:0; margin-right:6px; line-height:1; }
    @media (max-width:767px) {
      .pj-layout { flex-direction:column; height:auto; min-height:calc(100vh - var(--topbar-h)); }
      .pj-list { width:100%; min-width:0; border-right:none; border-bottom:1px solid var(--border-light); max-height:40vh; flex-shrink:0; }
      .pj-list.mob-hidden { display:none !important; }
      .pj-detail { flex:1; min-height:0; }
      .pj-detail.mob-hidden { display:none !important; }
      .mob-back { display:inline-flex; }
      .photo-grid { grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:6px; }
      .photo-upload-area { padding:14px; }
      .modal-overlay { padding:8px; align-items:flex-end; }
      .modal-box { max-width:100% !important; border-radius:16px 16px 0 0; }
      .modal-body { max-height:72vh; overflow-y:auto; }
      .pj-body { padding:12px; }
      .pj-header { padding:10px 12px 8px; }
      .pj-header__name { font-size:14px; }
      .log-body { padding:10px 12px; }
    }
  </style>
</head>
<body x-data="projectsPage()" x-init="init()" x-cloak>

    <header id="app-topbar" class="topbar"></header>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="app-sidebar"></aside>

  <!-- Main layout -->
  <div class="pj-layout" style="margin-left:var(--sidebar-w);margin-top:var(--topbar-h);">

    <!-- Left: Project list -->
    <div class="pj-list" :class="{'mob-hidden': selected && isMobileView}">
      <div class="pj-list__head">
        <div class="pj-list__title-row">
          <span class="pj-list__title">專案管理</span>
          <button class="btn btn-primary btn-sm" @click="openCreateProject()" x-show="canManage()">
            <svg viewBox="0 0 20 20" fill="currentColor" style="width:12px;height:12px"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
            新增
          </button>
        </div>
        <div class="pj-search">
          <input class="pj-search-input" type="text" placeholder="搜尋專案..." x-model="searchQ">
        </div>
        <div class="pj-list__tabs">
          <template x-for="s in ['全部','規劃中','進行中','暫停','驗收中','完工','結案','取消']" :key="s">
            <button class="pj-list__tab" :class="{active: filterStatus===s}" @click="filterStatus=s" x-text="s"></button>
          </template>
        </div>
      </div>
      <div class="pj-list__body">
        <template x-if="filteredProjects.length===0">
          <div class="pj-empty">尚無符合的專案</div>
        </template>
        <template x-for="p in filteredProjects" :key="p.id">
          <div class="pj-card" :class="{selected: selected?.id===p.id}" @click="selectProject(p)">
            <div class="pj-card__head">
              <span class="pj-card__code" x-text="p.code"></span>
              <span class="status-badge" :class="statusClass(p.status)" x-text="p.status"></span>
            </div>
            <div class="pj-card__name" x-text="p.name"></div>
            <div class="pj-card__foot">
              <span style="font-size:10px;color:var(--text-dim);font-family:Inter,sans-serif;" x-text="(p.linked_cases||[]).length + ' 個案件'"></span>
              <span style="font-size:10px;color:var(--text-dim);font-family:Inter,sans-serif;margin-left:auto;" x-text="fmtDate(p.created_at)"></span>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- Right: Detail -->
    <div class="pj-detail" :class="{'mob-hidden': !selected && isMobileView}">
      <!-- Placeholder -->
      <template x-if="!selected">
        <div class="pj-placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
          <span style="font-size:13px;font-family:var(--font-zh);">選擇專案以查看詳情</span>
        </div>
      </template>

      <!-- Detail content -->
      <template x-if="selected">
        <div style="display:flex;flex-direction:column;height:100%;overflow:hidden;">
          <!-- Header -->
          <div class="pj-header">
            <div class="pj-header__top">
              <button class="mob-back" @click="selected=null;logs=[];openLogs=[]">← 列表</button>
              <span class="pj-header__code" x-text="selected.code"></span>
              <span class="status-badge" :class="statusClass(selected.status)" x-text="selected.status" style="font-size:11px;padding:3px 9px;"></span>
              <h2 class="pj-header__name" x-text="selected.name"></h2>
              <div class="pj-header__actions">
                <!-- Status change dropdown -->
                <template x-if="canManage()">
                  <select style="padding:5px 8px;border:1px solid var(--border-light);border-radius:5px;font-size:11px;font-family:var(--font-zh);outline:none;"
                    @change="changeStatus($event.target.value); $event.target.value=''">
                    <option value="">變更狀態...</option>
                    <template x-for="s in ['規劃中','進行中','暫停','驗收中','完工','結案','取消']" :key="s">
                      <option :value="s" x-text="s"></option>
                    </template>
                  </select>
                </template>
                <button class="btn btn-ghost btn-sm" @click="openEditProject()" x-show="canManage()">編輯</button>
                <button class="btn btn-danger-ghost btn-sm" @click="deleteProject()" x-show="canManage() && (selected.status==='規劃中'||selected.status==='取消')">刪除</button>
              </div>
            </div>
            <div style="font-size:12px;color:var(--text-dim);font-family:var(--font-zh);" x-show="selected.description" x-text="selected.description"></div>
            <div style="font-size:11px;color:var(--text-dim);font-family:Inter,sans-serif;margin-top:4px;">
              建立：<span x-text="selected.created_by"></span> ·
              <span x-text="fmtDate(selected.created_at)"></span>
              <span x-show="(selected.linked_cases||[]).length">
                · 關聯案件：
                <template x-for="qno in (selected.linked_cases||[])" :key="qno">
                  <a :href="'case-management.html?q='+qno" style="color:var(--accent);font-weight:600;margin-right:4px;" x-text="qno"></a>
                </template>
              </span>
            </div>
          </div>

          <!-- Tabs -->
          <div class="pj-tabs">
            <button class="pj-tab" :class="{active:tab==='logs'}" @click="tab='logs'">工作日誌</button>
            <button class="pj-tab" :class="{active:tab==='info'}" @click="tab='info'">專案資訊</button>
          </div>

          <!-- Body -->
          <div class="pj-body">

            <!-- ── 工作日誌 tab ── -->
            <template x-if="tab==='logs'">
              <div>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
                  <span style="font-size:13px;font-weight:600;font-family:var(--font-zh);">共 <span x-text="logs.length"></span> 筆日誌</span>
                  <button class="btn btn-primary btn-sm" @click="openNewLog()" x-show="canManage()">
                    <svg viewBox="0 0 20 20" fill="currentColor" style="width:12px;height:12px"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
                    新增日誌
                  </button>
                </div>

                <template x-if="logs.length===0">
                  <div style="text-align:center;color:var(--text-dim);font-size:13px;font-family:var(--font-zh);padding:40px;">尚無工作日誌</div>
                </template>

                <template x-for="log in logs" :key="log.id">
                  <div class="log-entry" :class="{open: openLogs.includes(log.id)}">
                    <div class="log-entry__head" @click="toggleLog(log.id)">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:16px;height:16px;color:var(--accent);flex-shrink:0;"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                      <span class="log-date" x-text="log.log_date"></span>
                      <span class="log-by" x-text="log.created_by"></span>
                      <div class="log-stats">
                        <span class="log-stat items" x-show="(log.action_items||[]).length">
                          <span x-text="(log.action_items||[]).filter(i=>i.status==='done').length"></span>/<span x-text="(log.action_items||[]).length"></span> 確認
                        </span>
                        <span class="log-stat photos" x-show="(log.photos||[]).length">
                          <span x-text="(log.photos||[]).length"></span> 張
                        </span>
                      </div>
                      <svg class="log-chevron" viewBox="0 0 20 20" fill="currentColor" style="width:16px;height:16px;"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
                    </div>

                    <div class="log-body" x-show="openLogs.includes(log.id)" x-transition>
                      <!-- Work content -->
                      <div class="section-label">工作內容</div>
                      <div class="work-content" x-text="log.work_content || '（未填寫）'"></div>

                      <!-- Attendees -->
                      <template x-if="(log.attendees||[]).length">
                        <div>
                          <div class="section-label">出勤人員</div>
                          <div class="attendee-chips">
                            <template x-for="a in log.attendees" :key="a">
                              <span class="attendee-chip" x-text="a"></span>
                            </template>
                          </div>
                        </div>
                      </template>

                      <!-- Action items -->
                      <template x-if="(log.action_items||[]).length">
                        <div>
                          <div class="section-label">確認事項 / 待辦</div>
                          <template x-for="item in log.action_items" :key="item.id">
                            <div class="action-item"
                              :class="{'done-item': item.status==='done', 'stage1-item': item.status==='stage1_done'}">
                              <div style="flex:1">
                                <div class="action-item__text" x-text="item.text"></div>
                                <div class="action-item__meta" x-show="item.stage1_approver">
                                  工程確認：<span x-text="item.stage1_approver"></span> <span x-text="fmtDateTime(item.stage1_at)"></span>
                                  <template x-if="item.stage2_approver">
                                    ｜業務確認：<span x-text="item.stage2_approver"></span> <span x-text="fmtDateTime(item.stage2_at)"></span>
                                  </template>
                                </div>
                              </div>
                              <span class="action-status" :class="itemStatusClass(item.status)" x-text="itemStatusLabel(item.status)"></span>
                              <div class="action-item__btns">
                                <template x-if="item.status==='pending' && canApproveEng()">
                                  <button class="approve-btn eng" @click.stop="approveItem(log, item, 1)">✓ 工程確認</button>
                                </template>
                                <template x-if="item.status==='stage1_done' && canApproveBiz()">
                                  <button class="approve-btn biz" @click.stop="approveItem(log, item, 2)">✓ 業務確認</button>
                                </template>
                              </div>
                            </div>
                          </template>
                        </div>
                      </template>

                      <!-- Material usage -->
                      <template x-if="(log.materials_used||[]).length">
                        <div>
                          <div class="section-label">物料使用紀錄</div>
                          <template x-for="m in log.materials_used" :key="m.id||m.name">
                            <div class="mat-row">
                              <span class="mat-row__name" x-text="m.name"></span>
                              <span style="font-size:11px;color:var(--text-dim);" x-text="m.unit||''"></span>
                              <span style="font-size:12px;font-weight:600;font-family:Inter,sans-serif;" x-text="m.qty"></span>
                            </div>
                          </template>
                        </div>
                      </template>

                      <!-- Photos -->
                      <div>
                        <div class="section-label">施工照片（<span x-text="(log.photos||[]).length"></span> 張）</div>
                        <div class="photo-grid" x-show="(log.photos||[]).length">
                          <template x-for="ph in log.photos" :key="ph.id">
                            <div class="photo-thumb">
                              <img :src="photoUrl(ph.path)" loading="lazy" @error="$el.src='data:image/svg+xml,<svg/>'">
                              <div class="photo-overlay">
                                <button @click.stop="lightboxPhoto=ph" title="查看">🔍</button>
                                <button class="del" @click.stop="deletePhoto(log, ph)" title="刪除" x-show="canManage()">✕</button>
                              </div>
                              <span class="photo-gps" x-show="ph.gps" x-text="'📍 '+ph.gps.substring(0,12)+'...'"></span>
                            </div>
                          </template>
                        </div>
                        <!-- Upload area -->
                        <div class="photo-upload-area" x-show="canManage()" @click="triggerPhotoUpload(log)"
                          style="margin-top:8px;">
                          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:24px;height:24px;margin:0 auto 6px;display:block;"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                          點擊或拖曳上傳照片（支援多張，自動加水印）
                        </div>
                        <input type="file" accept="image/*" multiple style="display:none" :ref="'photoInput_'+log.id"
                          @change="handlePhotoUpload($event, log)">
                      </div>

                      <!-- Log actions -->
                      <div style="display:flex;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--border-light);" x-show="canManage()">
                        <button class="btn btn-ghost btn-sm" @click="openEditLog(log)">編輯日誌</button>
                        <button class="btn btn-danger-ghost btn-sm" @click="deleteLog(log)" x-show="session.role==='superadmin'||session.role==='admin'">刪除</button>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </template>

            <!-- ── 專案資訊 tab ── -->
            <template x-if="tab==='info'">
              <div>
                <div class="info-grid">
                  <div class="info-field">
                    <label>開始日期</label>
                    <template x-if="canManage()">
                      <input type="date" x-model="infoEdit.startDate" @change="saveInfo()">
                    </template>
                    <template x-if="!canManage()">
                      <div class="val" x-text="selected.data_json?.startDate||'—'"></div>
                    </template>
                  </div>
                  <div class="info-field">
                    <label>預計完工</label>
                    <template x-if="canManage()">
                      <input type="date" x-model="infoEdit.endDate" @change="saveInfo()">
                    </template>
                    <template x-if="!canManage()">
                      <div class="val" x-text="selected.data_json?.endDate||'—'"></div>
                    </template>
                  </div>
                  <div class="info-field">
                    <label>施工地點</label>
                    <template x-if="canManage()">
                      <input type="text" x-model="infoEdit.location" @change="saveInfo()" placeholder="地址或描述">
                    </template>
                    <template x-if="!canManage()">
                      <div class="val" x-text="selected.data_json?.location||'—'"></div>
                    </template>
                  </div>
                  <div class="info-field">
                    <label>業主聯絡人</label>
                    <template x-if="canManage()">
                      <input type="text" x-model="infoEdit.clientContact" @change="saveInfo()" placeholder="姓名 / 電話">
                    </template>
                    <template x-if="!canManage()">
                      <div class="val" x-text="selected.data_json?.clientContact||'—'"></div>
                    </template>
                  </div>
                  <div class="info-field info-full">
                    <label>備註</label>
                    <template x-if="canManage()">
                      <textarea x-model="infoEdit.notes" @change="saveInfo()" placeholder="其他說明..."></textarea>
                    </template>
                    <template x-if="!canManage()">
                      <div class="val" x-text="selected.data_json?.notes||'—'" style="white-space:pre-wrap;"></div>
                    </template>
                  </div>
                  <!-- Linked cases -->
                  <div class="info-field info-full">
                    <label>關聯案件</label>
                    <div style="flex-wrap:wrap;display:flex;">
                      <template x-for="qno in (selected.linked_cases||[])" :key="qno">
                        <span class="linked-case-tag">
                          <span x-text="qno"></span>
                          <button class="rm" @click="unlinkCase(qno)" x-show="canManage()">×</button>
                        </span>
                      </template>
                    </div>
                    <div class="add-case-row" x-show="canManage()">
                      <input class="add-case-input" type="text" placeholder="輸入報價單號 MQ-..." x-model="newCaseNo"
                        @keydown.enter="linkCase()">
                      <button class="btn btn-ghost btn-sm" @click="linkCase()">關聯</button>
                    </div>
                  </div>
                </div>
              </div>
            </template>

          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- ── Create/Edit Project Modal ── -->
  <div class="modal-overlay" x-show="showProjectModal" x-cloak @click.self="showProjectModal=false">
    <div class="modal-box">
      <div class="modal-head">
        <span class="modal-head__title" x-text="editingProjectId ? '編輯專案' : '新增專案'"></span>
        <button class="modal-close" @click="showProjectModal=false">×</button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <label class="form-label">專案名稱 <span style="color:var(--danger)">*</span></label>
          <input class="form-input" type="text" x-model="pForm.name" placeholder="輸入專案名稱">
        </div>
        <div class="form-row">
          <label class="form-label">初始狀態</label>
          <div class="status-chips">
            <template x-for="s in ['規劃中','進行中','暫停']" :key="s">
              <span class="status-chip" :class="{active: pForm.status===s}" @click="pForm.status=s" x-text="s"></span>
            </template>
          </div>
        </div>
        <div class="form-row">
          <label class="form-label">描述說明</label>
          <textarea class="form-textarea" x-model="pForm.description" placeholder="簡述專案背景或目標..."></textarea>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" @click="showProjectModal=false">取消</button>
        <button class="btn btn-primary" @click="saveProject()" :disabled="!pForm.name.trim()">儲存</button>
      </div>
    </div>
  </div>

  <!-- ── New/Edit Log Modal ── -->
  <div class="modal-overlay" x-show="showLogModal" x-cloak @click.self="showLogModal=false">
    <div class="modal-box" style="max-width:640px;">
      <div class="modal-head">
        <span class="modal-head__title" x-text="editingLogId ? '編輯日誌' : '新增工作日誌'"></span>
        <button class="modal-close" @click="showLogModal=false">×</button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <label class="form-label">日期 <span style="color:var(--danger)">*</span></label>
          <input class="form-input" type="date" x-model="lForm.log_date">
        </div>
        <div class="form-row">
          <label class="form-label">工作內容</label>
          <textarea class="form-textarea" x-model="lForm.work_content" placeholder="描述今日施工或推進的工作..."></textarea>
        </div>
        <!-- Attendees -->
        <div class="form-row">
          <label class="form-label">出勤人員</label>
          <div class="attendee-chips" style="margin-bottom:6px;">
            <template x-for="(a,ai) in lForm.attendees" :key="ai">
              <span class="attendee-chip">
                <span x-text="a"></span>
                <button class="rm" @click="lForm.attendees.splice(ai,1)">×</button>
              </span>
            </template>
          </div>
          <div class="attendee-add">
            <select class="attendee-select" x-model="newAttendee">
              <option value="">選擇系統使用者...</option>
              <template x-for="u in allUsers" :key="u.username">
                <option :value="u.displayName" x-text="u.displayName + ' (' + u.username + ')'"></option>
              </template>
            </select>
            <button class="btn btn-ghost btn-sm" @click="addAttendee()">加入</button>
          </div>
          <div class="attendee-add" style="margin-top:4px;">
            <input type="text" class="attendee-select" placeholder="或輸入外部人員姓名..." x-model="newAttendeeText"
              @keydown.enter="addAttendeeText()">
            <button class="btn btn-ghost btn-sm" @click="addAttendeeText()">加入</button>
          </div>
        </div>
        <!-- Action items -->
        <div class="form-row">
          <label class="form-label">確認事項 / 待辦</label>
          <template x-for="(item,idx) in lForm.action_items" :key="idx">
            <div style="display:flex;gap:6px;margin-bottom:5px;align-items:center;">
              <input type="text" style="flex:1;padding:6px 9px;border:1px solid var(--border-light);border-radius:5px;font-size:12px;font-family:var(--font-zh);outline:none;"
                x-model="lForm.action_items[idx].text" placeholder="確認事項說明">
              <button style="background:#FEE2E2;color:#DC2626;border:none;border-radius:4px;padding:4px 8px;cursor:pointer;font-size:12px;" @click="lForm.action_items.splice(idx,1)">×</button>
            </div>
          </template>
          <div class="action-new">
            <input type="text" x-model="newItemText" placeholder="輸入確認事項後按 Enter..."
              @keydown.enter="addActionItem()">
            <button class="btn btn-ghost btn-sm" @click="addActionItem()">新增</button>
          </div>
        </div>
        <!-- Materials used -->
        <div class="form-row">
          <label class="form-label">物料使用紀錄</label>
          <template x-for="(m,mi) in lForm.materials_used" :key="mi">
            <div style="display:flex;gap:6px;margin-bottom:5px;align-items:center;">
              <input type="text" style="flex:1;padding:6px 9px;border:1px solid var(--border-light);border-radius:5px;font-size:12px;font-family:var(--font-zh);outline:none;"
                x-model="lForm.materials_used[mi].name" placeholder="料號 / 品名">
              <input type="text" style="width:60px;padding:6px;border:1px solid var(--border-light);border-radius:5px;font-size:12px;text-align:center;outline:none;"
                x-model="lForm.materials_used[mi].qty" placeholder="數量">
              <input type="text" style="width:50px;padding:6px;border:1px solid var(--border-light);border-radius:5px;font-size:12px;text-align:center;outline:none;"
                x-model="lForm.materials_used[mi].unit" placeholder="單位">
              <button style="background:#FEE2E2;color:#DC2626;border:none;border-radius:4px;padding:4px 8px;cursor:pointer;font-size:12px;" @click="lForm.materials_used.splice(mi,1)">×</button>
            </div>
          </template>
          <button class="btn btn-ghost btn-sm" style="margin-top:4px;" @click="lForm.materials_used.push({name:'',qty:'',unit:'個'})">+ 新增物料</button>
        </div>
        <!-- Photos -->
        <div class="form-row">
          <label class="form-label">照片上傳</label>
          <!-- Existing photos (edit mode) -->
          <div x-show="editLogPhotos.length" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;">
            <template x-for="(ph,phi) in editLogPhotos" :key="ph.id||phi">
              <div style="position:relative;width:72px;height:72px;border-radius:6px;overflow:hidden;border:1px solid var(--border-light);">
                <img :src="photoUrl(ph.path)" style="width:100%;height:100%;object-fit:cover;" loading="lazy">
                <button @click="removeExistingPhoto(ph,phi)" title="刪除" style="position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(220,38,38,.85);color:#fff;border:none;cursor:pointer;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;">×</button>
              </div>
            </template>
          </div>
          <!-- Pending files preview -->
          <div x-show="pendingFileNames.length" style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;">
            <template x-for="(name,i) in pendingFileNames" :key="i">
              <div style="display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:#EDE9FE;color:#6D28D9;border-radius:5px;font-size:11px;font-family:var(--font-zh);max-width:160px;">
                <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" x-text="name.length>18?name.slice(0,16)+'…':name"></span>
                <button @click="removePendingFile(i)" style="background:none;border:none;cursor:pointer;color:#A78BFA;font-size:14px;padding:0;line-height:1;flex-shrink:0;">×</button>
              </div>
            </template>
          </div>
          <!-- File picker -->
          <label style="display:flex;align-items:center;gap:8px;padding:12px 14px;border:1.5px dashed var(--border-light);border-radius:8px;cursor:pointer;font-size:12px;font-family:var(--font-zh);color:var(--text-dim);transition:all .15s;box-sizing:border-box;"
            :style="pendingFileNames.length?'border-color:var(--accent);color:var(--accent);background:#F5F3FF;':''">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:20px;height:20px;flex-shrink:0;"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <span x-text="pendingFileNames.length ? '已選 '+pendingFileNames.length+' 張（點擊繼續追加）' : '選擇照片 / 拍照（手機可直接拍攝）'"></span>
            <input type="file" accept="image/*" multiple style="display:none" @change="handlePendingFiles($event)">
          </label>
          <div style="font-size:10px;color:var(--text-dim);margin-top:4px;font-family:Inter,sans-serif;">儲存時自動上傳並加日期時間水印；手機可直接開相機</div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" @click="showLogModal=false">取消</button>
        <button class="btn btn-primary" @click="saveLog()">儲存日誌</button>
      </div>
    </div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" x-show="lightboxPhoto" x-cloak @click="lightboxPhoto=null">
    <button class="lightbox__close" @click.stop="lightboxPhoto=null">×</button>
    <img :src="photoUrl(lightboxPhoto?.path)" @click.stop>
    <div class="lightbox__meta" x-text="lightboxPhoto?.watermark"></div>
  </div>

  <!-- Hidden file inputs (per-log, created dynamically) -->
  <input type="file" id="photo-upload-input" accept="image/*" multiple style="display:none"
    @change="handlePhotoUpload($event, currentUploadLog)">

  <!-- Toast -->
  <div class="toast" :class="{hidden:!toastMsg}" x-text="toastMsg"></div>

  <script>
  const API = ''

  function projectsPage() {
    return {
      session:   {},
      projects:  [],
      selected:  null,
      logs:      [],
      openLogs:  [],
      allUsers:  [],
      tab:       'logs',
      filterStatus: '全部',
      searchQ:   '',
      newCaseNo: '',
      infoEdit:  {},

      // Modals
      showProjectModal: false,
      editingProjectId: null,
      pForm: { name:'', status:'規劃中', description:'' },

      showLogModal: false,
      editingLogId: null,
      lForm: { log_date:'', work_content:'', attendees:[], action_items:[], materials_used:[] },
      newAttendee: '', newAttendeeText: '', newItemText: '',

      lightboxPhoto: null,
      currentUploadLog: null,
      toastMsg: '',
      _toastTimer: null,
      isMobileView: window.innerWidth <= 767,
      pendingFiles: [],
      pendingFileNames: [],
      editLogPhotos: [],
      _ptCache: {},

      get filteredProjects() {
        const q = this.searchQ.toLowerCase()
        return this.projects.filter(p => {
          if (this.filterStatus !== '全部' && p.status !== this.filterStatus) return false
          if (q && !p.name.toLowerCase().includes(q) && !p.code.toLowerCase().includes(q)) return false
          return true
        })
      },

      async init() {
        const raw = localStorage.getItem('motrix_session')
        if (!raw) { location.href = 'login.html'; return }
        this.session = JSON.parse(raw)
        if (!this.session?.token) { location.href = 'login.html'; return }
        window.addEventListener('resize', () => { this.isMobileView = window.innerWidth <= 767 })

        // Pre-select from URL ?id=
        const urlId = new URLSearchParams(location.search).get('id')
        const urlCase = new URLSearchParams(location.search).get('caseNo')

        await Promise.all([this.loadProjects(), this.loadUsers()])

        if (urlId) {
          const p = this.projects.find(p => p.id == urlId)
          if (p) await this.selectProject(p)
        } else if (urlCase) {
          const p = this.projects.find(p => (p.linked_cases||[]).includes(urlCase))
          if (p) await this.selectProject(p)
          else this.filterStatus = '全部'
        }
      },

      _h() {
        return { 'Content-Type':'application/json', 'Authorization':'Bearer '+this.session.token }
      },

      canSee(mod) {
        const m = this.session.modules || []
        return m.includes(mod) || this.session.role === 'superadmin'
      },

      canManage() {
        const m = this.session.modules || []
        return m.includes('project_manage') || this.session.role === 'superadmin' || this.session.role === 'admin'
      },

      canApproveEng() {
        const m = this.session.modules || []
        return m.includes('project_approve_eng') || this.session.role === 'superadmin'
      },

      canApproveBiz() {
        const m = this.session.modules || []
        return m.includes('project_approve_biz') || this.session.role === 'superadmin'
      },

      async loadProjects() {
        const r = await fetch(`${API}/api/projects`, {headers: this._h()})
        const d = await r.json()
        this.projects = d.items || []
      },

      async loadUsers() {
        try {
          const r = await fetch(`${API}/api/users`, {headers: this._h()})
          const d = await r.json()
          this.allUsers = (Array.isArray(d) ? d : []).filter(u => u.active)
        } catch(e) {}
      },

      async selectProject(p) {
        this.selected = p
        this.tab = 'logs'
        this.openLogs = []
        this.infoEdit = { ...p.data_json }
        await this.loadLogs()
      },

      async loadLogs() {
        if (!this.selected) return
        const r = await fetch(`${API}/api/projects/${this.selected.id}/logs`, {headers: this._h()})
        const d = await r.json()
        this.logs = d.items || []
      },

      toggleLog(id) {
        const idx = this.openLogs.indexOf(id)
        if (idx >= 0) this.openLogs.splice(idx, 1)
        else this.openLogs.push(id)
      },

      statusClass(s) {
        return {
          '規劃中': 'st-planning', '進行中': 'st-inprogress', '暫停': 'st-paused',
          '驗收中': 'st-reviewing', '完工': 'st-done', '結案': 'st-closed', '取消': 'st-cancelled'
        }[s] || ''
      },

      itemStatusClass(s) {
        return { pending:'as-pending', stage1_done:'as-stage1', done:'as-done' }[s] || 'as-pending'
      },
      itemStatusLabel(s) {
        return { pending:'待確認', stage1_done:'待業務確認', done:'已完成' }[s] || '待確認'
      },

      fmtDate(iso) {
        if (!iso) return '—'
        return iso.slice(0,10)
      },
      fmtDateTime(iso) {
        if (!iso) return ''
        return iso.slice(0,16).replace('T',' ')
      },

      photoUrl(path) {
        if (!path) return ''
        const now = Math.floor(Date.now() / 1000)
        const cached = this._ptCache[path]
        if (cached && cached.exp > now) {
          return `${API}/api/uploads/${path}?pt=${cached.pt}`
        }
        if (!this._ptCache[path + '_fetching']) {
          this._ptCache[path + '_fetching'] = true
          fetch(`${API}/api/photo-token?path=${encodeURIComponent(path)}`, {
            headers: { 'Authorization': 'Bearer ' + this.session.token }
          }).then(r => r.ok ? r.json() : null).then(d => {
            if (d && d.token) {
              this._ptCache = {
                ...this._ptCache,
                [path]: { pt: d.token, exp: now + (d.ttl || 3600) - 60 },
                [path + '_fetching']: false,
              }
            }
          }).catch(() => { this._ptCache[path + '_fetching'] = false })
        }
        return `${API}/api/uploads/${path}?token=${this.session.token}`
      },

      // ── Project CRUD ──
      openCreateProject() {
        this.editingProjectId = null
        this.pForm = { name:'', status:'規劃中', description:'' }
        this.showProjectModal = true
      },

      openEditProject() {
        if (!this.selected) return
        this.editingProjectId = this.selected.id
        this.pForm = {
          name:        this.selected.name,
          status:      this.selected.status,
          description: this.selected.description || '',
        }
        this.showProjectModal = true
      },

      async saveProject() {
        if (!this.pForm.name.trim()) return
        const body = JSON.stringify(this.pForm)
        let r
        if (this.editingProjectId) {
          r = await fetch(`${API}/api/projects/${this.editingProjectId}`, {method:'PUT', headers:this._h(), body})
        } else {
          r = await fetch(`${API}/api/projects`, {method:'POST', headers:this._h(), body})
        }
        if (!r.ok) { this.toast('儲存失敗：' + (await r.json()).detail); return }
        this.showProjectModal = false
        await this.loadProjects()
        if (this.editingProjectId) {
          const p = this.projects.find(p => p.id === this.editingProjectId)
          if (p) await this.selectProject(p)
        }
        this.toast(this.editingProjectId ? '專案已更新' : '專案已建立')
      },

      async changeStatus(s) {
        if (!s || !this.selected) return
        const r = await fetch(`${API}/api/projects/${this.selected.id}/status`, {
          method:'PATCH', headers:this._h(), body: JSON.stringify({status:s})
        })
        if (!r.ok) { this.toast('狀態更新失敗'); return }
        this.selected.status = s
        await this.loadProjects()
        this.toast(`狀態已更新為「${s}」`)
      },

      async deleteProject() {
        if (!this.selected) return
        if (!confirm(`確定要刪除專案「${this.selected.name}」？`)) return
        const r = await fetch(`${API}/api/projects/${this.selected.id}`, {method:'DELETE', headers:this._h()})
        if (!r.ok) { this.toast('刪除失敗：' + (await r.json()).detail); return }
        this.selected = null
        this.logs = []
        await this.loadProjects()
        this.toast('專案已刪除')
      },

      // ── Case linking ──
      async linkCase() {
        const qno = this.newCaseNo.trim().toUpperCase()
        if (!qno || !this.selected) return
        const linked = [...(this.selected.linked_cases || [])]
        if (linked.includes(qno)) { this.toast('已關聯'); return }
        linked.push(qno)
        await this.saveLinkedCases(linked)
        this.newCaseNo = ''
        this.toast(`已關聯案件 ${qno}`)
      },

      async unlinkCase(qno) {
        if (!this.selected) return
        const linked = (this.selected.linked_cases || []).filter(c => c !== qno)
        await this.saveLinkedCases(linked)
        this.toast(`已移除關聯 ${qno}`)
      },

      async saveLinkedCases(linked) {
        const r = await fetch(`${API}/api/projects/${this.selected.id}`, {
          method:'PUT', headers:this._h(), body: JSON.stringify({linked_cases: linked})
        })
        if (!r.ok) { this.toast('儲存失敗'); return }
        this.selected.linked_cases = linked
        await this.loadProjects()
      },

      // ── Info save ──
      async saveInfo() {
        if (!this.selected) return
        await fetch(`${API}/api/projects/${this.selected.id}`, {
          method:'PUT', headers:this._h(),
          body: JSON.stringify({data_json: this.infoEdit})
        })
      },

      // ── Log CRUD ──
      openNewLog() {
        this.editingLogId = null
        this.pendingFiles = []
        this.pendingFileNames = []
        this.editLogPhotos = []
        this.lForm = {
          log_date:       new Date().toISOString().slice(0,10),
          work_content:   '',
          attendees:      [],
          action_items:   [],
          materials_used: [],
        }
        this.newAttendee = ''; this.newAttendeeText = ''; this.newItemText = ''
        this.showLogModal = true
      },

      openEditLog(log) {
        this.editingLogId = log.id
        this.pendingFiles = []
        this.pendingFileNames = []
        this.editLogPhotos = JSON.parse(JSON.stringify(log.photos || []))
        this.lForm = {
          log_date:       log.log_date,
          work_content:   log.work_content || '',
          attendees:      [...(log.attendees||[])],
          action_items:   JSON.parse(JSON.stringify(log.action_items||[])),
          materials_used: JSON.parse(JSON.stringify(log.materials_used||[])),
        }
        this.showLogModal = true
      },

      addAttendee() {
        if (this.newAttendee && !this.lForm.attendees.includes(this.newAttendee)) {
          this.lForm.attendees.push(this.newAttendee)
        }
        this.newAttendee = ''
      },
      addAttendeeText() {
        const t = this.newAttendeeText.trim()
        if (t && !this.lForm.attendees.includes(t)) this.lForm.attendees.push(t)
        this.newAttendeeText = ''
      },
      addActionItem() {
        const t = this.newItemText.trim()
        if (!t) return
        this.lForm.action_items.push({ id:'', text:t, status:'pending' })
        this.newItemText = ''
      },

      async saveLog() {
        if (!this.selected) return
        const body = JSON.stringify(this.lForm)
        let r
        if (this.editingLogId) {
          r = await fetch(`${API}/api/projects/${this.selected.id}/logs/${this.editingLogId}`, {method:'PUT', headers:this._h(), body})
        } else {
          r = await fetch(`${API}/api/projects/${this.selected.id}/logs`, {method:'POST', headers:this._h(), body})
        }
        if (!r.ok) { this.toast('儲存失敗'); return }
        const d = await r.json()
        const logId = this.editingLogId || d.id
        if (this.pendingFiles.length && logId) {
          this.toast('照片上傳中...')
          const fd = new FormData()
          for (const f of this.pendingFiles) fd.append('files', f)
          const pr = await fetch(`${API}/api/projects/${this.selected.id}/logs/${logId}/photos`, {
            method:'POST', headers:{'Authorization':'Bearer '+this.session.token}, body:fd
          })
          if (!pr.ok) { this.toast('照片上傳失敗，日誌已儲存') }
        }
        this.pendingFiles = []
        this.pendingFileNames = []
        this.showLogModal = false
        await this.loadLogs()
        if (!this.editingLogId && logId) this.openLogs.push(logId)
        this.toast('日誌已儲存')
      },

      async deleteLog(log) {
        if (!confirm('確定要刪除此日誌？')) return
        const r = await fetch(`${API}/api/projects/${this.selected.id}/logs/${log.id}`, {method:'DELETE', headers:this._h()})
        if (!r.ok) { this.toast('刪除失敗'); return }
        await this.loadLogs()
        this.toast('日誌已刪除')
      },

      // ── Action item approval ──
      async approveItem(log, item, stage) {
        const r = await fetch(`${API}/api/projects/${this.selected.id}/logs/${log.id}/items/${item.id}/approve`, {
          method:'PATCH', headers:this._h(), body: JSON.stringify({stage})
        })
        if (!r.ok) { this.toast('簽核失敗：' + (await r.json()).detail); return }
        const d = await r.json()
        const logIdx = this.logs.findIndex(l => l.id === log.id)
        if (logIdx >= 0) this.logs[logIdx].action_items = d.items
        this.toast(stage===1 ? '工程確認完成' : '業務確認完成，事項已完成')
      },

      handlePendingFiles(e) {
        const files = Array.from(e.target.files)
        this.pendingFiles.push(...files)
        this.pendingFileNames.push(...files.map(f => f.name))
        e.target.value = ''
      },

      removePendingFile(i) {
        this.pendingFiles.splice(i, 1)
        this.pendingFileNames.splice(i, 1)
      },

      async removeExistingPhoto(ph, idx) {
        if (!this.editingLogId || !this.selected) return
        const r = await fetch(`${API}/api/projects/${this.selected.id}/logs/${this.editingLogId}/photos/${ph.id}`, {
          method:'DELETE', headers:this._h()
        })
        if (r.ok) {
          this.editLogPhotos.splice(idx, 1)
          const logObj = this.logs.find(l => l.id === this.editingLogId)
          if (logObj) logObj.photos = logObj.photos.filter(p => p.id !== ph.id)
        } else {
          this.toast('刪除失敗')
        }
      },

      // ── Photo upload ──
      triggerPhotoUpload(log) {
        this.currentUploadLog = log
        document.getElementById('photo-upload-input').value = ''
        document.getElementById('photo-upload-input').click()
      },

      async handlePhotoUpload(event, log) {
        if (!log) return
        const files = event.target.files
        if (!files || !files.length) return
        const fd = new FormData()
        for (const f of files) fd.append('files', f)
        this.toast('上傳中，加水印處理...')
        const r = await fetch(`${API}/api/projects/${this.selected.id}/logs/${log.id}/photos`, {
          method:'POST',
          headers:{ 'Authorization':'Bearer '+this.session.token },
          body: fd,
        })
        if (!r.ok) { this.toast('上傳失敗'); return }
        const d = await r.json()
        const logObj = this.logs.find(l => l.id === log.id)
        if (logObj) logObj.photos = (logObj.photos || []).concat(d.photos)
        this.toast(`已上傳 ${d.added} 張照片`)
      },

      async deletePhoto(log, photo) {
        if (!confirm('確定刪除此照片？')) return
        const r = await fetch(`${API}/api/projects/${this.selected.id}/logs/${log.id}/photos/${photo.id}`, {
          method:'DELETE', headers:this._h()
        })
        if (!r.ok) { this.toast('刪除失敗'); return }
        const logObj = this.logs.find(l => l.id === log.id)
        if (logObj) logObj.photos = logObj.photos.filter(p => p.id !== photo.id)
        this.toast('照片已刪除')
      },

      toast(msg) {
        this.toastMsg = msg
        clearTimeout(this._toastTimer)
        this._toastTimer = setTimeout(() => { this.toastMsg = '' }, 3000)
      },
    }
  }
  </script>
  <script src="../static/sidebar.js"></script>
</body>
</html>
