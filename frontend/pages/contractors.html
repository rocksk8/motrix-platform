<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>外包名冊 — MOTRIX ERP</title>
  <link rel="icon" type="image/png" href="../static/favicon.png">
  <link rel="stylesheet" href="../css/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    .page-wrap{padding:calc(var(--topbar-h) + 20px) 28px 40px calc(var(--sidebar-w) + 28px)}
    .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:16px}
    .con-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 18px;cursor:pointer;transition:box-shadow .15s}
    .con-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.09)}
    .con-card.inactive{opacity:.5}
    .con-name{font-size:14px;font-weight:600;color:var(--text-main);margin-bottom:4px}
    .con-meta{font-size:12px;color:var(--text-secondary);line-height:1.7}
    .con-tag{display:inline-block;font-size:10px;border:1px solid var(--border);border-radius:4px;padding:1px 6px;margin-right:4px;color:var(--text-dim)}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;display:flex;align-items:center;justify-content:center}
    .modal{background:#fff;border-radius:12px;width:560px;max-width:95vw;max-height:90vh;overflow-y:auto;padding:28px 28px 24px}
    .modal h2{font-size:16px;font-weight:700;margin-bottom:20px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
    .form-row.full{grid-template-columns:1fr}
    .form-group label{display:block;font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:4px}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;outline:none}
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent)}
    .section-label{font-size:11px;font-weight:600;color:var(--text-dim);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border-light);padding-bottom:4px;margin:16px 0 10px}
    .btn-row{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
    .search-bar{display:flex;gap:10px;align-items:center}
    .empty{text-align:center;padding:60px 0;color:var(--text-dim);font-size:14px}
    /* ID card upload */
    .id-card-drop{border:2px dashed var(--border-light);border-radius:var(--radius-lg);
                  padding:28px;text-align:center;color:var(--text-dim);font-size:13px;
                  transition:border-color .15s,background .15s;cursor:pointer}
    .id-card-drop:hover{border-color:var(--accent);background:var(--accent-light)}
    .id-card-preview{position:relative;border:1px solid var(--border-light);
                     border-radius:var(--radius-lg);overflow:hidden;background:#f8f8f6}
    .id-card-preview img{width:100%;max-height:200px;object-fit:contain;display:block}
    .id-card-remove{position:absolute;top:6px;right:6px;background:rgba(220,38,38,.9);
                    color:#fff;border:none;border-radius:4px;padding:3px 10px;
                    font-size:11px;cursor:pointer;font-family:inherit}
    .id-card-remove:hover{background:var(--danger)}
    .badge-id{display:inline-block;font-size:9px;padding:1px 5px;border-radius:3px;
              background:var(--accent-light);color:var(--accent);border:1px solid #bfdbfe;
              margin-left:4px;vertical-align:middle}
  </style>
</head>
<body x-data="contractorsPage()" x-init="init()">
<header id="app-topbar" class="topbar"></header>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<aside class="sidebar" id="app-sidebar"></aside>

<div class="page-wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
    <div>
      <h1 style="font-size:18px;font-weight:700;color:var(--text-main)">外包名冊</h1>
      <p style="font-size:12px;color:var(--text-dim);margin-top:2px">勞報單乙方（受領報酬人）資料庫</p>
    </div>
    <button class="action-btn action-btn--primary" @click="openNew()">＋ 新增人員</button>
  </div>

  <div class="search-bar" style="margin-bottom:16px">
    <input class="form-input" style="max-width:260px" type="text" placeholder="搜尋姓名…" x-model="searchQ" @input="load()">
    <label style="font-size:13px;color:var(--text-secondary);cursor:pointer">
      <input type="checkbox" x-model="showInactive" @change="load()"> 顯示停用人員
    </label>
  </div>

  <div x-show="loading" style="text-align:center;padding:40px;color:var(--text-dim)">載入中…</div>

  <div x-show="!loading && contractors.length === 0" class="empty">
    尚無外包人員資料，點擊右上角「新增人員」開始建立名冊。
  </div>

  <div class="card-grid" x-show="!loading">
    <template x-for="c in contractors" :key="c.id">
      <div class="con-card" :class="c.active ? '' : 'inactive'" @click="openEdit(c)">
        <div class="con-name">
          <span x-text="c.name"></span>
          <span class="badge-id" x-show="c.has_id_card">ID</span>
        </div>
        <div class="con-meta">
          <div x-text="c.id_number" x-show="c.id_number"></div>
          <div x-text="c.phone" x-show="c.phone"></div>
          <div x-text="c.email" x-show="c.email"></div>
          <div style="margin-top:4px">
            <span class="con-tag" x-text="c.nationality"></span>
            <span class="con-tag" x-show="c.has_union_insurance">職業工會</span>
            <span class="con-tag" x-show="c.bank_account_number" x-text="(c.bank_name || '') + ' ' + (c.bank_account_number || '')"></span>
            <span class="con-tag" style="color:var(--danger)" x-show="!c.active">已停用</span>
          </div>
        </div>
      </div>
    </template>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" x-show="showModal" x-cloak @click.self="showModal=false">
  <div class="modal" @click.stop>
    <h2 x-text="editId ? '編輯人員' : '新增人員'"></h2>

    <div class="section-label">基本資料</div>
    <div class="form-row">
      <div class="form-group">
        <label>姓名 <span style="color:var(--danger)">*</span></label>
        <input type="text" x-model="form.name" placeholder="請輸入姓名">
      </div>
      <div class="form-group">
        <label>證件號碼</label>
        <input type="text" x-model="form.id_number" placeholder="身分證 / 居留證">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>國籍</label>
        <select x-model="form.nationality">
          <option>本國籍</option>
          <option>外國籍（滿183天）</option>
          <option>外國籍（未滿183天）</option>
        </select>
      </div>
      <div class="form-group" style="display:flex;align-items:center;gap:8px;padding-top:20px">
        <input type="checkbox" id="union" x-model="form.has_union_insurance" style="width:auto">
        <label for="union" style="margin:0;font-size:13px;color:var(--text-main);cursor:pointer">已投保職業工會</label>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>電話</label>
        <input type="text" x-model="form.phone" placeholder="04-XXXX-XXXX">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" x-model="form.email">
      </div>
    </div>
    <div class="form-row full">
      <div class="form-group">
        <label>通訊地址</label>
        <input type="text" x-model="form.address">
      </div>
    </div>

    <div class="section-label">匯款帳戶</div>
    <div class="form-row">
      <div class="form-group">
        <label>銀行代碼</label>
        <input type="text" x-model="form.bank_code" placeholder="如 812">
      </div>
      <div class="form-group">
        <label>銀行名稱</label>
        <input type="text" x-model="form.bank_name" placeholder="如 台新銀行">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>分行</label>
        <input type="text" x-model="form.bank_branch">
      </div>
      <div class="form-group">
        <label>戶名</label>
        <input type="text" x-model="form.bank_account_name">
      </div>
    </div>
    <div class="form-row full">
      <div class="form-group">
        <label>帳號</label>
        <input type="text" x-model="form.bank_account_number">
      </div>
    </div>

    <div class="section-label">身分證影本</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <!-- 正面 -->
      <div>
        <div style="font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:6px">正面</div>
        <div x-show="!idCardFrontPreview && !idCardFront" class="id-card-drop"
             @click="$refs.idCardInputFront.click()"
             @dragover.prevent @drop.prevent="handleIdCardDrop($event,'front')">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
               style="margin:0 auto 6px;display:block;opacity:.4">
            <rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>
            <circle cx="8" cy="14.5" r="1.5"/><path d="M13 13h5M13 16h3"/>
          </svg>
          點擊或拖曳上傳<br>
          <span style="font-size:11px">JPG / PNG / WEBP &lt; 3 MB</span>
        </div>
        <div x-show="idCardFrontPreview || idCardFront" class="id-card-preview">
          <img :src="idCardFrontPreview || idCardFront" alt="身分證正面">
          <button class="id-card-remove" @click.stop="removeIdCard('front')">✕</button>
        </div>
        <input type="file" x-ref="idCardInputFront" accept="image/*" style="display:none"
               @change="handleIdCardFile($event,'front')">
        <div x-show="idCardFrontPreview || idCardFront"
             style="margin-top:6px;display:flex;align-items:center;gap:8px">
          <label class="action-btn" style="cursor:pointer;font-size:12px">
            重新上傳<input type="file" accept="image/*" style="display:none" @change="handleIdCardFile($event,'front')">
          </label>
          <span style="font-size:11px">
            <span x-show="idCardFrontPreview" style="color:var(--warning)">● 未儲存</span>
            <span x-show="!idCardFrontPreview && idCardFront" style="color:var(--success)">● 已上傳</span>
          </span>
        </div>
      </div>
      <!-- 反面 -->
      <div>
        <div style="font-size:12px;font-weight:500;color:var(--text-secondary);margin-bottom:6px">反面</div>
        <div x-show="!idCardBackPreview && !idCardBack" class="id-card-drop"
             @click="$refs.idCardInputBack.click()"
             @dragover.prevent @drop.prevent="handleIdCardDrop($event,'back')">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
               style="margin:0 auto 6px;display:block;opacity:.4">
            <rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>
            <circle cx="8" cy="14.5" r="1.5"/><path d="M13 13h5M13 16h3"/>
          </svg>
          點擊或拖曳上傳<br>
          <span style="font-size:11px">JPG / PNG / WEBP &lt; 3 MB</span>
        </div>
        <div x-show="idCardBackPreview || idCardBack" class="id-card-preview">
          <img :src="idCardBackPreview || idCardBack" alt="身分證反面">
          <button class="id-card-remove" @click.stop="removeIdCard('back')">✕</button>
        </div>
        <input type="file" x-ref="idCardInputBack" accept="image/*" style="display:none"
               @change="handleIdCardFile($event,'back')">
        <div x-show="idCardBackPreview || idCardBack"
             style="margin-top:6px;display:flex;align-items:center;gap:8px">
          <label class="action-btn" style="cursor:pointer;font-size:12px">
            重新上傳<input type="file" accept="image/*" style="display:none" @change="handleIdCardFile($event,'back')">
          </label>
          <span style="font-size:11px">
            <span x-show="idCardBackPreview" style="color:var(--warning)">● 未儲存</span>
            <span x-show="!idCardBackPreview && idCardBack" style="color:var(--success)">● 已上傳</span>
          </span>
        </div>
      </div>
    </div>

    <div class="section-label">備注</div>
    <div class="form-row full">
      <div class="form-group">
        <textarea x-model="form.notes" rows="2" style="resize:vertical"></textarea>
      </div>
    </div>

    <div x-show="errMsg" style="color:var(--danger);font-size:13px;margin-top:8px" x-text="errMsg"></div>

    <div class="btn-row">
      <button class="action-btn" x-show="editId"
              :style="activeTarget ? 'color:var(--danger)' : ''"
              @click="toggleActive()"
              x-text="activeTarget ? '停用' : '啟用'"></button>
      <button class="action-btn" @click="showModal=false">取消</button>
      <button class="action-btn action-btn--primary" @click="save()" :disabled="saving">
        <span x-text="saving ? '儲存中…' : '儲存'"></span>
      </button>
    </div>
  </div>
</div>

<script src="../static/notif.js"></script>
<script src="../static/sidebar.js"></script>
<script>
const API = '/api'
function contractorsPage() {
  return {
    session: {},
    contractors: [],
    searchQ: '',
    showInactive: false,
    loading: false,
    showModal: false,
    editId: null,
    activeTarget: true,
    saving: false,
    errMsg: '',
    form: {},
    idCardFront: '',        // saved in DB (正面)
    idCardFrontPreview: null, // null=unchanged, ''=remove, base64=new
    idCardBack: '',         // saved in DB (反面)
    idCardBackPreview: null,

    async init() {
      const s = localStorage.getItem('motrix_session')
      if (!s) { window.location.href = 'login.html'; return }
      this.session = JSON.parse(s)
      if (this.session.role !== 'superadmin') {
        alert('此頁面僅限最高權限使用者存取'); window.history.back(); return
      }
      await this.load()
    },

    async load() {
      this.loading = true
      try {
        const params = new URLSearchParams({ active_only: !this.showInactive })
        if (this.searchQ) params.set('q', this.searchQ)
        const r = await fetch(`${API}/contractors?${params}`, {
          headers: { Authorization: 'Bearer ' + this.session.token }
        })
        if (r.ok) this.contractors = await r.json()
      } catch(e) {}
      this.loading = false
    },

    _blank() {
      return {
        name: '', id_number: '', nationality: '本國籍', has_union_insurance: false,
        phone: '', email: '', address: '',
        bank_code: '', bank_name: '', bank_branch: '',
        bank_account_name: '', bank_account_number: '', notes: ''
      }
    },

    openNew() {
      this.editId = null
      this.form = this._blank()
      this.idCardFront = ''; this.idCardFrontPreview = null
      this.idCardBack  = ''; this.idCardBackPreview  = null
      this.errMsg = ''
      this.showModal = true
    },

    async openEdit(c) {
      this.editId = c.id
      this.activeTarget = c.active
      this.form = { ...c }
      this.idCardFront = ''; this.idCardFrontPreview = null
      this.idCardBack  = ''; this.idCardBackPreview  = null
      this.errMsg = ''
      this.showModal = true
      try {
        const r = await fetch(`${API}/contractors/${c.id}/id-card`, {
          headers: { Authorization: 'Bearer ' + this.session.token }
        })
        if (r.ok) {
          const d = await r.json()
          this.idCardFront = d.image_front || ''
          this.idCardBack  = d.image_back  || ''
        }
      } catch(e) {}
    },

    handleIdCardFile(e, which) {
      const file = e.target.files[0]
      if (!file) return
      if (file.size > 3 * 1024 * 1024) { this.errMsg = '圖片過大（限 3 MB）'; return }
      const reader = new FileReader()
      reader.onload = (ev) => {
        if (which === 'front') this.idCardFrontPreview = ev.target.result
        else                   this.idCardBackPreview  = ev.target.result
      }
      reader.readAsDataURL(file)
      e.target.value = ''
    },

    handleIdCardDrop(e, which) {
      const file = e.dataTransfer.files[0]
      if (!file || !file.type.startsWith('image/')) return
      if (file.size > 3 * 1024 * 1024) { this.errMsg = '圖片過大（限 3 MB）'; return }
      const reader = new FileReader()
      reader.onload = (ev) => {
        if (which === 'front') this.idCardFrontPreview = ev.target.result
        else                   this.idCardBackPreview  = ev.target.result
      }
      reader.readAsDataURL(file)
    },

    removeIdCard(which) {
      if (which === 'front') { this.idCardFrontPreview = ''; this.idCardFront = '' }
      else                   { this.idCardBackPreview  = ''; this.idCardBack  = '' }
    },

    async save() {
      if (!this.form.name.trim()) { this.errMsg = '姓名為必填'; return }
      this.saving = true
      this.errMsg = ''
      try {
        const method = this.editId ? 'PUT' : 'POST'
        const url = this.editId ? `${API}/contractors/${this.editId}` : `${API}/contractors`
        const r = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.session.token },
          body: JSON.stringify(this.form)
        })
        if (!r.ok) { this.errMsg = await r.text(); this.saving = false; return }
        const d = await r.json()
        const targetId = this.editId || d.id
        // Upload ID card if either side changed (null=unchanged, ''=remove, base64=new)
        const frontChanged = this.idCardFrontPreview !== null
        const backChanged  = this.idCardBackPreview  !== null
        if ((frontChanged || backChanged) && targetId) {
          await fetch(`${API}/contractors/${targetId}/id-card`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.session.token },
            body: JSON.stringify({
              image_front: frontChanged ? this.idCardFrontPreview : this.idCardFront,
              image_back:  backChanged  ? this.idCardBackPreview  : this.idCardBack
            })
          })
        }
        this.showModal = false
        await this.load()
      } catch(e) { this.errMsg = '儲存失敗：' + e.message }
      this.saving = false
    },

    async toggleActive() {
      if (!this.editId) return
      const name = this.form.name
      const action = this.activeTarget ? '停用' : '啟用'
      if (!confirm(`確定要${action}「${name}」？`)) return
      const r = await fetch(`${API}/contractors/${this.editId}/active`, {
        method: 'PATCH',
        headers: { Authorization: 'Bearer ' + this.session.token }
      })
      if (r.ok) {
        this.showModal = false
        await this.load()
      }
    }
  }
}
</script>
</body>
</html>
