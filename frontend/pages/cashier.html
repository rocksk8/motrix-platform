<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出納 — 已併入營運報表模組</title>
  <!-- 2026-08-31：出納整合進營運報表模組，成為 reports.html 的一個頁籤（見
       reports.html/reports.js 的 cashier 頁籤與 showCashierTab()）。保留這個
       檔案本身（不刪除、不 404）只是為了讓舊書籤/連結還能用，實際內容改成
       自動導向營運報表模組的出納頁籤。 -->
  <script>location.href = 'reports.html?tab=cashier'</script>
</head>
<!-- `data-no-topbar`：這是一頁**轉址頁**（下面那行 `location.href` 會
     立刻把瀏覽器帶走），沒有 app shell 也不該有頂欄。
     🔑 宣告它是為了讓「刻意沒有」與「忘了加」分得開 ——
        `sidebar.js` 找不到掛載點又沒有這個宣告時會 `console.error`。
     ☠️ 沒有這個分辨的話，`map.html` 那個漏掉的掛載點可以安靜一整天。 -->
<body data-no-topbar>
  <p>出納已併入 <a href="reports.html?tab=cashier">營運報表模組</a>，正在為您導向…</p>
</body>
</html>
