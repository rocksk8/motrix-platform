      <div x-show="writeoffModal.msg" style="color:var(--danger);font-size:12px;margin-top:6px" x-text="writeoffModal.msg"></div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--border-light)">
      <button @click="writeoffModal.open=false"
              style="padding:7px 16px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:var(--font-zh);background:#fff;cursor:pointer">取消</button>
      <button @click="submitWriteoffModal()" :disabled="!writeoffModal.reason.trim()"
              style="padding:7px 18px;border:none;border-radius:7px;font-size:13px;font-family:var(--font-zh);color:#fff;cursor:pointer;font-weight:600"
              :style="writeoffModal.mode==='reject' ? 'background:var(--danger)' : 'background:var(--accent)'"
              x-text="writeoffModal.mode==='reject' ? '確認駁回' : '送出申請'"></button>
    </div>
  </div>
</div>

<!-- ── 出貨單新增／編輯 Modal ── -->
<div x-show="showShippingModal" x-cloak
     style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px"
     @click.self="showShippingModal=false"
     @keydown.escape.window="showShippingModal=false">
  <div style="background:#fff;border-radius:12px;width:100%;max-width:680px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(0,0,0,.22)">
    <!-- Header -->
    <div style="display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border-light);gap:10px">
      <span style="font-size:14px;font-weight:700;flex:1;font-family:var(--font-zh)"
            x-text="editShippingNoteNo ? '編輯出貨單' : '新增出貨單'"></span>
      <button @click="showShippingModal=false" style="width:28px;height:28px;border:none;background:#F0EEE9;border-radius:5px;cursor:pointer;font-size:16px">×</button>
    </div>
    <!-- Body -->
    <div style="flex:1;overflow-y:auto;padding:18px 20px">
      <!-- Basic info -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
        <div>
          <label style="font-size:11px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:4px">出貨日期</label>
          <input type="date" x-model="shippingForm.ship_date"
                 style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;outline:none;box-sizing:border-box">
        </div>
        <div style="position:relative">
          <label style="font-size:11px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:4px">收件人</label>
          <div style="display:flex;gap:6px;align-items:center">
            <input type="text" x-model="shippingForm.recipient" placeholder="客戶端簽收窗口…"
                   style="flex:1;width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;outline:none;box-sizing:border-box">
            <button type="button" x-show="shippingContactOptions.length > 0"
                    @click="showShippingContactPicker = !showShippingContactPicker"
                    title="從客戶聯絡人快選"
                    style="flex-shrink:0;padding:7px 9px;border:1px solid #93C5FD;background:#EFF6FF;color:#1D4ED8;border-radius:6px;font-size:11px;cursor:pointer;white-space:nowrap">
              選聯絡人
            </button>
          </div>
          <div x-show="showShippingContactPicker && shippingContactOptions.length > 0"
               @click.outside="showShippingContactPicker=false"
               style="position:absolute;z-index:200;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1.5px solid #E5E7EB;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.10);max-height:200px;overflow-y:auto">
            <template x-for="(ct, ci) in shippingContactOptions" :key="ci">
              <div @click="applyShippingContact(ct)"
                   style="padding:8px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid #F3F4F6"
                   x-text="ct._display || ct.name"></div>
            </template>
          </div>
        </div>
        <div style="grid-column:1 / -1">
          <label style="font-size:11px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:4px">送貨地址</label>
          <input type="text" x-model="shippingForm.delivery_address" placeholder="可與客戶主要聯絡地址不同…"
                 style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;outline:none;box-sizing:border-box">
        </div>
      </div>

      <!-- Items -->
      <div style="display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border-light);padding-bottom:4px;margin-bottom:10px">
        <span style="font-size:11px;font-weight:600;color:var(--text-dim);letter-spacing:.06em;text-transform:uppercase;flex:1">出貨品項</span>
        <button @click="importItemsFromQuote()"
                style="font-size:11px;padding:3px 10px;border:1px solid #93C5FD;background:#EFF6FF;color:#1D4ED8;border-radius:5px;cursor:pointer;white-space:nowrap">
          從報價單匯入品項
        </button>
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:8px">
        <thead>
          <tr style="color:var(--text-dim);border-bottom:1px solid var(--border-light)">
            <th style="text-align:left;padding:4px 0;font-weight:500">品名 / 規格說明</th>
            <th style="text-align:left;padding:4px 6px;font-weight:500;width:100px">廠牌 / 型號</th>
            <th style="text-align:right;padding:4px 6px;font-weight:500;width:55px">數量</th>
            <th style="text-align:left;padding:4px 4px;font-weight:500;width:50px">單位</th>
            <th style="text-align:left;padding:4px 6px;font-weight:500;width:100px">備註</th>
            <th style="text-align:left;padding:4px 6px;font-weight:500;width:100px">庫存序號</th>
            <th style="width:28px"></th>
          </tr>
        </thead>
        <tbody>
          <template x-for="(it, ii) in shippingForm.items" :key="it.id">
            <tr style="border-bottom:1px solid #F5F4F0" :style="it.type==='header' ? 'background:#EFF6FF' : ''">
              <td style="padding:4px 0" :colspan="it.type==='header' ? 4 : 1">
                <input type="text" x-model="it.description"
                       :placeholder="it.type==='header' ? '段落標題…' : '品名 / 規格說明'"
                       :style="'width:100%;padding:5px 8px;border:1px solid var(--border-light);border-radius:5px;font-size:12px;font-family:inherit;outline:none;box-sizing:border-box' + (it.type==='header' ? ';font-weight:700;color:#1D4ED8' : '')">
              </td>
              <template x-if="it.type!=='header'">
                <td style="padding:4px 6px">
                  <input type="text" x-model="it.brand" placeholder="廠牌"
                         style="width:100%;padding:5px 8px;border:1px solid var(--border-light);border-radius:5px;font-size:12px;font-family:inherit;outline:none;box-sizing:border-box">
                </td>
              </template>
              <template x-if="it.type!=='header'">
                <td style="padding:4px 6px">
                  <input type="number" x-model.number="it.qty" min="0" step="1"
                         style="width:100%;padding:5px;border:1px solid var(--border-light);border-radius:5px;font-size:12px;font-family:LINE Seed TW_OTF, sans-serif;text-align:right;outline:none;box-sizing:border-box">
                </td>
              </template>
              <template x-if="it.type!=='header'">
                <td style="padding:4px 4px">
                  <select x-model="it.unit"
                          style="width:100%;padding:5px 2px;border:1px solid var(--border-light);border-radius:5px;font-size:12px;font-family:inherit;outline:none;box-sizing:border-box;background:#fff;cursor:pointer">
                    <option>台</option><option>式</option><option>套</option><option>個</option>
                    <option>組</option><option>米</option><option>捲</option><option>箱</option>
                    <option>包</option><option>批</option><option>項</option>
                  </select>
                </td>
              </template>
              <td style="padding:4px 6px">
                <input type="text" x-model="it.notes" placeholder="備註"
                       style="width:100%;padding:5px 8px;border:1px solid var(--border-light);border-radius:5px;font-size:12px;font-family:inherit;outline:none;box-sizing:border-box">
              </td>
              <template x-if="it.type!=='header'">
                <td style="padding:4px 6px">
                  <button type="button" @click="openSerialPicker(ii)"
                          :title="it.part_no ? (it.part_no + '：' + it.serials.join('、')) : '選擇庫存料號/序號（選填）'"
                          style="width:100%;padding:5px 8px;border:1px dashed var(--border-light);border-radius:5px;font-size:11px;font-family:inherit;background:#fff;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"
                          :style="it.part_no ? 'border-style:solid;border-color:#93C5FD;background:#EFF6FF;color:#1D4ED8' : ''"
                          x-text="it.part_no ? (it.part_no + ' ×' + (it.serials||[]).length) : '選料號'"></button>
                </td>
              </template>
              <template x-if="it.type==='header'"><td></td></template>
              <td style="padding:4px 0;text-align:center">
                <button @click="removeShippingItem(ii)"
                        style="width:22px;height:22px;border:none;background:none;cursor:pointer;color:var(--danger);font-size:14px;line-height:1">×</button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <button @click="addShippingItem()"
                style="font-size:11px;padding:4px 12px;border:1px dashed var(--border);border-radius:5px;background:#fff;cursor:pointer;font-family:var(--font-zh)">
          ＋ 新增品項
        </button>
        <button @click="addShippingHeader()"
                style="font-size:11px;padding:4px 12px;border:1px dashed var(--border);border-radius:5px;background:#fff;cursor:pointer;font-family:var(--font-zh)">
          ＋ 新增段落標題
        </button>
      </div>

      <!-- Notes -->
      <div style="margin-top:14px">
        <label style="font-size:11px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:4px">備注</label>
        <textarea x-model="shippingForm.notes" rows="2" placeholder="出貨備注、注意事項…"
                  style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;outline:none;resize:vertical;box-sizing:border-box"></textarea>
      </div>
      <div x-show="shippingMsg" style="color:var(--danger);font-size:12px;margin-top:8px" x-text="shippingMsg"></div>
    </div>
    <!-- Footer -->
    <div style="padding:12px 20px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:10px">
      <button @click="showShippingModal=false"
              style="padding:7px 16px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:var(--font-zh);background:#fff;cursor:pointer">取消</button>
      <button @click="saveShippingNote()" :disabled="shippingSaving"
              style="padding:7px 18px;border:none;border-radius:7px;font-size:13px;font-family:var(--font-zh);background:var(--accent);color:#fff;cursor:pointer;font-weight:600"
              x-text="shippingSaving ? '儲存中…' : '儲存出貨單'"></button>
    </div>
  </div>
</div>

<!-- ── 庫存序號挑選 Modal（出貨單品項→庫存料號連結，選填）── -->
<div x-show="serialPicker.show" x-cloak
     style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:420;display:flex;align-items:center;justify-content:center;padding:20px"
     @click.self="serialPicker.show=false"
     @keydown.escape.window="serialPicker.show=false">
  <div style="background:#fff;border-radius:12px;width:100%;max-width:480px;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(0,0,0,.22)">
    <div style="padding:14px 18px;border-bottom:1px solid var(--border-light);font-size:14px;font-weight:700;font-family:var(--font-zh)">
      選擇庫存料號 / 序號
    </div>
    <div style="padding:16px 18px;overflow-y:auto;flex:1">
      <label style="font-size:11px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:4px">料號</label>
      <select x-model="serialPicker.partNo" @change="onSerialPickerPartChange()"
              style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;outline:none;box-sizing:border-box;margin-bottom:12px">
        <option value="">不連結庫存（自由文字品項）</option>
        <template x-for="pt in (_partsOptions||[])" :key="pt.part_no">
          <option :value="pt.part_no" x-text="pt.part_no + '　' + pt.name"></option>
        </template>
      </select>

      <template x-if="serialPicker.partNo">
        <div>
          <div style="font-size:11px;color:var(--text-dim);margin-bottom:6px" x-show="!serialPicker.loading">
            勾選要出貨的序號（僅列出在庫）：
          </div>
          <div style="text-align:center;padding:16px;color:var(--text-dim);font-size:12px" x-show="serialPicker.loading">載入中…</div>
          <div x-show="serialPicker.error" style="color:var(--danger);font-size:12px;margin-bottom:8px" x-text="serialPicker.error"></div>
          <div x-show="!serialPicker.loading && !serialPicker.error && serialPicker.options.length===0"
               style="text-align:center;padding:16px;color:var(--text-dim);font-size:12px">此料號目前無在庫序號</div>
          <template x-for="opt in serialPicker.options" :key="opt.id">
            <label style="display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid #F5F4F0;cursor:pointer;font-size:12px">
              <input type="checkbox" :checked="serialPicker.selected.includes(opt.serial_no)" @change="toggleSerialPick(opt.serial_no)">
              <span x-text="opt.serial_no"></span>
              <span x-show="opt.mac" style="color:var(--text-dim)" x-text="'MAC: ' + opt.mac"></span>
            </label>
          </template>
        </div>
      </template>
    </div>
    <div style="padding:12px 18px;border-top:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center;gap:10px">
      <span style="font-size:11px;color:var(--text-dim)" x-text="serialPicker.selected.length + ' 筆已選'"></span>
      <div style="display:flex;gap:8px">
        <button @click="serialPicker.show=false"
                style="padding:7px 16px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:var(--font-zh);background:#fff;cursor:pointer">取消</button>
        <button @click="applySerialPicker()"
                style="padding:7px 18px;border:none;border-radius:7px;font-size:13px;font-family:var(--font-zh);background:var(--accent);color:#fff;cursor:pointer;font-weight:600">套用</button>
      </div>
    </div>
  </div>
</div>

<!-- ── 出貨單 PDF 預覽 Modal ── -->
<div x-show="shippingPreviewModal" x-cloak
     style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:410;display:flex;align-items:center;justify-content:center;padding:20px"
     @click.self="closeShippingPreview()"
     @keydown.escape.window="closeShippingPreview()">
  <div style="background:#fff;border-radius:12px;width:100%;max-width:820px;height:90vh;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(0,0,0,.22)">
    <!-- Header -->
    <div style="display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border-light);gap:10px">
      <span style="font-size:14px;font-weight:700;flex:1;font-family:var(--font-zh)"
            x-text="'預覽出貨單' + (shippingPreviewNote ? '　' + shippingPreviewNote.noteNo : '')"></span>
      <button @click="closeShippingPreview()" style="width:28px;height:28px;border:none;background:#F0EEE9;border-radius:5px;cursor:pointer;font-size:16px">×</button>
    </div>
    <!-- Body -->
    <div style="flex:1;background:#F0EEE9;overflow:hidden">
      <iframe :src="shippingPreviewBlobUrl" style="width:100%;height:100%;border:none;display:block"></iframe>
    </div>
    <!-- Footer -->
    <div style="padding:12px 20px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:10px">
      <button @click="closeShippingPreview()"
              style="padding:7px 16px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:var(--font-zh);background:#fff;cursor:pointer">關閉</button>
    </div>
  </div>
</div>

<!-- ── 承攬商匯款申請 PDF 預覽 Modal ── -->
<div x-show="cvPreviewModal" x-cloak
     style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:410;display:flex;align-items:center;justify-content:center;padding:20px"
     @click.self="closeContractorVoucherPreview()"
     @keydown.escape.window="closeContractorVoucherPreview()">
  <div style="background:#fff;border-radius:12px;width:100%;max-width:820px;height:90vh;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(0,0,0,.22)">
    <div style="display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border-light);gap:10px">
      <span style="font-size:14px;font-weight:700;flex:1;font-family:var(--font-zh)"
            x-text="'預覽匯款申請' + (cvPreviewVoucher ? '　' + cvPreviewVoucher.voucherNo : '')"></span>
      <button @click="closeContractorVoucherPreview()" style="width:28px;height:28px;border:none;background:#F0EEE9;border-radius:5px;cursor:pointer;font-size:16px">×</button>
    </div>
    <div style="flex:1;background:#F0EEE9;overflow:hidden">
      <iframe :src="cvPreviewBlobUrl" style="width:100%;height:100%;border:none;display:block"></iframe>
    </div>
    <div style="padding:12px 20px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:10px">
      <button @click="closeContractorVoucherPreview()"
              style="padding:7px 16px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:var(--font-zh);background:#fff;cursor:pointer">關閉</button>
    </div>
  </div>
</div>

<!-- ── 承攬商匯款申請 標記已匯款 Modal（2026-08-31 新增，原本用 prompt() 沒有地方填實際匯款日期）── -->
<div x-show="payVoucherModal" x-cloak
     style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:410;display:flex;align-items:center;justify-content:center;padding:20px"
     @click.self="payVoucherModal=false"
     @keydown.escape.window="payVoucherModal=false">
  <div style="background:#fff;border-radius:12px;width:100%;max-width:380px;box-shadow:0 16px 48px rgba(0,0,0,.22)">
    <div style="display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border-light);gap:10px">
      <span style="font-size:14px;font-weight:700;flex:1;font-family:var(--font-zh)"
            x-text="'標記已匯款' + (payVoucherTarget ? '　' + payVoucherTarget.voucherNo : '')"></span>
      <button @click="payVoucherModal=false" style="width:28px;height:28px;border:none;background:#F0EEE9;border-radius:5px;cursor:pointer;font-size:16px">×</button>
    </div>
    <div style="padding:18px 20px">
      <label style="font-size:11px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:4px">匯款日期</label>
      <input type="date" x-model="payVoucherDate"
             style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;outline:none;box-sizing:border-box;margin-bottom:14px">
      <label style="font-size:11px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:4px">備註（選填，例如匯款帳號末五碼）</label>
      <input type="text" x-model="payVoucherNote" placeholder="選填"
             style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:var(--font-zh);outline:none;box-sizing:border-box">
    </div>
    <div style="padding:12px 20px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:10px">
      <button @click="payVoucherModal=false" :disabled="payVoucherSaving"
              style="padding:7px 16px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:var(--font-zh);background:#fff;cursor:pointer">取消</button>
      <button @click="confirmPayVoucher()" :disabled="payVoucherSaving || !payVoucherDate"
              style="padding:7px 16px;border:none;border-radius:7px;font-size:13px;font-weight:600;font-family:var(--font-zh);background:#059669;color:#fff;cursor:pointer"
              x-text="payVoucherSaving ? '處理中…' : '確認標記已匯款'"></button>
    </div>
  </div>
</div>

<!-- ── 開票申請憑據 建立 Modal ── -->
<div x-show="ivCreateModal" x-cloak
     style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:420;display:flex;align-items:center;justify-content:center;padding:20px"
     @click.self="closeInvoiceVoucherModal()"
     @keydown.escape.window="closeInvoiceVoucherModal()">
  <div style="background:#fff;border-radius:12px;width:100%;max-width:640px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(0,0,0,.22)">
    <div style="display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border-light);gap:10px">
      <span style="font-size:14px;font-weight:700;flex:1;font-family:var(--font-zh)">申請開立發票</span>
      <button @click="closeInvoiceVoucherModal()" style="width:28px;height:28px;border:none;background:#F0EEE9;border-radius:5px;cursor:pointer;font-size:16px">×</button>
    </div>
    <div style="flex:1;overflow-y:auto;padding:16px 18px">

      <div x-show="ivRemainingLoading" style="text-align:center;padding:20px;color:var(--text-dim);font-size:12px">載入額度中…</div>

      <template x-if="!ivRemainingLoading && ivRemaining">
        <div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;background:#FAFAF9;border:1px solid var(--border-light);border-radius:6px;padding:10px 12px">
            <div>
              <div style="font-size:9px;color:var(--text-dim);font-family:LINE Seed TW_OTF, sans-serif;margin-bottom:2px">合約總額</div>
              <div style="font-size:13px;font-weight:700;font-family:LINE Seed TW_OTF, sans-serif" x-text="'NT$ ' + ivRemaining.quoteTotal.toLocaleString()"></div>
            </div>
            <div>
              <div style="font-size:9px;color:var(--text-dim);font-family:LINE Seed TW_OTF, sans-serif;margin-bottom:2px">已申請（含草稿）</div>
              <div style="font-size:13px;font-weight:700;font-family:LINE Seed TW_OTF, sans-serif;color:var(--text-secondary)" x-text="'NT$ ' + ivRemaining.requestedAmount.toLocaleString()"></div>
            </div>
            <div>
              <div style="font-size:9px;color:var(--text-dim);font-family:LINE Seed TW_OTF, sans-serif;margin-bottom:2px">剩餘可申請</div>
              <div style="font-size:13px;font-weight:700;font-family:LINE Seed TW_OTF, sans-serif;color:#059669" x-text="'NT$ ' + ivRemaining.remainingAmount.toLocaleString()"></div>
            </div>
          </div>

          <div style="display:flex;gap:8px;margin-bottom:14px">
            <button @click="ivMode='amount'" :style="ivMode==='amount' ? 'background:#6D28D9;color:#fff;border-color:#6D28D9' : 'background:#fff;color:var(--text-secondary);border-color:var(--border-light)'"
                    style="flex:1;padding:8px;border-radius:6px;border:1px solid;font-size:12px;font-family:var(--font-zh);cursor:pointer;font-weight:600">按金額</button>
            <button @click="ivMode='items'" :style="ivMode==='items' ? 'background:#6D28D9;color:#fff;border-color:#6D28D9' : 'background:#fff;color:var(--text-secondary);border-color:var(--border-light)'"
                    style="flex:1;padding:8px;border-radius:6px;border:1px solid;font-size:12px;font-family:var(--font-zh);cursor:pointer;font-weight:600">按品項</button>
          </div>

          <!-- 按金額 -->
          <div x-show="ivMode==='amount'">
            <span class="fi-label">申請金額（含稅）</span>
            <div style="position:relative;margin-bottom:6px">
              <span style="position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text-dim);font-family:LINE Seed TW_OTF, sans-serif">NT$</span>
              <input class="fi" type="number" min="0" :max="ivRemaining.remainingAmount" x-model.number="ivAmountInput"
                     style="padding-left:36px;font-size:14px;font-weight:700;font-family:LINE Seed TW_OTF, sans-serif">
            </div>
            <div x-show="ivAmountInput > 0" style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);font-family:LINE Seed TW_OTF, sans-serif;padding:2px 0">
              <span>未稅 NT$ <span x-text="ivAmountPretax().toLocaleString()"></span></span>
              <span>營業稅 NT$ <span x-text="ivAmountTax().toLocaleString()"></span></span>
            </div>
            <div x-show="ivAmountInput > ivRemaining.remainingAmount" style="font-size:11px;color:var(--danger)">超過剩餘可申請金額</div>
          </div>

          <!-- 按品項 -->
          <div x-show="ivMode==='items'">
            <div x-show="ivRemaining.items.length===0" style="font-size:12px;color:var(--text-dim);padding:12px 0">此案件報價單無品項可選</div>
            <template x-for="it in ivRemaining.items.filter(x => x.remainingQty > 0)" :key="it.itemId">
              <div style="border:1px solid var(--border-light);border-radius:6px;padding:8px 10px;margin-bottom:6px">
                <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
                  <input type="checkbox" :checked="!!ivItemSelections[it.itemId]" @change="ivToggleItem(it)" style="accent-color:#6D28D9">
                  <span style="flex:1;font-size:12px;font-family:var(--font-zh)" x-text="it.description + (it.brand ? '　' + it.brand : '')"></span>
                  <span style="font-size:10px;color:var(--text-dim);font-family:LINE Seed TW_OTF, sans-serif" x-text="'剩餘 ' + it.remainingQty + ' ' + it.unit"></span>
                </label>
                <div x-show="ivItemSelections[it.itemId]" style="display:grid;grid-template-columns:100px 1fr;gap:8px;margin-top:8px;padding-left:26px">
                  <div>
                    <span class="fi-label">數量</span>
                    <input class="fi fi--sm" type="number" min="0.01" :max="it.remainingQty" step="any"
                           x-model.number="ivItemSelections[it.itemId].qty" @input="ivItemQtyChanged(it)">
                  </div>
                  <div>
                    <span class="fi-label">金額（未稅）</span>
                    <input class="fi fi--sm" type="number" min="0"
                           x-model.number="ivItemSelections[it.itemId].amount">
                  </div>
                </div>
              </div>
            </template>
            <div style="font-size:12px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border-light)">
              <div style="display:flex;justify-content:space-between;color:var(--text-dim);margin-bottom:3px">
                <span>未稅小計</span>
                <span style="font-family:LINE Seed TW_OTF, sans-serif" x-text="'NT$ ' + ivSelectedTotal().toLocaleString()"></span>
              </div>
              <div style="display:flex;justify-content:space-between;color:var(--text-dim);margin-bottom:3px">
                <span>營業稅</span>
                <span style="font-family:LINE Seed TW_OTF, sans-serif" x-text="'NT$ ' + ivSelectedTax().toLocaleString()"></span>
              </div>
              <div style="display:flex;justify-content:space-between;font-weight:700">
                <span>含稅小計</span>
                <span style="font-family:LINE Seed TW_OTF, sans-serif" x-text="'NT$ ' + ivSelectedGrossTotal().toLocaleString()"></span>
              </div>
            </div>
            <div x-show="ivSelectedGrossTotal() > ivRemaining.remainingAmount" style="font-size:11px;color:var(--danger);margin-top:4px">超過剩餘可申請金額</div>
          </div>
        </div>
      </template>

    </div>
    <div style="padding:12px 20px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:10px">
      <button @click="closeInvoiceVoucherModal()"
              style="padding:7px 16px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:var(--font-zh);background:#fff;cursor:pointer">取消</button>
      <button @click="submitInvoiceVoucherCreate()" :disabled="ivSubmitting"
              style="padding:7px 16px;border:none;border-radius:7px;font-size:13px;font-family:var(--font-zh);background:#6D28D9;color:#fff;cursor:pointer;font-weight:600">送出建立</button>
    </div>
  </div>
</div>

<!-- ── 開票申請憑據 PDF 預覽 Modal ── -->
<div x-show="ivPreviewModal" x-cloak
     style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:410;display:flex;align-items:center;justify-content:center;padding:20px"
     @click.self="closeInvoiceVoucherPreview()"
     @keydown.escape.window="closeInvoiceVoucherPreview()">
  <div style="background:#fff;border-radius:12px;width:100%;max-width:820px;height:90vh;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(0,0,0,.22)">
    <div style="display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border-light);gap:10px">
      <span style="font-size:14px;font-weight:700;flex:1;font-family:var(--font-zh)"
            x-text="'預覽開票申請憑據' + (ivPreviewVoucher ? '　' + ivPreviewVoucher.voucherNo : '')"></span>
      <button @click="closeInvoiceVoucherPreview()" style="width:28px;height:28px;border:none;background:#F0EEE9;border-radius:5px;cursor:pointer;font-size:16px">×</button>
    </div>
    <div style="flex:1;background:#F0EEE9;overflow:hidden">
      <iframe :src="ivPreviewBlobUrl" style="width:100%;height:100%;border:none;display:block"></iframe>
    </div>
    <div style="padding:12px 20px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:10px">
      <button @click="closeInvoiceVoucherPreview()"
              style="padding:7px 16px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:var(--font-zh);background:#fff;cursor:pointer">關閉</button>
    </div>
  </div>
</div>

<!-- ── 匯入品項選擇 Modal ── -->
<div x-show="showImportModal" x-cloak
       style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px"
       @click.self="showImportModal=false"
       @keydown.escape.window="showImportModal=false">
    <div style="background:#fff;border-radius:12px;width:100%;max-width:500px;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(0,0,0,.22)">
      <!-- 標題 -->
      <div style="display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border-light);gap:10px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        <span style="font-size:13px;font-weight:600;flex:1;font-family:var(--font-zh)" x-text="importMode==='materials' ? '選取叫料品項' : '選取設備品項'"></span>
        <button @click="showImportModal=false" style="width:26px;height:26px;border:none;background:#F0EEE9;border-radius:5px;cursor:pointer;font-size:16px;line-height:1;color:var(--text-secondary)">×</button>
      </div>
      <!-- 全選工具列 -->
      <div style="padding:8px 18px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:8px">
        <button @click="selectAllImportItems(true)"  style="font-size:11px;padding:3px 10px;border:1px solid var(--border-light);border-radius:5px;background:#fff;cursor:pointer;font-family:var(--font-zh)">全選</button>
        <button @click="selectAllImportItems(false)" style="font-size:11px;padding:3px 10px;border:1px solid var(--border-light);border-radius:5px;background:#fff;cursor:pointer;font-family:var(--font-zh)">清除</button>
        <span style="font-size:11px;color:var(--text-dim);font-family:LINE Seed TW_OTF, sans-serif;margin-left:auto"
              x-text="Object.values(importSelectedItems).filter(Boolean).length + ' / ' + quoteItemsForImport().length + ' 項已選'"></span>
      </div>
      <!-- 品項清單 -->
      <div style="flex:1;overflow-y:auto;padding:8px 14px">
        <template x-if="quoteItemsForImport().length===0">
          <div style="padding:24px 0;text-align:center;font-size:12px;color:var(--text-dim);font-family:var(--font-zh)">此報價單沒有可匯入的品項</div>
        </template>
        <template x-for="(qi, qi_idx) in quoteItemsForImport()" :key="qi_idx">
          <label style="display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:7px;cursor:pointer;border-bottom:1px solid #F0EFEB"
                 :style="importSelectedItems[qi_idx] ? 'background:#EEF6FF;border-bottom-color:transparent' : ''">
            <input type="checkbox" :checked="importSelectedItems[qi_idx]" @change="toggleImportItem(qi_idx)"
                   style="width:15px;height:15px;flex-shrink:0;cursor:pointer;accent-color:var(--accent)">
            <div style="flex:1;min-width:0">
              <div style="font-size:12px;font-weight:500;font-family:var(--font-zh);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" x-text="qi.description || '(無品名)'"></div>
              <div style="font-size:10px;color:var(--text-dim);font-family:LINE Seed TW_OTF, sans-serif;margin-top:1px"
                   x-text="[qi.brand, (qi.qty||1) + ' ' + (qi.unit||'台')].filter(Boolean).join(' · ')"></div>
            </div>
          </label>
        </template>
      </div>
      <!-- 底部按鈕 -->
      <div style="padding:12px 18px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:8px">
        <button @click="showImportModal=false"
                style="padding:6px 16px;border:1px solid var(--border-light);border-radius:var(--radius);font-size:12px;background:#fff;cursor:pointer;font-family:var(--font-zh)">取消</button>
        <button @click="doImport()"
                :disabled="!Object.values(importSelectedItems).some(Boolean)"
                style="padding:6px 16px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:12px;font-weight:500;cursor:pointer;font-family:var(--font-zh)"
                :style="!Object.values(importSelectedItems).some(Boolean) ? 'opacity:.45;cursor:not-allowed' : ''">
          匯入選取項目
        </button>
      </div>
    </div>
  </div>

<script>
/* case-management.js を外部ファイルとして読み込み済み（head内） */
void 0
</script>
  <script src="../static/notif.js"></script>

  <script src="../static/sidebar.js"></script>
</body>
</html>
