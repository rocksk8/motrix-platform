                <div x-show="stageView==='timeline'" x-cloak>
                  <template x-if="!(cr.caseRecord?.stages || []).some(s => s.startDate || s.dueDate || (s.done && s.doneAt))">
                    <div style="padding:24px;text-align:center;color:var(--text-dim);font-size:12px;font-family:var(--font-zh);background:#FAFAF9;border:1px dashed var(--border-light);border-radius:10px;margin-bottom:14px">
                      尚未設定任何階段的日期，請先到清單視圖展開階段設定起訖日期
                    </div>
                  </template>
                  <div id="stage-gantt-chart" x-ref="ganttContainer" style="margin-bottom:18px;overflow-x:auto"></div>
                  <div style="font-size:11px;color:var(--text-dim);font-family:var(--font-zh);margin-bottom:14px">
                    可直接拖曳長條調整日期；前置階段依賴請到清單視圖的「詳細設定」設定
                  </div>
                </div>

                <div x-show="stageView==='list'">
                <template x-for="(st, idx) in (cr.caseRecord?.stages || [])" :key="st.id">
                  <div class="stage-card" :class="st.done ? 'stage-card--done' : ''"
                       draggable="true"
                       @dragstart="dragStart(idx)"
                       @dragover="dragOver($event, idx)"
                       @dragend="dragEnd()"
                       :style="dragFromIdx === idx ? 'opacity:.4' : ''">

                    <div class="stage-card__head">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:#C9C7C1;flex-shrink:0;cursor:grab">
                        <path d="M8 6h.01M8 12h.01M8 18h.01M16 6h.01M16 12h.01M16 18h.01"/>
                      </svg>
                      <input type="checkbox" x-model="st.done"
                             @change="updateStage(st, {done: st.done, doneAt: st.done ? (st.doneAt || new Date().toISOString().slice(0,10)) : ''})"
                             style="width:15px;height:15px;flex-shrink:0;accent-color:var(--success)">
                      <input type="text" x-model="st.label" @change="updateStage(st, {label: st.label})"
                             style="flex:1;border:none;outline:none;font-size:13px;font-weight:600;font-family:var(--font-zh);background:transparent"
                             :style="st.done ? 'text-decoration:line-through;color:#9CA3AF' : 'color:var(--text-primary)'">
                      <template x-if="st.done">
                        <input type="date" x-model="st.doneAt" @change="updateStage(st, {doneAt: st.doneAt})"
                               style="font-size:11px;border:1px solid #86EFAC;border-radius:5px;padding:3px 6px;background:#F0FDF4;color:#15803D;font-family:LINE Seed TW_OTF, sans-serif;outline:none">
                      </template>
                      <div class="stage-avatars" @click="toggleStageDetail(st.id)" title="點擊查看／編輯負責人">
                        <template x-if="!(st.assignedTo || []).length">
                          <span class="stage-avatar-dot stage-avatar-dot--empty">？</span>
                        </template>
                        <template x-for="uname in (st.assignedTo || []).slice(0,3)" :key="uname">
                          <span class="stage-avatar-dot" :style="{background: _avatarColor(uname)}"
                                :title="_userDisplay(uname)" x-text="_userDisplay(uname)[0] || uname[0]"></span>
                        </template>
                        <template x-if="(st.assignedTo || []).length > 3">
                          <span class="stage-avatar-dot stage-avatar-dot--more" x-text="'+' + ((st.assignedTo||[]).length - 3)"></span>
                        </template>
                      </div>
                      <span style="font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;font-family:LINE Seed TW_OTF, sans-serif;flex-shrink:0;white-space:nowrap"
                            :style="st.done ? 'background:#DCFCE7;color:#15803D' : 'background:#F3F4F6;color:#9CA3AF'"
                            x-text="st.done ? '完成' : '待辦'"></span>
                      <span class="stage-overdue-badge" x-show="stageIsOverdue(st)">已逾期</span>
                      <button class="stage-toggle-detail" @click="toggleStageDetail(st.id)"
                              :title="_openStageDetail[st.id] ? '收合詳細設定' : '展開日期／負責人／前置階段'"
                              x-text="_openStageDetail[st.id] ? '▾' : '▸'"></button>
                      <button class="btn-del" @click="removeStage(idx)" style="flex-shrink:0">×</button>
                    </div>

                    <div class="stage-detail" x-show="_openStageDetail[st.id]" x-cloak>
                      <div class="stage-detail__row" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
                        <div>
                          <label class="stage-detail__label">起始日期</label>
                          <input type="date" class="fi fi--sm" x-model="st.startDate" @change="updateStage(st, {startDate: st.startDate})">
                        </div>
                        <div>
                          <label class="stage-detail__label">到期日期</label>
                          <input type="date" class="fi fi--sm" x-model="st.dueDate" @change="updateStage(st, {dueDate: st.dueDate})">
                        </div>
                      </div>
                      <div class="stage-detail__row">
                        <label class="stage-detail__label">負責人（可複選）</label>
                        <div class="attendee-chips" style="margin-bottom:6px">
                          <template x-for="uname in (st.assignedTo || [])" :key="uname">
                            <span class="attendee-chip">
                              <span x-text="(selectableUsers.find(u => u.username === uname)?.display_name) || uname"></span>
                              <button class="rm" @click="removeStageAssignee(st, uname)">×</button>
                            </span>
                          </template>
                          <span x-show="!(st.assignedTo || []).length" style="font-size:11px;color:var(--text-dim);font-family:var(--font-zh)">尚未指派</span>
                        </div>
                        <div class="attendee-add">
                          <select class="attendee-select" x-model="_newStageAssignee[st.id]">
                            <option value="">選擇負責人…</option>
                            <template x-for="u in selectableUsers" :key="u.username">
                              <option :value="u.username" x-text="u.display_name + ' (' + u.username + ')'"></option>
                            </template>
                          </select>
                          <button class="btn btn-ghost btn-sm" @click="addStageAssignee(st, _newStageAssignee[st.id]); _newStageAssignee[st.id]=''">加入</button>
                        </div>
                      </div>
                      <div class="stage-detail__row" x-show="otherStages(st.id).length">
                        <label class="stage-detail__label">前置階段（需先完成才能開始）</label>
                        <div class="stage-dep-list">
                          <template x-for="s in otherStages(st.id)" :key="s.id">
                            <label class="stage-dep-item" :class="(st.dependsOn || []).includes(s.id) ? 'on' : ''">
                              <input type="checkbox" :checked="(st.dependsOn || []).includes(s.id)"
                                     @change="toggleStageDependency(st, s.id)">
                              <span x-text="s.label"></span>
                            </label>
                          </template>
                        </div>
                      </div>
                    </div>

                    <div class="stage-card__body">
                      <div class="visit-row" style="font-size:10px;color:var(--text-dim);font-family:LINE Seed TW_OTF, sans-serif;padding-bottom:5px;border-bottom:1px solid #F0EFEB;margin-bottom:6px;align-items:center">
                        <span>前往日期</span>
                        <span style="text-align:center">人次</span>
                        <span>工作內容 / 備注</span>
                        <span></span>
                      </div>

                      <template x-for="(v, vi) in (st.visits || [])" :key="v.id">
                        <div class="visit-row">
                          <input type="date" x-model="v.visitDate" @change="updateVisit(st, v)" class="fi fi--sm">
                          <input type="number" min="1" max="99" x-model.number="v.visitPeople" @change="updateVisit(st, v)"
                                 placeholder="人" class="fi fi--sm" style="text-align:center;font-family:LINE Seed TW_OTF, sans-serif">
                          <textarea x-model="v.note" @change="updateVisit(st, v)"
                                    placeholder="工作內容、施工項目、備注..." class="fi fi--sm" rows="1"
                                    style="resize:vertical;line-height:1.5;min-height:30px"></textarea>
                          <button class="btn-del" @click="removeVisit(idx, vi)" style="margin-top:2px">×</button>
                        </div>
                      </template>

                      <template x-if="(st.visits || []).length >= 2">
                        <div style="display:flex;gap:12px;padding:5px 0 2px;border-top:1px dashed #E5E7EB;margin-top:4px">
                          <span style="font-size:10px;color:var(--text-dim);font-family:LINE Seed TW_OTF, sans-serif">合計</span>
                          <span style="font-size:11px;font-weight:700;font-family:LINE Seed TW_OTF, sans-serif;color:var(--text-primary)" x-text="stageTotalVisits(st) + ' 次出勤'"></span>
                          <span style="font-size:11px;font-weight:700;font-family:LINE Seed TW_OTF, sans-serif;color:var(--accent)" x-text="stageTotalPeople(st) + ' 人次'"></span>
                        </div>
                      </template>

                      <button class="btn-add" style="margin-top:6px" @click="addVisit(idx)">
                        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 4v16m8-8H4"/></svg>
                        新增記錄
                      </button>
                    </div>
                  </div>
                </template>

                <button class="btn-add" @click="addStage()">
                  <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 4v16m8-8H4"/></svg>
                  新增階段
                </button>
                </div>
              </div>

              <!-- ── 叫料管控 ── -->
              <div x-show="execSubTab==='materials'">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
                  <span class="cm-section-title" style="margin-bottom:0">叫料清單</span>
                  <div style="display:flex;gap:8px">
                    <button class="btn-add" @click="openImportModal('materials')" style="padding:5px 10px">
                      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                      從報價單匯入
                    </button>
                    <template x-if="(cr.caseRecord?.materials||[]).some(m=>m.arrived)">
                      <button class="btn-add" @click="syncMaterialsToDevices()" style="padding:5px 10px;background:#EEF2FF;border-color:#C7D2FE;color:#4338CA">
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 4v5h5M20 20v-5h-5M4 9a9 9 0 0114.5-5.5M20 15a9 9 0 01-14.5 5.5"/></svg>
                        同步至設備登錄
                      </button>
                    </template>
                  </div>
                </div>


                <template x-for="(mat, idx) in (cr.caseRecord?.materials || [])" :key="mat.id">
                  <div class="mat-card">
                    <div class="mat-card__head">
                      <input class="fi" type="text" placeholder="品名" x-model="mat.name" @input="setDirty()" style="flex:1;min-width:0">
                      <input class="fi" type="text" placeholder="廠牌/型號" x-model="mat.model" @input="setDirty()" style="width:110px;font-size:11px;flex-shrink:0">
                      <input class="fi" type="number" placeholder="數量" x-model.number="mat.qty" min="1" @input="setDirty()" style="width:52px;flex-shrink:0">
                      <input class="fi" type="text" placeholder="單位" x-model="mat.unit" @input="setDirty()" style="width:44px;font-size:12px;flex-shrink:0">
                      <span class="mat-tag" :class="mat.arrived ? 'mat-tag--arrived' : mat.ordered ? 'mat-tag--ordered' : 'mat-tag--pending'"
                            x-text="mat.arrived ? '到料' : mat.ordered ? '叫料中' : '待叫料'"></span>
                      <button class="btn-del" @click="removeMaterial(idx)">×</button>
                    </div>
                    <div class="mat-card__body">
                      <div style="display:flex;gap:16px;margin-bottom:6px">
                        <label style="display:flex;align-items:center;gap:5px;font-size:12px;font-family:var(--font-zh);cursor:pointer">
                          <input type="checkbox" x-model="mat.ordered" @change="setDirty()">已叫料
                        </label>
                        <label style="display:flex;align-items:center;gap:5px;font-size:12px;font-family:var(--font-zh);cursor:pointer">
                          <input type="checkbox" x-model="mat.arrived" @change="onMaterialArrived(mat)">已到料
                        </label>
                        <template x-if="mat.arrived">
                          <span style="font-size:11px;color:var(--text-dim);font-family:LINE Seed TW_OTF, sans-serif;margin-left:auto" x-text="'共 ' + (mat.qty||1) + ' ' + (mat.unit||'台')"></span>
                        </template>
                      </div>
                      <!-- 廠商交期追蹤（叫料中且未到料時顯示） -->
                      <div x-show="mat.ordered && !mat.arrived"
                           style="display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap">
                        <input class="fi fi--sm" type="text" placeholder="廠商名稱"
                               x-model="mat.supplier" @input="setDirty()"
                               style="width:100px;font-size:12px">
                        <input class="fi fi--sm" type="date"
                               x-model="mat.expectedDate" @input="setDirty()"
                               title="預計到料日" style="flex:1;min-width:120px;font-size:12px">
                        <span x-show="mat.ordered && !mat.arrived && mat.expectedDate && mat.expectedDate < new Date().toISOString().slice(0,10)"
                              style="font-size:10px;font-weight:700;color:#DC2626;background:#FEF2F2;border:1px solid #FECACA;border-radius:4px;padding:2px 6px;white-space:nowrap;flex-shrink:0">交期逾期</span>
                      </div>

                      <template x-if="mat.arrived">
                        <div style="border-top:1px solid var(--border-light);padding-top:8px;margin-top:2px">
                          <div style="font-size:10px;font-family:LINE Seed TW_OTF, sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);font-weight:600;margin-bottom:6px">設備序號 / MAC</div>
                          <template x-for="(md, mi) in (mat.devices || [])" :key="md.id">
                            <div style="display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:center;margin-bottom:4px">
                              <span style="font-size:11px;color:var(--text-dim);font-family:LINE Seed TW_OTF, sans-serif;min-width:18px" x-text="'#'+(mi+1)"></span>
                              <input class="fi fi--sm fi--mono" type="text" placeholder="SN 序號" x-model="md.sn" @input="autoSyncDevice(mat, mi)">
                              <input class="fi fi--sm fi--mono" type="text" placeholder="MAC 位址" x-model="md.mac" @input="autoSyncDevice(mat, mi)">
                            </div>
                          </template>
                        </div>
                      </template>
                      <input class="fi fi--sm" type="text" placeholder="備注" x-model="mat.note" @input="setDirty()" style="width:100%;margin-top:6px">

                      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px">
                        <span style="font-size:10px;color:var(--text-dim);font-family:var(--font-zh)">附件（到貨憑證/包裝清單...）</span>
                        <template x-for="f in (mat.files||[])" :key="f.id">
                          <span style="display:flex;align-items:center;gap:4px;font-size:11px;background:#F3F4F6;border-radius:4px;padding:2px 6px">
                            <a href="javascript:void(0)" @click="previewAttachmentFile(f)" style="color:var(--accent);text-decoration:underline" x-text="f.filename"></a>
                            <button @click="deleteMaterialFile(idx, f.id)" style="border:none;background:none;color:var(--danger);cursor:pointer;font-size:11px;padding:0 2px">×</button>
                          </span>
                        </template>
                        <label style="padding:2px 8px;font-size:10px;border:1px solid var(--border);background:#fff;color:var(--text-secondary);border-radius:4px;cursor:pointer;white-space:nowrap">
                          + 上傳附件
                          <input type="file" multiple accept=".jpg,.jpeg,.png,.pdf" style="display:none" @change="uploadMaterialFiles(idx, $event)">
                        </label>
                      </div>

                      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px">
                        <span style="font-size:10px;color:var(--text-dim);font-family:var(--font-zh)">發票</span>
                        <template x-for="f in (mat.invoiceFiles||[])" :key="f.id">
                          <span style="display:flex;align-items:center;gap:4px;font-size:11px;background:#F3F4F6;border-radius:4px;padding:2px 6px">
                            <a href="javascript:void(0)" @click="previewAttachmentFile(f)" style="color:var(--accent);text-decoration:underline" x-text="f.filename"></a>
                            <button @click="deleteMaterialInvoiceFile(idx, f.id)" style="border:none;background:none;color:var(--danger);cursor:pointer;font-size:11px;padding:0 2px">×</button>
                          </span>
                        </template>
                        <label style="padding:2px 8px;font-size:10px;border:1px solid var(--border);background:#fff;color:var(--text-secondary);border-radius:4px;cursor:pointer;white-space:nowrap">
                          + 上傳發票
                          <input type="file" multiple accept=".jpg,.jpeg,.png,.pdf" style="display:none" @change="uploadMaterialInvoiceFiles(idx, $event)">
                        </label>
                      </div>
                    </div>
                  </div>
                </template>

                <button class="btn-add" @click="addMaterial()">
                  <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 4v16m8-8H4"/></svg>
                  新增品項
                </button>
              </div>

              <!-- ── 設備登錄 ── -->
              <div x-show="execSubTab==='devices'">
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
                  <span class="cm-section-title" style="margin-bottom:0">設備 SN / MAC 記錄</span>
                  <template x-if="(cr.caseRecord?.devices||[]).length > 0">
                    <div style="display:flex;align-items:center;gap:6px;padding:6px 10px;background:#EEF2FF;border:1px solid #C7D2FE;border-radius:7px;flex-wrap:wrap">
                      <span style="font-size:11px;font-weight:600;color:#4338CA;font-family:var(--font-zh);white-space:nowrap">一鍵同步保固</span>
                      <input type="date" x-model="_syncWarrantyDate" class="fi fi--sm" style="width:138px;flex-shrink:0">
                      <select x-model.number="_syncWarrantyMonths" class="fi fi--sm" style="width:96px;flex-shrink:0">
                        <option value="3">3 月</option>
                        <option value="6">6 月</option>
                        <option value="12">12 月（1 年）</option>
                        <option value="24">24 月（2 年）</option>
                        <option value="36">36 月（3 年）</option>
                        <option value="48">48 月（4 年）</option>
                        <option value="60">60 月（5 年）</option>
                      </select>
                      <button @click="syncAllWarranty()" :disabled="!_syncWarrantyDate"
                              style="padding:4px 10px;background:#4338CA;color:#fff;border:none;border-radius:5px;font-size:11px;font-family:var(--font-zh);font-weight:600;cursor:pointer;white-space:nowrap;opacity:1"
                              :style="!_syncWarrantyDate ? 'opacity:.4;cursor:default' : ''">
                        套用全部設備
                      </button>
                    </div>
                  </template>
                  <button @click="openNetworkPlan()"
                          style="margin-left:auto;font-size:11px;padding:3px 10px;border-radius:4px;border:1px solid #A7F3D0;background:#ECFDF5;color:#047857;cursor:pointer;font-family:var(--font-zh);white-space:nowrap">
                    網路架構規劃書
                  </button>
                </div>

                <!-- Grouped + ungrouped device display -->
                <template x-for="(entry, ei) in deviceDisplayList()" :key="entry.id">
                  <div>
                    <!-- Group block -->
                    <template x-if="entry.type === 'group'">
                      <div class="dev-group"
                           :class="{ 'dev-group--drop-over': _devHoverGroupId === entry.groupId }">
                        <div class="dev-group-header"
                             @click="toggleDevGroup(entry.groupId)"
                             @dragover.prevent="devDragOver($event, 'group_' + entry.groupId)"
                             @dragleave="devDragLeave($event)"
                             @drop="devDropOnGroup($event, entry.groupId, entry.groupName)">
                          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2.5"
                               :style="_openDevGroups[entry.groupId] ? 'transform:rotate(90deg);transition:.15s' : 'transition:.15s'">
                            <path d="M9 18l6-6-6-6"/>
                          </svg>
                          <span class="dev-group-header__title" x-text="entry.groupName + ' × ' + entry.groupTotal"></span>
                          <span class="dev-group-header__badge"
                                x-text="entry.devices.filter(d => d.sn || d.mac).length + '/' + entry.groupTotal + ' 已填'"></span>
                          <button class="btn-del" @click.stop="removeDeviceGroup(entry.groupId)" title="刪除整個群組">×</button>
                        </div>
                        <div class="dev-group-body" x-show="_openDevGroups[entry.groupId]">
                          <template x-for="(dev, di) in entry.devices" :key="dev.id">
                            <div class="dev-card"
                                 draggable="true"
                                 :class="{ 'dev-card--dragging': _devDragId === dev.id, 'dev-card--group-target': _devGroupTarget === 'dev_' + dev.id, 'dev-card--insert-before': _devInsertBeforeId === 'dev_' + dev.id && _devGroupTarget !== 'dev_' + dev.id }"
                                 @dragstart="devDragStart($event, dev)"
                                 @dragend="devDragEnd()"
                                 @dragover="devDragOver($event, 'dev_' + dev.id)"
                                 @dragleave="devDragLeave($event)"
                                 @drop="devDropOnDevice($event, dev)">
                              <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
                                <span class="dev-drag-handle" title="拖曳排序；在目標設備上停留 1 秒可合併成群組">
                                  <svg width="13" height="18" viewBox="0 0 10 14" fill="currentColor"><circle cx="3" cy="2.5" r="1.1"/><circle cx="7" cy="2.5" r="1.1"/><circle cx="3" cy="6.5" r="1.1"/><circle cx="7" cy="6.5" r="1.1"/><circle cx="3" cy="10.5" r="1.1"/><circle cx="7" cy="10.5" r="1.1"/></svg>
                                </span>
                                <span style="font-size:10px;font-weight:700;color:#1D4ED8;background:#EFF6FF;padding:2px 7px;border-radius:4px;flex-shrink:0;font-family:LINE Seed TW_OTF, sans-serif" x-text="'#' + (dev._groupIdx||di+1)"></span>
                                <input class="fi" type="text" placeholder="設備名稱" x-model="dev.name" @input="setDirty()" style="flex:1">
                                <template x-if="dev.warrantyStart">
                                  <span class="w-badge" :class="'w-badge--' + warrantyStatus(dev.warrantyStart, dev.warrantyMonths)"
                                        x-text="warrantyStatusLabel(dev.warrantyStart, dev.warrantyMonths)"></span>

                    </div>

                    <!-- 匯款申請：已有申請時無論派發狀態之後是否被改掉都要維持可見，
                         否則已核准/已匯款的申請會從畫面上消失，找不到地方下載 -->
                    <div x-show="(d.status==='completed' || d.status==='accepted' || _dispatchVoucher(d)) && ['superadmin','admin'].includes(session.role)"
                         style="padding:8px 16px;border-top:1px solid var(--border-light);background:#FFFBEB;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                      <template x-if="!_dispatchVoucher(d)">
                        <button @click="createContractorVoucher(d)"
                                style="padding:4px 10px;font-size:11px;border:1px solid #FCD34D;background:#FEF3C7;color:#92400E;border-radius:5px;cursor:pointer;white-space:nowrap;font-weight:600">
                          產生匯款申請
                        </button>
                      </template>
                      <template x-if="_dispatchVoucher(d)">
                        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%">
                          <span style="font-size:11px;font-weight:600;color:#92400E" x-text="_dispatchVoucher(d).voucherNo"></span>
                          <span :class="'badge ' + _cvStatusClass(_dispatchVoucher(d).status)" x-text="_cvStatusLabel(_dispatchVoucher(d).status)"
                                style="font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600"></span>
                          <span x-show="_dispatchVoucher(d).isPaid" style="font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;background:#DCFCE7;color:#15803D">
                            ✓ 已匯款<span x-show="_dispatchVoucher(d).paidAt" x-text="'（' + _dispatchVoucher(d).paidAt.slice(0,10) + '）'"></span>
                          </span>

                          <div x-show="_dispatchVoucher(d).status==='草稿'" style="display:flex;gap:6px">
                            <button @click="submitContractorVoucher(_dispatchVoucher(d))" style="padding:3px 10px;font-size:11px;border:none;background:var(--accent);color:#fff;border-radius:5px;cursor:pointer;white-space:nowrap;font-weight:600">送出審核</button>
                            <button @click="deleteContractorVoucher(_dispatchVoucher(d))" style="padding:3px 8px;font-size:11px;border:1px solid var(--border);border-radius:5px;background:#fff;cursor:pointer;color:var(--danger)">刪</button>
                          </div>
                          <div x-show="_dispatchVoucher(d).status==='待審核' || _dispatchVoucher(d).status==='簽核中'" style="display:flex;gap:6px">
                            <button @click="approveContractorVoucher(_dispatchVoucher(d))" style="padding:3px 10px;font-size:11px;border:none;background:#059669;color:#fff;border-radius:5px;cursor:pointer;white-space:nowrap;font-weight:600">簽核</button>
                            <button @click="rejectContractorVoucher(_dispatchVoucher(d))" style="padding:3px 10px;font-size:11px;border:1px solid #FCA5A5;background:#FEF2F2;color:#DC2626;border-radius:5px;cursor:pointer;white-space:nowrap">退回</button>
                          </div>
                          <div x-show="_dispatchVoucher(d).status==='已核准'" style="display:flex;gap:6px;flex-wrap:wrap">
                            <button x-show="!_dispatchVoucher(d).isPaid" @click="toggleContractorVoucherPaid(_dispatchVoucher(d),'pay')" style="padding:3px 10px;font-size:11px;border:none;background:#059669;color:#fff;border-radius:5px;cursor:pointer;white-space:nowrap;font-weight:600">標記已匯款</button>
                            <button x-show="_dispatchVoucher(d).isPaid" @click="toggleContractorVoucherPaid(_dispatchVoucher(d),'unpay')" style="padding:3px 10px;font-size:11px;border:1px solid var(--border);background:#fff;color:var(--text-secondary);border-radius:5px;cursor:pointer;white-space:nowrap">取消已匯款</button>
                            <button x-show="!_dispatchVoucher(d).isPaid" @click="revokeContractorVoucherApproval(_dispatchVoucher(d))" style="padding:3px 10px;font-size:11px;border:1px solid #FCA5A5;background:#FEF2F2;color:#DC2626;border-radius:5px;cursor:pointer;white-space:nowrap">撤銷核准</button>
                          </div>
                          <button @click="previewContractorVoucherPdf(_dispatchVoucher(d))" :disabled="cvPreviewFetching"
                                  style="padding:3px 10px;font-size:11px;border:1px solid var(--border);background:#fff;color:var(--text-secondary);border-radius:5px;cursor:pointer;white-space:nowrap">預覽</button>
                          <button x-show="_dispatchVoucher(d).status==='已核准'" @click="downloadContractorVoucherPdf(_dispatchVoucher(d))"
                                  style="padding:3px 10px;font-size:11px;border:1px solid #93C5FD;background:#EFF6FF;color:#1D4ED8;border-radius:5px;cursor:pointer;white-space:nowrap">下載 PDF</button>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>

              </div><!-- /dispatch -->

              <!-- ══ 出貨單 Tab ══ -->
              <div x-show="activeTab==='shipping'">

                <!-- KPI bar -->
                <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap">
                  <div style="flex:1">
                    <span class="cm-section-title" style="margin-bottom:0">出貨單管理</span>
                  </div>
                  <select style="font-size:11px;padding:3px 6px;border:1px solid var(--border-light);border-radius:5px;cursor:pointer"
                          :value="snSortPref.sortMode" @change="setSubListSortMode('sn', $event.target.value)">
                    <option value="">排序：預設</option>
                    <option value="shipDate">排序：出貨日期</option>
                    <option value="createdAt">排序：建立日期</option>
                    <option value="custom">排序：自訂（可拖曳）</option>
                  </select>
                  <button x-show="snSortPref.sortMode && snSortPref.sortMode !== 'custom'" @click="toggleSubListSortDir('sn')"
                          style="font-size:11px;padding:3px 8px;border:1px solid var(--border-light);border-radius:5px;background:#fff;cursor:pointer" x-text="snSortPref.sortDir==='asc'?'↑':'↓'"></button>
                  <button x-show="['superadmin','admin'].includes(session.role)"
                          class="btn-add" @click="openNewShippingNote()" style="padding:5px 12px;font-size:12px">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 4v16m8-8H4"/></svg>
                    新增出貨單
                  </button>
                </div>

                <!-- Loading -->
                <div x-show="shippingNotesLoading" style="text-align:center;padding:30px;color:var(--text-dim);font-size:12px">載入中…</div>

                <!-- Empty -->
                <div x-show="!shippingNotesLoading && shippingNotes.length===0"
                     style="text-align:center;padding:40px;color:var(--text-dim);font-size:13px">
                  尚未建立任何出貨單
                </div>

                <!-- Shipping note list -->
                <div x-ref="snListBody">
                <template x-for="n in sortedShippingNotes()" :key="n.id">
                  <div style="border:1px solid var(--border-light);border-radius:10px;margin-bottom:12px;overflow:hidden" :data-item-id="n.noteNo">
                    <!-- Header row -->
                    <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;background:#FAFAF9;border-bottom:1px solid var(--border-light);flex-wrap:wrap">
                      <span class="drag-handle" x-show="snSortPref.sortMode === 'custom'" @click.stop>⠿</span>
                      <div style="flex:1;min-width:160px">
                        <div style="font-size:13px;font-weight:600;color:var(--text-main);font-family:LINE Seed TW_OTF, sans-serif" x-text="n.noteNo"></div>
                        <div style="font-size:11px;color:var(--text-dim);margin-top:2px">
                          <span x-show="n.shipDate" x-text="'出貨日：' + n.shipDate"></span>
                          <span> · </span>
                          <span x-text="n.itemCount + ' 項品項'"></span>
                        </div>
                      </div>
                      <span :class="'badge ' + _shippingStatusClass(n.status)" x-text="_shippingStatusLabel(n.status)"
                            style="font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600"></span>
                      <span x-show="(n.status==='待審核'||n.status==='簽核中') && (n.approval && n.approval.tiers || []).length>0"
                            style="font-size:10px;color:var(--text-dim)"
                            x-text="'第 ' + (((n.approval.currentTier)||0)+1) + ' 層 / 共 ' + n.approval.tiers.length + ' 層'"></span>

                      <!-- 草稿操作 -->
                      <div x-show="n.status==='草稿' && ['superadmin','admin'].includes(session.role)" style="display:flex;gap:6px">
                        <button @click="openEditShippingNote(n)" style="padding:4px 8px;font-size:11px;border:1px solid var(--border);border-radius:5px;background:#fff;cursor:pointer">編輯</button>
                        <button @click="submitShippingNote(n)" style="padding:4px 10px;font-size:11px;border:none;background:var(--accent);color:#fff;border-radius:5px;cursor:pointer;white-space:nowrap;font-weight:600">送出審核</button>
                        <button @click="deleteShippingNote(n)" style="padding:4px 8px;font-size:11px;border:1px solid var(--border);border-radius:5px;background:#fff;cursor:pointer;color:var(--danger)">刪</button>
                      </div>

                      <!-- 待審核/簽核中操作 -->
                      <div x-show="(n.status==='待審核'||n.status==='簽核中') && ['superadmin','admin'].includes(session.role)" style="display:flex;gap:6px">
                        <button @click="approveShippingNote(n)" style="padding:4px 10px;font-size:11px;border:none;background:#059669;color:#fff;border-radius:5px;cursor:pointer;white-space:nowrap;font-weight:600">簽核</button>
                        <button @click="rejectShippingNote(n)" style="padding:4px 10px;font-size:11px;border:1px solid #FCA5A5;background:#FEF2F2;color:#DC2626;border-radius:5px;cursor:pointer;white-space:nowrap">退回</button>
                      </div>

                      <!-- 已核准操作 -->
                      <div x-show="n.status==='已核准' && ['superadmin','admin'].includes(session.role)" style="display:flex;gap:6px">
                        <button @click="downloadShippingPdf(n)" style="padding:4px 10px;font-size:11px;border:1px solid #93C5FD;background:#EFF6FF;color:#1D4ED8;border-radius:5px;cursor:pointer;white-space:nowrap">下載 PDF</button>
                        <button x-show="!n.isSigned" @click="toggleSigned(n,'sign')" style="padding:4px 10px;font-size:11px;border:none;background:#059669;color:#fff;border-radius:5px;cursor:pointer;white-space:nowrap;font-weight:600">標記已回簽</button>
                        <button x-show="n.isSigned" @click="toggleSigned(n,'unsign')" style="padding:4px 10px;font-size:11px;border:1px solid var(--border);background:#fff;color:var(--text-secondary);border-radius:5px;cursor:pointer;white-space:nowrap">取消回簽</button>
                        <button x-show="!n.isSigned" @click="revokeShippingApproval(n)" title="退回草稿，並自動歸還已扣的庫存序號"
                                style="padding:4px 10px;font-size:11px;border:1px solid #FCA5A5;background:#FEF2F2;color:#DC2626;border-radius:5px;cursor:pointer;white-space:nowrap">撤銷核准</button>
                      </div>

                      <!-- 預覽（不分狀態） -->
                      <div x-show="['superadmin','admin'].includes(session.role)" style="display:flex;gap:6px">
                        <button @click="previewShippingPdf(n)" :disabled="shippingPreviewFetching"
                                style="padding:4px 10px;font-size:11px;border:1px solid var(--border);background:#fff;color:var(--text-secondary);border-radius:5px;cursor:pointer;white-space:nowrap">預覽</button>
                      </div>
                    </div>

                    <!-- Items -->
                    <div x-show="n.items && n.items.length > 0" style="padding:10px 16px">
                      <table style="width:100%;border-collapse:collapse;font-size:11px">
                        <thead>
                          <tr style="color:var(--text-dim);border-bottom:1px solid var(--border-light)">
                            <th style="text-align:left;padding:4px 0;font-weight:500">品名 / 規格說明</th>
                            <th style="text-align:left;padding:4px 6px;font-weight:500;width:100px">廠牌 / 型號</th>
                            <th style="text-align:right;padding:4px 6px;font-weight:500;width:50px">數量</th>
                            <th style="text-align:left;padding:4px 0;font-weight:500;width:40px">單位</th>
                            <th style="text-align:left;padding:4px 0;font-weight:500;width:120px">備註</th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="(it, ii) in n.items" :key="ii">
                            <tr style="border-bottom:1px solid #F5F4F0">
                              <td style="padding:5px 0;font-family:var(--font-zh)" x-text="it.description"></td>
                              <td style="padding:5px 6px;color:var(--text-dim)" x-text="it.brand"></td>
                              <td style="text-align:right;padding:5px 6px;font-family:LINE Seed TW_OTF, sans-serif" x-text="it.qty"></td>
                              <td style="padding:5px 0;color:var(--text-dim)" x-text="it.unit"></td>
                              <td style="padding:5px 0;color:var(--text-dim)" x-text="it.notes"></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                    <div x-show="n.notes" style="padding:6px 16px 0;font-size:11px;color:var(--text-dim)"
                         x-text="'備注：' + n.notes"></div>

                    <!-- 回簽附件 -->
                    <div style="padding:8px 16px;border-top:1px solid var(--border-light);display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                      <span style="font-size:11px;color:var(--text-dim);font-family:var(--font-zh)">回簽附件</span>
                      <template x-for="f in (n.signedFiles||[])" :key="f.id">
                        <span style="display:flex;align-items:center;gap:4px;font-size:11px;background:#F3F4F6;border-radius:4px;padding:2px 6px">
                          <a href="javascript:void(0)" @click="previewAttachmentFile(f)" style="color:var(--accent);text-decoration:underline" x-text="f.filename"></a>
                          <button @click="deleteShippingSignedFile(n, f.id)" style="border:none;background:none;color:var(--danger);cursor:pointer;font-size:11px;padding:0 2px">×</button>
                        </span>
                      </template>
                      <label style="padding:3px 10px;font-size:11px;border:1px solid var(--border);background:#fff;color:var(--text-secondary);border-radius:5px;cursor:pointer;white-space:nowrap">
                        + 上傳附件
                        <input type="file" multiple accept=".jpg,.jpeg,.png,.pdf" style="display:none" @change="uploadShippingSignedFiles(n, $event)">
                      </label>
                    </div>

                    <!-- 已回簽確認條 -->
                    <div x-show="n.isSigned"
                         style="padding:6px 16px 10px;font-size:11px;color:#065F46;background:#F0FDF4;border-top:1px solid #D1FAE5;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                      <span>✓ 已回簽</span>
                      <span style="color:#374151;font-weight:600" x-text="n.signedBy"></span>
                      <span style="color:var(--text-dim)" x-text="n.signedAt ? '· ' + n.signedAt.slice(0,16).replace('T',' ') : ''"></span>
                      <span style="flex:1"></span>
                      <button @click="_shippingLogOpen[n.id] = !_shippingLogOpen[n.id]"
                              style="background:none;border:none;color:#065F46;text-decoration:underline;cursor:pointer;font-size:11px">
                        <span x-text="_shippingLogOpen[n.id] ? '收合回簽歷程' : '查看回簽歷程'"></span>
                      </button>
                    </div>
                    <div x-show="n.isSigned && _shippingLogOpen[n.id]" style="padding:8px 16px 10px;background:#FAFAF9;border-top:1px solid var(--border-light)">
                      <template x-for="(l, li) in (n.signedLog||[]).slice().reverse()" :key="li">
                        <div style="font-size:11px;color:var(--text-secondary);padding:3px 0;display:flex;gap:8px;flex-wrap:wrap">
                          <span :style="l.action==='signed' ? 'color:#065F46' : 'color:var(--danger)'"
                                x-text="l.action==='signed' ? '✓ 標記回簽' : '✕ 取消回簽'"></span>
                          <span x-text="l.userDisplay"></span>
                          <span style="color:var(--text-dim)" x-text="(l.at||'').slice(0,16).replace('T',' ')"></span>
                          <span x-show="l.note" style="color:var(--text-dim)" x-text="'－ ' + l.note"></span>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
                </div>

              </div><!-- /shipping -->

              <!-- ══ 動態 Tab ══ -->
              <div x-show="activeTab==='feed'" class="feed-wrap">
                <!-- 月曆總覽 toggle -->
                <div class="feed-cal-toggle-row">
                  <button class="feed-cal-toggle-btn" :class="{on: feedCalMode}" @click="toggleFeedCalMode()">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    <span x-text="feedCalMode ? '← 關閉月曆' : '月曆總覽'"></span>
                  </button>
                  <template x-if="feedCalSelDate">
                    <span class="feed-cal-filter-tag">
                      篩選：<span x-text="feedCalSelDate"></span>
                      <button @click="feedCalSelDate=''" title="清除篩選">×</button>
                    </span>
                  </template>
                </div>
                <!-- 月曆總覽 -->
                <div class="feed-cal-wrap" x-show="feedCalMode" x-cloak>
                  <div class="feed-cal-hd">
                    <button class="feed-cal-nav" @click="feedCalPrevMonth()">&#8592;</button>
                    <span class="feed-cal-title" x-text="feedCalYear + '年' + feedCalMonth + '月'"></span>
                    <button class="feed-cal-nav" @click="feedCalNextMonth()">&#8594;</button>
                  </div>
                  <div class="feed-cal-wdays">
                    <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span>
                    <span class="sat">六</span><span class="sun">日</span>
                  </div>
                  <div class="feed-cal-grid">
                    <template x-for="cell in feedCalDays()" :key="cell.date">
                      <div class="feed-cal-cell"
                           :class="{out: !cell.inMonth, today: cell.isToday, sel: cell.date===feedCalSelDate, has: cell.inMonth && feedCalCount(cell.date)>0}"
                           @click="cell.inMonth && (feedCalSelDate = feedCalSelDate===cell.date ? '' : cell.date)">
                        <span class="feed-cal-daynum" x-text="cell.day"></span>
                        <span class="feed-cal-cnt" x-show="cell.inMonth && feedCalCount(cell.date)>0" x-text="feedCalCount(cell.date)"></span>
                      </div>
                    </template>
                  </div>
                </div>
                <!-- compose box -->
                <div class="feed-compose">
                  <textarea class="feed-compose__box" placeholder="記錄聯繫情況、案件進展、備忘…（填了執行時數/聯絡事項或附上照片即記為工作日誌）" x-model="newComment" rows="2"></textarea>

                  <!-- 結構化欄位：日期／記錄對象／執行時數／聯絡事項（2026-08-26 新增執行時數/聯絡事項，
                       2026-08-30 補上日期／記錄對象——原本固定「今天／自己」沒有可選欄位，補登過去
                       日期或代其他人記錄時無從選起） -->
                  <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:8px">
                    <div style="display:flex;align-items:center;gap:6px">
                      <label style="font-size:11px;color:var(--text-dim);font-family:var(--font-zh);white-space:nowrap">日期</label>
                      <input type="date" x-model="newCommentLogDate"
                             style="padding:5px 8px;font-size:12px;border:1px solid var(--border-light);border-radius:6px;font-family:var(--font-zh);outline:none;box-sizing:border-box">
                    </div>
                    <div style="display:flex;align-items:center;gap:6px">
                      <label style="font-size:11px;color:var(--text-dim);font-family:var(--font-zh);white-space:nowrap">記錄對象</label>
                      <select x-model="newCommentUserId"
                              style="padding:5px 8px;font-size:12px;border:1px solid var(--border-light);border-radius:6px;font-family:var(--font-zh);outline:none;background:#fff">
                        <option value="">我自己</option>
                        <template x-for="u in selectableUsers" :key="u.id">
                          <option :value="String(u.id)" x-text="u.display_name || u.username"></option>
                        </template>
                      </select>
                    </div>
                    <div style="display:flex;align-items:center;gap:6px">
                      <label style="font-size:11px;color:var(--text-dim);font-family:var(--font-zh);white-space:nowrap">執行時數</label>
                      <input type="number" step="0.5" min="0" x-model="newCommentHours" placeholder="選填，例如 2"
                             style="width:88px;padding:5px 8px;font-size:12px;border:1px solid var(--border-light);border-radius:6px;font-family:var(--font-zh);outline:none;box-sizing:border-box">
                    </div>
                    <div style="display:flex;align-items:center;gap:6px">
                      <label style="font-size:11px;color:var(--text-dim);font-family:var(--font-zh);white-space:nowrap">聯絡事項</label>
                      <select x-model="newCommentContactType"
                              style="padding:5px 8px;font-size:12px;border:1px solid var(--border-light);border-radius:6px;font-family:var(--font-zh);outline:none;background:#fff">
                        <option value="">選填，不分類</option>
                        <option value="電話溝通">電話溝通</option>
                        <option value="Email往來">Email往來</option>
                        <option value="現場拜訪">現場拜訪</option>
                        <option value="內部討論">內部討論</option>
                        <option value="其他">其他</option>
                      </select>
                      <input x-show="newCommentContactType==='其他'" type="text" x-model="newCommentContactTypeCustom"
                             placeholder="輸入聯絡事項…"
                             style="width:140px;padding:5px 8px;font-size:12px;border:1px solid var(--border-light);border-radius:6px;font-family:var(--font-zh);outline:none;box-sizing:border-box">
                    </div>
                  </div>
                  <div style="font-size:10px;color:var(--text-dim);font-family:var(--font-zh);margin-top:4px">
                    日期改成非今天、或指定記錄對象時，這則更新也會記為工作日誌
                  </div>

                  <div class="feed-compose__foot">
                    <label x-show="!newCommentHours && !newCommentContactType"
                           style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-secondary);font-family:var(--font-zh);cursor:pointer;margin-right:auto">
                      <input type="checkbox" x-model="newCommentImportant" style="cursor:pointer">
                      標記為重要（會同步到 Google 行事曆）
                    </label>
                    <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-secondary);font-family:var(--font-zh);cursor:pointer">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
                      <span x-text="newCommentPhotos.length > 0 ? `已選 ${newCommentPhotos.length} 張照片` : '附加照片'"></span>
                      <input type="file" accept="image/*" multiple style="display:none" @change="onCommentPhotosSelected($event)">
                    </label>
                    <span x-show="postingComment" style="font-size:11px;color:var(--text-dim);font-family:var(--font-zh)">發送中…</span>
                    <button @click="postComment()" :disabled="!newComment.trim() || postingComment"
                            style="padding:5px 16px;font-size:12px;font-weight:600;border-radius:6px;border:none;cursor:pointer;font-family:var(--font-zh);transition:background .12s"
                            :style="newComment.trim() && !postingComment ? 'background:var(--accent);color:#fff' : 'background:#E5E7EB;color:#9CA3AF;cursor:not-allowed'">
                      發布更新
                    </button>
                  </div>
                </div>
                <!-- feed list -->
                <div class="feed-list">
                  <template x-if="updatesLoading">
                    <div class="feed-empty">載入中…</div>
                  </template>
                  <template x-if="!updatesLoading && caseUpdates.length === 0">
                    <div class="feed-empty">尚無任何動態，發布第一則更新吧！</div>
                  </template>
                  <template x-if="!updatesLoading && caseUpdates.length > 0 && filteredFeedItems().length === 0">
                    <div class="feed-empty">這天沒有動態紀錄</div>
                  </template>
                  <template x-for="item in filteredFeedItems()" :key="item.id">
                    <div class="feed-item">
                      <div class="feed-avatar" :style="`background:${_avatarColor(item.author || item.authorDisplay || '?')}`"
                           x-text="(item.authorDisplay || '?').slice(0,2)"></div>
                      <div class="feed-bubble" :class="item.source==='comment' ? 'feed-bubble--comment' : ''">
                        <div class="feed-bubble__head">
                          <span class="feed-bubble__author" x-text="item.authorDisplay"></span>
                          <template x-if="item.source !== 'comment'">
                            <span class="feed-badge" :class="'feed-badge--' + item.source"
                                  x-text="item.source==='work_log' ? '工作日誌' : item.source==='daily_task' ? '工作事項' : item.source==='dev_log' ? '業務開發記錄' : '案件狀態'"></span>
                          </template>
                          <template x-if="item.important">
                            <span class="feed-badge feed-badge--important">⭐ 重要</span>
                          </template>
                          <template x-if="item.source==='work_log'">
                            <span style="display:contents">
                              <span style="font-size:10px;color:var(--text-dim);font-family:LINE Seed TW_OTF, sans-serif" x-text="item.logDate"></span>
                              <span x-show="item.hours" class="feed-badge" style="background:#EFF6FF;color:#1D4ED8" x-text="item.hours + ' 小時'"></span>
                              <span x-show="item.contactType" class="feed-badge" style="background:#F5F3FF;color:#6D28D9" x-text="item.contactType"></span>
                            </span>
                          </template>
                          <template x-if="item.source==='daily_task'">
                            <span style="font-size:10px;color:var(--text-dim);font-family:var(--font-zh)" x-text="'完成：' + (item.taskTitle || '')"></span>
                          </template>
                          <template x-if="item.source==='dev_log'">
                            <span style="font-size:10px;color:var(--text-dim);font-family:var(--font-zh)" x-text="(item.channel || '') + (item.logDate ? '・' + item.logDate : '')"></span>
                          </template>
                          <span class="feed-bubble__time" x-text="fmtFeedTime(item.created_at)"></span>
                          <template x-if="item.canDelete">
                            <button class="feed-bubble__del" @click="deleteUpdate(item.id)" title="刪除">×</button>
                          </template>
                        </div>
                        <div class="feed-bubble__content" x-text="item.content"></div>
                        <template x-if="item.source==='work_log' && (item.photos||[]).length > 0">
                          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">
                            <template x-for="p in item.photos" :key="p.id">
                              <a :href="photoUrl(p.path)" target="_blank">
                                <img :src="photoUrl(p.path)" loading="lazy"
                                     style="width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--border-light)">
                              </a>
                            </template>
                          </div>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>
              </div><!-- /feed -->

            </div><!-- /cm-body -->

            <!-- ── 今日相關任務 mini strip ── -->
            <div style="border-top:1px solid var(--border-light);background:#fff;flex-shrink:0">
              <div @click="caseTasksOpen=!caseTasksOpen"
                   style="display:flex;align-items:center;gap:8px;padding:8px 16px;cursor:pointer;user-select:none">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:#7C3AED;flex-shrink:0"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                <span style="font-size:11px;font-weight:600;color:#7C3AED;font-family:var(--font-zh);flex:1">今日相關任務</span>
                <span x-show="caseTasks.length > 0"
                      style="font-size:10px;font-weight:700;background:#7C3AED;color:#fff;border-radius:10px;padding:1px 7px"
                      x-text="caseTasks.length"></span>
                <span x-show="caseTasksLoading" style="font-size:10px;color:var(--text-dim)">載入中…</span>
                <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                     :style="caseTasksOpen ? 'transform:rotate(90deg);transition:.15s' : 'transition:.15s'"
                     style="color:var(--text-dim)"><polyline points="9 18 15 12 9 6"/></svg>
              </div>
              <div x-show="caseTasksOpen" style="padding:0 16px 10px">
                <template x-if="!caseTasksLoading && caseTasks.length === 0">
                  <div style="font-size:11px;color:var(--text-dim);text-align:center;padding:6px 0">今日尚無掛載此案件的工作事項</div>
                </template>
                <template x-for="t in caseTasks" :key="t.id">
                  <div style="padding:6px 0;border-bottom:1px solid #F5F4F0">
                    <!-- Row 1: title + status + buttons -->
                    <div style="display:flex;align-items:center;gap:7px">
                      <span :style="`width:6px;height:6px;border-radius:50%;flex-shrink:0;background:${
                        t.priority==='緊急'?'#DC2626':t.priority==='重要'?'#D97706':'#2563EB'}`"></span>
                      <span style="font-size:12px;font-family:var(--font-zh);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="t.title"></span>
                      <span :style="`font-size:10px;padding:1px 5px;border-radius:4px;flex-shrink:0;${
                        _caseMyComp(t)?.completed?'background:#DCFCE7;color:#15803D':'background:#FEF3C7;color:#92400E'}`"
                            x-text="_caseMyComp(t)?.completed ? '已完成' : '待完成'"></span>
                      <!-- Submit / edit button (only if user is assignee) -->
                      <template x-if="(t.assigned_to||[]).includes(session.username)">
                        <button style="font-size:10px;padding:1px 7px;border-radius:4px;cursor:pointer;white-space:nowrap;border:1px solid;flex-shrink:0"
                                :style="_caseMyComp(t)?.completed
                                  ? 'border-color:#DDD6FE;background:#F5F3FF;color:#7C3AED'
                                  : 'border-color:#BBF7D0;background:#F0FDF4;color:#15803D'"
                                @click="_caseTaskStartEdit(t)"
                                x-text="_caseMyComp(t)?.completed ? '修改回報' : '提交回報'">
                        </button>
                      </template>
                      <!-- Edit log toggle -->
                      <button style="font-size:9px;padding:1px 5px;border-radius:3px;cursor:pointer;border:1px solid var(--border-light);background:#fff;color:var(--text-dim);flex-shrink:0"
                              @click="_caseTaskToggleLog(t.id)"
                              x-text="caseTaskLogsOpen[t.id] ? '收起記錄' : '查看記錄'">
                      </button>
                    </div>
                    <!-- Row 2: current user's report preview -->
                    <template x-if="_caseMyComp(t)?.report && caseTaskEditing.taskId !== t.id">
                      <div style="font-size:11px;color:var(--text-secondary);margin:4px 0 0 13px;padding:4px 6px;background:#F5F4F0;border-radius:4px;white-space:pre-wrap;line-height:1.5"
                           x-text="_caseMyComp(t)?.report"></div>
                    </template>
                    <!-- Row 3: inline edit form -->
                    <template x-if="caseTaskEditing.taskId === t.id">
                      <div style="margin-top:5px">
                        <textarea x-model="caseTaskEditing.text" rows="3"
                                  placeholder="請填寫工作完成情形、實際執行內容…"
                                  style="width:100%;padding:6px 8px;border:1px solid #7C3AED;border-radius:5px;font-size:11px;font-family:var(--font-zh);outline:none;resize:vertical;box-sizing:border-box;line-height:1.5"></textarea>
                        <div style="display:flex;gap:6px;margin-top:4px">
                          <button style="padding:3px 10px;font-size:10px;border-radius:4px;cursor:pointer;background:#15803D;color:#fff;border:1px solid #15803D;font-family:var(--font-zh)"
                                  @click="_caseTaskSubmitReport(t.id)"
                                  :disabled="caseTaskEditSubmitting || !caseTaskEditing.text.trim()"
                                  x-text="caseTaskEditSubmitting ? '送出中…' : '確認送出'">
                          </button>
                          <button style="padding:3px 10px;font-size:10px;border-radius:4px;cursor:pointer;background:#fff;color:var(--text-secondary);border:1px solid var(--border-light);font-family:var(--font-zh)"
                                  @click="caseTaskEditing={taskId:null,text:''}">取消</button>
                        </div>
                      </div>
                    </template>
                    <!-- Row 4: edit log -->
                    <template x-if="caseTaskLogsOpen[t.id]">
                      <div style="margin-top:4px;margin-left:13px">
                        <div x-show="!caseTaskEditLogs[t.id]" style="font-size:10px;color:var(--text-dim)">載入中…</div>
                        <template x-if="caseTaskEditLogs[t.id] && caseTaskEditLogs[t.id].length === 0">
                          <div style="font-size:10px;color:var(--text-dim)">尚無編輯記錄</div>
                        </template>
                        <template x-for="log in (caseTaskEditLogs[t.id] || [])" :key="log.id">
                          <div style="font-size:10px;padding:3px 6px;border-left:2px solid #DDD6FE;margin-bottom:3px;color:var(--text-secondary)">
                            <span style="font-weight:600" x-text="log.changedByDisplay"></span>
                            <span style="color:var(--text-dim);margin-left:4px" x-text="log.changedAt?.slice(0,16).replace('T',' ')"></span>
                            <template x-for="ch in (log.changes || [])" :key="ch.field">
                              <div style="margin-top:1px">
                                <span style="background:#F3F4F6;border-radius:2px;padding:0 3px;font-size:9px" x-text="ch.field"></span>
                                <span style="color:#DC2626;text-decoration:line-through;margin-left:3px" x-text="ch.old"></span>
                                <span style="color:var(--text-dim);margin:0 2px">→</span>
                                <span style="color:#15803D" x-text="ch.new"></span>
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </template>
                <template x-if="caseTasks.length > 0">
                  <a :href="`../pages/daily-tasks.html`"
                     style="display:block;text-align:right;font-size:10px;color:#7C3AED;margin-top:5px;text-decoration:none">
                    前往工作事項 →
                  </a>
                </template>
              </div>
            </div>

          </div>
        </template>

      </div><!-- /cm-detail -->
    </div><!-- /cm-layout -->
  </main>
</div>

<!-- ── 承攬商派發 Modal ── -->
<div x-show="showDispatchModal" x-cloak
     style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px"
     @click.self="showDispatchModal=false"
     @keydown.escape.window="showDispatchModal=false">
  <div style="background:#fff;border-radius:12px;width:100%;max-width:680px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(0,0,0,.22)">
    <!-- Header -->
    <div style="display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border-light);gap:10px">
      <span style="font-size:14px;font-weight:700;flex:1;font-family:var(--font-zh)"
            x-text="editDispatchId ? '編輯派發紀錄' : '新增承攬商派發'"></span>
      <button @click="showDispatchModal=false" style="width:28px;height:28px;border:none;background:#F0EEE9;border-radius:5px;cursor:pointer;font-size:16px">×</button>
    </div>
    <!-- Body -->
    <div style="flex:1;overflow-y:auto;padding:18px 20px">
      <!-- Basic info -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
        <div>
          <label style="font-size:11px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:4px">承攬商</label>
          <select x-model="dispatchForm.vendor_id"
                  style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;outline:none;box-sizing:border-box">
            <option value="">— 無承攬商（純外包名單人員點工）—</option>
            <template x-for="v in vendors" :key="v.id">
              <option :value="v.id" x-text="v.name + (v.contactName ? ' (' + v.contactName + ')' : '')"></option>
            </template>
          </select>
          <div style="font-size:11px;color:var(--text-dim);margin-top:4px">
            承攬商與外包名單人員至少需擇一，可只填外包人員（點工）不選承攬商
          </div>
          <div x-show="vendors.length===0" style="font-size:11px;color:var(--warning);margin-top:4px">
            尚無承攬商資料，如需派發給承攬商請先至
            <a href="vendor-contractors.html" style="color:var(--accent)">承攬商管理</a>
            新增。
          </div>
        </div>
        <div>
          <label style="font-size:11px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:4px">派發日期</label>
          <input type="date" x-model="dispatchForm.dispatch_date"
                 style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;outline:none;box-sizing:border-box">
        </div>
        <div>
          <label style="font-size:11px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:4px">狀態</label>
          <select x-model="dispatchForm.status"
                  style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;outline:none;box-sizing:border-box">
            <option value="draft">草稿</option>
            <option value="sent">已送出</option>
            <option value="confirmed">已確認</option>
            <option value="pending_acceptance">待驗收</option>
            <option value="accepted">已驗收</option>
            <option value="completed">完工</option>
            <option value="cancelled">已取消</option>
          </select>
        </div>
        <div>
          <label style="font-size:11px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:4px">工作範圍</label>
          <input type="text" x-model="dispatchForm.scope" placeholder="簡述承攬工項…"
                 style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;outline:none;box-sizing:border-box">
        </div>
        <div>
          <label style="font-size:11px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:4px">發票號碼</label>
          <input type="text" x-model="dispatchForm.invoice_no" placeholder="AB-12345678"
                 style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:'LINE Seed TW_OTF', monospace;outline:none;box-sizing:border-box">
        </div>
        <div>
          <label style="font-size:11px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:4px">應付款日期</label>
          <input type="date" x-model="dispatchForm.payable_date"
                 style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;outline:none;box-sizing:border-box">
        </div>
      </div>

      <!-- Items -->
      <div style="font-size:11px;font-weight:600;color:var(--text-dim);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border-light);padding-bottom:4px;margin-bottom:10px">承攬商報價品項</div>
      <table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:8px">
        <thead>
          <tr style="color:var(--text-dim);border-bottom:1px solid var(--border-light)">
            <th style="text-align:left;padding:4px 0;font-weight:500">品項說明</th>
            <th style="text-align:right;padding:4px 6px;font-weight:500;width:55px">數量</th>
            <th style="text-align:left;padding:4px 4px;font-weight:500;width:50px">單位</th>
            <th style="text-align:right;padding:4px 6px;font-weight:500;width:100px">單價 (NT$)</th>
            <th style="text-align:right;padding:4px 6px;font-weight:500;width:100px">金額 (NT$)</th>
            <th style="width:28px"></th>
          </tr>
        </thead>
        <tbody>
          <template x-for="(it, ii) in dispatchForm.items" :key="it.id">
            <tr style="border-bottom:1px solid #F5F4F0">
              <td style="padding:4px 0">
                <input type="text" x-model="it.description" placeholder="品項說明"
                       style="width:100%;padding:5px 8px;border:1px solid var(--border-light);border-radius:5px;font-size:12px;font-family:inherit;outline:none;box-sizing:border-box">
              </td>
              <td style="padding:4px 6px">
                <input type="number" x-model.number="it.qty" min="0.01" step="1"
                       @input="onDispatchItemPrice(ii)"
                       style="width:100%;padding:5px;border:1px solid var(--border-light);border-radius:5px;font-size:12px;font-family:LINE Seed TW_OTF, sans-serif;text-align:right;outline:none;box-sizing:border-box">
              </td>
              <td style="padding:4px 4px">
                <select x-model="it.unit"
                        style="width:100%;padding:5px 2px;border:1px solid var(--border-light);border-radius:5px;font-size:12px;font-family:inherit;outline:none;box-sizing:border-box;background:#fff;cursor:pointer">
                  <option>式</option>
                  <option>台</option>
                  <option>套</option>
                  <option>個</option>
                  <option>組</option>
                  <option>米</option>
                  <option>捲</option>
                  <option>箱</option>
                  <option>包</option>
                  <option>人月</option>
                  <option>人日</option>
                  <option>次</option>
                  <option>年</option>
                  <option>月</option>
                  <option>批</option>
                  <option>項</option>
                </select>
              </td>
              <td style="padding:4px 6px">
                <input type="number" x-model="it.unitPrice" min="0" step="1" placeholder="0"
                       @input="onDispatchItemPrice(ii)"
                       style="width:100%;padding:5px;border:1px solid var(--border-light);border-radius:5px;font-size:12px;font-family:LINE Seed TW_OTF, sans-serif;text-align:right;outline:none;box-sizing:border-box">
              </td>
              <td style="padding:4px 6px;text-align:right;font-weight:600;font-family:LINE Seed TW_OTF, sans-serif;color:var(--text-main)"
                  x-text="(it.amount || 0).toLocaleString()"></td>
              <td style="padding:4px 0;text-align:center">
                <button @click="removeDispatchItem(ii)"
                        style="width:22px;height:22px;border:none;background:none;cursor:pointer;color:var(--danger);font-size:14px;line-height:1">×</button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <button @click="addDispatchItem()"
                style="font-size:11px;padding:4px 12px;border:1px dashed var(--border);border-radius:5px;background:#fff;cursor:pointer;font-family:var(--font-zh)">
          ＋ 新增品項
        </button>
        <span style="flex:1"></span>
        <span style="font-size:12px;color:var(--text-secondary)">小計：</span>
        <span style="font-size:13px;font-weight:600;font-family:LINE Seed TW_OTF, sans-serif"
              x-text="'NT$ ' + _dispatchSubtotal().toLocaleString()"></span>
      </div>
      <div style="display:flex;align-items:center;justify-content:flex-end;gap:16px;padding:8px 0;border-top:1px solid var(--border-light)">
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary)">
          稅率：
          <select x-model="dispatchForm.tax_rate"
                  style="padding:3px 8px;border:1px solid var(--border-light);border-radius:5px;font-size:12px;background:#fff;font-family:inherit;outline:none">
            <option value="0">未稅（0%）</option>
            <option value="0.05">含稅（5%）</option>
          </select>
        </label>
        <span x-show="+(dispatchForm.tax_rate)>0" style="font-size:12px;color:var(--text-secondary)">
          稅額：NT$ <span x-text="_dispatchTaxAmount().toLocaleString()"></span>
        </span>
        <span style="font-size:13px;font-weight:600;font-family:LINE Seed TW_OTF, sans-serif;color:var(--text-secondary)">
          承攬商含稅合計：NT$ <span x-text="_dispatchTotalWithTax().toLocaleString()"></span>
        </span>
      </div>

      <!-- 外包名單人員 -->
      <div style="font-size:11px;font-weight:600;color:var(--text-dim);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border-light);padding-bottom:4px;margin-top:16px;margin-bottom:10px">外包名單人員（可複選，個別計費）</div>
      <div class="attendee-chips" style="margin-bottom:6px;display:block" x-show="(dispatchForm.personnel||[]).length">
        <table style="width:100%;border-collapse:collapse;font-size:12px">
          <template x-for="(p, pi) in dispatchForm.personnel" :key="p.id">
            <tr style="border-bottom:1px solid #F5F4F0">
              <td style="padding:5px 0;color:var(--text-primary)" x-text="p.name"></td>
              <td style="padding:5px 6px;width:130px">
                <div style="position:relative">
                  <span style="position:absolute;left:7px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--text-dim)">NT$</span>
                  <input type="number" x-model.number="p.amount" min="0" step="1"
                         style="width:100%;padding:5px 6px 5px 30px;border:1px solid var(--border-light);border-radius:5px;font-size:12px;font-family:LINE Seed TW_OTF, sans-serif;text-align:right;outline:none;box-sizing:border-box">
                </div>
              </td>
              <td style="padding:5px 6px">
                <input type="text" x-model="p.note" placeholder="備注（選填）"
                       style="width:100%;padding:5px 8px;border:1px solid var(--border-light);border-radius:5px;font-size:12px;font-family:inherit;outline:none;box-sizing:border-box">
              </td>
              <td style="width:24px;text-align:center">
                <button @click="removeDispatchPersonnel(pi)"
                        style="width:22px;height:22px;border:none;background:none;cursor:pointer;color:var(--danger);font-size:14px;line-height:1">×</button>
              </td>
            </tr>
          </template>
        </table>
      </div>
      <div class="attendee-add">
        <select class="attendee-select" x-model="_newDispatchPersonnelId">
          <option value="">選擇外包名單人員…</option>
          <template x-for="c in contractorRoster" :key="c.id">
            <option :value="c.id" x-text="c.name + (c.phone ? ' (' + c.phone + ')' : '')"></option>
          </template>
        </select>
        <button class="btn btn-ghost btn-sm" @click="addDispatchPersonnel()">加入</button>
      </div>
      <div x-show="contractorRoster.length===0" style="font-size:11px;color:var(--warning);margin-top:4px">
        尚無外包名單資料。
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:8px" x-show="(dispatchForm.personnel||[]).length">
        <span style="font-size:13px;font-weight:600;font-family:LINE Seed TW_OTF, sans-serif;color:var(--text-secondary)">
          外包人員小計：NT$ <span x-text="_dispatchPersonnelTotal().toLocaleString()"></span>
        </span>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:6px;padding-top:8px;border-top:1px solid var(--border-light)">
        <span style="font-size:14px;font-weight:700;font-family:LINE Seed TW_OTF, sans-serif;color:var(--accent)">
          派發總成本：NT$ <span x-text="_dispatchGrandTotal().toLocaleString()"></span>
        </span>
      </div>

      <!-- Notes -->
      <div style="margin-top:14px">
        <label style="font-size:11px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:4px">備注</label>
        <textarea x-model="dispatchForm.notes" rows="2" placeholder="合作條件、特殊備注…"
                  style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;outline:none;resize:vertical;box-sizing:border-box"></textarea>
      </div>
      <div x-show="dispatchMsg" style="color:var(--danger);font-size:12px;margin-top:8px" x-text="dispatchMsg"></div>
    </div>
    <!-- Footer -->
    <div style="padding:12px 20px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:10px">
      <button @click="showDispatchModal=false"
              style="padding:7px 16px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:var(--font-zh);background:#fff;cursor:pointer">取消</button>
      <button @click="saveDispatch()" :disabled="dispatchSaving"
              style="padding:7px 18px;border:none;border-radius:7px;font-size:13px;font-family:var(--font-zh);background:var(--accent);color:#fff;cursor:pointer;font-weight:600"
              x-text="dispatchSaving ? '儲存中…' : '儲存派發紀錄'"></button>
    </div>
  </div>
</div>

<!-- ── 收款沖銷 申請/駁回原因 Modal ── -->
<div x-show="writeoffModal.open" x-cloak
     style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px"
     @click.self="writeoffModal.open=false"
     @keydown.escape.window="writeoffModal.open=false">
  <div style="background:#fff;border-radius:12px;width:100%;max-width:420px;box-shadow:0 16px 48px rgba(0,0,0,.22)">
    <div style="display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border-light);gap:10px">
      <span style="font-size:14px;font-weight:700;flex:1;font-family:var(--font-zh)"
            x-text="writeoffModal.mode==='reject' ? '駁回沖銷申請' : '申請款項沖銷（稅額歸零）'"></span>
      <button @click="writeoffModal.open=false" style="width:28px;height:28px;border:none;background:#F0EEE9;border-radius:5px;cursor:pointer;font-size:16px">×</button>
    </div>
    <div style="padding:18px 20px">
      <div x-show="writeoffModal.mode==='request'" style="font-size:12px;color:var(--text-secondary);margin-bottom:10px;line-height:1.6">
        沖銷生效後，此筆收款不再計入應稅／應開發票金額，需經最高管理者核准才會生效。
      </div>
      <label style="font-size:11px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:4px" x-text="writeoffModal.mode==='reject' ? '駁回原因（必填）' : '沖銷原因（必填，例如：客戶為私人用戶，無需開立發票）'"></label>
      <textarea x-model="writeoffModal.reason" rows="3"
                style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;outline:none;box-sizing:border-box;resize:vertical"></textarea>
