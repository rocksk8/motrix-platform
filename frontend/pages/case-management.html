<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{if(localStorage.getItem('motrix_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../static/favicon.png">
  <title>案件管理 — MOTRIX 營運管理系統</title>
  <script src="../js/case-management.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.css">
  <link rel="stylesheet" href="../css/style.css?v=20260805g">
  <style>
    [x-cloak] { display: none !important; }

    .cm-layout { display:flex; height:calc(100vh - var(--topbar-h)); overflow:hidden; }

    /* ── Left panel ── */
    .cm-list { width:300px; min-width:300px; border-right:1px solid var(--border-light); display:flex; flex-direction:column; background:#FAFAF9; overflow:hidden; }
    .cm-list__head { padding:14px 14px 0; background:#fff; border-bottom:1px solid var(--border-light); }
    .cm-list__title-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .cm-list__title { font-size:13px; font-weight:700; color:var(--text-primary); font-family:var(--font-zh); }
    .cm-list__count { font-size:10px; font-family:LINE Seed TW_OTF, sans-serif; font-weight:600; background:#EEECEA; color:var(--text-secondary); padding:2px 8px; border-radius:10px; }
    .cm-list__search { position:relative; margin-bottom:10px; }
    .cm-list__search-icon { position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--text-dim); pointer-events:none; }
    .cm-list__search-input { width:100%; padding:7px 10px 7px 32px; font-size:12px; border:1px solid var(--border-light); border-radius:6px; font-family:var(--font-zh); background:#F9FAFB; outline:none; transition:border-color .12s; box-sizing:border-box; }
    .cm-list__search-input:focus { border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px rgba(37,99,235,.08); }
    .cm-list__tabs { display:flex; padding:0 2px; }
    .cm-list__tab { font-size:11px; font-family:var(--font-zh); padding:6px 12px; border:none; background:none; color:var(--text-dim); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; transition:all .1s; }
    .cm-list__tab.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
    .cm-list__body { flex:1; overflow-y:auto; padding:4px 0; }
    .cm-list__body::-webkit-scrollbar { width:4px; }
    .cm-list__body::-webkit-scrollbar-thumb { background:var(--border-light); border-radius:2px; }

    .cm-card { padding:11px 14px 11px 11px; border-bottom:1px solid #F0EFEB; cursor:pointer; transition:background .1s; border-left:3px solid transparent; }
    .cm-card:hover { background:#F5F4F0; }
    .cm-card.selected { background:#EEF2FF; border-left-color:var(--accent) !important; }
    .cm-card:has(.cm-card__tag--active) { border-left-color:#4ADE80; }
    .cm-card:has(.cm-card__tag--stage)  { border-left-color:#FCD34D; }
    .cm-card:has(.cm-card__tag--closed) { border-left-color:#C4B5FD; }
    .cm-card__head { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
    .cm-card__no { font-size:11px; font-family:LINE Seed TW_OTF, sans-serif; font-weight:700; color:var(--text-primary); letter-spacing:.02em; }
    .cm-card__tag { font-size:9px; padding:2px 6px; border-radius:4px; font-weight:600; font-family:var(--font-zh); }
    .cm-card__tag--active { background:#DCFCE7; color:#15803D; }
    .cm-card__tag--stage  { background:#FEF9C3; color:#B45309; }
    .cm-card__tag--closed { background:#F3F4F6; color:#374151; }
    .cm-card__customer { font-size:12px; color:var(--text-primary); font-family:var(--font-zh); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:5px; }
    .cm-card__sales { font-size:10px; color:var(--text-dim); font-family:var(--font-zh); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:5px; }
    .cm-card__footer { display:flex; align-items:center; justify-content:space-between; }
    .cm-card__amount { font-size:11px; font-family:LINE Seed TW_OTF, sans-serif; font-weight:600; color:var(--text-secondary); }
    .cm-card__date { font-size:10px; color:var(--text-dim); font-family:LINE Seed TW_OTF, sans-serif; }
    .cm-empty { padding:40px 20px; text-align:center; color:var(--text-dim); font-size:13px; font-family:var(--font-zh); display:flex; flex-direction:column; align-items:center; gap:6px; }
    .cm-empty__sub { font-size:11px; font-family:var(--font-zh); color:var(--text-dim); opacity:.65; }
    .cm-list__tab-badge { display:inline-flex; align-items:center; justify-content:center; min-width:16px; padding:0 4px; height:16px; background:#E5E7EB; color:#6B7280; font-size:9px; font-weight:700; font-family:LINE Seed TW_OTF, sans-serif; border-radius:8px; margin-left:3px; line-height:1; }
    .cm-list__tab.active .cm-list__tab-badge { background:var(--accent); color:#fff; }
    .cm-list__tab-badge.orange { background:#EA580C; color:#fff; }

    /* unread-activity bar */
    .cm-unread-bar {
      background:#FFFBEB; border-bottom:1px solid #FDE68A;
      padding:7px 14px; font-size:11px; color:#92400E;
      display:flex; align-items:center; gap:7px; cursor:pointer;
      font-family:var(--font-zh);
    }
    .cm-unread-bar:hover { background:#FEF3C7; }
    .cm-card__unread-tag {
      font-size:9px; font-weight:700; padding:1px 5px; border-radius:4px;
      background:#FEF3C7; color:#92400E; border:1px solid #FDE68A;
      display:inline-block; margin-bottom:3px;
    }

    /* ── Right panel ── */
    .cm-detail { flex:1; display:flex; flex-direction:column; overflow:hidden; background:#fff; }
    .cm-placeholder { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
    .cm-placeholder__text { font-size:13px; font-family:var(--font-zh); color:var(--text-dim); }
    .cm-placeholder__sub { font-size:11px; color:var(--text-dim); font-family:LINE Seed TW_OTF, sans-serif; }

    /* Header */
    .cm-header { background:#fff; border-bottom:1px solid var(--border-light); flex-shrink:0; }
    .cm-header__row1 { display:flex; align-items:center; gap:8px; padding:12px 20px 6px; flex-wrap:wrap; }
    .cm-header__row2 { padding:0 20px 6px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
    .cm-header__back { display:inline-flex; align-items:center; gap:3px; padding:3px 7px; border:1px solid var(--border-light); border-radius:5px; font-size:11px; color:var(--text-dim); text-decoration:none; background:#FAFAF9; transition:all .12s; flex-shrink:0; }
    .cm-header__back:hover { border-color:#9CA3AF; color:var(--text-secondary); }
    .cm-header__no { font-size:11px; font-weight:700; font-family:LINE Seed TW_OTF, sans-serif; color:var(--text-dim); letter-spacing:.04em; flex-shrink:0; }
    .cm-header__customer { font-size:17px; font-weight:700; font-family:var(--font-zh); color:var(--text-primary); line-height:1.3; }
    .cm-header__project-sub { font-size:12px; color:var(--text-dim); font-family:var(--font-zh); line-height:1.3; }
    .cm-header__spacer { flex:1; }
    .cm-header__actions { display:flex; align-items:center; gap:6px; flex-shrink:0; }
    .cm-header__save { display:flex; align-items:center; gap:5px; flex-shrink:0; }

    /* deal-tag badge inline */
    .deal-tag-badge { display:inline-flex; align-items:center; padding:3px 9px; border-radius:5px; font-size:11px; font-weight:600; font-family:var(--font-zh); white-space:nowrap; }
    .deal-tag-badge--active { background:#DCFCE7; color:#15803D; border:1px solid #86EFAC; }
    .deal-tag-badge--closed { background:#F5F3FF; color:#6D28D9; border:1px solid #C4B5FD; }
    .deal-tag-badge--stage  { background:#FEF9C3; color:#B45309; border:1px solid #FDE68A; }
    .cm-project-btn { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:5px; border:1px solid #C4B5FD; background:#F5F3FF; color:#7C3AED; font-size:11px; font-family:var(--font-zh); font-weight:500; cursor:pointer; transition:background .12s; flex-shrink:0; }
    .cm-project-btn:hover { background:#EDE9FE; }

    .tag-active { display:inline-flex; align-items:center; padding:3px 10px; border-radius:5px; font-size:11px; font-weight:600; font-family:var(--font-zh); background:#DCFCE7; color:#15803D; border:1px solid #86EFAC; }
    .tag-closed { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:5px; font-size:11px; font-weight:600; font-family:var(--font-zh); background:#F5F3FF; color:#6D28D9; border:1px solid #C4B5FD; }

    /* KPI pills */
    .cm-kpi { display:flex; align-items:center; gap:8px; padding:4px 20px 12px; flex-wrap:wrap; }
    .cm-kpi__pill { display:inline-flex; flex-direction:column; padding:6px 12px; background:#F9FAFB; border:1px solid var(--border-light); border-radius:8px; min-width:86px; }
    .cm-kpi__val { font-size:13px; font-weight:700; font-family:LINE Seed TW_OTF, sans-serif; color:var(--text-primary); line-height:1; }
    .cm-kpi__lbl { font-size:9px; color:var(--text-dim); font-family:LINE Seed TW_OTF, sans-serif; letter-spacing:.06em; text-transform:uppercase; margin-top:3px; }
    .cm-kpi__pill.success .cm-kpi__val { color:var(--success); }
    .cm-kpi__pill.accent  .cm-kpi__val { color:var(--accent); }
    .cm-kpi__pill.warning .cm-kpi__val { color:var(--warning); }
    .cm-kpi__pill.danger  .cm-kpi__val { color:var(--danger); }

    /* Meta */
    .cm-meta { display:flex; align-items:center; gap:16px; padding:0 20px 10px; font-size:11px; color:var(--text-dim); font-family:LINE Seed TW_OTF, sans-serif; flex-wrap:wrap; }
    .cm-meta__lbl { color:var(--text-dim); }
    .cm-meta__val { color:var(--text-secondary); font-weight:500; margin-left:4px; }

    /* Log */
    .cm-log { border-top:1px solid var(--border-light); background:#FAFAF8; padding:8px 20px 10px; font-size:11px; font-family:LINE Seed TW_OTF, sans-serif; }
    .cm-log__row { display:flex; align-items:center; gap:8px; padding:3px 0; border-bottom:1px solid #EEE; }
    .cm-log__row:last-child { border-bottom:none; }

    /* Tabs */
    .cm-tabs { display:flex; padding:0 20px; border-bottom:1px solid var(--border-light); background:#fff; flex-shrink:0; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .cm-tabs::-webkit-scrollbar { height:3px; }
    .cm-tabs::-webkit-scrollbar-thumb { background:var(--border-light); border-radius:2px; }
    .cm-tab { font-size:12px; font-family:var(--font-zh); padding:9px 14px; border:none; background:none; color:var(--text-dim); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; flex-shrink:0; transition:color .1s; }
    .cm-tab:hover { color:var(--text-primary); }
    .cm-tab.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }

    /* Tab body */
    .cm-body { flex:1; overflow-y:auto; padding:20px; background:#FAFAF9; }
    .cm-body::-webkit-scrollbar { width:4px; }
    .cm-body::-webkit-scrollbar-thumb { background:var(--border-light); border-radius:2px; }

    .cm-section-title { display:flex; align-items:center; gap:10px; font-size:11px; font-weight:700; font-family:LINE Seed TW_OTF, sans-serif; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; margin-bottom:14px; }
    .cm-section-title::after { content:''; flex:1; height:1px; background:var(--border-light); }
    .cm-subtabs { display:flex; margin:-20px -20px 0; padding:0 20px; background:#F7F6F3; border-bottom:1px solid var(--border-light); flex-shrink:0; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .cm-subtabs::-webkit-scrollbar { height:3px; }
    .cm-subtabs::-webkit-scrollbar-thumb { background:var(--border-light); border-radius:2px; }

    /* Progress */
    .prog { background:#EEECEA; border-radius:99px; height:6px; overflow:hidden; }
    .prog__fill { height:100%; border-radius:99px; transition:width .3s; }
    .prog__fill--blue { background:linear-gradient(90deg,var(--accent),#818CF8); }
    .prog__fill--green { background:linear-gradient(90deg,var(--success),#22C55E); }

    /* Stage cards */
    .stage-card { border:1px solid var(--border-light); border-radius:10px; margin-bottom:10px; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.04); overflow:hidden; transition:box-shadow .15s; }
    .stage-card:hover { box-shadow:0 2px 8px rgba(0,0,0,.08); }
    .stage-card--done { border-color:#86EFAC; }
    .stage-card__head { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid #F0EFEB; background:#FAFAF9; }
    .stage-card--done .stage-card__head { background:#F0FDF4; border-color:#BBF7D0; }
    .stage-card__body { padding:10px 12px; background:#fff; }
    .visit-row { display:grid; grid-template-columns:122px 50px 1fr 22px; gap:6px; align-items:start; margin-bottom:5px; }
    .stage-detail { padding:10px 12px; background:#FAFAF9; border-bottom:1px dashed #E5E7EB; }
    .stage-detail__row { margin-bottom:10px; }
    .stage-detail__row:last-child { margin-bottom:0; }
    .stage-detail__label { font-size:10px; color:var(--text-dim); font-family:LINE Seed TW_OTF, sans-serif; text-transform:uppercase; letter-spacing:.06em; margin-bottom:5px; display:block; }
    .stage-overdue-badge { font-size:10px; padding:2px 7px; border-radius:4px; font-weight:600; font-family:LINE Seed TW_OTF, sans-serif; background:#FEE2E2; color:#DC2626; flex-shrink:0; white-space:nowrap; }
    .stage-toggle-detail { background:none; border:none; cursor:pointer; color:var(--text-dim); padding:2px 4px; flex-shrink:0; font-size:11px; }
    .stage-toggle-detail:hover { color:var(--accent); }
    .stage-dep-list { display:flex; flex-wrap:wrap; gap:6px; }
    .stage-dep-item { display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border:1px solid var(--border-light); border-radius:20px; font-size:12px; font-family:var(--font-zh); cursor:pointer; background:#fff; color:var(--text-secondary); }
    .stage-dep-item.on { background:var(--accent-light); border-color:var(--accent); color:var(--accent); }
    .stage-dep-item input { margin:0; }
    .attendee-chips { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
    .attendee-chip { display:inline-flex; align-items:center; gap:4px; padding:3px 9px; background:#F0FDF4; color:#15803D; border-radius:20px; font-size:12px; font-family:var(--font-zh); border:1px solid #BBF7D0; }
    .attendee-chip .rm { background:none; border:none; cursor:pointer; color:#86EFAC; font-size:12px; padding:0; }
    .attendee-chip .rm:hover { color:#DC2626; }
    .attendee-add { display:flex; gap:6px; margin-top:6px; }
    .attendee-select { flex:1; padding:5px 8px; border:1px solid var(--border-light); border-radius:5px; font-size:12px; font-family:var(--font-zh); outline:none; }
    .attendee-select:focus { border-color:var(--accent); }
    .stage-view-btn { padding:6px 14px; border:1px solid var(--border-light); border-radius:6px; background:#fff; color:var(--text-secondary); font-size:12px; font-family:var(--font-zh); cursor:pointer; }
    .stage-view-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }
    #stage-gantt-chart .gantt .bar { fill:var(--accent); }
    #stage-gantt-chart .gantt .bar-progress { fill:#818CF8; }
    #stage-gantt-chart .gantt .bar-invalid { fill:transparent; stroke:#D1D5DB; stroke-dasharray:2,2; }
    #stage-gantt-chart .gantt-container { background:#fff; border:1px solid var(--border-light); border-radius:10px; }
    #stage-gantt-chart .gantt .grid-background { fill:#fff; }
    #stage-gantt-chart .gantt .grid-row { fill:#fff; }
    #stage-gantt-chart .gantt .grid-row:nth-child(even) { fill:#FAFAF9; }
    #stage-gantt-chart .gantt .grid-header { fill:#fff; stroke:#E5E7EB; }
    #stage-gantt-chart .gantt .row-line { stroke:#F0EFEB; }
    #stage-gantt-chart .gantt .tick { stroke:#E5E7EB; }
    #stage-gantt-chart .gantt .lower-text,
    #stage-gantt-chart .gantt .upper-text { fill:#6B7280; }
    #stage-gantt-chart .gantt .bar-label { fill:#fff; }
    #stage-gantt-chart .gantt .bar-label.big { fill:#374151; }
    #stage-gantt-chart .gantt .arrow { stroke:#9CA3AF; fill:none; }
    #stage-gantt-chart .gantt .today-highlight { fill:#FEF3C7; opacity:.4; }

    /* Payment */
    .pay-kpi-row { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:18px; }
    .pay-kpi { background:#fff; border:1px solid var(--border-light); border-radius:8px; padding:12px 14px; }
    .pay-kpi__lbl { font-size:10px; color:var(--text-dim); font-family:LINE Seed TW_OTF, sans-serif; text-transform:uppercase; letter-spacing:.06em; margin-bottom:5px; }
    .pay-kpi__val { font-size:16px; font-weight:700; font-family:LINE Seed TW_OTF, sans-serif; color:var(--text-primary); }
    .pay-kpi__val--success { color:var(--success); }
    .pay-kpi__val--danger { color:var(--danger); }
    .pay-item { border:1.5px solid var(--border-light); border-radius:10px; padding:12px 14px; margin-bottom:10px; background:#fff; transition:border-color .12s,background .12s; }
    .pay-item--received { background:#F0FDF4; border-color:#86EFAC; }

    /* Material */
    .mat-card { background:#fff; border:1px solid var(--border-light); border-radius:8px; margin-bottom:8px; overflow:hidden; }
    .mat-card__head { display:flex; align-items:center; gap:8px; padding:9px 12px; background:#FAFAF9; border-bottom:1px solid var(--border-light); }
    .mat-card__body { padding:8px 12px; }
    .mat-tag { font-size:10px; padding:2px 7px; border-radius:99px; font-family:LINE Seed TW_OTF, sans-serif; font-weight:600; flex-shrink:0; }
    .mat-tag--arrived { background:#DCFCE7; color:#15803D; }
    .mat-tag--ordered { background:#DBEAFE; color:#1D4ED8; }
    .mat-tag--pending { background:#FEF3C7; color:#92400E; }

    /* Device */
    .dev-card { background:#fff; border:1px solid var(--border-light); border-radius:8px; padding:12px 14px; margin-bottom:10px; transition:border-color .15s,box-shadow .15s; }
    .dev-card--dragging { opacity:.22; box-shadow:none !important; }
    .dev-card--insert-before { border-top:3px solid #2563EB !important; }
    .dev-card--group-target { border-color:#7C3AED !important; box-shadow:0 0 0 3px #EDE9FE !important; background:#F5F3FF; }
    .dev-drop-end-zone { border-radius:6px; margin:4px 2px 0; transition:background .12s,border .12s; min-height:4px; }
    .dev-drop-end-zone--active { background:rgba(37,99,235,.10); border:2px dashed #2563EB; min-height:18px; }
    .dev-row { display:flex; align-items:center; gap:8px; font-size:12px; font-family:LINE Seed TW_OTF, sans-serif; padding:3px 0; }
    .dev-row__lbl { color:var(--text-dim); width:38px; font-size:11px; flex-shrink:0; }
    .dev-group { margin-bottom:10px; border:1px solid #BFDBFE; border-radius:10px; overflow:hidden; transition:border-color .15s,box-shadow .15s; }
    .dev-group--drop-over { border-color:#2563EB !important; box-shadow:0 0 0 2px #BFDBFE; }
    .dev-group--drop-over .dev-group-header { background:#DBEAFE !important; }
    .dev-group-header { display:flex; align-items:center; gap:8px; padding:10px 14px; background:#EFF6FF; cursor:pointer; user-select:none; }
    .dev-group-header:hover { background:#DBEAFE; }
    .dev-group-header__title { font-size:13px; font-weight:700; color:#1D4ED8; flex:1; font-family:var(--font-zh); }
    .dev-group-header__badge { font-size:10px; font-weight:600; font-family:LINE Seed TW_OTF, sans-serif; padding:2px 7px; background:#DBEAFE; color:#1D4ED8; border-radius:4px; }
    .dev-group-body { padding:10px 12px; background:#fff; display:flex; flex-direction:column; gap:0; }
    .dev-group-body .dev-card { margin-bottom:8px; border-color:#E0EEFF; }
    .dev-group-body .dev-card:last-child { margin-bottom:0; }
    .dev-drag-handle { cursor:grab; color:var(--text-dim); flex-shrink:0; padding:2px 3px; border-radius:3px; display:flex; align-items:center; }
    .dev-drag-handle:hover { background:var(--bg-secondary); color:var(--text-secondary); }
    .dev-drag-handle:active { cursor:grabbing; }
    .btn-ungroup { padding:1px 7px; font-size:10px; border:1px solid #FCD34D; background:#FEF9C3; color:#854D0E; border-radius:4px; cursor:pointer; font-family:var(--font-zh); white-space:nowrap; flex-shrink:0; }
    .btn-ungroup:hover { background:#FEF08A; }

    /* Warranty */
    .w-badge { font-size:10px; padding:2px 7px; border-radius:99px; font-weight:600; font-family:LINE Seed TW_OTF, sans-serif; }
    .w-badge--active   { background:#DCFCE7; color:#15803D; }
    .w-badge--expiring { background:#FEF3C7; color:#92400E; }
    .w-badge--expired  { background:#FEE2E2; color:#DC2626; }

    /* Buttons */
    .btn-save { padding:7px 16px; background:var(--text-primary); color:var(--white); border:none; border-radius:7px; font-size:12px; font-weight:600; font-family:var(--font-zh); cursor:pointer; transition:opacity .15s; }
    .btn-save:hover { opacity:.85; }
    .btn-save:disabled { opacity:.4; cursor:default; }
    .btn-close-case { padding:5px 11px; background:#F5F3FF; color:#6D28D9; border:1px solid #C4B5FD; border-radius:6px; font-size:11px; font-weight:600; font-family:var(--font-zh); cursor:pointer; transition:all .12s; }
    .btn-close-case:hover { background:#EDE9FE; }
    .btn-add { display:inline-flex; align-items:center; gap:5px; padding:6px 12px; border:1px dashed var(--border-light); border-radius:6px; background:none; color:var(--text-dim); font-size:11px; font-family:var(--font-zh); cursor:pointer; transition:all .12s; }
    .btn-add:hover { border-color:#9CA3AF; color:var(--text-secondary); }
    .btn-del { padding:2px 6px; border:none; background:none; color:#D1D5DB; font-size:14px; cursor:pointer; border-radius:4px; line-height:1; }
    .btn-del:hover { background:#FEE2E2; color:var(--danger); }
    .btn-del:disabled { opacity:.25; cursor:default; }

    /* Save indicator */
    .save-dot { width:7px; height:7px; border-radius:50%; background:#D1D5DB; flex-shrink:0; transition:background .2s; }
    .save-dot.dirty { background:var(--warning); }
    .save-dot.saved { background:var(--success); }
    .save-dot.error { background:var(--danger); }
    .save-label { font-size:11px; font-family:LINE Seed TW_OTF, sans-serif; color:var(--text-dim); }
    .save-label.dirty { color:var(--warning); }
    .save-label.saved { color:var(--success); }
    .save-label.error { color:var(--danger); }

    /* Field inputs */
    .fi { width:100%; padding:6px 10px; font-size:12px; border:1px solid var(--border-light); border-radius:6px; font-family:var(--font-zh); background:#fff; outline:none; transition:border-color .12s; box-sizing:border-box; }
    .fi:focus { border-color:#9CA3AF; }
    .fi--sm { padding:4px 7px; font-size:11px; }
    .fi--mono { font-family:'Courier New',monospace; }
    .fi-label { font-size:10px; color:var(--text-dim); font-family:LINE Seed TW_OTF, sans-serif; margin-bottom:3px; display:block; }
    .fi-group { margin-bottom:12px; }
  
  /* ── 動態 Tab ── */
  .feed-wrap { display:flex; flex-direction:column; height:100%; overflow:hidden; }
  .feed-compose { padding:14px 20px; border-bottom:1px solid var(--border-light); flex-shrink:0; }
  .feed-compose__box { width:100%; padding:8px 10px; font-size:13px; font-family:var(--font-zh); border:1px solid var(--border-light); border-radius:8px; resize:vertical; min-height:60px; outline:none; background:#FAFAF9; line-height:1.6; transition:border-color .12s; box-sizing:border-box; }
  .feed-compose__box:focus { border-color:var(--accent); background:#fff; }
  .feed-compose__foot { display:flex; align-items:center; justify-content:flex-end; margin-top:6px; gap:8px; }
  .feed-list { flex:1; overflow-y:auto; padding:12px 20px; display:flex; flex-direction:column; gap:10px; }
  .feed-list::-webkit-scrollbar { width:4px; }
  .feed-list::-webkit-scrollbar-thumb { background:var(--border-light); border-radius:2px; }
  .feed-item { display:flex; gap:10px; }
  .feed-avatar { width:30px; height:30px; min-width:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; font-family:LINE Seed TW_OTF, sans-serif; flex-shrink:0; margin-top:1px; }
  .feed-avatar--comment { background:#EEF2FF; color:var(--accent); }
  .feed-avatar--work_log { background:#FEF9C3; color:#B45309; }
  .feed-avatar--daily_task { background:#DCFCE7; color:#15803D; }
  .feed-avatar--dev_log { background:#EFF6FF; color:#1D4ED8; }
  .feed-avatar--dev_case_status { background:#F3E8FF; color:#7C3AED; }
  .feed-bubble { flex:1; background:#F9FAFB; border:1px solid var(--border-light); border-radius:8px; padding:10px 12px; }
  .feed-bubble--comment { background:#fff; border-color:#E0E7FF; }
  .feed-bubble__head { display:flex; align-items:center; gap:6px; margin-bottom:5px; flex-wrap:wrap; }
  .feed-bubble__author { font-size:12px; font-weight:700; color:var(--text-primary); font-family:var(--font-zh); }
  .feed-bubble__time { font-size:10px; color:var(--text-dim); font-family:LINE Seed TW_OTF, sans-serif; }
  .feed-badge { font-size:9px; font-weight:600; padding:1px 6px; border-radius:4px; font-family:var(--font-zh); }
  .feed-badge--work_log { background:#FEF9C3; color:#B45309; }
  .feed-badge--daily_task { background:#DCFCE7; color:#15803D; }
  .feed-badge--dev_log { background:#EFF6FF; color:#1D4ED8; }
  .feed-badge--dev_case_status { background:#F3E8FF; color:#7C3AED; }
  .feed-bubble__content { font-size:13px; color:var(--text-primary); font-family:var(--font-zh); line-height:1.65; white-space:pre-wrap; word-break:break-word; }
  .feed-bubble__del { margin-left:auto; background:none; border:none; cursor:pointer; color:var(--text-dim); padding:0 4px; font-size:13px; line-height:1; border-radius:3px; }
  .feed-bubble__del:hover { color:var(--danger); background:#FEF2F2; }
  .feed-empty { text-align:center; color:var(--text-dim); font-size:13px; font-family:var(--font-zh); padding:40px 20px; }

  /* -- Mobile RWD -- */
  .mob-back-cm { display:none; }
  @media (max-width:767px) {
    .cm-layout { flex-direction:column; height:auto; min-height:calc(100vh - var(--topbar-h)); overflow:visible; }
    .cm-list { width:100%; min-width:0; max-height:44vh; border-right:none; border-bottom:1px solid var(--border-light); }
    .cm-detail { min-height:54vh; }
    .cm-list.mob-hidden  { display:none !important; }
    .cm-detail.mob-hidden { display:none !important; }
    .mob-back-cm { display:inline-flex !important; }
  }
  </style>
</head>

<body x-data="app()" x-init="init()" x-cloak>

  <header id="app-topbar" class="topbar"></header>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="app-shell">

  <aside class="sidebar" id="app-sidebar"></aside>

  <main class="main" style="padding:0;overflow:hidden">
    <div class="cm-layout">

      <!-- ── 左側：案件列表 ── -->
      <div class="cm-list" :class="{'mob-hidden': selected && isMobileView}">
        <div class="cm-list__head">
          <div class="cm-list__title-row">
            <span class="cm-list__title">案件管理</span>
            <span class="cm-list__count" x-text="filteredCases.length + ' 件'"></span>
          </div>
          <div class="cm-list__search">
            <svg class="cm-list__search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input class="cm-list__search-input" type="text" placeholder="搜尋單號或客戶..."
                   x-model="search" @input="filterCases()">
          </div>
          <div class="cm-list__tabs">
            <button class="cm-list__tab" :class="{active: listTab==='all'}" @click="listTab='all'; filterCases()">
              全部
              <span class="cm-list__tab-badge" x-show="cases.filter(c=>c.deal_tag!=='已結案').length" x-text="cases.filter(c=>c.deal_tag!=='已結案').length"></span>
            </button>
            <button class="cm-list__tab" :class="{active: listTab==='已成案'}" @click="listTab='已成案'; filterCases()">
              已成案
              <span class="cm-list__tab-badge" x-show="cases.filter(c=>c.deal_tag==='已成案').length" x-text="cases.filter(c=>c.deal_tag==='已成案').length"></span>
            </button>
            <button class="cm-list__tab" :class="{active: listTab==='已結案'}" @click="listTab='已結案'; filterCases()">
              已結案
              <span class="cm-list__tab-badge" x-show="cases.filter(c=>c.deal_tag==='已結案').length" x-text="cases.filter(c=>c.deal_tag==='已結案').length"></span>
            </button>
            <button class="cm-list__tab" :class="{active: listTab==='待精算'}" @click="listTab='待精算'; filterCases()">
              待精算
              <span class="cm-list__tab-badge orange" x-show="cases.filter(c=>c.settle_status==='draft').length" x-text="cases.filter(c=>c.settle_status==='draft').length"></span>
            </button>
          </div>
        </div>

        <div class="cm-unread-bar" x-show="unreadCount() > 0" @click="unreadOnly = !unreadOnly; filterCases()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
          <span x-text="unreadCount() + ' 筆案件有新動態'"></span>
          <span style="text-decoration:underline" x-text="unreadOnly ? '顯示全部 →' : '只看有新動態 →'"></span>
          <button class="btn-add" style="margin-left:auto;padding:2px 10px;font-size:10px;border-style:solid" @click.stop="markAllRead()">一鍵已讀</button>
        </div>

        <div class="cm-list__body">
          <template x-if="loading">
            <div class="cm-empty">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:.3"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
              載入中...
            </div>
          </template>
          <template x-if="!loading && filteredCases.length === 0">
            <div class="cm-empty">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" style="opacity:.2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>
              <span>沒有符合的案件</span>
              <span class="cm-empty__sub" x-text="search ? '嘗試調整搜尋關鍵字' : (listTab !== 'all' ? '切換至「全部」查看所有案件' : '')"></span>
            </div>
          </template>
          <template x-for="c in filteredCases" :key="c.quote_no">
            <div class="cm-card" :class="{selected: selected && selected.quote_no === c.quote_no}"
                 :style="isUnread(c) ? 'border-left-color:#D97706' : ''"
                 @click="selectCase(c.quote_no)">
              <div class="cm-card__head">
                <span class="cm-card__no" x-text="c.quote_no"></span>
                <span class="cm-card__tag"
                      :class="c.deal_tag==='已結案' ? 'cm-card__tag--closed' : (c.deal_tag==='已成案' && c.current_stage ? 'cm-card__tag--stage' : 'cm-card__tag--active')"
                      x-text="c.deal_tag==='已成案' && c.current_stage ? '待 ' + c.current_stage : c.deal_tag"></span>
              </div>
              <template x-if="isUnread(c)">
                <span class="cm-card__unread-tag">有新動態</span>
              </template>
              <div class="cm-card__customer" x-text="c.customer_name || '(未填客戶)'"></div>
              <div class="cm-card__sales" x-show="c.sales_person" x-text="'業務：' + c.sales_person"></div>
              <div class="cm-card__footer">
                <span class="cm-card__amount" x-text="'NT$ ' + (c.total||0).toLocaleString()"></span>
                <span class="cm-card__date" x-text="(c.quote_date || c.created_at || '').slice(0,10)"></span>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- ── 右側：案件詳情 ── -->
      <div class="cm-detail" :class="{'mob-hidden': !selected && isMobileView}">

        <!-- Placeholder -->
        <template x-if="!selected">
          <div class="cm-placeholder">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="opacity:.15"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>
            <div class="cm-placeholder__text">從左側選擇案件開始作業</div>
            <div class="cm-placeholder__sub" x-text="'目前共 ' + cases.length + ' 件已成案 / 已結案'"></div>
          </div>
        </template>

        <!-- Detail panel -->
        <template x-if="selected">
          <div style="display:flex;flex-direction:column;height:100%;overflow:hidden">

            <!-- Header -->
            <div class="cm-header">
              <!-- Row 1: quote_no · status badge · spacer · project btn · save · close btn -->
              <div class="cm-header__row1">
                <button class="mob-back-cm" @click="selected=null">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>列表
                </button>

                <a :href="'quotation-form.html?id=' + selected.quote_no" class="cm-header__back" title="開啟原始報價單">
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M10 14L21 3M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/></svg>
                  報價單
                </a>

                <span class="cm-header__no" x-text="selected.quote_no"></span>

                <!-- deal_tag / stage badge -->
                <template x-if="cr.dealTag === '已成案'">
                  <span class="deal-tag-badge"
                        :class="(cr.caseRecord?.stages||[]).find(s => !s.done) ? 'deal-tag-badge--stage' : 'deal-tag-badge--active'"
                        x-text="(cr.caseRecord?.stages||[]).find(s => !s.done) ? '待 ' + (cr.caseRecord?.stages||[]).find(s => !s.done)?.label : '已成案'">
                  </span>
                </template>
                <template x-if="cr.dealTag === '已結案'">
                  <span class="deal-tag-badge deal-tag-badge--closed">
                    <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-right:3px"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                    已結案
                  </span>
                </template>

                <div class="cm-header__spacer"></div>

                <!-- Project button -->
                <button class="cm-project-btn"
                  x-show="['superadmin','admin','engineer'].includes(session.role)||(session.modules||[]).some(m=>m.startsWith('project_'))"
                  @click="goToProject()"
                  :title="linkedProjectId ? '前往關聯專案' : (canManageProject() ? '建立並前往專案管理' : '前往專案管理')">
                  <svg viewBox="0 0 20 20" fill="currentColor" style="width:12px;height:12px;"><path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"/></svg>
                  <span x-text="linkedProjectId ? '前往專案' : (canManageProject() ? '建立專案' : '專案管理')"></span>
                </button>

                <!-- Save indicator -->
                <div class="cm-header__save">
                  <div class="save-dot" :class="saveStatus"></div>
                  <span class="save-label" :class="saveStatus" x-text="saveMsg"></span>
                </div>

                <!-- Complete case button (已成案 only) -->
                <template x-if="cr.dealTag === '已成案'">
                  <button class="btn-close-case" @click="closeCaseAction()">完結案</button>
                </template>

                <button class="btn-save" @click="saveCaseRecord()" :disabled="saving">
                  <span x-show="!saving">儲存</span>
                  <span x-show="saving">儲存中...</span>
                </button>
              </div><!-- /row1 -->

              <!-- Row 2: customer name + project sub -->
              <div class="cm-header__row2">
                <span class="cm-header__customer" x-text="selected.customer_name || '(未填客戶)'"></span>
                <span class="cm-header__project-sub"
                      x-show="selected.project_name && selected.project_name !== selected.customer_name"
                      x-text="selected.project_name"></span>
              </div>

              <!-- Row 3: KPI pills -->
              <div class="cm-kpi">
                <div class="cm-kpi__pill" x-show="canSeeFinancial()">
                  <span class="cm-kpi__val" x-text="'NT$ ' + (totalWithTax()||0).toLocaleString()"></span>
                  <span class="cm-kpi__lbl">合約金額</span>
                </div>
                <div class="cm-kpi__pill" :class="receivedPct()===100 ? 'success' : receivedPct()>0 ? 'accent' : ''" x-show="canSeeFinancial()">
                  <span class="cm-kpi__val" x-text="'NT$ ' + receivedTotal().toLocaleString()"></span>
                  <span class="cm-kpi__lbl">已收款（<span x-text="receivedPct()"></span>%）</span>
                </div>
                <div class="cm-kpi__pill" :class="outstandingTotal()>0 ? 'danger' : 'success'" x-show="canSeeFinancial()">
                  <span class="cm-kpi__val" x-text="'NT$ ' + outstandingTotal().toLocaleString()"></span>
                  <span class="cm-kpi__lbl">未收款</span>
                </div>
                <div class="cm-kpi__pill" :class="caseProgressPct()===100 ? 'success' : caseProgressPct()>0 ? 'accent' : ''">
                  <span class="cm-kpi__val" x-text="caseProgressPct() + '%'"></span>
                  <span class="cm-kpi__lbl">執行進度</span>
                </div>
              </div>

              <!-- Row 3: meta + log toggle -->
              <div class="cm-meta">
                <span><span class="cm-meta__lbl">報價日期</span><span class="cm-meta__val" x-text="(selected.quote_date||selected.created_at||'').slice(0,10)||'—'"></span></span>
                <span><span class="cm-meta__lbl">負責業務</span><span class="cm-meta__val" x-text="selected.sales_person||'—'"></span></span>
                <span><span class="cm-meta__lbl">施工階段</span><span class="cm-meta__val"
                      x-text="(cr.caseRecord?.stages||[]).filter(s=>s.done).length + ' / ' + (cr.caseRecord?.stages||[]).length + ' 完成'"></span></span>
                <button @click="showLog=!showLog"
                        style="margin-left:auto;font-size:10px;font-family:LINE Seed TW_OTF, sans-serif;background:none;border:none;cursor:pointer;color:var(--text-dim);padding:0;text-decoration:underline;flex-shrink:0"
                        x-text="showLog ? '收起操作紀錄' : '操作紀錄 ▸'"></button>
              </div>

              <!-- Collapsible log -->
              <template x-if="showLog">
                <div class="cm-log">
                  <template x-if="!(selected.data?.statusLog?.length)">
                    <span style="color:var(--text-dim);font-size:11px">尚無操作紀錄</span>
                  </template>
                  <template x-for="(log, li) in (selected.data?.statusLog || []).slice().reverse()" :key="li">
                    <div class="cm-log__row">
                      <span style="color:var(--text-dim);min-width:110px;flex-shrink:0" x-text="(log.at||'').slice(0,16).replace('T',' ')"></span>
                      <span style="color:var(--text-secondary);min-width:52px" x-text="log.user||'—'"></span>
                      <span style="color:var(--text-dim)" x-text="(log.from||'—') + ' →'"></span>
                      <span style="font-weight:600;color:var(--text-primary)" x-text="log.to||'—'"></span>
                    </div>
                  </template>
                </div>
              </template>
            </div>

            <!-- Tabs -->
            <div class="cm-tabs">
              <button class="cm-tab" :class="{active: activeTab==='biz'}"      @click="activeTab='biz'">案件資訊</button>
              <button class="cm-tab" :class="{active: activeTab==='exec'}"     @click="activeTab='exec'">執行管理</button>
              <button class="cm-tab" :class="{active: activeTab==='dispatch'}" @click="activeTab='dispatch'">承攬商</button>
              <button class="cm-tab" :class="{active: activeTab==='shipping'}" @click="activeTab='shipping'; loadShippingNotes(selected.quote_no)">出貨單</button>
              <button class="cm-tab" :class="{active: activeTab==='feed'}" @click="activeTab='feed'; loadCaseUpdates(selected.quote_no)">動態</button>
              <button class="cm-tab" x-show="canSeeFinancial()" :class="{active: activeTab==='fin'}" @click="activeTab='fin'">財務</button>
            </div>

            <!-- Tab content -->
            <div class="cm-body">

              <!-- ══ 案件資訊 Tab ══ -->
              <div x-show="activeTab==='biz'">

                <div class="cm-section-title">合約資訊</div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
                  <div class="fi-group">
                    <label class="fi-label">交貨 / 安裝地址</label>
                    <input class="fi" type="text" placeholder="地址" x-model="cr.caseRecord.contract.deliveryAddress" @input="setDirty()">
                  </div>
                  <div class="fi-group">
                    <label class="fi-label">交貨條件</label>
                    <input class="fi" type="text" placeholder="交期、運費、安裝條件..." x-model="cr.caseRecord.contract.deliveryTerms" @input="setDirty()">
                  </div>
                  <div class="fi-group">
                    <label class="fi-label">現場聯絡人</label>
                    <input class="fi" type="text" placeholder="姓名" x-model="cr.caseRecord.contract.contactPerson" @input="setDirty()">
                  </div>
                  <div class="fi-group">
                    <label class="fi-label">聯絡電話</label>
                    <input class="fi" type="text" placeholder="電話" x-model="cr.caseRecord.contract.contactPhone" @input="setDirty()">
                  </div>
                </div>
                <div class="fi-group" style="margin-bottom:18px">
                  <label class="fi-label">合約備注</label>
                  <textarea class="fi" rows="2" placeholder="合約特殊條款、注意事項..." x-model="cr.caseRecord.contract.contractNote" @input="setDirty()" style="resize:vertical;line-height:1.6"></textarea>
                </div>

                <div class="cm-section-title">人員角色</div>
                <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px">
                  <div class="fi-group">
                    <label class="fi-label">填單人</label>
                    <select class="fi" x-model="cr.caseRecord.roles.filler" @change="setDirty()">
                      <option value="">— 選擇 —</option>
                      <template x-for="u in selectableUsers" :key="u.username">
                        <option :value="u.display_name" x-text="u.display_name"></option>

                        </div>

                      <button class="btn-del" @click="removePaymentItem(idx)" style="flex-shrink:0"

                    </div>

                    <div style="display:grid;grid-template-columns:136px 140px 1fr;gap:8px">

                            </span>
                          </span>

                          <span style="font-size:10px;color:var(--text-dim)" x-text="'沖銷申請已駁回：' + (item.writeOffRejectReason||'')"></span>

                    </template>
                  </div>

                      <div class="visit-row" style="font-size:10px;color:var(--text-dim);font-family:LINE Seed TW_OTF, sans-serif;padding-bottom:5px;border-bottom:1px solid #F0EFEB;margin-bottom:6px;align-items:center">

                        <span style="text-align:center">人次</span>
                        <span>工作內容 / 備注</span>
                        <span></span>
                      </div>

                      <template x-for="(v, vi) in (st.visits || [])" :key="v.id">
                        <div class="visit-row">
                          <input type="date" x-model="v.visitDate" @change="setDirty()" class="fi fi--sm">
                          <input type="number" min="1" max="99" x-model.number="v.visitPeople" @input="setDirty()"
                                 placeholder="人" class="fi fi--sm" style="text-align:center;font-family:LINE Seed TW_OTF, sans-serif">
                          <textarea x-model="v.note" @input="setDirty()"
                                    placeholder="工作內容、施工項目、備注..." class="fi fi--sm" rows="1"
                                    style="resize:vertical;line-height:1.5;min-height:30px"></textarea>
                          <button class="btn-del" @click="removeVisit(idx, vi)" style="margin-top:2px">×</button>
                        </div>
                      </template>

                      <template x-if="(st.visits || []).length >= 2">
                        <div style="display:flex;gap:12px;padding:5px 0 2px;border-top:1px dashed #E5E7EB;margin-top:4px">
                          <span style="font-size:10px;color:var(--text-dim);font-family:LINE Seed TW_OTF, sans-serif">合計</span>
                          <span style="font-size:11px;font-weight:700;font-family:LINE Seed TW_OTF, sans-serif;color:var(--text-primary)" x-text="stageTotalVisits(st) + ' 次出勤'"></span>
                          <span style="font-size:11px;font-weight:700;font-family:LINE Seed TW_OTF, sans-serif;color:var(--accent)" x-text="stageTotalPeople(st) + ' 人次'"></span>
                        </div>
                      </template>

                      <button class="btn-add" style="margin-top:6px" @click="addVisit(idx)">
                        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 4v16m8-8H4"/></svg>
                        新增記錄
                      </button>
                    </div>
                  </div>
                </template>

                <button class="btn-add" @click="addStage()">
                  <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 4v16m8-8H4"/></svg>
                  新增階段
                </button>
                </div>
              </div>

              <!-- ── 叫料管控 ── -->
              <div x-show="execSubTab==='materials'">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
                  <span class="cm-section-title" style="margin-bottom:0">叫料清單</span>
                  <div style="display:flex;gap:8px">
                    <button class="btn-add" @click="openImportModal('materials')" style="padding:5px 10px">
                      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                      從報價單匯入
                    </button>
                    <template x-if="(cr.caseRecord?.materials||[]).some(m=>m.arrived)">
                      <button class="btn-add" @click="syncMaterialsToDevices()" style="padding:5px 10px;background:#EEF2FF;border-color:#C7D2FE;color:#4338CA">
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 4v5h5M20 20v-5h-5M4 9a9 9 0 0114.5-5.5M20 15a9 9 0 01-14.5 5.5"/></svg>
                        同步至設備登錄
                      </button>
                    </template>
                  </div>
                </div>


                <template x-for="(mat, idx) in (cr.caseRecord?.materials || [])" :key="mat.id">
                  <div class="mat-card">
                    <div class="mat-card__head">
                      <input class="fi" type="text" placeholder="品名" x-model="mat.name" @input="setDirty()" style="flex:1;min-width:0">
                      <input class="fi" type="text" placeholder="廠牌/型號" x-model="mat.model" @input="setDirty()" style="width:110px;font-size:11px;flex-shrink:0">
                      <input class="fi" type="number" placeholder="數量" x-model.number="mat.qty" min="1" @input="setDirty()" style="width:52px;flex-shrink:0">
                      <input class="fi" type="text" placeholder="單位" x-model="mat.unit" @input="setDirty()" style="width:44px;font-size:12px;flex-shrink:0">
                      <span class="mat-tag" :class="mat.arrived ? 'mat-tag--arrived' : mat.ordered ? 'mat-tag--ordered' : 'mat-tag--pending'"
                            x-text="mat.arrived ? '到料' : mat.ordered ? '叫料中' : '待叫料'"></span>
                      <button class="btn-del" @click="removeMaterial(idx)">×</button>
                    </div>
                    <div class="mat-card__body">
                      <div style="display:flex;gap:16px;margin-bottom:6px">
                        <label style="display:flex;align-items:center;gap:5px;font-size:12px;font-family:var(--font-zh);cursor:pointer">
                          <input type="checkbox" x-model="mat.ordered" @change="setDirty()">已叫料
                        </label>
                        <label style="display:flex;align-items:center;gap:5px;font-size:12px;font-family:var(--font-zh);cursor:pointer">
                          <input type="checkbox" x-model="mat.arrived" @change="onMaterialArrived(mat)">已到料
                        </label>
                        <template x-if="mat.arrived">
                          <span style="font-size:11px;color:var(--text-dim);font-family:LINE Seed TW_OTF, sans-serif;margin-left:auto" x-text="'共 ' + (mat.qty||1) + ' ' + (mat.unit||'台')"></span>
                        </template>
                      </div>
                      <!-- 廠商交期追蹤（叫料中且未到料時顯示） -->
                      <div x-show="mat.ordered && !mat.arrived"
                           style="display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap">
                        <input class="fi fi--sm" type="text" placeholder="廠商名稱"
                               x-model="mat.supplier" @input="setDirty()"
                               style="width:100px;font-size:12px">
                        <input class="fi fi--sm" type="date"
                               x-model="mat.expectedDate" @input="setDirty()"
                               title="預計到料日" style="flex:1;min-width:120px;font-size:12px">
                        <span x-show="mat.ordered && !mat.arrived && mat.expectedDate && mat.expectedDate < new Date().toISOString().slice(0,10)"
                              style="font-size:10px;font-weight:700;color:#DC2626;background:#FEF2F2;border:1px solid #FECACA;border-radius:4px;padding:2px 6px;white-space:nowrap;flex-shrink:0">交期逾期</span>
                      </div>

                      <template x-if="mat.arrived">
                        <div style="border-top:1px solid var(--border-light);padding-top:8px;margin-top:2px">
                          <div style="font-size:10px;font-family:LINE Seed TW_OTF, sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim);font-weight:600;margin-bottom:6px">設備序號 / MAC</div>
                          <template x-for="(md, mi) in (mat.devices || [])" :key="md.id">
                            <div style="display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:center;margin-bottom:4px">
                              <span style="font-size:11px;color:var(--text-dim);font-family:LINE Seed TW_OTF, sans-serif;min-width:18px" x-text="'#'+(mi+1)"></span>
                              <input class="fi fi--sm fi--mono" type="text" placeholder="SN 序號" x-model="md.sn" @input="autoSyncDevice(mat, mi)">
                              <input class="fi fi--sm fi--mono" type="text" placeholder="MAC 位址" x-model="md.mac" @input="autoSyncDevice(mat, mi)">
                            </div>
                          </template>
                        </div>
                      </template>
                      <input class="fi fi--sm" type="text" placeholder="備注" x-model="mat.note" @input="setDirty()" style="width:100%;margin-top:6px">
                    </div>
                  </div>
                </template>

                <button class="btn-add" @click="addMaterial()">
                  <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 4v16m8-8H4"/></svg>
                  新增品項
                </button>
              </div>

              <!-- ── 設備登錄 ── -->
              <div x-show="execSubTab==='devices'">
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">
                  <span class="cm-section-title" style="margin-bottom:0">設備 SN / MAC 記錄</span>
                  <template x-if="(cr.caseRecord?.devices||[]).length > 0">
                    <div style="display:flex;align-items:center;gap:6px;padding:6px 10px;background:#EEF2FF;border:1px solid #C7D2FE;border-radius:7px;flex-wrap:wrap">
                      <span style="font-size:11px;font-weight:600;color:#4338CA;font-family:var(--font-zh);white-space:nowrap">一鍵同步保固</span>
                      <input type="date" x-model="_syncWarrantyDate" class="fi fi--sm" style="width:138px;flex-shrink:0">
                      <select x-model.number="_syncWarrantyMonths" class="fi fi--sm" style="width:96px;flex-shrink:0">
                        <option value="3">3 月</option>
                        <option value="6">6 月</option>
                        <option value="12">12 月（1 年）</option>
                        <option value="24">24 月（2 年）</option>
                        <option value="36">36 月（3 年）</option>
                        <option value="48">48 月（4 年）</option>
                        <option value="60">60 月（5 年）</option>
                      </select>
                      <button @click="syncAllWarranty()" :disabled="!_syncWarrantyDate"
                              style="padding:4px 10px;background:#4338CA;color:#fff;border:none;border-radius:5px;font-size:11px;font-family:var(--font-zh);font-weight:600;cursor:pointer;white-space:nowrap;opacity:1"
                              :style="!_syncWarrantyDate ? 'opacity:.4;cursor:default' : ''">
                        套用全部設備
                      </button>
                    </div>
                  </template>
                </div>

                <!-- Grouped + ungrouped device display -->
                <template x-for="(entry, ei) in deviceDisplayList()" :key="entry.id">
                  <div>
                    <!-- Group block -->
                    <template x-if="entry.type === 'group'">
                      <div class="dev-group"
                           :class="{ 'dev-group--drop-over': _devHoverGroupId === entry.groupId }">
                        <div class="dev-group-header"
                             @click="toggleDevGroup(entry.groupId)"
                             @dragover.prevent="devDragOver($event, 'group_' + entry.groupId)"
                             @dragleave="devDragLeave($event)"
                             @drop="devDropOnGroup($event, entry.groupId, entry.groupName)">
                          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2.5"
                               :style="_openDevGroups[entry.groupId] ? 'transform:rotate(90deg);transition:.15s' : 'transition:.15s'">
                            <path d="M9 18l6-6-6-6"/>
                          </svg>
                          <span class="dev-group-header__title" x-text="entry.groupName + ' × ' + entry.groupTotal"></span>
                          <span class="dev-group-header__badge"
                                x-text="entry.devices.filter(d => d.sn || d.mac).length + '/' + entry.groupTotal + ' 已填'"></span>
                          <button class="btn-del" @click.stop="removeDeviceGroup(entry.groupId)" title="刪除整個群組">×</button>
                        </div>
                        <div class="dev-group-body" x-show="_openDevGroups[entry.groupId]">
                          <template x-for="(dev, di) in entry.devices" :key="dev.id">
                            <div class="dev-card"
                                 draggable="true"
                                 :class="{ 'dev-card--dragging': _devDragId === dev.id, 'dev-card--group-target': _devGroupTarget === 'dev_' + dev.id, 'dev-card--insert-before': _devInsertBeforeId === 'dev_' + dev.id && _devGroupTarget !== 'dev_' + dev.id }"
                                 @dragstart="devDragStart($event, dev)"
                                 @dragend="devDragEnd()"
                                 @dragover="devDragOver($event, 'dev_' + dev.id)"
                                 @dragleave="devDragLeave($event)"
                                 @drop="devDropOnDevice($event, dev)">
                              <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
                                <span class="dev-drag-handle" title="拖曳排序；在目標設備上停留 1 秒可合併成群組">
                                  <svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor"><circle cx="3" cy="2.5" r="1.1"/><circle cx="7" cy="2.5" r="1.1"/><circle cx="3" cy="6.5" r="1.1"/><circle cx="7" cy="6.5" r="1.1"/><circle cx="3" cy="10.5" r="1.1"/><circle cx="7" cy="10.5" r="1.1"/></svg>
                                </span>
                                <span style="font-size:10px;font-weight:700;color:#1D4ED8;background:#EFF6FF;padding:2px 7px;border-radius:4px;flex-shrink:0;font-family:LINE Seed TW_OTF, sans-serif" x-text="'#' + (dev._groupIdx||di+1)"></span>
                                <input class="fi" type="text" placeholder="設備名稱" x-model="dev.name" @input="setDirty()" style="flex:1">
                                <template x-if="dev.warrantyStart">
                                  <span class="w-badge" :class="'w-badge--' + warrantyStatus(dev.warrantyStart, dev.warrantyMonths)"
                                        x-text="warrantyStatusLabel(dev.warrantyStart, dev.warrantyMonths)"></span>
                                </template>
                                <button class="btn-ungroup" @click.stop="devUngroupDevice(dev)" title="移出此群組">移出</button>
                                <button class="btn-del" @click="removeDeviceByObj(dev)" title="刪除此台">×</button>
                              </div>
                              <div class="dev-row">
                                <span class="dev-row__lbl">SN</span>
                                <input class="fi fi--sm fi--mono" type="text" placeholder="序號" x-model="dev.sn" @input="setDirty()">
                              </div>
                              <div class="dev-row">
                                <span class="dev-row__lbl">MAC</span>
                                <input class="fi fi--sm fi--mono" type="text" placeholder="MAC 位址" x-model="dev.mac" @input="setDirty()">
                              </div>
                              <div class="dev-row">
                                <span class="dev-row__lbl">位置</span>
                                <input class="fi fi--sm" type="text" placeholder="安裝位置" x-model="dev.location" @input="setDirty()">
                              </div>
                              <div class="dev-row" style="margin-top:4px">
                                <span class="dev-row__lbl">保固</span>
                                <input class="fi fi--sm" type="date" x-model="dev.warrantyStart" @change="setDirty()" style="flex:none;width:auto">
                                <select class="fi fi--sm" x-model.number="dev.warrantyMonths" @change="setDirty()" style="flex:none;width:96px;margin-left:6px">
                                  <option value="3">3 月</option>
                                  <option value="6">6 月</option>
                                  <option value="12">12 月（1 年）</option>
                                  <option value="24">24 月（2 年）</option>
                                  <option value="36">36 月（3 年）</option>
                                  <option value="48">48 月（4 年）</option>
                                  <option value="60">60 月（5 年）</option>
                                </select>
                                <template x-if="dev.warrantyStart">
                                  <span style="font-size:11px;margin-left:8px;font-family:LINE Seed TW_OTF, sans-serif"
                                        :style="warrantyStatus(dev.warrantyStart,dev.warrantyMonths)==='expired' ? 'color:var(--danger)' : warrantyStatus(dev.warrantyStart,dev.warrantyMonths)==='expiring' ? 'color:var(--warning)' : 'color:var(--success)'"
                                        x-text="'到期：' + warrantyExpiry(dev.warrantyStart, dev.warrantyMonths)"></span>
                                </template>
                              </div>
                              <div class="dev-row" style="margin-top:3px">
                                <span class="dev-row__lbl">備注</span>
                                <input class="fi fi--sm" type="text" placeholder="設備備注" x-model="dev.note" @input="setDirty()">
                              </div>
                            </div>
                          </template>
                        </div>
                      </div>
                    </template>
                    <!-- Ungrouped single device -->
                    <template x-if="entry.type === 'device'">
                      <div class="dev-card"
                           draggable="true"
                           :class="{ 'dev-card--dragging': _devDragId === entry.dev.id, 'dev-card--group-target': _devGroupTarget === 'dev_' + entry.dev.id, 'dev-card--insert-before': _devInsertBeforeId === 'dev_' + entry.dev.id && _devGroupTarget !== 'dev_' + entry.dev.id }"
                           @dragstart="devDragStart($event, entry.dev)"
                           @dragend="devDragEnd()"
                           @dragover="devDragOver($event, 'dev_' + entry.dev.id)"
                           @dragleave="devDragLeave($event)"
                           @drop="devDropOnDevice($event, entry.dev)">
                        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
                          <span class="dev-drag-handle" title="拖曳排序；在目標設備上停留 1 秒可合併成群組，拖曳至群組標頭可加入群組">
                            <svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor"><circle cx="3" cy="2.5" r="1.1"/><circle cx="7" cy="2.5" r="1.1"/><circle cx="3" cy="6.5" r="1.1"/><circle cx="7" cy="6.5" r="1.1"/><circle cx="3" cy="10.5" r="1.1"/><circle cx="7" cy="10.5" r="1.1"/></svg>
                          </span>
                          <input class="fi" type="text" placeholder="設備名稱" x-model="entry.dev.name" @input="setDirty()" style="flex:1;font-weight:600">
                          <template x-if="entry.dev.warrantyStart">
                            <span class="w-badge" :class="'w-badge--' + warrantyStatus(entry.dev.warrantyStart, entry.dev.warrantyMonths)"
                                  x-text="warrantyStatusLabel(entry.dev.warrantyStart, entry.dev.warrantyMonths)"></span>
                          </template>
                          <button class="btn-del" @click="removeDevice(entry.idx)">×</button>
                        </div>
                        <div class="dev-row">
                          <span class="dev-row__lbl">SN</span>
                          <input class="fi fi--sm fi--mono" type="text" placeholder="序號" x-model="entry.dev.sn" @input="setDirty()">
                        </div>
                        <div class="dev-row">
                          <span class="dev-row__lbl">MAC</span>
                          <input class="fi fi--sm fi--mono" type="text" placeholder="MAC 位址" x-model="entry.dev.mac" @input="setDirty()">
                        </div>
                        <div class="dev-row">
                          <span class="dev-row__lbl">位置</span>
                          <input class="fi fi--sm" type="text" placeholder="安裝位置" x-model="entry.dev.location" @input="setDirty()">
                        </div>
                        <div class="dev-row" style="margin-top:4px">
                          <span class="dev-row__lbl">保固</span>
                          <input class="fi fi--sm" type="date" x-model="entry.dev.warrantyStart" @change="setDirty()" style="flex:none;width:auto">
                          <select class="fi fi--sm" x-model.number="entry.dev.warrantyMonths" @change="setDirty()" style="flex:none;width:96px;margin-left:6px">
                            <option value="3">3 月</option>
                            <option value="6">6 月</option>
                            <option value="12">12 月（1 年）</option>
                            <option value="24">24 月（2 年）</option>
                            <option value="36">36 月（3 年）</option>
                            <option value="48">48 月（4 年）</option>
                            <option value="60">60 月（5 年）</option>
                          </select>
                          <template x-if="entry.dev.warrantyStart">
                            <span style="font-size:11px;margin-left:8px;font-family:LINE Seed TW_OTF, sans-serif"
                                  :style="warrantyStatus(entry.dev.warrantyStart,entry.dev.warrantyMonths)==='expired' ? 'color:var(--danger)' : warrantyStatus(entry.dev.warrantyStart,entry.dev.warrantyMonths)==='expiring' ? 'color:var(--warning)' : 'color:var(--success)'"
                                  x-text="'到期：' + warrantyExpiry(entry.dev.warrantyStart, entry.dev.warrantyMonths)"></span>
                          </template>
                        </div>
                        <div class="dev-row" style="margin-top:3px">
                          <span class="dev-row__lbl">備注</span>
                          <input class="fi fi--sm" type="text" placeholder="設備備注" x-model="entry.dev.note" @input="setDirty()">
                        </div>
                      </div>
                    </template>
                  </div>
                </template>
                <!-- End-of-list drop zone: catches drops below all cards -->
                <div class="dev-drop-end-zone"
                     :class="{ 'dev-drop-end-zone--active': _devInsertBeforeId === 'end' }"
                     x-show="_devDragId"
                     @dragover.prevent="devDragOver($event, 'end_zone')"
                     @dragleave="devDragLeave($event)"
                     @drop="devDropAtEnd($event)"></div>

                <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
                  <button class="btn-add" @click="addDevice()">
                    <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 4v16m8-8H4"/></svg>
                    新增設備
                  </button>
                  <template x-if="(selected?.data?.items||[]).some(i => i.type !== 'header' && (i.description||'').trim())">
                    <button class="btn-add" @click="openImportModal('devices')"
                            style="background:#EFF6FF;border-color:#BFDBFE;color:#1D4ED8;border-style:solid">
                      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                      從報價單品項匯入
                    </button>
                  </template>
                </div>
              </div>

              <!-- ── 保固備注 ── -->
              <div x-show="execSubTab==='warranty'">
                <template x-if="cr.dealTag === '已結案'">
                  <div style="background:#F5F3FF;border:1px solid #C4B5FD;border-radius:10px;padding:14px 18px;margin-bottom:18px">
                    <div style="font-size:12px;font-weight:700;color:#6D28D9;font-family:var(--font-zh);margin-bottom:8px">已結案 — 保固追蹤中</div>
                    <template x-for="dev in (cr.caseRecord?.devices||[]).filter(d => d.warrantyStart)" :key="dev.id">
                      <div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #EDE9FE;font-size:12px">
                        <span style="flex:1;font-weight:500;font-family:var(--font-zh)" x-text="dev.name || '(未命名設備)'"></span>
                        <span style="font-family:LINE Seed TW_OTF, sans-serif;color:var(--text-dim);font-size:11px" x-text="warrantyExpiry(dev.warrantyStart, dev.warrantyMonths)"></span>
                        <span class="w-badge" :class="'w-badge--' + warrantyStatus(dev.warrantyStart, dev.warrantyMonths)"
                              x-text="warrantyStatusLabel(dev.warrantyStart, dev.warrantyMonths)"></span>
                      </div>
                    </template>
                    <template x-if="(cr.caseRecord?.devices||[]).filter(d => d.warrantyStart).length === 0">
                      <div style="font-size:11px;color:#8B5CF6;font-family:var(--font-zh)">尚無設備保固資料，請至「設備登錄」頁填寫</div>
                    </template>

                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#15803D" stroke-width="2"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>

                      </div>
                    </template>
                    <template x-if="caseSettleStatus()!=='finalized' && caseSettlement().settlementDate">
                      <div style="font-size:12px;color:var(--text-dim);margin-bottom:12px;font-family:var(--font-zh)">

                    <!-- KPI 四格 -->

                      </div>
                      <div class="cm-kpi__pill">

                      </div>
                      <div class="cm-kpi__pill" :class="(caseSettleSummary().grossProfit||0) >= 0 ? 'success' : 'danger'">

                      <div class="cm-kpi__pill" :class="(caseSettleSummary().netMarginPct||0) >= 0 ? 'success' : 'danger'">

                      </div>
                    </div>

                    <!-- 利潤分析：原始預估 vs 實際精算 -->

                            <tr><td style="padding:4px 0;color:var(--text-dim);font-family:var(--font-zh)">報價稅前收入</td>

                            <tr><td style="padding:4px 0;color:var(--text-dim);font-family:var(--font-zh)">原始成本（料件）</td>
                                <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif" x-text="caseSettleFmt(caseSettleSummary().origTotalCost)"></td></tr>
                            <tr><td style="padding:4px 0;color:var(--text-dim);font-family:var(--font-zh)">原始直接毛利</td>
                                <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;font-weight:600"
                                    :style="(caseSettleSummary().origDirectProfit||0)>=0?'color:#15803D':'color:#DC2626'"
                                    x-text="caseSettleFmt(caseSettleSummary().origDirectProfit)"></td></tr>
                            <tr><td style="padding:4px 0;color:var(--text-dim);font-family:var(--font-zh)">原始毛利率</td>
                                <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif"
                                    x-text="((caseSettleSummary().origMarginPct)||0).toFixed(1)+'%'"></td></tr>
                            <tr style="border-top:1px solid #E5E7EB">

                            <tr><td style="padding:4px 0;color:var(--text-dim);font-family:var(--font-zh)">公益捐款（1%）</td>
