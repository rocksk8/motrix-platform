                                    x-text="'− '+caseSettleFmt(caseSettleSummary().origCharity)"></td></tr>
                            <tr style="border-top:1.5px solid #E5E7EB">
                                <td style="padding:4px 0;font-weight:700;font-family:var(--font-zh)">原始預估淨利</td>
                                <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;font-weight:700"
                                    :style="(caseSettleSummary().origNetProfit||0)>=0?'color:#15803D':'color:#DC2626'"
                                    x-text="caseSettleFmt(caseSettleSummary().origNetProfit)"></td></tr>
                            <tr><td style="padding:4px 0;font-weight:600;color:var(--text-dim);font-family:var(--font-zh)">原始預估淨利率</td>
                                <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;font-weight:600"
                                    :style="(caseSettleSummary().origNetMarginPct||0)>=20?'color:#15803D':(caseSettleSummary().origNetMarginPct||0)>=0?'color:#B45309':'color:#DC2626'"
                                    x-text="((caseSettleSummary().origNetMarginPct)||0).toFixed(1)+'%'"></td></tr>
                          </table>
                        </div>
                        <!-- 實際成本精算 -->
                        <div>
                          <div style="font-size:11px;font-weight:600;color:#92400E;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid #FDE68A">實際成本精算</div>
                          <table style="width:100%">
                            <tr><td style="padding:4px 0;color:var(--text-dim);font-family:var(--font-zh)">報價稅前收入</td>
                                <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif" x-text="caseSettleFmt(caseSettleSummary().quotedPretax)"></td></tr>
                            <tr><td style="padding:4px 0;color:var(--text-dim);font-family:var(--font-zh)">品項實際成本</td>
                                <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;color:#92400E" x-text="caseSettleFmt(caseSettleSummary().itemActualTotal)"></td></tr>
                            <tr><td style="padding:4px 0;color:var(--text-dim);font-family:var(--font-zh)">額外支出</td>
                                <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;color:#92400E" x-text="caseSettleFmt(caseSettleSummary().extraTotal)"></td></tr>
                            <tr><td style="padding:4px 0;color:var(--text-dim);font-family:var(--font-zh)">承攬商派發成本</td>
                                <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;color:#92400E" x-text="caseSettleFmt(caseSettleSummary().dispatchTotal)"></td></tr>
                            <tr style="border-top:1px solid #FDE68A">
                                <td style="padding:4px 0;font-weight:600;font-family:var(--font-zh)">實際總成本</td>
                                <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;font-weight:700;color:#92400E"
                                    x-text="caseSettleFmt(caseSettleSummary().totalActualCost)"></td></tr>
                            <tr><td style="padding:4px 0;color:var(--text-dim);font-family:var(--font-zh)">真實毛利</td>
                                <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif"
                                    :style="(caseSettleSummary().grossProfit||0)>=0?'color:#15803D':'color:#DC2626'"
                                    x-text="caseSettleFmt(caseSettleSummary().grossProfit)"></td></tr>
                            <tr><td style="padding:4px 0;color:var(--text-dim);font-family:var(--font-zh)">真實毛利率</td>
                                <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif"
                                    x-text="((caseSettleSummary().grossMarginPct)||0).toFixed(1)+'%'"></td></tr>
                            <tr style="border-top:1px solid #FDE68A">
                                <td style="padding:4px 0;color:var(--text-dim);font-family:var(--font-zh)">管銷分攤（10%）</td>
                                <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;color:#DC2626"
                                    x-text="'− '+caseSettleFmt(caseSettleSummary().adminCost)"></td></tr>
                            <tr><td style="padding:4px 0;color:var(--text-dim);font-family:var(--font-zh)">公益捐款（1%）</td>
                                <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;color:#DC2626"
                                    x-text="'− '+caseSettleFmt(caseSettleSummary().charityDonation)"></td></tr>
                            <tr style="border-top:1.5px solid #FDE68A">
                                <td style="padding:4px 0;font-weight:700;font-family:var(--font-zh)">真實淨利</td>
                                <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;font-weight:700"
                                    :style="(caseSettleSummary().netProfit||0)>=0?'color:#15803D':'color:#DC2626'"
                                    x-text="caseSettleFmt(caseSettleSummary().netProfit)"></td></tr>
                            <tr><td style="padding:4px 0;font-weight:600;color:var(--text-dim);font-family:var(--font-zh)">真實淨利率</td>
                                <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;font-weight:700"
                                    :style="(caseSettleSummary().netMarginPct||0)>=20?'color:#15803D':(caseSettleSummary().netMarginPct||0)>=0?'color:#B45309':'color:#DC2626'"
                                    x-text="((caseSettleSummary().netMarginPct)||0).toFixed(1)+'%'"></td></tr>
                          </table>
                        </div>
                      </div>
                      <!-- 差異說明 -->
                      <div style="margin-top:12px;border-radius:6px;padding:10px 14px;font-size:12px;font-family:var(--font-zh)"
                           :style="(caseSettleSummary().profitDiff||0)>=0
                             ? 'background:#F0FDF4;border:1px solid #86EFAC;color:#15803D'
                             : 'background:#FFF1F2;border:1px solid #FECACA;color:#DC2626'">
                        <span x-text="(caseSettleSummary().profitDiff||0)>=0
                          ? '真實淨利比原始預估高 NT$ '+Math.abs(Math.round(caseSettleSummary().profitDiff||0)).toLocaleString()+'（+'+(((caseSettleSummary().netMarginPct||0)-(caseSettleSummary().origNetMarginPct||0)).toFixed(1))+' ppts）'
                          : '真實淨利比原始預估低 NT$ '+Math.abs(Math.round(caseSettleSummary().profitDiff||0)).toLocaleString()+'（'+(((caseSettleSummary().netMarginPct||0)-(caseSettleSummary().origNetMarginPct||0)).toFixed(1))+' ppts）'">
                        </span>
                      </div>
                    </div>

                    <!-- 成本品項 -->
                    <template x-if="caseSettleItems().length > 0">
                      <div>
                        <div class="cm-section-title">成本品項</div>
                        <template x-for="(item, i) in caseSettleItems()" :key="i">
                          <div style="display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid #F0EFEB;font-size:12px">
                            <span style="flex:1;font-family:var(--font-zh);color:var(--text-primary)" x-text="item.origDescription || '（無品名）'"></span>
                            <span style="font-size:10px;color:var(--text-dim);font-family:var(--font-zh);white-space:nowrap" x-text="item.origBrand || ''"></span>
                            <span style="font-family:LINE Seed TW_OTF, sans-serif;font-weight:600;min-width:90px;text-align:right"
                                  :style="(item.actualTotalCost||0) > 0 ? '' : 'color:var(--text-dim)'"
                                  x-text="(item.actualTotalCost||0) > 0 ? caseSettleFmt(item.actualTotalCost) : '未填寫'"></span>
                          </div>
                        </template>
                        <div style="display:flex;justify-content:flex-end;padding:7px 0;font-size:12px;font-family:LINE Seed TW_OTF, sans-serif;border-top:1.5px solid #E5E7EB">
                          <span style="color:var(--text-dim);margin-right:10px;font-family:var(--font-zh)">品項成本合計</span>
                          <span style="font-weight:700" x-text="caseSettleFmt(caseSettleSummary().itemActualTotal)"></span>
                        </div>
                      </div>
                    </template>

                    <!-- 額外支出 -->
                    <template x-if="caseSettleExtras().length > 0">
                      <div style="margin-top:14px">
                        <div class="cm-section-title">額外支出</div>
                        <template x-for="(ex, i) in caseSettleExtras()" :key="i">
                          <div style="display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px solid #F0EFEB;font-size:12px">
                            <span style="font-size:10px;background:#F3F4F6;color:#6B7280;padding:1px 6px;border-radius:3px;font-family:var(--font-zh);white-space:nowrap" x-text="ex.category || ''"></span>
                            <span style="flex:1;font-family:var(--font-zh);color:var(--text-primary)" x-text="ex.description || '—'"></span>
                            <span style="font-family:LINE Seed TW_OTF, sans-serif;font-weight:600;color:#92400E;min-width:90px;text-align:right"
                                  x-text="(ex.totalCost||0) > 0 ? caseSettleFmt(ex.totalCost) : '—'"></span>
                          </div>
                        </template>
                        <div style="display:flex;justify-content:flex-end;padding:7px 0;font-size:12px;font-family:LINE Seed TW_OTF, sans-serif;border-top:1.5px solid #E5E7EB">
                          <span style="color:var(--text-dim);margin-right:10px;font-family:var(--font-zh)">額外支出合計</span>
                          <span style="font-weight:700;color:#92400E" x-text="caseSettleFmt(caseSettleSummary().extraTotal)"></span>
                        </div>
                      </div>
                    </template>

                    <!-- 備注 -->
                    <template x-if="caseSettleMemo()">
                      <div style="margin-top:14px;background:#F9FAFB;border-radius:8px;padding:12px 14px">
                        <div style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);font-family:LINE Seed TW_OTF, sans-serif;margin-bottom:6px">備注</div>
                        <div style="font-size:13px;font-family:var(--font-zh);line-height:1.6;white-space:pre-wrap" x-text="caseSettleMemo()"></div>
                      </div>
                    </template>

                  </div>
                </template>

              </div><!-- /fin -->

              <!-- ══ 承攬商派發 Tab ══ -->
              <div x-show="activeTab==='dispatch'">

                <!-- KPI bar -->
                <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap">
                  <div style="flex:1">
                    <span class="cm-section-title" style="margin-bottom:0">承攬商派發管理</span>
                  </div>
                  <div style="font-size:12px;color:var(--text-secondary)">
                    外包總成本：
                    <strong style="color:var(--text-main);font-family:LINE Seed TW_OTF, sans-serif"
                            x-text="'NT$ ' + dispatchTotalCost().toLocaleString()"></strong>
                  </div>
                  <button class="btn-add" @click="openNewDispatch()" style="padding:5px 12px;font-size:12px">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 4v16m8-8H4"/></svg>
                    新增派發
                  </button>
                </div>

                <!-- Loading -->
                <div x-show="dispatchesLoading" style="text-align:center;padding:30px;color:var(--text-dim);font-size:12px">載入中…</div>

                <!-- Empty -->
                <div x-show="!dispatchesLoading && dispatches.length===0"
                     style="text-align:center;padding:40px;color:var(--text-dim);font-size:13px">
                  尚未派發任何工作至承攬商
                </div>

                <!-- Dispatch list -->
                <template x-for="d in dispatches" :key="d.id">
                  <div style="border:1px solid var(--border-light);border-radius:10px;margin-bottom:12px;overflow:hidden">

                    <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;background:#FAFAF9;border-bottom:1px solid var(--border-light)">
                      <div style="flex:1">
                        <div style="font-size:13px;font-weight:600;color:var(--text-main)" x-text="d.vendorName || '外包人員（點工）'"></div>
                        <div style="font-size:11px;color:var(--text-dim);margin-top:2px">
                          <span x-show="d.dispatchDate" x-text="'派發日：' + d.dispatchDate"></span>
                          <span x-show="d.scope"> · </span>
                          <span x-show="d.scope" x-text="d.scope" style="font-style:italic"></span>
                        </div>
                      </div>
                      <span :class="'badge ' + _dispatchStatusClass(d.status)" x-text="d.statusLabel"
                            style="font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600"></span>
                      <div style="font-size:13px;font-weight:700;font-family:LINE Seed TW_OTF, sans-serif;color:var(--text-main)">
                        NT$ <span x-text="(d.grandTotal||0).toLocaleString()"></span>
                      </div>

                      <button x-show="d.status==='confirmed' || d.status==='sent'"
                              @click="markPendingAcceptance(d)"

                      </button>
                      <button x-show="d.status==='pending_acceptance'"
                              @click="acceptDispatch(d)"
                              style="padding:4px 10px;font-size:11px;border:none;background:#059669;color:#fff;border-radius:5px;cursor:pointer;white-space:nowrap;font-weight:600">

                            <th style="text-align:left;padding:4px 0;font-weight:500">品項說明</th>
                            <th style="text-align:right;padding:4px 6px;font-weight:500;width:50px">數量</th>
                            <th style="text-align:left;padding:4px 0;font-weight:500;width:40px">單位</th>
                            <th style="text-align:right;padding:4px 6px;font-weight:500;width:90px">單價</th>
                            <th style="text-align:right;padding:4px 0;font-weight:500;width:90px">金額</th>

                        <tbody>
                          <template x-for="(it, ii) in d.items" :key="ii">
                            <tr style="border-bottom:1px solid #F5F4F0">
                              <td style="padding:5px 0;font-family:var(--font-zh)" x-text="it.description"></td>
                              <td style="text-align:right;padding:5px 6px;font-family:LINE Seed TW_OTF, sans-serif" x-text="it.qty"></td>
                              <td style="padding:5px 0;color:var(--text-dim)" x-text="it.unit"></td>
                              <td style="text-align:right;padding:5px 6px;font-family:LINE Seed TW_OTF, sans-serif"
                                  x-text="'NT$ ' + (it.unitPrice||0).toLocaleString()"></td>
                              <td style="text-align:right;padding:5px 0;font-weight:600;font-family:LINE Seed TW_OTF, sans-serif"
                                  x-text="'NT$ ' + (it.amount||0).toLocaleString()"></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                    <!-- Personnel list -->
                    <div x-show="d.personnel && d.personnel.length > 0" style="padding:10px 16px" :style="(d.items && d.items.length>0) ? 'border-top:1px solid var(--border-light)' : ''">
                      <div style="font-size:10px;font-weight:600;color:var(--text-dim);letter-spacing:.04em;margin-bottom:6px">外包名單人員</div>
                      <table style="width:100%;border-collapse:collapse;font-size:11px">
                        <tbody>
                          <template x-for="(p, pi) in d.personnel" :key="pi">
                            <tr style="border-bottom:1px solid #F5F4F0">
                              <td style="padding:5px 0;font-family:var(--font-zh)" x-text="p.name"></td>
                              <td style="padding:5px 0;color:var(--text-dim)" x-text="p.note || ''"></td>
                              <td style="text-align:right;padding:5px 0;font-weight:600;font-family:LINE Seed TW_OTF, sans-serif"
                                  x-text="'NT$ ' + (p.amount||0).toLocaleString()"></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                    <!-- Tax summary -->
                    <div style="display:flex;justify-content:flex-end;gap:14px;padding:5px 16px 6px;font-size:11px;font-family:LINE Seed TW_OTF, sans-serif;color:var(--text-secondary);background:#FAFAF9;border-top:1px solid var(--border-light)">
                      <span x-show="d.items && d.items.length > 0">小計 NT$ <span x-text="(d.totalAmount||0).toLocaleString()"></span></span>
                      <span x-show="(d.taxRate||0)>0 && d.items && d.items.length > 0">稅額（<span x-text="Math.round((d.taxRate||0)*100)"></span>%）NT$ <span x-text="(d.taxAmount||0).toLocaleString()"></span></span>
                      <span x-show="(d.personnel||[]).length > 0">外包人員 NT$ <span x-text="(d.personnelTotal||0).toLocaleString()"></span></span>
                      <span style="font-weight:700;color:var(--text-main)">總成本 NT$ <span x-text="(d.grandTotal||0).toLocaleString()"></span></span>
                    </div>
                    <div x-show="d.notes" style="padding:6px 16px 0;font-size:11px;color:var(--text-dim)"
                         x-text="'備注：' + d.notes"></div>
                    <!-- 驗收資訊 -->
                    <div x-show="d.acceptedBy"
                         style="padding:6px 16px 10px;font-size:11px;color:#065F46;background:#F0FDF4;border-top:1px solid #D1FAE5;display:flex;align-items:center;gap:6px">
                      <span>✓ 已驗收</span>
                      <span style="color:#374151;font-weight:600" x-text="d.acceptedBy"></span>
                      <span style="color:var(--text-dim)" x-text="d.acceptedAt ? '· ' + d.acceptedAt.slice(0,16).replace('T',' ') : ''"></span>
                    </div>
                  </div>
                </template>

              </div><!-- /dispatch -->

              <!-- ══ 出貨單 Tab ══ -->
              <div x-show="activeTab==='shipping'">

                <!-- KPI bar -->
                <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap">
                  <div style="flex:1">
                    <span class="cm-section-title" style="margin-bottom:0">出貨單管理</span>
                  </div>
                  <button x-show="['superadmin','admin'].includes(session.role)"
                          class="btn-add" @click="openNewShippingNote()" style="padding:5px 12px;font-size:12px">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 4v16m8-8H4"/></svg>
                    新增出貨單
                  </button>
                </div>

                <!-- Loading -->
                <div x-show="shippingNotesLoading" style="text-align:center;padding:30px;color:var(--text-dim);font-size:12px">載入中…</div>

                <!-- Empty -->
                <div x-show="!shippingNotesLoading && shippingNotes.length===0"
                     style="text-align:center;padding:40px;color:var(--text-dim);font-size:13px">
                  尚未建立任何出貨單
                </div>

                <!-- Shipping note list -->
                <template x-for="n in shippingNotes" :key="n.id">
                  <div style="border:1px solid var(--border-light);border-radius:10px;margin-bottom:12px;overflow:hidden">
                    <!-- Header row -->
                    <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;background:#FAFAF9;border-bottom:1px solid var(--border-light);flex-wrap:wrap">
                      <div style="flex:1;min-width:160px">
                        <div style="font-size:13px;font-weight:600;color:var(--text-main);font-family:LINE Seed TW_OTF, sans-serif" x-text="n.noteNo"></div>
                        <div style="font-size:11px;color:var(--text-dim);margin-top:2px">
                          <span x-show="n.shipDate" x-text="'出貨日：' + n.shipDate"></span>
                          <span> · </span>
                          <span x-text="n.itemCount + ' 項品項'"></span>
                        </div>
                      </div>
                      <span :class="'badge ' + _shippingStatusClass(n.status)" x-text="_shippingStatusLabel(n.status)"
                            style="font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600"></span>
                      <span x-show="(n.status==='待審核'||n.status==='簽核中') && (n.approval && n.approval.tiers || []).length>0"
                            style="font-size:10px;color:var(--text-dim)"
                            x-text="'第 ' + (((n.approval.currentTier)||0)+1) + ' 層 / 共 ' + n.approval.tiers.length + ' 層'"></span>

                      <!-- 草稿操作 -->
                      <div x-show="n.status==='草稿' && ['superadmin','admin'].includes(session.role)" style="display:flex;gap:6px">
                        <button @click="openEditShippingNote(n)" style="padding:4px 8px;font-size:11px;border:1px solid var(--border);border-radius:5px;background:#fff;cursor:pointer">編輯</button>
                        <button @click="submitShippingNote(n)" style="padding:4px 10px;font-size:11px;border:none;background:var(--accent);color:#fff;border-radius:5px;cursor:pointer;white-space:nowrap;font-weight:600">送出審核</button>
                        <button @click="deleteShippingNote(n)" style="padding:4px 8px;font-size:11px;border:1px solid var(--border);border-radius:5px;background:#fff;cursor:pointer;color:var(--danger)">刪</button>
                      </div>

                      <!-- 待審核/簽核中操作 -->
                      <div x-show="(n.status==='待審核'||n.status==='簽核中') && ['superadmin','admin'].includes(session.role)" style="display:flex;gap:6px">
                        <button @click="approveShippingNote(n)" style="padding:4px 10px;font-size:11px;border:none;background:#059669;color:#fff;border-radius:5px;cursor:pointer;white-space:nowrap;font-weight:600">簽核</button>
                        <button @click="rejectShippingNote(n)" style="padding:4px 10px;font-size:11px;border:1px solid #FCA5A5;background:#FEF2F2;color:#DC2626;border-radius:5px;cursor:pointer;white-space:nowrap">退回</button>
                      </div>

                      <!-- 已核准操作 -->
                      <div x-show="n.status==='已核准' && ['superadmin','admin'].includes(session.role)" style="display:flex;gap:6px">
                        <button @click="downloadShippingPdf(n)" style="padding:4px 10px;font-size:11px;border:1px solid #93C5FD;background:#EFF6FF;color:#1D4ED8;border-radius:5px;cursor:pointer;white-space:nowrap">下載 PDF</button>
                        <button x-show="!n.isSigned" @click="toggleSigned(n,'sign')" style="padding:4px 10px;font-size:11px;border:none;background:#059669;color:#fff;border-radius:5px;cursor:pointer;white-space:nowrap;font-weight:600">標記已回簽</button>
                        <button x-show="n.isSigned" @click="toggleSigned(n,'unsign')" style="padding:4px 10px;font-size:11px;border:1px solid var(--border);background:#fff;color:var(--text-secondary);border-radius:5px;cursor:pointer;white-space:nowrap">取消回簽</button>
                      </div>

                      <!-- 預覽（不分狀態） -->
                      <div x-show="['superadmin','admin'].includes(session.role)" style="display:flex;gap:6px">
                        <button @click="previewShippingPdf(n)" :disabled="shippingPreviewFetching"
                                style="padding:4px 10px;font-size:11px;border:1px solid var(--border);background:#fff;color:var(--text-secondary);border-radius:5px;cursor:pointer;white-space:nowrap">預覽</button>
                      </div>
                    </div>

                    <!-- Items -->
                    <div x-show="n.items && n.items.length > 0" style="padding:10px 16px">
                      <table style="width:100%;border-collapse:collapse;font-size:11px">
                        <thead>
                          <tr style="color:var(--text-dim);border-bottom:1px solid var(--border-light)">
                            <th style="text-align:left;padding:4px 0;font-weight:500">品名 / 規格說明</th>
                            <th style="text-align:left;padding:4px 6px;font-weight:500;width:100px">廠牌 / 型號</th>
                            <th style="text-align:right;padding:4px 6px;font-weight:500;width:50px">數量</th>
                            <th style="text-align:left;padding:4px 0;font-weight:500;width:40px">單位</th>
                            <th style="text-align:left;padding:4px 0;font-weight:500;width:120px">備註</th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="(it, ii) in n.items" :key="ii">
                            <tr style="border-bottom:1px solid #F5F4F0">
                              <td style="padding:5px 0;font-family:var(--font-zh)" x-text="it.description"></td>
                              <td style="padding:5px 6px;color:var(--text-dim)" x-text="it.brand"></td>
                              <td style="text-align:right;padding:5px 6px;font-family:LINE Seed TW_OTF, sans-serif" x-text="it.qty"></td>
                              <td style="padding:5px 0;color:var(--text-dim)" x-text="it.unit"></td>
                              <td style="padding:5px 0;color:var(--text-dim)" x-text="it.notes"></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                    <div x-show="n.notes" style="padding:6px 16px 0;font-size:11px;color:var(--text-dim)"
                         x-text="'備注：' + n.notes"></div>

                    <!-- 已回簽確認條 -->
                    <div x-show="n.isSigned"
                         style="padding:6px 16px 10px;font-size:11px;color:#065F46;background:#F0FDF4;border-top:1px solid #D1FAE5;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                      <span>✓ 已回簽</span>
                      <span style="color:#374151;font-weight:600" x-text="n.signedBy"></span>
                      <span style="color:var(--text-dim)" x-text="n.signedAt ? '· ' + n.signedAt.slice(0,16).replace('T',' ') : ''"></span>
                      <span style="flex:1"></span>
                      <button @click="_shippingLogOpen[n.id] = !_shippingLogOpen[n.id]"
                              style="background:none;border:none;color:#065F46;text-decoration:underline;cursor:pointer;font-size:11px">
                        <span x-text="_shippingLogOpen[n.id] ? '收合回簽歷程' : '查看回簽歷程'"></span>
                      </button>
                    </div>
                    <div x-show="n.isSigned && _shippingLogOpen[n.id]" style="padding:8px 16px 10px;background:#FAFAF9;border-top:1px solid var(--border-light)">
                      <template x-for="(l, li) in (n.signedLog||[]).slice().reverse()" :key="li">
                        <div style="font-size:11px;color:var(--text-secondary);padding:3px 0;display:flex;gap:8px;flex-wrap:wrap">
                          <span :style="l.action==='signed' ? 'color:#065F46' : 'color:var(--danger)'"
                                x-text="l.action==='signed' ? '✓ 標記回簽' : '✕ 取消回簽'"></span>
                          <span x-text="l.userDisplay"></span>
                          <span style="color:var(--text-dim)" x-text="(l.at||'').slice(0,16).replace('T',' ')"></span>
                          <span x-show="l.note" style="color:var(--text-dim)" x-text="'－ ' + l.note"></span>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>

              </div><!-- /shipping -->

              <!-- ══ 動態 Tab ══ -->
              <div x-show="activeTab==='feed'" class="feed-wrap">
                <!-- compose box -->
                <div class="feed-compose">
                  <textarea class="feed-compose__box" placeholder="記錄聯繫情況、案件進展、備忘…" x-model="newComment" rows="2"></textarea>
                  <div class="feed-compose__foot">
                    <span x-show="postingComment" style="font-size:11px;color:var(--text-dim);font-family:var(--font-zh)">發送中…</span>
                    <button @click="postComment()" :disabled="!newComment.trim() || postingComment"
                            style="padding:5px 16px;font-size:12px;font-weight:600;border-radius:6px;border:none;cursor:pointer;font-family:var(--font-zh);transition:background .12s"
                            :style="newComment.trim() && !postingComment ? 'background:var(--accent);color:#fff' : 'background:#E5E7EB;color:#9CA3AF;cursor:not-allowed'">
                      發布更新
                    </button>
                  </div>
                </div>
                <!-- feed list -->
                <div class="feed-list">
                  <template x-if="updatesLoading">
                    <div class="feed-empty">載入中…</div>
                  </template>
                  <template x-if="!updatesLoading && caseUpdates.length === 0">
                    <div class="feed-empty">尚無任何動態，發布第一則更新吧！</div>
                  </template>
                  <template x-for="item in caseUpdates" :key="item.id">
                    <div class="feed-item">
                      <div class="feed-avatar" :class="'feed-avatar--' + item.source"
                           x-text="(item.authorDisplay || '?').slice(0,2)"></div>
                      <div class="feed-bubble" :class="item.source==='comment' ? 'feed-bubble--comment' : ''">
                        <div class="feed-bubble__head">
                          <span class="feed-bubble__author" x-text="item.authorDisplay"></span>
                          <template x-if="item.source !== 'comment'">
                            <span class="feed-badge" :class="'feed-badge--' + item.source"
                                  x-text="item.source==='work_log' ? '工作日誌' : item.source==='daily_task' ? '工作事項' : item.source==='dev_log' ? '業務開發記錄' : '案件狀態'"></span>
                          </template>
                          <template x-if="item.source==='work_log'">
                            <span style="font-size:10px;color:var(--text-dim);font-family:LINE Seed TW_OTF, sans-serif" x-text="item.logDate"></span>
                          </template>
                          <template x-if="item.source==='daily_task'">
                            <span style="font-size:10px;color:var(--text-dim);font-family:var(--font-zh)" x-text="'完成：' + (item.taskTitle || '')"></span>
                          </template>
                          <template x-if="item.source==='dev_log'">
                            <span style="font-size:10px;color:var(--text-dim);font-family:var(--font-zh)" x-text="(item.channel || '') + (item.logDate ? '・' + item.logDate : '')"></span>
                          </template>
                          <span class="feed-bubble__time" x-text="fmtFeedTime(item.created_at)"></span>
                          <template x-if="item.canDelete">
                            <button class="feed-bubble__del" @click="deleteUpdate(item.id)" title="刪除">×</button>
                          </template>
                        </div>
                        <div class="feed-bubble__content" x-text="item.content"></div>
                      </div>
                    </div>
                  </template>
                </div>
              </div><!-- /feed -->

            </div><!-- /cm-body -->

            <!-- ── 今日相關任務 mini strip ── -->
            <div style="border-top:1px solid var(--border-light);background:#fff;flex-shrink:0">
              <div @click="caseTasksOpen=!caseTasksOpen"
                   style="display:flex;align-items:center;gap:8px;padding:8px 16px;cursor:pointer;user-select:none">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:#7C3AED;flex-shrink:0"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                <span style="font-size:11px;font-weight:600;color:#7C3AED;font-family:var(--font-zh);flex:1">今日相關任務</span>
                <span x-show="caseTasks.length > 0"
                      style="font-size:10px;font-weight:700;background:#7C3AED;color:#fff;border-radius:10px;padding:1px 7px"
                      x-text="caseTasks.length"></span>
                <span x-show="caseTasksLoading" style="font-size:10px;color:var(--text-dim)">載入中…</span>
                <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                     :style="caseTasksOpen ? 'transform:rotate(90deg);transition:.15s' : 'transition:.15s'"
                     style="color:var(--text-dim)"><polyline points="9 18 15 12 9 6"/></svg>
              </div>
              <div x-show="caseTasksOpen" style="padding:0 16px 10px">
                <template x-if="!caseTasksLoading && caseTasks.length === 0">
                  <div style="font-size:11px;color:var(--text-dim);text-align:center;padding:6px 0">今日尚無掛載此案件的工作事項</div>
                </template>
                <template x-for="t in caseTasks" :key="t.id">
                  <div style="padding:6px 0;border-bottom:1px solid #F5F4F0">
                    <!-- Row 1: title + status + buttons -->
                    <div style="display:flex;align-items:center;gap:7px">
                      <span :style="`width:6px;height:6px;border-radius:50%;flex-shrink:0;background:${
                        t.priority==='緊急'?'#DC2626':t.priority==='重要'?'#D97706':'#2563EB'}`"></span>
                      <span style="font-size:12px;font-family:var(--font-zh);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" x-text="t.title"></span>
                      <span :style="`font-size:10px;padding:1px 5px;border-radius:4px;flex-shrink:0;${
                        _caseMyComp(t)?.completed?'background:#DCFCE7;color:#15803D':'background:#FEF3C7;color:#92400E'}`"
                            x-text="_caseMyComp(t)?.completed ? '已完成' : '待完成'"></span>
                      <!-- Submit / edit button (only if user is assignee) -->
                      <template x-if="(t.assigned_to||[]).includes(session.username)">
                        <button style="font-size:10px;padding:1px 7px;border-radius:4px;cursor:pointer;white-space:nowrap;border:1px solid;flex-shrink:0"
                                :style="_caseMyComp(t)?.completed
                                  ? 'border-color:#DDD6FE;background:#F5F3FF;color:#7C3AED'
                                  : 'border-color:#BBF7D0;background:#F0FDF4;color:#15803D'"
                                @click="_caseTaskStartEdit(t)"
                                x-text="_caseMyComp(t)?.completed ? '修改回報' : '提交回報'">
                        </button>
                      </template>
                      <!-- Edit log toggle -->
                      <button style="font-size:9px;padding:1px 5px;border-radius:3px;cursor:pointer;border:1px solid var(--border-light);background:#fff;color:var(--text-dim);flex-shrink:0"
                              @click="_caseTaskToggleLog(t.id)"
                              x-text="caseTaskLogsOpen[t.id] ? '收起記錄' : '查看記錄'">
                      </button>
                    </div>
                    <!-- Row 2: current user's report preview -->
                    <template x-if="_caseMyComp(t)?.report && caseTaskEditing.taskId !== t.id">
                      <div style="font-size:11px;color:var(--text-secondary);margin:4px 0 0 13px;padding:4px 6px;background:#F5F4F0;border-radius:4px;white-space:pre-wrap;line-height:1.5"
                           x-text="_caseMyComp(t)?.report"></div>
                    </template>
                    <!-- Row 3: inline edit form -->
                    <template x-if="caseTaskEditing.taskId === t.id">
                      <div style="margin-top:5px">
                        <textarea x-model="caseTaskEditing.text" rows="3"
                                  placeholder="請填寫工作完成情形、實際執行內容…"
                                  style="width:100%;padding:6px 8px;border:1px solid #7C3AED;border-radius:5px;font-size:11px;font-family:var(--font-zh);outline:none;resize:vertical;box-sizing:border-box;line-height:1.5"></textarea>
                        <div style="display:flex;gap:6px;margin-top:4px">
                          <button style="padding:3px 10px;font-size:10px;border-radius:4px;cursor:pointer;background:#15803D;color:#fff;border:1px solid #15803D;font-family:var(--font-zh)"
                                  @click="_caseTaskSubmitReport(t.id)"
                                  :disabled="caseTaskEditSubmitting || !caseTaskEditing.text.trim()"
                                  x-text="caseTaskEditSubmitting ? '送出中…' : '確認送出'">
                          </button>
                          <button style="padding:3px 10px;font-size:10px;border-radius:4px;cursor:pointer;background:#fff;color:var(--text-secondary);border:1px solid var(--border-light);font-family:var(--font-zh)"
                                  @click="caseTaskEditing={taskId:null,text:''}">取消</button>
                        </div>
                      </div>
                    </template>
                    <!-- Row 4: edit log -->
                    <template x-if="caseTaskLogsOpen[t.id]">
                      <div style="margin-top:4px;margin-left:13px">
                        <div x-show="!caseTaskEditLogs[t.id]" style="font-size:10px;color:var(--text-dim)">載入中…</div>
                        <template x-if="caseTaskEditLogs[t.id] && caseTaskEditLogs[t.id].length === 0">
                          <div style="font-size:10px;color:var(--text-dim)">尚無編輯記錄</div>
                        </template>
                        <template x-for="log in (caseTaskEditLogs[t.id] || [])" :key="log.id">
                          <div style="font-size:10px;padding:3px 6px;border-left:2px solid #DDD6FE;margin-bottom:3px;color:var(--text-secondary)">
                            <span style="font-weight:600" x-text="log.changedByDisplay"></span>
                            <span style="color:var(--text-dim);margin-left:4px" x-text="log.changedAt?.slice(0,16).replace('T',' ')"></span>
                            <template x-for="ch in (log.changes || [])" :key="ch.field">
                              <div style="margin-top:1px">
                                <span style="background:#F3F4F6;border-radius:2px;padding:0 3px;font-size:9px" x-text="ch.field"></span>
                                <span style="color:#DC2626;text-decoration:line-through;margin-left:3px" x-text="ch.old"></span>
                                <span style="color:var(--text-dim);margin:0 2px">→</span>
                                <span style="color:#15803D" x-text="ch.new"></span>
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </template>
                <template x-if="caseTasks.length > 0">
                  <a :href="`../pages/daily-tasks.html`"
                     style="display:block;text-align:right;font-size:10px;color:#7C3AED;margin-top:5px;text-decoration:none">
                    前往工作事項 →
                  </a>
                </template>
              </div>
            </div>

          </div>
        </template>

      </div><!-- /cm-detail -->
    </div><!-- /cm-layout -->
  </main>
</div>

<!-- ── 承攬商派發 Modal ── -->
<div x-show="showDispatchModal" x-cloak
     style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px"
     @click.self="showDispatchModal=false"
     @keydown.escape.window="showDispatchModal=false">
  <div style="background:#fff;border-radius:12px;width:100%;max-width:680px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(0,0,0,.22)">
    <!-- Header -->
    <div style="display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border-light);gap:10px">
      <span style="font-size:14px;font-weight:700;flex:1;font-family:var(--font-zh)"
            x-text="editDispatchId ? '編輯派發紀錄' : '新增承攬商派發'"></span>
      <button @click="showDispatchModal=false" style="width:28px;height:28px;border:none;background:#F0EEE9;border-radius:5px;cursor:pointer;font-size:16px">×</button>
    </div>
    <!-- Body -->
    <div style="flex:1;overflow-y:auto;padding:18px 20px">
      <!-- Basic info -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
        <div>
          <label style="font-size:11px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:4px">承攬商</label>
          <select x-model="dispatchForm.vendor_id"
                  style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;outline:none;box-sizing:border-box">
            <option value="">— 無承攬商（純外包名單人員點工）—</option>
            <template x-for="v in vendors" :key="v.id">
              <option :value="v.id" x-text="v.name + (v.contactName ? ' (' + v.contactName + ')' : '')"></option>
            </template>
          </select>
          <div style="font-size:11px;color:var(--text-dim);margin-top:4px">
            承攬商與外包名單人員至少需擇一，可只填外包人員（點工）不選承攬商
          </div>
          <div x-show="vendors.length===0" style="font-size:11px;color:var(--warning);margin-top:4px">

            <a href="vendor-contractors.html" style="color:var(--accent)">承攬商管理</a>
            新增。
          </div>
        </div>
        <div>
          <label style="font-size:11px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:4px">派發日期</label>
          <input type="date" x-model="dispatchForm.dispatch_date"
                 style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;outline:none;box-sizing:border-box">
        </div>
        <div>
          <label style="font-size:11px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:4px">狀態</label>
          <select x-model="dispatchForm.status"
                  style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;outline:none;box-sizing:border-box">
            <option value="draft">草稿</option>
            <option value="sent">已送出</option>
            <option value="confirmed">已確認</option>
            <option value="pending_acceptance">待驗收</option>
            <option value="accepted">已驗收</option>
            <option value="completed">完工</option>
            <option value="cancelled">已取消</option>
          </select>
        </div>
        <div>
          <label style="font-size:11px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:4px">工作範圍</label>
          <input type="text" x-model="dispatchForm.scope" placeholder="簡述承攬工項…"

      </div>

      <!-- Items -->
      <div style="font-size:11px;font-weight:600;color:var(--text-dim);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border-light);padding-bottom:4px;margin-bottom:10px">承攬商報價品項</div>

            <th style="text-align:left;padding:4px 4px;font-weight:500;width:50px">單位</th>
            <th style="text-align:right;padding:4px 6px;font-weight:500;width:100px">單價 (NT$)</th>
            <th style="text-align:right;padding:4px 6px;font-weight:500;width:100px">金額 (NT$)</th>
            <th style="width:28px"></th>
          </tr>
        </thead>
        <tbody>
          <template x-for="(it, ii) in dispatchForm.items" :key="it.id">
            <tr style="border-bottom:1px solid #F5F4F0">
              <td style="padding:4px 0">
                <input type="text" x-model="it.description" placeholder="品項說明"
                       style="width:100%;padding:5px 8px;border:1px solid var(--border-light);border-radius:5px;font-size:12px;font-family:inherit;outline:none;box-sizing:border-box">

              <td style="padding:4px 6px">

              </td>
              <td style="padding:4px 4px">
                <select x-model="it.unit"
                        style="width:100%;padding:5px 2px;border:1px solid var(--border-light);border-radius:5px;font-size:12px;font-family:inherit;outline:none;box-sizing:border-box;background:#fff;cursor:pointer">
                  <option>式</option>
                  <option>台</option>
                  <option>套</option>
                  <option>個</option>
                  <option>組</option>
                  <option>米</option>
                  <option>捲</option>
                  <option>箱</option>
                  <option>包</option>
                  <option>人月</option>
                  <option>人日</option>
                  <option>次</option>
                  <option>年</option>
                  <option>月</option>
                  <option>批</option>
                  <option>項</option>
                </select>
              </td>
              <td style="padding:4px 6px">
                <input type="number" x-model="it.unitPrice" min="0" step="1" placeholder="0"
                       @input="onDispatchItemPrice(ii)"
                       style="width:100%;padding:5px;border:1px solid var(--border-light);border-radius:5px;font-size:12px;font-family:LINE Seed TW_OTF, sans-serif;text-align:right;outline:none;box-sizing:border-box">
              </td>
              <td style="padding:4px 6px;text-align:right;font-weight:600;font-family:LINE Seed TW_OTF, sans-serif;color:var(--text-main)"
                  x-text="(it.amount || 0).toLocaleString()"></td>
              <td style="padding:4px 0;text-align:center">
                <button @click="removeDispatchItem(ii)"
                        style="width:22px;height:22px;border:none;background:none;cursor:pointer;color:var(--danger);font-size:14px;line-height:1">×</button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <button @click="addDispatchItem()"
                style="font-size:11px;padding:4px 12px;border:1px dashed var(--border);border-radius:5px;background:#fff;cursor:pointer;font-family:var(--font-zh)">
          ＋ 新增品項
        </button>
        <span style="flex:1"></span>
        <span style="font-size:12px;color:var(--text-secondary)">小計：</span>
        <span style="font-size:13px;font-weight:600;font-family:LINE Seed TW_OTF, sans-serif"
              x-text="'NT$ ' + _dispatchSubtotal().toLocaleString()"></span>
      </div>
      <div style="display:flex;align-items:center;justify-content:flex-end;gap:16px;padding:8px 0;border-top:1px solid var(--border-light)">
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary)">
          稅率：
          <select x-model="dispatchForm.tax_rate"
                  style="padding:3px 8px;border:1px solid var(--border-light);border-radius:5px;font-size:12px;background:#fff;font-family:inherit;outline:none">
            <option value="0">未稅（0%）</option>
            <option value="0.05">含稅（5%）</option>
          </select>
        </label>
        <span x-show="+(dispatchForm.tax_rate)>0" style="font-size:12px;color:var(--text-secondary)">
          稅額：NT$ <span x-text="_dispatchTaxAmount().toLocaleString()"></span>
        </span>
        <span style="font-size:13px;font-weight:600;font-family:LINE Seed TW_OTF, sans-serif;color:var(--text-secondary)">
          承攬商含稅合計：NT$ <span x-text="_dispatchTotalWithTax().toLocaleString()"></span>
        </span>
      </div>

      <!-- 外包名單人員 -->
      <div style="font-size:11px;font-weight:600;color:var(--text-dim);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border-light);padding-bottom:4px;margin-top:16px;margin-bottom:10px">外包名單人員（可複選，個別計費）</div>
      <div class="attendee-chips" style="margin-bottom:6px;display:block" x-show="(dispatchForm.personnel||[]).length">
        <table style="width:100%;border-collapse:collapse;font-size:12px">
          <template x-for="(p, pi) in dispatchForm.personnel" :key="p.id">
            <tr style="border-bottom:1px solid #F5F4F0">
              <td style="padding:5px 0;color:var(--text-primary)" x-text="p.name"></td>
              <td style="padding:5px 6px;width:130px">
                <div style="position:relative">
                  <span style="position:absolute;left:7px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--text-dim)">NT$</span>
                  <input type="number" x-model.number="p.amount" min="0" step="1"
                         style="width:100%;padding:5px 6px 5px 30px;border:1px solid var(--border-light);border-radius:5px;font-size:12px;font-family:LINE Seed TW_OTF, sans-serif;text-align:right;outline:none;box-sizing:border-box">
                </div>
              </td>
              <td style="padding:5px 6px">
                <input type="text" x-model="p.note" placeholder="備注（選填）"
                       style="width:100%;padding:5px 8px;border:1px solid var(--border-light);border-radius:5px;font-size:12px;font-family:inherit;outline:none;box-sizing:border-box">
              </td>
              <td style="width:24px;text-align:center">
                <button @click="removeDispatchPersonnel(pi)"
                        style="width:22px;height:22px;border:none;background:none;cursor:pointer;color:var(--danger);font-size:14px;line-height:1">×</button>
              </td>
            </tr>
          </template>
        </table>
      </div>
      <div class="attendee-add">
        <select class="attendee-select" x-model="_newDispatchPersonnelId">
          <option value="">選擇外包名單人員…</option>
          <template x-for="c in contractorRoster" :key="c.id">
            <option :value="c.id" x-text="c.name + (c.phone ? ' (' + c.phone + ')' : '')"></option>
          </template>
        </select>
        <button class="btn btn-ghost btn-sm" @click="addDispatchPersonnel()">加入</button>
      </div>
      <div x-show="contractorRoster.length===0" style="font-size:11px;color:var(--warning);margin-top:4px">
        尚無外包名單資料。
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:8px" x-show="(dispatchForm.personnel||[]).length">
        <span style="font-size:13px;font-weight:600;font-family:LINE Seed TW_OTF, sans-serif;color:var(--text-secondary)">
          外包人員小計：NT$ <span x-text="_dispatchPersonnelTotal().toLocaleString()"></span>
        </span>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:6px;padding-top:8px;border-top:1px solid var(--border-light)">
        <span style="font-size:14px;font-weight:700;font-family:LINE Seed TW_OTF, sans-serif;color:var(--accent)">
          派發總成本：NT$ <span x-text="_dispatchGrandTotal().toLocaleString()"></span>
        </span>
      </div>

      <!-- Notes -->
      <div style="margin-top:14px">
        <label style="font-size:11px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:4px">備注</label>
        <textarea x-model="dispatchForm.notes" rows="2" placeholder="合作條件、特殊備注…"
                  style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;outline:none;resize:vertical;box-sizing:border-box"></textarea>
      </div>
      <div x-show="dispatchMsg" style="color:var(--danger);font-size:12px;margin-top:8px" x-text="dispatchMsg"></div>
    </div>
    <!-- Footer -->
    <div style="padding:12px 20px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:10px">
      <button @click="showDispatchModal=false"
              style="padding:7px 16px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:var(--font-zh);background:#fff;cursor:pointer">取消</button>
      <button @click="saveDispatch()" :disabled="dispatchSaving"
              style="padding:7px 18px;border:none;border-radius:7px;font-size:13px;font-family:var(--font-zh);background:var(--accent);color:#fff;cursor:pointer;font-weight:600"
              x-text="dispatchSaving ? '儲存中…' : '儲存派發紀錄'"></button>
    </div>
  </div>
</div>

<!-- ── 收款沖銷 申請/駁回原因 Modal ── -->
<div x-show="writeoffModal.open" x-cloak
     style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px"
     @click.self="writeoffModal.open=false"
     @keydown.escape.window="writeoffModal.open=false">
  <div style="background:#fff;border-radius:12px;width:100%;max-width:420px;box-shadow:0 16px 48px rgba(0,0,0,.22)">
    <div style="display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border-light);gap:10px">
      <span style="font-size:14px;font-weight:700;flex:1;font-family:var(--font-zh)"
            x-text="writeoffModal.mode==='reject' ? '駁回沖銷申請' : '申請款項沖銷（稅額歸零）'"></span>
      <button @click="writeoffModal.open=false" style="width:28px;height:28px;border:none;background:#F0EEE9;border-radius:5px;cursor:pointer;font-size:16px">×</button>
    </div>
    <div style="padding:18px 20px">
      <div x-show="writeoffModal.mode==='request'" style="font-size:12px;color:var(--text-secondary);margin-bottom:10px;line-height:1.6">
        沖銷生效後，此筆收款不再計入應稅／應開發票金額，需經最高管理者核准才會生效。
      </div>
      <label style="font-size:11px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:4px" x-text="writeoffModal.mode==='reject' ? '駁回原因（必填）' : '沖銷原因（必填，例如：客戶為私人用戶，無需開立發票）'"></label>
      <textarea x-model="writeoffModal.reason" rows="3"
                style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;outline:none;box-sizing:border-box;resize:vertical"></textarea>
      <div x-show="writeoffModal.msg" style="color:var(--danger);font-size:12px;margin-top:6px" x-text="writeoffModal.msg"></div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--border-light)">
      <button @click="writeoffModal.open=false"
              style="padding:7px 16px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:var(--font-zh);background:#fff;cursor:pointer">取消</button>
      <button @click="submitWriteoffModal()" :disabled="!writeoffModal.reason.trim()"
              style="padding:7px 18px;border:none;border-radius:7px;font-size:13px;font-family:var(--font-zh);color:#fff;cursor:pointer;font-weight:600"
              :style="writeoffModal.mode==='reject' ? 'background:var(--danger)' : 'background:var(--accent)'"
              x-text="writeoffModal.mode==='reject' ? '確認駁回' : '送出申請'"></button>
    </div>
  </div>
</div>

<!-- ── 出貨單新增／編輯 Modal ── -->
<div x-show="showShippingModal" x-cloak
     style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px"
     @click.self="showShippingModal=false"
     @keydown.escape.window="showShippingModal=false">

      <span style="font-size:14px;font-weight:700;flex:1;font-family:var(--font-zh)"
            x-text="editShippingNoteNo ? '編輯出貨單' : '新增出貨單'"></span>
      <button @click="showShippingModal=false" style="width:28px;height:28px;border:none;background:#F0EEE9;border-radius:5px;cursor:pointer;font-size:16px">×</button>
    </div>

          <label style="font-size:11px;font-weight:500;color:var(--text-secondary);display:block;margin-bottom:4px">出貨日期</label>
          <input type="date" x-model="shippingForm.ship_date"

            <th style="text-align:left;padding:4px 6px;font-weight:500;width:100px">廠牌 / 型號</th>
            <th style="text-align:right;padding:4px 6px;font-weight:500;width:55px">數量</th>
