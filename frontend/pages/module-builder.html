<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{if(localStorage.getItem('motrix_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/api/system/branding/favicon">
  <title>模組建構器 — MOTRIX 專案管理系統</title>
  <script src="../static/auth-guard.js"></script>
  <script defer src="../static/vendor/alpine-3.17.1.min.js"></script>
  <link rel="stylesheet" href="../css/style.css?v=20260805g">
  <link rel="stylesheet" href="../css/custom-form.css">
  <link rel="stylesheet" href="../css/module-builder.css">
  <!--
    自訂模組建構器（CUSTOMIZATION-SPEC §8.1、§3.7；P8 前端）。僅超級管理員。
    步驟：① 基本 ② 表單 ④ 流程 ⑤ 輸出 ⑥ 發布（2026-09-27 使用者第二輪：原本的 ② 欄位＋③ 版面合成 ② 表單——畫布就是表單本身，
    欄位直接拖進區塊；步驟編號 4～6 不變）。
    - 定義存在定義文件庫（kind＝custom_module）：每次修改自動存成草稿（PUT …/draft），發布前看差異，發布後可還原任一版。
    - 🔴 只從能力目錄（GET /api/custom-modules/catalog）挑：欄位型別、公式函式、參照對象、日期格式、資料分類、輸出積木
      與其參數規格（outputBlockSpecs／outputBlockItemSpecs ⇒ ⑤ 的參數表單）、主題、欄位格式、輸出格式、簽核人來源（④）。
      目錄沒有提供的東西，畫面上不出現；前端不留後備清單。
    - 首頁列出全部模組（GET /api/definitions/custom_module，含只有草稿的），可刪草稿（二次確認）。
    - 版面（區塊與順序，② 表單）存在定義的 `ui` 鍵（引擎不讀），規則與編輯操作在 custom-layout.js（執行頁共用；P9 排版器抽離）；
      畫布欄位的外觀用執行頁同一套 class（css/custom-form.css）。
    - 伺服器回的問題（problems[{path}]）依 path 標回對應的步驟與欄位。
  -->
</head>
<body x-data="moduleBuilderPage()" x-init="init()" x-cloak>
  <header id="app-topbar" class="topbar"></header>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="app-sidebar"></aside>
  <main class="mb-main">
    <div class="mb-wrap">
      <div class="pg">
        <div class="pg__l">
          <div class="pg__eyebrow">系統設定</div>
          <h1 class="pg__t">模組建構器</h1>
          <p class="pg__s">在網站上建立自訂模組：欄位、版面、流程與簽核、輸出都從系統提供的目錄挑選，不需要改程式。每次修改自動存成草稿；發布後產生不可變的版本，已建立的單據維持建立當時的版本。</p>
        </div>
      </div>

      <div class="mb-err" id="mb-error" x-show="errMsg" x-text="errMsg"></div>

      <!-- 選擇模組 -->
      <!-- 新模組：先從範本開始（也可空白）；套用後與範本脫鉤，可自由修改 -->
      <template x-if="ready && !key && tplChoice">
        <div class="mb-card" id="mb-tpl-pick">
          <h3>建立「<span x-text="tplKey"></span>」：從範本開始</h3>
          <div class="mb-hint">範本是一份預填好的草稿（欄位、區塊、明細表、簽核、輸出版型）；選了之後可以自由修改，不會再跟範本連動。</div>
          <div class="mb-tpl">
            <button class="mb-tpl__c" id="mb-tpl-blank" :disabled="tplBusy" @click="chooseTemplate(null)">
              <strong>空白</strong><span>從沒有欄位的空白表單開始</span>
            </button>
            <template x-for="t in templates()" :key="t.key">
              <button class="mb-tpl__c" :data-template="t.key" :disabled="tplBusy" @click="chooseTemplate(t.key)">
                <strong x-text="t.name"></strong><span x-text="t.description"></span>
                <span x-show="t.note" x-text="t.note" style="margin-top:4px;color:var(--text-dim)"></span>
              </button>
            </template>
          </div>
          <div class="mb-row" style="margin-top:12px"><button class="mb-chipbtn" id="mb-tpl-cancel" @click="cancelTemplate()">取消</button></div>
        </div>
      </template>

      <template x-if="ready && !key && !tplChoice">
        <div class="mb-card" id="mb-pick">
          <h3>開啟或建立模組</h3>
          <div class="mb-row">
            <input class="mb-in mb-in-s" id="mb-key" x-model.trim="keyInput" placeholder="模組代號（例：equipment_loan）" style="min-width:260px" @keydown.enter="openKey(keyInput)">
            <button class="btn btn-primary" id="mb-open" @click="openKey(keyInput)">開啟／建立</button>
          </div>
          <div class="mb-hint">代號只能用小寫英文、數字與底線，英文開頭（2～40 字）；建立後不能改（它是網址與權限的一部分）。</div>
          <div class="mb-bad" x-show="keyErr" x-text="keyErr"></div>
          <!-- 缺口 #5：全部模組（含只有草稿、從未發布的），GET /api/definitions/custom_module -->
          <div style="margin-top:14px" id="mb-module-list" :data-loaded="defsLoaded ? '1' : '0'">
            <div class="mb-hint" x-show="defsLoaded && !defs.length">還沒有任何自訂模組</div>
            <table class="mb-table" x-show="defs.length">
              <thead><tr><th>代號</th><th>名稱</th><th>最新發布</th><th>草稿</th><th>更新時間</th><th></th></tr></thead>
              <tbody>
                <template x-for="m in defs" :key="m.key">
                  <tr :data-def-key="m.key" :data-has-draft="m.hasDraft ? '1' : '0'" :data-latest="m.latestVersion || 0">
                    <td style="font-family:var(--font-en,monospace)" x-text="m.key"></td>
                    <td x-text="moduleName(m.key)"></td>
                    <td x-text="m.latestVersion ? '第 ' + m.latestVersion + ' 版' : '尚未發布'"></td>
                    <td x-text="m.hasDraft ? '有草稿' : '—'"></td>
                    <td x-text="(m.updatedAt || '').replace('T', ' ').slice(0, 16)"></td>
                    <td style="white-space:nowrap">
                      <button class="mb-chipbtn" :data-open-module="m.key" @click="openKey(m.key)">開啟</button>
                      <button class="mb-chipbtn" x-show="m.hasDraft" :data-delete-draft="m.key" @click="deleteDraft(m)" :disabled="busy">刪除草稿</button>
                      <button class="mb-chipbtn" :data-delete-module="m.key" @click="deleteModule(m)" :disabled="busy">刪除模組</button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </template>

      <template x-if="def">
        <div>
          <div class="mb-top" id="mb-top">
            <button class="mb-chipbtn" id="mb-back" @click="closeModule()" aria-label="回到模組清單">← 換一個模組</button>
            <span class="mb-top__name" x-text="def.name || '（未命名）'"></span>
            <span class="mb-top__key" x-text="key"></span>
            <span class="mb-badge" :class="{ 'is-pub': latestVersion }" x-text="latestVersion ? '已發布 v' + latestVersion : '設計中'"></span>
            <span class="mb-badge" id="mb-review-badge" :class="{ 'is-pub': defReview.active }" :title="defReview.active ? '' : defReview.reason" x-text="defReview.active ? '送審：啟用' : '送審：未啟用'"></span>
            <a class="mb-chipbtn" x-show="latestVersion" :href="'custom-records.html?key=' + encodeURIComponent(key)">開啟執行頁</a>
            <nav class="mb-tabs" role="tablist" aria-label="建構頁籤" id="mb-tabs">
              <template x-for="t in [{ id: 'info', l: '作業資訊' }, { id: 'form', l: '表單設計' }, { id: 'flow', l: '流程設計' }]" :key="t.id">
                <button class="mb-tab" role="tab" :class="{ 'is-on': tab === t.id }" :data-tab="t.id" :aria-selected="tab === t.id ? 'true' : 'false'"
                        :data-has-problems="tabProblemCount(t.id) ? '1' : '0'" @click="goTab(t.id)">
                  <span x-text="t.l"></span><span class="bdg" x-show="tabProblemCount(t.id)" x-text="tabProblemCount(t.id)"></span>
                </button>
              </template>
            </nav>
            <span class="mb-save" id="mb-save-state" :data-state="saveState" :data-dirty="dirty ? '1' : '0'" :data-saving="saving ? '1' : '0'"
                  x-text="saveLabel()"></span>
            <button class="btn btn-primary mb-pubbtn" id="mb-publish-open" @click="goStep(6)">發布<span class="bdg" x-show="totalProblemCount()" x-text="totalProblemCount()"></span></button>
          </div>

          <!-- 本步驟的問題（草稿驗證或發布被擋） -->
          <template x-if="tabProblems(tab).length">
            <div class="mb-err mb-probs" id="mb-step-problems">
              <template x-for="(p, pi) in tabProblems(tab)" :key="pi">
                <div :data-problem-path="p.path"><span x-text="(p.path || '（整份）') + '：' + p.message"></span></div>
              </template>
            </div>
          </template>

          <!-- ① 基本 -->
          <section x-show="tab === 'info'" class="mb-card" id="mb-step-1">
            <div class="mb-grid">
              <div class="mb-f" :class="{ 'is-bad': hasProblem('name') }">
                <label for="mb-name">模組名稱</label>
                <input id="mb-name" x-model="def.name" placeholder="例：設備借用單">
              </div>
              <div class="mb-f" x-show="(catalog.icons || []).length">
                <label for="mb-icon">圖示</label>
                <select id="mb-icon" x-model="def.icon">
                  <option value="">（無）</option>
                  <template x-for="ic in (catalog.icons || [])" :key="ic"><option :value="ic" x-text="ic"></option></template>
                </select>
              </div>
              <div class="mb-f">
                <label for="mb-menu-group">選單位置（主選單分組）</label>
                <select id="mb-menu-group" :value="(def.menu || {}).group || DEFAULT_GROUP" @change="setMenu('group', $event.target.value)">
                  <template x-for="g in menuGroups" :key="g"><option :value="g" x-text="g" :selected="g === ((def.menu || {}).group || DEFAULT_GROUP)"></option></template>
                </select>
                <div class="mb-hint">分組取自目前的主選單；選「自訂模組」會另開一組。</div>
              </div>
              <div class="mb-f">
                <label for="mb-menu-order">選單排序（小的在前）</label>
                <input id="mb-menu-order" type="number" :value="(def.menu || {}).order" @input="setMenu('order', $event.target.value === '' ? null : Number($event.target.value))">
              </div>
<div class="mb-f" data-vis="menu">
                <label>誰看得到</label>
                <div class="mb-hint" data-vis-summary x-text="visSummary('menu')"></div>
                <div class="cr-opts">
                  <template x-for="r in (catalog.roles || [])" :key="r">
                    <label><input type="checkbox" style="width:auto" :data-vis-role="r" :checked="visHas('menu', 'roles', r)" @change="toggleVis('menu', 'roles', r, $event.target.checked)"><span x-text="roleLabel(r)"></span></label>
                  </template>
                </div>
                <details style="margin-top:4px"><summary class="mb-hint" style="cursor:pointer">指定人員</summary>
                  <div class="cr-opts" style="max-height:150px;overflow:auto">
                    <template x-for="u in users" :key="u.username">
                      <label><input type="checkbox" style="width:auto" :data-vis-user="u.username" :checked="visHas('menu', 'users', u.username)" @change="toggleVis('menu', 'users', u.username, $event.target.checked)"><span x-text="u.displayName || u.username"></span></label>
                    </template>
                  </div>
                </details>
              </div>
              <div class="mb-f" :class="{ 'is-bad': hasProblem('permission') }">
                <label for="mb-perm">權限 key</label>
                <input id="mb-perm" x-model.trim="def.permission">
                <div class="mb-hint">使用者的模組權限裡有這個 key 才看得到；簽核人不需要。預設 custom.&lt;代號&gt;。</div>
              </div>
            </div>
            <h3 style="margin-top:16px">編號規則</h3>
            <div class="mb-grid">
              <div class="mb-f" :class="{ 'is-bad': hasProblem('numbering.prefix') }">
                <label for="mb-prefix">前綴</label>
                <input id="mb-prefix" :value="def.numbering.prefix" @input="def.numbering.prefix = $event.target.value.toUpperCase()" placeholder="例：EL">
              </div>
              <div class="mb-f" :class="{ 'is-bad': hasProblem('numbering.date') }">
                <label for="mb-date">日期</label>
                <select id="mb-date" x-model="def.numbering.date">
                  <template x-for="d in (catalog.numberingDateFormats || [])" :key="d">
                    <option :value="d" x-text="dateLabel(d)" :selected="d === def.numbering.date"></option>
                  </template>
                </select>
              </div>
              <div class="mb-f" :class="{ 'is-bad': hasProblem('numbering.digits') }">
                <label for="mb-digits">流水號位數</label>
                <input id="mb-digits" type="number" min="3" max="8" x-model.number="def.numbering.digits">
              </div>
              <div class="mb-f">
                <label>預覽</label>
                <div class="mb-fx" id="mb-num-example" :data-example="numExample" x-text="numExample || '—'"></div>
                <template x-for="(p, pi) in numProblems" :key="pi"><div class="mb-bad" x-text="p.message"></div></template>
              </div>
            </div>
          </section>

          <!-- ② 表單（使用者 2026-09-27 第二輪：「預覽都在同一個頁面，直接放入」）：欄位與版面合成一步，中間的畫布就是表單本身——
               從工具列拖進某個區塊的某個位置；區塊可以新增、改名、拖曳排序；點欄位就地改屬性。
               欄位外觀沿用執行頁同一套 class 與標記（css/custom-form.css），畫布與執行頁一致有題。右側同時顯示輸出與列表預覽。 -->
          <section x-show="tab === 'form'" id="mb-step-2" class="mb3">
            <div class="mb3__bar">
              <div class="mb-seg" role="tablist" aria-label="編輯或預覽" id="mb-mode">
                <button role="tab" id="mb-mode-edit" :class="{ 'is-on': formMode === 'edit' }" :aria-selected="formMode === 'edit' ? 'true' : 'false'" @click="setFormMode('edit')">✎ 編輯</button>
                <button role="tab" id="mb-mode-preview" :class="{ 'is-on': formMode === 'preview' }" :aria-selected="formMode === 'preview' ? 'true' : 'false'" @click="setFormMode('preview')">👁 預覽</button>
              </div>
              <span class="mb-hint" x-show="formMode === 'preview'" style="margin:0">這是使用者填單的樣子（試填不會存檔）</span>
              <span class="grow"></span>
              <button class="mb-chipbtn mb3__pal-open" id="mb-pal-open" @click="palOpen = !palOpen; sideOpen = false">＋ 元件</button>
              <button class="mb-chipbtn mb3__side-open" id="mb-side-open" @click="sideOpen = !sideOpen; palOpen = false">屬性</button>
              <button class="mb-chipbtn" id="mb-form-settings" @click="sel = null; sideTab = 'props'; sideOpen = true">⚙ 表單設定</button>
            </div>
            <div class="mb3__grid" :data-mode="formMode" :data-pal-open="palOpen ? '1' : '0'" :data-side-open="sideOpen ? '1' : '0'">
              <!-- 左：元件列（目錄 fieldElements／elementGroups；分組可收合、可搜尋） -->
              <aside class="mb-pal mb3__pal" id="mb-palette" aria-label="元件列">
                <input class="mb-pal__q" id="mb-palette-q" type="search" x-model="paletteQuery" placeholder="搜尋元件…" aria-label="搜尋元件">
                <div class="mb-pal__t">拖進表單，或按 Enter／點一下加到目前的區塊</div>
                <template x-for="g in paletteGroups()" :key="g.id">
                  <div :data-palette-group="g.id">
                    <button class="mb-pal__g" :aria-expanded="groupClosed[g.id] ? 'false' : 'true'" @click="toggleGroup(g.id)">
                      <span x-text="g.label"></span><span x-text="groupClosed[g.id] ? '⌄' : '⌃'" aria-hidden="true"></span>
                    </button>
                    <template x-if="!groupClosed[g.id]">
                      <div>
                        <template x-for="e in g.items" :key="e.id">
                          <button class="mb-pal__i" draggable="true" :data-palette-element="e.id" :data-palette-type="isPrimaryElement(e) ? e.type : null"
                                  :aria-label="'加入元件：' + e.label"
                                  @dragstart="$event.dataTransfer.setData('text/plain', 'element:' + e.id)" @click="addElementHere(e.id); palOpen = false">
                            <span x-html="typeIcon(e.type)"></span><span x-text="e.label"></span>
                          </button>
                        </template>
                      </div>
                    </template>
                  </div>
                </template>
                <div class="mb-hint" x-show="!paletteGroups().length">沒有符合的元件</div>
              </aside>

              <!-- 中：畫布＝表單本身（與執行頁同一套 class 與標記）；預覽模式就地切成填單視角 -->
              <div class="mb3__center">
                <div class="mb-canvas" id="mb-canvas" :class="{ 'is-over': dragOver, 'is-preview': formMode === 'preview' }" :data-mode="formMode"
                     @dragover.prevent="dragOver = formMode === 'edit'" @dragleave.self="dragOver = false" @drop.prevent="formMode === 'edit' && dropOn($event, -1, null)">
                  <div class="mb-hint" x-show="!def.fields.length && formMode === 'edit'">把左邊的元件拖到這裡</div>
                  <h2 class="mb-canvas__title" style="font-size:18px;margin:4px 0 8px" x-text="def.name || '（未命名的表單）'"></h2>
                  <template x-for="(sec, si) in L.editorSections(def)" :key="'g' + sec.gi">
                    <div class="cr-sec mb-sec" :data-section-group="sec.gi" :data-group-index="sec.gi >= 0 ? sec.gi : null"
                         x-show="formMode === 'edit' || sec.items.length"
                         :data-empty="sec.items.length ? '0' : '1'" role="list" :aria-label="sec.title || (sec.gi >= 0 ? '未命名區塊' : '表單')"
                         @dragover.prevent.stop="dragOver = formMode === 'edit'" @drop.prevent.stop="formMode === 'edit' && dropOn($event, sec.gi, null)">
                      <template x-if="sec.gi >= 0 && formMode === 'edit'">
                        <div class="mb-sec__h">
                          <span class="h" draggable="true" title="拖曳調整區塊順序（鍵盤：↑／↓ 按鈕）" aria-hidden="true"
                                @dragstart="$event.dataTransfer.setData('text/plain', 'group:' + sec.gi)">⠿</span>
                          <input class="mb-in" :data-group-title="sec.gi" :value="sec.title" placeholder="區塊標題（例：借用資訊）" aria-label="區塊標題"
                                 @change="def.ui = L.renameGroup(def, sec.gi, $event.target.value)">
                          <select class="mb-in mb-in-s" :data-group-columns="sec.gi" :value="String(groupColumns(sec.gi))" aria-label="這個區塊一列幾欄"
                                  @change="setGroupColumns(sec.gi, $event.target.value)">
                            <option value="0">欄數：自動</option><option value="1">1 欄</option><option value="2">2 欄</option><option value="3">3 欄</option><option value="4">4 欄</option>
                          </select>
                          <button class="mb-ib" aria-label="區塊上移" @click="moveGroupBy(sec.gi, -1)">↑</button>
                          <button class="mb-ib" aria-label="區塊下移" @click="moveGroupBy(sec.gi, 1)">↓</button>
                          <button class="mb-ib" aria-label="刪除區塊" :data-remove-group="sec.gi" @click="removeGroupAt(sec.gi)">✕</button>
                        </div>
                      </template>
                      <div class="cr-sec__t" x-show="(sec.gi < 0 || formMode === 'preview') && sec.title" x-text="sec.title"></div>
                      <div class="cr-grid" :class="{ 'cr-grid--n': groupColumns(sec.gi) }" :style="gridStyle(sec.gi)">
                        <template x-for="it in sec.items" :key="it.key + ':' + it.index">
                          <div class="cr-f mb-fc" :class="{ 'is-sel': sel === it.index && formMode === 'edit', 'is-bad': hasProblem('fields[' + it.index + ']'),
                                                            'cr-f--wide': it.f.type === 'table' || it.f.type === 'textarea' }"
                               :data-field-index="it.index" :data-field-key="it.key" :tabindex="formMode === 'edit' ? 0 : -1" role="listitem"
                               :aria-label="(it.f.label || '（未命名）') + '，' + typeLabel(it.f.type) + '，' + (sec.title ? '「' + sec.title + '」' : '') + '第 ' + (it.pos + 1) + ' 個'"
                               @dragover.prevent.stop="dragOver = formMode === 'edit'" @drop.prevent.stop="formMode === 'edit' && dropOn($event, sec.gi, it.key)"
                               @click="formMode === 'edit' && selectField(it.index)"
                               @keydown.self.alt.up.prevent="moveFieldKb(it.index, -1)" @keydown.self.alt.down.prevent="moveFieldKb(it.index, 1)"
                               @keydown.self.delete.prevent="removeFieldKb(it.index)" @keydown.self.enter.prevent="selectField(it.index)"
                               @keydown.escape="if (sel === it.index) { sel = null; $el.focus() }">
                            <div class="mb-fc__bar" x-show="formMode === 'edit'">
                              <span class="h" draggable="true" title="拖曳（鍵盤：Alt＋↑／↓；到區塊邊界會移到相鄰區塊）" aria-hidden="true"

                              <select id="mb-f-fin-date" :value="fin(def.fields[sel]).dateField || ''" @change="setFin(sel, 'dateField', $event.target.value)">
                                <option value="">（入帳當日）</option><template x-for="d in fieldsOfType(['date'])" :key="d.key"><option :value="d.key" x-text="d.label || d.key" :selected="d.key === fin(def.fields[sel]).dateField"></option></template>
                              </select>
                              <label style="margin-top:6px">現金日期欄（選填；例：收款日）</label>
                              <select id="mb-f-fin-cashdate" :value="fin(def.fields[sel]).cashDateField || ''" @change="setFin(sel, 'cashDateField', $event.target.value)">
                                <option value="">（同歸屬日期）</option><template x-for="d in fieldsOfType(['date'])" :key="d.key"><option :value="d.key" x-text="d.label || d.key" :selected="d.key === fin(def.fields[sel]).cashDateField"></option></template>
                              </select>
                              <label style="margin-top:6px">現金口徑金額欄（選填；例：含稅合計）</label>
                              <select id="mb-f-fin-cashamt" :value="fin(def.fields[sel]).cashAmountField || ''" @change="setFin(sel, 'cashAmountField', $event.target.value)">
                                <option value="">（同這個欄位）</option><template x-for="d in fieldsOfType(['number','formula'], def.fields[sel].key)" :key="d.key"><option :value="d.key" x-text="d.label || d.key" :selected="d.key === fin(def.fields[sel]).cashAmountField"></option></template>
                              </select>
                              <label style="margin-top:6px">關聯案件欄（選填；填案件單號 ⇒ 進該案件成本）</label>
                              <select id="mb-f-fin-case" :value="fin(def.fields[sel]).caseField || ''" @change="setFin(sel, 'caseField', $event.target.value)">
                                <option value="">（不關聯案件）</option><template x-for="d in fieldsOfType(['text','ref'])" :key="d.key"><option :value="d.key" x-text="d.label || d.key" :selected="d.key === fin(def.fields[sel]).caseField"></option></template>
                              </select>
                              <div class="mb-hint">單據核准（進入「入帳狀態」）後進營運報表；作廢／退回自動撤回。入帳狀態在「流程設計」設定。</div>
                            </div>
                          </template>
                        </div>
                      </template>
                      <div class="mb-f" :class="{ 'is-bad': hasProblem('fields[' + sel + '].dataClass') }">
                        <label for="mb-f-dataclass">資料分類</label>
                        <select id="mb-f-dataclass" x-model="def.fields[sel].dataClass">
                          <template x-for="c in (catalog.dataClasses || [])" :key="c"><option :value="c" x-text="c" :selected="c === def.fields[sel].dataClass"></option></template>
                        </select>
                        <div class="mb-hint">自訂模組目前只收 T1；個資（F2）分流接上前不提供。</div>
                      </div>
                      <template x-for="(p, pi) in problemsUnder('fields[' + sel + ']')" :key="pi">
                        <div class="mb-bad" x-text="p.message"></div>
                      </template>
                      <div class="mb-row" style="margin-top:8px">
                        <button class="btn btn-ghost btn-sm" @click="duplicateField(sel)">複製這個欄位</button>
                        <button class="btn btn-ghost btn-sm" @click="removeField(sel)">刪除</button>
                      </div>
                    </div>
                  </template>
                  <template x-if="sel === null">
                    <div class="mb-props mb-props--side" id="mb-form-settings-pane">
                      <div class="mb-props__t">表單設定</div>
                      <div class="mb-f"><label>名稱</label><div class="mb-fx" x-text="def.name || '（未命名）'"></div></div>
                      <div class="mb-hint">點畫布上的欄位就會在這裡編輯它的屬性。模組名稱、圖示、選單位置、編號規則與輸出版型在「作業資訊」頁籤；區塊可以用區塊標題旁的下拉選 1～4 欄（網格）。</div>
                      <button class="btn btn-ghost btn-sm" style="margin-top:8px" @click="goTab('info')">到作業資訊</button>
                    </div>
                  </template>
                </div>
                <div x-show="sideTab === 'output'" id="mb-output-pane">
                  <div class="mb-pv__t">輸出預覽（拖入、修改時跟著更新）</div>
                  <div class="mb-pv__host" id="mb-output-host" x-effect="syncPreviews(JSON.stringify(def), sel, tab === 'form' ? 2 : 0)"></div>
                </div>
                <div x-show="sideTab === 'list'" id="mb-list-pane">
                  <details class="mb-pv__list" id="mb-list-pv" open>
                    <summary class="mb-pv__t">列表預覽與列表欄位</summary>
                    <div id="mb-list-host"></div>
                    <div class="mb-hint" style="margin-top:6px">列表顯示的欄位：</div>
                    <template x-for="c in L.availableColumns(def)" :key="c.key">
                      <label class="mb-chip"><input type="checkbox" :data-list-column="c.key" :checked="listColumnKeys().indexOf(c.key) >= 0"
                             @change="def.ui = L.toggleColumn(def, c.key)"> <span x-text="c.label"></span></label>
                    </template>
                    <div class="mb-hint" style="margin-top:6px">順序：</div>
                    <template x-for="(c, ci) in L.listColumns(def)" :key="c.key">
                      <span class="mb-chip"><span x-text="c.label"></span>
                        <button class="mb-ib" aria-label="往前" @click="def.ui = L.moveColumn(def, ci, -1)">←</button>
                        <button class="mb-ib" aria-label="往後" @click="def.ui = L.moveColumn(def, ci, 1)">→</button></span>
                    </template>
                  </details>
                </div>
                <div class="mb-hint" id="mb-preview-missing" x-show="previewMissing">預覽元件尚未載入（form-preview.js）；欄位照樣可以編輯與儲存。</div>
              </aside>
            </div>
            <div class="mb-sr" aria-live="polite" id="mb-live" x-text="liveMsg"></div>
          </section>

          <!-- ④ 流程 -->
          <section x-show="tab === 'flow'" id="mb-step-4">
            <!-- 金流入帳狀態：有欄位設了金流性質（收入／支出）才需要；預設由簽核核准後的終態推導 -->
            <div class="mb-card" id="mb-sec-finance" x-show="financeFieldExists()">
              <h3>入帳狀態（金流）</h3>
              <div class="mb-hint">有欄位設了「金流性質」（收入／支出）。單據進入下列狀態才進營運報表與案件成本；離開（作廢、退回）自動撤回。</div>
              <div class="mb-hint" x-show="!postStateList().length">
                目前未指定：預設用簽核核准後的狀態（<span x-text="postStatesDerived().join('、') || '沒有——請指定'"></span>）。
              </div>
              <template x-for="st in def.workflow.states" :key="st.key">
                <label class="mb-chip"><input type="checkbox" :data-post-state="st.key" :checked="postStateList().indexOf(st.key) >= 0"
                       @change="togglePostState(st.key, $event.target.checked)"> <span x-text="st.label || st.key"></span></label>
              </template>
              <template x-for="(p, pi) in problemsUnder('finance')" :key="pi"><div class="mb-bad" x-text="p.message"></div></template>
            </div>
            <div class="mb-card" id="mb-sec-workflow">
              <div class="mb-row">
                <h3 style="margin:0">狀態</h3>
                <div class="mb-f" style="margin-left:auto;min-width:200px" :class="{ 'is-bad': hasProblem('workflow.initial') }">
                  <label for="mb-wf-initial">起始狀態</label>
                  <select id="mb-wf-initial" x-model="def.workflow.initial">
                    <template x-for="s in def.workflow.states" :key="s.key"><option :value="s.key" x-text="s.label + '（' + s.key + '）'" :selected="s.key === def.workflow.initial"></option></template>
                  </select>
                </div>
              </div>
              <table class="mb-table" id="mb-states">
                <thead><tr><th>代號</th><th>名稱</th><th>終點</th><th id="mb-sec-notify">進入時通知申請人</th><th>進入時通知</th><th>簽核</th><th></th></tr></thead>
                <tbody>
                  <template x-for="(s, si) in def.workflow.states" :key="si">
                    <tr :data-state-index="si" :data-state-key="s.key" :class="{ 'is-bad': hasProblemExact('workflow.states[' + si + ']') || hasProblem('workflow.states[' + si + '].key') || hasProblem('workflow.states[' + si + '].label') }">
                      <td><input class="mb-in" data-k="key" :value="s.key" @change="renameState(si, $event.target.value.trim())" style="width:110px"></td>
                      <td><input class="mb-in" data-k="label" x-model="s.label" style="width:110px"></td>
                      <td>
                        <select class="mb-in" data-k="final" x-model.boolean="s.final" style="width:70px">
                          <option value="false">否</option><option value="true">是</option>
                        </select>
                      </td>
                      <td>
                        <select class="mb-in" data-k="notify-requester" :value="(s.notify && s.notify.requester) ? 'true' : 'false'"
                                @change="setNotify(si, 'requester', $event.target.value === 'true')" style="width:70px">
                          <option value="false">否</option><option value="true">是</option>
                        </select>
                      </td>
                      <td>
                        <template x-for="u in ((s.notify && s.notify.users) || [])" :key="u">
                          <span class="mb-chip"><span x-text="userLabel(u)"></span><button class="mb-ib" @click="removeNotifyUser(si, u)">✕</button></span>
                        </template>
                        <select class="mb-in mb-in-s" data-k="notify-add" @change="addNotifyUser(si, $event.target.value); $event.target.value = ''">
                          <option value="">＋ 通知對象</option>
                          <template x-for="u in users" :key="u.username"><option :value="u.username" x-text="u.displayName + '（' + u.username + '）'"></option></template>
                        </select>
                      </td>
                      <td>
                        <select class="mb-in" data-k="has-approval" :value="s.approval ? 'true' : 'false'" @change="toggleApproval(si, $event.target.value === 'true')" style="width:90px">
                          <option value="false">無</option><option value="true">分層簽核</option>
                        </select>
                      </td>
                      <td><button class="mb-ib" @click="removeState(si)">✕</button></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <div class="mb-row" style="margin-top:8px">
                <button class="btn btn-ghost btn-sm" id="mb-add-state" @click="addState()">＋ 狀態</button>
              </div>

              <!-- 各簽核狀態的層 -->
              <div id="mb-sec-approval" class="mb-hint" style="margin-top:12px;font-weight:700">簽核（在上表把狀態設成「分層簽核」後，各層在這裡設定）</div>
              <template x-for="(s, si) in def.workflow.states" :key="'ap' + si">
                <template x-if="s.approval">
                  <div class="mb-sub" :data-approval-state="si">
                    <div class="mb-row">
                      <strong x-text="'「' + (s.label || s.key) + '」的簽核'"></strong>
                      <span class="mb-f" style="min-width:160px" :class="{ 'is-bad': hasProblem('workflow.states[' + si + '].approval.on_approved') }">
                        <label>全部通過後</label>
                        <select class="mb-in" data-k="on-approved" x-model="s.approval.on_approved">
                          <option value="">（請選擇）</option>
                          <template x-for="t in def.workflow.states" :key="t.key"><option :value="t.key" x-text="t.label" :selected="t.key === s.approval.on_approved"></option></template>
                        </select>
                      </span>
                      <span class="mb-f" style="min-width:160px" :class="{ 'is-bad': hasProblem('workflow.states[' + si + '].approval.on_rejected') }">
                        <label>退回後</label>
                        <select class="mb-in" data-k="on-rejected" x-model="s.approval.on_rejected">
                          <option value="">（請選擇）</option>
                          <template x-for="t in def.workflow.states" :key="t.key"><option :value="t.key" x-text="t.label" :selected="t.key === s.approval.on_rejected"></option></template>
                        </select>
                      </span>
                    </div>
                    <template x-for="(tier, ti) in s.approval.tiers" :key="ti">
                      <div class="mb-tier" :data-tier-index="ti" :class="{ 'is-bad': hasProblem('workflow.states[' + si + '].approval.tiers[' + ti + ']') }">
                        <div class="mb-row">
                          <strong x-text="'第 ' + (ti + 1) + ' 層'"></strong>
                          <button class="mb-ib" style="margin-left:auto" @click="s.approval.tiers.splice(ti, 1)">刪除這一層</button>
                        </div>
                        <template x-for="(a, ai) in tier.approvers" :key="ai">
                          <div class="mb-row" style="margin-top:5px" :data-approver-index="ai">
                            <select class="mb-in mb-in-s" data-k="approver-kind" :value="approverKind(a)" @change="tier.approvers.splice(ai, 1, newApprover($event.target.value))">
                              <template x-for="k in approverSources()" :key="k.value"><option :value="k.value" x-text="k.label" :selected="k.value === approverKind(a)"></option></template>
                            </select>
                            <template x-if="approverParams(a).indexOf('username') >= 0">
                              <select class="mb-in mb-in-s" data-k="approver-user" :value="a.username || ''" @change="setApproverUser(tier, ai, $event.target.value)">
                                <option value="">（選擇帳號）</option>
                                <template x-for="u in users" :key="u.username"><option :value="u.username" x-text="u.displayName + '（' + u.username + '）'" :selected="u.username === a.username"></option></template>
                              </select>
                            </template>
                            <template x-if="approverParams(a).indexOf('departmentId') >= 0">
                              <select class="mb-in mb-in-s" :value="a.departmentId || ''" @change="a.departmentId = Number($event.target.value) || null">
                                <option value="">（選擇部門）</option>
                                <template x-for="d in departments()" :key="d.id"><option :value="d.id" x-text="d.label" :selected="d.id === a.departmentId"></option></template>
                              </select>
                            </template>
                            <template x-if="approverParams(a).indexOf('divisionId') >= 0">
                              <select class="mb-in mb-in-s" :value="a.divisionId || ''" @change="a.divisionId = Number($event.target.value) || null">
                                <option value="">（選擇處）</option>
                                <template x-for="d in orgTree" :key="d.id"><option :value="d.id" x-text="d.name" :selected="d.id === a.divisionId"></option></template>
                              </select>
                            </template>
                            <template x-for="pp in approverParams(a).filter(function (x) { return ['username', 'departmentId', 'divisionId'].indexOf(x) < 0 })" :key="pp">
                              <input class="mb-in mb-in-s" type="number" :data-k="'approver-' + pp" :placeholder="pp" :value="a[pp] === undefined || a[pp] === null ? '' : a[pp]"
                                     @input="a[pp] = $event.target.value === '' ? null : Number($event.target.value)">
                            </template>
                            <button class="mb-ib" @click="tier.approvers.splice(ai, 1)">✕</button>
                          </div>
                        </template>
                        <button class="mb-ib" style="margin-top:5px" data-k="add-approver" @click="tier.approvers.push(newApprover('user'))">＋ 簽核人</button>
                        <div class="mb-f" style="margin-top:6px" :class="{ 'is-bad': hasProblem('workflow.states[' + si + '].approval.tiers[' + ti + '].when') || (whenProblems[si + ':' + ti] || []).length }">
                          <label>條件（空白＝一律要簽；條件明確不成立時這一層略過）</label>
                          <input class="mb-in" data-k="when" :value="tier.when || ''" placeholder="例：total > 10000" style="font-family:var(--font-en,monospace)"
                                 @input="setWhen(tier, $event.target.value); queueWhenCheck(si, ti)">
                          <div class="mb-hint" data-when-failsafe>條件算不出來（空值或出錯）時，這一層照樣要簽核。</div>
                          <div :data-when-state="whenState[si + ':' + ti] || ''">
                            <template x-for="(p, pi) in (whenProblems[si + ':' + ti] || [])" :key="pi">
                              <div :data-pos="p.pos"><div class="mb-fx"><span x-text="tier.when"></span>
<span class="caret" x-text="' '.repeat(Math.max(0, p.pos)) + '^'"></span></div>
                                <div class="mb-bad" x-text="'第 ' + (p.pos + 1) + ' 字：' + p.message"></div></div>
                            </template>
                          </div>
                        </div>
                      </div>
                    </template>
                    <button class="btn btn-ghost btn-sm" style="margin-top:6px" data-k="add-tier" @click="s.approval.tiers.push({ approvers: [newApprover('user')] })">＋ 簽核層</button>
                  </div>
                </template>
              </template>
            </div>

            <div class="mb-card">
              <h3>轉換（按鈕）</h3>
              <table class="mb-table" id="mb-transitions">
                <thead><tr><th>代號</th><th>按鈕名稱</th><th>從</th><th>到</th><th>只有申請人可以按</th><th></th></tr></thead>
                <tbody>
                  <template x-for="(t, ti) in def.workflow.transitions" :key="ti">
                    <tr :data-transition-index="ti" :class="{ 'is-bad': hasProblem('workflow.transitions[' + ti + ']') }">
                      <td><input class="mb-in" data-k="key" x-model.trim="t.key" style="width:100px"></td>
                      <td><input class="mb-in" data-k="label" x-model="t.label" style="width:100px"></td>
                      <td>
                        <template x-for="s in def.workflow.states" :key="s.key">
                          <label class="mb-chip"><input type="checkbox" :data-from="s.key" :checked="fromList(t).indexOf(s.key) >= 0" @change="toggleFrom(t, s.key)"> <span x-text="s.label"></span></label>
                        </template>
                      </td>
                      <td>
                        <select class="mb-in" data-k="to" x-model="t.to" style="width:110px">
                          <option value="">（請選擇）</option>
                          <template x-for="s in def.workflow.states" :key="s.key"><option :value="s.key" x-text="s.label" :selected="s.key === t.to"></option></template>
                        </select>
                      </td>
                      <td>
                        <select class="mb-in" data-k="requester-only" x-model.boolean="t.requester_only" style="width:70px">
                          <option value="false">否</option><option value="true">是</option>
                        </select>
                      </td>
                      <td><button class="mb-ib" @click="def.workflow.transitions.splice(ti, 1)">✕</button></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <div class="mb-row" style="margin-top:8px">
                <button class="btn btn-ghost btn-sm" id="mb-add-transition" @click="addTransition()">＋ 轉換</button>
              </div>
              <div class="mb-hint" style="margin-top:8px">簽核中的狀態不能用轉換跳過簽核；進入簽核狀態時系統通知第一位簽核人，每過一層通知下一位。每次狀態改變都會發出事件 custom_module.transitioned。</div>
            </div>
          </section>

          <!-- ⑤ 輸出 -->
          <section x-show="tab === 'info'" id="mb-step-5">
            <div class="mb-card">
              <div class="mb-row">
                <label class="mb-chip"><input type="radio" id="mb-out-generic" name="mb-out" :checked="!hasCustomOutput()" @change="useGenericOutput()"> 通用版型（抬頭、編號、狀態、每個欄位一列、簽核欄、頁尾）</label>
                <label class="mb-chip"><input type="radio" id="mb-out-custom" name="mb-out" :checked="hasCustomOutput()" @change="useCustomOutput()"> 指定版型</label>
              </div>
              <template x-if="hasCustomOutput()">
                <div style="margin-top:12px" id="mb-out-editor">
                  <div class="mb-grid">
                    <div class="mb-f" :class="{ 'is-bad': hasProblem('output.template.theme') }">
                      <label for="mb-out-theme">主題</label>
                      <select id="mb-out-theme" x-model="def.output.template.theme">
                        <template x-for="t in outputThemes()" :key="t"><option :value="t" x-text="t" :selected="t === def.output.template.theme"></option></template>
                      </select>
                    </div>
                  </div>
                  <template x-for="(b, bi) in def.output.template.blocks" :key="bi">
                    <div class="mb-tier" :data-block-index="bi" :data-block-type="b.type" :class="{ 'is-bad': hasProblem('output.template.blocks[' + bi + ']') }">
                      <div class="mb-row">
                        <strong x-text="blockLabel(b.type)"></strong>
                        <span style="margin-left:auto"></span>
                        <button class="mb-ib" @click="moveBlock(bi, -1)">↑</button>
                        <button class="mb-ib" @click="moveBlock(bi, 1)">↓</button>
                        <button class="mb-ib" @click="def.output.template.blocks.splice(bi, 1)">✕</button>
                      </div>
                      <!-- 缺口 #4：參數表單依目錄的 outputBlockSpecs／outputBlockItemSpecs 產生（型別 text／int／bool／path／cond／list:<子項>／blocks）；
                           「程式沒有提供」的參數不會出現。子項裡的清單再展開一層（目錄目前最深兩層）。 -->
                      <div class="mb-hint" x-show="blockSpec(b.type).desc" x-text="blockSpec(b.type).desc"></div>
                      <template x-for="pk in paramKeys(blockSpec(b.type).params)" :key="pk">
                        <div class="mb-f" style="margin-top:6px" :data-param="pk" :data-param-type="ps(b.type, pk).type"
                             :class="{ 'is-bad': hasProblem('output.template.blocks[' + bi + '].' + pk) }">
                          <label><span x-text="paramLabel(pk)"></span><span class="mb-bad" x-show="ps(b.type, pk).required"> *</span>
                            <span class="mb-hint" x-show="ps(b.type, pk).desc" x-text="'（' + ps(b.type, pk).desc + '）'"></span></label>
                          <template x-if="isScalar(ps(b.type, pk).type)">
                            <div>
                              <template x-if="ps(b.type, pk).type === 'text' && !isFormatSelect('', pk)">
                                <input class="mb-in mb-in-s" :data-k="pk" :value="val(b, pk)" :placeholder="ps(b.type, pk).desc || ''" @input="setParam(b, pk, $event.target.value, ps(b.type, pk))">
                              </template>
                              <template x-if="ps(b.type, pk).type === 'text' && isFormatSelect('', pk)">
                                <select class="mb-in mb-in-s" :data-k="pk" @change="setParam(b, pk, $event.target.value, ps(b.type, pk))">
                                  <option value="">（預設）</option>
                                  <template x-for="fm in fieldFormats()" :key="fm"><option :value="fm" x-text="formatLabel(fm)" :selected="fm === b[pk]"></option></template>
                                </select>
                              </template>
                              <template x-if="ps(b.type, pk).type === 'int'">
                                <input class="mb-in mb-in-s" type="number" step="1" :data-k="pk" :value="val(b, pk)"
                                       @input="setParam(b, pk, $event.target.value === '' ? null : Math.trunc(Number($event.target.value)), ps(b.type, pk))">
                              </template>
                              <template x-if="ps(b.type, pk).type === 'bool'">
                                <!-- 布林下拉：寫死 value＋x-model.boolean；「（未設定）」＝拿掉這個參數 -->
                                <select class="mb-in mb-in-s" :data-k="pk" x-model.boolean="b[pk]" @change="if (b[pk] === null || b[pk] === undefined) delete b[pk]">
                                  <option value="">（未設定）</option><option value="true">是</option><option value="false">否</option>
                                </select>
                              </template>
                              <template x-if="ps(b.type, pk).type === 'path'">
                                <select class="mb-in mb-in-s" :data-k="pk" @change="setParam(b, pk, $event.target.value, ps(b.type, pk))">
                                  <option value="">（請選擇）</option>
                                  <template x-for="p in viewPaths()" :key="p.value"><option :value="p.value" x-text="p.label" :selected="p.value === b[pk]"></option></template>
                                </select>
                              </template>
                              <template x-if="!isScalar(ps(b.type, pk).type) && !itemName(ps(b.type, pk).type)">
                                <span class="mb-hint" :data-unsupported="pk">（此參數建構器暫不提供編輯；內容會保留）</span>
                              </template>
                            </div>
                          </template>
                          <template x-if="ps(b.type, pk).type === 'cond'">
                            <div class="mb-row" :data-k="pk">
                              <select class="mb-in mb-in-s" data-k="cond-path" @change="setCond(b, pk, 'path', $event.target.value)">
                                <option value="">（不設條件）</option>
                                <template x-for="p in viewPaths()" :key="p.value"><option :value="p.value" x-text="p.label" :selected="p.value === (b[pk] || {}).path"></option></template>
                              </select>
                              <span class="mb-hint">等於</span>
                              <input class="mb-in mb-in-s" data-k="cond-equals" :value="val(b[pk] || {}, 'equals')" @input="setCond(b, pk, 'equals', $event.target.value)">
                            </div>
                          </template>
                          <template x-if="ps(b.type, pk).type === 'list:text'">
                            <textarea class="mb-in" rows="3" :data-k="pk" :value="(b[pk] || []).join('\n')" placeholder="一行一個"
                                      @input="setParam(b, pk, $event.target.value.split('\n').map(s => s.trim()).filter(s => s), ps(b.type, pk))"></textarea>
                          </template>
                          <template x-if="ps(b.type, pk).type === 'blocks'">
                            <div class="mb-hint" :data-nested-blocks="pk" x-text="'巢狀積木 ' + (b[pk] || []).length + ' 個（建構器暫不提供編輯；內容會保留）'"></div>
                          </template>
                          <template x-if="li(b.type, pk)">
                            <div :data-list="pk">
                              <template x-for="(it, ri) in (b[pk] || [])" :key="ri">
                                <div class="mb-sub" :data-item-row="ri">
                                  <div class="mb-row">
                                    <template x-for="ik in paramKeys(itemSpec(li(b.type, pk)))" :key="ik">
                                      <template x-if="!li2(b.type, pk, ik)">
                                        <span class="mb-f" :data-param="ik">
                                          <label><span x-text="paramLabel(ik)"></span><span class="mb-bad" x-show="isp(li(b.type, pk), ik).required"> *</span></label>
                                          <template x-if="isp(li(b.type, pk), ik).type === 'text' && !isFormatSelect(li(b.type, pk), ik)">
                                            <input class="mb-in mb-in-s" :data-k="ik" :value="val(it, ik)" :placeholder="isp(li(b.type, pk), ik).desc || ''" @input="setParam(it, ik, $event.target.value, isp(li(b.type, pk), ik))">
                                          </template>
                                          <template x-if="isp(li(b.type, pk), ik).type === 'text' && isFormatSelect(li(b.type, pk), ik)">
                                            <select class="mb-in mb-in-s" :data-k="ik" @change="setParam(it, ik, $event.target.value, isp(li(b.type, pk), ik))">
                                              <option value="">（預設）</option>
                                              <template x-for="fm in fieldFormats()" :key="fm"><option :value="fm" x-text="formatLabel(fm)" :selected="fm === it[ik]"></option></template>
                                            </select>
                                          </template>
                                          <template x-if="isp(li(b.type, pk), ik).type === 'int'">
                                            <input class="mb-in mb-in-s" type="number" step="1" :data-k="ik" :value="val(it, ik)"
                                                   @input="setParam(it, ik, $event.target.value === '' ? null : Math.trunc(Number($event.target.value)), isp(li(b.type, pk), ik))">
                                          </template>
                                          <template x-if="isp(li(b.type, pk), ik).type === 'bool'">
                                            <!-- 布林下拉：寫死 value＋x-model.boolean；「（未設定）」＝拿掉這個參數 -->
                                            <select class="mb-in mb-in-s" :data-k="ik" x-model.boolean="it[ik]" @change="if (it[ik] === null || it[ik] === undefined) delete it[ik]">
                                              <option value="">（未設定）</option><option value="true">是</option><option value="false">否</option>
                                            </select>
                                          </template>
                                          <template x-if="isp(li(b.type, pk), ik).type === 'path'">
                                            <select class="mb-in mb-in-s" :data-k="ik" @change="setParam(it, ik, $event.target.value, isp(li(b.type, pk), ik))">
                                              <option value="">（請選擇）</option>
                                              <template x-for="p in viewPaths()" :key="p.value"><option :value="p.value" x-text="p.label" :selected="p.value === it[ik]"></option></template>
                                            </select>
                                          </template>
                                          <template x-if="!isScalar(isp(li(b.type, pk), ik).type) && !itemName(isp(li(b.type, pk), ik).type)">
                                            <span class="mb-hint" :data-unsupported="ik">（此參數建構器暫不提供編輯；內容會保留）</span>
                                          </template>
                                        </span>
                                      </template>
                                    </template>
                                    <span style="margin-left:auto"></span>
                                    <button class="mb-ib" @click="b[pk] = L.move(b[pk], ri, -1)">↑</button>
                                    <button class="mb-ib" @click="b[pk] = L.move(b[pk], ri, 1)">↓</button>
                                    <button class="mb-ib" :data-remove-item="ri" @click="b[pk].splice(ri, 1)">✕</button>
                                  </div>
                                  <template x-for="ik in paramKeys(itemSpec(li(b.type, pk)))" :key="'l' + ik">
                                    <template x-if="li2(b.type, pk, ik)">
                                      <div :data-list="ik" style="margin-top:4px">
                                        <div class="mb-hint" x-text="paramLabel(ik)"></div>
                                        <template x-for="(sub, si2) in (it[ik] || [])" :key="si2">
                                          <div class="mb-row" style="margin-top:3px" :data-item-row="si2">
                                            <template x-for="sk in paramKeys(itemSpec(li2(b.type, pk, ik)))" :key="sk">
                                              <span class="mb-f" :data-param="sk">
                                                <label><span x-text="paramLabel(sk)"></span><span class="mb-bad" x-show="isp(li2(b.type, pk, ik), sk).required"> *</span></label>
                                                <template x-if="isp(li2(b.type, pk, ik), sk).type === 'text' && !isFormatSelect(li2(b.type, pk, ik), sk)">
                                                  <input class="mb-in mb-in-s" :data-k="sk" :value="val(sub, sk)" :placeholder="isp(li2(b.type, pk, ik), sk).desc || ''" @input="setParam(sub, sk, $event.target.value, isp(li2(b.type, pk, ik), sk))">
                                                </template>
                                                <template x-if="isp(li2(b.type, pk, ik), sk).type === 'text' && isFormatSelect(li2(b.type, pk, ik), sk)">
                                                  <select class="mb-in mb-in-s" :data-k="sk" @change="setParam(sub, sk, $event.target.value, isp(li2(b.type, pk, ik), sk))">
                                                    <option value="">（預設）</option>
                                                    <template x-for="fm in fieldFormats()" :key="fm"><option :value="fm" x-text="formatLabel(fm)" :selected="fm === sub[sk]"></option></template>
                                                  </select>
                                                </template>
                                                <template x-if="isp(li2(b.type, pk, ik), sk).type === 'int'">
                                                  <input class="mb-in mb-in-s" type="number" step="1" :data-k="sk" :value="val(sub, sk)"
                                                         @input="setParam(sub, sk, $event.target.value === '' ? null : Math.trunc(Number($event.target.value)), isp(li2(b.type, pk, ik), sk))">
                                                </template>
                                                <template x-if="isp(li2(b.type, pk, ik), sk).type === 'bool'">
                                                  <!-- 布林下拉：寫死 value＋x-model.boolean；「（未設定）」＝拿掉這個參數 -->
                                                  <select class="mb-in mb-in-s" :data-k="sk" x-model.boolean="sub[sk]" @change="if (sub[sk] === null || sub[sk] === undefined) delete sub[sk]">
                                                    <option value="">（未設定）</option><option value="true">是</option><option value="false">否</option>
                                                  </select>
                                                </template>
                                                <template x-if="isp(li2(b.type, pk, ik), sk).type === 'path'">
                                                  <select class="mb-in mb-in-s" :data-k="sk" @change="setParam(sub, sk, $event.target.value, isp(li2(b.type, pk, ik), sk))">
                                                    <option value="">（請選擇）</option>
                                                    <template x-for="p in viewPaths()" :key="p.value"><option :value="p.value" x-text="p.label" :selected="p.value === sub[sk]"></option></template>
                                                  </select>
                                                </template>
                                                <template x-if="!isScalar(isp(li2(b.type, pk, ik), sk).type) && !itemName(isp(li2(b.type, pk, ik), sk).type)">
                                                  <span class="mb-hint" :data-unsupported="sk">（此參數建構器暫不提供編輯；內容會保留）</span>
                                                </template>
                                              </span>
                                            </template>
                                            <button class="mb-ib" @click="it[ik].splice(si2, 1)">✕</button>
                                          </div>
                                        </template>
                                        <button class="mb-ib" style="margin-top:3px" :data-add-item="ik" @click="addItem(it, ik, li2(b.type, pk, ik))">＋ 一列</button>
                                      </div>
                                    </template>
                                  </template>
                                </div>
                              </template>
                              <button class="mb-ib" style="margin-top:5px" :data-add-item="pk" @click="addItem(b, pk, li(b.type, pk))">＋ 一列</button>
                            </div>
                          </template>
                        </div>
                      </template>
                    </div>
                  </template>
                  <div class="mb-row" style="margin-top:8px">
                    <select class="mb-in mb-in-s" id="mb-add-block" @change="addBlock($event.target.value); $event.target.value = ''">
                      <option value="">＋ 加入積木…</option>
                      <template x-for="t in editableBlocks()" :key="t"><option :value="t" x-text="blockLabel(t)"></option></template>
                    </select>
                  </div>
                </div>
              </template>
            </div>
            <div class="mb-card">
              <div class="mb-row">
                <h3 style="margin:0">預覽（樣本資料）</h3>
                <button class="btn btn-ghost btn-sm" id="mb-preview-btn" @click="previewOutput()" :disabled="previewBusy">重新預覽</button>
                <span class="mb-hint" id="mb-preview-state" :data-state="previewState" x-text="previewState === 'ok' ? '已更新' : (previewState === 'bad' ? '版型有問題' : '')"></span>
                <!-- 缺口 #7：同一份草稿定義要 PDF（output/preview?format=pdf），另開分頁顯示 -->
                <button class="btn btn-ghost btn-sm" id="mb-preview-pdf" x-show="canPdf()" @click="previewPdf()" :disabled="pdfBusy">PDF 預覽</button>
                <span class="mb-hint" id="mb-pdf-state" :data-state="pdfState" :data-bytes="pdfBytes" x-text="pdfState === 'pending' ? 'PDF 產生中…' : (pdfState === 'bad' ? 'PDF 產生失敗' : '')"></span>
              </div>
              <template x-for="(p, pi) in previewProblems" :key="pi"><div class="mb-bad" :data-problem-path="p.path" x-text="(p.path || '') + '：' + p.message"></div></template>
              <iframe class="mb-frame" id="mb-preview" sandbox="" :srcdoc="previewHtml" title="輸出預覽"></iframe>
            </div>
          </section>

          <!-- ⑥ 發布 -->
          <div class="mb-drawer" id="mb-drawer" x-show="drawer" role="dialog" aria-label="發布" @keydown.escape.window="closeDrawer()">
          <div class="mb-drawer__h"><strong>發布</strong><button class="mb-ib" id="mb-drawer-close" aria-label="關閉發布" @click="closeDrawer()">✕</button></div>
          <section id="mb-step-6">
            <div class="mb-card">
              <div class="mb-row">
                <h3 style="margin:0" x-text="latestVersion ? '與第 ' + latestVersion + ' 版的差異' : '第一次發布（全部是新增）'"></h3>
                <button class="btn btn-ghost btn-sm" @click="loadDiff()">重新比對</button>
              </div>
              <div class="mb-diff" id="mb-diff" :data-loaded="diffLoaded ? '1' : '0'">
                <template x-for="(c, ci) in diffGroups()" :key="ci">
                  <div :data-change-path="c.path">
                    <span :class="'op-' + c.op" x-text="opLabel(c.op)"></span>
                    <span x-text="'［' + stepName(stepOf(c.path)) + '］' + c.path"></span>
                    <span x-show="c.op !== 'add'" x-text="'　舊：' + short(c.old)"></span>
                    <span x-show="c.op !== 'remove'" x-text="'　新：' + short(c.new)"></span>
                  </div>
                </template>
                <div class="mb-hint" x-show="diffLoaded && !diff.length">沒有差異</div>
              </div>
              <div class="mb-f" style="margin-top:12px">
                <label for="mb-publish-note">發布說明</label>
                <input id="mb-publish-note" class="mb-in" x-model="publishNote" placeholder="這一版改了什麼">
              </div>
              <div class="mb-row" style="margin-top:10px">
                <button class="btn btn-primary" id="mb-publish" @click="publish()" :disabled="busy" x-text="defReview.active ? '送審' : '發布'">發布</button>
                <span class="mb-hint">已建立的單據維持它建立時的版本；新單據用新版。</span>
              </div>
              <div class="mb-f" style="margin-top:8px" id="mb-review-box">
                <div class="mb-hint" id="mb-review-state" x-text="reviewBadge()"></div>
                <div class="mb-hint" x-show="!defReview.active" x-text="defReview.reason"></div>
                <details style="margin-top:4px"><summary class="mb-hint" style="cursor:pointer">模組審核人與模式</summary>
                  <div class="mb-hint">名單裡有你以外至少一人 ⇒ 送審自動啟用；審核人任一位核可即發布，退回要填原因、版號不回收。</div>
                  <div class="cr-opts" style="max-height:150px;overflow:auto">
                    <template x-for="u in users" :key="u.username">
                      <label><input type="checkbox" style="width:auto" :data-reviewer="u.username" :checked="reviewerHas(u.username)" @change="toggleReviewer(u.username, $event.target.checked)"><span x-text="u.displayName || u.username"></span></label>
                    </template>
                  </div>
                  <label style="display:flex;gap:6px;align-items:center;margin-top:6px">模式
                    <select id="mb-review-mode" class="mb-in mb-in-s" :value="defReview.mode" @change="saveDefReview({ mode: $event.target.value })">
                      <option value="auto">自動（依審核人名單）</option><option value="on">強制送審</option><option value="off">關閉（直接發布）</option>
                    </select>
                  </label>
                </details>
                <div class="mb-hint" x-show="submittedVersion()">第 <span x-text="submittedVersion()"></span> 版送審中，<a :href="'custom-def-review.html?key=' + encodeURIComponent(key)" id="mb-review-link">前往審核頁</a>。</div>
              </div>
              <template x-if="publishProblems.length">
                <div class="mb-err mb-probs" id="mb-publish-problems">
                  <div>未發布：有 <span x-text="publishProblems.length"></span> 個問題</div>
                  <template x-for="(p, pi) in publishProblems" :key="pi">
                    <div :data-problem-path="p.path" :data-problem-step="stepOf(p.path)">
                      <span x-text="'［' + stepName(stepOf(p.path)) + '］' + (p.path || '（整份）') + '：' + p.message"></span>
                      <a @click="jumpTo(p.path)">前往</a>
                    </div>
                  </template>
                </div>
              </template>
            </div>
            <div class="mb-card">
              <h3>版本</h3>
              <table class="mb-table" id="mb-versions">
                <thead><tr><th>版本</th><th>狀態</th><th>說明</th><th>發布者</th><th>時間</th><th></th></tr></thead>
                <tbody>
                  <template x-for="v in versions" :key="v.version">
                    <tr :data-version="v.version">
                      <td x-text="v.version === 0 ? '草稿' : '第 ' + v.version + ' 版'"></td>
                      <td :data-status="v.status" x-text="({ draft: '草稿', published: '已發布', submitted: '送審中', rejected: '已退回' }[v.status] || v.status) + (v.status === 'rejected' && v.decision && v.decision.reason ? '：' + v.decision.reason : '')"></td>
                      <td x-text="v.note || ''"></td>
                      <td x-text="v.published_by || v.created_by || ''"></td>
                      <td x-text="(v.published_at || v.created_at || '').replace('T', ' ').slice(0, 16)"></td>
                      <td><button class="btn btn-ghost btn-sm" x-show="v.status === 'published' && v.version !== latestVersion" :data-restore="v.version" @click="restore(v.version)" :disabled="busy">還原成新版</button></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <div class="mb-hint">還原不改歷史：把舊版內容再發布成新的一版。</div>
            </div>
          </section>
          </div>
        </div>
      </template>
    </div>
  </main>

  <script src="../static/notif.js"></script>
  <script src="../static/ui.js"></script>
  <script src="../static/custom-layout.js"></script>
  <script src="../static/sidebar.js"></script>
  <script src="../js/module-builder-consts.js"></script>
  <script src="../js/module-builder-core.js"></script>
  <script src="../js/module-builder-form.js"></script>
  <script src="../js/module-builder-elements.js"></script>
  <script src="../js/module-builder-flow.js"></script>
  <script src="../js/module-builder-output.js"></script>
</body>
</html>
