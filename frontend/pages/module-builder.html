<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{if(localStorage.getItem('motrix_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/api/system/branding/favicon">
  <title>模組建構器 — MOTRIX 專案管理系統</title>
  <script src="../static/auth-guard.js"></script>
  <script defer src="../static/vendor/alpine-3.17.1.min.js"></script>
  <link rel="stylesheet" href="../css/style.css?v=20260805g">
  <link rel="stylesheet" href="../css/custom-form.css">
  <!--
    自訂模組建構器（CUSTOMIZATION-SPEC §8.1、§3.7；P8 前端）。僅超級管理員。
    步驟：① 基本 ② 表單 ④ 流程 ⑤ 輸出 ⑥ 發布（2026-09-27 使用者第二輪：原本的 ② 欄位＋③ 版面合成 ② 表單——畫布就是表單本身，
    欄位直接拖進區塊；步驟編號 4～6 不變）。
    - 定義存在定義文件庫（kind＝custom_module）：每次修改自動存成草稿（PUT …/draft），發布前看差異，發布後可還原任一版。
    - 🔴 只從能力目錄（GET /api/custom-modules/catalog）挑：欄位型別、公式函式、參照對象、日期格式、資料分類、輸出積木
      與其參數規格（outputBlockSpecs／outputBlockItemSpecs ⇒ ⑤ 的參數表單）、主題、欄位格式、輸出格式、簽核人來源（④）。
      目錄沒有提供的東西，畫面上不出現；前端不留後備清單。
    - 首頁列出全部模組（GET /api/definitions/custom_module，含只有草稿的），可刪草稿（二次確認）。
    - 版面（區塊與順序，② 表單）存在定義的 `ui` 鍵（引擎不讀），規則與編輯操作在 custom-layout.js（執行頁共用；P9 排版器抽離）；
      畫布欄位的外觀用執行頁同一套 class（css/custom-form.css）。
    - 伺服器回的問題（problems[{path}]）依 path 標回對應的步驟與欄位。
  -->
  <style>
    .mb-main { margin-left: var(--sidebar-w); margin-top: var(--topbar-h); padding: 24px 32px 60px;
      min-height: calc(calc(100vh / var(--fz,1)) - var(--topbar-h)); background: var(--white); }
    .mb-wrap { max-width: 1280px; }
    .mb-err { margin-top: 12px; padding: 11px 15px; border-radius: 8px; background: var(--tone-danger-bg);
      border: 1px solid var(--tone-danger-border); color: var(--tone-danger-fg); font-size: 13px; line-height: 1.6; }
    .mb-info { margin-top: 10px; padding: 9px 13px; border-radius: 8px; background: var(--tone-info-bg);
      border: 1px solid var(--tone-info-border); color: var(--tone-info-fg); font-size: 12.5px; line-height: 1.6; }
    .mb-card { border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; background: var(--surface, #fff); margin-top: 14px; }
    .mb-card h3 { font-size: 13px; font-weight: 700; margin: 0 0 10px; }
    .mb-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .mb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px 16px; }
    .mb-f label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
    .mb-f input, .mb-f select, .mb-f textarea, .mb-in { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 13px; font-family: inherit; background: var(--white); color: var(--text-main, inherit); }
    .mb-in-s { width: auto; min-width: 90px; }
    .mb-hint { font-size: 11.5px; color: var(--text-dim); margin-top: 3px; line-height: 1.5; }
    .mb-bad { color: var(--danger); font-size: 11.5px; margin-top: 3px; }
    .is-bad { outline: 2px solid var(--danger); outline-offset: 1px; border-radius: 6px; }
    /* 步驟列 */
    .mb-steps { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 16px; }
    .mb-step { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 18px; border: 1px solid var(--border);
      background: var(--surface, #fff); font-size: 12.5px; cursor: pointer; font-family: inherit; color: var(--text-secondary); }
    .mb-step.is-on { background: var(--accent); color: #fff; border-color: var(--accent); }
    .mb-step .bdg { font-size: 10.5px; min-width: 16px; padding: 0 5px; border-radius: 8px; background: var(--danger); color: #fff; }
    .mb-save { font-size: 12px; color: var(--text-secondary); margin-left: auto; }
    .mb-save[data-state="error"] { color: var(--danger); }
    /* ② 欄位：三欄 */
    .mb-fields { display: grid; grid-template-columns: 170px 1fr 360px; gap: 14px; margin-top: 14px; align-items: start; }
    .mb-pal { border: 1px solid var(--border); border-radius: 10px; padding: 10px; background: var(--surface-muted, #FAFAF8); }
    .mb-pal__t { font-size: 11px; color: var(--text-secondary); font-weight: 700; margin-bottom: 6px; }
    .mb-pal__i { display: block; width: 100%; text-align: left; padding: 7px 9px; margin-bottom: 5px; border: 1px solid var(--border);
      border-radius: 6px; background: var(--white); cursor: grab; font-size: 12.5px; font-family: inherit; color: inherit; }
    .mb-canvas { border: 2px dashed var(--border); border-radius: 10px; min-height: 240px; padding: 10px; }
    .mb-canvas.is-over { border-color: var(--accent); background: var(--tone-accent-bg, #FFF1F2); }
    .mb-fc { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
      margin-bottom: 6px; background: var(--white); cursor: pointer; }
    .mb-fc.is-sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .mb-fc.is-bad { border-color: var(--danger); outline: none; }
    .mb-fc .t { font-size: 10.5px; padding: 1px 6px; border-radius: 4px; background: var(--border-light); color: var(--text-secondary); }
    .mb-fc .k { font-family: var(--font-en, monospace); font-size: 11px; color: var(--text-dim); }
    .mb-fc .grow { flex: 1; min-width: 0; }
    .mb-ib { border: 1px solid var(--border-light); background: var(--white); border-radius: 5px; padding: 2px 7px; font-size: 12px; cursor: pointer; color: var(--text-secondary); font-family: inherit; }
    .mb-props { border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
    .mb-props .mb-f { margin-bottom: 10px; }
    .mb-fx { font-family: var(--font-en, monospace); font-size: 12px; white-space: pre; background: var(--surface-muted, #FAFAF8);
      border-radius: 6px; padding: 6px 8px; margin-top: 4px; overflow-x: auto; }
    .mb-fx .caret { color: var(--danger); font-weight: 700; }
    .mb-chipbtn { display: inline-block; font-size: 11px; padding: 1px 7px; margin: 2px 3px 0 0; border-radius: 10px; border: 1px solid var(--border-light);
      background: var(--white); cursor: pointer; font-family: var(--font-en, monospace); color: var(--text-secondary); }
    /* 表格 */
    .mb-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .mb-table th, .mb-table td { padding: 6px 7px; border-bottom: 1px solid var(--border-light); text-align: left; vertical-align: top; }
    .mb-table th { font-size: 11px; color: var(--text-secondary); font-weight: 600; }
    .mb-table tr.is-bad td { background: var(--tone-danger-bg); }
    .mb-sub { margin: 6px 0 4px 10px; padding: 8px 10px; border-left: 3px solid var(--border); background: var(--surface-muted, #FAFAF8); border-radius: 0 6px 6px 0; }
    .mb-tier { border: 1px solid var(--border-light); border-radius: 8px; padding: 8px 10px; margin-top: 6px; background: var(--white); }
    .mb-tier.is-bad { border-color: var(--danger); }
    .mb-frame { width: 100%; height: 560px; border: 1px solid var(--border-light); border-radius: 8px; background: #fff; }
    .mb-diff { font-size: 12.5px; font-family: var(--font-en, monospace); }
    .mb-diff div { padding: 3px 0; border-bottom: 1px dotted var(--border-light); word-break: break-all; }
    .mb-diff .op-add { color: var(--success); } .mb-diff .op-remove { color: var(--danger); } .mb-diff .op-change { color: var(--tone-warning-fg, #92400E); }
    .mb-probs { font-size: 12.5px; }
    .mb-probs a { cursor: pointer; color: var(--accent); text-decoration: underline; margin-left: 6px; }
    .mb-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .mb-chip { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; padding: 3px 8px; border-radius: 12px; border: 1px solid var(--border); margin: 3px 4px 0 0; background: var(--white); }
    /* 縮圖導覽（BUILDER-UX §1：7 格；流程／簽核／通知三格都在第 4 步） */
    .mb-nav { display: grid; grid-template-columns: repeat(7, minmax(84px, 1fr)); gap: 8px; margin-top: 16px; }
    .mb-nav__i { position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 5px; padding: 6px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface, #fff); cursor: pointer; font-family: inherit; color: var(--text-secondary); text-align: left; }
    .mb-nav__i.is-on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); color: var(--text-main, inherit); }
    .mb-nav__thumb { height: 46px; border-radius: 6px; background: var(--surface-muted); overflow: hidden; }
    .mb-nav__thumb svg, .mb-nav__thumb iframe { width: 100%; height: 100%; border: 0; pointer-events: none; }
    .mb-nav__l { font-size: 12px; display: flex; align-items: center; gap: 5px; }
    .mb-nav__i[data-has-problems="1"]::after { content: ""; position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
    /* 工具列 icon＋文字 */
    .mb-pal__i { display: flex; align-items: center; gap: 8px; }
    .mb-pal__i svg { flex: none; width: 16px; height: 16px; color: var(--text-secondary); }
    .mb-pal__i:focus-visible, .mb-fc:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    /* 畫布卡片：選中的就地展開 */
    .mb-fc { flex-wrap: wrap; }
    .mb-fc .h { cursor: grab; color: var(--text-dim); font-size: 13px; user-select: none; }
    .mb-fc__ed { flex-basis: 100%; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border-light); cursor: default; }
    .mb-fc__ed .mb-f { margin-bottom: 10px; }
    .mb-fc__fx { display: block; font-size: 11.5px; color: var(--text-secondary); margin-top: 2px; }
    .mb-fc__fx[data-fx-state="bad"] { color: var(--danger); }
    .mb-fc__help { display: block; font-size: 11px; color: var(--text-dim); margin-top: 2px; white-space: pre-wrap; }
    .mb-fc__q { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--text-secondary); }
    /* ② 表單：畫布就是表單（.cr-* 來自 css/custom-form.css，與執行頁同一套）；建構器只加外框與工具列 */
    .mb-canvas .cr-sec { margin-top: 10px; padding: 8px; border: 1px dashed transparent; border-radius: 8px; }
    .mb-canvas .cr-sec:hover, .mb-canvas .cr-sec[data-empty="1"] { border-color: var(--border-light); }
    .mb-sec__h { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
    .mb-sec__h .h { cursor: grab; color: var(--text-dim); user-select: none; }
    .mb-sec__h .mb-in { font-weight: 700; font-size: 12px; }
    .mb-sec__drop { grid-column: 1 / -1; padding: 10px; text-align: center; }
    .mb-canvas .mb-fc { display: block; margin: 0; padding: 8px 10px; }
    .mb-canvas .mb-fc.is-sel { grid-column: 1 / -1; }
    .mb-fc__bar { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
    .mb-fc__bar .grow { flex: 1; }
    .mb-fc__bar svg { width: 14px; height: 14px; color: var(--text-secondary); }
    .cr-f .mb-fc__q { display: inline-flex; margin: 0; }
    .cr-f .mb-fc__q input { width: auto; padding: 0; }
    .mb-fc__mock { pointer-events: none; }
    /* 右側即時預覽 */
    .mb-pv { border: 1px solid var(--border); border-radius: 10px; padding: 10px; position: sticky; top: calc(var(--topbar-h) + 12px); }
    .mb-pv__t { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; }
    .mb-pv__host { min-height: 240px; }
    .mb-pv__list { margin-top: 10px; }
    .mb-pv__list summary { cursor: pointer; }
    .mb-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    @media (max-width: 1100px) { .mb-fields { grid-template-columns: 150px 1fr; } .mb-props, .mb-pv { grid-column: 1 / -1; } .mb-nav { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 767px) {
      .mb-main { margin-left: 0; padding: 16px 12px 48px; }
      .mb-fields, .mb-layout { grid-template-columns: 1fr; }
      .mb-table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body x-data="moduleBuilderPage()" x-init="init()" x-cloak>
  <header id="app-topbar" class="topbar"></header>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="app-sidebar"></aside>
  <main class="mb-main">
    <div class="mb-wrap">
      <div class="pg">
        <div class="pg__l">
          <div class="pg__eyebrow">系統設定</div>
          <h1 class="pg__t">模組建構器</h1>
          <p class="pg__s">在網站上建立自訂模組：欄位、版面、流程與簽核、輸出都從系統提供的目錄挑選，不需要改程式。每次修改自動存成草稿；發布後產生不可變的版本，已建立的單據維持建立當時的版本。</p>
        </div>
      </div>

      <div class="mb-err" id="mb-error" x-show="errMsg" x-text="errMsg"></div>

      <!-- 選擇模組 -->
      <template x-if="ready && !key">
        <div class="mb-card" id="mb-pick">
          <h3>開啟或建立模組</h3>
          <div class="mb-row">
            <input class="mb-in mb-in-s" id="mb-key" x-model.trim="keyInput" placeholder="模組代號（例：equipment_loan）" style="min-width:260px" @keydown.enter="openKey(keyInput)">
            <button class="btn btn-primary" id="mb-open" @click="openKey(keyInput)">開啟／建立</button>
          </div>
          <div class="mb-hint">代號只能用小寫英文、數字與底線，英文開頭（2～40 字）；建立後不能改（它是網址與權限的一部分）。</div>
          <div class="mb-bad" x-show="keyErr" x-text="keyErr"></div>
          <!-- 缺口 #5：全部模組（含只有草稿、從未發布的），GET /api/definitions/custom_module -->
          <div style="margin-top:14px" id="mb-module-list" :data-loaded="defsLoaded ? '1' : '0'">
            <div class="mb-hint" x-show="defsLoaded && !defs.length">還沒有任何自訂模組</div>
            <table class="mb-table" x-show="defs.length">
              <thead><tr><th>代號</th><th>名稱</th><th>最新發布</th><th>草稿</th><th>更新時間</th><th></th></tr></thead>
              <tbody>
                <template x-for="m in defs" :key="m.key">
                  <tr :data-def-key="m.key" :data-has-draft="m.hasDraft ? '1' : '0'" :data-latest="m.latestVersion || 0">
                    <td style="font-family:var(--font-en,monospace)" x-text="m.key"></td>
                    <td x-text="moduleName(m.key)"></td>
                    <td x-text="m.latestVersion ? '第 ' + m.latestVersion + ' 版' : '尚未發布'"></td>
                    <td x-text="m.hasDraft ? '有草稿' : '—'"></td>
                    <td x-text="(m.updatedAt || '').replace('T', ' ').slice(0, 16)"></td>
                    <td style="white-space:nowrap">
                      <button class="mb-chipbtn" :data-open-module="m.key" @click="openKey(m.key)">開啟</button>
                      <button class="mb-chipbtn" x-show="m.hasDraft" :data-delete-draft="m.key" @click="deleteDraft(m)" :disabled="busy">刪除草稿</button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </template>

      <template x-if="def">
        <div>
          <div class="mb-row" style="margin-top:14px">
            <strong x-text="(def.name || '（未命名）') + '　' + key"></strong>
            <span class="mb-hint" x-text="latestVersion ? '最新發布：第 ' + latestVersion + ' 版' : '尚未發布'"></span>
            <a class="mb-chipbtn" x-show="latestVersion" :href="'custom-records.html?key=' + encodeURIComponent(key)">開啟執行頁</a>
            <button class="mb-chipbtn" @click="closeModule()">換一個模組</button>
            <span class="mb-save" id="mb-save-state" :data-state="saveState" :data-dirty="dirty ? '1' : '0'" :data-saving="saving ? '1' : '0'"
                  x-text="saveLabel()"></span>
          </div>

          <nav class="mb-nav" aria-label="建構步驟" id="mb-nav">
            <template x-for="(it, ni) in NAV" :key="it.id">
              <button :class="[it.alias ? 'mb-nav__i' : 'mb-nav__i mb-step', navOn(it) ? 'is-on' : '']" :data-nav="it.id"
                      :data-step="it.alias ? null : it.step" :data-step-alias="it.alias ? it.step : null"
                      :data-has-problems="it.alias ? '0' : (stepProblemCount(it.step) ? '1' : '0')"
                      :aria-current="navOn(it) ? 'step' : null" @click="goNav(it)">
                <div class="mb-nav__thumb" :data-thumb="it.thumb" x-effect="drawThumb($el, it.thumb, thumbTick)"></div>
                <span class="mb-nav__l"><span x-text="(ni + 1) + ' ' + it.label"></span>
                  <span class="bdg" x-show="!it.alias && stepProblemCount(it.step)" x-text="stepProblemCount(it.step)"></span></span>
              </button>
            </template>
          </nav>

          <!-- 本步驟的問題（草稿驗證或發布被擋） -->
          <template x-if="stepProblems(step).length">
            <div class="mb-err mb-probs" id="mb-step-problems">
              <template x-for="(p, pi) in stepProblems(step)" :key="pi">
                <div :data-problem-path="p.path"><span x-text="(p.path || '（整份）') + '：' + p.message"></span></div>
              </template>
            </div>
          </template>

          <!-- ① 基本 -->
          <section x-show="step === 1" class="mb-card" id="mb-step-1">
            <div class="mb-grid">
              <div class="mb-f" :class="{ 'is-bad': hasProblem('name') }">
                <label for="mb-name">模組名稱</label>
                <input id="mb-name" x-model="def.name" placeholder="例：設備借用單">
              </div>
              <div class="mb-f" x-show="(catalog.icons || []).length">
                <label for="mb-icon">圖示</label>
                <select id="mb-icon" x-model="def.icon">
                  <option value="">（無）</option>
                  <template x-for="ic in (catalog.icons || [])" :key="ic"><option :value="ic" x-text="ic"></option></template>
                </select>
              </div>
              <div class="mb-f">
                <label for="mb-menu-group">選單位置（主選單分組）</label>
                <select id="mb-menu-group" :value="(def.menu || {}).group || DEFAULT_GROUP" @change="setMenu('group', $event.target.value)">
                  <template x-for="g in menuGroups" :key="g"><option :value="g" x-text="g" :selected="g === ((def.menu || {}).group || DEFAULT_GROUP)"></option></template>
                </select>
                <div class="mb-hint">分組取自目前的主選單；選「自訂模組」會另開一組。</div>
              </div>
              <div class="mb-f">
                <label for="mb-menu-order">選單排序（小的在前）</label>
                <input id="mb-menu-order" type="number" :value="(def.menu || {}).order" @input="setMenu('order', $event.target.value === '' ? null : Number($event.target.value))">
              </div>
              <div class="mb-f" :class="{ 'is-bad': hasProblem('permission') }">
                <label for="mb-perm">權限 key</label>
                <input id="mb-perm" x-model.trim="def.permission">
                <div class="mb-hint">使用者的模組權限裡有這個 key 才看得到；簽核人不需要。預設 custom.&lt;代號&gt;。</div>
              </div>
            </div>
            <h3 style="margin-top:16px">編號規則</h3>
            <div class="mb-grid">
              <div class="mb-f" :class="{ 'is-bad': hasProblem('numbering.prefix') }">
                <label for="mb-prefix">前綴</label>
                <input id="mb-prefix" :value="def.numbering.prefix" @input="def.numbering.prefix = $event.target.value.toUpperCase()" placeholder="例：EL">
              </div>
              <div class="mb-f" :class="{ 'is-bad': hasProblem('numbering.date') }">
                <label for="mb-date">日期</label>
                <select id="mb-date" x-model="def.numbering.date">
                  <template x-for="d in (catalog.numberingDateFormats || [])" :key="d">
                    <option :value="d" x-text="dateLabel(d)" :selected="d === def.numbering.date"></option>
                  </template>
                </select>
              </div>
              <div class="mb-f" :class="{ 'is-bad': hasProblem('numbering.digits') }">
                <label for="mb-digits">流水號位數</label>
                <input id="mb-digits" type="number" min="3" max="8" x-model.number="def.numbering.digits">
              </div>
              <div class="mb-f">
                <label>預覽</label>
                <div class="mb-fx" id="mb-num-example" :data-example="numExample" x-text="numExample || '—'"></div>
                <template x-for="(p, pi) in numProblems" :key="pi"><div class="mb-bad" x-text="p.message"></div></template>
              </div>
            </div>
          </section>

          <!-- ② 表單（使用者 2026-09-27 第二輪：「預覽都在同一個頁面，直接放入」）：欄位與版面合成一步，中間的畫布就是表單本身——
               從工具列拖進某個區塊的某個位置；區塊可以新增、改名、拖曳排序；點欄位就地改屬性。
               欄位外觀沿用執行頁同一套 class 與標記（css/custom-form.css），畫布與執行頁一致有題。右側同時顯示輸出與列表預覽。 -->
          <section x-show="step === 2" id="mb-step-2">
            <div class="mb-fields">
              <div class="mb-pal" id="mb-palette">
                <div class="mb-pal__t">欄位（拖進表單的區塊；或按 Enter／點一下加到目前的區塊）</div>
                <template x-for="t in (catalog.fieldTypes || [])" :key="t">
                  <button class="mb-pal__i" draggable="true" :data-palette-type="t" :aria-label="'加入欄位：' + typeLabel(t)"
                          @dragstart="$event.dataTransfer.setData('text/plain', 'type:' + t)" @click="addFieldHere(t)">
                    <span x-html="typeIcon(t)"></span><span x-text="typeLabel(t)"></span>
                  </button>
                </template>
              </div>
              <div class="mb-canvas" id="mb-canvas" :class="{ 'is-over': dragOver }"
                   @dragover.prevent="dragOver = true" @dragleave.self="dragOver = false" @drop.prevent="dropOn($event, -1, null)">
                <div class="mb-hint" x-show="!def.fields.length">把左邊的欄位型別拖到這裡</div>
                <template x-for="(sec, si) in L.editorSections(def)" :key="'g' + sec.gi">
                  <div class="cr-sec mb-sec" :data-section-group="sec.gi" :data-group-index="sec.gi >= 0 ? sec.gi : null"
                       :data-empty="sec.items.length ? '0' : '1'" role="list" :aria-label="sec.title || (sec.gi >= 0 ? '未命名區塊' : '表單')"
                       @dragover.prevent.stop="dragOver = true" @drop.prevent.stop="dropOn($event, sec.gi, null)">
                    <template x-if="sec.gi >= 0">
                      <div class="mb-sec__h">
                        <span class="h" draggable="true" title="拖曳調整區塊順序（鍵盤：↑／↓ 按鈕）" aria-hidden="true"
                              @dragstart="$event.dataTransfer.setData('text/plain', 'group:' + sec.gi)">⠿</span>
                        <input class="mb-in" :data-group-title="sec.gi" :value="sec.title" placeholder="區塊標題（例：借用資訊）" aria-label="區塊標題"
                               @change="def.ui = L.renameGroup(def, sec.gi, $event.target.value)">
                        <button class="mb-ib" aria-label="區塊上移" @click="moveGroupBy(sec.gi, -1)">↑</button>
                        <button class="mb-ib" aria-label="區塊下移" @click="moveGroupBy(sec.gi, 1)">↓</button>
                        <button class="mb-ib" aria-label="刪除區塊" :data-remove-group="sec.gi" @click="removeGroupAt(sec.gi)">✕</button>
                      </div>
                    </template>
                    <div class="cr-sec__t" x-show="sec.gi < 0 && sec.title" x-text="sec.title"></div>
                    <div class="cr-grid">
                      <template x-for="it in sec.items" :key="it.key + ':' + it.index">
                        <div class="cr-f mb-fc" :class="{ 'is-sel': sel === it.index, 'is-bad': hasProblem('fields[' + it.index + ']') }"
                             :data-field-index="it.index" :data-field-key="it.key" tabindex="0" role="listitem"
                             :aria-label="(it.f.label || '（未命名）') + '，' + typeLabel(it.f.type) + '，' + (sec.title ? '「' + sec.title + '」' : '') + '第 ' + (it.pos + 1) + ' 個'"
                             @dragover.prevent.stop="dragOver = true" @drop.prevent.stop="dropOn($event, sec.gi, it.key)" @click="sel = it.index"
                             @keydown.self.alt.up.prevent="moveFieldKb(it.index, -1)" @keydown.self.alt.down.prevent="moveFieldKb(it.index, 1)"
                             @keydown.self.delete.prevent="removeFieldKb(it.index)" @keydown.self.enter.prevent="sel = it.index"
                             @keydown.escape="if (sel === it.index) { sel = null; $el.focus() }">
                          <div class="mb-fc__bar">
                            <span class="h" draggable="true" title="拖曳（鍵盤：Alt＋↑／↓；到區塊邊界會移到相鄰區塊）" aria-hidden="true"
                                  @dragstart="$event.dataTransfer.setData('text/plain', 'field:' + it.key)">⠿</span>
                            <span x-html="typeIcon(it.f.type)"></span>
                            <span class="t" x-text="typeLabel(it.f.type)"></span>
                            <span class="k" x-text="it.key"></span>
                            <span class="mb-bad" x-show="!it.f.label" style="margin:0">未命名</span>
                            <span class="grow"></span>
                            <label class="mb-fc__q" x-show="it.f.type !== 'formula' && sel !== it.index" @click.stop>
                              <input type="checkbox" :data-quick-required="it.index" :checked="it.f.required === true" @change="it.f.required = $event.target.checked">必填</label>
                            <button class="mb-ib" title="上移" @click.stop="moveField(it.index, -1)">↑</button>
                            <button class="mb-ib" title="下移" @click.stop="moveField(it.index, 1)">↓</button>
                            <button class="mb-ib" title="刪除" :data-remove-field="it.index" @click.stop="removeField(it.index)">✕</button>
                          </div>
                          <!-- 以下與執行頁 custom-records 的欄位標記相同（label＋必填星號、輸入框、可讀式子、說明） -->
                          <label><span x-text="it.f.label || it.f.key"></span><span class="req" x-show="it.f.required">*</span></label>
                          <div class="mb-fc__mock" aria-hidden="true">
                            <div class="cr-ro" x-show="it.f.type === 'formula'">（儲存後由系統計算）</div>
                            <select disabled tabindex="-1" x-show="['select', 'checkbox', 'ref'].indexOf(it.f.type) >= 0"><option>（未選）</option></select>
                            <input disabled tabindex="-1" x-show="['select', 'checkbox', 'ref', 'formula'].indexOf(it.f.type) < 0"
                                   :type="it.f.type === 'number' || it.f.type === 'date' ? it.f.type : 'text'">
                          </div>
                          <div class="cr-fx" x-show="it.f.type === 'formula'" :data-fx-readable="it.key"
                               :data-fx-state="(fxProblems[it.index] || []).length ? 'bad' : 'ok'" x-text="fxReadableLine(it.index)"></div>
                          <div class="cr-help" x-show="it.f.help" :data-field-help="it.key" x-text="it.f.help"></div>
                          <template x-if="sel === it.index && def.fields[sel]">
                            <div class="mb-fc__ed" :data-props-for="sel" @click.stop>
                      <div class="mb-f" :class="{ 'is-bad': hasProblem('fields[' + sel + '].key') }">
                        <label for="mb-f-key">欄位代號（key）</label>
                        <input id="mb-f-key" :value="def.fields[sel].key" @change="renameField(sel, $event.target.value.trim())">
                        <div class="mb-hint">公式、版面與輸出用它引用這個欄位。</div>
                      </div>
                      <div class="mb-f" :class="{ 'is-bad': hasProblem('fields[' + sel + '].label') }">
                        <label for="mb-f-label">顯示名稱</label>
                        <input id="mb-f-label" x-model="def.fields[sel].label">
                      </div>
                      <div class="mb-f">
                        <label>型別</label>
                        <div class="mb-fx" x-text="typeLabel(def.fields[sel].type) + '（' + def.fields[sel].type + '）'"></div>
                      </div>
                      <div class="mb-f" :class="{ 'is-bad': hasProblem('fields[' + sel + '].help') }">
                        <label for="mb-f-help">說明（選填，顯示在表單欄位下方）</label>
                        <textarea id="mb-f-help" rows="2" maxlength="300" :value="def.fields[sel].help || ''"
                                  @input="setHelp(sel, $event.target.value)" :placeholder="def.fields[sel].type === 'formula' ? '例：含稅金額，依數量與單價計算' : '例：填寫設備的財產編號'"></textarea>
                      </div>
                      <template x-if="def.fields[sel].type !== 'formula'">
                        <div class="mb-f">
                          <label for="mb-f-required">必填</label>
                          <!-- 布林下拉：寫死 value＋x-model.boolean（〈Alpine :value="false" 布林下拉〉） -->
                          <select id="mb-f-required" x-model.boolean="def.fields[sel].required">
                            <option value="false">否</option>
                            <option value="true">是</option>
                          </select>
                        </div>
                      </template>
                      <template x-if="def.fields[sel].type === 'select'">
                        <div class="mb-f" :class="{ 'is-bad': hasProblem('fields[' + sel + '].options') }">
                          <label for="mb-f-options">選項（一行一個）</label>
                          <textarea id="mb-f-options" rows="4" :value="(def.fields[sel].options || []).join('\n')"
                                    @input="def.fields[sel].options = $event.target.value.split('\n').map(s => s.trim()).filter(s => s)"></textarea>
                        </div>
                      </template>
                      <template x-if="['text','number','date','select','checkbox'].indexOf(def.fields[sel].type) >= 0">
                        <div class="mb-f" :class="{ 'is-bad': hasProblem('fields[' + sel + '].default') }">
                          <label for="mb-f-default">預設值</label>
                          <template x-if="def.fields[sel].type === 'checkbox'">
                            <select id="mb-f-default" :value="def.fields[sel].default === true ? 'true' : (def.fields[sel].default === false ? 'false' : '')"
                                    @change="setDefault(sel, $event.target.value === '' ? null : $event.target.value === 'true')">
                              <option value="">（無）</option><option value="true">是</option><option value="false">否</option>
                            </select>
                          </template>
                          <template x-if="def.fields[sel].type === 'select'">
                            <select id="mb-f-default" :value="def.fields[sel].default || ''" @change="setDefault(sel, $event.target.value || null)">
                              <option value="">（無）</option>
                              <template x-for="o in (def.fields[sel].options || [])" :key="o"><option :value="o" x-text="o" :selected="o === def.fields[sel].default"></option></template>
                            </select>
                          </template>
                          <template x-if="['text','number','date'].indexOf(def.fields[sel].type) >= 0">
                            <input id="mb-f-default" :type="def.fields[sel].type === 'text' ? 'text' : def.fields[sel].type" :step="def.fields[sel].type === 'number' ? 'any' : null"
                                   :value="def.fields[sel].default === undefined || def.fields[sel].default === null ? '' : def.fields[sel].default"
                                   @change="setDefault(sel, $event.target.value === '' ? null : (def.fields[sel].type === 'number' ? Number($event.target.value) : $event.target.value))">
                          </template>
                        </div>
                      </template>
                      <template x-if="def.fields[sel].type === 'formula'">
                        <div class="mb-f" :class="{ 'is-bad': hasProblem('fields[' + sel + '].formula') || (fxProblems[sel] || []).length }">
                          <label for="mb-f-formula">公式</label>
                          <input id="mb-f-formula" x-model="def.fields[sel].formula" @input="queueFormulaCheck(sel)" placeholder="例：qty * unit_value" style="font-family:var(--font-en,monospace)">
                          <div style="margin-top:4px">
                            <template x-for="k in otherKeys(sel)" :key="'k' + k"><button class="mb-chipbtn" @click="insertFx(sel, k)" x-text="k"></button></template>
                          </div>
                          <div>
                            <template x-for="fn in (catalog.formulaFunctions || [])" :key="'f' + fn"><button class="mb-chipbtn" @click="insertFx(sel, fn + '(')" x-text="fn + '()'"></button></template>
                          </div>
                          <div id="mb-f-formula-problems" :data-state="fxState[sel] || ''">
                            <template x-for="(p, pi) in (fxProblems[sel] || [])" :key="pi">
                              <div :data-pos="p.pos">
                                <div class="mb-fx"><span x-text="def.fields[sel].formula"></span>
  <span class="caret" x-text="' '.repeat(Math.max(0, p.pos)) + '^'"></span></div>
                                <div class="mb-bad" x-text="'第 ' + (p.pos + 1) + ' 字：' + p.message"></div>
                              </div>
                            </template>
                            <div class="mb-hint" x-show="fxState[sel] === 'ok'">公式檢查通過</div>
                          </div>
                          <div class="mb-hint">空值不等於 0；要當 0 請用 coalesce(欄位, 0)。</div>
                        </div>
                      </template>
                      <template x-if="def.fields[sel].type === 'ref'">
                        <div class="mb-f" :class="{ 'is-bad': hasProblem('fields[' + sel + '].target') }">
                          <label for="mb-f-target">參照對象</label>
                          <select id="mb-f-target" x-model="def.fields[sel].target">
                            <option value="">（請選擇）</option>
                            <template x-for="t in refTargetOptions()" :key="t.value"><option :value="t.value" x-text="t.label" :selected="t.value === def.fields[sel].target"></option></template>
                          </select>
                        </div>
                      </template>
                      <div class="mb-f" :class="{ 'is-bad': hasProblem('fields[' + sel + '].dataClass') }">
                        <label for="mb-f-dataclass">資料分類</label>
                        <select id="mb-f-dataclass" x-model="def.fields[sel].dataClass">
                          <template x-for="c in (catalog.dataClasses || [])" :key="c"><option :value="c" x-text="c" :selected="c === def.fields[sel].dataClass"></option></template>
                        </select>
                        <div class="mb-hint">自訂模組目前只收 T1；個資（F2）分流接上前不提供。</div>
                      </div>
                      <template x-for="(p, pi) in problemsUnder('fields[' + sel + ']')" :key="pi">
                        <div class="mb-bad" x-text="p.message"></div>
                      </template>
                            </div>
                          </template>
                        </div>
                      </template>
                      <div class="mb-sec__drop mb-hint" x-show="!sec.items.length">把欄位拖到這個區塊</div>
                    </div>
                  </div>
                </template>
                <div class="mb-row" style="margin-top:10px">
                  <button class="btn btn-ghost btn-sm" id="mb-add-group" @click="addGroupAt()">＋ 區塊</button>
                </div>
              </div>
              <div class="mb-pv" id="mb-preview-pane">
                <div class="mb-pv__t">輸出預覽（拖入、修改時跟著更新）</div>
                <div class="mb-pv__host" id="mb-output-host" x-effect="syncPreviews(JSON.stringify(def), sel, step)"></div>
                <details class="mb-pv__list" id="mb-list-pv" open>
                  <summary class="mb-pv__t">列表預覽與列表欄位</summary>
                  <div id="mb-list-host"></div>
                  <div class="mb-hint" style="margin-top:6px">列表顯示的欄位：</div>
                  <template x-for="c in L.availableColumns(def)" :key="c.key">
                    <label class="mb-chip"><input type="checkbox" :data-list-column="c.key" :checked="listColumnKeys().indexOf(c.key) >= 0"
                           @change="def.ui = L.toggleColumn(def, c.key)"> <span x-text="c.label"></span></label>
                  </template>
                  <div class="mb-hint" style="margin-top:6px">順序：</div>
                  <template x-for="(c, ci) in L.listColumns(def)" :key="c.key">
                    <span class="mb-chip"><span x-text="c.label"></span>
                      <button class="mb-ib" aria-label="往前" @click="def.ui = L.moveColumn(def, ci, -1)">←</button>
                      <button class="mb-ib" aria-label="往後" @click="def.ui = L.moveColumn(def, ci, 1)">→</button></span>
                  </template>
                </details>
                <div class="mb-hint" id="mb-preview-missing" x-show="previewMissing">預覽元件尚未載入（form-preview.js）；欄位照樣可以編輯與儲存。</div>
              </div>
            </div>
            <div class="mb-sr" aria-live="polite" id="mb-live" x-text="liveMsg"></div>
          </section>

          <!-- ④ 流程 -->
          <section x-show="step === 4" id="mb-step-4">
            <div class="mb-card" id="mb-sec-workflow">
              <div class="mb-row">
                <h3 style="margin:0">狀態</h3>
                <div class="mb-f" style="margin-left:auto;min-width:200px" :class="{ 'is-bad': hasProblem('workflow.initial') }">
                  <label for="mb-wf-initial">起始狀態</label>
                  <select id="mb-wf-initial" x-model="def.workflow.initial">
                    <template x-for="s in def.workflow.states" :key="s.key"><option :value="s.key" x-text="s.label + '（' + s.key + '）'" :selected="s.key === def.workflow.initial"></option></template>
                  </select>
                </div>
              </div>
              <table class="mb-table" id="mb-states">
                <thead><tr><th>代號</th><th>名稱</th><th>終點</th><th id="mb-sec-notify">進入時通知申請人</th><th>進入時通知</th><th>簽核</th><th></th></tr></thead>
                <tbody>
                  <template x-for="(s, si) in def.workflow.states" :key="si">
                    <tr :data-state-index="si" :data-state-key="s.key" :class="{ 'is-bad': hasProblemExact('workflow.states[' + si + ']') || hasProblem('workflow.states[' + si + '].key') || hasProblem('workflow.states[' + si + '].label') }">
                      <td><input class="mb-in" data-k="key" :value="s.key" @change="renameState(si, $event.target.value.trim())" style="width:110px"></td>
                      <td><input class="mb-in" data-k="label" x-model="s.label" style="width:110px"></td>
                      <td>
                        <select class="mb-in" data-k="final" x-model.boolean="s.final" style="width:70px">
                          <option value="false">否</option><option value="true">是</option>
                        </select>
                      </td>
                      <td>
                        <select class="mb-in" data-k="notify-requester" :value="(s.notify && s.notify.requester) ? 'true' : 'false'"
                                @change="setNotify(si, 'requester', $event.target.value === 'true')" style="width:70px">
                          <option value="false">否</option><option value="true">是</option>
                        </select>
                      </td>
                      <td>
                        <template x-for="u in ((s.notify && s.notify.users) || [])" :key="u">
                          <span class="mb-chip"><span x-text="userLabel(u)"></span><button class="mb-ib" @click="removeNotifyUser(si, u)">✕</button></span>
                        </template>
                        <select class="mb-in mb-in-s" data-k="notify-add" @change="addNotifyUser(si, $event.target.value); $event.target.value = ''">
                          <option value="">＋ 通知對象</option>
                          <template x-for="u in users" :key="u.username"><option :value="u.username" x-text="u.displayName + '（' + u.username + '）'"></option></template>
                        </select>
                      </td>
                      <td>
                        <select class="mb-in" data-k="has-approval" :value="s.approval ? 'true' : 'false'" @change="toggleApproval(si, $event.target.value === 'true')" style="width:90px">
                          <option value="false">無</option><option value="true">分層簽核</option>
                        </select>
                      </td>
                      <td><button class="mb-ib" @click="removeState(si)">✕</button></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <div class="mb-row" style="margin-top:8px">
                <button class="btn btn-ghost btn-sm" id="mb-add-state" @click="addState()">＋ 狀態</button>
              </div>

              <!-- 各簽核狀態的層 -->
              <div id="mb-sec-approval" class="mb-hint" style="margin-top:12px;font-weight:700">簽核（在上表把狀態設成「分層簽核」後，各層在這裡設定）</div>
              <template x-for="(s, si) in def.workflow.states" :key="'ap' + si">
                <template x-if="s.approval">
                  <div class="mb-sub" :data-approval-state="si">
                    <div class="mb-row">
                      <strong x-text="'「' + (s.label || s.key) + '」的簽核'"></strong>
                      <span class="mb-f" style="min-width:160px" :class="{ 'is-bad': hasProblem('workflow.states[' + si + '].approval.on_approved') }">
                        <label>全部通過後</label>
                        <select class="mb-in" data-k="on-approved" x-model="s.approval.on_approved">
                          <option value="">（請選擇）</option>
                          <template x-for="t in def.workflow.states" :key="t.key"><option :value="t.key" x-text="t.label" :selected="t.key === s.approval.on_approved"></option></template>
                        </select>
                      </span>
                      <span class="mb-f" style="min-width:160px" :class="{ 'is-bad': hasProblem('workflow.states[' + si + '].approval.on_rejected') }">
                        <label>退回後</label>
                        <select class="mb-in" data-k="on-rejected" x-model="s.approval.on_rejected">
                          <option value="">（請選擇）</option>
                          <template x-for="t in def.workflow.states" :key="t.key"><option :value="t.key" x-text="t.label" :selected="t.key === s.approval.on_rejected"></option></template>
                        </select>
                      </span>
                    </div>
                    <template x-for="(tier, ti) in s.approval.tiers" :key="ti">
                      <div class="mb-tier" :data-tier-index="ti" :class="{ 'is-bad': hasProblem('workflow.states[' + si + '].approval.tiers[' + ti + ']') }">
                        <div class="mb-row">
                          <strong x-text="'第 ' + (ti + 1) + ' 層'"></strong>
                          <button class="mb-ib" style="margin-left:auto" @click="s.approval.tiers.splice(ti, 1)">刪除這一層</button>
                        </div>
                        <template x-for="(a, ai) in tier.approvers" :key="ai">
                          <div class="mb-row" style="margin-top:5px" :data-approver-index="ai">
                            <select class="mb-in mb-in-s" data-k="approver-kind" :value="approverKind(a)" @change="tier.approvers.splice(ai, 1, newApprover($event.target.value))">
                              <template x-for="k in approverSources()" :key="k.value"><option :value="k.value" x-text="k.label" :selected="k.value === approverKind(a)"></option></template>

              </div>
              <div class="mb-diff" id="mb-diff" :data-loaded="diffLoaded ? '1' : '0'">
                <template x-for="(c, ci) in diffGroups()" :key="ci">
                  <div :data-change-path="c.path">
                    <span :class="'op-' + c.op" x-text="opLabel(c.op)"></span>
                    <span x-text="'［' + stepName(stepOf(c.path)) + '］' + c.path"></span>
                    <span x-show="c.op !== 'add'" x-text="'　舊：' + short(c.old)"></span>
                    <span x-show="c.op !== 'remove'" x-text="'　新：' + short(c.new)"></span>
                  </div>
                </template>
                <div class="mb-hint" x-show="diffLoaded && !diff.length">沒有差異</div>
              </div>
              <div class="mb-f" style="margin-top:12px">
                <label for="mb-publish-note">發布說明</label>
                <input id="mb-publish-note" class="mb-in" x-model="publishNote" placeholder="這一版改了什麼">
              </div>
              <div class="mb-row" style="margin-top:10px">
                <button class="btn btn-primary" id="mb-publish" @click="publish()" :disabled="busy">發布</button>
                <span class="mb-hint">已建立的單據維持它建立時的版本；新單據用新版。</span>
              </div>
              <template x-if="publishProblems.length">
                <div class="mb-err mb-probs" id="mb-publish-problems">
                  <div>未發布：有 <span x-text="publishProblems.length"></span> 個問題</div>
                  <template x-for="(p, pi) in publishProblems" :key="pi">
                    <div :data-problem-path="p.path" :data-problem-step="stepOf(p.path)">
                      <span x-text="'［' + stepName(stepOf(p.path)) + '］' + (p.path || '（整份）') + '：' + p.message"></span>
                      <a @click="jumpTo(p.path)">前往</a>
                    </div>
                  </template>
                </div>
              </template>
            </div>
            <div class="mb-card">
              <h3>版本</h3>
              <table class="mb-table" id="mb-versions">
                <thead><tr><th>版本</th><th>狀態</th><th>說明</th><th>發布者</th><th>時間</th><th></th></tr></thead>
                <tbody>
                  <template x-for="v in versions" :key="v.version">
                    <tr :data-version="v.version">
                      <td x-text="v.version === 0 ? '草稿' : '第 ' + v.version + ' 版'"></td>
                      <td x-text="v.status === 'draft' ? '草稿' : '已發布'"></td>
                      <td x-text="v.note || ''"></td>
                      <td x-text="v.published_by || v.created_by || ''"></td>
                      <td x-text="(v.published_at || v.created_at || '').replace('T', ' ').slice(0, 16)"></td>
                      <td><button class="btn btn-ghost btn-sm" x-show="v.status === 'published' && v.version !== latestVersion" :data-restore="v.version" @click="restore(v.version)" :disabled="busy">還原成新版</button></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <div class="mb-hint">還原不改歷史：把舊版內容再發布成新的一版。</div>
            </div>
          </section>
        </div>
      </template>
    </div>
  </main>

  <script src="../static/notif.js"></script>
  <script src="../static/ui.js"></script>
  <script src="../static/custom-layout.js"></script>
  <script src="../static/sidebar.js"></script>
  <script src="../js/module-builder-consts.js"></script>
  <script src="../js/module-builder-core.js"></script>
  <script src="../js/module-builder-form.js"></script>
  <script src="../js/module-builder-flow.js"></script>
  <script src="../js/module-builder-output.js"></script>
</body>
</html>
