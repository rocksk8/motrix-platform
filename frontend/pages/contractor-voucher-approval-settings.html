<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{if(localStorage.getItem('motrix_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../static/favicon.png">
  <title>此設定已搬移 — MOTRIX 專案管理系統</title>
  <script src="../static/auth-guard.js"></script>
  <link rel="stylesheet" href="../css/style.css?v=20260805g">
  <style>
    .moved-main {
      margin-left: var(--sidebar-w);
      margin-top: var(--topbar-h);
      padding: 32px 36px;
      min-height: calc(calc(100vh / var(--fz,1)) - var(--topbar-h));
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .moved-card {
      max-width: 480px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 40px 36px;
      background: var(--white);
    }
    .moved-title { font-size: 17px; font-weight: 700; color: var(--text-main); margin-bottom: 10px; }
    .moved-body { font-size: 13px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 24px; }
    .moved-link {
      display: inline-block;
      font-size: 13px; font-weight: 600;
      color: #fff; background: var(--accent, #4338CA);
      padding: 9px 20px; border-radius: 8px; text-decoration: none;
    }
    @media (max-width: 767px) {
      .moved-main { margin-left: 0 !important; padding: 20px 16px; }
    }
  </style>
</head>
<body>

  <header id="app-topbar" class="topbar"></header>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="app-sidebar"></aside>

  <!-- 🔴 `AS4`（2026-09-23）：這個頁面本身不再是一個設定入口。
       使用者原話：「匯款申請會簽整合進簽核設定，但系統內仍然有一個
       匯款申請簽核設定的選項」——這裡與「簽核設定」寫的是同一把
       system_settings key（contractor_voucher_approval_flow），
       而這一頁不知道「統一／獨立」那個開關存在 ⇒ 範圍設成統一流程時，
       在這裡存的設定永遠不會被用到，這一頁的說明卻承諾它會生效。
       ⚠️ 不直接刪檔／不直接 404：舊書籤還會連到這裡，而 404 說不出
       「搬到哪裡去了」——這裡改成導向新的簽核設定頁，並把理由講清楚。 -->
  <main class="moved-main">
    <div class="moved-card">
      <div class="moved-title">此設定已整合進「簽核設定」</div>
      <div class="moved-body">
        承攬商匯款申請的簽核順序，現在與其他文件類型一起設定：<br>
        在「簽核設定」頁把匯款申請設成「獨立設定」，就能編輯它專屬的簽核順序；
        設成「統一流程」則會與其他文件共用同一套。<br>
        即將自動跳轉，或按下方按鈕前往。
      </div>
      <a class="moved-link" href="approval-settings.html">前往簽核設定</a>
    </div>
  </main>

  <script src="../static/notif.js"></script>
  <script src="../static/sidebar.js"></script>
  <script>
    setTimeout(function () {
      window.location.replace('approval-settings.html')
    }, 1800)
  </script>
</body>
</html>
