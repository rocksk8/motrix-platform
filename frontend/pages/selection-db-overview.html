<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{if(localStorage.getItem('motrix_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../static/favicon.png">
  <title>選型資料庫涵蓋度總覽 — MOTRIX 營運管理系統</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="../css/style.css?v=20260805g">
  <style>
    [x-cloak]{display:none!important}
    .page-main{margin-left:var(--sidebar-w);margin-top:var(--topbar-h);padding:0;min-height:calc(100vh - var(--topbar-h));overflow:hidden;background:var(--white)}
    .ov-toolbar{height:48px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--border-light);background:#fff}
    .ov-toolbar .ttl{font-size:14px;font-weight:700;color:var(--text-primary)}
    .ov-toolbar .sub{font-size:11px;color:var(--text-dim)}
    .ov-body{height:calc(100vh - var(--topbar-h) - 48px);overflow:auto;padding:20px 24px}

    .ov-legend{display:flex;align-items:center;gap:14px;margin-bottom:16px;font-size:11.5px;color:var(--text-dim)}
    .ov-legend .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

    .ov-section{border:1px solid var(--border-light);border-radius:var(--radius-lg);background:#fff;box-shadow:var(--shadow-sm);margin-bottom:20px;overflow:hidden}
    .ov-section .oh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border-light);background:#FAFAF8}
    .ov-section .oh b{font-size:13.5px;color:var(--text-primary)}
    .ov-section .oh .n{font-size:11px;color:var(--text-dim);font-family:var(--font-en)}
    .ov-section .oh a.go{margin-left:auto;font-size:11.5px;color:var(--accent);text-decoration:none}
    .ov-section .oh a.go:hover{text-decoration:underline}
    .ov-twrap{overflow-x:auto}
    table.ov-table{width:100%;border-collapse:collapse;font-size:12.5px}
    table.ov-table th{text-align:left;padding:8px 12px;color:var(--text-dim);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--border-light);background:#fff;white-space:nowrap}
    table.ov-table td{padding:9px 12px;border-bottom:1px solid #F0EEE9;vertical-align:top}
    table.ov-table tr:hover td{background:#FAFAF8}
    .ov-rowname{font-weight:700;color:var(--text-primary);white-space:nowrap}
    .ov-count-badge{display:inline-block;min-width:1.6em;text-align:center;font-weight:700;font-size:12px;padding:2px 8px;border-radius:10px;font-family:var(--font-en)}
    .ov-count-badge.zero{background:#FBE7E7;color:#B3261E}
    .ov-count-badge.thin{background:#FFF3D6;color:#8A5A00}
    .ov-count-badge.ok{background:#E6F4EA;color:#1E7E34}
    .ov-brands{display:flex;flex-wrap:wrap;gap:6px}
    .ov-brand-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:10px;background:#FAFAF8;border:1px solid var(--border-light);color:var(--text-secondary);white-space:nowrap}
    .ov-brand-chip .c{font-weight:700;color:var(--text-primary)}
    .ov-empty-hint{color:var(--text-dim);font-size:11.5px}
    .ov-loading{text-align:center;color:var(--text-dim);font-size:13px;padding:40px 0}
  </style>
</head>
<body x-data="app()" x-init="init()" x-cloak>

  <header id="app-topbar" class="topbar"></header>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar"></aside>

    <main class="page-main">

      <div class="ov-toolbar">
        <span class="ttl">選型資料庫涵蓋度總覽</span>
        <span class="sub">各類別世代／分類底下的品牌與型號數量，一眼看出哪裡還太薄弱</span>
      </div>

      <div class="ov-body">
        <template x-if="loading">
          <div class="ov-loading">載入中…</div>
        </template>

        <template x-if="!loading">
          <div>
            <div class="ov-legend">
              <span><span class="sw" style="background:#FBE7E7"></span>0 個品牌（完全空白）</span>
              <span><span class="sw" style="background:#FFF3D6"></span>1 個品牌（偏薄弱）</span>
              <span><span class="sw" style="background:#E6F4EA"></span>2 個以上品牌</span>
            </div>

            <template x-for="sec in sections" :key="sec.key">
              <div class="ov-section">
                <div class="oh">
                  <b x-text="sec.title"></b>
                  <span class="n" x-text="'（' + sec.rows.length + ' 個' + sec.rowLabel + '，共 ' + sec.totalProducts + ' 筆產品）'"></span>
                  <a class="go" :href="sec.href">前往管理 →</a>
                </div>
                <div class="ov-twrap">
                  <table class="ov-table">
                    <thead>
                      <tr>
                        <th x-text="sec.rowLabel"></th>
                        <th>品牌數</th>
                        <th>總筆數</th>
                        <th>品牌明細</th>
                      </tr>
                    </thead>
                    <tbody>
                      <template x-for="row in sec.rows" :key="row.name">
                        <tr>
                          <td class="ov-rowname" x-text="row.name"></td>
                          <td><span class="ov-count-badge" :class="badgeClass(row.brands.length)" x-text="row.brands.length"></span></td>
                          <td><span class="ov-count-badge" :class="badgeClass(row.brands.length)" x-text="row.total"></span></td>
                          <td>
                            <div class="ov-brands" x-show="row.brands.length>0">
                              <template x-for="b in row.brands" :key="b.name">
                                <span class="ov-brand-chip"><span x-text="b.name"></span><span class="c" x-text="'×'+b.count"></span></span>
                              </template>
                            </div>
                            <span class="ov-empty-hint" x-show="row.brands.length===0">尚無任何品牌</span>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>

    </main>
  </div>

  <script>
  const API = '/api'
  function app() {
    return {
      session: {}, loading: true, sections: [],

      async init() {
        const s = JSON.parse(localStorage.getItem('motrix_session') || '{}')
        if (!s.token) { location.href = 'login.html'; return }
        this.session = s
        try {
          const r = await fetch(`${API}/auth/me`, { headers: { Authorization: 'Bearer ' + s.token } })
          if (!r.ok) { location.href = 'login.html'; return }
        } catch {}
        await this.loadAll()
        this.loading = false
      },

      badgeClass(n) {
        if (n === 0) return 'zero'
        if (n === 1) return 'thin'
        return 'ok'
      },

      // 把一批 products 依 row 分組並統計各品牌數量
      buildRows(rowDefs, products, rowKeyField) {
        return rowDefs.map(def => {
          const rowProducts = products.filter(p => p[rowKeyField] === def.key)
          const brandCounts = {}
          rowProducts.forEach(p => { brandCounts[p.brand] = (brandCounts[p.brand] || 0) + 1 })
          const brands = Object.keys(brandCounts).sort().map(name => ({ name, count: brandCounts[name] }))
          return { name: def.name, brands, total: rowProducts.length }
        })
      },

      async loadAll() {
        const headers = { Authorization: 'Bearer ' + this.session.token }
        const get = (path) => fetch(`${API}${path}`, { headers }).then(r => r.ok ? r.json() : [])

        const [
          netGens, netProds,
          swCats, swProds,
          moCats, moProds,
          acCats, acProds,
        ] = await Promise.all([
          get('/netarch-guide/generations'), get('/netarch-guide/products'),
          get('/switch-guide/categories'), get('/switch-guide/products'),
          get('/monitor-guide/categories'), get('/monitor-guide/products'),
          get('/access-guide/categories'), get('/access-guide/products'),
        ])

        const netRowDefs = (netGens || []).map(g => ({ key: g.id, name: g.gen_name + '（' + g.family_code + '）' }))
        const swRowDefs = (swCats || []).map(c => ({ key: c.code, name: c.name }))
        const moRowDefs = (moCats || []).map(c => ({ key: c.code, name: c.name }))
        const acRowDefs = (acCats || []).map(c => ({ key: c.code, name: c.name }))

        this.sections = [
          { key: 'netarch', title: '網路架構選型導覽', rowLabel: '世代', href: 'netarch-guide.html',
            rows: this.buildRows(netRowDefs, netProds || [], 'generation_id'),
            totalProducts: (netProds || []).length },
          { key: 'switch', title: '交換器選型導覽', rowLabel: '分類', href: 'switch-guide.html',
            rows: this.buildRows(swRowDefs, swProds || [], 'category_code'),
            totalProducts: (swProds || []).length },
          { key: 'monitor', title: '監控系統選型導覽', rowLabel: '分類', href: 'monitor-guide.html',
            rows: this.buildRows(moRowDefs, moProds || [], 'category_code'),
            totalProducts: (moProds || []).length },
          { key: 'access', title: '門禁系統選型導覽', rowLabel: '分類', href: 'access-guide.html',
            rows: this.buildRows(acRowDefs, acProds || [], 'category_code'),
            totalProducts: (acProds || []).length },
        ]
      },
    }
  }
  </script>

  <script src="../static/notif.js"></script>
  <script src="../static/sidebar.js"></script>
</body>
</html>
