<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{if(localStorage.getItem('motrix_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/api/system/branding/favicon">
  <title>權限設定 — MOTRIX 專案管理系統</title>
  <script src="../static/auth-guard.js"></script>
  <script src="../static/motrix-date.js"></script>
  <script defer src="../static/vendor/alpine-3.17.1.min.js"></script>
  <link rel="stylesheet" href="../css/style.css?v=20260805g">
  <!--
    權限設定（L2 模組 permmatrix；T67 PM-S2 檢視＋PM-S3 編輯）：角色 × 功能 × 動作的矩陣、某人的有效權限與理由、待生效清單、版本紀錄。
    - 只有最高管理者看得到（選單 perm=superadmin；所有 /api/permmatrix 端點也是）。
    - 格子內容全部來自各模組的能力宣告：沒宣告就沒有格子；還沒接上實際端點的格子標「未接入」。畫面不顯示能力代碼，只顯示中文名稱與一句話說明。
    - 編輯：勾格子 → 先看「一句話影響面板」（會發生什麼、影響幾位、何時生效）→ 確認才存；高風險放寬要填原因、等確認期間、需第二位最高管理者核准。
    - 只有『已接入』的格子可以勾；『未接入』的格子還沒有實際生效，不開放。
  -->
  <style>
    .pm-main { margin-left: var(--sidebar-w); margin-top: var(--topbar-h); padding: 24px 32px 60px;
      min-height: calc(calc(100vh / var(--fz,1)) - var(--topbar-h)); background: var(--white); }
    .pm-wrap { max-width: 1280px; }
    .pm-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0; }
    .pm-tab { padding: 6px 14px; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; cursor: pointer; font-size: 13px; font-family: inherit; }
    .pm-tab.on { background: var(--border-light); font-weight: 600; }
    .pm-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin: 10px 0; font-size: 13px; background: #fff; }
    .pm-err { padding: 8px 12px; border-radius: var(--radius); background: #fee2e2; color: #b91c1c; font-size: 13px; margin: 8px 0; }
    .pm-ok { padding: 8px 12px; border-radius: var(--radius); background: #dcfce7; color: #166534; font-size: 13px; margin: 8px 0; }
    .pm-btn { padding: 5px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; cursor: pointer; font-size: 12px; font-family: inherit; }
    .pm-btn.pri { background: var(--border-light); font-weight: 600; }
    .pm-btn[disabled] { opacity: .5; cursor: default; }
    .pm-modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 50; }
    .pm-modal > div { background: #fff; border-radius: var(--radius); padding: 18px 20px; width: min(560px, 92vw); max-height: calc(86vh / var(--fz,1)); overflow: auto; }
    .pm-modal textarea { width: 100%; box-sizing: border-box; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius); font-family: inherit; font-size: 13px; }
    .pm-note { padding: 8px 12px; border-radius: var(--radius); background: #fef3c7; color: #92400e; font-size: 13px; margin: 8px 0; }
    table.pm-t { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.pm-t th, table.pm-t td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border-light); vertical-align: top; }
    table.pm-t td.c, table.pm-t th.c { text-align: center; }
    .pm-tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; background: var(--border-light); }
    .pm-tag.hi { background: #fee2e2; color: #b91c1c; }
    .pm-tag.off { background: #e5e7eb; color: #6b7280; }
    .pm-sub { color: var(--text-secondary); font-size: 12px; }
    .pm-chg { color: #6d28d9; font-size: 11px; }
    select.pm-sel { padding: 7px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; font-family: inherit; background: #fff; }
    @media (max-width: 900px) { .pm-main { margin-left: 0; padding: 16px; } .pm-scroll { overflow-x: auto; } }
  </style>
</head>
<body x-data="permMatrixPage()" x-init="init()" x-cloak>
  <header id="app-topbar" class="topbar"></header>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="app-sidebar"></aside>
  <main class="pm-main">
    <div class="pm-wrap">
      <div class="pg">
        <div class="pg__l">
          <div class="pg__eyebrow">系統</div>
          <h1 class="pg__t">權限設定</h1>
          <p class="pg__s">看每個角色、每個人能做哪些事，以及為什麼。只有最高管理者看得到。勾選前會先說明會發生什麼事，確認後才會儲存，隨時可以一鍵復原。</p>
        </div>
      </div>

      <div class="pm-err" data-testid="pm-error" x-show="err" x-text="err"></div>
      <div class="pm-ok" data-testid="pm-msg" x-show="msg" x-text="msg"></div>

      <div class="pm-tabs">
        <template x-for="t in tabs" :key="t.id">
          <button class="pm-tab" :class="{ on: tab === t.id }" :data-testid="'pm-tab-' + t.id" @click="go(t.id)" x-text="t.label"></button>
        </template>
      </div>

      <section x-show="tab === 'matrix'" data-testid="pm-matrix">
        <div class="pm-note" x-show="m && !m.caps.length" data-testid="pm-empty">目前還沒有任何功能宣告可調整的權限項目；各功能接入後會出現在這裡。</div>
        <div class="pm-sub" x-show="m && m.caps.length">最高管理者永遠可以做所有事，不列在表中。標「已調整」的格子與預設不同。標「未接入」的項目還沒有實際生效，暫時不能勾選。</div>
        <template x-for="g in groups()" :key="g.name">
          <div class="pm-scroll">
            <table class="pm-t" style="margin-top:12px">
              <thead><tr><th x-text="g.name"></th><template x-for="r in m.roles" :key="r.role"><th class="c" x-text="r.label"></th></template></tr></thead>
              <tbody>
                <template x-for="c in g.caps" :key="c.key">
                  <tr :data-testid="'pm-row-' + c.key">
                    <td>
                      <b x-text="c.label"></b>
                      <span class="pm-tag hi" x-show="c.risk === 'high'">高風險</span>
                      <span class="pm-tag off" x-show="!c.wired">未接入</span>
                      <div class="pm-sub" x-text="c.desc"></div>
                    </td>
                    <template x-for="r in m.roles" :key="r.role">
                      <td class="c">
                        <input type="checkbox" :checked="c.cells[r.role].granted" :disabled="!c.wired || busy" :data-testid="'pm-cell-' + c.key + '-' + r.role"
                               :title="c.wired ? '' : '這個項目還沒有接入，暫時不能調整'" @click.prevent="askRole(c, r, !c.cells[r.role].granted)">
                        <div class="pm-chg" x-show="c.cells[r.role].changed">已調整</div>
                      </td>
                    </template>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
      </section>

      <section x-show="tab === 'effective'" data-testid="pm-effective">
        <select class="pm-sel" x-model="uid" @change="loadEffective()" data-testid="pm-user-select">
          <option value="">選擇使用者…</option>
          <template x-for="u in users" :key="u.id"><option :value="u.id" x-text="u.name + '（' + u.roleLabel + '）'"></option></template>
        </select>
        <div class="pm-card" x-show="eff">
          <b x-text="eff && eff.user.name"></b> <span class="pm-sub" x-text="eff && eff.user.roleLabel"></span>
          <table class="pm-t" style="margin-top:8px">
            <thead><tr><th>項目</th><th>能不能做</th><th>為什麼</th></tr></thead>
            <tbody>
              <template x-for="c in (eff ? eff.caps : [])" :key="c.key">
                <tr><td x-text="c.label"></td><td x-text="c.allowed ? '可以' : '不行'"></td><td class="pm-sub" x-text="c.why"></td></tr>
              </template>
            </tbody>
          </table>
        </div>
        <div class="pm-card" x-show="uid" data-testid="pm-override-form">
          <b>個別調整這位使用者</b>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
            <select class="pm-sel" x-model="ov.cap" data-testid="pm-ov-cap">
              <option value="">選擇項目…</option>
              <template x-for="c in wiredCaps()" :key="c.key"><option :value="c.key" x-text="c.unitLabel + '：' + c.label"></option></template>
            </select>
            <select class="pm-sel" x-model="ov.effect" data-testid="pm-ov-effect"><option value="allow">個別允許</option><option value="deny">個別禁止</option></select>
            <button class="pm-btn pri" :disabled="!ov.cap || busy" data-testid="pm-ov-go" @click="askUser()">下一步：看影響</button>
          </div>
        </div>
        <h3 style="margin-top:18px">目前的個人調整</h3>
        <div class="pm-sub" x-show="!hasOverrides()">沒有任何個人調整。</div>
        <template x-for="u in users.filter(x => x.overrides.length)" :key="u.id">
          <div class="pm-card">
            <b x-text="u.name"></b>
            <template x-for="o in u.overrides" :key="o.key">
              <div class="pm-sub"><span x-text="o.label + '：' + (o.effect === 'allow' ? '個別允許' : '個別禁止') + (o.reason ? '（' + o.reason + '）' : '')"></span>
                <button class="pm-btn" :disabled="busy" @click="askClear(u, o)">取消這項調整</button></div>
            </template>
          </div>
        </template>
      </section>

      <section x-show="tab === 'pending'" data-testid="pm-pending">
        <div class="pm-sub" x-show="!pending.length">目前沒有待生效的變更。</div>
        <template x-for="p in pending" :key="p.id">
          <div class="pm-card" :data-testid="'pm-pending-' + p.id">
            <b x-text="'變更 #' + p.id"></b>
            <div x-text="'申請人：' + p.requested_by + '　預定生效：' + (p.effective_at || '').slice(0, 16).replace('T', ' ')"></div>
            <div class="pm-sub" x-text="'原因：' + (p.reason || '—') + '　核准 ' + p.approvals.length + '／' + p.approvalsRequired"></div>
            <div style="margin-top:6px;display:flex;gap:6px">
              <button class="pm-btn" :disabled="busy || p.approvals.length >= p.approvalsRequired" :data-testid="'pm-approve-' + p.id" @click="askPending(p, 'approve')">核准</button>
              <button class="pm-btn" :disabled="busy" :data-testid="'pm-cancel-' + p.id" @click="askPending(p, 'cancel')">撤銷</button>
            </div>
          </div>
        </template>
      </section>

      <section x-show="tab === 'versions'" data-testid="pm-versions">
        <div class="pm-sub" x-show="!versions.length">還沒有任何調整紀錄。</div>
        <button class="pm-btn pri" x-show="versions.length" :disabled="busy" data-testid="pm-undo" @click="askUndo()">一鍵復原上一次調整</button>
        <table class="pm-t" x-show="versions.length" style="margin-top:8px">
          <thead><tr><th>時間</th><th>操作者</th><th>原因</th><th></th></tr></thead>
          <tbody>
            <template x-for="v in versions" :key="v.id">
              <tr><td x-text="(v.created_at || '').slice(0, 16).replace('T', ' ')"></td><td x-text="v.created_by"></td><td x-text="v.reason || '—'"></td><td><button class="pm-btn" :disabled="busy" @click="askRestore(v)">回到這一版</button></td></tr>
            </template>
          </tbody>
        </table>
      </section>
    </div>
  </main>

  <div class="pm-modal" x-show="dlg" data-testid="pm-dialog" @keydown.escape.window="dlg = null">
    <div x-show="dlg">
      <h3 x-text="dlg && dlg.title"></h3>
      <p data-testid="pm-dialog-sentence" x-text="dlg && dlg.sentence"></p>
      <div class="pm-sub" x-show="dlg && dlg.impact" x-text="dlg && dlg.impact"></div>
      <div class="pm-sub" x-show="dlg && dlg.usersText" x-text="dlg && dlg.usersText"></div>
      <div class="pm-sub" x-show="dlg && dlg.effective" x-text="dlg && dlg.effective"></div>
      <div class="pm-note" x-show="dlg && dlg.risk" x-text="dlg && dlg.risk"></div>
      <div class="pm-sub" x-show="dlg && dlg.reversibleText" x-text="dlg && dlg.reversibleText"></div>
      <label x-show="dlg && dlg.needReason" style="display:block;margin-top:10px">
        <span x-text="dlg && dlg.reasonLabel"></span>
        <textarea rows="2" x-model="reason" data-testid="pm-reason"></textarea>
      </label>
      <div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end">
        <button class="pm-btn" @click="dlg = null">取消</button>
        <button class="pm-btn pri" :disabled="busy" data-testid="pm-confirm" @click="confirmDlg()">確定儲存</button>
      </div>
    </div>
  </div>

  <script>
    function permMatrixPage() {
      return {
        _initDone: false,
        tab: 'matrix', err: '', msg: '', busy: false, dlg: null, reason: '', ov: { cap: '', effect: 'allow' }, m: null, users: [], uid: '', eff: null, pending: [], versions: [],
        tabs: [{ id: 'matrix', label: '角色與功能' }, { id: 'effective', label: '個人' }, { id: 'pending', label: '待生效' }, { id: 'versions', label: '調整紀錄' }],
        _hdr() {
          let s = {}
          try { s = JSON.parse(localStorage.getItem('motrix_session') || '{}') } catch (e) {}
          return { Authorization: 'Bearer ' + (s.token || ''), 'Content-Type': 'application/json' }
        },
        async _json(url, opt) {
          const r = await fetch(url, Object.assign({ headers: this._hdr() }, opt || {}))
          const d = await r.json().catch(() => null)
          if (!r.ok) throw new Error((d && d.detail) ? (typeof d.detail === 'string' ? d.detail : JSON.stringify(d.detail)) : ('失敗（' + r.status + '）'))
          return d
        },
        init() {
          if (this._initDone) return
          this._initDone = true
          this.go('matrix')
        },
        async go(t) {
          this.tab = t; this.err = ''
          try {
            if (t === 'matrix') this.m = await this._json('/api/permmatrix/matrix')
            else if (t === 'effective') { this.users = (await this._json('/api/permmatrix/users')).users; if (!this.m) this.m = await this._json('/api/permmatrix/matrix') }
            else if (t === 'pending') this.pending = (await this._json('/api/permmatrix/pending')).items
            else if (t === 'versions') this.versions = (await this._json('/api/permmatrix/versions')).items
          } catch (e) { this.err = String(e.message || e) }
        },
        groups() {
          const out = [], idx = {}
          for (const c of (this.m ? this.m.caps : [])) {
            const name = c.unitLabel
            if (!(name in idx)) { idx[name] = out.length; out.push({ name, caps: [] }) }
            out[idx[name]].caps.push(c)
          }
          return out
        },
        wiredCaps() { return (this.m ? this.m.caps : []).filter(c => c.wired && c.delegable) },
        async _post(url, body) {
          return this._json(url, { method: 'POST', body: body === undefined ? undefined : JSON.stringify(body) })
        },
        async _del(url) {
          return this._json(url, { method: 'DELETE' })
        },
        _open(title, pv, run, opt) {
          opt = opt || {}
          this.reason = ''
          this.dlg = { title, sentence: pv.sentence || '', impact: pv.impact || '', usersText: pv.usersText || '', effective: pv.effective || '', risk: pv.risk || '',
            reversibleText: pv.reversibleText || '', needReason: !!(pv.pending || opt.needReason), reasonLabel: opt.reasonLabel || '原因（必填，會留下紀錄）', run }
        },
        async confirmDlg() {
          const d = this.dlg
          if (!d) return
          if (d.needReason && this.reason.trim().length < 2) { this.err = '請填寫原因'; return }
          this.busy = true; this.err = ''; this.msg = ''
          try {
            const r = await d.run(this.reason.trim())
            this.dlg = null
            this.msg = r && r.pending ? '已送出：要等確認期間後才會生效' + (r.approvalsRequired ? '，且需要另一位最高管理者核准' : '') + '。'
              : (r && r.changed === false ? '沒有變更（已經是這個狀態）。' : '已儲存。')
            await this.reloadAll()
          } catch (e) { this.err = String(e.message || e) } finally { this.busy = false }
        },
        async reloadAll() {
          this.m = null
          await this.go(this.tab)
          if (this.tab === 'effective' && this.uid) await this.loadEffective()
        },
        async askRole(c, r, granted) {
          this.err = ''; this.msg = ''
          try {
            const body = { role: r.role, cap: c.key, granted }
            const pv = await this._post('/api/permmatrix/role-cap/preview', body)
            if (!pv.changed) { this.msg = '沒有變更（已經是這個狀態）。'; return }
            this._open('確認調整：' + r.label + '／' + c.label, pv, (reason) => this._post('/api/permmatrix/role-cap', Object.assign({ reason }, body)))
          } catch (e) { this.err = String(e.message || e) }
        },
        async askUser() {
          this.err = ''; this.msg = ''
          try {
            const body = { user_id: Number(this.uid), cap: this.ov.cap, effect: this.ov.effect }
            const pv = await this._post('/api/permmatrix/user-override/preview', body)
            this._open('確認個別調整', pv, (reason) => this._post('/api/permmatrix/user-override', Object.assign({ reason }, body)))
          } catch (e) { this.err = String(e.message || e) }
        },
        askClear(u, o) {
          this._open('取消個別調整', { sentence: u.name + '：' + o.label + ' 的' + (o.effect === 'allow' ? '個別允許' : '個別禁止') + '會取消，回到依角色的結果。', reversibleText: '隨時可以一鍵復原' },
            (reason) => this._del('/api/permmatrix/user-override?user_id=' + u.id + '&cap=' + encodeURIComponent(o.key) + '&reason=' + encodeURIComponent(reason)),
            { needReason: o.effect === 'deny' })
        },
        askPending(p, what) {
          const ap = what === 'approve'
          this._open(ap ? '核准這項變更' : '撤銷這項變更', { sentence: (ap ? '核准後，確認期間一到就會生效。' : '撤銷後這項變更不會生效。') + '（變更 #' + p.id + '）' },
            (reason) => this._post('/api/permmatrix/pending/' + p.id + '/' + what, { reason }), { needReason: !ap, reasonLabel: ap ? '備註（選填）' : '撤銷原因（必填）' })
        },
        askUndo() {
          this._open('一鍵復原', { sentence: '回到上一次調整之前的狀態。', reversibleText: '再按一次會繼續往前一步；歷史紀錄不會被刪掉。' },
            () => this._post('/api/permmatrix/undo'))
        },
        askRestore(v) {
          this._open('回到這一版', { sentence: '把權限設定回到 ' + (v.created_at || '').slice(0, 16).replace('T', ' ') + ' 的狀態；放寬高風險項目仍要走確認期間與核准。', reversibleText: '隨時可以一鍵復原' },
            (reason) => this._post('/api/permmatrix/versions/' + v.id + '/restore', { reason }), { needReason: true })
        },
        hasOverrides() { return this.users.some(u => u.overrides.length) },
        async loadEffective() {
          this.eff = null
          if (!this.uid) return
          try { this.eff = await this._json('/api/permmatrix/users/' + this.uid + '/effective') } catch (e) { this.err = String(e.message || e) }
        },
      }
    }
  </script>
  <script src="../static/notif.js"></script>
  <script src="../static/ui.js"></script>
  <script src="../static/sidebar.js"></script>
</body>
</html>
