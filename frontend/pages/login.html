<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../static/favicon.png">
  <title>登入 — MOTRIX 專案管理系統</title>
  <script defer src="../static/vendor/alpine-3.17.1.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'LINE Seed TW_OTF', system-ui, sans-serif;
      background: #0A0A0A;
      min-height: calc(100dvh / var(--fz,1));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #F5F4F0;
    }
    .login-wrap {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }
    .logo-area {
      text-align: center;
      margin-bottom: 36px;
    }
    .logo-area img {
      height: 38px;
      filter: brightness(0) invert(1);
      margin-bottom: 10px;
    }
    .logo-fallback {
      font-family: 'LINE Seed TW_OTF', sans-serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .12em;
      color: #F5F4F0;
      margin-bottom: 6px;
    }
    .logo-sub {
      font-size: 11px;
      color: #555;
      letter-spacing: .08em;
      font-family: 'LINE Seed TW_OTF', sans-serif;
    }
    .card {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 32px;
    }
    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .card-sub {
      font-size: 12px;
      color: #666;
      margin-bottom: 28px;
    }
    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block;
      font-size: 11px;
      font-family: 'LINE Seed TW_OTF', sans-serif;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #666;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 11px 14px;
      background: #1A1A1A;
      border: 1px solid #2A2A2A;
      border-radius: 7px;
      color: #F5F4F0;
      font-size: 14px;
      font-family: 'LINE Seed TW_OTF', sans-serif;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .form-input:focus {
      border-color: #C8102E;
      box-shadow: 0 0 0 3px rgba(200,16,46,.18);
    }
    .form-input::placeholder { color: #444; }
    .form-input.error { border-color: #DC2626; }
    .error-msg {
      font-size: 12px;
      color: #F87171;
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      /* 這兩頁是登入前的獨立頁，刻意不載入 css/style.css（沒有 session，也不要側欄／頂欄），
         所以不能用 CSS 變數——解析不到會整個沒有背景色，登入鈕會變成只剩文字。
         色值與 style.css 的 --accent / --accent-hover 同步，改色票時這兩頁要一起改。 */
      background: #C8102E;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 14px;
      font-family: 'LINE Seed TW_OTF', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: background .12s;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-login:hover { background: #A60D26; }
    .btn-login:disabled { opacity: .5; cursor: not-allowed; }
    .divider {
      border: none;
      border-top: 1px solid #1E1E1E;
      margin: 22px 0;
    }
    .footer-note {
      text-align: center;
      font-size: 11px;
      color: #444;
      line-height: 1.7;
    }
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .eye-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      padding: 8px;
      min-width: 36px;
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .eye-btn:hover { color: #888; }
    .pw-wrap { position: relative; }
    .btn-secondary {
      width: 100%;
      padding: 10px;
      background: none;
      border: 1px solid #333;
      color: #999;
      border-radius: 7px;
      font-size: 13px;
      font-family: 'LINE Seed TW_OTF', sans-serif;
      cursor: pointer;
      transition: all .12s;
      margin-top: 8px;
    }
    .btn-secondary:hover { color: #ddd; border-color: #444; }
    .passkey-status {
      font-size: 12px;
      color: #666;
      text-align: center;
      margin: 14px 0;
    }
  </style>
</head>
<!-- Alpine 3 會自動呼叫 x-data 物件上的 init()，所以這裡刻意不寫 x-init。
     實測（2026-09-11）：加了 x-init="init()" 會讓 init() 在載入時跑**兩次**
     ——自動那次一次、x-init 一次——連帶把版本查詢與既有 session 檢查都做兩遍。
     原本這裡是 `@load="init()"`：那是無效的（load 事件只在 window 上觸發、
     不會冒泡到 body），但因為有自動呼叫所以看不出來，屬於誤導性的死碼。 -->
<!-- `data-no-topbar`：**未登入頁**，本來就不該有頂欄（它要顯示使用者身分
     與通知）。🔑 宣告它是為了讓「刻意沒有」與「忘了加」分得開；
     ⚠️ 也是為了讓下一個人**不要順手補齊** —— 補上去會在登入前就去要權限。 -->
<body x-data="loginPage()" data-no-topbar>

  <div class="login-wrap">
    <div class="logo-area">
      <img src="../static/logo.png" alt="MOTRIX"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
      <div class="logo-fallback" style="display:none">MOTRIX</div>
      <div class="logo-sub">SYNERGY INTEGRATION ERP</div>
    </div>

    <div class="card">
      <div class="card-title">登入系統</div>
      <div class="card-sub">允碩整合集創 · 內部管理平台</div>

      <form @submit.prevent="login()" x-show="!totpStep">
        <div class="form-group">
          <label class="form-label">帳號</label>
          <input class="form-input" :class="{error: error}"
                 type="text" x-model="username" x-ref="username" @keydown.enter="onEnterDown($event)" @keyup.enter="onEnterUp($event)"
                 placeholder="輸入帳號" autocomplete="username" autofocus>
        </div>

        <div class="form-group">
          <label class="form-label">密碼</label>
          <div class="pw-wrap">
            <input class="form-input" :class="{error: error}"
                   :type="showPw ? 'text' : 'password'"
                   x-model="password" x-ref="password" @keydown.enter="onEnterDown($event)" @keyup.enter="onEnterUp($event)"
                   placeholder="輸入密碼" autocomplete="current-password"
                   style="padding-right:42px">
            <!-- 按下時不搶焦點、也不在 Tab 順序裡：焦點留在密碼欄，切換後直接按 Enter 就送出（2026-09-25） -->
            <button type="button" class="eye-btn" tabindex="-1" @mousedown.prevent @click="showPw=!showPw">
              <template x-if="!showPw">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              </template>
              <template x-if="showPw">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/></svg>
              </template>
            </button>
          </div>
          <div class="error-msg" x-show="error">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>
            <span x-text="error"></span>
          </div>
        </div>

        <button type="submit" class="btn-login" :disabled="loading">
          <template x-if="loading">
            <div class="spinner"></div>
          </template>
          <template x-if="!loading">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>
          </template>
          <span x-text="loading ? '驗證中…' : '登入'"></span>
        </button>

        <button type="button" @click="startWebauthnLogin()" class="btn-secondary" :disabled="loading" x-show="webauthnConfigured">
          或使用 Passkey 登入
        </button>
      </form>

      <form @submit.prevent="completeWebauthnLogin()" x-show="webauthnStep">
        <div class="form-group">
          <div class="passkey-status">
            請在認證器上完成驗證…
          </div>
          <div class="error-msg" x-show="error">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>
            <span x-text="error"></span>
          </div>
        </div>

        <button type="button" @click="backToLogin()"
                style="width:100%;background:none;border:none;color:#666;font-size:12px;cursor:pointer;padding:6px">
          ← 返回重新登入
        </button>
      </form>

      <form @submit.prevent="verifyTotp()" x-show="totpStep">
        <div class="form-group">
          <label class="form-label">兩步驟驗證碼</label>
          <input class="form-input" :class="{error: error}"
                 type="text" inputmode="numeric" x-model="totpCode" x-ref="totpCode"
                 @keydown.enter="onEnterDown($event)" @keyup.enter="onEnterUp($event)"
                 placeholder="請輸入驗證 App 顯示的 6 位數字，或救援碼" autocomplete="one-time-code" autofocus>
          <div class="error-msg" x-show="error">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>
            <span x-text="error"></span>
          </div>
        </div>

        <button type="submit" class="btn-login" :disabled="loading">
          <template x-if="loading">
            <div class="spinner"></div>
          </template>
          <span x-text="loading ? '驗證中…' : '驗證'"></span>
        </button>

        <div x-show="qrCodePng" style="text-align:center;margin-top:22px;padding-top:20px;border-top:1px solid #1E1E1E">
          <div style="font-size:11px;color:#666;margin-bottom:10px">或用手機相機掃描 QR code 核准登入</div>
          <img :src="qrCodePng" width="160" height="160" style="border-radius:8px;background:#fff;padding:8px">
        </div>

        <button type="button" @click="backToLogin()"
                style="width:100%;margin-top:10px;background:none;border:none;color:#666;font-size:12px;cursor:pointer;padding:6px">
          ← 返回重新登入
        </button>
      </form>

      <hr class="divider">
      <div class="footer-note">
        如需開立帳號或重設密碼，請聯繫系統管理員<br>
        <span style="color:#333" x-text="'MOTRIX 專案管理系統 ' + (systemVersion || 'v1.0') + ' · 允碩整合集創'"></span>
      </div>
    </div>
  </div>

  <script>
  function loginPage() {
    return {
      username: '',
      password: '',
      showPw:   false,
      loading:  false,
      error:    '',
      systemVersion: '',
      webauthnConfigured: false,
      totpStep: false,
      totpCode: '',
      challengeToken: '',
      qrCodePng: '',
      qrPollTimer: null,
      webauthnStep: false,
      webauthnChallenge: '',

      // 2026-09-11：這裡原本還有一個 `async init() { this.checkWebauthnConfig() }`，
      // 但物件實字下面第二個 init()（抓版本號＋檢查既有 session 的那個）把它整個
      // 覆蓋掉了——JS 的重複鍵是後者勝出，而且**不會有任何警告**。
      // 後果：`checkWebauthnConfig()` 從來沒被呼叫過，`webauthnConfigured` 永遠
      // 是 false，「或使用 Passkey 登入」按鈕永遠不顯示。也就是 Passkey 註冊得
      // 起來，卻永遠登不進去。已把這一行併進下面那個唯一的 init()。
      async checkWebauthnConfig() {
        try {
          const r = await fetch('/api/system/webauthn-config-status')
          const data = await r.json().catch(() => ({}))
          this.webauthnConfigured = !!data.configured
        } catch {}
      },

      // Enter 明確送出，不只依賴表單的隱式送出（2026-09-25，使用者：自己打字後按 Enter 完全沒反應）。
      // ・keydown：輸入法組字中的 Enter 是「選字」，不送出；其餘攔下預設行為、自己呼叫 login()
      // ・keyup 後備：瀏覽器的帳號建議下拉開著時，keydown 會被瀏覽器拿去選建議、頁面收不到 ⇒
      //   只收到 keyup 的那一次由 keyup 送出；keydown 已處理過或組字中的 Enter 則不重複送
      // ・重複按 Enter：login() 在 loading 中直接返回，只送一次
      _enterDown: false,
      _imeEnter: false,
      onEnterDown(e) {
        if (e.isComposing || e.keyCode === 229) { this._imeEnter = true; return }
        e.preventDefault()
        this._enterDown = true
        this._submitStep()
      },
      onEnterUp(e) {
        const handled = this._enterDown || this._imeEnter || e.isComposing
        this._enterDown = false
        this._imeEnter = false
        if (!handled) this._submitStep()
      },
      // 同一套 Enter 處理用在帳密步驟與驗證碼步驟（2026-09-25：驗證碼欄原本只靠表單的隱式送出）
      _submitStep() {
        return this.totpStep ? this.verifyTotp() : this.login()
      },

      async login() {
        if (this.loading) return
        this.error = ''
        // 瀏覽器自動填入不一定觸發 input 事件 ⇒ x-model 還是空的，按 Enter 會說「請輸入帳號與密碼」。
        // 送出當下以欄位上實際的值為準（2026-09-25）。
        if (this.$refs.username) this.username = this.$refs.username.value
        if (this.$refs.password) this.password = this.$refs.password.value
        if (!this.username || !this.password) {
          this.error = '請輸入帳號與密碼'; return
        }
        this.loading = true
        try {
          const res = await fetch('/api/auth/login', {
            method:  'POST',
            headers: {'Content-Type': 'application/json'},
            body:    JSON.stringify({ username: this.username.trim(), password: this.password })
          })
          if (!res.ok) {
            const err = await res.json().catch(() => ({}))
            this.error   = err.detail || '帳號或密碼錯誤'
            this.loading = false; return
          }
          const data = await res.json()
          if (data.totpRequired) {
            this.challengeToken = data.challengeToken
            this.qrCodePng      = data.qrCodePng || ''
            this.totpStep = true
            this.loading  = false
            this._startQrPolling()
            return
          }
          this._storeSessionAndRedirect(data)
        } catch(e) {
          this.error   = '連線失敗，請確認伺服器是否啟動'
          this.loading = false
        }
      },

      async verifyTotp() {
        if (this.loading) return                                    // 連按 Enter 只送一次
        this.error = ''
        if (this.$refs.totpCode) this.totpCode = this.$refs.totpCode.value   // 自動填入不一定觸發 input 事件
        if (!this.totpCode) { this.error = '請輸入驗證碼'; return }
        this.loading = true
        try {
          const res = await fetch('/api/auth/login/totp', {
            method:  'POST',
            headers: {'Content-Type': 'application/json'},
            body:    JSON.stringify({ challenge_token: this.challengeToken, code: this.totpCode.trim() })
          })
          if (!res.ok) {
            const err = await res.json().catch(() => ({}))
            this.error   = err.detail || '驗證碼不正確'
            this.loading = false
            if (res.status === 400) this.backToLogin()  // challenge 逾時/作廢，只能重新登入
            return
          }
          const data = await res.json()
          this._storeSessionAndRedirect(data)
        } catch(e) {
          this.error   = '連線失敗，請確認伺服器是否啟動'
          this.loading = false
        }
      },

      _startQrPolling() {
        if (this.qrPollTimer) clearInterval(this.qrPollTimer)
        this.qrPollTimer = setInterval(async () => {
          try {
            // challenge 走 header（§8 FX22）。⚠️ 這一支是**每 2 秒一次**的，
            // 走網址的話它在 access log 裡留下的不是一筆，是一整串。
            const res = await fetch('/api/auth/login/qr-status',
              { headers: { 'X-Login-Challenge': this.challengeToken } })
            if (!res.ok) {
              // challenge 逾時/作廢（含錯誤密碼次數過多）——回到重新登入畫面
              this.backToLogin()
              return
            }
            const data = await res.json()
            if (data.token) {
              // 手機已核准，直接完成登入，不用使用者在電腦上按任何東西
              this._storeSessionAndRedirect(data)
            }
            // 否則 { pending: true }，什麼都不做，等下一輪
          } catch (e) {
            // 網路暫時抖動，不中斷輪詢，下一輪再試
          }
        }, 2000)
      },

      backToLogin() {
        if (this.qrPollTimer) { clearInterval(this.qrPollTimer); this.qrPollTimer = null }
        this.totpStep      = false
        this.webauthnStep  = false
        this.totpCode       = ''
        this.challengeToken = ''
        this.qrCodePng      = ''
        this.error          = ''
        this.password       = ''
      },

      async startWebauthnLogin() {
        this.error = ''
        if (!this.username) { this.error = '請輸入帳號'; return }
        this.loading = true
        try {
          const res = await fetch('/api/auth/webauthn/login/begin', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ username: this.username.trim() })
          })
          if (!res.ok) {
            this.loading = false
            this.error = '此帳號無法使用 Passkey 登入'
            return
          }
          const data = await res.json()
          this.webauthnChallenge = data.challengeToken
          this.challengeToken = data.challengeToken
          const opts = data.options

          // 後端回傳的 options 裡，所有二進位欄位都是 base64 字串，瀏覽器要的是
          // ArrayBuffer——每一個都要轉，漏一個就是一句看不懂的 TypeError。
          // 2026-09-11：`opts.user` 只存在於**註冊**用的 options；認證
          // （generate_authentication_options）不帶 user，原本直接讀 opts.user.id
          // 會丟 "Cannot read properties of undefined"。加上存在性判斷。
          if (typeof opts.challenge === 'string') opts.challenge = this._b64ToUint8Array(opts.challenge)
          if (opts.user && typeof opts.user.id === 'string') opts.user.id = this._b64ToUint8Array(opts.user.id)
          if (opts.allowCredentials) {
            opts.allowCredentials = opts.allowCredentials.map(c => ({
              ...c, id: typeof c.id === 'string' ? this._b64ToUint8Array(c.id) : c.id
            }))
          }

          const cred = await navigator.credentials.get({ publicKey: opts })
          if (!cred) {
            this.loading = false
            this.error = '驗證已取消'
            return
          }
          this.webauthnStep = true
          this.loading = false
          this._webauthnCredential = cred
          await this.completeWebauthnLogin()
        } catch(e) {
          this.loading = false
          this.error = e.message || '驗證失敗'
        }
      },

      async completeWebauthnLogin() {
        this.error = ''
        this.loading = true
        try {
          const cred = this._webauthnCredential
          if (!cred) { this.error = '缺少認證器回應'; return }

          const body = {
            challengeToken: this.challengeToken,
            username: this.username,
            id: cred.id,
            // 同 change-password.html：py_webauthn 會驗 type（恆為 "public-key"），
            // 少了就是 InvalidJSONStructure。2026-09-10 補。
            type: cred.type || 'public-key',
            rawId: this._uint8ArrayToB64(new Uint8Array(cred.rawId)),
            response: {
              clientDataJSON: this._uint8ArrayToB64(new Uint8Array(cred.response.clientDataJSON)),
              authenticatorData: this._uint8ArrayToB64(new Uint8Array(cred.response.authenticatorData)),
              signature: this._uint8ArrayToB64(new Uint8Array(cred.response.signature)),
              userHandle: cred.response.userHandle ? this._uint8ArrayToB64(new Uint8Array(cred.response.userHandle)) : null
            }
          }

          const res = await fetch('/api/auth/webauthn/login/complete', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body)
          })
          if (!res.ok) {
            const err = await res.json().catch(() => ({}))
            this.error = err.detail || '驗證失敗'
            this.loading = false
            return
          }
          const data = await res.json()
          this._storeSessionAndRedirect(data)
        } catch(e) {
          this.error = e.message || '連線失敗'
          this.loading = false
        }
      },

      _b64ToUint8Array(b64) {
        // WebAuthn 使用 URL-safe base64（用 - 和 _ 替代 + 和 /），轉換為標準 base64
        const std64 = b64.replace(/-/g, '+').replace(/_/g, '/')
        const binary = atob(std64)
        const bytes = new Uint8Array(binary.length)
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i)
        return bytes
      },

      _uint8ArrayToB64(bytes) {
        let binary = ''
        for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i])
        // 2026-09-10：這裡原本直接回傳 btoa()（標準 base64、含 padding），
        // 但 change-password.html 的同名函式回傳的是 base64url、去 padding——
        // 同一個協定兩個頁面兩種格式。後端現在兩種都吃得下（見
        // routers/auth.py::_b64url_decode），但格式漂移遲早會咬人，統一成
        // WebAuthn 慣用的 base64url。
        return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '')
      },

      _storeSessionAndRedirect(data) {
        if (this.qrPollTimer) { clearInterval(this.qrPollTimer); this.qrPollTimer = null }
        localStorage.setItem('motrix_session', JSON.stringify({
          token:       data.token,
          userId:      data.userId,
          username:    data.username,
          displayName: data.displayName,
          role:        data.role,
          modules:     data.modules,
          loginAt:     data.loginAt,
        }))
        window.location.href = '../index.html'
      },

      async init() {
        // 唯一的 init()——不要再新增第二個（見 checkWebauthnConfig 上方的說明）
        this.checkWebauthnConfig()

        fetch('/api/system/version')
          .then(res => res.ok ? res.json() : null)
          .then(data => { if (data && data.version) this.systemVersion = data.version })
          .catch(() => {})

        const s = localStorage.getItem('motrix_session')
        if (!s) return
        try {
          const session = JSON.parse(s)
          if (!session.token) return
          const res = await fetch('/api/auth/me', {
            headers: {'Authorization': 'Bearer ' + session.token}
          })
          if (res.ok) window.location.href = '../index.html'
          else         localStorage.removeItem('motrix_session')
        } catch(e) {}
      }
    }
  }
  </script>
</body>
</html>
