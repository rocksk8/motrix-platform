<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{if(localStorage.getItem('motrix_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/api/system/branding/favicon">
  <title>自訂模組 — MOTRIX 專案管理系統</title>
  <script>
    /* 預覽模式（模組建構器的即時預覽，docs/platform/BUILDER-UX.md §3.3；A 為本掛鉤檔主）。
     * 只有 ?preview=1 才開；開了之後本頁**不打任何 API**——同一個旗標 window.MOTRIX_PREVIEW：
     *   ① 共用腳本（auth-guard／notif／sidebar）看到旗標就不執行；
     *   ② 本頁的 api／post／put 看到旗標就拒絕；
     *   ③ 最後一道：fetch／XMLHttpRequest／sendBeacon／WebSocket／EventSource 換成拒絕並記次（__motrixPreviewBlocked，正常情況是 0）。
     * iframe 的 sandbox（allow-scripts allow-same-origin）擋不住同源頁自行解除 ⇒ 真正的防線是這個旗標。 */
    (function () {
      var on = false
      try { on = new URLSearchParams(location.search).get('preview') === '1' } catch (e) {}
      if (!on) return
      window.MOTRIX_PREVIEW = true
      window.__motrixPreviewBlocked = 0
      function refuse() { window.__motrixPreviewBlocked++; throw new Error('預覽模式不打 API') }
      function refuseAsync() { window.__motrixPreviewBlocked++; return Promise.reject(new Error('預覽模式不打 API')) }
      try { Object.defineProperty(window, 'fetch', { value: refuseAsync, writable: false, configurable: false }) } catch (e) { window.fetch = refuseAsync }
      try { XMLHttpRequest.prototype.open = refuse } catch (e) {}
      try { if (navigator.sendBeacon) navigator.sendBeacon = function () { window.__motrixPreviewBlocked++; return false } } catch (e) {}
      try { window.WebSocket = refuse; window.EventSource = refuse } catch (e) {}
      document.documentElement.setAttribute('data-preview', '1')
    })()
  </script>
  <script>
    /* 嵌入模式（建構器方案 B：自訂模組掛成內建頁面的頁籤；docs/platform/plans/BUILDER-B-DESIGN.md §5.3）。
     * ?embed=1 ⇒ 本頁被同源 iframe 嵌在別的頁裡：不畫頂欄／側欄、不跑通知腳本（旗標 window.MOTRIX_EMBED，sidebar.js／notif.js 看到就不執行），
     * 並把頁面高度用 postMessage 回報給外層（mount-tabs.js 檢查 origin 與 source）。**不改任何權限判斷**：登入檢查（auth-guard）照跑、各端點照驗。 */
    (function () {
      try {
        if (new URLSearchParams(location.search).get('embed') === '1') {
          window.MOTRIX_EMBED = true
          document.documentElement.setAttribute('data-embed', '1')
        }
      } catch (e) {}
    })()
  </script>
  <script src="../static/auth-guard.js"></script>
  <script defer src="../static/vendor/alpine-3.17.1.min.js"></script>
  <link rel="stylesheet" href="../css/style.css?v=20260805g">
  <link rel="stylesheet" href="../css/custom-form.css">
  <!--
    自訂模組的執行頁（CUSTOMIZATION-SPEC §3.7、P8）：所有自訂模組共用這一頁，`?key=<模組>`（可加 `&no=<單號>` 直接開單據）。
    - 表單與列表完全由 `GET /api/custom/{key}/meta` 的定義產生（欄位、分組、列表欄 ⇒ custom-layout.js，與建構器同一份規則）。
    - 單據凍結在建立時的定義版本：顯示用單據自己的那一版（與目前版不同時，以伺服器依那一版產生的輸出為準）。
    - 公式欄唯讀（伺服器計算）；400 的 problems[{key}] 標回對應欄位。
    - 簽核人不需要模組權限（伺服器規則）：沒有列表權限時，仍可用 `&no=` 開自己要簽的單據
      （「待我簽核」與通知中心會帶好 key 與 no，不必手打）。
    - 參照欄的選項走 `GET /api/custom/{key}/ref-options/{欄位}?q=`（可搜尋）；403 才退回手動輸入代號。
  -->
  <style>
    .cr-main { margin-left: var(--sidebar-w); margin-top: var(--topbar-h); padding: 28px 36px 60px;
      min-height: calc(calc(100vh / var(--fz,1)) - var(--topbar-h)); background: var(--white); }
    .cr-wrap { max-width: 1180px; }
    .cr-err { margin-top: 14px; padding: 12px 16px; border-radius: 8px; background: var(--tone-danger-bg);
      border: 1px solid var(--tone-danger-border); color: var(--tone-danger-fg); font-size: 13px; line-height: 1.6; }
    .cr-note { margin-top: 10px; padding: 10px 14px; border-radius: 8px; background: var(--tone-info-bg);
      border: 1px solid var(--tone-info-border); color: var(--tone-info-fg); font-size: 12.5px; line-height: 1.6; }
    .cr-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 18px 0 12px; }
    .cr-bar .grow { flex: 1; }
    .cr-card { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface, #fff); }
    .cr-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .cr-table th, .cr-table td { padding: 9px 12px; border-bottom: 1px solid var(--border-light); text-align: left; vertical-align: top; }
    .cr-table th { font-size: 11px; color: var(--text-secondary); font-weight: 600; background: var(--surface-muted, #FAFAF8); }
    .cr-table tbody tr { cursor: pointer; }
    .cr-table tbody tr:hover td { background: var(--surface-muted, #FAFAF8); }
    .cr-empty { padding: 28px; text-align: center; color: var(--text-dim); font-size: 13px; }
    .cr-status { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--border-light); color: var(--text-secondary); white-space: nowrap; }
    .cr-panel { margin-top: 18px; border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; background: var(--surface, #fff); }
    .cr-panel h2 { font-size: 16px; font-weight: 700; margin: 0 0 4px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .cr-sub { font-size: 12px; color: var(--text-secondary); }
    /* 表單欄位的外觀（.cr-sec／.cr-grid／.cr-f…）在 css/custom-form.css，與建構器畫布共用 */
    .cr-note-in { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 13px; font-family: inherit; background: var(--white); color: var(--text-main, inherit); }
    .cr-kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px 16px; }
    .cr-kv div span { display: block; font-size: 11px; color: var(--text-secondary); }
    .cr-kv div b { font-weight: 500; font-size: 13.5px; word-break: break-word; }
    .cr-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
    .cr-tiers { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
    .cr-tier { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .cr-tier .n { font-weight: 700; color: var(--text-secondary); min-width: 46px; }
    .cr-tier .ok { color: var(--success); }
    .cr-tier .cur { color: var(--accent); font-weight: 700; }
    .cr-ref-q { margin-bottom: 4px; }
    .cr-flist { list-style: none; margin: 4px 0 0; padding: 0; font-size: 13px; }
    .cr-flist li { padding: 2px 0; }
    .cr-flist a { margin-left: 8px; font-size: 12px; }
    .cr-ref-list { max-height: 180px; overflow: auto; border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
    .cr-opt { display: flex; gap: 6px; align-items: center; padding: 2px 0; font-size: 13px; }
    .cr-ref-why { font-size: 11.5px; color: var(--text-secondary); margin-top: 3px; line-height: 1.5; }
    .cr-log { font-size: 12px; color: var(--text-secondary); line-height: 1.8; }
    .cr-frame { width: 100%; height: 520px; border: 1px solid var(--border-light); border-radius: 8px; background: #fff; }
    @media (max-width: 767px) {
      .cr-main { margin-left: 0; padding: 18px 14px 48px; }
      /* 手機：列表改成一列一張卡（每格帶欄名） */
      .cr-table thead { display: none; }
      .cr-table, .cr-table tbody, .cr-table tr, .cr-table td { display: block; width: 100%; box-sizing: border-box; }
      .cr-table tr { border-bottom: 1px solid var(--border); padding: 6px 0; }
      .cr-table td { border: none; padding: 3px 12px; display: flex; gap: 10px; }
      .cr-table td::before { content: attr(data-label); flex: 0 0 84px; color: var(--text-secondary); font-size: 11.5px; }
      .cr-panel { padding: 14px; }
      .cr-kv { grid-template-columns: 1fr; }
      .cr-frame { height: 420px; }
    }
    /* 預覽模式（BUILDER-UX §3.3）：建構器選中的欄位；外框用 token，不用色碼 */
    .cr-f.is-preview-hl { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6px; }
    .cr-f .cr-ph { color: var(--text-secondary); font-size: 13px; padding: 8px 0; }
    html[data-preview="1"] .cr-main { margin-left: 0; margin-top: 0; padding: 12px 16px 16px; }
    html[data-embed="1"] #app-topbar, html[data-embed="1"] #app-sidebar, html[data-embed="1"] .sidebar-overlay, html[data-embed="1"] .pg { display: none !important; }
    html[data-embed="1"] .cr-main { margin: 0; padding: 8px 4px 12px; }
    html[data-embed="1"] body { background: transparent; min-height: 0; height: auto; }
  </style>
</head>
<body x-data="customRecordsPage()" x-init="init()" x-cloak>
  <header id="app-topbar" class="topbar"></header>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="app-sidebar"></aside>
  <main class="cr-main">
    <div class="cr-wrap">
      <div class="pg">
        <div class="pg__l">
          <div class="pg__eyebrow">自訂模組</div>
          <h1 class="pg__t" id="cr-title" x-text="def ? def.name : (loading ? '載入中…' : '自訂模組')"></h1>
          <p class="pg__s" x-show="def">
            定義第 <span id="cr-def-version" x-text="metaVersion"></span> 版。已建立的單據維持建立當時的版本。
          </p>
        </div>
      </div>

      <div class="cr-err" id="cr-error" x-show="errMsg">
        <span id="cr-error-text" x-text="errMsg"></span>
        <button type="button" class="btn btn-ghost" id="cr-retry" x-show="retry && retry.msg === errMsg" :disabled="busy" @click="runRetry()" x-text="retry ? retry.label : ''"></button>
      </div>
      <div class="cr-note" x-show="listDenied && def === null && record">
        您沒有這個模組的列表權限；以簽核人身分開啟這張單據。
      </div>

      <!-- 列表 -->
      <template x-if="def">
        <div>
          <div class="cr-bar">
            <button class="chip" :class="{ active: statusFilter === '' }" data-status-filter="" @click="setFilter('')">全部</button>
            <template x-for="st in def.workflow.states" :key="st.key">
              <button class="chip" :class="{ active: statusFilter === st.key }" :data-status-filter="st.key"
                      @click="setFilter(st.key)" x-text="st.label"></button>
            </template>
            <span class="grow"></span>
            <button class="btn btn-primary" id="cr-new" @click="startNew()">＋ 新增</button>
          </div>
          <div class="cr-card">
            <table class="cr-table" id="cr-list">
              <thead><tr><template x-for="c in columns" :key="c.key"><th x-text="c.label"></th></template></tr></thead>
              <tbody>
                <template x-for="r in records" :key="r.record_no">
                  <tr :data-record-no="r.record_no" :data-display-no="r.displayNo || r.record_no" @click="openRecord(r.record_no)">
                    <template x-for="c in columns" :key="c.key">
                      <td :data-label="c.label">
                        <span :class="c.key === '$status' ? 'cr-status' : ''" x-text="cell(r, c.key)"></span>
                      </td>
                    </template>
                  </tr>
                </template>
              </tbody>
            </table>
            <div class="cr-empty" x-show="!listLoading && !records.length">沒有單據</div>
            <div class="cr-empty" x-show="listLoading">載入中…</div>
          </div>
        </div>
      </template>

      <!-- 新增／編輯 -->
      <template x-if="mode === 'new' || mode === 'edit'">
        <section class="cr-panel" id="cr-form">
          <h2 x-text="mode === 'new' ? '新增' + (formDef.name || '') : '編輯 ' + (record ? record.record_no : '')"></h2>
          <template x-for="(sec, si) in sections(formDef)" :key="si">
            <div class="cr-sec">
              <div class="cr-sec__t" x-show="sec.title" x-text="sec.title"></div>
              <div class="cr-grid" :class="{ 'cr-grid--n': sec.columns }" :style="gridStyle(sec)">
                <template x-for="f in sec.fields" :key="f.key">
                  <div class="cr-f" :class="{ 'is-bad': fieldErr[f.key], 'cr-f--wide': f.type === 'table' || f.type === 'textarea' }" :data-field="f.key">
                    <label :for="'cr-in-' + f.key"><span x-text="f.label || f.key"></span><span class="req" x-show="f.required">*</span></label>
                    <template x-if="f.type === 'text'">
                      <input type="text" :id="'cr-in-' + f.key" x-model="values[f.key]">
                    </template>
                    <template x-if="f.type === 'textarea'">
                      <textarea :id="'cr-in-' + f.key" x-model="values[f.key]" :maxlength="f.maxLength || null" :placeholder="f.placeholder || ''"></textarea>
                    </template>
                    <template x-if="f.type === 'number'">
                      <input type="number" step="any" :id="'cr-in-' + f.key" x-model="values[f.key]" :min="f.min" :max="f.max">
                    </template>
                    <template x-if="f.type === 'date'">
                      <input :type="f.withTime ? 'datetime-local' : 'date'" :id="'cr-in-' + f.key" x-model="values[f.key]">
                    </template>
                    <template x-if="f.type === 'daterange'">
                      <div class="cr-range" :data-range="f.key">
                        <input :type="f.withTime ? 'datetime-local' : 'date'" :id="'cr-in-' + f.key" x-model="values[f.key].from" aria-label="起">
                        <span>～</span>
                        <input :type="f.withTime ? 'datetime-local' : 'date'" x-model="values[f.key].to" aria-label="迄">
                      </div>
                    </template>
                    <template x-if="f.type === 'select' && !f.allowOther">
                      <select :id="'cr-in-' + f.key" x-model="values[f.key]">
                        <option value="">（未選）</option>
                        <template x-for="o in (f.options || [])" :key="o"><option :value="o" x-text="o"></option></template>
                      </select>
                    </template>
                    <template x-if="f.type === 'select' && f.allowOther">
                      <div>
                        <input type="text" :id="'cr-in-' + f.key" x-model="values[f.key]" :list="'cr-dl-' + f.key" placeholder="選一個或自己輸入">
                        <datalist :id="'cr-dl-' + f.key"><template x-for="o in (f.options || [])" :key="o"><option :value="o"></option></template></datalist>
                      </div>
                    </template>
                    <template x-if="f.type === 'radio'">
                      <div class="cr-opts" role="radiogroup" :data-radio="f.key">
                        <template x-for="o in (f.options || [])" :key="o">
                          <label><input type="radio" :name="'cr-rd-' + f.key" :value="o" x-model="values[f.key]"><span x-text="o"></span></label>
                        </template>
                        <template x-if="f.allowOther">
                          <label><input type="radio" :name="'cr-rd-' + f.key" :checked="isOther(f)" @change="values[f.key] = ''"><span>其他</span>
                            <input type="text" class="cr-other" :value="isOther(f) ? values[f.key] : ''" @input="values[f.key] = $event.target.value" aria-label="其他內容"></label>
                        </template>
                      </div>
                    </template>
                    <template x-if="f.type === 'checkboxes' || f.type === 'multiselect'">
                      <div class="cr-opts" :data-multi="f.key">
                        <template x-for="o in (f.options || [])" :key="o">
                          <label><input type="checkbox" :checked="(values[f.key] || []).indexOf(o) >= 0" @change="toggleMulti(f, o, $event.target.checked)"><span x-text="o"></span></label>
                        </template>
                      </div>
                    </template>
                    <template x-if="f.type === 'table'">
                      <div class="cr-tbl" :data-table="f.key">
                        <table>
                          <thead><tr>
                            <template x-for="c in (f.columns || [])" :key="c.key"><th x-text="c.label || c.key"></th></template>
                            <th class="cr-tbl__x"></th>
                          </tr></thead>
                          <tbody>
                            <template x-for="(row, ri) in (values[f.key] || [])" :key="row._k">
                              <tr :data-row="ri">
                                <template x-for="c in (f.columns || [])" :key="c.key">
                                  <td :data-col="c.key">
                                    <template x-if="c.type === 'formula'"><div class="cr-ro" x-text="fmt(cellCalc(f, ri, c))"></div></template>
                                    <template x-if="c.type === 'text'"><input type="text" x-model="row[c.key]"></template>
                                    <template x-if="c.type === 'number'"><input type="number" step="any" class="num" x-model="row[c.key]" :min="c.min" :max="c.max"></template>
                                    <template x-if="c.type === 'date'"><input type="date" x-model="row[c.key]"></template>
                                    <template x-if="c.type === 'checkbox'"><input type="checkbox" x-model="row[c.key]"></template>
                                    <template x-if="c.type === 'select' && !c.allowOther">
                                      <select x-model="row[c.key]"><option value="">（未選）</option><template x-for="o in (c.options || [])" :key="o"><option :value="o" x-text="o"></option></template></select>
                                    </template>
                                    <template x-if="c.type === 'select' && c.allowOther">
                                      <div><input type="text" x-model="row[c.key]" :list="'cr-dl-' + f.key + '-' + c.key">
                                        <datalist :id="'cr-dl-' + f.key + '-' + c.key"><template x-for="o in (c.options || [])" :key="o"><option :value="o"></option></template></datalist></div>
                                    </template>
                                  </td>
                                </template>
                                <td class="cr-tbl__x"><button type="button" class="btn btn-ghost btn-sm" :data-remove-row="ri" aria-label="刪除這一列" @click="removeRow(f, ri)">✕</button></td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                        <button type="button" class="btn btn-ghost btn-sm cr-tbl__add" :data-add-row="f.key" @click="addRow(f)" x-text="'＋ ' + (f.addLabel || '新增一列')"></button>
                      </div>
                    </template>
                    <template x-if="f.type === 'checkbox'">
                      <!-- 布林：寫死 value＋x-model.boolean（空字串＝沒填） -->
                      <select :id="'cr-in-' + f.key" x-model.boolean="values[f.key]">
                        <option value="">（未選）</option>
                        <option value="true">是</option>
                        <option value="false">否</option>
                      </select>
                    </template>
                    <template x-if="f.type === 'file' || f.type === 'image'">
                      <!-- 附件：先傳到暫存（伺服器回檔案代號），存單時才綁到單據；值＝檔案物件陣列，送出只送代號 -->
                      <div class="cr-files" :data-file-field="f.key">
                        <input type="file" multiple :id="'cr-in-' + f.key" :accept="fileAccept(f)" :disabled="busy || uploading[f.key]"
                               @change="uploadFiles(f, $event)">
                        <div class="cr-help" x-show="uploading[f.key]">上傳中…</div>
                        <ul class="cr-flist">
                          <template x-for="(m, mi) in (values[f.key] || [])" :key="m.id">
                            <li :data-file-id="m.id"><span x-text="m.filename"></span> <small x-text="fileSize(m.size)"></small>
                              <a href="javascript:void(0)" :data-file-remove="m.id" @click="removeFile(f, mi)">移除</a></li>
                          </template>
                        </ul>
                      </div>
                    </template>
                    <template x-if="f.type === 'ref' && f.multiple">
                      <!-- 複選參照（人員／部門）：可搜尋的核取清單；值＝代號陣列 -->
                      <div class="cr-ref" :data-ref-multi="f.key" :data-ref-state="refState[f.key] || 'loading'">
                        <input type="search" class="cr-ref-q" :id="'cr-ref-q-' + f.key" :value="refQuery[f.key] || ''" placeholder="搜尋…" @input="searchRef(f.key, $event.target.value)">
                        <div class="cr-ref-list">
                          <template x-for="o in refMultiChoices(f.key)" :key="String(o.value)">
                            <label class="cr-opt"><input type="checkbox" :data-ref-opt="String(o.value)" :checked="refPicked(f, o.value)" @change="toggleRef(f, o.value, $event.target.checked)"> <span x-text="o.label"></span></label>
                          </template>
                        </div>
                        <div class="cr-ferr" x-show="refState[f.key] === 'denied' || refState[f.key] === 'error'" x-text="refState[f.key] === 'denied' ? '您沒有讀取這個清單的權限' : '讀取選項失敗'"></div>
                      </div>
                    </template>
                    <template x-if="f.type === 'ref' && !f.multiple">
                      <!-- 參照欄：選項來自 GET …/ref-options/{欄位}（可搜尋）；403 才退回手動輸入並說明原因 -->
                      <div class="cr-ref" :data-ref-field="f.key" :data-ref-state="refState[f.key] || 'loading'">
                        <template x-if="refState[f.key] === 'denied'">
                          <div>
                            <input type="text" :id="'cr-in-' + f.key" x-model="values[f.key]" :placeholder="refHint(f.target)">
                            <div class="cr-ref-why" :data-ref-why="f.key">您沒有讀取這個參照清單的權限，請直接輸入代號；儲存時由系統檢查是否存在。</div>
                          </div>
                        </template>
                        <template x-if="refState[f.key] !== 'denied'">
                          <div>
                            <input type="search" class="cr-ref-q" :id="'cr-ref-q-' + f.key" :value="refQuery[f.key] || ''"
                                   placeholder="搜尋…" @input="searchRef(f.key, $event.target.value)">
                            <select :id="'cr-in-' + f.key" x-model="values[f.key]">
                              <option value="">（未選）</option>
                              <template x-for="o in refChoices(f.key)" :key="String(o.value)">
                                <option :value="String(o.value)" x-text="o.label" :selected="String(o.value) === String(values[f.key])"></option>
                              </template>
                            </select>
                            <div class="cr-ferr" x-show="refState[f.key] === 'error'">
                              <span x-text="'讀取選項失敗（' + (refErr[f.key] || '') + '）'"></span>
                              <a href="javascript:void(0)" @click="fetchRefOptions(f.key, refQuery[f.key] || '')">重試</a>
                            </div>
                          </div>
                        </template>
                      </div>
                    </template>
                    <template x-if="preview && KNOWN_TYPES.indexOf(f.type) < 0">
                      <!-- 預覽模式：建構器新增了本頁還不會畫的型別 ⇒ 佔位（不丟例外）；正式執行不走這一支 -->
                      <div class="cr-ph" data-preview-placeholder>此型別尚無預覽</div>
                    </template>
                    <template x-if="f.type === 'formula'">
                      <div class="cr-ro" :id="'cr-in-' + f.key" data-formula
                           x-text="formulaShown(f)"></div>
                    </template>
                    <div class="cr-fx" :data-fx-readable="f.key" x-show="f.type === 'formula' && fxReadable(f)" x-text="fxReadable(f)"></div>
                    <div class="cr-help" :data-field-help="f.key" x-show="f.help" x-text="f.help"></div>
                    <div class="cr-ferr" :data-field-error="f.key" x-show="fieldErr[f.key]" x-text="fieldErr[f.key]"></div>
                  </div>
                </template>
              </div>
            </div>
          </template>
          <div class="cr-actions">
            <button class="btn btn-primary" id="cr-save" :disabled="busy" @click="save()">儲存</button>
            <button class="btn btn-ghost" @click="cancelForm()" :disabled="busy">取消</button>
            <span class="cr-sub" x-show="dropped.length" x-text="'未定義的欄位已略過：' + dropped.join('、')"></span>
          </div>
        </section>
      </template>

      <!-- 單據 -->
      <template x-if="mode === 'view' && record">
        <section class="cr-panel" id="cr-record" :data-record-no="record.record_no" :data-status="record.status" :data-busy="busy ? '1' : '0'">
          <h2>
            <span id="cr-record-no" :data-base-no="record.record_no" x-text="record.displayNo || record.record_no"></span>
            <span class="cr-status" id="cr-record-status" x-text="record.view.statusLabel"></span>
          </h2>
          <div class="cr-sub">
            <span x-text="record.view.moduleName"></span> · 定義第 <span id="cr-record-version" x-text="record.def_version"></span> 版
            · <span x-text="record.created_by"></span> 建立於 <span x-text="(record.created_at || '').replace('T', ' ').slice(0, 16)"></span>
          </div>
          <div class="cr-note" x-show="recDef === null">
            這張單據用的是較早的定義版本；內容以下方「依建立時版本的輸出」為準。
          </div>

          <template x-if="recDef">
            <div>
              <template x-for="(sec, si) in sections(recDef)" :key="si">
                <div class="cr-sec">
                  <div class="cr-sec__t" x-show="sec.title" x-text="sec.title"></div>
                  <div class="cr-kv">
                    <template x-for="f in sec.fields" :key="f.key">
                      <div :data-view-field="f.key" :class="{ 'cr-f--wide': f.type === 'table' }">
                        <span x-text="f.label || f.key"></span>
                        <template x-if="f.type === 'file' || f.type === 'image'">
                          <div class="cr-files" :data-view-files="f.key">
                            <template x-for="m in ((record.fileMeta || {})[f.key] || [])" :key="m.id">
                              <div><a href="javascript:void(0)" :data-file-link="m.id" @click="openFile(m)" x-text="m.filename"></a> <small x-text="fileSize(m.size)"></small></div>
                            </template>
                            <b x-show="!((record.fileMeta || {})[f.key] || []).length">—</b>
                          </div>
                        </template>
                        <template x-if="f.type !== 'table' && f.type !== 'file' && f.type !== 'image'"><b x-text="fmt(f.type === 'ref' && record.refLabels && record.refLabels[f.key] !== undefined ? record.refLabels[f.key] : record.data[f.key]) || '—'"></b></template>
                        <template x-if="f.type === 'table'">
                          <div class="cr-tbl"><table>
                            <thead><tr><template x-for="c in (f.columns || [])" :key="c.key"><th x-text="c.label || c.key"></th></template></tr></thead>
                            <tbody><template x-for="(row, ri) in (record.data[f.key] || [])" :key="ri">
                              <tr><template x-for="c in (f.columns || [])" :key="c.key"><td :class="c.type === 'number' || c.type === 'formula' ? 'num' : ''" x-text="fmt(row[c.key])"></td></template></tr>
                            </template></tbody>
                          </table><b x-show="!(record.data[f.key] || []).length">—</b></div>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <div class="cr-sec" x-show="tiers().length">
            <div class="cr-sec__t">簽核</div>
            <div class="cr-tiers">
              <template x-for="(t, ti) in tiers()" :key="ti">
                <div class="cr-tier">
                  <span class="n" x-text="'第 ' + (ti + 1) + ' 層'"></span>
                  <template x-for="a in (t.approvers || [])" :key="a.username">
                    <span :class="a.status === 'approved' ? 'ok' : (ti === record.approval.currentTier && inApproval() ? 'cur' : '')"
                          x-text="(a.displayName || a.username) + (a.status === 'approved' ? '（已核准）' : (ti === record.approval.currentTier && inApproval() ? '（待簽）' : ''))"></span>
                  </template>
                </div>
              </template>
            </div>
          </div>

          <div class="cr-note" id="cr-draft-locked" x-show="draftLocked()">
            這張草稿只有建立者（<span x-text="record.created_by"></span>）或超級管理員可以修改、送出；你可以檢視與輸出。
          </div>
          <div class="cr-actions">
            <template x-if="canEdit()">
              <button class="btn btn-ghost" id="cr-edit" @click="startEdit()" :disabled="busy">編輯</button>
            </template>
            <template x-for="t in availableTransitions()" :key="t.key">
              <button class="btn btn-primary" :data-transition="t.key" @click="doTransition(t)" :disabled="busy" x-text="t.label"></button>
            </template>
            <button class="btn btn-ghost" id="cr-out-html" @click="openOutput()" :disabled="busy">輸出 HTML</button>
            <button class="btn btn-ghost" id="cr-out-pdf" @click="downloadPdf()" :disabled="busy">下載 PDF</button>
          </div>

          <template x-if="canDecide()">
            <div class="cr-sec" id="cr-decide">
              <div class="cr-sec__t">簽核（第 <span x-text="record.approval.currentTier + 1"></span> 層）</div>
              <textarea class="cr-note-in" id="cr-decide-note" rows="2" x-model="note" placeholder="備註（退回時請說明原因）"></textarea>
              <div class="cr-actions">
                <button class="btn btn-approve" id="cr-approve" @click="decide(true)" :disabled="busy">核准</button>
                <button class="btn btn-reject" id="cr-reject" data-testid="preview-return" @click="decide(false)" :disabled="busy">退回</button>
              </div>
            </div>
          </template>

          <div class="cr-sec">
            <div class="cr-sec__t">依建立時版本的輸出</div>
            <iframe class="cr-frame" id="cr-output-frame" sandbox="" :srcdoc="outputHtml" title="單據輸出"></iframe>
          </div>

          <div class="cr-sec" id="cr-revisions" x-show="revs && revs.revisions && revs.revisions.length">
            <div class="cr-sec__t">送簽修訂紀錄（目前 <span x-text="revs ? revs.current.displayNo : ''"></span>）</div>
            <table class="cr-table" style="margin-top:6px">
              <thead><tr><th>修訂</th><th>送簽</th><th>結果</th><th>定義</th><th></th></tr></thead>
              <tbody>
                <template x-for="rv in ((revs && revs.revisions) || [])" :key="rv.revision">
                  <tr :data-revision="rv.revision" style="cursor:default">
                    <td x-text="rv.displayNo"></td>
                    <td x-text="(rv.submittedAt || '').replace('T', ' ').slice(0, 16) + '　' + rv.submittedBy"></td>
                    <td x-text="rv.decision === 'rejected' ? ('退回' + (rv.note ? '：' + rv.note : '')) : (rv.decision === 'approved' ? '核可' : '簽核中')"></td>
                    <td x-text="'第 ' + rv.defVersion + ' 版'"></td>
                    <td>
                      <a href="javascript:void(0)" :data-diff-current="rv.revision" @click="showDiff(rv.revision, 'current')">與目前比對</a>
                      <a href="javascript:void(0)" x-show="rv.revision > 0" :data-diff-prev="rv.revision" style="margin-left:8px" @click="showDiff(rv.revision - 1, rv.revision)">與上一版比對</a>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
            <div id="cr-rev-diff" x-show="revDiff" style="margin-top:8px">
              <div class="cr-sub" x-text="revDiff ? (revDiff.a + ' → ' + revDiff.b + '（' + revDiff.changes.length + ' 處不同）') : ''"></div>
              <table class="cr-table" x-show="revDiff && revDiff.changes.length">
                <thead><tr><th>欄位</th><th>原本</th><th>改成</th></tr></thead>
                <tbody>
                  <template x-for="c in (revDiff ? revDiff.changes : [])" :key="c.key">
                    <tr :data-diff-field="c.key" style="cursor:default">
                      <td x-text="c.label"></td>
                      <td x-text="c.rows ? rowsText(c.rows, 'old') : fmt(c.old)"></td>
                      <td x-text="c.rows ? rowsText(c.rows, 'new') : fmt(c.new)"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>

          <div class="cr-sec" x-show="(record.log || []).length">
            <div class="cr-sec__t">紀錄</div>
            <div class="cr-log">
              <template x-for="(l, li) in record.log" :key="li">
                <div x-text="(l.at || '').replace('T', ' ').slice(0, 16) + '　' + l.by_user + '　' + actionLabel(l) + (l.note ? '（' + l.note + '）' : '')"></div>
              </template>
            </div>
          </div>
        </section>
      </template>
    </div>
  </main>

  <script src="../static/file-preview.js"></script>
  <script src="../static/notif.js"></script>
  <script src="../static/ui.js"></script>
  <script src="../static/custom-layout.js"></script>
  <script src="../static/sidebar.js"></script>
  <script>
    function customRecordsPage() {
      var L = window.MotrixCustomLayout
      return {
        key: '', loading: true, errMsg: '', def: null, metaVersion: 0, listDenied: false,
        records: [], listLoading: false, statusFilter: '',
        mode: 'list', record: null, recDef: null, formDef: {}, values: {}, fieldErr: {}, dropped: [],
        refOptions: {}, refState: {}, refQuery: {}, refErr: {}, _refSeq: {}, _refTimers: {}, note: '', busy: false, outputHtml: '', me: {}, _initDone: false, _defCache: {},
        //: 預覽模式（BUILDER-UX §3.3）：同一個旗標擋住本頁所有 API 呼叫（讀與寫）
        preview: !!window.MOTRIX_PREVIEW, previewHl: null,
        KNOWN_TYPES: ['text', 'textarea', 'number', 'date', 'daterange', 'select', 'radio', 'checkboxes', 'multiselect', 'checkbox', 'ref', 'formula', 'table', 'file', 'image'],
        computed: {}, computedTables: {}, _cmpTimer: null, _cmpSeq: 0, _rowSeq: 0,
        //: 嵌入模式的上下文（方案 B）：外層頁面帶 `ctx.<鍵>=<值>`；欄位對應取自本模組定義的 mount.contextField；沒有 ⇒ 空（不篩選、不預填）
        embed: !!window.MOTRIX_EMBED, embedCtx: { field: '', value: '' },
        retry: null,     // 網路失敗時錯誤列上的按鈕：{label, run, msg}（msg≠目前的 errMsg ⇒ 不顯示）

        _hdr() {
          var s = {}
          try { s = JSON.parse(localStorage.getItem('motrix_session') || '{}') } catch (e) {}
          return { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (s.token || '') }
        },
        _noApiInPreview() { if (this.preview) throw new Error('預覽模式不打 API') },
        // 網路層失敗（斷線、連線被拒、讀本文中斷）不丟例外，回 {ok:false, status:'network'}——每個呼叫點原本的錯誤分支
        // 就會顯示訊息（稽核 D O15-O1：列表、儲存、轉換、核准原本例外沒人接，畫面只看到按鈕恢復；參照欄選項 O15 同一個判準）
        async _send(url, opts) {
          try { return await this._json(await fetch(url, opts)) } catch (e) { return { ok: false, status: 'network', data: null } }
        },
        async api(method, url) { this._noApiInPreview(); return this._send(url, { method: method, headers: this._hdr() }) },
        NET_MSG: '網路連線失敗，請確認連線後按「重試」',
        // 失敗訊息＋（網路失敗時）錯誤列上的重試。`retry`＝重做的動作；不給＝不提供重試
        fail(prefix, r, retry, netMsg) {
          if (r.status !== 'network') { this.errMsg = prefix + '：' + this.detail(r); this.retry = null; return }   // 非網路失敗：行為不變
          this.errMsg = prefix + '：' + (netMsg || this.NET_MSG)
          // 綁住這一則訊息：別處改寫 errMsg（例 404）時按鈕自動不顯示，不會留著一個重做別件事的「重試」
          this.retry = retry ? { label: retry.label, run: retry.run, msg: this.errMsg } : null
          window.MotrixUI && window.MotrixUI.toast(this.errMsg, { kind: 'error' })
        },
        async runRetry() {
          var r = this.retry
          if (!r || r.msg !== this.errMsg || this.busy) return
          this.retry = null
          this.errMsg = ''
          await r.run()
        },
        async _json(r) {
          var text = await r.text()
          var data = null
          try { data = text ? JSON.parse(text) : null } catch (e) { data = text }
          return { ok: r.ok, status: r.status, data: data }
        },
        // 寫入一律走這兩支（method 寫死，送出點一眼看得到）
        async post(url, body) { this._noApiInPreview(); return this._send(url, { method: 'POST', headers: this._hdr(), body: JSON.stringify(body || {}) }) },
        async put(url, body) { this._noApiInPreview(); return this._send(url, { method: 'PUT', headers: this._hdr(), body: JSON.stringify(body || {}) }) },
        base() { return '/api/custom/' + encodeURIComponent(this.key) },

        async init() {
          if (this._initDone) return
          this._initDone = true
          this.$watch('values', () => this.queueCompute())
          if (this.preview) return this._initPreview()
          try { this.me = JSON.parse(localStorage.getItem('motrix_session') || '{}') } catch (e) { this.me = {} }
          var q = new URLSearchParams(location.search)
          this.key = q.get('key') || ''
          if (!this.key) { this.loading = false; this.errMsg = '網址缺少模組代號（?key=）'; return }
          var m = await this.api('GET', this.base() + '/meta')
          this.loading = false
          if (m.ok) {
            this.def = m.data.definition
            this.metaVersion = m.data.version
            this._defCache[m.data.version] = m.data.definition
            if (this.embed) {                                  // 方案 B：上下文值＝第一個 ctx.* 參數；欄位＝mount.contextField
              var cf = ((this.def.mount || {}).contextField) || ''
              var cv = ''
              q.forEach(function (v, k) { if (cv === '' && k.indexOf('ctx.') === 0) cv = v })
              this.embedCtx = { field: cf, value: cf ? cv : '' }
            }
            document.title = (this.def.name || this.key) + ' — MOTRIX 專案管理系統'
            this.loadRefOptions(this.def)
            await this.loadList()
          } else if (m.status === 403) {
            this.listDenied = true
          } else {
            if (m.status === 404) this.errMsg = '這個自訂模組不存在或尚未發布'
            else this.fail('讀取失敗', m, { label: '重新載入', run: function () { location.reload() } })
          }
          var no = q.get('no')
          if (no) await this.openRecord(no)
          else if (this.listDenied) this.errMsg = '您沒有這個模組的權限'
        },
        // ── 預覽模式（BUILDER-UX §3.2／§3.3）：建構器 iframe 以 postMessage 傳草稿；只收同源、約定格式 ──
        _initPreview() {
          var self = this
          this.loading = false
          window.addEventListener('message', function (e) { self._onPreviewMessage(e) })
          if (window.ResizeObserver) new ResizeObserver(function () { self._postHeight() }).observe(document.documentElement)
          this._toParent({ kind: 'ready' })
        },
        _toParent(msg) {
          if (window.parent === window) return
          window.parent.postMessage(Object.assign({ type: 'motrix-preview', v: 1 }, msg), location.origin)
        },
        _postHeight() { this._toParent({ kind: 'height', px: document.documentElement.scrollHeight }) },
        _onPreviewMessage(e) {
          if (e.origin !== location.origin || e.source !== window.parent) return
          var d = e.data
          if (!d || typeof d !== 'object' || d.type !== 'motrix-preview' || d.v !== 1) return
          if (d.kind === 'draft') this._showDraft(d.draft, d.mode)
          else if (d.kind === 'highlight') this._applyHighlight(d.field == null ? null : String(d.field))
        },
        _showDraft(draft, mode) {
          var def = (draft && typeof draft === 'object') ? draft : {}
          var self = this
          // 參照欄：預覽不打 API ⇒ 選項留白（狀態設好，loadRefOptions 就不會去抓）
          var st = {}
          ;(def.fields || []).forEach(function (f) { if (f && f.type === 'ref') st[f.key] = 'preview' })
          this.refState = st; this.refOptions = {}
          this.errMsg = ''; this.record = null; this.recDef = null; this.fieldErr = {}; this.dropped = []
          if (mode === 'list') {
            this.formDef = {}; this.def = def; this.records = []; this.mode = 'list'
          } else {
            this.def = null; this.formDef = def; this.values = this.blankValues(def); this.mode = 'new'
          }
          this.$nextTick(function () { self._applyHighlight(self.previewHl); self._postHeight() })
        },
        _applyHighlight(key) {
          this.previewHl = key
          document.querySelectorAll('.cr-f.is-preview-hl').forEach(function (el) { el.classList.remove('is-preview-hl') })
          if (key === null || key === undefined) return
          var el = document.querySelector('.cr-f[data-field="' + (window.CSS && CSS.escape ? CSS.escape(key) : key) + '"]')
          if (!el) return
          el.classList.add('is-preview-hl')
          // 只捲本頁，不呼叫 focus／scrollIntoView（後者會連建構器畫布一起捲、搶走輸入中的焦點）
          var r = el.getBoundingClientRect()
          if (r.top < 0 || r.bottom > window.innerHeight) window.scrollTo(0, window.scrollY + r.top - 16)
        },

        detail(res) {
          var d = res.data
          if (d && typeof d === 'object') return d.detail || JSON.stringify(d)
          return String(d || res.status)
        },

        // ── 列表 ──
        get columns() { return this.def ? L.listColumns(this.def) : [] },
        stateLabels(def) {
          var out = {}
          ;((def && def.workflow && def.workflow.states) || []).forEach(function (s) { out[s.key] = s.label })
          return out
        },
        cell(r, k) { return L.cellValue(r, k, this.stateLabels(this.def)) },
        sections(def) { return L.formSections(def || {}) },
        gridStyle(sec) { return L.gridStyle(sec.columns) },
        // 使用者 2026-09-27：公式欄位顯示可讀式子（與建構器同一支 L.formulaReadable）；說明（help）顯示在欄位下方
        fxReadable(f) { return L.formulaReadable(this.formDef || {}, f) },
        async setFilter(st) { this.statusFilter = st; await this.loadList() },
        async loadList() {
          this.listLoading = true
          try {
            var qs = []
            if (this.statusFilter) qs.push('status=' + encodeURIComponent(this.statusFilter))
            if (this.embedCtx.field && this.embedCtx.value !== '') qs.push('field=' + encodeURIComponent(this.embedCtx.field) + '&value=' + encodeURIComponent(this.embedCtx.value))
            var url = this.base() + '/records' + (qs.length ? '?' + qs.join('&') : '')
            var r = await this.api('GET', url)
            if (r.ok) this.records = r.data || []
            else this.fail('讀取列表失敗', r, { label: '重試', run: () => this.loadList() })
          } finally { this.listLoading = false }
        },

        // ── 參照選項（缺口 #6）：GET …/ref-options/{欄位}?q=&limit= ⇒ [{value, label}]，依欄位（不是依對象）──
        //   403（沒有讀清單的權限）⇒ 退回手動輸入代號並說明原因，由伺服器在儲存時檢查存不存在；
        //   其他失敗 ⇒ 仍是下拉，標出錯誤可重試（不默默改成自由輸入）。
        //   搜尋：每個欄位一個序號，較晚送出的查詢才算數（慢回來的舊結果不蓋掉新結果）。
        loadRefOptions(def) {

            var r = await fetch(this.base() + '/records/' + encodeURIComponent(this.record.record_no) + '/output', { headers: this._hdr() })
            html = r.ok ? await r.text() : '<p>輸出失敗（' + r.status + '）</p>'
          } catch (e) {
            html = '<p>輸出失敗：網路連線失敗，請確認連線後再按一次「輸出」</p>'
          }
          if (w) { w.document.open(); w.document.write(html); w.document.close() }
        },
        async downloadPdf() {
          if (this.busy) return
          this.busy = true
          try {
            var no = this.record.record_no
            var r
            try { r = await fetch(this.base() + '/records/' + encodeURIComponent(no) + '/output?format=pdf', { headers: this._hdr() }) }
            catch (e) { window.MotrixUI && window.MotrixUI.toast('PDF 產生失敗：' + this.NET_MSG.replace('按「重試」', '再按一次'), { kind: 'error' }); return }
            if (!r.ok) { window.MotrixUI && window.MotrixUI.toast('PDF 產生失敗（' + r.status + '）', { kind: 'error' }); return }
            var blob = await r.blob()
            var a = document.createElement('a')
            a.href = URL.createObjectURL(blob)
            a.download = no + '.pdf'
            document.body.appendChild(a); a.click(); a.remove()
            setTimeout(function () { URL.revokeObjectURL(a.href) }, 30000)
          } finally { this.busy = false }
        },
        actionLabel(l) {
          var labels = this.stateLabels(this.wfDef())
          var names = { create: '建立', update: '修改', approve: '核准', approve_tier: '核准（本層）', reject: '退回', auto_approve: '條件不成立，自動通過' }
          var t = ((this.wfDef().workflow || {}).transitions || []).find(function (x) { return x.key === l.action })
          var what = names[l.action] || (t ? t.label : l.action)
          return what + (l.to_state && l.to_state !== l.from_state ? ' → ' + (labels[l.to_state] || l.to_state) : '')
        },
        fmt(v) { return L.formatValue(v) },
      }
    }
  </script>
  <script>
    /* 嵌入模式：回報頁面高度給外層（同源，targetOrigin＝本頁 origin；外層收到時再驗 origin 與 source）。 */
    (function () {
      if (!window.MOTRIX_EMBED) return
      var last = 0
      function send() {
        var h = Math.ceil(document.body.getBoundingClientRect().height)      // body 自己的高度（不是 scrollHeight：後者會跟著 iframe 視窗高度走、造成回報互相放大／縮小）
        if (!h || h === last) return
        last = h
        try { parent.postMessage({ type: 'motrix-embed-height', height: h }, location.origin) } catch (e) {}
      }
      window.addEventListener('load', send)
      if (window.ResizeObserver) new ResizeObserver(send).observe(document.body)
      setInterval(send, 1000)
    })()
  </script>
</body>
</html>
