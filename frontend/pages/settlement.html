          this.applyXeTotal()                                    // 端點可用時覆蓋 xeTotal／手續費／自訂模組支出（放在舊路徑的賦值之後）
          this.xePending = d.totalPending || 0
          this.xeMasked = d.maskedCount || 0
        }
      } catch {}
    },

    // 自訂模組（建構器）關聯到這個案件的金流（無權限 ⇒ 403 ⇒ 不加，與額外支出同一規則）
    async loadCustomFinance() {
      if (!(this._actualsOk && this.actuals.costExtras)) this.customExpenseTotal = 0
      this.customIncomeSkipped = []
      try {
        const r = await fetch(`/api/custom-modules/finance/case/${encodeURIComponent(this.quoteNo)}`, {
          headers: { Authorization: 'Bearer ' + this.session.token }
        })
        if (r.ok) {
          const d = await r.json()
          if (!(this._actualsOk && this.actuals.costExtras)) this.customExpenseTotal = (d.expense && d.expense.total) || 0      // 34：金額以端點為準，這裡只取未計入的收入清單
          this.customIncomeSkipped = ((d.income && d.income.items) || []).filter(i => i.skipped)
        }
      } catch {}
    },

    // 承攬商匯款單的手續費合計（無權限看財務金額 ⇒ 403 ⇒ 不加，與額外支出同一規則）
    async loadVoucherRemitFees() {
      if (this._actualsOk && this.actuals.costExtras) return          // 34：承攬商匯款手續費已在端點的 remitFeeTotal 內
      try {
        const r = await fetch(`${API}/contractor-vouchers/remit-fee-total?quote_no=${encodeURIComponent(this.quoteNo)}`, {
          headers: { Authorization: 'Bearer ' + this.session.token }
        })
        if (r.ok) this.remitFeeTotal += ((await r.json()).feeTotal || 0)
      } catch {}
    },

    async loadDispatches() {
      try {
        const r = await fetch(`${API}/contractor-dispatches?quote_no=${encodeURIComponent(this.quoteNo)}`, {
          headers: { Authorization: 'Bearer ' + this.session.token }
        })
        if (r.ok) this.dispatches = (await r.json()).filter(d => d.status !== 'cancelled' && !['草稿', '已退回'].includes(d.approvalStatus || ''))   // 31-A：與營運報表同一條規則（待審核計入）
      } catch {}
    },

    // 35c 稅基 B（使用者 2026-10-03）：承攬商成本計入的是「未稅承攬費＋外包人員」（營運報表權責口徑／總帳同一口徑；稅額是進項稅額，不是成本）。
    // 例外：完結於舊口徑（存檔 summary 沒有 dispatchBasis）的精算維持含稅口徑顯示，與完結當下存的數字逐位相同，不改寫。
    dispatchBasisOld() { return !this._finalizing && this.settlement.status === 'finalized' && !(this._frozenSummary && this._frozenSummary.dispatchBasis) },
    dispatchPretax() {
      if (this._actualsOk && this.actuals.costExtras) return this.actuals.costExtras.dispatch.report || 0
      return this.dispatches.reduce((s, d) => s + (+d.totalAmount || 0) + (+d.personnelTotal || 0), 0)
    },
    dispatchGross() {
      if (this._actualsOk && this.actuals.costExtras) return this.actuals.costExtras.dispatch.grandTotal || 0
      return this.dispatches.reduce((s, d) => s + (+d.grandTotal || 0), 0)
    },
    dispatchTaxTotal() { return Math.max(0, this.dispatchGross() - this.dispatchPretax()) },
    dispatchPersonnelTotal() { return this.dispatches.reduce((s, d) => s + (+d.personnelTotal || 0), 0) },
    dispatchTotal() {
      return this.dispatchBasisOld() ? this.dispatchGross() : this.dispatchPretax()       // 34：現算值（完結後的過期提醒要比的就是它；不是凍結值）
    },
    dispatchSplitText() {
      if (!this.dispatches.length) return ''
      if (this.dispatchBasisOld()) return '舊口徑（含稅）：承攬商含稅合計＋外包人員 ＝ NT$ ' + this.fmt(this.dispatchGross())
      const pre = this.dispatchPretax(), per = this.dispatchPersonnelTotal()
      return '未稅承攬費 NT$ ' + this.fmt(pre - per) + ' ＋ 外包人員 NT$ ' + this.fmt(per) + ' ＝ 計入成本 NT$ ' + this.fmt(pre)
        + '；承攬商稅額 NT$ ' + this.fmt(this.dispatchTaxTotal()) + '（進項稅額，不計成本）；含稅合計 NT$ ' + this.fmt(this.dispatchGross())
    },
    // 草稿第一次以新口徑打開：一行說明（可「知道了」關掉；記在這個瀏覽器，不用彈窗）
    dispatchDraftNote() {
      if (this.settlement.status === 'finalized' || this.dispatchTaxTotal() <= 0 || this._dispatchNoteSeen) return false
      return true
    },
    dismissDispatchNote() {
      this._dispatchNoteSeen = true
      try { localStorage.setItem('stl_dispatch_basis_note_' + this.quoteNo, '1') } catch (e) { /* 存不了就只在這次開啟內隱藏 */ }
    },
    _dispatchNoteSeen: false,

    // 精算已完結時，比對完結當下凍結的 dispatchTotal 快照 vs 目前即時計算值；
    // 承攬商派發在完結後又被異動（新增/取消/改金額）就會不一致，回傳差異供橫幅顯示，
    // 一致或非完結狀態回傳 null（見 §5.5「精算完結即凍結」設計，此為過期提醒非錯誤）
    dispatchStale() {
      if (this.settlement.status !== 'finalized' || !this._frozenSummary) return null
      const frozen = MotrixLegalRound.halfUp(this._frozenSummary.dispatchTotal || 0)
      // 35c：完結 summary 帶 dispatchBasis='pretax' ⇒ 與未稅現算值比；沒有（舊完結案、含稅口徑）⇒ 與含稅現算值比（舊案不會因口徑切換而誤報）
      const live   = MotrixLegalRound.halfUp((this._frozenSummary.dispatchBasis === 'pretax' ? this.dispatchPretax() : this.dispatchGross()) || 0)
      if (frozen === live) return null
      return { frozen, live, diff: live - frozen }
    },

    // 展開單筆派發的明細列：有承攬商就先列承攬商、外包人員接續縮排；
    // 純點工（無承攬商）時外包人員第一筆頂替承攬商列顯示派發狀態
    _dispatchRows(d) {
      const personnel = (d.personnel || []).map(p => ({ label: '外包人員：' + p.name, amount: p.amount, isVendor: false }))
      if (d.vendorId) {
        return [
          { label: d.vendorName || '（未命名承攬商）', amount: this.dispatchBasisOld() ? d.totalWithTax : d.totalAmount, tax: Math.max(0, (+d.totalWithTax || 0) - (+d.totalAmount || 0)), isVendor: true },
          ...personnel.map(r => ({ ...r, label: '　' + r.label }))
        ]
      }
      return personnel.map((r, i) => ({ ...r, isVendor: i === 0 }))
    },

    calcItemCost(item) {
      if (item.adoptSystem && this.systemActual(item) > 0) { item.actualTotalCost = this.systemActual(item); item._fromSystem = true; return }
      item._fromSystem = false      // 32-S5：照採購單連結金額（含稅最終金額，不再 ×1.05 或 ÷1.05）
      // X-VAT（2026-09-26）：金額一律 static/legal-round.js 四捨五入（與後端同一套）
      const raw = MotrixLegalRound.halfUp(item.actualQty || 0, item.actualUnitCost || 0)
      if (item.actualCostTaxMode === 'taxed') {
        // 含稅5%：供應商發票金額已含稅，扣掉稅額換算回未稅，與報價稅前收入同一基準才能正確比毛利
        item.actualTotalCost = MotrixLegalRound.halfUp(raw / 1.05)
      } else if (item.actualCostTaxMode === 'taxed_gross') {
        // 含稅5%（自動加總）：填的是未稅底價，稅金無法扣抵、屬實際支出，加總5%計入真實成本
        item.actualTotalCost = MotrixLegalRound.halfUp(raw, 1.05)
      } else {
        item.actualTotalCost = raw
      }
    },

    estimateOf(item) { return MotrixLegalRound.halfUp((item.origQty || 0) * (item.origCost || 0), 1.05) },

    calcExtraCost(ex) {
      ex.totalCost = MotrixLegalRound.halfUp(ex.qty || 0, ex.unitCost || 0)
    },

    calcSummary() {
      const tot = this._origTot || {}
      const quotedPretax = tot.pretax   || 0
      const quotedTotal  = tot.total    || 0
      const origItemTotal = this.settlement.items.reduce((s, i) => s + (i.origAmount || 0), 0)
      const origTotalCost = this.settlement.items.reduce((s, i) => s + (i.origQty || 0) * (i.origCost || 0), 0)
      // 直接沿用報價單建立當下已算好的預估毛利（quotation-form.html tot 物件），不在這裡
      // 重算——重算會漏掉 5% 非扣抵進項稅與 5 個間接成本項目（indirectLogistics 等），
      // 讓下方「與實際比較」的差異(pp)/差異金額反映的是公式落差而非真實成本表現
      const origDirectProfit = tot.directProfit != null ? tot.directProfit : (quotedPretax - origTotalCost)
      const origMarginPct = tot.directMarginPct != null ? tot.directMarginPct
        : (quotedPretax > 0 ? origDirectProfit / quotedPretax * 100 : 0)

      // 手填實際成本 0／空＝沒填 ⇒ 用估計（與重新載入存檔 `si.actualTotalCost || oi.actualTotalCost`、後端 manual_actual 同一規則；
      // 否則同一次編輯中頁面把 0 加進去，完結時與後端重算差一筆估計而被 409）
      const itemActualTotal = this.settlement.items.reduce((s, i) => s + (i.actualTotalCost || this.estimateOf(i)), 0)
      // 2026-09-11：額外支出搬到 case_extra_expenses 表（DB v75），改用從 API 取回的
      // 總額。**不能再用 settlement.extraItems 算**——那份陣列現在只是搬移前的唯讀
      // 備份、不會再更新，拿它算成本會停在搬移當下的舊數字。含送審中的金額
      // （使用者指定：送審中照樣算進成本，但畫面要提醒）。
      const extraTotal      = this.xeTotal + this.remitFeeTotal + this.customExpenseTotal   // W1：含匯款手續費（summary.remitFeeTotal）、自訂模組支出（summary.customExpenseTotal）
      const dispatchTotal   = this.dispatchTotal()
      const dispatchTax = this.dispatchTaxTotal(), dispatchGrandTotal = this.dispatchGross()
      // 32-S5：採購單連結金額還沒採用到品項的，仍計入總成本（不讓連結列從額外支出扣掉後憑空消失）；全部採用或沒有連結 ⇒ 0（歷史案件逐位不變）
      // 33-B1（D8）：後端單一來源可用時，關掉採用＝手填取代、採購金額不另加（只在上方警示）⇒ 0；退回舊路徑時維持 32-S5 算法
      const itemPoUnadopted = this._actualsOk ? 0 : this.settlement.items.reduce((s, i) => s + (i.adoptSystem ? 0 : this.systemActual(i)), 0)
      const dispatchAbsorbed = this.dispatchAbsorbed     // 派發被品項吸收的部分已在 itemActualTotal 內，不重複計入（沒有派發對應 ⇒ 0，與現況逐位相同）
      const totalActualCost = itemActualTotal + itemPoUnadopted + extraTotal + dispatchTotal - dispatchAbsorbed
      const grossProfit     = quotedPretax - totalActualCost
      const grossMarginPct  = quotedPretax > 0 ? grossProfit / quotedPretax * 100 : 0
      const adminCost       = MotrixLegalRound.halfUp(quotedPretax, 0.10)
      const charityDonation = MotrixLegalRound.halfUp(grossProfit, 0.01)
      const netProfit       = grossProfit - adminCost - charityDonation
      const netMarginPct    = quotedPretax > 0 ? netProfit / quotedPretax * 100 : 0

      const origAdminCost   = tot.adminCost != null ? tot.adminCost : MotrixLegalRound.halfUp(quotedPretax, 0.10)
      const origCharity     = tot.charityDonation != null ? tot.charityDonation : MotrixLegalRound.halfUp(origDirectProfit, 0.01)
      const origNetProfit   = tot.netProfit != null ? tot.netProfit : (origDirectProfit - origAdminCost - origCharity)
      const origNetMarginPct = tot.netMarginPct != null ? tot.netMarginPct
        : (quotedPretax > 0 ? origNetProfit / quotedPretax * 100 : 0)

      const profitDiff = netProfit - origNetProfit

      this.summary = {
        quotedPretax, quotedTotal,
        origItemTotal, origTotalCost, origDirectProfit,
        origMarginPct:    MotrixLegalRound.halfUp(origMarginPct, 10) / 10,
        origAdminCost, origCharity,
        origNetProfit:    MotrixLegalRound.halfUp(origNetProfit),
        origNetMarginPct: MotrixLegalRound.halfUp(origNetMarginPct, 10) / 10,
        itemActualTotal, itemPoUnadopted, extraTotal, dispatchTotal, dispatchAbsorbed, totalActualCost, remitFeeTotal: this.remitFeeTotal, customExpenseTotal: this.customExpenseTotal,
        dispatchTax, dispatchGrandTotal, dispatchBasis: this.dispatchBasisOld() ? 'taxed' : 'pretax',     // 35c：口徑標記（舊口徑的完結案沒有這個鍵）
        // 33-B1：完結時後端用同一來源重算比對（A5）；purchasedTotal＝採購類總額（品項＋未對應），materialUnassignedTotal 已併在 extraTotal 內
        purchasedTotal: this._actualsOk ? this.actuals.totals.purchasedTotal : 0, materialUnassignedTotal: this.matUnassigned,
        grossProfit:     MotrixLegalRound.halfUp(grossProfit),
        grossMarginPct:  MotrixLegalRound.halfUp(grossMarginPct, 10) / 10,
        adminCost, charityDonation,
        netProfit:       MotrixLegalRound.halfUp(netProfit),
        netMarginPct:    MotrixLegalRound.halfUp(netMarginPct, 10) / 10,
        profitDiff:      MotrixLegalRound.halfUp(profitDiff),
      }
    },

    // addExtra() / removeExtra() / uploadSettlementExtraFiles() /
    // deleteSettlementExtraFile() 已於 2026-09-11 移除——額外支出搬到案件管理的
    // 「額外支出」分頁與 case_extra_expenses 表（DB v75），這一頁不再有編輯入口，
    // 這四個函式的呼叫者（那張可編輯的表）已經一併拿掉。附件端點改用資料列 id
    // 定位，見 routers/case_extra_expenses.py。

    async previewAttachmentFile(file) {
      // 共用預覽元件（static/file-preview.js）：頁內預覽窗
      try { await MotrixFilePreview.openFile(file) } catch (e) { this.toast('開啟檔案失敗：' + e.message) }
    },

    buildPayload() {
      return {
        status:          this.settlement.status,
        settlementDate:  this.settlement.settlementDate,
        finalizedAt:     this.settlement.finalizedAt,
        finalizedBy:     this.settlement.finalizedBy,
        memo:            this.settlement.memo,
        items:           this.settlement.items.map(i => ({
          id:             i.id,
          origDescription:i.origDescription,
          origBrand:      i.origBrand,
          origQty:        i.origQty,
          origUnit:       i.origUnit,
          origUnitPrice:  i.origUnitPrice,
          origAmount:     i.origAmount,
          origCost:       i.origCost,
          actualQty:      i.actualQty,
          actualUnitCost: i.actualUnitCost,
          actualCostTaxMode: i.actualCostTaxMode,
          actualTotalCost:i.actualTotalCost,
          adoptSystem:    !!i.adoptSystem,
          actualSource:   i.actualSource === 'legacy' || i.actualSource === 'labor' ? i.actualSource : 'manual',
          note:           i.note,
        })),
        extraItems: this.settlement.extraItems,
        offsets:    this.offsets,
        summary:    this.summary,
      }
    },

    async _putSettlement(reason) {
      this.calcSummary()
      const res = await fetch(`${API}/quotations/${this.quoteNo}/settlement`, {
        method:  'PUT',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.session.token },
        body:    JSON.stringify(reason ? { settlement: this.buildPayload(), reason } : { settlement: this.buildPayload() }),
      })
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || '儲存失敗')
      return res
    },

    async saveDraft() {
      if (this.xeMasked > 0) { this.toast('有 ' + this.xeMasked + ' 筆費用單據的金額對你遮蔽，額外支出總額不完整，不能儲存精算'); return }
      this.saving = true
      try {
        await this._putSettlement()
        this.toast('精算草稿已儲存')
      } catch(e) { this.toast('儲存失敗：' + e.message) }
      finally { this.saving = false }
    },

    async finalize() {
      if (this.xeMasked > 0) { this.toast('額外支出總額不完整（有金額對你遮蔽的費用單據），不能完結精算'); this.showFinalizeModal = false; return }
      this.saving = true
      this._finalizing = true
      this.settlement.status      = 'finalized'
      this.settlement.finalizedAt = new Date().toISOString()
      this.settlement.finalizedBy = this.session.displayName || this.session.username || ''
      try {
        this.calcSummary()
        const res = await fetch(`${API}/quotations/${this.quoteNo}/settlement`, {
          method:  'PUT',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.session.token },
          body:    JSON.stringify({ settlement: this.buildPayload() }),
        })
        if (res.ok) {
          this._frozenSummary = Object.assign({}, this.summary, { dispatchBasis: 'pretax' })      // 與後端存下的一致，之後的顯示／過期比對才認得新口徑
          this.showFinalizeModal = false
          this.toast('精算已完結')
        } else {
          this.settlement.status      = 'draft'
          this.settlement.finalizedAt = ''
          this.settlement.finalizedBy = ''
          const detail = (await res.json().catch(() => ({}))).detail
          this.showFinalizeModal = false
          this.toast('完結失敗' + (typeof detail === 'string' && detail ? '：' + detail : ''), 10000)      // 409（完結前重算與畫面不一致）要讓使用者看到「請重新整理」
        }
      } catch(e) {
        this.settlement.status      = 'draft'
        this.settlement.finalizedAt = ''
        this.settlement.finalizedBy = ''
        this.toast('完結失敗：' + e.message)
      } finally { this.saving = false; this._finalizing = false }
    },

    async reopenDraft() {
      const reason = (this.reopenReason || '').trim()
      if (!reason) { this.reopenErr = '請填寫重新開啟的理由'; return }
      this.reopenErr = ''
      const keep = { status: this.settlement.status, finalizedAt: this.settlement.finalizedAt, finalizedBy: this.settlement.finalizedBy }
      this.settlement.status      = 'draft'
      this.settlement.finalizedAt = ''
      this.settlement.finalizedBy = ''
      this.saving = true
      try {
        await this._putSettlement(reason)
        this.showReopenModal = false
        this.toast('精算已重新開啟（草稿）')
      } catch (e) {
        Object.assign(this.settlement, keep)                       // 後端拒絕（例如理由空白）⇒ 畫面維持完結，不要停在『草稿』的假象
        this.reopenErr = '重新開啟失敗：' + e.message
      } finally { this.saving = false }
    },

    toast(msg, ms = 3500) {
      const id = Date.now() + Math.random()
      this.toasts.push({ id, msg })
      setTimeout(() => { this.toasts = this.toasts.filter(t => t.id !== id) }, ms)
    },
  }
}
</script>
<style>
@keyframes spin { to { transform: rotate(360deg) } }
</style>
</body>
</html>
