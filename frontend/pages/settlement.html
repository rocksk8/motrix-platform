<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{if(localStorage.getItem('motrix_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/api/system/branding/favicon">
  <title>成本精算 — MOTRIX 專案管理系統</title>
  <script src="../static/legal-round.js"></script>
  <script src="../static/auth-guard.js"></script>
  <script src="../static/motrix-date.js"></script>
  <script defer src="../static/vendor/alpine-3.17.1.min.js"></script>
  <link rel="stylesheet" href="../css/style.css?v=20260805g">
  <style>
    [x-cloak]{display:none!important}

    /* ── 工具列 ── */
    .stl-toolbar {
      position: fixed;
      top: var(--topbar-h);
      left: var(--sidebar-w);
      right: 0;
      height: 52px;
      background: #fff;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      padding: 0 28px;
      gap: 10px;
      z-index: 80;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .stl-toolbar__left  { display:flex; align-items:center; gap:12px; }
    .stl-toolbar__right { margin-left:auto; display:flex; align-items:center; gap:8px; }

    /* ── 主體 ── */
    .stl-main {
      margin-left: var(--sidebar-w);
      margin-top: calc(var(--topbar-h) + 52px);
      padding: 24px 32px;
      max-width: 1200px;
    }

    /* ── 狀態 badge ── */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 9px; border-radius: 4px;
      font-size: 11px; font-weight: 600; font-family: 'LINE Seed TW_OTF', sans-serif;
    }
    .badge-draft     { background:#F3F4F6; color:#374151; border:1px solid #E5E7EB; }
    .badge-finalized { background:#F0FDF4; color:#15803D; border:1px solid #86EFAC; }

    /* ── Section card ── */
    .stl-card {
      background: #fff;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      margin-bottom: 20px;
      overflow: hidden;
    }
    .stl-card__head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      background: #FAFAF9;
      border-bottom: 1px solid var(--border-light);
    }
    .stl-card__title {
      font-size: 13px; font-weight: 700; color: var(--text-primary);
      display: flex; align-items: center; gap: 8px;
    }
    .stl-card__body { padding: 16px 20px; }

    /* ── 品項 table ── */
    .stl-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .stl-table th {
      padding: 8px 10px; text-align: left;
      background: #F8F7F5; border-bottom: 1.5px solid var(--border-light);
      font-size: 11px; font-weight: 600; color: var(--text-secondary);
      white-space: nowrap;
    }
    .stl-table td {
      padding: 8px 10px; border-bottom: 1px solid #F0EFEB;
      vertical-align: middle;
    }
    .stl-table tr:last-child td { border-bottom: none; }
    .stl-table tr:hover td { background: #FAFAF9; }
    /* 35c：已對應的列＝淺綠底＋文字徽章「已對應」（不只靠顏色）；用共用的 tone 令牌（深色主題自動換色），拿不到令牌時退回淺綠 */
    /* 本頁在深色模式下整頁 invert 反轉：這裡一律寫淺色字面值（反轉後才是深底淺字），不可用 --tone-* 的深色值（那組是給不被反轉的頁面） */
    .stl-table tr.stl-row--mapped td { background: #ECFDF5; }
    .stl-table tr.stl-row--mapped select:disabled { color: #374151; opacity: 1; -webkit-text-fill-color: #374151 }      /* 完結後唯讀：瀏覽器預設灰字 #767676 在淺綠底只有 4.2:1 */
    .stl-table tr.stl-row--mapped:hover td { background: #D1FAE5; }
    .stl-badge-mapped { display: inline-block; margin-right: 6px; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 700;
                        background: #D1FAE5; color: #065F46; border: 1px solid #6EE7B7; }
    .stl-src { display: inline-block; padding: 0 6px; border-radius: 4px; background: #F0EFEB; color: #6B6B6B; }
    .stl-src--po, .stl-src--map, .stl-src--po-map { background: #ECFDF5; color: #15803D; }
    .stl-src--manual { background: #DBEAFE; color: #1D4ED8; }
    .stl-src--est { background: #FEF3C7; color: #92400E; }
    .stl-row--warn td { background: #FFFBEB; }
    .stl-chip { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .stl-chip--material { color: #1D4ED8; background: #DBEAFE; }
    .stl-chip--extra { color: #475569; background: #E2E8F0; }
    .stl-chip--dispatch { color: #6D28D9; background: #EDE9FE; }
    .stl-badge-st { display: inline-block; margin-left: 4px; padding: 0 7px; border-radius: 999px; font-size: 10px; background: #F0EFEB; color: var(--text-secondary); }
    .stl-table tr.stl-row--mapped td:first-child { box-shadow: inset 5px 0 0 #15803D; }
    .stl-sumbar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 10px 20px; border-bottom: 2px solid; font-size: 13px; }
    .stl-sumbar--warn { background: #FEF3C7; border-color: #FCD34D; color: #92400E; }
    .stl-sumbar--bad { background: #FEE2E2; border-color: #FCA5A5; color: #B91C1C; }
    .stl-sumbar--ok { background: #ECFDF5; border-color: #86EFAC; color: #15803D; }
    .stl-conserve { margin: 12px 20px; padding: 10px 14px; border: 2px solid #111; border-radius: 8px; font-size: 14px; font-weight: 700; }
    .stl-conserve small { display: block; margin-top: 4px; font-weight: 400; font-size: 11px; color: var(--text-secondary); }
    .stl-legend { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-size: 11px; color: var(--text-secondary); margin: 2px 0 8px; }
    .stl-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid var(--border-light); }
    .stl-legend .is-mapped { background: #ECFDF5; border-color: #6EE7B7; }

    .stl-orig  { color: var(--text-secondary); font-family: 'LINE Seed TW_OTF', sans-serif; font-size: 11px; }
    .stl-input {
      width: 100%; padding: 6px 8px;
      border: 1px solid var(--border-light); border-radius: 5px;
      font-size: 12px; font-family: var(--font-zh);
      background: #fff; outline: none; box-sizing: border-box;
      transition: border-color .12s;
    }
    .stl-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(37,99,235,.08); }
    .stl-input.num { text-align: right; font-family: 'LINE Seed TW_OTF', sans-serif; }

    .stl-input[readonly], .stl-input:disabled {
      background: #F8F7F5; color: var(--text-dim); cursor: default;
    }

    .col-orig   { background: #FAFAF9; }
    .col-actual { background: #FFFBEB; }

    /* ── 差異 indicator ── */
    .diff-pos { color: #16a34a; font-weight: 600; }
    .diff-neg { color: #DC2626; font-weight: 600; }
    .diff-zero { color: var(--text-dim); }

    /* ── 精算彙總 ── */
    .stl-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .stl-kpi {
      background: #fff;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
    }
    .stl-kpi__label { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; }
    .stl-kpi__value { font-size: 20px; font-weight: 700; font-family: 'LINE Seed TW_OTF', sans-serif; color: var(--text-primary); }
    .stl-kpi__sub   { font-size: 10px; color: var(--text-dim); margin-top: 3px; font-family: 'LINE Seed TW_OTF', sans-serif; }
    .stl-kpi.highlight-green { border-color: #86EFAC; background: #F0FDF4; }
    .stl-kpi.highlight-green .stl-kpi__value { color: #15803D; }
    .stl-kpi.highlight-red   { border-color: #FECACA; background: #FFF1F2; }
    .stl-kpi.highlight-red   .stl-kpi__value { color: #DC2626; }
    .stl-kpi.highlight-blue  { border-color: #BFDBFE; background: var(--accent-light); }
    .stl-kpi.highlight-blue  .stl-kpi__value { color: var(--accent-hover); }

    /* ── 明細對照 bar ── */
    .profit-bar {
      height: 10px; border-radius: 5px; background: #E5E7EB; overflow: hidden; margin-top: 6px;
    }
    .profit-bar__fill { height: 100%; border-radius: 5px; transition: width .3s; }

    /* ── 按鈕（.btn/.btn-primary/.btn-ghost/.btn-danger/.btn-sm/.btn:disabled 已收斂至共用 style.css） ── */
    .btn-success  { background:var(--success); color:#fff; }
    .btn-success:hover { background:#15803D; }

    /* ── 額外品項 category badge ── */
    .cat-badge {
      font-size: 10px; padding: 2px 7px; border-radius: 3px; font-family: 'LINE Seed TW_OTF', sans-serif;
      font-weight: 600; white-space: nowrap;
    }
    .cat-工時       { background:#EDE9FE; color:#6D28D9; }
    .cat-材料       { background:#DBEAFE; color:var(--accent-hover); }
    .cat-差旅       { background:#FEF3C7; color:#92400E; }
    .cat-運費       { background:#D1FAE5; color:#065F46; }
    .cat-安裝       { background:#FCE7F3; color:#9D174D; }
    .cat-外包       { background:#FEE2E2; color:#991B1B; }
    .cat-其他       { background:#F3F4F6; color:#374151; }

    /* ── Toast ── */
    .toast-wrap { position:fixed; bottom:24px; right:24px; z-index:999; display:flex; flex-direction:column; gap:8px; }
    .toast { padding:10px 16px; background:#1F2937; color:#fff; border-radius:8px; font-size:12px; font-family:var(--font-zh); box-shadow:0 4px 16px rgba(0,0,0,.18); min-width:200px; animation: toastIn .2s ease; }
    @keyframes toastIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }

    /* ── 完結確認 Modal ── */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:500; display:flex; align-items:center; justify-content:center; }
    .modal-box { background:#fff; border-radius:var(--radius-lg); padding:28px; max-width:420px; width:90%; box-shadow: 0 8px 40px rgba(0,0,0,.2); }

    /* ── 鎖定遮罩（已完結） ── */
    .locked-overlay { pointer-events:none; opacity:.7; user-select:none; }
    .finalized-banner {
      display:flex; align-items:center; gap:12px;
      background:#F0FDF4; border:1px solid #86EFAC; border-radius:8px;
      padding:12px 16px; margin-bottom:18px;
    }
    .stale-banner {
      display:flex; align-items:center; gap:12px;
      background:#FFFBEB; border:1px solid #FDE68A; border-radius:8px;
      padding:12px 16px; margin-bottom:18px;
    }
  </style>
</head>
<body x-data="settlementPage()" x-init="init()" x-cloak>

<header id="app-topbar" class="topbar"></header>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<aside class="sidebar" id="app-sidebar"></aside>

<!-- ── 工具列 ── -->
<div class="stl-toolbar">
  <div class="stl-toolbar__left">
    <a :href="'quotation-form.html?no=' + quoteNo"
       style="font-size:12px;color:var(--text-secondary);text-decoration:none;display:flex;align-items:center;gap:4px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5m7-7l-7 7 7 7"/></svg>
      返回報價單
    </a>
    <span style="color:var(--border-light)">|</span>
    <span style="font-size:14px;font-weight:700;color:var(--text-primary);font-family:LINE Seed TW_OTF, sans-serif" x-text="quoteNo"></span>
    <span style="font-size:12px;color:var(--text-dim)" x-text="customerName + (projectName ? ' · ' + projectName : '')"></span>
    <template x-if="settlement.status === 'finalized'">
      <span class="badge badge-finalized">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        精算完結
      </span>
    </template>
    <template x-if="settlement.status !== 'finalized'">
      <span class="badge badge-draft">精算草稿</span>
    </template>
  </div>
  <div class="stl-toolbar__right">
    <span x-show="xeMasked > 0" data-testid="stl-masked-warning" style="font-size:11px;color:#B45309;max-width:320px">⚠️ 有 <b x-text="xeMasked"></b> 筆費用單據的金額對你遮蔽，額外支出總額不完整：不能儲存或完結精算（請由申請人／簽核人／出納／財務／管理員處理）</span>
    <span x-show="saving" style="font-size:11px;color:var(--text-dim)">儲存中…</span>
    <template x-if="settlement.status !== 'finalized'">
      <button class="btn btn-ghost btn-sm" @click="saveDraft()" :disabled="saving || xeMasked > 0" data-testid="stl-save-draft">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
        儲存草稿
      </button>
    </template>
    <template x-if="settlement.status !== 'finalized'">
      <button class="btn btn-success btn-sm" @click="showFinalizeModal=true" :disabled="xeMasked > 0" data-testid="stl-finalize">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        完結精算
      </button>
    </template>
    <template x-if="settlement.status === 'finalized'">
      <button class="btn btn-ghost btn-sm" @click="reopenReason=''; reopenErr=''; showReopenModal=true" style="color:#DC2626;border-color:#FECACA" data-testid="stl-reopen">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"/></svg>
        重新開啟
      </button>
    </template>
  </div>
</div>

<!-- ── 主體 ── -->
<div class="stl-main">

  <!-- 載入中 -->
  <div x-show="loading" style="text-align:center;padding:60px;color:var(--text-dim)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 1s linear infinite;display:inline-block"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/></svg>
    <span style="margin-left:8px;font-size:13px">載入中…</span>
  </div>

  <template x-if="!loading">
    <div>

      <!-- 已完結橫幅 -->
      <template x-if="settlement.status === 'finalized'">
        <div class="finalized-banner">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#15803D" stroke-width="2"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <div>
            <div style="font-size:12px;font-weight:600;color:#15803D">精算已完結・唯讀</div>
            <div style="font-size:11px;color:#16a34a;margin-top:1px"
                 x-text="'完結時間：' + (settlement.finalizedAt ? new Date(settlement.finalizedAt).toLocaleString('zh-TW') : '') + '　完結人：' + (settlement.finalizedBy || '')"></div>
          </div>
        </div>
      </template>

      <!-- 快照過期警示：承攬商成本在精算完結後又異動 -->
      <template x-if="settlement.status === 'finalized' && dispatchStale()">
        <div class="stale-banner">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#92400E" stroke-width="2"><path d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
          <div>
            <div style="font-size:12px;font-weight:600;color:#92400E">承攬商成本自精算完結後已異動，其他頁面顯示的快照可能已過期</div>
            <div style="font-size:11px;color:#92400E;margin-top:1px"
                 x-text="'完結當下承攬商派發成本：NT$ ' + fmt(dispatchStale().frozen) + '　目前即時計算：NT$ ' + fmt(dispatchStale().live) + '（' + (dispatchStale().diff>=0?'+':'') + fmt(dispatchStale().diff) + '）　此頁上方數字已是最新即時計算，但案件管理財務Tab／營運報表仍顯示完結當下的舊快照，如需同步請按右上角「重新開啟」後重新完結'"></div>
          </div>
        </div>
      </template>

      <!-- ── KPI 彙總 ── -->
      <div class="stl-summary">
        <div class="stl-kpi highlight-blue">
          <div class="stl-kpi__label">報價收入（稅前）</div>
          <div class="stl-kpi__value" x-text="'NT$ ' + fmt(summary.quotedPretax)"></div>
          <div class="stl-kpi__sub" x-text="'含稅：NT$ ' + fmt(summary.quotedTotal)"></div>
        </div>
        <div class="stl-kpi">
          <div class="stl-kpi__label">實際總成本</div>
          <div class="stl-kpi__value" x-text="'NT$ ' + fmt(summary.totalActualCost)"></div>
          <div class="stl-kpi__sub">品項成本 + 額外支出 + 承攬商派發</div>
        </div>
        <div :class="summary.grossProfit >= 0 ? 'stl-kpi highlight-green' : 'stl-kpi highlight-red'">
          <div class="stl-kpi__label">真實毛利</div>
          <div class="stl-kpi__value" x-text="(summary.grossProfit < 0 ? '▼ ' : '') + 'NT$ ' + fmt(Math.abs(summary.grossProfit))"></div>
          <div class="stl-kpi__sub" x-text="'毛利率 ' + summary.grossMarginPct.toFixed(1) + '%'"></div>
          <div class="profit-bar">
            <div class="profit-bar__fill"
                 :style="'width:' + Math.min(Math.max(summary.grossMarginPct, 0), 100) + '%;background:' + (summary.grossMarginPct >= 30 ? '#22c55e' : summary.grossMarginPct >= 0 ? '#f59e0b' : '#ef4444')"></div>
          </div>
        </div>
        <div class="stl-kpi">
          <div class="stl-kpi__label">與原始報價毛利差異</div>
          <div class="stl-kpi__value"
               :class="summary.profitDiff >= 0 ? 'diff-pos' : 'diff-neg'"
               x-text="(summary.profitDiff >= 0 ? '+' : '') + 'NT$ ' + fmt(summary.profitDiff)"></div>
          <div class="stl-kpi__sub" x-text="'原始毛利 NT$ ' + fmt(summary.origDirectProfit)"></div>
        </div>
        <div class="stl-kpi">
          <div class="stl-kpi__label">精算日期</div>
          <div style="margin-top:6px">
            <input type="date" class="stl-input" x-model="settlement.settlementDate"
                   :disabled="settlement.status === 'finalized'" style="max-width:160px">
          </div>
          <div class="stl-kpi__sub" style="margin-top:4px" x-text="settlement.status === 'finalized' ? '已完結' : '草稿中'"></div>
        </div>
      </div>

      <!-- ── 一、原始報價品項實際成本 ── -->
      <div class="stl-card">
        <div class="stl-card__head">
          <div class="stl-card__title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
            一、原始報價品項 — 實際成本對照
          </div>
          <div style="font-size:11px;color:var(--text-dim)">
            原始報價共 <span style="font-weight:600" x-text="settlement.items.length"></span> 項
          </div>
        </div>
        <div style="overflow-x:auto" :class="settlement.status === 'finalized' ? 'locked-overlay' : ''">
          <table class="stl-table">
            <thead>
              <tr>
                <th style="width:28px">#</th>
                <th style="min-width:200px">品名 / 規格說明</th>
                <th style="min-width:100px">廠牌 / 型號</th>
                <th colspan="2" style="text-align:center;background:#FAFAF9;border-left:2px solid #E5E7EB">
                  <span style="font-size:10px">原始報價</span>
                </th>
                <th colspan="3" style="text-align:center;background:#FFFBEB;border-left:2px solid #FDE68A">
                  <span style="font-size:10px;color:#92400E">實際成本</span>
                </th>
                <th style="min-width:130px">本項毛利（報價−實際）</th>
                <th style="min-width:80px">備註</th>
              </tr>
              <tr style="background:#F8F7F5">
                <th></th>
                <th></th>
                <th></th>
                <th class="col-orig" style="border-left:2px solid #E5E7EB;width:55px">數量</th>
                <th class="col-orig" style="width:90px">報價金額</th>
                <th class="col-actual" style="border-left:2px solid #FDE68A;width:55px">實際數量</th>
                <th class="col-actual" style="width:104px">實際單位成本</th>
                <th class="col-actual" style="width:100px">實際總成本</th>
                <th></th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(item, idx) in settlement.items" :key="item.id">
                <tr>
                  <td style="text-align:center;color:var(--text-dim);font-size:11px;font-family:LINE Seed TW_OTF, sans-serif" x-text="idx+1"></td>
                  <td>
                    <div style="font-size:12px;font-weight:500;color:var(--text-primary)" x-text="item.origDescription || '（無品名）'"></div>
                  </td>
                  <td class="stl-orig" x-text="item.origBrand || '—'"></td>

                  <!-- 原始報價欄 -->
                  <td class="col-orig" style="border-left:2px solid #E5E7EB;text-align:right;font-family:LINE Seed TW_OTF, sans-serif">
                    <span x-text="item.origQty"></span>
                    <span style="font-size:10px;color:var(--text-dim)" x-text="item.origUnit"></span>
                  </td>
                  <td class="col-orig" style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif">
                    <span x-text="'NT$ ' + fmt(item.origAmount)"></span>
                  </td>

                  <!-- 實際成本欄 -->
                  <td class="col-actual" style="border-left:2px solid #FDE68A">
                    <div style="display:flex;align-items:center;gap:3px">
                      <input class="stl-input num" type="number" min="0" step="any"
                             x-model.number="item.actualQty"
                             :disabled="settlement.status === 'finalized'"
                             @input="calcItemCost(item); calcSummary()"
                             style="width:60px">
                      <span style="font-size:10px;color:var(--text-dim)" x-text="item.origUnit"></span>
                    </div>
                  </td>
                  <td class="col-actual">
                    <div style="display:flex;align-items:center;gap:3px">
                      <span style="font-size:10px;color:var(--text-dim)">NT$</span>
                      <input class="stl-input num" type="number" min="0" step="any"
                             x-model.number="item.actualUnitCost"
                             :disabled="settlement.status === 'finalized'"
                             @input="calcItemCost(item); calcSummary()"
                             style="width:80px">
                    </div>
                    <select data-saved-field class="stl-input" x-model="item.actualCostTaxMode"
                            :disabled="settlement.status === 'finalized'"
                            @change="calcItemCost(item); calcSummary()"
                            style="margin-top:3px;font-size:10px;padding:2px 4px;width:100%">
                      <option value="pretax">未稅</option>
                      <option value="taxed">含稅5%</option>
                      <option value="taxed_gross">含稅5%（自動加總）</option>
                    </select>
                  </td>
                  <td class="col-actual" style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;font-weight:600">
                    <span x-text="item.actualTotalCost > 0 ? 'NT$ ' + fmt(item.actualTotalCost) : '—'"></span>
                    <template x-if="item.actualCostTaxMode === 'taxed' && item.actualTotalCost > 0 && !item.adoptSystem">
                      <div style="font-size:9px;color:var(--text-dim);font-weight:400"
                           x-text="'原含稅 NT$ ' + fmt(MotrixLegalRound.halfUp(item.actualQty||0, item.actualUnitCost||0))"></div>
                    </template>
                    <div style="margin-top:3px;font-size:10px;font-weight:600" :data-testid="'stl-source-' + item.id">
                      <span class="stl-src" :class="'stl-src--' + itemSource(item).key" x-text="'來源：' + itemSource(item).label"></span>
                    </div>
                    <select class="stl-input" x-show="itemSource(item).key === 'manual' || (itemSource(item).key === 'est' && !(systemActual(item) > 0))" :data-testid="'stl-actual-source-' + item.id"
                            x-model="item.actualSource" :disabled="settlement.status === 'finalized'" aria-label="手填來源標籤" style="margin-top:3px;font-size:10px;padding:2px 4px;width:100%">
                      <option value="manual">手填</option>
                      <option value="legacy">歷史未建系統</option>
                      <option value="labor">人力</option>
                    </select>
                    <div x-show="systemActual(item) > 0" :data-testid="'stl-po-' + item.id" style="margin-top:4px;font-size:10px;font-weight:400;color:#92400E">
                      <span x-text="purchaseLabel(item)"></span>
                      <button type="button" class="btn btn-ghost btn-sm" style="padding:0 6px;font-size:10px" :disabled="settlement.status === 'finalized'"
                              @click="toggleAdopt(item)" :data-testid="'stl-adopt-' + item.id" x-text="item.adoptSystem ? '取消採用' : '採用'"></button>
                      <span x-show="item.adoptSystem" style="color:#15803D">已採用</span>
                    </div>
                    <template x-if="item.actualCostTaxMode === 'taxed_gross' && item.actualTotalCost > 0 && !item.adoptSystem">
                      <div style="font-size:9px;color:var(--text-dim);font-weight:400"
                           x-text="'原未稅 NT$ ' + fmt(MotrixLegalRound.halfUp(item.actualQty||0, item.actualUnitCost||0))"></div>
                    </template>
                  </td>

                  <!-- 毛利欄：每個品項賺多少（只算到毛利；管理費／公益／淨利只在總結） -->
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif" :data-testid="'stl-profit-' + item.id">
                    <div style="font-size:18px;font-weight:800;line-height:1.2" :style="{ color: itemProfit(item) < 0 ? '#B91C1C' : '#15803D' }"
                         x-text="(itemProfit(item) < 0 ? '−' : '') + 'NT$ ' + fmt(Math.abs(itemProfit(item)))"></div>
                    <div style="font-size:12px;font-weight:700" :style="{ color: itemProfit(item) < 0 ? '#B91C1C' : '' }" x-text="'毛利比 ' + pctTxt(itemPct(item))"></div>
                    <div style="font-size:10px;color:var(--text-dim)" x-text="'單件毛利 ' + (itemUnitProfit(item) == null ? '—' : fmt(itemUnitProfit(item))) + (item.origUnit ? '／' + item.origUnit : '')"></div>
                  </td>

                  <!-- 備註 -->
                  <td>
                    <input class="stl-input" type="text" x-model="item.note"
                           :disabled="settlement.status === 'finalized'"
                           placeholder="說明…"
                           @input="calcSummary()">
                    <div x-show="itemSource(item).key === 'est' && !(systemActual(item) > 0)" :data-testid="'stl-nopurchase-' + item.id" style="margin-top:4px;font-size:11px;font-weight:400;color:#92400E;line-height:1.4">
                      ⚠ 無採購／對應紀錄：實際成本暫以估計計。已採購但沒進系統（歷史）或人力成本，請在左側填實際數量／單位成本。
                    </div>
                  </td>
                </tr>
              </template>
            </tbody>
            <tfoot>
              <tr style="background:#F8F7F5;font-weight:600">
                <td colspan="4" style="border-top:1.5px solid var(--border-light);padding:10px 10px;text-align:right;font-size:11px;color:var(--text-secondary)">原始報價品項小計</td>
                <td style="border-top:1.5px solid var(--border-light);text-align:right;font-family:LINE Seed TW_OTF, sans-serif;font-size:12px" x-text="'NT$ ' + fmt(summary.origItemTotal)"></td>
                <td colspan="2" style="border-top:1.5px solid var(--border-light);text-align:right;font-size:11px;color:var(--text-secondary)">實際成本小計</td>
                <td style="border-top:1.5px solid var(--border-light);text-align:right;font-family:LINE Seed TW_OTF, sans-serif;font-size:12px;color:#92400E" x-text="'NT$ ' + fmt(summary.itemActualTotal)"></td>
                <td colspan="2" style="border-top:1.5px solid var(--border-light);text-align:right;font-family:LINE Seed TW_OTF, sans-serif;font-size:11px">
                  <span :class="summary.origItemTotal - summary.itemActualTotal >= 0 ? 'diff-pos' : 'diff-neg'"
                        x-text="(summary.origItemTotal - summary.itemActualTotal >= 0 ? '+' : '') + fmt(summary.origItemTotal - summary.itemActualTotal)"></span>
                </td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>

      <!-- ── 二、額外支出（2026-09-11 起搬到案件管理）── -->
      <!-- 這張表原本可以在這裡直接編輯，資料存在 settlement.extraItems。
           2026-09-11 依使用者交辦搬到「案件管理 → 額外支出」分頁並接上送審，
           資料也搬進 case_extra_expenses 表（DB v75）。
           **這裡必須移除而不是留著唯讀**：資料已經改從新表讀，留著一張還能按的
           表單會變成「編輯了也不會進報表」，比拿掉更難察覺。 -->
      <div class="stl-card">
        <div class="stl-card__head">
          <div class="stl-card__title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v16m8-8H4"/></svg>
            二、額外支出
          </div>
        </div>
        <div style="padding:20px;text-align:center;color:var(--text-secondary);font-size:13px;line-height:1.8">
          額外支出已移到 <b>案件管理 → 額外支出</b> 分頁，並加上填寫人、支出人與送審流程。
          <div style="font-size:12px;color:var(--text-dim);margin-top:6px">
            原本填在這裡的資料都已經搬過去，不會遺失。下方「成本彙總」仍會把額外支出算進去。
          </div>
          <a class="btn btn-ghost btn-sm" style="margin-top:12px;text-decoration:none"
             :href="'case-management.html?q=' + (quoteNo || '')">
            前往案件管理的額外支出 ▶
          </a>
        </div>
      </div>

      <!-- ── 二之一、未對應品項的材料申請與額外支出（33-B1；沖銷對應寫進 settlement.offsets，不改原單據）──
           35c：已對應的另列一張「已對應」表（看得出哪些已被帶入哪個品項、金額多少，避免重複帶入）；一律 x-text。
           下拉用 String 比對品項 id（報價品項 id 可能是數字；number === string 會讓已對應的列顯示成「不對應」）。 -->
      <div class="stl-card" x-show="_actualsOk && (offsets.length || allMapRows().length)" data-testid="stl-unassigned">
        <div class="stl-card__head">
          <div class="stl-card__title">二之一、未對應品項的材料申請、額外支出與承攬商派發</div>
          <div style="font-size:11px;color:var(--text-dim)">沒對應到報價品項的錢一律照算（計入額外支出）；選一個品項＝改算在那個品項的實際成本，原單據不動</div>
        </div>
        <div class="stl-sumbar" data-testid="stl-sumbar" :class="mapSummary.unCount === 0 ? 'stl-sumbar--ok' : (mapSummary.unPending ? 'stl-sumbar--bad' : 'stl-sumbar--warn')">
          <b x-text="mapSummary.unCount === 0 ? '✔ 全部已對應' : '⚠ 未對應 ' + mapSummary.unCount + ' 件'"></b>
          <span x-show="mapSummary.unCount > 0" x-text="'NT$ ' + fmt(mapSummary.unTotal) + '（仍計入總成本）' + (mapSummary.unPending ? '・含待審核' : '')"></span>
          <span x-show="settlement.status === 'finalized'" style="margin-left:auto;font-weight:700">已完結・唯讀</span>
        </div>
        <div style="overflow-x:auto" x-show="unmappedRows().length">
          <table class="stl-table">
            <thead><tr><th style="width:90px">類型</th><th style="min-width:180px">單據</th><th style="width:120px;text-align:right">金額 (NT$)</th><th style="min-width:200px">對應到品項</th></tr></thead>
            <tbody>
              <template x-for="u in unmappedRows()" :key="u.kind + ':' + u.ref">
                <tr :data-testid="'stl-un-' + u.kind + '-' + u.ref">
                  <td><span class="stl-chip" :class="'stl-chip--' + u.kind" x-text="kindLabel(u.kind)"></span></td>
                  <td>
                    <span x-text="u.label"></span>
                    <span x-show="u.status" class="stl-badge-st" x-text="u.status"></span>
                    <span x-show="u.pending" style="font-size:10px;color:#B45309">（待審核）</span>
                    <span x-show="u.noPo" style="font-size:10px;color:#92400E">（未申請採購單）</span>
                    <div x-show="u.detail" style="font-size:11px;color:var(--text-secondary)" x-text="u.detail"></div>
                  </td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif"><b x-text="fmt(u.amount)"></b><div x-show="u.kind === 'dispatch'" data-testid="stl-tax" style="font-size:10px;color:var(--text-dim)" x-text="'稅額 ' + fmt(u.tax) + '（不計成本）'"></div></td>
                  <td>
                    <select class="stl-input" :data-testid="'stl-offset-' + u.kind + '-' + u.ref" :disabled="settlement.status === 'finalized'"
                            @change="setOffset(u.kind, u.ref, $event.target.value)" style="width:100%">
                      <option value="" :selected="!u.itemId">（不對應，計入額外支出）</option>
                      <template x-for="it in offsetTargets()" :key="it.id">
                        <option :value="String(it.id)" :selected="String(it.id) === String(u.itemId)" x-text="'#' + itemNo(it.id) + ' ' + (it.origDescription || it.id)"></option>
                      </template>
                    </select>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <div class="stl-conserve" data-testid="stl-conserve">
          <span x-text="'未對應 NT$ ' + fmt(mapSummary.unTotal) + ' ＋ 已對應 NT$ ' + fmt(mapSummary.asTotal) + ' ＝ NT$ ' + fmt(mapSummary.all)"></span>
          <small x-text="mapSummary.byKind.map(b => kindLabel(b.kind) + ' ' + fmt(b.un) + '＋' + fmt(b.as)).join('　')"></small>
        </div>
        <div x-show="!unmappedRows().length" data-testid="stl-unmapped-none" style="padding:8px 2px;font-size:12px;color:var(--text-secondary)">目前沒有未對應的項目。</div>
        <div x-show="mappedRows().length" data-testid="stl-mapped" style="margin-top:14px">
          <div style="font-size:12px;font-weight:600;margin-bottom:4px">已對應到品項（已帶入，不會再出現在上面的未對應清單；同一筆只能有一個去處）</div>
          <div class="stl-legend" data-testid="stl-legend"><span><i class="is-mapped"></i>淺綠底＋「已對應」＝已帶入某個品項的實際成本</span><span><i></i>白底＝尚未對應（計入額外支出）</span></div>
          <div style="overflow-x:auto">
            <table class="stl-table">
              <thead><tr><th style="width:90px">類型</th><th style="min-width:180px">單據</th><th style="min-width:160px">已對應到品項</th><th style="width:120px;text-align:right">金額 (NT$)</th><th style="min-width:200px">對應方式／改對應</th></tr></thead>
              <tbody>
                <template x-for="u in mappedRows()" :key="u.kind + ':' + u.ref">
                  <tr class="stl-row--mapped" :data-testid="'stl-mapped-' + u.kind + '-' + u.ref">
                    <td><span class="stl-chip" :class="'stl-chip--' + u.kind" x-text="kindLabel(u.kind)"></span></td>
                    <td>
                      <span class="stl-badge-mapped" data-testid="stl-badge-mapped">已對應</span>
                      <span x-text="u.label"></span>
                      <span x-show="u.status" class="stl-badge-st" x-text="u.status"></span>
                      <span x-show="u.pending" style="font-size:10px;color:#B45309">（待審核）</span>
                      <div x-show="u.detail" style="font-size:11px;color:var(--text-secondary)" x-text="u.detail"></div>
                    </td>
                    <td>
                      <span :data-testid="'stl-mapped-to-' + u.kind + '-' + u.ref" x-text="'#' + itemNo(u.itemId) + ' ' + itemName(u.itemId)"></span>
                      <div style="font-size:10px" :style="itemAdopted(u.itemId) ? 'color:#15803D' : 'color:#92400E'"
                           x-text="itemAdopted(u.itemId) ? '已計入該品項的實際成本' : '該品項未採用：這筆金額目前不計入實際成本'"></div>
                    </td>
                    <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif"><b x-text="fmt(u.amount)"></b><div x-show="u.kind === 'dispatch'" data-testid="stl-tax" style="font-size:10px;color:var(--text-dim)" x-text="'稅額 ' + fmt(u.tax) + '（不計成本）'"></div></td>
                    <td>
                      <template x-if="u.assignedBy === 'link'">
                        <span style="font-size:12px;color:var(--text-secondary)" :data-testid="'stl-linked-' + u.kind + '-' + u.ref">由材料申請連結（唯讀）</span>
                      </template>
                      <template x-if="u.assignedBy !== 'link'">
                        <select class="stl-input" :data-testid="'stl-offset-' + u.kind + '-' + u.ref" :disabled="settlement.status === 'finalized'"
                                @change="setOffset(u.kind, u.ref, $event.target.value)" style="width:100%">
                          <option value="" :selected="!u.itemId">（取消對應，計入額外支出）</option>
                          <template x-for="it in offsetTargets()" :key="it.id">
                            <option :value="String(it.id)" :selected="String(it.id) === String(u.itemId)" x-text="'#' + itemNo(it.id) + ' ' + (it.origDescription || it.id)"></option>
                          </template>
                        </select>
                      </template>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- ── 三、承攬商派發成本 ── -->
      <div class="stl-card">
        <div class="stl-card__head">
          <div class="stl-card__title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M12.5 7a4 4 0 11-8 0 4 4 0 018 0zM20 8v6M23 11h-6"/></svg>
            三、承攬商派發成本
          </div>
          <div style="font-size:11px;color:var(--text-dim)">
            自動讀取「案件管理／承攬商」分頁，唯讀（已排除已取消的派發）
          </div>
        </div>
        <div>
          <template x-if="dispatches.length === 0">
            <div style="padding:24px;text-align:center;color:var(--text-dim);font-size:12px">
              尚無承攬商派發紀錄
            </div>
          </template>
          <template x-if="dispatches.length > 0">
            <div style="overflow-x:auto">
              <table class="stl-table">
                <thead>
                  <tr>
                    <th style="min-width:160px">承攬商 / 外包人員</th>
                    <th style="width:110px">派發狀態</th>
                    <th style="width:150px;text-align:right" x-text="dispatchBasisOld() ? '金額 (NT$，含稅，舊口徑)' : '計入成本 (NT$，未稅)'"></th>
                    <th style="width:150px;text-align:right" x-show="!dispatchBasisOld()">承攬商稅額（進項稅額，不計成本）</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="d in dispatches" :key="d.id">
                    <template x-for="row in _dispatchRows(d)">
                      <tr style="border-bottom:1px solid var(--border-light)">
                        <td :style="row.isVendor ? 'font-weight:600' : 'color:var(--text-secondary)'">
                          <span x-text="row.label"></span>
                          <div x-show="row.isVendor && d.invoiceNo" style="font-weight:400;font-size:10px;color:var(--text-dim);font-family:LINE Seed TW_OTF, sans-serif"
                               x-text="'發票：' + d.invoiceNo"></div>
                        </td>
                        <td x-text="row.isVendor ? d.statusLabel : ''" style="color:var(--text-dim);font-size:11px"></td>
                        <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif" x-text="fmt(row.amount)"></td>
                        <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;color:var(--text-secondary)" x-show="!dispatchBasisOld()" data-testid="stl-dispatch-row-tax"
                            x-text="row.tax ? fmt(row.tax) : ''"></td>
                      </tr>
                    </template>
                  </template>
                </tbody>
                <tfoot>
                  <tr style="background:#FEF9C3;font-weight:600">
                    <td colspan="2" style="border-top:1.5px solid #FDE68A;padding:10px;text-align:right;font-size:11px;color:#92400E">承攬商派發成本小計</td>
                    <td style="border-top:1.5px solid #FDE68A;text-align:right;font-family:LINE Seed TW_OTF, sans-serif;color:#92400E" data-testid="stl-dispatch-subtotal" x-text="'NT$ ' + fmt(summary.dispatchTotal)"></td>
                    <td style="border-top:1.5px solid #FDE68A;text-align:right;font-family:LINE Seed TW_OTF, sans-serif;color:#92400E" x-show="!dispatchBasisOld()" data-testid="stl-dispatch-tax-total"
                        x-text="'NT$ ' + fmt(dispatchTaxTotal())"></td>
                  </tr>
                </tfoot>
              </table>
              <!-- 35c 稅基 B：稅額透明（避免 5% 爭議）。只有「未稅＋外包人員」計入成本；稅額是進項稅額（總帳記資產 1268），不是成本。一律 x-text。 -->
              <div style="padding:8px 10px;font-size:11px;color:var(--text-secondary)" data-testid="stl-dispatch-split" x-text="dispatchSplitText()"></div>
              <template x-if="dispatchDraftNote()">
                <div style="margin:4px 10px 10px;padding:8px 10px;border-radius:6px;background:var(--tone-info-bg, #EFF6FF);color:var(--tone-info-fg, #1E40AF);font-size:11px;display:flex;gap:10px;align-items:center" role="status" data-testid="stl-dispatch-basis-note">
                  <span style="flex:1" x-text="'承攬商成本現以未稅計入（稅額為進項稅額，不計成本）；與先前顯示相差承攬商稅額 NT$ ' + fmt(dispatchTaxTotal())"></span>
                  <button type="button" class="btn btn-ghost btn-sm" style="padding:0 8px;font-size:11px" data-testid="stl-dispatch-basis-note-dismiss" @click="dismissDispatchNote()">知道了</button>
                </div>
              </template>
              <template x-if="dispatchBasisOld() && dispatchTaxTotal() > 0">
                <div style="margin:4px 10px 10px;padding:8px 10px;border-radius:6px;background:#F5F4F0;color:var(--text-secondary);font-size:11px" role="status" data-testid="stl-dispatch-old-basis-note"
                     x-text="'此精算完結於含稅口徑（承攬商稅額已計入成本）；新精算以未稅計入，兩者相差承攬商稅額（目前約 NT$ ' + fmt(dispatchTaxTotal()) + '）。已完結的數字不改寫。'"></div>
              </template>
            </div>
          </template>
        </div>
      </div>

      <!-- ── 四、精算備忘 ── -->
      <div class="stl-card">
        <div class="stl-card__head">
          <div class="stl-card__title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            四、精算備忘
          </div>
        </div>
        <div class="stl-card__body">
          <textarea class="stl-input" rows="4"
                    x-model="settlement.memo"
                    :disabled="settlement.status === 'finalized'"
                    placeholder="精算說明、成本異常原因、客訴或變更說明、後續追蹤事項等…"
                    style="resize:vertical;min-height:80px;width:100%;box-sizing:border-box"
                    @input="calcSummary()"></textarea>
        </div>
      </div>

      <!-- ── 四之一、每個品項的賺賠（毛利；未對應項目與折扣／調整各自一列，讓加總對得上）── -->
      <div class="stl-card" data-testid="stl-profit-card">
        <div class="stl-card__head">
          <div class="stl-card__title">四之一、每個品項的賺賠（毛利）</div>
          <div style="font-size:11px;color:var(--text-dim)">品項只算到毛利；管理費、公益捐贈、淨利只在下方「利潤分析」</div>
        </div>
        <div style="overflow-x:auto">
          <table class="stl-table" data-testid="stl-profit-table">
            <thead><tr><th>品項</th><th style="text-align:right">報價（未稅）</th><th style="text-align:right">實際成本</th><th style="text-align:right">毛利</th><th style="text-align:right">毛利比</th></tr></thead>
            <tbody>
              <template x-for="(item, idx) in settlement.items" :key="'pt' + item.id">
                <tr :data-testid="'stl-pt-' + item.id">
                  <td><span x-text="'#' + (idx + 1) + ' ' + (item.origDescription || '（無品名）')"></span> <span class="stl-src" :class="'stl-src--' + itemSource(item).key" x-text="itemSource(item).label"></span></td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif" x-text="fmt(itemQuote(item))"></td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif" x-text="fmt(itemActual(item))"></td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;font-weight:800;font-size:14px" :style="{ color: itemProfit(item) < 0 ? '#B91C1C' : '#15803D' }" x-text="(itemProfit(item) < 0 ? '−' : '') + fmt(Math.abs(itemProfit(item)))"></td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif" :style="{ color: itemProfit(item) < 0 ? '#B91C1C' : '' }" x-text="pctTxt(itemPct(item))"></td>
                </tr>
              </template>
              <template x-for="r in unassignedCostRows" :key="r.key">
                <tr class="stl-row--warn" :data-testid="'stl-pt-un-' + r.key">
                  <td x-text="r.label"></td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif">0</td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif" x-text="fmt(r.amount)"></td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;color:#B91C1C;font-weight:700" x-text="r.amount ? '−' + fmt(r.amount) : '0'"></td>
                  <td style="text-align:right">—</td>
                </tr>
              </template>
              <tr x-show="quoteAdjust !== 0" data-testid="stl-pt-adjust" style="color:var(--text-secondary)">
                <td>折扣／調整（報價收入與品項報價加總的差額）</td>
                <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif" x-text="(quoteAdjust < 0 ? '−' : '') + fmt(Math.abs(quoteAdjust))"></td>
                <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif">0</td>
                <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif" x-text="(quoteAdjust < 0 ? '−' : '') + fmt(Math.abs(quoteAdjust))"></td>
                <td style="text-align:right">—</td>
              </tr>
              <tr style="font-weight:800" data-testid="stl-pt-total">
                <td style="border-top:2px solid #111">合計</td>
                <td style="border-top:2px solid #111;text-align:right;font-family:LINE Seed TW_OTF, sans-serif" x-text="fmt(summary.quotedPretax)"></td>
                <td style="border-top:2px solid #111;text-align:right;font-family:LINE Seed TW_OTF, sans-serif" x-text="fmt(summary.totalActualCost)"></td>
                <td style="border-top:2px solid #111;text-align:right;font-family:LINE Seed TW_OTF, sans-serif" :style="{ color: summary.grossProfit < 0 ? '#B91C1C' : '#15803D' }" x-text="(summary.grossProfit < 0 ? '−' : '') + fmt(Math.abs(summary.grossProfit))"></td>
                <td style="border-top:2px solid #111;text-align:right;font-family:LINE Seed TW_OTF, sans-serif" x-text="summary.quotedPretax > 0 ? summary.grossMarginPct.toFixed(1) + '%' : '—'"></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div style="padding:10px 20px 14px;font-size:12px;display:grid;gap:3px" data-testid="stl-recon">
          <div>對帳①：Σ品項報價 <span x-text="fmt(sumItemQuote)"></span><span x-show="quoteAdjust !== 0" x-text="(quoteAdjust < 0 ? ' − ' : ' ＋ ') + '折扣／調整 ' + fmt(Math.abs(quoteAdjust))"></span> ＝ 報價收入 <span x-text="fmt(summary.quotedPretax)"></span>　差額 <b data-testid="stl-recon-quote-gap" :style="{ color: reconQuoteGap === 0 ? '#15803D' : '#B91C1C' }" x-text="fmt(reconQuoteGap)"></b></div>
          <div>對帳②：Σ品項實際成本 <span x-text="fmt(summary.itemActualTotal)"></span> ＋ 未對應項目 <span x-text="fmt(unassignedCostTotal)"></span> ＝ 總實際成本 <span x-text="fmt(summary.totalActualCost)"></span>　差額 <b data-testid="stl-recon-cost-gap" :style="{ color: reconCostGap === 0 ? '#15803D' : '#B91C1C' }" x-text="fmt(reconCostGap)"></b></div>
        </div>
      </div>

      <!-- ── 五、利潤分析明細 ── -->
      <div class="stl-card">
        <div class="stl-card__head">
          <div class="stl-card__title">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 8v8m-4-5v5m-4-2v2M3 20h18"/></svg>
            五、利潤分析
          </div>
        </div>
        <div class="stl-card__body">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
            <!-- 原始預估 -->
            <div>
              <div style="font-size:11px;font-weight:600;color:var(--text-secondary);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border-light)">原始報價預估</div>
              <table style="width:100%;font-size:12px">
                <tr>
                  <td style="padding:5px 0;color:var(--text-secondary)">報價稅前收入</td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif" x-text="'NT$ ' + fmt(summary.quotedPretax)"></td>
                </tr>
                <tr>
                  <td style="padding:5px 0;color:var(--text-secondary)">原始成本（料件）</td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif" x-text="'NT$ ' + fmt(summary.origTotalCost)"></td>
                </tr>
                <tr>
                  <td style="padding:5px 0;color:var(--text-secondary)">原始直接毛利</td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;font-weight:600"
                      :style="summary.origDirectProfit >= 0 ? 'color:#15803D' : 'color:#DC2626'"
                      x-text="'NT$ ' + fmt(summary.origDirectProfit)"></td>
                </tr>
                <tr>
                  <td style="padding:5px 0;color:var(--text-secondary)">原始毛利率</td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif"
                      x-text="summary.origMarginPct.toFixed(1) + '%'"></td>
                </tr>
                <tr style="border-top:1px solid var(--border-light)">
                  <td style="padding:5px 0;color:var(--text-secondary)">管銷分攤（10%）</td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;color:#DC2626" x-text="'− NT$ ' + fmt(summary.origAdminCost)"></td>
                </tr>
                <tr>
                  <td style="padding:5px 0;color:var(--text-secondary)">公益捐款（1%）</td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;color:#DC2626" x-text="'− NT$ ' + fmt(summary.origCharity)"></td>
                </tr>
                <tr style="border-top:1.5px solid var(--border-light)">
                  <td style="padding:5px 0;font-weight:700">原始預估淨利</td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;font-weight:700"
                      :style="summary.origNetProfit >= 0 ? 'color:#15803D' : 'color:#DC2626'"
                      x-text="'NT$ ' + fmt(summary.origNetProfit)"></td>
                </tr>
                <tr>
                  <td style="padding:5px 0;font-weight:600;color:var(--text-secondary)">原始預估淨利率</td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;font-weight:600"
                      :style="summary.origNetMarginPct >= 20 ? 'color:#15803D' : summary.origNetMarginPct >= 0 ? 'color:#B45309' : 'color:#DC2626'"
                      x-text="summary.origNetMarginPct.toFixed(1) + '%'"></td>
                </tr>
              </table>
            </div>
            <!-- 實際精算 -->
            <div>
              <div style="font-size:11px;font-weight:600;color:#92400E;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #FDE68A;background:transparent">實際成本精算</div>
              <table style="width:100%;font-size:12px">
                <tr>
                  <td style="padding:5px 0;color:var(--text-secondary)">報價稅前收入</td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif" x-text="'NT$ ' + fmt(summary.quotedPretax)"></td>
                </tr>
                <tr>
                  <td style="padding:5px 0;color:var(--text-secondary)">品項實際成本</td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;color:#92400E" x-text="'NT$ ' + fmt(summary.itemActualTotal)"></td>
                </tr>
                <tr x-show="summary.itemPoUnadopted > 0" data-testid="stl-po-unadopted">
                  <td style="padding:5px 0;color:var(--text-secondary)">採購單（品項尚未採用）</td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;color:#92400E" x-text="'NT$ ' + fmt(summary.itemPoUnadopted)"></td>
                </tr>
                <tr x-show="_actualsOk && notAdoptedPurchased > 0" data-testid="stl-purchase-not-adopted">
                  <td style="padding:5px 0;color:var(--text-secondary)">採購金額未採用（以手填取代，不另計）</td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;color:var(--text-dim)" x-text="'NT$ ' + fmt(notAdoptedPurchased)"></td>
                </tr>
                <tr>
                  <td style="padding:5px 0;color:var(--text-secondary)">額外支出<span x-show="matUnassigned > 0" data-testid="stl-mat-unassigned" style="font-size:11px" x-text="'（含未對應材料申請 ' + fmt(matUnassigned) + '）'"></span><span x-show="summary.remitFeeTotal" style="font-size:11px" x-text="'（含匯款手續費 ' + fmt(summary.remitFeeTotal) + '）'"></span><span x-show="summary.customExpenseTotal" data-testid="settle-custom-expense" style="font-size:11px" x-text="'（含自訂模組支出 ' + fmt(summary.customExpenseTotal) + '）'"></span></td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;color:#92400E" x-text="'NT$ ' + fmt(summary.extraTotal)"></td>
                </tr>
                <tr x-show="customIncomeSkipped.length" data-testid="settle-custom-income-skipped">
                  <td colspan="2" style="padding:2px 0;font-size:11px;color:var(--text-dim)" x-text="'自訂模組有 ' + customIncomeSkipped.length + ' 筆收入（' + customIncomeSkipped.map(i => i.recordNo).join('、') + '）關聯到本案件，因內建報價單已認列而未重複計入'"></td>
                </tr>
                <tr>
                  <td style="padding:5px 0;color:var(--text-secondary)">承攬商派發成本</td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;color:#92400E" x-text="'NT$ ' + fmt(summary.dispatchTotal)"></td>
                </tr>
                <tr style="border-top:1px solid #FDE68A">
                  <td style="padding:5px 0;font-weight:600">實際總成本</td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;font-weight:700;color:#92400E" x-text="'NT$ ' + fmt(summary.totalActualCost)"></td>
                </tr>
                <tr>
                  <td style="padding:5px 0;color:var(--text-secondary)">真實毛利</td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif"
                      :style="summary.grossProfit >= 0 ? 'color:#15803D' : 'color:#DC2626'"
                      x-text="'NT$ ' + fmt(summary.grossProfit)"></td>
                </tr>
                <tr>
                  <td style="padding:5px 0;color:var(--text-secondary)">真實毛利率</td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif"
                      x-text="summary.grossMarginPct.toFixed(1) + '%'"></td>
                </tr>
                <tr style="border-top:1px solid #FDE68A">
                  <td style="padding:5px 0;color:var(--text-secondary)">管銷分攤（10%）</td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;color:#DC2626" x-text="'− NT$ ' + fmt(summary.adminCost)"></td>
                </tr>
                <tr>
                  <td style="padding:5px 0;color:var(--text-secondary)">公益捐款（1%）</td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;color:#DC2626" x-text="'− NT$ ' + fmt(summary.charityDonation)"></td>
                </tr>
                <tr style="border-top:1.5px solid #FDE68A">
                  <td style="padding:5px 0;font-weight:700">真實淨利</td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;font-weight:700"
                      :style="summary.netProfit >= 0 ? 'color:#15803D' : 'color:#DC2626'"
                      x-text="'NT$ ' + fmt(summary.netProfit)"></td>
                </tr>
                <tr>
                  <td style="padding:5px 0;font-weight:600;color:var(--text-secondary)">真實淨利率</td>
                  <td style="text-align:right;font-family:LINE Seed TW_OTF, sans-serif;font-weight:700"
                      :style="summary.netMarginPct >= 20 ? 'color:#15803D' : summary.netMarginPct >= 0 ? 'color:#B45309' : 'color:#DC2626'"
                      x-text="summary.netMarginPct.toFixed(1) + '%'"></td>
                </tr>
              </table>
            </div>
          </div>

          <!-- 差異說明 -->
          <div x-show="summary.profitDiff !== 0"
               style="margin-top:16px;padding:12px 14px;border-radius:6px"
               :style="summary.profitDiff >= 0 ? 'background:#F0FDF4;border:1px solid #86EFAC' : 'background:#FFF1F2;border:1px solid #FECACA'">
            <span style="font-size:12px;font-weight:600"
                  :style="summary.profitDiff >= 0 ? 'color:#15803D' : 'color:#DC2626'"
                  x-text="summary.profitDiff >= 0
                    ? '真實淨利比原始預估高 NT$ ' + fmt(summary.profitDiff) + '（+' + ((summary.netMarginPct - summary.origNetMarginPct).toFixed(1)) + ' ppts）'
                    : '真實淨利比原始預估低 NT$ ' + fmt(Math.abs(summary.profitDiff)) + '（' + ((summary.netMarginPct - summary.origNetMarginPct).toFixed(1)) + ' ppts）'">
            </span>
          </div>
        </div>
      </div>

    </div>
  </template>
</div>

<!-- ── 完結確認 Modal ── -->
<div class="modal-overlay" x-show="showReopenModal" @click.self="showReopenModal=false" data-testid="stl-reopen-modal">
  <div class="modal-box">
    <div style="font-size:16px;font-weight:700;margin-bottom:8px">重新開啟已完結的精算？</div>
    <div style="font-size:12px;color:var(--text-secondary);margin-bottom:10px;line-height:1.7">
      重新開啟後可修改並重新完結；請填寫理由，會記錄在編輯歷程與稽核紀錄。
    </div>
    <textarea x-model="reopenReason" rows="3" maxlength="500" placeholder="重新開啟的理由（必填）" data-testid="stl-reopen-reason"
              style="width:100%;padding:6px 8px;border:1px solid var(--border-light);border-radius:6px;font-size:12px;font-family:inherit;box-sizing:border-box"></textarea>
    <div data-testid="stl-reopen-hint" style="font-size:11px;color:var(--text-dim);margin-top:4px">原因僅財務人員可見</div>
    <div x-show="reopenErr" x-text="reopenErr" data-testid="stl-reopen-error" style="color:#DC2626;font-size:12px;margin-top:6px"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
      <button class="btn btn-ghost btn-sm" @click="showReopenModal=false">取消</button>
      <button class="btn btn-sm" @click="reopenDraft()" :disabled="saving" data-testid="stl-reopen-confirm" style="color:#DC2626;border-color:#FECACA">確認重新開啟</button>
    </div>
  </div>
</div>

<div class="modal-overlay" x-show="showFinalizeModal" @click.self="showFinalizeModal=false">
  <div class="modal-box">
    <div style="font-size:16px;font-weight:700;margin-bottom:8px">確認完結精算？</div>
    <div style="font-size:12px;color:var(--text-secondary);margin-bottom:16px;line-height:1.7">
      完結後本精算將進入唯讀模式，所有數據將被鎖定。<br>
      若需修改，可點「重新開啟」解鎖。<br><br>
      <span style="font-weight:600;color:var(--text-primary)">精算摘要：</span><br>
      報價稅前收入：NT$ <span x-text="fmt(summary.quotedPretax)"></span><br>
      實際總成本：NT$ <span x-text="fmt(summary.totalActualCost)"></span><br>
      真實毛利：NT$ <span x-text="fmt(summary.grossProfit)"
                          :style="summary.grossProfit >= 0 ? 'color:#15803D;font-weight:600' : 'color:#DC2626;font-weight:600'"></span>
      （<span x-text="summary.grossMarginPct.toFixed(1) + '%'"></span>）<br>
      管銷（10%）+ 公益（1%）：NT$ <span x-text="fmt(summary.adminCost + summary.charityDonation)"></span><br>
      <b>真實淨利：NT$ <span x-text="fmt(summary.netProfit)"
                          :style="summary.netProfit >= 0 ? 'color:#15803D' : 'color:#DC2626'"></span>
      （<span x-text="summary.netMarginPct.toFixed(1) + '%'"
              :style="summary.netMarginPct >= 20 ? 'color:#15803D;font-weight:600' : 'color:#DC2626;font-weight:600'"></span>）</b>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-ghost btn-sm" @click="showFinalizeModal=false">取消</button>
      <button class="btn btn-success btn-sm" @click="finalize()" :disabled="saving">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        確認完結
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast-wrap">
  <template x-for="t in toasts" :key="t.id">
    <div class="toast" x-text="t.msg"></div>
  </template>
</div>

<script src="../static/file-preview.js"></script>

<script src="../static/notif.js"></script>
<script src="../static/sidebar.js"></script>
<script>
const API = '/api'
function settlementPage() {
  return {
    session: null,
    quoteNo: '',
    customerName: '',
    projectName:  '',
    loading: true,
    saving:  false,
    showFinalizeModal: false,
    showReopenModal: false,
    reopenReason: '',
    reopenErr: '',
    toasts: [],

    settlement: {
      status: 'draft',
      settlementDate: MotrixDate.today(),
      finalizedAt:  '',
      finalizedBy:  '',
      items:      [],
      extraItems: [],   // 搬移前的唯讀備份，僅供比對，不再用於計算或編輯
      memo: '',
    },
    // 額外支出（case_extra_expenses 表）總額與未核准金額，loadExtraExpenseTotals() 填
    xeTotal: 0,
    actuals: null,               // 33-B1：GET …/settlement-actuals（後端單一來源）；拿不到＝null ⇒ 退回舊路徑
    _actualsOk: false,
    itemActuals: {},             // {品項 id: actuals.items[]}
    offsets: [],                 // 沖銷對應 [{kind: material|extra, ref, itemId}]，隨精算存檔（settlement.offsets）
    itemPo: {},                  // 32-S5：{報價品項 id: 已認列的採購單連結金額}（來源 GET …/purchase-items 的 actualAmount；拿不到＝空）
    // W1：匯款手續費（公司自付、已匯款者）：額外支出請款的手續費＋承攬商匯款單的手續費；併入「額外支出」成本（十二格鍵名不動）
    remitFeeTotal: 0,
    customExpenseTotal: 0,        // 建構器（自訂模組）關聯到這個案件的入帳支出；loadCustomFinance() 填
    customIncomeSkipped: [],      // 關聯到這個案件的自訂模組收入（內建報價單已認列 ⇒ 不重複計入，只列出供對照）
    xePending: 0,
    xeMasked: 0,                 // 費用單據金額對本人遮蔽的列數（>0 ⇒ 額外支出總額不完整，不可存精算）

    dispatches: [],  // 承攬商派發（唯讀，即時從 /api/contractor-dispatches 讀取，不隨精算存檔凍結）
    _finalizing: false,   // 完結送出中：此刻狀態已是 finalized 但 _frozenSummary 還沒有——新完結一律是新口徑（未稅），不可誤判成舊口徑
    _frozenSummary: null,  // 精算完結當下寫入 data_json 的 summary 快照，供比對是否已過期

    summary: {
      quotedPretax:    0,
      quotedTotal:     0,
      origItemTotal:   0,
      origTotalCost:   0,
      origDirectProfit:0,
      origMarginPct:   0,
      itemActualTotal: 0,
      extraTotal:      0,
      dispatchTotal:   0,
      totalActualCost: 0,
      grossProfit:     0,
      grossMarginPct:  0,
      adminCost:       0,
      charityDonation: 0,
      netProfit:       0,
      netMarginPct:    0,
      profitDiff:      0,
      origAdminCost:   0,
      origCharity:     0,
      origNetProfit:   0,
      origNetMarginPct:0,
    },

    fmt(n) {
      return MotrixLegalRound.halfUp(n || 0).toLocaleString()
    },

    // 🔴 Alpine 3 看到資料物件有 init() 就會**自己叫一次**，
    //    而 body 上那個明著呼叫初始化的屬性會再叫一次 ⇒ **跑兩遍**。
    // ☠️ 後果不只是 API 發兩次：第二次的回應晚一步抵達，
    //    會把使用者這段期間改過的欄位用伺服器上的舊值**無聲蓋回去**。
    _initDone: false,

    async init() {
      if (this._initDone) return
      this._initDone = true
      const raw = localStorage.getItem('motrix_session')
      if (!raw) { location.href = 'login.html'; return }
      this.session = JSON.parse(raw)
      if (!this.session?.token) { location.href = 'login.html'; return }

      const params = new URLSearchParams(location.search)
      this.quoteNo = params.get('no') || ''
      try { this._dispatchNoteSeen = localStorage.getItem('stl_dispatch_basis_note_' + this.quoteNo) === '1' } catch (e) { /* 讀不到就當沒看過 */ }
      if (!this.quoteNo) {
        this.toast('未指定報價單號'); this.loading = false; return
      }

      try {
        const res = await fetch(`${API}/quotations/${this.quoteNo}/settlement`, {
          headers: { Authorization: 'Bearer ' + this.session.token }
        })
        if (res.status === 401) { location.href = 'login.html'; return }
        if (!res.ok) { this.toast('載入失敗'); this.loading = false; return }

        const d = await res.json()
        this.customerName = d.customerName || ''
        this.projectName  = d.projectName  || ''

        // 從報價單品項初始化精算 items
        const origItems = (d.items || []).map(it => ({
          id:              it.id,
          origDescription: it.description || '',
          origBrand:       it.brand       || '',
          origQty:         it.qty         || 0,
          origUnit:        it.unit        || '台',
          origUnitPrice:   it.unitPrice   || 0,
          origAmount:      it.amount      || 0,
          origCost:        it.cost        || 0,
          actualQty:       it.qty         || 0,
          actualUnitCost:  it.cost        || 0,
          // 預設帶入與報價單建立時相同的 5%「非扣抵進項稅」假設（quotation-form.html
          // calcTotals() 的 inputVat = totalCost×5%），確保未經使用者調整的精算品項
          // 預估/實際毛利率基準一致，「差異(pp)」欄反映的才是真實成本表現而非公式落差
          actualCostTaxMode: 'taxed_gross',
          actualTotalCost: MotrixLegalRound.halfUp((it.qty || 0) * (it.cost || 0), 1.05),
          note:            '',
          actualSource:    'manual',    // 手填來源標籤（顯示用）
          adoptSystem:     false,       // 32-S5：true＝此品項的實際成本採用「採購單連結金額」（跟著採購單變動，完結後凍結）
        }))

        if (d.settlement) {
          // 已有精算資料：合併（保留實際成本欄；原始報價欄以最新報價為準）
          const saved = d.settlement
          this.settlement.status        = saved.status || 'draft'
          this.settlement.settlementDate= saved.settlementDate || MotrixDate.today()
          this.settlement.finalizedAt   = saved.finalizedAt || ''
          this.settlement.finalizedBy   = saved.finalizedBy || ''
          this.settlement.memo          = saved.memo || ''
          this.settlement.extraItems    = saved.extraItems || []
          this._frozenSummary           = saved.summary || null
          this.offsets                  = Array.isArray(saved.offsets) ? saved.offsets.map(o => ({ kind: o.kind, ref: String(o.ref), itemId: String(o.itemId) })) : []

          // 合併報價品項（若報價單有新增/刪除品項，以報價單為基準）
          const savedMap = {}
          ;(saved.items || []).forEach(si => { savedMap[si.id] = si })

          this.settlement.items = origItems.map(oi => {
            const si = savedMap[oi.id]
            if (si) {
              return {
                ...oi,
                actualQty:      si.actualQty      !== undefined ? si.actualQty      : oi.actualQty,
                actualUnitCost: si.actualUnitCost !== undefined ? si.actualUnitCost : oi.actualUnitCost,
                actualCostTaxMode: si.actualCostTaxMode || oi.actualCostTaxMode,
                actualTotalCost:si.actualTotalCost|| oi.actualTotalCost,
                actualSource:   ['legacy', 'labor'].includes(si.actualSource) ? si.actualSource : 'manual',      // 純標籤（手填／歷史未建系統／人力）：不進任何合計；缺鍵＝手填
                adoptSystem:    !!si.adoptSystem,       // 舊存檔缺鍵＝今天的行為（不採用）；後端 settlement_actuals 同一規則
                _fromSave:      true,
                note:           si.note || '',
              }
            }
            return oi
          })
        } else {
          this.settlement.items = origItems
        }

        // 記錄原始 tot 資料用於比較
        this._origTot = d.tot || {}
        await this.loadDispatches()
        await this.loadExtraExpenseTotals()   // 成本彙總要用到，必須在 calcSummary 之前（含 32-S5 的 itemPo）
        this.applyAdoptDefaults()
        if (this.settlement.status !== 'finalized') this.settlement.items.forEach(i => { if (i.adoptSystem && this.systemActual(i) > 0) this.calcItemCost(i) })   // 採用採購金額的品項跟著最新值（沒有採購的不動，歷史案件逐位不變）
        await this.loadVoucherRemitFees()     // W1：承攬商匯款手續費併入額外支出成本
        await this.loadCustomFinance()        // 建構器：自訂模組支出併入額外支出成本
        this.applyFrozen()
        this.calcSummary()
      } catch(e) {
        this.toast('載入失敗：' + e.message)
      } finally {
        this.loading = false
      }
    },

    // 額外支出總額（含送審中）與其中尚未核准的金額，來源是 case_extra_expenses 表。
    // 這一頁只讀不寫——編輯入口已移到案件管理的「額外支出」分頁。
    async loadItemPo() {
      this.itemPo = {}
      this._itemPoOk = false
      try {
        const r = await fetch(`/api/quotations/${encodeURIComponent(this.quoteNo)}/purchase-items`, {
          headers: { Authorization: 'Bearer ' + this.session.token }
        })
        if (!r.ok) return
        const items = (await r.json()).items || []
        if (items.some(i => i.actualAmount === undefined)) return      // 看不到金額 ⇒ 不用（維持舊算法）
        items.forEach(i => { if (i.actualAmount > 0) this.itemPo[i.itemId] = i.actualAmount })
        this._itemPoOk = true
      } catch {}
    },

    // 33-B1：後端單一來源。品項「採購」＝採購單連結金額＋材料申請（連品項或沖銷對應）＋沖銷的額外支出；拿不到（403／失敗）⇒ 退回舊路徑（purchase-items）
    async loadActuals() {
      this.actuals = null
      this._actualsOk = false
      this.itemActuals = {}
      try {
        // 預覽用 POST：沖銷對應放請求本文（上百筆時 GET 網址會過長）
        const r = await fetch(`/api/quotations/${encodeURIComponent(this.quoteNo)}/settlement-actuals/preview`, {
          method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + this.session.token },
          body: JSON.stringify({ offsets: this.offsets })
        })
        if (!r.ok) return
        const d = await r.json()
        if (!d || !Array.isArray(d.items) || !d.totals) return
        d.items.forEach(i => { this.itemActuals[i.itemId] = i })
        this.actuals = d
        this._actualsOk = true
      } catch {}
    },

    systemActual(item) {
      if (this._actualsOk) { const a = this.itemActuals[item.id]; return (a && a.purchased) || 0 }
      return (this.itemPo && this.itemPo[item.id]) || 0
    },

    purchaseLabel(item) {
      if (!this._actualsOk) return '採購單 NT$ ' + this.fmt(this.systemActual(item))
      const a = this.itemActuals[item.id] || {}
      const parts = []
      if (a.po && a.po.amount) parts.push('採購單 NT$ ' + this.fmt(a.po.amount))
      if (a.material && a.material.amount) parts.push('材料申請 NT$ ' + this.fmt(a.material.amount))
      if (a.extra && a.extra.amount) parts.push('額外支出 NT$ ' + this.fmt(a.extra.amount))
      if (a.dispatch && a.dispatch.amount) parts.push('承攬商派發 NT$ ' + this.fmt(a.dispatch.amount))
      return parts.join('＋') + (item.adoptSystem ? '' : '（未採用）')
    },

    // 沒存過的品項預設採用（規則 A：有實際採購就取代估計）；已存草稿以存的為準（缺鍵＝不採用）。退回舊路徑時維持舊預設（不採用）
    applyAdoptDefaults() {
      if (this.settlement.status === 'finalized') return
      this.settlement.items.forEach(i => { if (!i._fromSave) i.adoptSystem = this._actualsOk })
    },

    // 已完結：額外支出／手續費／自訂模組支出取完結當下凍結的 summary，不隨之後的單據漂移（規格 §5.6；派發另有過期提醒）
    applyFrozen() {
      const fs = this._frozenSummary
      if (this.settlement.status !== 'finalized' || !fs || typeof fs.extraTotal !== 'number') return
      this.remitFeeTotal = fs.remitFeeTotal || 0
      this.customExpenseTotal = fs.customExpenseTotal || 0
      this.xeTotal = fs.extraTotal - this.remitFeeTotal - this.customExpenseTotal
    },

    get notAdoptedPurchased() {
      return this.settlement.items.reduce((s, i) => s + (i.adoptSystem ? 0 : this.systemActual(i)), 0)
    },
    get matUnassigned() { return (this._actualsOk && this.actuals.totals.materialUnassignedTotal) || 0 },

    // 未對應清單的列名稱：單據＋品名（材料另帶數量單位；額外支出帶說明），讓使用者分得出每一列
    matLabel(m) {
      const qty = m.quantity ? '（' + m.quantity + ' ' + (m.unit || '') + '）' : ''
      return (m.name || String(m.itemId)) + qty
    },
    // 承攬商派發（第 36 班契約）：金額＝未稅承攬費＋外包人員；稅額只顯示不計成本。docCode 可能是空字串，退回以派發 id 辨認
    // 每個品項的賺賠（毛利；報價＝報價單品項金額 origAmount，未稅；實際成本與 calcSummary 的 itemActualTotal 同一規則：手填 0／空＝用估計）
    pctTxt(v) { return v == null ? '—' : (Math.round(v * 10) / 10).toFixed(1) + '%' },
    itemQuote(i) { return +i.origAmount || 0 },
    itemActual(i) { return i.actualTotalCost || this.estimateOf(i) },
    itemProfit(i) { return this.itemQuote(i) - this.itemActual(i) },
    itemPct(i) { const q = this.itemQuote(i); return q > 0 ? this.itemProfit(i) / q * 100 : null },
    itemUnitProfit(i) { const q = +i.origQty || 0; return q > 0 ? (+i.origUnitPrice || 0) - this.itemActual(i) / q : null },
    get sumItemQuote() { return this.settlement.items.reduce((s, i) => s + this.itemQuote(i), 0) },
    get quoteAdjust() { return this.summary.quotedPretax - this.sumItemQuote },          // 折扣／調整：不吞掉，單獨一列
    get reconQuoteGap() { return this.sumItemQuote + this.quoteAdjust - this.summary.quotedPretax },
    // 未對應項目＝品項實際成本以外、仍計入總成本的錢：額外支出（含未對應材料申請）、匯款手續費、自訂模組支出、派發（未被品項吸收的部分）、採購單（舊路徑）
    get unassignedCostRows() {
      const sm = this.summary
      const rows = [
        { key: 'extra', label: '未對應項目：額外支出（含未對應材料申請）', amount: this.xeTotal },
        { key: 'remit', label: '未對應項目：匯款手續費', amount: this.remitFeeTotal },
        { key: 'custom', label: '未對應項目：自訂模組支出', amount: this.customExpenseTotal },
        { key: 'dispatch', label: '未對應項目：承攬商派發（未被品項吸收）', amount: sm.dispatchTotal - sm.dispatchAbsorbed },
        { key: 'po', label: '未對應項目：採購單（品項尚未採用）', amount: sm.itemPoUnadopted },
      ]
      return rows.filter(r => r.key === 'extra' || r.key === 'dispatch' || r.amount)
    },
    get unassignedCostTotal() { return this.unassignedCostRows.reduce((s, r) => s + r.amount, 0) },
    get reconCostGap() { return this.summary.itemActualTotal + this.unassignedCostTotal - this.summary.totalActualCost },
    // 每個品項的實際成本來源（顯示用，不存檔）：採用且有採購／對應 ⇒ 取代；否則有手填 ⇒ 手填；否則 ⇒ 估計（優先序＝規則 A）
    itemSource(item) {
      if (item.adoptSystem && this.systemActual(item) > 0) {
        const a = (this._actualsOk && this.itemActuals[item.id]) || {}
        const po = !!(a.po && a.po.amount), map = !!((a.material && a.material.amount) || (a.extra && a.extra.amount) || (a.dispatch && a.dispatch.amount))
        return po && map ? { key: 'po-map', label: '採購單＋已對應' } : po ? { key: 'po', label: '採購單' } : { key: 'map', label: '已對應' }
      }
      // 手填欄預設帶入估計值：數字與估計相同＝沒動過（來源＝估計）；改過、或標了「歷史未建系統／人力」才算手填
      const tagged = item.actualSource === 'legacy' || item.actualSource === 'labor'
      if ((+item.actualTotalCost || 0) > 0 && (tagged || +item.actualTotalCost !== this.estimateOf(item))) return { key: 'manual', label: item.actualSource === 'legacy' ? '手填・歷史未建系統' : item.actualSource === 'labor' ? '手填・人力' : '手填' }
      return { key: 'est', label: '估計' }
    },
    dispLabel(d) { return (d.docCode || '派發#' + d.itemId) + '｜' + (d.vendorName || '（未命名承攬商）') },
    dispDetail(d) { return d.name && d.name !== 'amount' ? d.name : '' },
    kindLabel(k) { return k === 'material' ? '材料申請' : k === 'dispatch' ? '承攬商派發' : '額外支出' },
    // 已被品項吸收的派發金額：採用且該品項有金額時，派發已在品項實際成本裡，不能再於承攬商派發成本重複加（規則 A，與後端同一條）。
    // 總成本 ＝ 品項實際 ＋ 額外 ＋ 派發 − 被吸收；不用 dispatchTotal 直接加（完結時後端重算比對，重複計入會 409）
    get dispatchAbsorbed() {
      if (!this._actualsOk) return 0
      return this.settlement.items.reduce((sum, i) => {
        const a = this.itemActuals[i.id]
        return sum + (a && a.dispatch && i.adoptSystem && this.systemActual(i) > 0 ? (a.dispatch.amount || 0) : 0)
      }, 0)
    },
    get mapSummary() {
      const rows = this.allMapRows()
      const sum = a => a.reduce((x, r) => x + (+r.amount || 0), 0)
      const un = rows.filter(r => !r.itemId), as = rows.filter(r => r.itemId)
      return { unCount: un.length, unTotal: sum(un), asTotal: sum(as), all: sum(rows), unPending: un.some(r => r.pending),
               byKind: ['dispatch', 'material', 'extra'].map(k => ({ kind: k, un: sum(un.filter(r => r.kind === k)), as: sum(as.filter(r => r.kind === k)) })) }
    },
    extLabel(e) {
      return (e.docCode || '#' + e.expenseId) + '｜' + (e.category || '') + (e.description ? '｜' + e.description : '')
    },

    // 二之一的列模型（35c）：未對應＋已對應（沖銷對應到品項的、材料申請連結到品項的）。已對應的目標品項取自後端回應（itemId 一律字串），
    // 不取頁面的 offsets 狀態——兩邊不一致時以伺服器算出來的為準，畫面才不會把「已計入品項」的錢顯示成「不對應」。
    allMapRows() {
      if (!this._actualsOk) return []
      const rows = []
      const add = (kind, ref, label, detail, amount, pending, noPo, itemId, assignedBy, extra) =>
        rows.push(Object.assign({ kind, ref: String(ref), label, detail, amount, pending, noPo, itemId: itemId === '' ? '' : String(itemId), assignedBy }, extra || {}))
      const dsp = (d, itemId, assignedBy) => add('dispatch', d.itemId, this.dispLabel(d), this.dispDetail(d), d.amount, d.pending, false, itemId, assignedBy, { tax: d.tax || 0, status: d.status || '' })
      this.actuals.unassigned.materials.forEach(m => add('material', m.itemId, this.matLabel(m), this.matDetail(m), m.amount, m.pending, m.noPo, '', ''))
      this.actuals.unassigned.extras.forEach(e => add('extra', e.expenseId, this.extLabel(e), this.extDetail(e), e.amount, e.pending, false, '', ''))
      ;((this.actuals.unassigned || {}).dispatches || []).forEach(d => dsp(d, '', ''))
      this.actuals.items.forEach(it => {
        ;((it.dispatch || {}).orders || []).forEach(d => dsp(d, it.itemId, d.assignedBy || 'offset'))
        ;(it.material.orders || []).filter(m => m.assignedBy === 'offset' || m.assignedBy === 'link')
          .forEach(m => add('material', m.itemId, this.matLabel(m), this.matDetail(m), m.amount, m.pending, m.noPo, it.itemId, m.assignedBy))
        ;(it.extra.docs || []).forEach(e => add('extra', e.expenseId, this.extLabel(e), this.extDetail(e), e.amount, e.pending, false, it.itemId, 'offset'))
      })
      return rows
    },
    unmappedRows() { return this.allMapRows().filter(r => !r.itemId) },
    mappedRows() { return this.allMapRows().filter(r => r.itemId) },
    unassignedRows() { return this.unmappedRows() },     // 舊名稱（相容）
    offsetTargets() { return this.settlement.items.filter(i => !String(i.id || '').startsWith('~') && i.id) },
    _itemOf(id) { return this.settlement.items.find(i => String(i.id) === String(id)) },
    itemNo(id) { const i = this.settlement.items.findIndex(x => String(x.id) === String(id)); return i < 0 ? '?' : i + 1 },
    itemName(id) { const it = this._itemOf(id); return it ? (it.origDescription || String(id)) : String(id) },
    itemAdopted(id) { const it = this._itemOf(id); return !!(it && it.adoptSystem) },
    // 說明列（品名之外的規格／說明）：材料申請＝備註；額外支出＝附註＋數量單位。沒有資料就不顯示（不編造規格）
    matDetail(m) { return m.notes ? '備註：' + m.notes : '' },
    extDetail(e) {
      const parts = []
      if (e.note) parts.push('附註：' + e.note)
      if (e.qty && Number(e.qty) !== 1) parts.push('數量 ' + e.qty + (e.unit ? ' ' + e.unit : ''))      // 預設 1 式是每筆都有的雜訊，不顯示
      return parts.join('　')
    },

    async setOffset(kind, ref, itemId) {
      if (this.settlement.status === 'finalized') return
      this.offsets = this.offsets.filter(o => !(o.kind === kind && o.ref === String(ref)))
      if (itemId) this.offsets.push({ kind, ref: String(ref), itemId: String(itemId) })
      await this.loadActuals()
      this.applyXeTotal()
      this.settlement.items.forEach(i => { if (i.adoptSystem && (this.systemActual(i) > 0 || i._fromSystem)) this.calcItemCost(i) })     // 沖銷搬走了採購 ⇒ 原本取自系統的品項回到手填值
      this.calcSummary()
    },

    applyXeTotal() {
      if (!this._actualsOk) return
      this.xeTotal = (this.actuals.totals.extraTotal || 0) + (this.actuals.totals.materialUnassignedTotal || 0)
      // 34：匯款手續費（額外支出＋承攬商）、自訂模組支出也取後端單一來源（口徑與原本逐位相同）；拿不到端點時維持原本各打一支的舊路徑
      const ce = this.actuals.costExtras
      if (ce) { this.remitFeeTotal = ce.remitFee.total || 0; this.customExpenseTotal = ce.customExpense.total || 0 }
    },

    toggleAdopt(item) {
      item.adoptSystem = !item.adoptSystem
      if (item.adoptSystem || this._actualsOk) this.calcItemCost(item)      // 33-B1：取消採用＝回到手填欄位算的金額（採購金額不另加，D8）；退回舊路徑時維持 32-S5（值不動）
      this.calcSummary()
    },

    async loadExtraExpenseTotals() {
      if (!this.quoteNo) return
      try {
        const r = await fetch(`/api/quotations/${encodeURIComponent(this.quoteNo)}/extra-expenses`, {
          headers: { Authorization: 'Bearer ' + this.session.token }
        })
        if (r.ok) {
          const d = await r.json()
          // 32-S5：連到案件品項的採購單列＝品項實際成本（不再算額外支出）。只有**確定拿得到品項系統金額**時才改讀 extraOnlyAmount，
          // 否則（沒有財務檢視、端點失敗）維持 totalAmount（含連結列），不讓錢憑空消失。沒有連結列的案件兩者相等＝金額與以前逐位相同。
          await this.loadActuals()
          if (!this._actualsOk) await this.loadItemPo()
          this.xeTotal = (this._itemPoOk && d.extraOnlyAmount !== undefined) ? (d.extraOnlyAmount || 0) : (d.totalAmount || 0)
          this.remitFeeTotal = d.remitFeeTotal || 0
