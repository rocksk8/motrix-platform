<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>系統設定乙份 mockup r2</title>
<style>
:root{--bg:#f4f2ee;--card:#fff;--ink:#1d1d1f;--mute:#6b6b72;--line:#dedbd4;--soft:#faf9f6;--red:#c8102e;--redbg:#fdecef;--ok:#157347;--okbg:#e6f4ec;--warn:#9a5b00;--warnbg:#fff4de;--blue:#1b4f9c;--bluebg:#e9f0fb;--sw-off:#c9c7c0;--diff:#e08a00;--drf:#fff3c4}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#18181a;--card:#242428;--ink:#f0f0f2;--mute:#a0a0a8;--line:#3a3a40;--soft:#1f1f23;--redbg:#3a1a20;--okbg:#17301f;--warnbg:#3a2c10;--bluebg:#16253d;--sw-off:#55555c;--red:#ff6b7f;--ok:#5ccf93;--warn:#f0b04a;--blue:#7fb0ff;--drf:#4a3f12}}
:root[data-theme=dark]{--bg:#18181a;--card:#242428;--ink:#f0f0f2;--mute:#a0a0a8;--line:#3a3a40;--soft:#1f1f23;--redbg:#3a1a20;--okbg:#17301f;--warnbg:#3a2c10;--bluebg:#16253d;--sw-off:#55555c;--red:#ff6b7f;--ok:#5ccf93;--warn:#f0b04a;--blue:#7fb0ff;--drf:#4a3f12}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
.wrap{max-width:1220px;margin:0 auto;padding:12px 16px 90px}
h1{font-size:20px;margin:0 0 2px}h2{font-size:17px;margin:0 0 4px}h3{font-size:15px;margin:0}
.mute{color:var(--mute)}.small{font-size:12.5px}
button{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:13.5px;min-height:32px}
.btn:hover{border-color:var(--mute)}.btn.pri{background:var(--ink);color:var(--card);border-color:var(--ink)}.btn.dng{background:var(--red);color:#fff;border-color:var(--red)}.btn[disabled]{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 14px;cursor:pointer;font-size:14px}.tab.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.demo{background:var(--warnbg);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;margin:8px 0}
.top{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;position:relative;flex-wrap:wrap}
.top b{font-size:15px;margin-right:4px}.top input{flex:1;min-width:180px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:14px}
.badge{display:inline-block;min-width:18px;text-align:center;background:var(--warnbg);color:var(--warn);border-radius:9px;font-size:12px;padding:0 6px;margin-left:4px}
#sres{position:absolute;left:96px;right:10px;top:46px;background:var(--card);border:1px solid var(--line);border-radius:10px;z-index:15;display:none;max-height:300px;overflow:auto}
#sres button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 12px;cursor:pointer;border-bottom:1px solid var(--line)}#sres button:hover{background:var(--soft)}
#savebar{display:none;position:sticky;top:0;z-index:12;background:var(--drf);border:1px solid var(--line);border-radius:10px;padding:7px 14px;margin:8px 0;align-items:center;gap:10px}
#savebar.show{display:flex}#savebar .sp{flex:1}
.seg{display:flex;gap:0;margin:0 0 8px;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{flex:1;border:0;background:var(--card);padding:5px 4px;cursor:pointer;font-size:13px}.seg button.on{background:var(--ink);color:var(--card)}
.layout{display:grid;grid-template-columns:270px 1fr;gap:14px;align-items:start;margin-top:8px}
.side{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;position:sticky;top:60px}
.side h4{margin:8px 8px 2px;font-size:12px;color:var(--mute);font-weight:600;letter-spacing:.04em}
.side .nv{display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:14px}
.side .nv:hover{background:var(--soft)}.side .nv.on{background:var(--bluebg);color:var(--blue);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:10px 0}
.card.head{display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.tag{display:inline-block;font-size:11.5px;padding:0 7px;border-radius:9px;margin-left:4px;white-space:nowrap;vertical-align:1px}
.t-ok{background:var(--okbg);color:var(--ok)}.t-warn{background:var(--warnbg);color:var(--warn)}.t-bad{background:var(--redbg);color:var(--red)}.t-blue{background:var(--bluebg);color:var(--blue)}.t-gray{background:var(--soft);color:var(--mute);border:1px solid var(--line)}.t-diff{background:var(--warnbg);color:var(--diff)}.t-draft{background:var(--drf);color:var(--ink);border:1px solid var(--diff)}
code,.code{font:12px ui-monospace,Consolas,monospace;color:var(--mute)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.bar input[type=search]{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:14px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;cursor:pointer;font-size:13px}.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.mx{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden;margin:10px 0}
.mx .gh{display:flex;align-items:center;gap:10px;background:var(--soft);padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}.mx .gh .sp{flex:1}
.mx .hd,.mx .rw{display:grid;grid-template-columns:var(--cols);gap:8px;align-items:center;padding:8px 12px}
.mx .hd{font-size:12px;color:var(--mute);border-bottom:1px solid var(--line);background:var(--soft)}
.mx .rw{border-top:1px solid var(--line);border-left:3px solid transparent}.mx .rw.dif{border-left-color:var(--diff)}.mx .rw.dr,.form.dr{border-left-color:#d4a000;background:var(--drf)}.mx .rw.sel{background:var(--bluebg)}
.mx .help{grid-column:1/-1}
.helpbox{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--ink)}.helpbox dt{font-weight:600;margin-top:6px}.helpbox dt:first-child{margin-top:0}.helpbox dd{margin:0}
.dep{grid-column:1/-1;font-size:12.5px;color:var(--warn);background:var(--warnbg);border-radius:8px;padding:3px 10px}
.pendrow{grid-column:1/-1;font-size:12.5px;color:var(--blue);background:var(--bluebg);border-radius:8px;padding:3px 10px}
.sw{position:relative;display:inline-block;width:42px;height:24px;vertical-align:middle}.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:var(--sw-off);border-radius:12px;transition:.15s;cursor:pointer}.sw i:before{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.15s}
.sw input:checked+i{background:var(--ok)}.sw input:checked+i:before{left:21px}.sw input:focus-visible+i{outline:2px solid var(--blue);outline-offset:2px}
.q{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;line-height:1}
.lock{font-size:12px;color:var(--mute);cursor:help}
input[type=checkbox]:disabled{opacity:.35}
input.txt,input.num,textarea{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 9px;font:inherit;font-size:14px}input.num{width:92px}
.form{background:var(--card);border:1px solid var(--line);border-left:3px solid transparent;border-radius:10px;padding:12px 16px;margin:10px 0}.form.dif{border-left-color:var(--diff)}
.form .nm{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.form .meta{font-size:12.5px;color:var(--mute);margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.opts{display:grid;gap:6px;margin:8px 0}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:7px 10px;cursor:pointer;background:var(--card)}.opt.on{border-color:var(--blue);background:var(--bluebg)}.opt.lz{border-style:dashed}.opt input{margin-top:5px}.opt .h{font-size:13px;color:var(--mute)}
.banner{border-radius:10px;padding:8px 12px;margin:8px 0;font-size:13.5px}.banner.red{background:var(--redbg);color:var(--red);border:1px solid var(--red)}.banner.yel{background:var(--warnbg);color:var(--warn);border:1px solid var(--line)}.banner.blue{background:var(--bluebg);color:var(--blue);border:1px solid var(--line)}
.prev{background:var(--soft);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;font-size:13.5px;margin:8px 0}.prev .big{font-size:19px;font-weight:700}
.batch{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--card);padding:10px 16px;display:none;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;z-index:20}
.batch.show{display:flex}.batch .btn{background:transparent;color:var(--card);border-color:#888;min-height:40px}
.batch .menu{position:relative;display:inline-block}.batch .menu .pop{position:absolute;bottom:46px;left:0;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:300px;display:none}
.batch .menu.open .pop{display:block}.pop button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:6px 8px;border-radius:7px;cursor:pointer}.pop button:hover{background:var(--soft)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:30;padding:12px}.mask.show{display:flex}
.modal{background:var(--card);border-radius:12px;max-width:620px;width:100%;padding:16px 18px;max-height:90vh;overflow:auto}.modal h3{font-size:17px;margin-bottom:6px}.modal ul{margin:6px 0 6px 18px;padding:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:var(--ink);color:var(--card);border-radius:10px;padding:8px 14px;display:none;z-index:40;gap:12px;align-items:center;max-width:94vw;flex-wrap:wrap}
.toast.show{display:flex}.toast button{background:none;border:1px solid #999;color:var(--card);border-radius:7px;padding:2px 10px;cursor:pointer}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}table.t th,table.t td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}table.t th{background:var(--soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wf{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px 12px;font-size:13.5px}.wf .bx{border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:6px 0;background:var(--soft)}
.hours{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:6px 0}.hours button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:3px 0;cursor:pointer;font-size:12.5px}.hours button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.lst{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.lst .it{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 12px;background:var(--soft);font-size:13.5px}.lst .it button{border:0;background:none;cursor:pointer;color:var(--mute);padding:0 6px}
.hidden{display:none!important}
@media (max-width:900px){
 .layout{grid-template-columns:1fr}.side{position:static;display:flex;flex-wrap:wrap;gap:2px}.side h4,.side .seg{width:100%}.side .nv{width:auto}
 .two{grid-template-columns:1fr}.mx .hd{display:none}.mx .rw{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}.mx .rw .nm{flex:1 1 calc(100% - 40px)}.hours{grid-template-columns:repeat(6,1fr)}#sres{left:10px}
}
</style>
</head>
<body>
<div class="wrap">
<h1>系統設定：系統、安全、畫面與自訂（乙份）r2</h1>
<div class="demo">設計 mockup（示意資料）：欄位、選項、預設值、風險、「放寬須第二位核准」取自 <code>settings_registry</code> 真實登錄（107 欄）；另含設定中心以外的 4 項（放在左側「其他位置的設定」）。目前值、人數、申請單都是假的，重新整理就還原。<b>點選只算草稿，要按上方「儲存」才寫入</b>（SPEC §13）。 <button class="btn" id="themeBtn" style="float:right;padding:1px 8px;min-height:0">深色</button></div>
<nav class="tabs" id="topTabs">
 <button class="tab on" data-top="center">設定中心（乙份頁面）</button>
 <button class="tab" data-top="pages">獨立頁 6 張</button>
 <button class="tab" data-top="compare">現況對照</button>
</nav>
<section id="center">
 <div class="top"><b>設定中心</b><input type="search" id="gq" placeholder="搜尋設定：名稱、說明、選項…" aria-label="搜尋設定"><button class="btn" data-go="pend">待生效 <span class="badge" id="nPend">0</span></button><button class="btn" data-go="recent">最近變更</button><div id="sres"></div></div>
 <div id="savebar"><span>✎ 你有 <b id="nDraft">0</b> 項未儲存的修改</span><span class="sp"></span><button class="btn" id="discard">放棄</button><button class="btn pri" id="saveBtn">儲存</button></div>
 <div class="layout"><aside class="side" id="side"></aside><main id="main"></main></div>
</section>
<section id="pages" class="hidden"></section>
<section id="compare" class="hidden"></section>
</div>
<div class="batch" id="batch" role="region" aria-label="批次動作"></div>
<div class="mask" id="mask"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" aria-live="polite"></div>

<script>
const DATA=[{"g":"account_security","gl":"登入與密碼","k":"password_min_len","n":"密碼至少要幾碼","s":"新設或更改密碼時，長度至少要這麼多碼；系統底線是 8 碼，這裡只能調得更嚴。預設 8 碼。","o":"數字越大，密碼越難被猜中，但同仁越容易忘記；已經設好的密碼不受影響，也不會有人被要求改密碼。","c":"顯示「目前：{值}」與來源（公司／預設）；和預設不同時標「與預設不同」並附「重設為預設」","d":"影響別人｜影響大｜放寬（調低）後果：之後新設的密碼可以比現在短，被別人猜中的機會變大；調低須第二位最高管理者核准，並要等 N 天才生效，調高立即生效。","st":"單項表單","nt":"安全類，不進批次。新分類：人員與權限／登入安全。與「登入有效天數」「外網登入防護」同卡呈現。｜建議 when（SettingDef.when）：公司資安規範要求更長的密碼、或要縮短登入有效期時。","q":"密碼最少要幾碼？（最少 8 碼，只能往上調）","hp":"新設或更改密碼時，長度至少要這麼多碼。系統規定最少 8 碼，這裡只能調得更嚴。","im":"只影響之後「新設或更改密碼」的長度檢查：已經設好的密碼不受影響，也不會有人被要求改密碼，登入照舊。系統只存密碼的雜湊，無法得知現有密碼多長，所以看不到有多少人低於新的長度。調高立即生效，調回較低的數字須另一位最高管理者核准，並要等 N 天才生效。","rk":"調低會讓新設的密碼比較容易被猜到；系統規定最少 8 碼，不能再低。","bat":"否（永不進批次）","ck":false,"ckwhy":"否（永不進批次）","wh":"公司資安規範要求更長的密碼、或要縮短登入有效期時。","t":"int","def":8,"rec":8,"u":"碼","min":8,"max":64,"risk":"security","loosen":"down","pend":false,"adv":false,"ch":[]},{"g":"account_security","gl":"登入與密碼","k":"login_days","n":"登入後多久要重新登入","s":"登入之後超過這個天數，就要重新輸入帳號密碼。預設最長 30 天，這裡只能縮短。","o":"天數越短越安全、越常要重新登入；天數越長越方便，但電腦遺失或被人借用時，別人能用你的帳號的時間也越長。","c":"顯示「目前：{值}」與來源（公司／預設）；和預設不同時標「與預設不同」並附「重設為預設」","d":"影響別人｜影響大｜放寬（調長）後果：登入狀態撐得更久，電腦被借用、遺失時帳號被冒用的時間更長；調長須第二位最高管理者核准，並要等 N 天才生效，縮短立即生效。","st":"單項表單","nt":"安全類，不進批次。只影響之後新登入的人，已登入者維持原期限。｜建議 when（SettingDef.when）：公司資安規範要求更長的密碼、或要縮短登入有效期時。","q":"登入後最久可以不重新登入幾天？（最多 30 天，只能往下調）","hp":"登入之後，超過這個天數就要重新輸入帳號密碼。系統規定最長 30 天，這裡只能縮短。","im":"只影響之後新登入的人，已經登入的人維持原來的期限；縮短立即生效，調回較長的天數須另一位最高管理者核准，並要等 N 天才生效。","rk":"登入有效期越長，電腦被他人使用或遺失時帳號被冒用的時間越長；系統規定最長 30 天。","bat":"否（永不進批次）","ck":false,"ckwhy":"否（永不進批次）","wh":"公司資安規範要求更長的密碼、或要縮短登入有效期時。","t":"int","def":30,"rec":30,"u":"天","min":1,"max":30,"risk":"security","loosen":"up","pend":false,"adv":false,"ch":[]},{"g":"brand","gl":"系統標語","k":"tagline","n":"首頁小標語","s":"顯示在首頁大標題上方的小字，可改成公司自己的系統名稱或口號（1～24 個字）。預設「MOTRIX PLATFORM」。","o":"不用選擇，直接輸入 1～24 個字；改完馬上生效，想回到預設可按「重設為預設」。","c":"顯示「目前：{值}」與來源（公司／預設）；和預設不同時標「與預設不同」並附「重設為預設」","d":"影響別人","st":"單項表單","nt":"旁邊放即時預覽（首頁標題上方的小字）。與 login_greeting 同卡「首頁外觀」。risk= 報價單不會出現自訂欄位｜印在報價單上：客戶會看到欄位名稱與內容。已寄出的文件不會改。","c":"顯示「目前：已開放／未開放」與來源（公司／預設）；未開放＝與預設相同，不標「與預設不同」","d":"影響大（客戶看得到）｜放寬（開放印出）後果：自訂欄位的名稱與內容會印在客戶拿到的報價單上，填錯或不該公開的內容會被客戶看到；須第二位最高管理者核准，並要等 N 天才生效，改回「只給內部」立即生效。","st":"單項表單","nt":"涉及客戶文件，不進批次。與 quote_enabled 相依；設定卡內放「預覽報價單」連結讓人先看印出的樣子。｜建議 when（SettingDef.when）：公司想自己調整畫面、欄位、通知文字，又不想每次找開發商時再開；平常不需要，預設全部關閉。","q":"報價單的自訂欄位，可以印在報價單上嗎？","hp":"預設只給內部人員在表單上看。開放後，報價單 PDF、畫面預覽與內部列印（三者共用同一份版面）會在報價條件後面多印一個「其他資訊」區，列出有填的自訂欄位。客戶回簽單是客戶簽回的附件，沒有另外的畫面。需要先開放「報價單自訂欄位」。","im":"只影響之後產生或重新開啟的報價單文件，內部列印也會一起多印這個區；已經寄出的文件不會改，也不會動到任何已存的內容。開放屬於放寬，需要第二位最高管理者核准，並要等 N 天才生效；改回只給內部人員立即生效。","rk":"【高影響】開放後，報價單自訂欄位的名稱與內容會印在客戶拿到的報價單上，填錯或不該公開的內容會被客戶看到。","bat":"否（永不進批次）","ck":false,"ckwhy":"否（永不進批次）","wh":"公司想自己調整畫面、欄位、通知文字，又不想每次找開發商時再開；平常不需要，預設全部關閉。","t":"int","def":0,"rec":0,"u":"","min":0,"max":1,"risk":"legal","loosen":"up","pend":false,"adv":false,"ch":[{"v":0,"l":"只給內部人員（建議）","i":"報價單 PDF、預覽與內部列印都不出現自訂欄位。"},{"v":1,"l":"印在報價單上","i":"報價單 PDF、預覽與內部列印會多印「其他資訊」區。"}]},{"g":"builder_custom_fields","gl":"自訂欄位（內建畫面）","k":"quote_on_finance_docs","n":"自訂欄位附在請款單與開票憑據上","s":"預設不附。開放後，請款單與開票申請憑據 PDF 會多一個「其他資訊（報價單）」區，列出該報價單目前填的自訂欄位。","o":"不附（建議）：財務文件不出現自訂欄位｜附在財務文件上：有權下載那張請款單或憑據的人都看得到，即使他的角色不能開啟那張報價單。","c":"顯示「目前：已開放／未開放」與來源（公司／預設）；未開放＝與預設相同，不標「與預設不同」","d":"影響大（涉及金額文件）｜放寬（開放附上）後果：自訂欄位內容會跟著財務文件擴散給所有能下載的人，自由輸入的文字欄位也可能被填進金額，請先確認欄位用途；須第二位最高管理者核准，並要等 N 天才生效，改回「不附」立即生效。","st":"單項表單","nt":"涉及金額與財務文件，不進批次（risk=money）。｜建議 when（SettingDef.when）：公司想自己調整畫面、欄位、通知文字，又不想每次找開發商時再開；平常不需要，預設全部關閉。","q":"報價單的自訂欄位，可以附在請款單與開票申請憑據上嗎？","hp":"預設不附。開放後，請款單 PDF 與開票申請憑據 PDF 會多一個「其他資訊（報價單）」區，列出該報價單目前有填的自訂欄位；內容是印出當下從報價單讀取，不會複製進財務資料。有權下載該請款單或憑據的人都看得到這些內容，就算他的角色不能開啟那張報價單；自由輸入的文字欄位也可能被填進金額，請先確認欄位用途。應收清單、出納列表、會計傳票與報表不受影響。需要先開放「報價單自訂欄位」。","im":"只影響之後產生或重新開啟的請款單與開票申請憑據文件；已經寄出的文件不會改，金額、稅額與單據狀態完全不變。開放屬於放寬，需要第二位最高管理者核准，並要等 N 天才生效；改回不附立即生效。","rk":"【高影響】開放後，報價單自訂欄位的名稱與內容會附在請款單與開票申請憑據上；任何有權下載那張請款單或憑據的人都會看到，即使他的角色沒有權限開啟那張報價單。自由輸入的欄位也可能被填進金額。","bat":"否（永不進批次）","ck":false,"ckwhy":"否（永不進批次）","wh":"公司想自己調整畫面、欄位、通知文字，又不想每次找開 ":"要開放管理者自訂匯出檔的欄位與標題嗎？","hp":"開啟後，最高管理者可以在支援的匯出（每日任務歷程、外包名冊 Excel、開票申請憑據 PDF）調整要匯出哪些欄位、標題與順序，或加頁首／頁尾／浮水印（只能從預設文字挑選），先預覽再發布，也可以還原。必須同時開啟「建構器治理」才會生效。","im":"只影響匯出檔的欄位、標題與順序：資料仍是原本的查詢結果，沒有權限看的欄位不會出現；沒有發布過範本的匯出完全不變。新增欄位、新增或改變頁首頁尾浮水印文字都屬於放寬，需要第二位最高管理者核准。關閉（或關掉建構器治理）後，已發布的範本不再套用，匯出回到系統預設。可隨時關閉。","rk":"","bat":"是（需確認視窗）","ck":false,"ckwhy":"否（單項表單：本群組只有這一欄規則上可批次，且建議值＝預設值，勾選批次沒有比逐列「還原預設」多的功能）","wh":"公司想自己調整畫面、欄位、通知文字，又不想每次找開發商時再開；平常不需要，預設全部關閉。","t":"int","def":0,"rec":0,"u":"","min":0,"max":1,"risk":"ops","loosen":"","pend":false,"adv":false,"ch":[{"v":0,"l":"不開放（建議）","i":"匯出檔維持系統預設的欄位與標題。"},{"v":1,"l":"開放","i":"最高管理者可以調整支援匯出的欄位、標題與順序，發布前先預覽。"}]},{"g":"builder_governance","gl":"建構器治理（版本帳本與發布前影響預覽）","k":"enabled","n":"改版前先預覽，並保留歷史版本","s":"開啟後，版面、列印版型、自訂欄位的編輯畫面會多出「版本紀錄」（可比較任兩版、一鍵還原）與發布前的「影響預覽」。預設關閉。","o":"關閉：與今天完全一樣｜開啟：編輯畫面多出版本紀錄與影響預覽。只增加檢視與預覽，不改變任何已發布的內容。","c":"顯示「目前：已開放／未開放」與來源（公司／預設）；未開放＝與預設相同，不標「與預設不同」","d":"不改變已發布內容｜是多個客製功能的先決條件","st":"矩陣＋勾選批次＋套用前確認＋復原這一批＋搜尋篩選＋手機卡片","nt":"單項表單原因：本群組只有這一欄（總開關），沒有可重複套用的對象；用列上的開關逐項設定。｜新分類：畫面與客製／開放客製功能。矩陣一眼看全部開了哪些、哪些缺先決條件。批次（ops 類，PM 11-13 規則）只能做「套建議值（＝不開放）／重設」，套用前跳確認；不提供「全部開啟」；放寬類（強制預覽）與印在客戶文件／財務文件的項目永遠逐項。 內部詞「版本帳本／治理」一律改白話；這是下面各「發布前一定要先看預覽」的前提。｜建議 when（SettingDef.when）：公司想自己調整畫面、欄位、通知文字，又不想每次找開發商時再開；平常不需要，預設全部關閉。","q":"要不要開啟定義的版本帳本與發布前影響預覽？","hp":"開啟後，版面、輸出版型、自訂欄位的編輯畫面會多出「版本帳本」（列出每一版、比較任兩版、一鍵還原）與發布前的「影響預覽」。","im":"只增加檢視與預覽，不改變任何已發布的定義，也不改變發布與還原本身的行為。預覽只留一筆『看過預覽』的稽核。","rk":"","bat":"是（需確認視窗）","ck":false,"ckwhy":"否（單項表單：本群組只有這一欄規則上可批次，且建議值＝預設值，勾選批次沒有比逐列「還原預設」多的功能）","wh":"公司想自己調整畫面、欄位、通知文字，又不想每次找開發商時再開；平常不需要，預設全部關閉。","t":"int","def":0,"rec":0,"u":"","min":0,"max":1,"risk":"ops","loosen":"","pend":false,"adv":false,"ch":[{"v":0,"l":"關閉（預設）","i":"畫面與今天完全一樣。"},{"v":1,"l":"開啟","i":"編輯畫面多出版本帳本與影響預覽。"}]},{"g":"builder_governance","gl":"建構器治理（版本帳本與發布前影響預覽）","k":"enforce_layout","n":"版面發布前一定要先看預覽","s":"開啟後，版面（含選單）沒有帶著「看過的預覽」就不能發布，沒有例外。預設關閉。","o":"不強制：發布行為與今天相同｜強制：沒看過這份草稿的影響預覽就不能發布版面。編輯畫面若尚未接上預覽，開啟後會無法發布，請先確認。","c":"顯示「目前：已開放／未開放」與來源（公司／預設）；未開放＝與預設相同， 部來源」立即生效（但有被故意鎖住的風險）。","st":"單項表單","nt":"新分類：人員與權限／外網登入防護。安全類，不進批次；放寬類一律走等待期＋第二位最高管理者核准（change_control 不繞過）。 同卡「帳號鎖定」。｜建議 when（SettingDef.when）：有人故意在內網輸錯密碼把別人鎖住，或想連內網一起擋時。","q":"帳號被鎖住時，要連公司內網的登入也擋嗎？","hp":"建議只擋外網：這樣就算有人故意亂輸密碼，帳號本人在公司內網仍然可以登入，也能藉由內網登入解除鎖定。選「全部來源」最嚴，但任何人都能故意輸錯把別人鎖在系統外。","im":"只影響之後的帳號鎖定判斷。從「全部來源」改回「只擋外網」屬於放寬，須另一位最高管理者核准，並要等 N 天才生效；改成「全部來源」立即生效。","rk":"「全部來源」下，任何人（包含外網的陌生人）故意輸錯就能讓指定帳號在公司內也無法登入，直到鎖定時間結束或超級管理員解鎖。","bat":"否（永不進批次）","ck":false,"ckwhy":"否（永不進批次）","wh":"有人故意在內網輸錯密碼把別人鎖住，或想連內網一起擋時。","t":"int","def":1,"rec":1,"u":"","min":1,"max":2,"risk":"security","loosen":"down","pend":false,"adv":false,"ch":[{"v":1,"l":"只擋外網（建議）","i":"只有外網來源的失敗會計數、被鎖時只擋外網登入；內網照常登入並可解除鎖定。"},{"v":2,"l":"全部來源","i":"不分來源計數，被鎖時內網也擋；有被故意輸錯鎖住的風險。"}]},{"g":"external_login","gl":"外網登入防護","k":"external_hosts","n":"算「外網」的網址","s":"請求的網址網域在這份清單裡，就一律當外網（多個用逗號分隔）。另外，經外網通道進來、或來源位址不在內網網段的請求，也都算外網。","o":"填網域名稱，例如「erp.公司網域」；漏填時來源位址與外網通道的痕跡仍會判成外網，但請不要把外網網域拿掉。任何變更都要等 N 天才生效，等待期間可以撤銷。","c":"顯示「目前：{值}」與來源（公司／預設）；和預設不同時標「與預設不同」並附「重設為預設」","d":"需外部設定｜影響大｜任何變更都要等 N 天才生效（不需第二位最高管理者核准；等待期間可撤銷）","st":"單項表單","nt":"新分類：人員與權限／外網登入防護。安全類，不進批次；requires_pending：只等待，不需第二位核准；增、刪兩個方向都要等 N 天（SPEC r3.1：「只等待」與「等待加第二人核准」兩種提示文字分開）。畫面用「清單編輯器」（逐筆新增／移除），歸套用樣式「單項表單」。 進階：收進摺疊區；改為「多個項目輸入框（新增一筆網域）」而非逗號分隔文字；需知道公司對外網域，標「需外部設定」，旁附「請向網路管理者確認」。｜建議 when（SettingDef.when）：公司換了對外網域、或外網連進來的網址變了時（通常由安裝人員設定）。","q":"哪些網域代表「從外網進來」？（多個用逗號分隔）","hp":"請求的網址網域在這份清單裡，就一律當外網（除此之外，經外網通道進來、或來源位址不在內網網段的請求也都是外網）。","im":"只影響之後的外網判定；變更要等 N 天才生效。","rk":"漏填網域不會放寬太多（來源位址與外網通道的痕跡仍會判成外網），但請不要把外網網域拿掉。","bat":"否（永不進批次）","ck":false,"ckwhy":"否（永不進批次）","wh":"公司換了對外網域、或外網連進來的網址變了時（通常由安裝人員設定）。","t":"str","def":"","rec":null,"u":"","min":null,"max":null,"risk":"security","loosen":"","pend":true,"adv":true,"ch":[]},{"g":"external_login","gl":"外網登入防護","k":"loopback_is_internal","n":"在伺服器本機開網頁算公司內網嗎","s":"在伺服器這台電腦上直接開網頁登入，要不要當成公司內網。預設不算（同一台電腦上的轉送程式也能讓外面的人看起來像本機直連）。","o":"不算內網（建議）：本機直連也適用外網規則｜算內網：本機直連視為內網，免外網強制兩步驟驗證與帳號鎖定。只有確定本機沒有任何轉送外網流量的程式時才建議打開。","c":"顯示「目前：{值}」與來
