<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>設定矩陣 mockup（丙：權限／信件／個人通知／簽核流程）</title>
<style>
:root{--bg:#f4f2ee;--card:#fff;--ink:#1d1d1f;--mute:#6b6b72;--line:#dedbd4;--soft:#faf9f6;--red:#c8102e;--redbg:#fdecef;--ok:#157347;--okbg:#e6f4ec;--warn:#9a5b00;--warnbg:#fff4de;--blue:#1b4f9c;--bluebg:#e9f0fb;--on:#1b7f4b;--sel:#eef4ff;--diff:#e08a00;--purple:#5b3fa0;--purplebg:#efeafb}
@media (prefers-color-scheme:dark){:root{--bg:#18181a;--card:#242428;--ink:#f0f0f2;--mute:#a0a0a8;--line:#3a3a40;--soft:#1f1f23;--redbg:#3a1a20;--okbg:#17301f;--warnbg:#3a2c10;--bluebg:#16253d;--sel:#1b2740;--purplebg:#2a2147;--on:#2fae6d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
.wrap{max-width:1320px;margin:0 auto;padding:16px 16px 130px}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--mute);font-size:13px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.tabs{display:flex;gap:6px;margin:8px 0 12px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:8px;cursor:pointer;font:inherit}
.tab[aria-selected=true]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.note{background:var(--bluebg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;margin:0 0 10px}
.note.warn{background:var(--warnbg);color:var(--warn)}
.cmp{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;padding:8px 12px;margin-bottom:10px;font-size:13px}
.cmp b{font-size:18px}.cmp .bad{color:var(--red)}.cmp .good{color:var(--ok)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;margin-bottom:8px;position:sticky;top:0;z-index:20}
.toolbar input[type=search]{flex:1 1 220px;min-width:160px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 11px;border-radius:16px;cursor:pointer;font:inherit;font-size:13px}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
select,.btn{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:5px 9px;cursor:pointer}
.btn:hover{border-color:var(--mute)}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.sm{padding:2px 8px;font-size:12px}
.mute{color:var(--mute);font-size:12px}
.legend{font-size:12px;color:var(--mute);display:flex;gap:14px;flex-wrap:wrap;margin:6px 2px 10px;align-items:center}
/* 表格 */
.mx{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.mx th{position:sticky;top:var(--thtop,56px);background:var(--soft);z-index:5;text-align:center;font-weight:600;padding:7px 6px;border-bottom:1px solid var(--line);font-size:12px}
.mx td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.mx td.name,.mx th.name{text-align:left;padding-left:8px;min-width:300px}
.mx tr.grp td{background:var(--soft);text-align:left;font-weight:700;padding:7px 8px}
.mx tr.grp .gt{cursor:pointer}
.mx tr.row:hover td{background:var(--soft)}.mx tr.row.sel td{background:var(--sel)}
.mx tr.row.chg td.name{box-shadow:inset 3px 0 0 var(--diff)}
.nm{font-weight:600}.cd{font:11px/1.2 ui-monospace,Consolas,monospace;color:var(--mute);margin-left:6px}
.one{font-size:12px;color:var(--mute);margin-top:1px}
.src{font-size:11px;color:var(--mute)}
.dotd{color:var(--diff);font-size:11px;margin-left:6px;white-space:nowrap}
.tg{display:inline-block;font-size:11px;padding:0 7px;border-radius:9px;margin-left:5px;white-space:nowrap}
.tg.heavy{background:var(--redbg);color:var(--red)}.tg.ext{background:var(--warnbg);color:var(--warn)}.tg.oth{background:var(--bluebg);color:var(--blue)}.tg.me{background:var(--purplebg);color:var(--purple)}.tg.adv{background:var(--soft);color:var(--mute);border:1px solid var(--line)}
.q{display:inline-block;width:18px;height:18px;line-height:16px;text-align:center;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--blue);cursor:pointer;font-size:11px;padding:0;margin-left:6px}
.sw{width:38px;height:22px;border-radius:12px;border:1px solid var(--line);background:#c9c9cf;position:relative;cursor:pointer;padding:0;vertical-align:middle}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .12s}
.sw[aria-checked=true]{background:var(--on);border-color:var(--on)}.sw[aria-checked=true]::after{left:18px}
.sw[disabled]{opacity:.4;cursor:not-allowed}
.ck{width:28px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:transparent;font-size:14px;line-height:1;padding:0}
.ck.on{background:var(--on);border-color:var(--on);color:#fff}.ck.dd{outline:2px dashed var(--diff);outline-offset:1px}.ck.hv{border-color:var(--red)}
.mx select{max-width:150px}
.pcol{font-weight:600;white-space:nowrap}
.pcol .rl{display:block;font-weight:400;color:var(--mute);font-size:11px}
.pcol input{vertical-align:middle;margin-right:4px}
.hide{display:none!important}
/* 草稿與儲存列 */
.savebar{position:fixed;top:0;left:0;right:0;z-index:55;background:var(--warnbg);color:var(--ink);border-bottom:2px solid var(--diff);padding:8px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.savebar b{color:var(--warn)}.savebar .sp{flex:1}
body.hs{padding-top:48px}body.hs .toolbar{top:48px}body.hs .mx th{top:calc(var(--thtop,56px) + 48px)}
.tg.draft{background:#fff0b3;color:#7a5a00;border:1px solid #e0b000}
.sw.drf,.ck.drf,select.drf{outline:2px solid #e0b000;outline-offset:1px}
tr.row.drafted td.name{background:#fff8dc}
@media (prefers-color-scheme:dark){tr.row.drafted td.name{background:#3a3210}.tg.draft{background:#4a3d0a;color:#ffd75e}}
.tab .dm{color:#e0a800;margin-left:4px}
/* 批次列 */
.batch{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:40;background:var(--ink);color:var(--card);border-radius:12px;padding:9px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100vw - 16px)}
.batch .btn{background:transparent;color:inherit;border-color:rgba(255,255,255,.35)}.batch .btn:hover{background:rgba(255,255,255,.12)}
.batch select{background:transparent;color:inherit;border-color:rgba(255,255,255,.35)}.batch select option{color:#000}
.batch .sep{width:1px;align-self:stretch;background:rgba(255,255,255,.3)}
/* 彈窗／吐司／說明 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--card);color:var(--ink);border-radius:12px;padding:16px;max-width:560px;width:100%;max-height:88vh;overflow:auto}
.dlg h3{margin:0 0 8px;font-size:16px}.dlg ul{margin:4px 0 4px 18px;padding:0;font-size:13px}.dlg .red{color:var(--red)}
.dlg textarea,.dlg input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;padding:6px 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:14px;background:var(--ink);color:var(--card);padding:8px 14px;border-radius:10px;z-index:80;display:flex;gap:10px;align-items:center;font-size:13px}
.toast button{background:none;border:0;color:#7db3ff;cursor:pointer;font:inherit;text-decoration:underline}
.pop{position:absolute;z-index:70;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:10px 12px;width:340px;max-width:calc(100vw - 24px);font-size:13px;text-align:left}
.pop h4{margin:0 0 4px;font-size:13px}.pop p{margin:3px 0}.pop b{color:var(--blue)}
/* 手機卡片：同一份表格轉成卡片 */
@media (max-width:900px){
  .mx,.mx tbody,.mx tr,.mx td{display:block;width:100%}.mx thead{display:none}
  .mx tr.row{padding:10px 12px;border-bottom:1px solid var(--line)}
  .mx td{border:0;padding:3px 0;text-align:left}.mx td.name{min-width:0}
  .mx td[data-l]::before{content:attr(data-l) "：";color:var(--mute);font-size:12px}
  .mx td.nm0{padding-bottom:6px}
  .batch{left:8px;right:8px;transform:none;bottom:8px;justify-content:center}.batch .btn,.batch select{padding:9px 10px}
  .toolbar{position:static}
  .ck,.sw{min-height:34px}
}
</style>
</head>

<div class="wrap">
  <h1>設定矩陣：一眼看完、點格子切換、勾選一次套用</h1>
  <p class="sub">設計 mockup（<b>示意資料</b>）：項目名稱、群組、說明、影響、權限鍵、信件類型、通知事件、單據類型取自真實程式（30 個權限鍵／67 種信件／78 個個人通知事件／9 種簽核單據）；人員、開關狀態、進行中單據數都是假的，操作只在這個頁面生效、重新整理就還原。四個分頁共用同一套元件（規格見 SPEC.md）。</p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <label class="mute" style="display:block;margin:-4px 0 8px"><input type="checkbox" id="mockc"> 模擬「套用之後，別人也改了其中某項」（用來看復原被拒絕時的畫面；復原＝復原<b>這一批</b>，靠版本檢查，不是逐格 6 秒）</label>
  <div id="views"></div>
</div>
<div class="savebar hide" id="savebar" role="region" aria-label="未儲存的變更"></div>
<div class="batch hide" id="batch" role="toolbar" aria-label="批次操作"></div>
<div id="layer"></div>

var UI={toastT:null,pop:null};

function toast(msg,undo){
  var o=document.getElementById('toast');if(o)o.remove();clearTimeout(UI.toastT);
  var t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('aria-live','polite');
  t.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button>復原這一批（6）</button>':'');
  document.body.appendChild(t);
  if(undo){var n=6,b=t.querySelector('button');
    var iv=setInterval(function(){n--;if(b)b.textContent='復原這一批（'+n+'）';if(n<=0)clearInterval(iv)},1000);
    b.onclick=function(){clearInterval(iv);t.remove();clearTimeout(UI.toastT);undo()};
    UI.toastT=setTimeout(function(){t.remove();clearInterval(iv)},6000)}
  else UI.toastT=setTimeout(function(){t.remove()},2200);
}
function toastHtml(html,undo){
  var o=document.getElementById('toast');if(o)o.remove();clearTimeout(UI.toastT);
  var t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('aria-live','polite');t.style.maxWidth='min(640px,calc(100vw - 24px))';
  t.innerHTML='<span>✔ '+html+'</span>'+(undo?'<button>復原這一批（6）</button>':'');document.body.appendChild(t);
  if(undo){var n=6,b=t.querySelector('button');var iv=setInterval(function(){n--;if(b)b.textContent='復原這一批（'+n+'）';if(n<=0)clearInterval(iv)},1000);
    b.onclick=function(){clearInterval(iv);t.remove();clearTimeout(UI.toastT);undo()};UI.toastT=setTimeout(function(){t.remove();clearInterval(iv)},9000)}
  else UI.toastT=setTimeout(function(){t.remove()},9000);
}
function refreshSave(){
  var sb=document.getElementById('savebar'),a=MXAPI[TAB],n=a?a.count():0,tot=0;
  Object.keys(MXAPI).forEach(function(k){var c=MXAPI[k].count();tot+=c;var tb=document.getElementById('tab-'+k);if(tb){var m=tb.querySelector('.dm');if(c&&!m){tb.insertAdjacentHTML('beforeend','<span class="dm" title="有未儲存的變更">●</span>')}else if(!c&&m)m.remove()}});
  document.body.classList.toggle('hs',n>0);
  if(!n){sb.classList.add('hide');sb.innerHTML=''}
  else{sb.classList.remove('hide');var sk=a.skips().length;sb.innerHTML='<b>● 有 '+n+' 項未儲存</b><span class="mute">（黃色標示的就是草稿；離開頁面前請先儲存或放棄）</span>'+(sk?'<span class="mute">批次略過 '+sk+' 項</span>':'')+'<span class="sp"></span><button class="btn" id="sbDiscard">放棄</button><button class="btn primary" id="sbSave">儲存</button>';
    document.getElementById('sbSave').onclick=a.save;document.getElementById('sbDiscard').onclick=a.discard}
  window.onbeforeunload=tot?function(e){e.preventDefault();e.returnValue='';return ''}:null;
}
function dlg(html,onOk,okLabel,okCheck){
  var L=document.getElementById('layer');
  L.innerHTML='<div class="modal"><div class="dlg" role="dialog" aria-modal="true">'+html+'<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn" id="dc">取消</button>'+(onOk?'<button class="btn primary" id="dk">'+(okLabel||'套用')+'</button>':'')+'</div></div></div>';
  document.getElementById('dc').onclick=function(){L.innerHTML=''};
  if(onOk)document.getElementById('dk').onclick=function(){if(okCheck&&!okCheck())return;L.innerHTML='';onOk()};
}
function help(btn,r){
  closePop();var h=r.help||{};var p=document.createElement('div');p.className='pop';
  p.innerHTML='<h4>'+esc(r.label)+' <span class="cd">'+esc(r.code)+'</span></h4>'+
    '<p><b>這是什麼</b>：'+esc(h.what||r.one||'')+'</p><p><b>什麼時候要改</b>：'+esc(h.when||'（待補：settings_help.json）')+'</p>'+
    '<p><b>改了會影響什麼</b>：'+esc(h.impact||'')+'</p><p><b>建議值</b>：'+esc(h.recommend||'照預設')+'</p>';
  var b=btn.getBoundingClientRect();document.body.appendChild(p);
  p.style.top=(window.scrollY+b.bottom+6)+'px';p.style.left=Math.max(8,Math.min(window.scrollX+b.left-20,document.documentElement.clientWidth-360))+'px';UI.pop=p;
}
function closePop(){if(UI.pop){UI.pop.remove();UI.pop=null}}
document.addEventListener('click',function(e){if(UI.pop&&!e.target.closest('.pop')&&!e.target.closest('.q'))closePop()});

/* cfg: id, title, intro, cmp, groups[{id,label}], rows[{id,group,label,code,one,tags[],help,v{},d{},src,heavy,eligible,whyNot,hint}],
        cols[{id,title,type:'switch'|'select'|'check'|'text',options,sub,tag,name}], colSelect, filters[{id,label,fn}], search(row)->text,
        groupToggle:{col,onLabel,offLabel}, batch(ctx)->[{id,label,kind:'btn'|'select',options,run(rowsSel,colsSel,val)->plan}], need:{rows,cols} */
function Matrix(host,cfg){
  var S={q:'',f:'all',sel:{},csel:{},collapsed:{},skips:[],warns:[],est:[]};
  cfg.rows.forEach(function(r){r.sv=clone(r.v)});
  var root=document.createElement('div');host.appendChild(root);
  function rowsById(id){return cfg.rows.filter(function(r){return r.id===id})[0]}
  function changed(r){return cfg.cols.some(function(c){return r.v[c.id]!==r.d[c.id]})}
  function vis(r){
    if(S.q){var t=(r.label+' '+r.code+' '+(r.one||'')+' '+(cfg.search?cfg.search(r):'')).toLowerCase();if(t.indexOf(S.q.toLowerCase())<0)return false}
    if(S.f==='chg')return changed(r);
    var fl=cfg.filters.filter(function(x){return x.id===S.f})[0];return fl?fl.fn(r):true;
  }
  function tags(r){return (r.tags||[]).map(function(t){return '<span class="tg '+t[0]+'">'+t[1]+'</span>'}).join('')}
  function cell(r,c){
    var v=r.v[c.id],dis=r.locked&&r.locked[c.id]?' disabled':'',dd=v!==r.d[c.id],dr=v!==r.sv[c.id];
    if(r.roleDecided&&c.type==='check')return '<span class="mute" title="財務三鍵由角色決定，這裡唯讀；批次永遠不會改角色">'+(v?'✓ ':'－ ')+'由角色決定</span>';
    if(c.type==='switch')return '<button class="sw'+(dr?' drf':'')+'" role="switch" aria-checked="'+!!v+'" aria-label="'+esc(r.label+' '+c.title)+'" data-act="cell" data-r="'+r.id+'" data-c="'+c.id+'"'+dis+'></button>'+(dd?'<div class="dotd">●</div>':'');
    if(c.type==='check')return '<button class="ck'+(v?' on':'')+(dr?' drf':'')+(dd?' dd':'')+(r.heavy?' hv':'')+'" aria-pressed="'+!!v+'" aria-label="'+esc(r.label+'／'+c.name)+'" data-act="cell" data-r="'+r.id+'" data-c="'+c.id+'">✓</button>';
    if(c.type==='select')return '<select class="'+(dr?'drf':'')+'" data-act="sel" data-r="'+r.id+'" data-c="'+c.id+'" aria-label="'+esc(r.label+' '+c.title)+'">'+c.options.map(function(o){return '<option value="'+esc(o[0])+'"'+(String(o[0])===String(v)?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select>'+(dd?'<span class="dotd">●</span>':'');
    return esc(v==null?'':(c.fmt?c.fmt(v,r):v))+(dr?'<span class="tg draft">未儲存</span>':(dd?'<span class="dotd">●</span>':''));
  }
  function draw(){
    var h='';
    if(cfg.intro)h+='<div class="note'+(cfg.introWarn?' warn':'')+'">'+cfg.intro+'</div>';
    if(cfg.cmp)h+='<div class="card cmp">'+cfg.cmp+'</div>';
    h+='<div class="card toolbar"><input type="search" id="q'+cfg.id+'" placeholder="搜尋中文名稱、代碼、說明" value="'+esc(S.q)+'" aria-label="搜尋">';
    [{id:'all',label:'全部'},{id:'chg',label:'● 與預設不同'}].concat(cfg.filters).forEach(function(f){h+='<button class="chip" data-act="flt" data-f="'+f.id+'" aria-pressed="'+(S.f===f.id)+'">'+f.label+'</button>'});
    h+='<button class="btn" data-act="exp">展開全部</button><button class="btn" data-act="col">收合全部</button></div>';
    h+='<div class="legend"><span><b>●</b> 與預設不同（列左側橘條）</span><span>？ 點開看四段說明</span><span>灰掉的核取方塊＝影響大，不能批次，要逐項設定</span><span>點選只是<b>草稿</b>（黃色＝未儲存）；要按上方「儲存」才生效</span><span>儲存後可「復原這一批」（別人沒動過才行）</span><span>勾左邊方塊選多列'+(cfg.colSelect?'，勾欄頭選多人':'')+'，再用下方批次列一次套用。</span></div>';
    h+='<div class="card"><table class="mx"><thead><tr><th class="name">項目（中文名稱／代碼）</th>';
    cfg.cols.forEach(function(c){
      if(cfg.colSelect)h+='<th class="pcol"><label><input type="checkbox" data-act="csel" data-c="'+c.id+'"'+(S.csel[c.id]?' checked':'')+'>'+esc(c.title)+'</label><span class="rl">'+esc(c.sub||'')+'</span></th>';
      else h+='<th>'+esc(c.title)+(c.tag?'<span class="tg ext">'+c.tag+'</span>':'')+'</th>';
    });
    h+='</tr></thead><tbody>';
    var n=0;
    cfg.groups.forEach(function(g){
      var rs=cfg.rows.filter(function(r){return r.group===g.id&&vis(r)});if(!rs.length)return;
      var open=!S.collapsed[g.id]||S.q,elig=rs.filter(function(r){return r.eligible!==false}),allsel=elig.length&&elig.every(function(r){return S.sel[r.id]});
      h+='<tr class="grp"><td colspan="'+(cfg.cols.length+1)+'"><label style="margin-right:8px"><input type="checkbox" data-act="gsel" data-g="'+g.id+'"'+(allsel?' checked':'')+' aria-label="選取整組"></label><span class="gt" data-act="gtog" data-g="'+g.id+'">'+(open?'▾ ':'▸ ')+esc(g.label)+'</span> <span class="mute">（'+rs.length+' 項'+(elig.length<rs.length?'，其中 '+(rs.length-elig.length)+' 項不能批次':'')+'）</span>';
      if(cfg.groupToggle)h+=' <button class="btn sm" data-act="gon" data-g="'+g.id+'">'+cfg.groupToggle.onLabel+'</button> <button class="btn sm" data-act="goff" data-g="'+g.id+'">'+cfg.groupToggle.offLabel+'</button>';
      h+='</td></tr>';
      if(!open)return;
      rs.forEach(function(r){
        n++;var ck=r.eligible===false?' disabled title="'+esc(r.whyNot||'影響大，要逐項設定')+'"':'';
        h+='<tr class="row'+(S.sel[r.id]?' sel':'')+(changed(r)?' chg':'')+(rowDirty(r)?' drafted':'')+'"><td class="name nm0"><label style="float:left;margin:2px 8px 0 0"><input type="checkbox" data-act="rsel" data-r="'+r.id+'"'+(S.sel[r.id]?' checked':'')+ck+' aria-label="選取 '+esc(r.label)+'"></label>'+
          '<div><span class="nm">'+esc(r.label)+'</span><span class="cd">'+esc(r.code)+'</span>'+tags(r)+'<button class="q" data-act="help" data-r="'+r.id+'" aria-label="說明">?</button>'+(rowDirty(r)?'<span class="tg draft">未儲存</span>':'')+(changed(r)?'<span class="dotd">● 與預設不同</span>':'')+'</div>'+
          '<div class="one">'+esc(r.one||'')+'</div>'+(r.src?'<div class="src">'+esc(typeof r.src==='function'?r.src(r):r.src)+'</div>':'')+'</td>';
        cfg.cols.forEach(function(c){h+='<td data-l="'+esc(c.title)+'">'+cell(r,c)+'</td>'});
        h+='</tr>';
      });
    });
    if(!n)h+='<tr><td colspan="'+(cfg.cols.length+1)+'" class="mute" style="text-align:center;padding:18px">沒有符合的項目。</td></tr>';
    h+='</tbody></table></div>';
    root.innerHTML=h;
    var qi=document.getElementById('q'+cfg.id);if(qi&&S.focusQ){qi.focus();qi.setSelectionRange(qi.value.length,qi.value.length)}
    batchBar();refreshSave();
  }
  function rowDirty(r){return cfg.cols.some(function(c){return r.v[c.id]!==r.sv[c.id]})}
  function selRows(){return cfg.rows.filter(function(r){return S.sel[r.id]})}
  function selCols(){return cfg.cols.filter(function(c){return S.csel[c.id]})}
  function batchBar(){
    var B=document.getElementById('batch'),rs=selRows(),cs=selCols();
    if(!cfg.active()||(!rs.length&&!cs.length)){B.classList.add('hide');return}
    var acts=cfg.batch({rows:rs,cols:cs}),h='<b>'+(cfg.need&&cfg.need.cols?'已選 '+rs.length+' 項 × '+cs.length+' 人':'已選 '+rs.length+' 項')+'</b><span class="sep"></span>';
    acts.forEach(function(a){
      if(a.kind==='select')h+='<select data-b="'+a.id+'" aria-label="'+esc(a.label)+'"><option value="">'+esc(a.label)+'…</option>'+a.options.map(function(o){return '<option value="'+esc(o[0])+'">'+esc(o[1])+'</option>'}).join('')+'</select>';
      else if(a.kind==='sep')h+='<span class="sep"></span>';
      else h+='<button class="btn" data-b="'+a.id+'">'+esc(a.label)+'</button>';
    });
    h+='<span class="sep"></span><button class="btn" data-b="__clear">取消選取</button>';
    B.innerHTML=h;B.classList.remove('hide');B._acts=acts;B._owner=cfg.id;
  }
  /* 批次動作只是把變更加進草稿；要按上方儲存列的「儲存」才寫入（確認、原因、通知都在儲存時） */
  function plan2dlg(title,plan){
    var real=plan.changes.filter(function(x){return x.r.v[x.c]!==x.to});
    if(!real.length&&!plan.skip.length){toast('沒有需要變更的項目（本來就是這樣）');return}
    real.forEach(function(x){x.r.v[x.c]=x.to});
    plan.skip.forEach(function(k){S.skips.push(k)});(plan.warn||[]).forEach(function(w){if(S.warns.indexOf(w)<0)S.warns.push(w)});if(plan.estimate)S.est.push(plan.estimate);
    S.sel={};S.csel={};draw();
    toast('已加入草稿 '+real.filter(function(x){return !x.hide}).length+' 項'+(plan.skip.length?'，略過 '+plan.skip.length+' 項（不能批次）':'')+'。尚未儲存，請按上方「儲存」。');
  }
  function showV(c,v){
    if(c.options){var o=c.options.filter(function(x){return String(x[0])===String(v)})[0];return o?o[1]:String(v)}
    if(v===true||v===false)return c.type==='check'?(v?'有':'無'):(v?'開':'關');return String(v)}
  function dirty(){var o=[];cfg.rows.forEach(function(r){cfg.cols.forEach(function(c){if(r.v[c.id]!==r.sv[c.id])o.push({r:r,c:c,from:r.sv[c.id],to:r.v[c.id],hide:!!c.hideList})})});return o}
  function discard(){var n=dirty().filter(function(x){return !x.hide}).length;cfg.rows.forEach(function(r){r.v=clone(r.sv)});S.skips=[];S.warns=[];S.est=[];draw();toast('已放棄 '+n+' 項未儲存的變更')}
  function openSave(){
    var ch=dirty();if(!ch.length)return;
    var shown=ch.filter(function(x){return !x.hide}),heavy=shown.filter(function(x){return x.r.heavy}),batchLike=shown.length>1;
    var h='<h3>儲存這些變更？</h3><p>共 <b>'+shown.length+'</b> 項'+(S.skips.length?'；批次時另有 <b>'+S.skips.length+'</b> 項被略過（不能批次）':'')+'。</p>';
    S.est.forEach(function(e){h+='<p>'+e+'</p>'});S.warns.forEach(function(w){h+='<p class="red">⚠ '+w+'</p>'});
    h+='<ul>'+shown.slice(0,8).map(function(x){return '<li>'+esc(x.r.label)+(cfg.need&&cfg.need.cols?'（'+esc(x.c.title)+'）':(cfg.cols.length>1?'（'+esc(x.c.title)+'）':''))+'：'+esc(showV(x.c,x.from))+' → '+esc(showV(x.c,x.to))+(x.r.heavy?' <span class="tg heavy">影響大</span>':'')+'</li>'}).join('')+(shown.length>8?'<li class="mute">…另 '+(shown.length-8)+' 項</li>':'')+'</ul>';
    if(S.skips.length)h+='<p class="mute">已略過（不能批次，請逐項設定）：'+S.skips.slice(0,4).map(function(k){return esc(k.label)+'（'+esc(k.why)+'）'}).join('、')+(S.skips.length>4?'…':'')+'</p>';
    if(heavy.length)h+='<p class="red">⚠ 其中 '+heavy.length+' 項影響大：'+esc(heavy[0].r.heavyText||'要填原因，且要等確認期間或另一位管理者核准才生效。')+'</p>';
    h+='<div class="note" style="margin:8px 0"><b>儲存後會自動通知</b>：站內通知 → '+esc(cfg.notify?cfg.notify(shown):'最高管理者')+'；內容寫明「誰、改了什麼、舊值 → 新值、原因」'+(batchLike?'；這一批合併成<b>一則</b>通知':'')+(heavy.length?'；高風險 '+heavy.length+' 項<b>另用 LINE 通知最高管理者</b>':'')+'。</div>';
    h+='<p class="mute">變更原因（寫進通知與稽核紀錄'+(heavy.length?'；影響大項目必填，至少 4 個字':'')+'）</p><input type="text" id="rsn" value="'+(batchLike?'批次調整（'+shown.length+' 項）':'調整設定')+'">';
    dlg(h,function(){
      var old=ch.map(function(x){return [x.r,x.c.id,x.from]}),pend=heavy.length,n=shown.length;
      ch.forEach(function(x){x.r.sv[x.c.id]=x.r.v[x.c.id]});S.skips=[];S.warns=[];S.est=[];MOCK.ver++;draw();
      var res='已儲存 '+n+' 項：'+(pend?(n-pend)+' 項已生效；'+pend+' 項<b>待核准</b>，預計 '+MOCK.eff+' 生效（要等 7 天）':'全部已生效')+'。已通知：'+(cfg.notify?cfg.notify(shown):'最高管理者')+(pend?'；高風險已另用 LINE 通知最高管理者':'')+'。';
      toastHtml(res,(n-pend)>0?function(){
        if(MOCK.conflict){dlg('<h3>無法復原這一批</h3><p class="red">這幾項在你儲存之後被別人改過了：<b>王經理</b> 於 '+MOCK.when+' 修改了「'+esc(shown[0].r.label)+'」。</p><p>為了不蓋掉別人的修改，系統拒絕整批復原。請到「變更紀錄」查看，或手動調整。</p>');return}
        old.forEach(function(o){if(!o[0].heavy){o[0].v[o[1]]=o[2];o[0].sv[o[1]]=o[2]}});draw();toast('已復原這一批（'+(n-pend)+' 項）；影響大的項目要到「待生效」取消')}:null);
    },'儲存 '+shown.length+' 項',function(){if(!heavy.length)return true;var i=document.getElementById('rsn');if(i.value.trim().length<4){i.style.borderColor='var(--red)';return false}return true});
  }
  MXAPI[cfg.id]={count:function(){return dirty().filter(function(x){return !x.hide}).length},save:openSave,discard:discard,skips:function(){return S.skips}};
  function fmt(v){return v===true?'開':v===false?'關':String(v)}
  host.addEventListener('input',function(e){if(e.target.type==='search'){S.q=e.target.value;S.focusQ=true;draw();S.focusQ=false}});
  host.addEventListener('change',function(e){
    var t=e.target,a=t.dataset.act;if(!a)return;
    if(a==='sel'){var r=rowsById(t.dataset.r),c=t.dataset.c,old=r.v[c];singleSet(r,c,t.value,old)}
    if(a==='rsel'){S.sel[t.dataset.r]=t.checked;draw()}
    if(a==='csel'){S.csel[t.dataset.c]=t.checked;draw()}
    if(a==='gsel'){cfg.rows.filter(function(r){return r.group===t.dataset.g&&r.eligible!==false&&vis(r)}).forEach(function(r){S.sel[r.id]=t.checked});draw()}
  });
  function singleSet(r,c,val,old){
    var col=cfg.cols.filter(function(x){return x.id===c})[0];
    if(col.type==='switch'||col.type==='check')val=!old;
    r.v[c]=(col.type==='select'&&typeof old==='number')?Number(val):val;draw();
  }
  host.addEventListener('click',function(e){
    var t=e.target.closest('[data-act],[data-b]');if(!t)return;
    if(t.dataset.b){return}
    var a=t.dataset.act;
    if(a==='flt'){S.f=t.dataset.f;draw()}
    if(a==='exp'){S.collapsed={};draw()}
    if(a==='col'){cfg.groups.forEach(function(g){S.collapsed[g.id]=true});draw()}
    if(a==='gtog'){S.collapsed[t.dataset.g]=!S.collapsed[t.dataset.g];draw()}
    if(a==='help'){var r=rowsById(t.dataset.r);help(t,r)}
    if(a==='cell'){var r2=rowsById(t.dataset.r),c2=t.dataset.c;singleSet(r2,c2,null,r2.v[c2])}
    if(a==='gon'||a==='goff'){
      var on=a==='gon',col=cfg.groupToggle.col,pl={changes:[],skip:[],warn:cfg.groupToggle.warn?cfg.groupToggle.warn(on,t.dataset.g):[]};
      cfg.rows.filter(function(r){return r.group===t.dataset.g}).forEach(function(r){
        if(r.eligible===false){pl.skip.push({label:r.label,why:r.whyNot||'影響大，要逐項設定'});return}
        pl.changes.push({r:r,c:col,to:on})});
      plan2dlg((on?'全開：':'全關：')+cfg.groups.filter(function(g){return g.id===t.dataset.g})[0].label,pl)}
  });
  document.getElementById('batch').addEventListener('click',function(e){
    var B=document.getElementById('batch');if(B._owner!==cfg.id)return;
    var t=e.target.closest('button[data-b]');if(!t)return;
    if(t.dataset.b==='__clear'){S.sel={};S.csel={};draw();return}
    var a=B._acts.filter(function(x){return x.id===t.dataset.b})[0];if(!a)return;
    runAct(a,'')
  });
  document.getElementById('batch').addEventListener('change',function(e){
    var B=document.getElementById('batch');if(B._owner!==cfg.id)return;
    var t=e.target;if(t.tagName!=='SELECT'||!t.value)return;
    var a=B._acts.filter(function(x){return x.id===t.dataset.b})[0];var v=t.value;t.value='';if(a)runAct(a,v)
  });
  function runAct(a,val){var rs=selRows(),cs=selCols(),pl=a.run(rs,cs,val);plan2dlg(a.title||a.label,pl)}
  cfg._redraw=draw;draw();
  return {redraw:draw,state:S};
}

var FLOWCFG,TPL={t1:['直屬主管'],t2:['直屬主管','財務主管'],t3:['直屬主管','財務主管','最高管理者']};
function flowPlan(rs,t){var ap=TPL[t],pl={changes:[],skip:[],warn:[]},inf=0;
  rs.forEach(function(r){var s=ap.join(' → ');if(r.v.ap!==s){pl.changes.push({r:r,c:'ap',to:s});pl.changes.push({r:r,c:'layers',to:ap.length,hide:1});inf+=r.inflight}});
  pl.estimate='受影響的進行中單據：<b>'+inf+'</b> 張（已簽的層維持原樣，尚未簽的層改走新流程）。';if(inf)pl.warn.push('有進行中單據：確認前請先通知相關簽核人。');return pl}
function flowCopy(rs,src){var s=FLOWCFG.rows.filter(function(r){return r.id===src})[0],pl={changes:[],skip:[],warn:[]},inf=0;
  rs.forEach(function(r){if(r.id===src){pl.skip.push({label:r.label,why:'就是來源本身'});return}if(r.v.ap!==s.v.ap){pl.changes.push({r:r,c:'ap',to:s.v.ap});pl.changes.push({r:r,c:'layers',to:s.v.layers,hide:1});inf+=r.inflight}});
  pl.estimate='把「'+s.label+'」的流程（'+s.v.ap+'）複製到所選類型；受影響的進行中單據 <b>'+inf+'</b> 張。';return pl}
function flowScope(rs,to){var pl={changes:[],skip:[],warn:[]};rs.forEach(function(r){if(r.v.flow!==to)pl.changes.push({r:r,c:'flow',to:to,fromText:r.v.flow==='u'?'統一':'獨立',toText:to==='u'?'統一':'獨立'})});
  pl.warn.push('改為統一流程後，這些類型會改走同一條流程，原本各自設定的簽核人會被取代。');return pl}

/* ───────── 啟動 ───────── */
var NOTIFY={
  perm:function(ch){var ps={};ch.forEach(function(x){ps[x.c.title]=1});var n=Object.keys(ps);return '最高管理者、受影響的 '+n.length+' 位同仁（'+n.slice(0,3).join('、')+(n.length>3?'…':'')+'）及其主管'},
  mail:function(ch){return '最高管理者、這些信件類型原本的收件角色（簽核人／業務／管理者…）'},
  pref:function(ch){return '最高管理者、這位同仁本人'},
  flow:function(ch){var ps={};ch.forEach(function(x){ps[x.r.label]=1});return '最高管理者、受影響單據類型的簽核人與申請人（'+Object.keys(ps).length+' 類）'}
};
var TAB='perm',MX={};
var TABS=[['perm','① 使用者權限（30 項 × 人）'],['mail','② 信件收件（67 種）'],['pref','③ 個人通知偏好（78 項）'],['flow','④ 簽核流程（9 類）']];
function showTab(k){
  TAB=k;closePop();
  TABS.forEach(function(t){document.getElementById('tab-'+t[0]).setAttribute('aria-selected',t[0]===k);document.getElementById('view-'+t[0]).classList.toggle('hide',t[0]!==k)});
  document.getElementById('batch').classList.add('hide');
  if(MX[k])MX[k].redraw();refreshSave();
}
document.addEventListener('change',function(e){if(e.target.id==='mockc')MOCK.conflict=e.target.checked});
(function(){
  var tb=document.getElementById('tabs'),vw=document.getElementById('views');
  TABS.forEach(function(t){
    var b=document.createElement('button');b.className='tab';b.id='tab-'+t[0];b.setAttribute('role','tab');b.textContent=t[1];b.onclick=function(){showTab(t[0])};tb.appendChild(b);
    var d=document.createElement('div');d.id='view-'+t[0];vw.appendChild(d);
  });
  PERMCFG=permCfg();PERMCFG.notify=NOTIFY.perm;MX.perm=Matrix(document.getElementById('view-perm'),PERMCFG);
  var mc=mailCfg();mc.notify=NOTIFY.mail;MX.mail=Matrix(document.getElementById('view-mail'),mc);
  PREFCFG=prefCfg();PREFCFG.notify=NOTIFY.pref;MX.pref=Matrix(document.getElementById('view-pref'),PREFCFG);
  FLOWCFG=flowCfg();FLOWCFG.notify=NOTIFY.flow;MX.flow=Matrix(document.getElementById('view-flow'),FLOWCFG);
  var hq=(location.hash||'').replace('#','').split('-'),q=hq[0],demo=hq[1];showTab(['perm','mail','pref','flow'].indexOf(q)>=0?q:'perm');
  /* 擷圖用：#perm-demo（預先勾好）、#perm-confirm（再自動按下批次鈕）。一般使用不會用到 */
  if(demo){
    var st=MX[q].state;
    if(q==='perm'){['wang','li','chen','lin','zhang'].forEach(function(c){st.csel[c]=true});['quotation','case_manage','customer','reports','map','dev_crm','lodging','inventory'].forEach(function(r){st.sel[r]=true});if(demo==='tpl'||demo==='tplsave'){st.csel={li:true,huang:true,wu:true}}}
    if(q==='mail'){DATA.mail_types.slice(60,67).forEach(function(t){st.sel[t.key]=true});st.sel[DATA.mail_types[0].key]=true}
    if(q==='pref'){DATA.event_groups[2][1].forEach(function(e){st.sel[e[0]]=true})}
    if(q==='flow'){['shipping','invoice_voucher','extra_expense','completion'].forEach(function(r){st.sel[r]=true})}
    MX[q].redraw();
    var b=document.getElementById('batch'),pick={perm:'grant',mail:'off',pref:'off'}[q];
    function doBatch(){
      if(q==='flow'){var sel=b.querySelector('select[data-b=tpl]');sel.value='t2';sel.dispatchEvent(new Event('change',{bubbles:true}))}
      else if(demo==='tpl'||demo==='tplsave'){var s2=b.querySelector('select[data-b=tpl]');s2.value='sales';s2.dispatchEvent(new Event('change',{bubbles:true}))}
      else b.querySelector('button[data-b='+pick+']').click()}
    if(demo==='draft'||demo==='save'||demo==='done'||demo==='tpl'||demo==='tplsave'){
      if(demo==='tpl'||demo==='tplsave'){st.sel={}}
      doBatch();
      if(demo==='save'||demo==='tplsave'||demo==='done')document.getElementById('sbSave').click();
      if(demo==='done'){document.getElementById('dk').click()}
    }
  }
})();
</script>
</body>
