<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>設定中心外框 mockup（導覽＋群組頁）</title>
<style>
:root{--bg:#f4f2ee;--card:#fff;--ink:#1d1d1f;--mute:#6b6b72;--line:#dedbd4;--soft:#faf9f6;--red:#c8102e;--redbg:#fdecee;--warn:#9a5b00;--warnbg:#fff4de;--blue:#1b4f9c;--bluebg:#e9f0fb;--ok:#18794e;--okbg:#e6f5ed;--drf:#fff8d6;--vio:#6a3fb0;--viobg:#f0eaf9}
@media (prefers-color-scheme:dark){:root{--bg:#18181a;--card:#242428;--ink:#f0f0f2;--mute:#a0a0a8;--line:#3a3a40;--soft:#1f1f23;--redbg:#3d1a20;--warnbg:#3a2c10;--bluebg:#16253d;--okbg:#10301f;--drf:#3a3410;--viobg:#2a2040}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:14.5px/1.6 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
code,.code{font:12px ui-monospace,Consolas,monospace;color:var(--mute)}
.top{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line)}
.top .row1{display:flex;gap:10px;align-items:center;padding:8px 14px;flex-wrap:wrap}
.top h1{font-size:16px;margin:0 8px 0 0;white-space:nowrap}
.search{flex:1;min-width:200px;max-width:520px;position:relative}
.search input{width:100%;padding:7px 10px 7px 30px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}
.search:before{content:"🔍";position:absolute;left:9px;top:6px;font-size:13px}
.gbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 11px}
.gbtn.on{background:var(--ink);color:var(--bg)}
.gbtn .n{background:var(--warn);color:#fff;border-radius:9px;padding:0 7px;font-size:12px;margin-left:4px}
#menu{display:none}
#savebar{display:none;background:var(--drf);border-top:1px solid var(--line);padding:7px 14px;align-items:center;gap:10px}
#savebar.show{display:flex}#savebar b{color:var(--ink);font-size:16px}#savebar .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 14px}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}.btn.bad{background:var(--red);border-color:var(--red);color:#fff}
.layout{display:flex;align-items:flex-start;max-width:1320px;margin:0 auto}
nav{width:290px;flex:none;position:sticky;top:96px;max-height:calc(100vh - 100px);overflow:auto;padding:12px 10px 40px 14px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;border:0;background:var(--card);padding:6px 0;border-right:1px solid var(--line)}.seg button:last-child{border:0}.seg button.on{background:var(--ink);color:var(--bg)}
.cat{margin:6px 0}.cat>.ch{width:100%;text-align:left;border:0;background:none;font-weight:700;padding:6px 6px;display:flex;justify-content:space-between;color:var(--mute);font-size:13px}
.gi{display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:7px;line-height:1.35}
.gi:hover{background:var(--soft)}.gi.on{background:var(--bluebg);color:var(--blue);font-weight:600}
.gi .bd{display:flex;gap:4px;flex:none}
.dot{font-size:11.5px;border-radius:9px;padding:0 6px;color:var(--warn);background:var(--warnbg);white-space:nowrap}.hi{font-size:11px;color:var(--red)}
main{flex:1;min-width:0;padding:14px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;display:block}
.stat .big{font-size:30px;font-weight:700;line-height:1.1}.stat .lb{color:var(--mute)}
h2{font-size:18px;margin:0 0 2px}.sub{color:var(--mute);margin:0 0 10px}
.tag{display:inline-block;font-size:11.5px;border-radius:5px;padding:0 6px;margin-left:5px;border:1px solid var(--line);vertical-align:1px;white-space:nowrap}
.t-heavy{background:var(--redbg);color:var(--red);border-color:transparent}.t-oth{background:var(--bluebg);color:var(--blue);border-color:transparent}.t-adv{background:var(--soft);color:var(--mute)}.t-priv{background:var(--viobg);color:var(--vio);border-color:transparent}.t-drf{background:var(--drf);color:var(--warn);border-color:transparent}
.src{font-size:12px;border-radius:5px;padding:0 7px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}.src.co{background:var(--okbg);color:var(--ok);border-color:transparent}.src.pe{background:var(--warnbg);color:var(--warn);border-color:transparent}
table{border-collapse:collapse;width:100%}th{background:var(--soft);font-size:12.5px;color:var(--mute);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.diff td:first-child{box-shadow:inset 3px 0 0 var(--warn)}tr.drf{background:var(--drf)}tr.flash{animation:fl 1.6s}
@keyframes fl{0%,60%{background:var(--warnbg)}100%{background:transparent}}
td.nm b{font-weight:650}td.nm .one{color:var(--mute);font-size:13px}
td.ck{width:30px}input[type=checkbox]:disabled{opacity:.35}
.q{border:1px solid var(--line);border-radius:50%;width:22px;height:22px;background:var(--card);color:var(--blue);font-weight:700;line-height:18px;padding:0}
.ctl input[type=number],.ctl input[type=text],.ctl select{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--card);max-width:100%}
.ctl input[type=number]{width:110px}.ctl input[type=text]{width:100%;min-width:180px}
.sw{width:42px;height:24px;border-radius:12px;border:1px solid var(--line);background:var(--soft);position:relative;padding:0}.sw:after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--mute);transition:.15s}.sw.on{background:var(--ok);border-color:var(--ok)}.sw.on:after{left:20px;background:#fff}
.dflt{font-size:12.5px;color:var(--warn);margin-top:3px}.dflt button{border:0;background:none;color:var(--blue);text-decoration:underline;padding:0 4px;font-size:12.5px}
.xp td{background:var(--soft);padding:10px 14px}.xp dl{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;margin:0}.xp dt{color:var(--mute)}.xp dd{margin:0}
#batch{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 12px;display:none;gap:8px;align-items:center;z-index:25;box-shadow:0 6px 24px #0005;max-width:94vw;flex-wrap:wrap}
#batch.show{display:flex}#batch button{border:0;border-radius:7px;padding:5px 11px;background:var(--card);color:var(--ink)}#batch button[disabled]{opacity:.5}
.mask{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:50;padding:12px}.mask.show{display:flex}
.dlg{background:var(--card);border-radius:14px;max-width:660px;width:100%;max-height:92vh;overflow:auto;padding:18px 20px}
.dlg h3{margin:0 0 8px;font-size:17px}.dlg .lst{border:1px solid var(--line);border-radius:8px;max-height:230px;overflow:auto;font-size:13.5px}.dlg .lst div{padding:5px 10px;border-bottom:1px solid var(--line)}.dlg .lst div:last-child{border:0}
.warnbox{background:var(--warnbg);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13.5px}.redbox{background:var(--redbg);color:var(--red);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13.5px}.nbox{background:var(--bluebg);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13.5px}
.dlg textarea,.dlg input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card)}
#toast{position:fixed;right:16px;top:100px;z-index:60;display:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;max-width:420px}#toast.show{display:block}#toast button{border:0;background:none;color:#8ec5ff;text-decoration:underline;margin-left:6px}
.demo{font-size:12px;color:var(--mute);padding:6px 14px;border-bottom:1px dashed var(--line);background:var(--soft)}
.res{padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}.res:hover{background:var(--soft)}.res .path{font-size:12.5px;color:var(--mute)}
.grpbanner{background:var(--redbg);color:var(--red);border-radius:8px;padding:6px 10px;margin:6px 0;font-size:13.5px}
@media (max-width:900px){
 #menu{display:inline-block}nav{position:fixed;left:0;top:0;bottom:0;z-index:55;background:var(--card);width:86vw;max-width:340px;max-height:none;transform:translateX(-102%);transition:.2s;box-shadow:4px 0 20px #0005;padding-top:20px}nav.open{transform:none}
 main{padding:10px 12px 100px}.layout{display:block}
 table,tbody,tr,td{display:block}thead{display:none}
 tr{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:6px 8px;background:var(--card);position:relative}
 td{border:0;padding:4px 2px}td.ck{position:absolute;right:6px;top:6px;width:auto}td.q2{position:absolute;right:38px;top:6px}
 .xp td{padding:6px}.xp dl{grid-template-columns:1fr}.btn,.gi,.gbtn{min-height:40px}
 .top .row1{gap:6px}.top h1{display:none}
}
</style>
</head>
<body>
<div class="top">
 <div class="row1">
  <button id="menu" class="gbtn" onclick="document.getElementById('nav').classList.toggle('open')">☰ 選單</button>
  <h1>設定中心</h1>
  <div class="search"><input id="q" type="search" placeholder="搜尋設定：名稱、說明、選項…" oninput="onSearch(this.value)"></div>
  <button class="gbtn" id="gPend" onclick="go('pending')">待生效 <span class="n" id="nPend">0</span></button>
  <button class="gbtn" id="gRecent" onclick="go('recent')">最近變更</button>
  <button class="gbtn" id="gHome" onclick="go('home')">總覽</button>
 </div>
 <div id="savebar"><span>✎ 你有 <b id="nDraft">0</b> 項未儲存的修改</span><span class="sp"></span><button class="btn" onclick="discardAll()">放棄</button><button class="btn pri" onclick="openSave()">儲存</button></div>
</div>
<div class="demo">本頁為 mockup：假資料（目前值、誰何時改、待生效）＋真實群組與欄位（取自 <code>settings_registry</code>）。<label><input type="checkbox" id="simConf"> 模擬「別人也改了」（再按「復原這一批」看衝突拒絕）</label>　<label><input type="checkbox" id="solo" onchange="SOLO=this.checked"> 模擬「只有一位最高管理者」（放寬類改成不需第二人核准；文字由伺服器 plan().kind／otherSuperadmins 決定，不寫死）</label></div>
<div class="layout">
 <nav id="nav"></nav>
 <main id="main"></main>
</div>
<div id="batch"></div>
<div id="toast"></div>
<div class="mask" id="mask"><div class="dlg" id="dlg"></div></div>

  var h='<h2>待生效（'+PEND.length+'）</h2><p class="sub">高風險項目送出後會先停在這裡，等確認期結束或第二位最高管理者核准才生效。</p><div class="card">';
  if(!PEND.length)return h+'目前沒有等待生效的項目。</div>';
  h+='<table><thead><tr><th>項目</th><th>目前 → 之後</th><th>誰申請</th><th>預計生效</th><th>誰要核准</th><th></th></tr></thead><tbody>'+PEND.map(function(p,i){var g=gby(p.g),f=fby(g,p.f);
    return '<tr><td><b>'+esc(f.label)+'</b><div class="code">'+esc(p.g+'.'+p.f)+'</div></td><td>'+esc(fmt(f,p.from))+' → <b>'+esc(fmt(f,p.to))+'</b></td><td>'+esc(p.by)+'<div class="code">'+p.when+'</div></td><td>'+p.eff+'</td><td>'+esc(p.who)+'</td><td><button class="btn" onclick="cancelPend('+i+')">撤銷申請</button></td></tr>'}).join('')+'</tbody></table></div>';return h}
function cancelPend(i){PEND.splice(i,1);render()}
function recentHtml(){
  var h='<h2>最近變更</h2><p class="sub">資料來自變更紀錄；「影響大」的變更都有原因與核准人。</p><div class="card"><table><thead><tr><th>時間</th><th>誰</th><th>項目</th><th>舊 → 新</th><th>原因</th><th></th></tr></thead><tbody>'+RECENT.map(function(r){var g=gby(r[2]),f=g.fields[r[3]];
   return '<tr><td>'+r[0]+'</td><td>'+esc(r[1])+'</td><td><b>'+esc(f.label)+'</b><div class="code">'+esc(g.k+'.'+f.k)+'</div></td><td>'+esc(r[6]!=null?r[6]:fmt(f,f.def)+' → '+fmt(f,CUR[fid(g,f)]))+'</td><td>'+esc(r[5])+'</td><td><button class="btn" onclick="jump(\''+g.k+'\',\''+f.k+'\')">查看該項</button></td></tr>'}).join('')+'</tbody></table></div>';return h}
/* ───── 群組頁 ───── */
function tagsOf(f){var t='';if(heavy(f))t+='<span class="tag t-heavy">影響大</span>';if(f.roles)t+='<span class="tag t-oth">影響別人</span>';if(f.adv)t+='<span class="tag t-adv">進階</span>';if(f.priv)t+='<span class="tag t-priv">影響隱私</span>';return t}
function ctl(g,f){var id=fid(g,f),v=valOf(g,f),a='data-i="'+id+'"';
  if(f.ch&&f.ch.length)return '<select '+a+' onchange="setV(this)">'+f.ch.map(function(c){return '<option value="'+esc(c[0])+'"'+(c[0]===v?' selected':'')+'>'+esc(c[1])+'</option>'}).join('')+'</select>';
  if(f.type==='bool')return '<button class="sw'+(v?' on':'')+'" role="switch" aria-checked="'+!!v+'" '+a+' onclick="togV(this)"></button>';
  if(f.type==='int'||f.type==='float')return '<input type="number" '+a+' value="'+esc(v)+'" onchange="setV(this)"'+(f.min!=null?' min="'+f.min+'"':'')+(f.max!=null?' max="'+f.max+'"':'')+'> '+esc(f.unit||'');
  return '<input type="text" '+a+' value="'+esc(v)+'" onchange="setV(this)">'+(f.text?'<div class="code">逐列編輯：即時預覽（實作時顯示實際檔名／畫面）</div>':'')}
function sourceOf(g,f){var p=pendOf(g,f);if(p)return '<span class="src pe">等待生效</span><div class="code">'+p.eff+' 生效</div>';return isDiff(g,f)?'<span class="src co">公司</span><div class="code">王經理 11/12</div>':'<span class="src">預設</span>'}
function groupHtml(pg){
  var multi=pg.groups.length>1,hiF=[];pg.groups.forEach(function(g){g.fields.filter(heavy).forEach(function(f){hiF.push(f.label)})});
  var h='<h2>'+esc(pg.plain)+'</h2><p class="sub">'+esc(pg.groups[0].help)+(multi?'（本頁合併 '+pg.groups.length+' 個登錄群組，逐組分段）':'')+'<br><span class="code">'+esc(pg.groups.map(function(g){return g.k}).join('、'))+(multi?'':'（原名：'+esc(pg.groups[0].cur)+'）')+'</span>'+(pg.groups.some(function(g){return g.priv})?'<br><span class="tag t-priv">影響隱私</span> 這頁的設定會影響個人資料或客戶名稱是否外露':'')+'</p>';
  if(hiF.length)h+='<div class="grpbanner">🔴 內含高風險項目：'+hiF.map(esc).join('、')+'（只能逐項改，要填原因；部分要等待期，放寬類另要第二位最高管理者核准）</div>';
  var el=0,tot=0;pg.groups.forEach(function(g){tot+=g.fields.length;el+=g.fields.filter(function(f){return f.batch}).length});
  h+='<div class="card" style="padding:6px 8px"><table><thead><tr><th class="ck"><input type="checkbox" title="全選可批次的項目" onchange="selAll(\''+pg.k+'\',this.checked)"></th><th>名稱</th><th>目前值</th><th>狀態</th><th></th></tr></thead><tbody>';
  pg.groups.forEach(function(g){
   if(multi)h+='<tr><td colspan="5" style="background:var(--soft);font-weight:700">'+esc(g.plain)+' <span class="code">'+esc(g.k)+'</span></td></tr>';
   g.fields.forEach(function(f){var id=fid(g,f),rid='r-'+id.replace(/\./g,'-'),dr=id in DRAFT,df=isDiff(g,f);
    h+='<tr id="'+rid+'" class="'+(df?'diff ':'')+(dr?'drf':'')+'"><td class="ck"><input type="checkbox" '+(f.batch?'':'disabled title="'+esc(f.batchWhy)+'" ')+(SEL[id]?'checked ':'')+'onchange="selOne(\''+id+'\',this.checked)"></td>'
     +'<td class="nm"><b>'+esc(f.label)+'</b>'+tagsOf(f)+(dr?'<span class="tag t-drf">未儲存</span>':'')+'<div class="code">'+esc(id)+'</div><div class="one">'+esc(f.q)+'</div></td>'
     +'<td class="ctl">'+ctl(g,f)+(df&&!dr?'<div class="dflt">預設：'+esc(fmt(f,f.def))+(heavy(f)?'':'<button onclick="resetOne(\''+id+'\')">還原預設</button>')+'</div>':'')+(dr?'<div class="dflt">原本：'+esc(fmt(f,CUR[id]))+'<button onclick="undoDraft(\''+id+'\')">放棄這項</button></div>':'')+'</td>'
     +'<td>'+sourceOf(g,f)+'</td><td class="q2"><button class="q" title="說明" aria-label="說明" onclick="togX(\''+id+'\')">?</button></td></tr>';
    if(OPEN[id])h+='<tr class="xp"><td colspan="5"><dl><dt>這是什麼</dt><dd>'+esc(f.q)+' '+esc(f.help)+'</dd><dt>什麼時候要改</dt><dd class="code" style="font-family:inherit">（實作時由 SettingDef.when 提供；尚未填寫就不顯示）</dd><dt>改了會影響什麼</dt><dd>'+esc(f.impact)+(f.rt?'<br><span style="color:var(--red)">'+esc(f.rt)+'</span>':'')+'</dd><dt>建議值</dt><dd>'+(f.rec==null?'—':esc(fmt(f,f.rec)))+'；預設 '+esc(fmt(f,f.def))+'</dd></dl></td></tr>'})});
  h+='</tbody></table></div><p class="sub" style="font-size:12.5px">灰色核取方塊＝不能批次（滑過看原因：影響大／文字欄位／敏感群組／單項表單／只透過預設組合）；本頁 '+el+' / '+tot+' 項提供勾選格。</p>';return h}
function togX(id){OPEN[id]=!OPEN[id];render()}
/* ───── 草稿 ───── */
function parse(f,el){if(f.ch&&f.ch.length){var c=f.ch.filter(function(x){return String(x[0])===el.value})[0];return c?c[0]:el.value}if(f.type==='int')return parseInt(el.value,10);if(f.type==='float')return parseFloat(el.value);return el.value}
function locate(id){var gk=id.split('.')[0],g=gby(gk);return [g,fby(g,id.slice(gk.length+1))]}
function setV(el){var id=el.dataset.i,x=locate(id),v=parse(x[1],el);putDraft(id,v);render()}
function togV(el){var id=el.dataset.i,x=locate(id);putDraft(id,!valOf(x[0],x[1]));render()}
function putDraft(id,v){if(v===CUR[id]||(typeof v==='number'&&isNaN(v)))delete DRAFT[id];else DRAFT[id]=v}
function undoDraft(id){delete DRAFT[id];render()}
function resetOne(id){var x=locate(id);putDraft(id,x[1].def);render()}
function discardAll(){DRAFT={};render()}
function renderSave(){var n=nDraft();document.getElementById('nDraft').textContent=n;document.getElementById('savebar').className=n?'show':''}
window.addEventListener('beforeunload',function(e){if(nDraft()){e.preventDefault();e.returnValue=''}});
/* ───── 批次 ───── */
function selOne(id,on){if(on)SEL[id]=1;else delete SEL[id];renderBatch()}
function selAll(pk,on){pby(pk).groups.forEach(function(g){g.fields.forEach(function(f){if(f.batch){if(on)SEL[fid(g,f)]=1;else delete SEL[fid(g,f)]}})});render()}
function renderBatch(){var ids=Object.keys(SEL),b=document.getElementById('batch');if(!ids.length){b.className='';return}
  b.className='show';b.innerHTML='<span>已選 '+ids.length+' 項</span><button onclick="batchAct(\'rec\')">套用建議值</button><button onclick="batchAct(\'def\')">重設為預設</button><button disabled title="預設組合內容待團隊提案、使用者看過才上線">套用預設組合（之後提供）</button><button onclick="SEL={};render()">取消選取</button>'}
function batchAct(kind){var n=0,same=0;Object.keys(SEL).forEach(function(id){var x=locate(id),f=x[1],to=kind==='rec'?f.rec:f.def;if(to==null||to===undefined){same++;return}if(to===valOf(x[0],f)){same++;return}putDraft(id,to);n++});SEL={};render();
  showToast('已加入草稿 '+n+' 項'+(same?'（'+same+' 項本來就是這個值或沒有建議值，不動）':'')+'。要按上方「儲存」才會生效。')}
/* ───── 儲存 ───── */
var MOCKV=0;
function openSave(){var ids=Object.keys(DRAFT);if(!ids.length)return;var hv=0,rows=ids.map(function(id){var x=locate(id),f=x[1],h=heavy(f);if(h)hv++;return '<div><b>'+esc(f.label)+'</b>'+(h?'<span class="tag t-heavy">影響大</span>':'')+'<br><span class="code" style="font-family:inherit">'+esc(fmt(f,CUR[id]))+' → <b style="color:var(--ink)">'+esc(fmt(f,DRAFT[id]))+'</b></span>'+(h&&f.loose&&!SOLO?'<br><span style="color:var(--red);font-size:12.5px">放寬：不會馬上生效——要等確認期，<b>且要第二位最高管理者核准</b>，預計 7 天後生效</span>':h&&f.loose?'<br><span style="color:var(--red);font-size:12.5px">放寬：目前只有一位最高管理者，沒有第二人可以核准——改為填原因、等確認期後生效，並留下紀錄</span>':h&&f.pend?'<br><span style="color:var(--warn);font-size:12.5px">要等確認期：不需要別人核准，滿 7 天後<b>自動生效</b>，期間可撤銷</span>':'')+'</div>'}).join('');
  var note=hv?'<div class="warnbox">含 '+hv+' 項「影響大」：要填變更原因（至少 4 個字）、寫進變更紀錄，且<b>沒有「復原這一批」</b>。</div>':'<div class="nbox">這一批只有一般項目，儲存後可「復原這一批」（只要這些設定沒被別人改過）。</div>';
  var ppl='最高管理者（王經理）、受影響的角色（業務、簽核人）'+(hv?'；<b>另以 LINE 通知最高管理者</b>（高風險）':'');
  document.getElementById('dlg').innerHTML='<h3>確認儲存 '+ids.length+' 項修改</h3><div class="lst">'+rows+'</div>'+note+'<div class="nbox">📣 儲存後會通知：'+ppl+'。通知內容：誰、改了什麼、舊 → 新、原因（一批合併成一則）。</div><p style="margin:8px 0 4px">變更原因'+(hv?'（必填，至少 4 個字）':'（選填，預設「批次調整（'+ids.length+' 項）」）')+'</p><input type="text" id="why" placeholder="為什麼要改？" oninput="chkWhy('+hv+')"><div style="text-align:right;margin-top:12px"><button class="btn" onclick="closeD()">再看看</button> <button class="btn pri" id="okSave" '+(hv?'disabled':'')+' onclick="doSave()">確認儲存</button></div>';
  document.getElementById('mask').className='mask show'}
function chkWhy(hv){document.getElementById('okSave').disabled=hv&&document.getElementById('why').value.trim().length<4}
function closeD(){document.getElementById('mask').className='mask'}
function doSave(){var ids=Object.keys(DRAFT),applied=[],pend=0,why=document.getElementById('why').value.trim();closeD();
  ids.forEach(function(id){var x=locate(id),g=x[0],f=x[1],h=heavy(f);
    if(h&&(f.loose||f.pend)){PEND.push({g:g.k,f:f.k,from:CUR[id],to:DRAFT[id],by:'你（王經理）',when:'2026-11-13',eff:'2026-11-20',who:f.loose&&!SOLO?'王總（第二位最高管理者）':'不需核准（確認期滿自動生效）'});pend++}
    else{applied.push({id:id,from:CUR[id],to:DRAFT[id],heavy:h});RECENT.unshift(['11/13 '+new Date().toTimeString().slice(0,5),'你（王經理）',g.k,g.fields.indexOf(f),'調整',why||'批次調整（'+ids.length+' 項）',fmt(f,CUR[id])+' → '+fmt(f,DRAFT[id])]);CUR[id]=DRAFT[id]}});
  DRAFT={};LAST=applied.filter(function(a){return !a.heavy});render();
  var m=[];if(applied.length)m.push('已生效 '+applied.length+' 項');if(pend)m.push('等待核准 '+pend+' 項（預計 11/20 生效）');
  showToast(m.join('；')+'。已通知最高管理者與受影響角色。'+(LAST.length?'<button onclick="undoBatch()">復原這一批</button>':''),true)}
function undoBatch(){if(!LAST||!LAST.length)return;var bad=[];if(document.getElementById('simConf').checked){bad.push(LAST[0])}
  if(bad.length){var x=locate(bad[0].id);showToast('無法復原這一批：「'+esc(x[1].label)+'」在你套用之後被 林會計 於 11/13 15:42 改過，為了不蓋掉別人的修改，系統拒絕整批復原。請到「最近變更」查看。',true);LAST=null;return}
  LAST.forEach(function(a){CUR[a.id]=a.from});showToast('已復原這一批（'+LAST.length+' 項）。');LAST=null;render()}
var tm;function showToast(h,long){var t=document.getElementById('toast');t.innerHTML=h;t.className='show';clearTimeout(tm);tm=setTimeout(function(){t.className=''},long?9000:5000)}
/* ───── 搜尋 ───── */
function onSearch(q){q=q.trim().toLowerCase();var m=document.getElementById('main');
  if(!q){go(VIEW==='search'?'home':VIEW);return}
  var hits=[];D.groups.forEach(function(g){g.fields.forEach(function(f){var hay=(f.label+' '+f.k+' '+g.k+' '+f.q+' '+f.help+' '+g.plain+' '+g.cur+' '+(f.ch||[]).map(function(c){return c[1]}).join(' ')).toLowerCase();if(hay.indexOf(q)>=0)hits.push([g,f])})});
  var h='<h2>搜尋「'+esc(q)+'」：'+hits.length+' 項</h2><p class="sub">搜的是欄位（名稱、代碼、說明、選項），不只群組名。點一項跳到該群組。</p><div class="card">'+(hits.slice(0,60).map(function(x){return '<div class="res" onclick="jump(\''+x[0].k+'\',\''+x[1].k+'\')"><b>'+esc(x[1].label)+'</b>'+tagsOf(x[1])+'<div class="path">'+esc(x[0].cat)+' › '+esc(x[0].plain)+' ｜ <span class="code">'+esc(fid(x[0],x[1]))+'</span></div><div class="one" style="color:var(--mute);font-size:13px">'+esc(x[1].q)+'</div></div>'}).join('')||'沒有符合的設定')+'</div>';
  VIEW='search';m.dataset.sr=h;render()}
/* ───── demo（網址 # 供截圖） ───── */
function demo(h){h=h.replace(/^#/,'');if(!h)return;var p=h.split(':');
  if(p[0]==='g'){go('g:'+pageOf(p[1]))}
  else if(p[0]==='x'){go('g:'+pageOf(p[1]));OPEN[p[1]+'.'+p[2]]=1;render()}
  else if(p[0]==='home'){go('home')}
  else if(p[0]==='pending'||p[0]==='recent'){go(p[0])}
  else if(p[0]==='search'){document.getElementById('q').value=decodeURIComponent(p[1]);onSearch(decodeURIComponent(p[1]))}
  else if(p[0]==='diff'){goDiff()}
  else if(p[0]==='draft'||p[0]==='save'||p[0]==='saveheavy'||p[0]==='done'){
    go('g:profit_warning');var g=gby('profit_warning');var f=g.fields.filter(function(x){return !x.text&&x.batch})[0],f2=g.fields.filter(function(x){return !x.text&&x.batch})[1];
    [f,f2].forEach(function(ff){if(!ff)return;var v=ff.ch&&ff.ch.length?ff.ch.filter(function(c){return c[0]!==CUR[fid(g,ff)]})[0][0]:(ff.type==='bool'?!CUR[fid(g,ff)]:CUR[fid(g,ff)]+1);putDraft(fid(g,ff),v)});
    if(p[0]==='saveheavy'){var q=gby('quote_approval'),qf=fby(q,'min_item_margin_pct');go('g:quote_approval');putDraft('quote_approval.min_item_margin_pct',20)}
    render();if(p[0]==='save'||p[0]==='saveheavy'){openSave()}
    if(p[0]==='done'){openSave();document.getElementById('why').value='配合新案件附件量';doSave()}}
  else if(p[0]==='solo'){document.getElementById('solo').checked=true;SOLO=true;demo('#saveheavy')}
  else if(p[0]==='builders'){go('g:builder_all')}
  else if(p[0]==='batch'){go('g:profit_warning');var g2=gby('profit_warning');g2.fields.forEach(function(f){if(f.batch)SEL[fid(g2,f)]=1});render()}
}
(function(){document.getElementById('q').value='';render();if(location.hash)demo(location.hash)})();
</script>
