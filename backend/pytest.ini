[pytest]
pythonpath = .
testpaths  = tests modules
markers =
    gate_only: slow drill that runs only inside the formal gate (heavy_run --class official / run-stage set MOTRIX_GATE_OFFICIAL=1); skipped everywhere else - preflight, pre-runs and direct pytest. See tests/platform/test_gate_only_wiring_2026_11_13.py
    e2e: real-browser end-to-end test via Playwright (needs `playwright install chromium`); auto-skips when playwright isn't installed
    e2e_limit(seconds): per-test e2e soft deadline override (default MOTRIX_E2E_TEST_LIMIT, else hard cap - 30s); on expiry the test's contexts are closed so the blocked call fails
    e2e_teardown_limit(seconds): per-test override of MOTRIX_E2E_TEARDOWN_LIMIT (closing contexts); on expiry the browser is force-closed and the test errors
    company_gate: uses the real company-setup gate decision (helpers.company_setup.status); without it conftest treats the install as configured
    route_off: the attachments open route is OFF by default in train 26 (routers.attachments.ATTACHMENTS_OPEN_ENABLED); without this marker the attachments tests switch it on
    upload_magic: uses the real upload file-header check (helpers.uploads._magic_matches); without it conftest treats every upload as matching
    no_dispatch_shim: opt out of the conftest legacy-dispatch shim (31-A): tests that exercise the real status gate must not get legacy-shaped rows
    custom_switch_default: keep the production default of builder_custom_modules.enabled (0 = off) for this test; every other test runs with it ON (conftest _custom_module_engine_on_for_tests), so the ~80 existing custom-module tests need no per-test setup
    real_pbkdf2: keep the production PBKDF2 iteration count (260,000) for this test; every other test runs with the test-only 1,000 shim (conftest _fast_pbkdf2)
    line_quota_real_timer: exercises the real helpers.line_quota.after_push (debounce / timer scheduling); every other test gets a no-op so a pending Timer cannot leak into a later test (conftest _line_quota_no_timers_for_tests)
    timing: asserts a wall-clock threshold (load-sensitive); marked so the gate can run these in a quiet serial pass (tools/platform/timing_pass.py)
    real_fingerprint: use the real helpers.licensing.machine_fingerprint (reads hardware; runs PowerShell on Windows); every other test sees the fixed test fingerprint (conftest license_test_key)
    real_fonts: e2e that needs the real /fonts/ files (layout / zoom measurements); otherwise conftest serves a tiny stub font (O5-S1)
