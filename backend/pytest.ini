[pytest]
pythonpath = .
testpaths  = tests modules
markers =
    e2e: real-browser end-to-end test via Playwright (needs `playwright install chromium`); auto-skips when playwright isn't installed
    e2e_limit(seconds): per-test e2e soft deadline override (default MOTRIX_E2E_TEST_LIMIT, else hard cap - 30s); on expiry the test's contexts are closed so the blocked call fails
    e2e_teardown_limit(seconds): per-test override of MOTRIX_E2E_TEARDOWN_LIMIT (closing contexts); on expiry the browser is force-closed and the test errors
    real_fonts: e2e that needs the real /fonts/ files (layout / zoom measurements); otherwise conftest serves a tiny stub font (O5-S1)
